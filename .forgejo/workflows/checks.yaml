name: checks

# The repo's first PR-triggered CI. Until now nothing ran on a pull request at all:
# manifests were reviewed by eye and `kubectl kustomize` was a thing you remembered to
# do. That is fine for a typo and useless for an invariant that spans two files, which
# is how a machine retired from the gatus config stayed on the exporter's roster.
#
# Deliberately cheap and deliberately narrow. This is not a "lint everything" job - it
# asserts facts that cannot be seen by reading one file, so adding a check here should
# mean "two things must agree", not "this file should be pretty".

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  fleet-roster:
    runs-on: docker
    container:
      # Alpine + explicit git/nodejs is this repo's convention for a checkout-capable
      # container; actions/checkout needs both.
      image: alpine:3.22
    steps:
      - name: Install checkout deps
        run: apk add --no-cache git nodejs age python3 py3-yaml  # age: eeg-review's decrypt test

      - name: Checkout
        uses: actions/checkout@v4

      # Roster and placement checks compare inventory with app declarations.
      - name: apps/gatus-fleet/config.yaml and apps/fleet-exporter/roster.json are what the ansible inventory renders
        run: python3 scripts/render-fleet-pulse.py --check
      - name: Negative control - the fleet-pulse check fails on a machine added to the inventory without a re-render
        run: |
          python3 -c 's = open("ansible/inventory.yml").read(); t = s.replace("        audio-bedroom:\n          fleet_pulse_group: audio", "        planted-node:\n          ansible_host: 192.0.2.1\n        audio-bedroom:\n          fleet_pulse_group: audio", 1); assert t != s, "the plant did not apply"; open("planted-fleet.yml", "w").write(t)'
          rc=0; python3 scripts/render-fleet-pulse.py --check --inventory planted-fleet.yml > planted-fleet.out 2>&1 || rc=$?
          rm planted-fleet.yml; cat planted-fleet.out
          [ "$rc" -ne 0 ] || { echo "the check passed a stale config.yaml"; exit 1; }
          grep -q "is not what" planted-fleet.out || { echo "the check failed, but not on the stale files"; exit 1; }
          rm planted-fleet.out
      - name: Fleet-pulse renderer tests, roster, display tokens and refused names
        run: cd scripts && python3 -m unittest test_render_fleet_pulse
      - name: apps/ci-topology/topology.json is what the ansible inventory renders
        run: python3 scripts/render-ci-topology.py --check
      - name: Negative control - the topology check fails on a slot count edited without a re-render
        run: |
          python3 -c 's = open("ansible/inventory.yml").read(); t = s.replace("unity_ci_slots: 3", "unity_ci_slots: 2", 1); assert t != s, "the plant did not apply"; open("planted-count.yml", "w").write(t)'
          rc=0; python3 scripts/render-ci-topology.py --check --inventory planted-count.yml > planted-count.out 2>&1 || rc=$?
          rm planted-count.yml; cat planted-count.out
          [ "$rc" -ne 0 ] || { echo "the check passed a stale topology.json"; exit 1; }
          grep -q "is not what" planted-count.out || { echo "the check failed, but not on the stale file"; exit 1; }
          rm planted-count.out
      - name: Topology renderer tests, tier exclusions and slot caps
        run: cd scripts && python3 -m unittest test_render_ci_topology
      - name: Freqtrade roster has no bot that repeats another's exchange, strategy and overlay
        run: python3 scripts/check-freqtrade-roster.py
      - name: Negative control - the freqtrade roster check fails on a planted duplicate row
        run: |
          cp apps/freqtrade/roster.tsv planted-roster.tsv
          echo "planted-dup binanceus BinHV27 aggressive base" >> planted-roster.tsv
          rc=0; python3 scripts/check-freqtrade-roster.py planted-roster.tsv > planted-roster.out 2>&1 || rc=$?
          rm planted-roster.tsv; cat planted-roster.out
          [ "$rc" -ne 0 ] || { echo "the check passed a planted duplicate"; exit 1; }
          grep -q "planted-dup runs" planted-roster.out || { echo "the check failed, but not on the planted row"; exit 1; }
          rm planted-roster.out
      - name: Placement report, including core hosts with no fresh core qualification (migration is P5)
        run: python3 scripts/check-placement.py --report
      - name: Placement checker tests and planted violation
        run: python3 scripts/test_check_placement.py
      - name: Every x86 Linux host is thermal-capped or exempt, and each capped host is convergence-checked
        run: python3 scripts/check-thermal-standard.py
      - name: Negative control - the thermal check fails on the workstation dropped from thermal_capped
        run: |
          python3 -c 's = open("ansible/inventory.yml").read(); t = s.replace("        watchdog_x86:\n        desktop_workstations:\n      vars:", "        watchdog_x86:\n      vars:", 1); assert t != s, "the plant did not apply: thermal_capped children moved"; open("planted-thermal.yml", "w").write(t)'
          rc=0; python3 scripts/check-thermal-standard.py --inventory planted-thermal.yml > planted-thermal.out 2>&1 || rc=$?
          rm planted-thermal.yml; cat planted-thermal.out
          [ "$rc" -eq 1 ] || { echo "the check passed an uncapped host"; exit 1; }
          grep -q "cachyos-x8664-main is an x86 Linux host in no thermal_capped group" planted-thermal.out || { echo "the check failed, but not on the planted host"; exit 1; }
          rm planted-thermal.out
      - name: Negative control - the thermal check fails on a misspelled cap knob, which Ansible would ignore, and on a ceiling in MHz
        run: |
          python3 -c 's = open("ansible/inventory.yml").read(); t = s.replace("          thermal_cap_max_freq_khz:", "          thermal_cap_max_freq:", 1); assert t != s, "the plant did not apply: asus-laptop has no thermal_cap_max_freq_khz"; open("planted-knob.yml", "w").write(t)'
          rc=0; python3 scripts/check-thermal-standard.py --inventory planted-knob.yml > planted-knob.out 2>&1 || rc=$?
          rm planted-knob.yml; cat planted-knob.out
          [ "$rc" -eq 1 ] || { echo "the check passed a misspelled knob"; exit 1; }
          grep -q "sets thermal_cap_max_freq, which roles/thermal-cap does not read" planted-knob.out || { echo "the check failed, but not on the planted knob"; exit 1; }
          python3 -c 'import re; s = open("ansible/inventory.yml").read(); t = re.sub(r"(          thermal_cap_max_freq_khz:) \d+", r"\1 2200", s, count=1); assert t != s, "the plant did not apply"; open("planted-knob.yml", "w").write(t)'
          rc=0; python3 scripts/check-thermal-standard.py --inventory planted-knob.yml > planted-knob.out 2>&1 || rc=$?
          rm planted-knob.yml; cat planted-knob.out
          [ "$rc" -eq 1 ] || { echo "the check passed a ceiling in MHz"; exit 1; }
          grep -q "sets thermal_cap_max_freq_khz: 2200; it is a clock in kHz" planted-knob.out || { echo "the check failed, but not on the planted unit slip"; exit 1; }
          rm planted-knob.out
      - name: Host qualification verdict and parser tests
        run: python3 scripts/test_host_qualify.py
      - name: ci-slot-effect classification and host reading tests
        run: python3 scripts/test_ci_slot_effect.py
      - name: cluster-janitor quarantine trigger and cap tests
        run: python3 apps/cluster-janitor/test_quarantine.py
      # An if, not "! cmd": sh -e ignores a "!" pipeline's status, so a "!" step passes either way.
      - name: Negative control - the topology check fails on aws-build-1 slot groups swapped off their build slots' cores
        run: |
          sed 's/unity_ci_slot_groups: {1: \[4, 5\], 2: \[6, 7\]/unity_ci_slot_groups: {1: [4, 6], 2: [5, 7]/' ansible/inventory.yml > planted-groups.yml
          rc=0; python3 scripts/render-ci-topology.py --check --inventory planted-groups.yml > planted-groups.out 2>&1 || rc=$?
          rm planted-groups.yml; cat planted-groups.out
          [ "$rc" -ne 0 ] || { echo "the check passed a planted bad group"; exit 1; }
          grep -q "cores are not inside build slot" planted-groups.out || { echo "the check failed, but not on the planted group"; exit 1; }
          rm planted-groups.out
      - name: Negative control - the topology check fails on a service host planted in ci_hosts
        run: |
          python3 -c 's = open("ansible/inventory.yml").read(); open("planted-inv.yml", "w").write(s.replace("    ci_hosts:\n      hosts:\n", "    ci_hosts:\n      hosts:\n        hp-victus:\n", 1))'
          rc=0; python3 scripts/render-ci-topology.py --check --inventory planted-inv.yml > planted-inv.out 2>&1 || rc=$?
          rm planted-inv.yml; cat planted-inv.out
          [ "$rc" -ne 0 ] || { echo "the check passed a service host in ci_hosts"; exit 1; }
          grep -q "hp-victus is in no_ci_hosts and in ci_hosts" planted-inv.out || { echo "the check failed, but not on the planted host"; exit 1; }
          rm planted-inv.out
      - name: github-runner-exporter offline tests
        run: python3 apps/github-runner-exporter/test_exporter.py
      - name: forgejo-mirror-exporter offline tests
        run: python3 ansible/roles/forgejo-host/files/mirror-exporter/test_exporter.py
      - name: ci-runner-governor offline tests
        run: python3 apps/ci-runner-governor/test_governor.py
      - name: ci-runner-governor replay offline test
        run: python3 apps/ci-runner-governor/test_replay.py
      - name: github-actions-runner-linux label plan tests
        run: python3 ansible/roles/github-actions-runner-linux/tests/test_runner_labels.py
      - name: ci-host GitHub host-key read tests
        run: python3 ansible/roles/ci-host/tests/test_github_known_hosts.py
      # Every roster machine in the inventory has a host key the others can trust.
      - name: host-identity known_hosts and NIC check tests
        run: python3 ansible/roles/host-identity/tests/test_host_identity.py
      - name: github-actions-runner-linux drain wait tests
        run: python3 ansible/roles/github-actions-runner-linux/tests/test_wait_worker_exit.py
      - name: feed-ingest offline tests
        run: python3 apps/feed-ingest/test_ingest.py
      - name: litellm tool_compat offline tests
        run: python3 apps/litellm/test_tool_compat.py
      - name: litellm go routes forward the session header
        run: python3 apps/litellm/test_go_routes.py
      - name: eeg-review offline tests
        run: python3 scripts/test_eeg_review.py
      - name: forgejo-secret-key-rotate offline tests
        run: python3 scripts/test_forgejo_secret_key_rotate.py
      - name: forgejo-issue-index-raise offline tests
        run: python3 scripts/test_forgejo_issue_index_raise.py

      - name: Home Assistant packages are all registered with the ConfigMap generator
        run: python3 scripts/check-ha-packages.py

      - name: SOPS is the only secret store, every *.sops.yaml is encrypted, no printer codes in slicer profiles
        run: python3 scripts/check-secret-store.py

      - name: Negative control - the check fails on a planted printer access code
        run: |
          printf '"printhost_access_code": "12345678",\n' > apps/orcaslicer/planted-control.json
          ! python3 scripts/check-secret-store.py apps/orcaslicer/planted-control.json
          rm apps/orcaslicer/planted-control.json

      - name: Negative control - the check fails on a planted Forgejo signing secret
        run: |
          printf '[server]\nLFS_JWT_SECRET = planted\n' > apps/forgejo/planted-control.ini
          ! python3 scripts/check-secret-store.py apps/forgejo/planted-control.ini
          rm apps/forgejo/planted-control.ini

      - name: Negative control - the check fails on a planted search API key
        run: |
          printf '    headers:\n      X-API-KEY: "planted123"\n' > apps/searxng/planted-control.yml
          ! python3 scripts/check-secret-store.py apps/searxng/planted-control.yml
          rm apps/searxng/planted-control.yml

  zomboid-scripts:
    # The control and sleeper suites have existed since those scripts were written
    # and have only ever run when someone remembered to. They are stdlib-only and
    # need no cluster, so there is no reason for that.
    runs-on: docker
    container:
      image: python:3.12-alpine
    steps:
      - name: Install checkout deps
        run: apk add --no-cache git nodejs

      - name: Checkout
        uses: actions/checkout@v4

      # run.sh is bash (and the control suite reads the CA bundle to build an SSL
      # context), neither of which alpine ships.
      - name: Install test deps
        run: apk add --no-cache bash ca-certificates

      - name: Control API and sleeper suites
        run: apps/zomboid/tests/run.sh

  ci-disk-prune:
    runs-on: docker
    container:
      image: alpine:3.20
    steps:
      # GNU tools, as on the CI hosts the script runs on.
      - name: Install deps
        run: apk add --no-cache git nodejs coreutils findutils procps bash curl
      - name: Checkout
        uses: actions/checkout@v4
      - name: ci-disk-prune offline test
        run: sh ansible/roles/ci-host/files/test-ci-disk-prune.sh
      - name: job-started hook offline test
        run: sh ansible/roles/ci-host/files/test-job-started.sh
      - name: ci-tree-prune offline test
        run: sh ansible/roles/unity-ci-host-mac/files/test-ci-tree-prune.sh
      - name: node-disk-metrics offline test
        run: sh ansible/roles/node-disk-metrics/files/test-node-disk-metrics.sh
      - name: node-inventory-metrics offline test
        run: sh ansible/roles/node-inventory-metrics/files/test-node-inventory-metrics.sh
      - name: forgejo-restore-drill runner offline test
        run: sh ansible/roles/forgejo-restore-drill/files/test-forgejo-restore-drill-run.sh
      - name: ci-runner-cpu offline test
        run: sh ansible/roles/ci-runner-cpu/files/test-ci-runner-cpu.sh
      - name: emotiv-bridge offline tests
        run: node --test ansible/roles/emotiv-bridge/files/test-emotiv-bridge.mjs

  dhcp-sync:
    runs-on: docker
    container:
      image: alpine:3.20
    steps:
      - name: Install deps
        run: apk add --no-cache git nodejs bash jq python3 py3-yaml
      - name: Checkout
        uses: actions/checkout@v4
      - name: dhcp.sh sync against a fake router
        run: infrastructure/dhcp/tests/test-sync.sh

  nut-replay:
    runs-on: docker
    container:
      # The NUT the primary runs: Debian trixie's 2.8.1 package.
      image: debian:trixie
    steps:
      - name: Install deps
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git nodejs ca-certificates nut-server nut-client python3-jinja2 busybox bsdutils procps
      - name: Checkout
        uses: actions/checkout@v4
      - name: Replay UPS status sequences through NUT
        run: bash ansible/roles/nut/tests/run-tests.sh
        env:
          NUT_REPLAY_IN_CONTAINER: "1"

  prometheus-rules:
    runs-on: docker
    container:
      image: alpine:3.20
    steps:
      - name: Install deps
        # One retry: this is a 100M download, and a dropped one fails with an I/O error.
        run: apk add --no-cache git nodejs prometheus yq-go || apk add --no-cache git nodejs prometheus yq-go

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install notification route test deps
        run: apk add --no-cache alertmanager python3 py3-yaml

      - name: Notification routes keep human warnings visible
        run: python3 scripts/test-alertmanager-routes.py

      - name: Alert rules behave as their tests say
        run: scripts/test-prometheus-rules.sh

  kustomize-builds:
    runs-on: docker
    container:
      image: alpine:3.20
    steps:
      - name: Install deps
        run: apk add --no-cache git nodejs kustomize yq-go

      - name: Checkout
        uses: actions/checkout@v4

      # A manifest that does not build is a manifest Flux refuses AFTER merge, in a
      # place nobody is watching. Cheaper to learn it here.
      #
      # Builds exactly what FLUX builds - the `apps` aggregate and each cluster - not
      # every apps/*/ directory. Those are not the same set: some apps/*/ directories
      # are not listed in apps/kustomization.yaml (docs/excluded-from-flux.md says why),
      # so a per-directory loop would gate this repo on a directory Flux itself ignores.
      # A gate that fails on something production does not build teaches people to
      # ignore the gate.
      - name: Flux entry points build
        run: |
          set -eu
          rc=0
          : > rendered.yaml  # read by the timeZone step below, so it checks exactly this render
          targets="apps $(ls -d clusters/*/ 2>/dev/null || true)"
          # An empty target list must FAIL, not pass vacuously.
          [ -n "$(echo "$targets" | tr -d ' ')" ] || { echo "FAIL: no build targets found"; exit 1; }
          for d in $targets; do
            if kustomize build "$d" >build.out 2>build.err; then
              { cat build.out; echo ---; } >> rendered.yaml
              echo "ok: $d"
            else
              echo "FAIL: kustomize build $d"
              sed 's/^/    /' build.err
              rc=1
            fi
          done
          exit $rc

      # The controller and kube-state-metrics must agree on a CronJob's zone. With no
      # spec.timeZone the k3s controller schedules in its host's zone (Pacific) while KSM
      # computes kube_cronjob_next_schedule_time in UTC, so every daily job looked 8h
      # overdue and HomelabCronJobNotScheduling fired on 26 of them (ar-2510). Checks the
      # rendered output, so a CronJob from a kustomize generator or patch counts too. A
      # CronJob a HelmRelease chart creates is not rendered here and is not checked; none
      # exists today (every live CronJob belongs to the apps Kustomization).
      - name: Every CronJob Flux builds sets spec.timeZone
        run: |
          set -eu
          # A CronJob's namespace/name, one per line, for each one with no spec.timeZone.
          no_zone() { yq ea -N 'select(.kind == "CronJob" and (.spec.timeZone // "") == "") | (.metadata.namespace // "-") + "/" + .metadata.name' -; }
          # Negative control: the filter must catch a planted CronJob, or it checks nothing.
          planted=$(printf 'kind: CronJob\nmetadata:\n  name: planted\n  namespace: ci\nspec:\n  schedule: "0 3 * * *"\n' | no_zone)
          [ "$planted" = "ci/planted" ] || { echo "FAIL: the filter missed a planted CronJob with no timeZone (got '$planted')"; exit 1; }
          zoned=$(printf 'kind: CronJob\nmetadata:\n  name: zoned\n  namespace: ci\nspec:\n  schedule: "0 3 * * *"\n  timeZone: America/Los_Angeles\n' | no_zone)
          [ -z "$zoned" ] || { echo "FAIL: the filter flagged a CronJob that sets timeZone (got '$zoned')"; exit 1; }
          found=$(yq ea -N 'select(.kind == "CronJob") | .metadata.name' rendered.yaml | grep -c . || true)
          missing=$(no_zone < rendered.yaml)
          rm rendered.yaml
          [ "$found" -gt 0 ] || { echo "FAIL: no CronJobs rendered, so the check checked nothing"; exit 1; }
          [ -z "$missing" ] || { echo "FAIL: these CronJobs set no spec.timeZone; add timeZone: America/Los_Angeles (the zone they run in without it):"; echo "$missing"; exit 1; }
          echo "ok: $found CronJobs, each sets spec.timeZone"
