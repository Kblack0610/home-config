name: mirror-to-github

# Forgejo (git.kennethblack.me / git.kblab.me) is the canonical remote.
# Flux watches it; humans push to it. Github is a passive disaster-recovery
# mirror. This workflow keeps github up-to-date on every push to master so
# nobody has to do it manually and the two refs never drift.
#
# Auth: github SSH deploy key, NOT a PAT. Deploy keys are scoped to a single
# repo and don't expire — strictly narrower blast radius than a PAT.
#
# One-time setup:
#   1. Generate a fresh keypair locally:
#        ssh-keygen -t ed25519 -f /tmp/home-config-mirror -N '' -C 'forgejo-mirror'
#   2. Add the PUBLIC key (/tmp/home-config-mirror.pub) as a deploy key on
#      https://github.com/Kblack0610/home-config/settings/keys with
#      "Allow write access" checked.
#   3. Store the PRIVATE key (/tmp/home-config-mirror, full file contents
#      including BEGIN/END lines) as a Forgejo Actions secret named
#      GITHUB_MIRROR_DEPLOY_KEY at
#      https://git.kennethblack.me/kblack0610/home-config/settings/actions/secrets.
#   4. Delete the local copies: `shred -u /tmp/home-config-mirror*`.

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  mirror:
    runs-on: docker
    container:
      image: alpine/git:2.45.2
    steps:
      - name: Install openssh-client
        run: apk add --no-cache openssh-client

      - name: Load github deploy key into ssh-agent
        env:
          DEPLOY_KEY: ${{ secrets.GITHUB_MIRROR_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Trust github's host key non-interactively.
          ssh-keyscan -t rsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          # Write key to disk with strict perms (ssh-agent isn't reliable across
          # exec'd alpine shells; an on-disk identity is simpler).
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o BatchMode=yes -T git@github.com 2>&1 | head -1 || true

      - name: Clone full history from Forgejo
        run: |
          git clone --mirror "${{ github.server_url }}/${{ github.repository }}.git" repo.git

      - name: Push to github mirror via SSH
        run: |
          cd repo.git
          # --mirror would also delete PR refs and tags from other forks. Push
          # only branches + tags explicitly.
          git push --prune --force \
            "git@github.com:Kblack0610/home-config.git" \
            'refs/heads/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'
