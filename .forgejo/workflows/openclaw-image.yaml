name: openclaw-image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - apps/openclaw/Dockerfile
      - .forgejo/workflows/openclaw-image.yaml
  schedule:
    # Sunday 07:00 UTC — pick up upstream `:latest` digest changes weekly.
    - cron: '0 7 * * 0'

jobs:
  build:
    runs-on: docker
    container:
      image: docker:27
    env:
      # The runner's DinD sidecar exposes the docker daemon on localhost:2375
      # (apps/forgejo/runner-config-cm.yaml: `docker_host: tcp://localhost:2375`).
      DOCKER_HOST: tcp://localhost:2375
    steps:
      - name: Install build deps
        run: apk add --no-cache git nodejs

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to git.kblab.me registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login git.kblab.me -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          set -eu
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          DATE="$(date -u +%Y%m%d)"
          IMAGE=git.kblab.me/kblack0610/openclaw
          # Disable buildkit and use legacy builder. buildx (default in
          # docker 27) spawns a buildkit child container on dind's bridge
          # network with no outbound NAT, so apt-get inside RUN hangs.
          # The legacy DOCKER_BUILDKIT=0 builder runs RUN containers on
          # dind's default bridge which DOES NAT correctly.
          export DOCKER_BUILDKIT=0
          docker build apps/openclaw \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:sha-$SHORT_SHA" \
            --tag "$IMAGE:$DATE"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-$SHORT_SHA"
          docker push "$IMAGE:$DATE"
