name: openclaw-image

# KNOWN-BROKEN — manual triggers only. The dind-on-bridge network hangs on
# apt-get update inside Dockerfile RUN steps (nested NAT issue). Until
# fixed, build locally and push manually:
#
#   docker login git.kblab.me -u kblack0610
#   DOCKER_BUILDKIT=0 docker build apps/openclaw \
#     -t git.kblab.me/kblack0610/openclaw:latest \
#     -t git.kblab.me/kblack0610/openclaw:$(date +%Y%m%d)
#   docker push git.kblab.me/kblack0610/openclaw:latest
#   kubectl -n openclaw delete pod -l app.kubernetes.io/name=openclaw
#
# Auto-triggers (push, cron) are disabled to avoid wasting runner cycles.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    container:
      image: docker:27
    env:
      # The runner's DinD sidecar exposes the docker daemon on localhost:2375
      # (apps/forgejo/runner-config-cm.yaml: `docker_host: tcp://localhost:2375`).
      DOCKER_HOST: tcp://localhost:2375
    steps:
      - name: Install build deps
        run: apk add --no-cache git nodejs

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to in-cluster Forgejo registry
        run: |
          # Push direct to the in-cluster Forgejo service (skip Traefik).
          # Public path through `git.kblab.me` 504s on multi-GB layer uploads
          # at the ingress timeout. The in-cluster service is the same
          # backend — image becomes available at the public name once stored.
          # The auto-injected GITHUB_TOKEN lacks `write:package` scope, so
          # we use REGISTRY_TOKEN (user PAT with package write).
          echo "${{ secrets.REGISTRY_TOKEN }}" \
            | docker login forgejo-http.forgejo.svc.cluster.local:3000 \
                -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          set -eu
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          DATE="$(date -u +%Y%m%d)"
          # Tag with the in-cluster registry name for pushing; the Forgejo
          # registry indexes by `<owner>/<image>` regardless of hostname,
          # so the image is also pullable as git.kblab.me/kblack0610/openclaw.
          PUSH=forgejo-http.forgejo.svc.cluster.local:3000/kblack0610/openclaw
          # Disable buildkit and use legacy builder. buildx (default in
          # docker 27) spawns a buildkit child container on dind's bridge
          # network with no outbound NAT, so apt-get inside RUN hangs.
          export DOCKER_BUILDKIT=0
          docker build apps/openclaw \
            --tag "$PUSH:latest" \
            --tag "$PUSH:sha-$SHORT_SHA" \
            --tag "$PUSH:$DATE"
          docker push "$PUSH:latest"
          docker push "$PUSH:sha-$SHORT_SHA"
          docker push "$PUSH:$DATE"
