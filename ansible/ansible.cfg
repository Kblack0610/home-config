[defaults]
inventory = ./inventory.yml
roles_path = ./roles
collections_path = ./collections
host_key_checking = False
retry_files_enabled = False
forks = 10
stdout_callback = default
# community.general.yaml callback was removed in collection 12.0.0; use the
# built-in default callback with YAML-formatted results.
result_format = yaml
callbacks_enabled = profile_tasks
nocows = True
# Secrets are SOPS files (group_vars/<group>/vault.sops.yaml), decrypted by the
# community.sops vars plugin with the age key in ~/.config/sops/age/keys.txt
# (SOPS_AGE_KEY_FILE overrides it; the in-cluster ansible-runner sets its own).
# See README.md "Secrets".
vars_plugins_enabled = host_group_vars,community.sops.sops

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
