[defaults]
inventory = ./inventory.yml
roles_path = ./roles
collections_path = ./collections
host_key_checking = False
retry_files_enabled = False
forks = 10
stdout_callback = default
# community.general.yaml callback was removed in collection 12.0.0; use the
# built-in default callback with YAML-formatted results.
result_format = yaml
callbacks_enabled = profile_tasks
nocows = True
# Workstation vault password (docs: ansible/README.md). ANSIBLE_VAULT_PASSWORD_FILE
# overrides this, which is how the in-cluster ansible-runner supplies its own.
vault_password_file = ~/.ansible-vault-pass

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
