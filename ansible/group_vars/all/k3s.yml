---
# The home-k3s API server, `pi5-master` per inventory.yml. Agents join it
# (roles/k3s-agent) and every fleet worker reads the exporter feed and moves agents.kblab.me
# through it (roles/fleet-worker tasks/peer.yml). Override in host_vars when introducing a
# second control plane.
k3s_url: "https://192.168.1.20:6443"

# The one k3s version for every node (roles/k3s-agent): fresh joins install it,
# existing nodes are upgraded to it in place. Step one minor at a time, server
# first (playbooks/site.yml runs it before the agents), and never lower it.
k3s_install_version: v1.35.10+k3s1

# Who owns /var/lib/node-exporter-textfile, the k3s node-exporter's textfile dir. Two roles
# create it (node-disk-metrics, ci-runner-cpu), so the owner is set once here. A fleet home on a
# node publishes its own claude_acct.prom and fleet_local.prom there and needs to write; every
# other node keeps it root. Root-run writers are unaffected.
k3s_textfile_owner: "{{ ansible_user if inventory_hostname in groups['fleet_workers'] else 'root' }}"
