---
# Ansible inventory for home-config bare-metal hosts.
#
# Layers:
#   - PXE:     cold-boot OS install (unchanged)
#   - Ansible: this file — everything below the kubelet, plus non-k3s hosts
#   - Flux:    k3s workloads (unchanged)
#
# IP truth lives in infrastructure/dhcp/devices.yaml, but k3s nodes assigned
# post-devices.yaml (hp-victus) are sourced from `kubectl get nodes`.
# Update both files when adding a host.

#
# IMPORTANT: the short names below (pi5-master, pi5-worker2, etc.) are
# **Ansible inventory aliases only**. They work with `ansible-playbook --limit`
# because Ansible looks them up in this file, but they are NOT DNS-resolvable.
# For ad-hoc `ssh`, `kubectl`, `curl`, etc., use the DHCP-assigned LAN name
# (`pi5-master-lan`, `pi5-worker2-lan`, ...) or the IP. The LAN names come
# from `infrastructure/dhcp/devices.yaml` via OpenWRT's dnsmasq.

all:
  vars:
    # Default SSH user on Linux hosts provisioned via PXE (matches the
    # workstation account that PXE kickstart seeds with the key).
    ansible_user: kblack0610

  children:
    # Provisional tiers for placement records; P2 qualification and P5 review
    # own admission proof. core: single-writer state, no CI/GPU/load tests;
    # standard: ordinary apps and CI; probation: scratch/CI only, no PVs.
    # asus core is the accepted mains/battery-alert exception (ask dd4Hhw).
    # no_ci_hosts remains an independent prohibition (ask vy3RRu).
    linux_bare_metal:
      hosts:
        hp-victus:
          host_tier: probation
          ansible_host: 192.168.1.243
          ssh_host_ed25519: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMSSeokhtpnD8t9LhxxPnQDsF6q0qE1rHNI37kYPGZX5
        # asus-laptop listens on 2222, not 22 (that part of the 2026-04-01 note
        # still holds). The `unreachable: true` flag was removed 2026-08-12:
        # it was stale, and it was load-bearing in the wrong direction. The host
        # answers fine on 2222 with the standard key, but because it was marked
        # unmanaged, its 8TB backup drive's mounts were never owned by Ansible -
        # so when the drive re-enumerated on 2026-08-09 there was no role to fix
        # it with, and the mounts had to be repaired by hand. It now carries the
        # usb-backup-mounts role.
        asus-laptop:
          host_tier: core
          ansible_host: 192.168.1.152
          ansible_port: 2222
          ssh_host_ed25519: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICsWV1oEbjGp4NMxRE6W4wamxt8KJ3PIIuXaUO/1qsXS
        # Razer Blade 14 (Ryzen 9 8945HS, 32 GB since 2026-11-17, 96 GB before), reinstalled headless by PXE
        # kexec 2026-10-24 as a CI host, and a k3s agent since 2026-10-26. On the LAN through
        # a USB-C ethernet dongle; the DHCP reservation follows that dongle's MAC.
        razer-laptop:
          host_tier: standard
          ansible_host: 192.168.1.26
          # A k3s agent since 2026-10-26, like hp-victus and asus-laptop.
          k3s_role: agent
          k3s_extra_args:
            - --node-label=node.kubernetes.io/friendly-name=razer-laptop
          # Its power button is a keyboard key and it sits stacked, lid shut:
          # a short press powered it off on 2026-10-24. Hold to force off.
          k3s_no_suspend_power_key: ignore
        # The Unity CI boxes bought 2026-11-10 (docs/unity-ci-hardware.md),
        # installed headless by PXE 2026-11-16 and k3s agents since. ms-a2:
        # Minisforum MS-A2, Ryzen 9 9955HX (16 cores), 91G, one of four ports cabled.
        ms-a2:
          host_tier: standard
          ansible_host: 192.168.1.28
          ssh_host_ed25519: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOc31JGsIsPvZ6UCygW2zQjb8t+KDKk8ZXjBlt+z7WrF
          k3s_role: agent
          k3s_extra_args:
            - --node-label=node.kubernetes.io/friendly-name=ms-a2
        # ASRock DeskSlim X600, Ryzen 9 9900X (12 cores), 60G. Its twin deskslim-1
        # (7900X, DHCP .19) joins once its replacement RAM is in.
        deskslim-2:
          host_tier: standard
          ansible_host: 192.168.1.29
          ssh_host_ed25519: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN6Us7+Ypxlco5izmZf8Nu0m2Hq2GBvVpPtxh9tCKRGA
          k3s_role: agent
          k3s_extra_args:
            - --node-label=node.kubernetes.io/friendly-name=deskslim-2

    # This workstation, managed over a local connection (no SSH). Hosts the
    # gungan dictation ASR daemons (see roles/asr-servers).
    desktop_workstations:
      hosts:
        cachyos-x8664-main:
          host_tier: standard
          ansible_connection: local
          # Its DHCP name, which is not its hostname: roles/host-identity trusts its key under it
          # and finds its NIC reservation by it.
          fleet_ssh_host: pc-home-cachy-main.lan
          # /etc/ssh/ssh_host_ed25519_key.pub, which every roster machine trusts (roles/host-identity).
          ssh_host_ed25519: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGaTLqfJOaCga5UzV+WsuxyRSRPcUY5GMUFloCREQ9aE
          ansible_python_interpreter: /usr/bin/python3

    macos_hosts:
      hosts:
        mac-mini:
          host_tier: standard
          ansible_host: 192.168.1.7
          ansible_user: kennethblack
          ssh_aliases: [m1]
          # /etc/ssh/ssh_host_ed25519_key.pub: roster machines trust it under every name it is dialed by
          # (host_identity_dial_target_groups, roles/host-identity).
          ssh_host_ed25519: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBSevnCCl7D8zA29C912Sa2isbGS9eTzhotSXl1TgUlh
          # The store-console skill drives this Chrome over ssh with the
          # Playwright Extension; the person signs in to the store consoles here.
          brew_extra_casks: [google-chrome]
          # Its two runners, for the CI topology (scripts/render-ci-topology.py): mac-mini-mac is
          # the "macOS CI runner" play's, m1-playground-mac has no play (docs/mac-machines.md).
          ci_pinned_runners:
            - {name: mac-mini-mac, cap: macos, repo: BlackNBrownStudios/platform}
            - {name: m1-playground-mac, cap: macos, repo: BlackNBrownStudios/unity-core-playground}

    # Windows PCs, managed over Windows OpenSSH (see docs/windows-machines.md
    # for the one-time paste that enables sshd and trusts the workstation key).
    # roles/windows-agent-tools makes PowerShell sshd's default shell, hence
    # ansible_shell_type: powershell. It also works on a PC whose sshd shell is
    # still cmd (checked 2026-10-26), so a new PC needs no override.
    windows_hosts:
      vars:
        ansible_connection: ssh
        ansible_shell_type: powershell
      hosts:
        # The living-room Windows and media box (Win10 Pro, Wi-Fi only), and
        # the infra Windows test host: agents drive it over SSH, and it is an
        # opt-in org runner for Windows-only issues, the way mac-mini is for
        # macOS. Not a CI gate. Was living-room-pc (.121) until 2026-10-26.
        windows-media:
          host_tier: standard
          ansible_host: 192.168.1.8   # windows-media-lan
          ansible_user: hughl
          windows_hostname: WINDOWS-MEDIA
          # Agents need a signed-in desktop; this brings it back after a reboot
          # or power cut with no one at the TV.
          windows_baseline_autologon: true
          # The "Windows test runner" play's org runner, for the CI topology.
          ci_pinned_runners:
            - {name: windows-media, cap: windows}

    # Nodes whose tier labels Ansible owns. IP matching resolves Pi aliases
    # to their actual Kubernetes names; this group does not install k3s.
    k3s_nodes:
      children:
        pi_k3s:
        watchdog_x86:

    pi_k3s:
      hosts:
        pi5-master:
          host_tier: standard
          ansible_host: 192.168.1.20
          k3s_role: server
          k3s_extra_args: [--tls-san, 192.168.1.20]
        pi5-worker1:
          host_tier: standard
          ansible_host: 192.168.1.21
          k3s_role: agent
          k3s_extra_args: [--with-node-id]
        pi5-worker2:
          host_tier: standard
          ansible_host: 192.168.1.22
          k3s_role: agent
          k3s_extra_args: [--with-node-id]
        pi5-worker3:
          host_tier: standard
          ansible_host: 192.168.1.23
          k3s_role: agent
          k3s_extra_args: [--with-node-id]
        pi4-worker4:
          host_tier: standard
          ansible_host: 192.168.1.24
          k3s_role: agent
          k3s_extra_args: [--with-node-id]
        pi4-worker5:
          host_tier: standard
          ansible_host: 192.168.1.124
          k3s_role: agent
          k3s_extra_args: [--with-node-id]

    openwrt:
      hosts:
        openwrt-router:
          host_tier: standard
          ansible_host: 192.168.1.1
          ansible_user: root

    # AdGuard Home - the LAN's filtering resolver, a Raspberry Pi 3B running
    # docker-compose OUTSIDE k3s (it must survive cluster outages, and it owns
    # the *.kblab.me rewrites the cluster's own ingress depends on).
    #
    # Added 2026-09-01. It had been unmanaged since 2026-03: its AdGuardHome.yaml
    # existed only on the SD card, and its node_exporter was installed by hand.
    # .193 was also a DYNAMIC lease that the router hardcodes as its DNS
    # upstream - now pinned in infrastructure/dhcp/devices.yaml.
    adguard:
      hosts:
        pi3-adguard:
          host_tier: standard
          ansible_host: 192.168.1.193

    # Every Raspberry Pi: each exports its firmware undervoltage latch
    # (roles/rpi-throttle-metric), which PiUndervoltageSinceBoot alerts on.
    rpi_hosts:
      children:
        pi_k3s:
        rpi_standalone:

    # Pis outside k3s. Their node-exporter is Debian's package, which reads its
    # textfile dir at /var/lib/prometheus/node-exporter, not the DaemonSet's.
    rpi_standalone:
      vars:
        rpi_throttle_textfile_dir: /var/lib/prometheus/node-exporter
      children:
        adguard:
      hosts:
        audio-living:
        audio-bedroom:

    # Hosts that arm their hardware watchdog (roles/hw-watchdog), so a freeze
    # resets the box instead of waiting for someone to pull the plug.
    watchdog_hosts:
      children:
        adguard:
        watchdog_x86:
      hosts:
        audio-living:
          host_tier: standard
        audio-bedroom:
          host_tier: standard

    # The x86 k3s nodes. hp-victus hung 2026-11-12 and 11-13 (NVIDIA GSP fault)
    # and needed a hand power-cycle each time; it holds Forgejo. The chipset
    # timers (iTCO on Intel, SP5100 TCO on AMD) allow far more than the Pi's 15s.
    # softlockup_panic turns a stuck CPU into a panic, which kernel.panic reboots.
    watchdog_x86:
      hosts:
        hp-victus:
        razer-laptop:
        # sp5100_tco autoloads on both (/dev/watchdog0, checked 2026-11-16).
        ms-a2:
        deskslim-2:
        asus-laptop:
          # Present but not autoloaded on this board (checked 2026-11-13).
          hw_watchdog_module: sp5100_tco
      vars:
        hw_watchdog_runtime_sec: 30s
        hw_watchdog_softlockup_panic: 1

    # Hosts that stream kernel messages to pi5-master (roles/crash-evidence), so
    # the lines printed after the journal stops shipping still survive. Wired
    # only: netconsole needs netpoll, which the Pi Wi-Fi driver (brcmfmac) lacks,
    # so audio-bedroom is not here. The Pis also export the undervoltage latch.
    netconsole_senders:
      children:
        adguard:
      hosts:
        audio-living:
        hp-victus:
        razer-laptop:
        ms-a2:
        deskslim-2:
        asus-laptop:

    # NUT (Network UPS Tools) groups. The single CyberPower CP1500PFCLCDa plugs
    # into pi5-master via USB; pi5-master runs upsd + upsmon-primary, and every
    # host on a UPS outlet runs upsmon-secondary, because the primary's shutdown
    # ends in killpower, which cuts every battery outlet. A host on the UPS that
    # is not listed here is hard-cut: that took the workstation down 2026-11-17.
    # Which outlet each host is on: docs/nut-ups.md, "Hosts on the UPS".
    nut_server:
      hosts:
        pi5-master:
    nut_clients:
      hosts:
        # The Pi workers dropped the instant the power went on 2026-11-17, so
        # they are not on battery outlets (docs/nut-ups.md). Kept as clients so
        # they shut down cleanly once they are.
        pi5-worker1:
        pi5-worker2:
        pi5-worker3:
        pi4-worker4:
        pi4-worker5:
        # On battery outlets, added 2026-11-17 (hc-480).
        pi3-adguard:
        ms-a2:
        deskslim-2:
        mac-mini:
        # Local connection: apply with -K (sudo password).
        cachyos-x8664-main:

    # Self-hosted GitHub Actions runners for BlackNBrownStudios/platform
    # (see the "CI runners (light, heavy and Unity slots)" play in site.yml).
    # GitHub has no runner priority - an idle runner with matching labels takes
    # the next job - so the slot counts ARE the priority. CPU/memory caps are in
    # ci_hosts below.
    # The exporter and governor read these slots from apps/ci-topology/topology.json,
    # which scripts/render-ci-topology.py renders from here; CI fails when it is stale.
    # Never a host in no_ci_hosts (below); the same script fails CI on one.
    linux_ci_runners:
      hosts:
        # One of each from 2026-11-10, on cores of their own (ci_linux_cpus in
        # ci_hosts). Three light and a heavy shared Unity's cores at a quarter of
        # its weight and blew their caps (platform #1488, #1489). Two light since
        # 2026-11-12 for the light bursts: the light runners have
        # their own 6 threads (ci_linux_cpus 5-7,13-15) (40G then, 6G since 2026-11-17), and a light job
        # is 0.5-0.6G anon. Heavy: razer's one heavy slot waited 6% of 7 days with
        # bursts to 18, so since 2026-11-17 ms-a2 and windows-media-ci carry one heavy
        # slot each; heavy jobs take ephemeral ports, so Unity test slots on a heavy host
        # take heavy once make-logical-possum-p4-apply runs (scripts/render-ci-topology.py SHARED_CAPS).
        # razer has one light slot and no heavy since 2026-11-17: 32 GB, k3s and the
        # OS take about 12 GiB, the rest stays with 4-6 Claude sessions.
        # ci_repo_runners: runners for one personal repo, which cannot use the
        # org's slots. GitHub bills hosted minutes on a private repo and refused
        # every .dotfiles-private job from 2026-11-15 once the month's allowance
        # ran out. Its jobs are lint and unit runs of seconds and under 1G, so
        # one runner on each of two hosts, in the light slots' slice. gungan-speak
        # takes the same shape (hc-496, ask bcN3iL): a uv pytest run of about 11 s, 6
        # runs from 2026-10-18 to 11-18. Both hosts read FULL then; the slice's cores
        # bound these runners, so they add jobs, not cores. One list, anchored here.
        razer-laptop:
          ci_light_slots: 1
          ci_heavy_slots: 0
          ci_repo_runners: &personal_repo_runners
            - {repo: Kblack0610/.dotfiles-private, slot: dotfiles-private-1}
            - {repo: Kblack0610/gungan-speak, slot: gungan-speak-1}
        # Light and heavy slots on the cores of its third Unity slot since
        # 2026-11-13 (unity_ci_runners says why). Light jobs average 0.4 cores and
        # 0.6G. Since 2026-11-18 two of the four light slots are Forgejo slots, so the
        # slice holds as many slots as before (two light, one heavy, two Forgejo), and
        # light jobs also take every Unity test slot (SHARED_CAPS). The VM is not on the
        # tailnet, so its Forgejo slots register through the LAN ingress, which follows
        # forge-primary too. Ubuntu: ci-host's apt list.
        windows-media-ci:
          host_tier: standard
          ci_light_slots: 2
          ci_heavy_slots: 1
          forgejo_slots: 2
          forgejo_runner_instance: https://git.kblab.me
          ci_repo_runners: *personal_repo_runners
        # Two light slots on cores 14-15 since 2026-11-17, the cores ci_hosts kept
        # outside its Unity slots for the platform runners. Not on the Unity slots
        # themselves: playground's light jobs clean and sparse-check-out the same repo
        # dir, which would wipe that slot's warm Library.
        # forgejo_slots: Forgejo Actions runners, one forge per slot, in the same
        # ci-linux.slice budget as the light and heavy slots (roles/forgejo-runner-linux).
        # Two on ms-a2 since 2026-11-18: they replaced the k3s runner pod
        # (capacity 2), which ran on ms-a2's k3s cores, so its jobs moved into the CI
        # budget instead of adding load; every CI host read FULL that day. The total
        # is FORGEJO_SLOTS in scripts/render-ci-topology.py, now four with windows-media-ci's.
        ms-a2:
          ci_light_slots: 2
          ci_heavy_slots: 1
          forgejo_slots: 2

    # BNB Unity runner pool (added 2026-10-05; the "CI runners (light, heavy and Unity slots)" play in
    # site.yml). Org-scoped, label `unity`, for every game repo. Each slot runs
    # one Unity job at a time (a PlayMode shard, an EditMode run, a DodginBalls
    # build), about 4-6 GB each. CPU/memory caps are in ci_hosts below. Every
    # host here is one activation on the shared Unity serial.
    # Rendered into the CI topology like linux_ci_runners above.
    #
    # Never a host in no_ci_hosts (below).
    unity_ci_runners:
      hosts:
        # razer-laptop has no Unity slot since 2026-11-17: its RAM dropped from 96 GB to
        # 32 GB (the 96 GB kit went to the MS-A2) and it stays a usable Claude runner.
        # Slot 1 of ms-a2 carries slim-tour, so playground slim-tour.yml always lands on the
        # one slot whose prune keeps its trees warm (site.yml's .keep-warm-trees, ucp-2062).
        # Picked by disk on 2026-11-17: ms-a2 1.6T free of 1.8T (88%), unity-full, on the LAN
        # (hd-library). It took the label from razer-laptop slot 1.
        # The 2026-11-10 purchases, joined 2026-11-16. Full runs and gates: owned
        # and never preempted. One slot fewer than the purchase plan on each, so
        # k3s keeps two cores of its own (ci_hosts below); ramp per
        # docs/runbooks/unity-ci-host.md. Not unity-wide until each passes the
        # ucp-1521 probes.
        ms-a2:
          unity_ci_slots: 4
          unity_ci_slot_labels:
            1: [slim-tour]
          unity_ci_full: true
          unity_ci_gate: true
        deskslim-2:
          unity_ci_slots: 3
          unity_ci_full: true
          unity_ci_gate: true
        # The workstation, the human's work machine: merge gates only
        # (unity_ci_full false, so no nightly, release or Multi run lands here).
        # The governor reads it from the CI topology for its admit.
        # Each slot has its own three-core cpuset and a 16G cap (ci_hosts below).
        # Uncapped slots took 12 cores and 48G in October; the human asked for
        # these two again on 2026-11-03, once unity-core-playground stopped
        # running a gate's pre-flight here, so a gate's only Unity on this machine
        # is a pool slot. Add a third only after a day of load and temperatures.
        cachyos-x8664-main:
          unity_ci_slots: 2
          unity_ci_full: false
          unity_ci_gate: true
        # The Ubuntu 24.04 Hyper-V VM on windows-media (Ryzen 9 5900XT, 64G),
        # added 2026-11-13: 24 vCPUs and 50G static of the host's 32 threads and
        # 64G. Hyper-V does not pin vCPUs, so Windows and the TV share the cores
        # by scheduler, with 14G of memory of their own. Two slots
        # of three cores and 14G each, with three cores and 8G for the guest OS
        # (docs/unity-ci-hardware.md sizing). Full runs and gates: it is owned and
        # never preempted. Not unity-wide until it passes the ucp-1521 probes.
        # Three slots until 2026-11-13: the third's cores went to four light slots
        # (linux_ci_runners), since light is the front door of every Unity gate
        # and #953 left razer's two alone (25 waiting, up to 24 min) while AWS
        # had 24 Unity slots idle. The host read FULL, so a swap, not an addition.
        # Setup and the VM itself: docs/windows-machines.md.
        windows-media-ci:
          ansible_host: 192.168.1.27   # windows-media-ci (DHCP reservation)
          thermal_cap_exempt: a Hyper-V VM; its CPU clocks belong to the Windows host windows-media
          unity_ci_slots: 2
          unity_ci_full: true
          unity_ci_gate: true
        # The player-build host (platform infra/aws-ci-burst, added 2026-11-10): an
        # on-demand m7a.8xlarge with a 900G volume, reached through SSM with the
        # same instance profile and library bucket as the Spot hosts. Slots 1-3 carry unity-build
        # (unity_ci_build_slots), so playground release.yml's builds run there and no gate
        # or nightly can; slots 4-9 are pool test slots (unity, unity-full, unity-gate). Each
        # build slot shares its cores with two test slots, and the governor never runs a
        # build and a test in one group (unity_ci_slot_groups). It
        # starts the host when a build waits, and for tests as the last standby host.
        # Default image list: desktop builds need the windows flavor.
        aws-build-1:
          host_tier: standard
          thermal_cap_exempt: an EC2 VM; AWS owns its cooling
          ansible_host: i-0856b245ff7a81321
          ansible_user: ubuntu
          ansible_ssh_common_args: >-
            -o ProxyCommand="aws ssm start-session --profile bnb --region us-east-2
            --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p"
          unity_ci_slots: 9
          unity_ci_build_slots: 3
          # Build slot -> the test slots on its cores (ci_unity_slot_cpus below): the governor
          # admits a build slot or its test slots, never both.
          unity_ci_slot_groups: {1: [4, 5], 2: [6, 7], 3: [8, 9]}
          # Releases take slots 1-2 only (playground release.yml asks unity-release),
          # so a release, or one per game from ship.sh, never holds the slot players.yml
          # builds on; a release alone had all three for hours on 2026-11-11 (hc-263).
          unity_ci_slot_labels:
            1: [unity-release]
            2: [unity-release]
          unity_ci_gate: true
          unity_ci_images_pull: true
          unity_ci_lan: false
          unity_ci_library_s3: aws-burst-1-libraries-311141527647
          # Every cold release tree fetches the imports another tree made (playground ucp-1913).
          unity_ci_accelerator: 172.17.0.1:10080
        # Spot hosts (platform infra/aws-ci-burst, 2026-11-13), one instance type each, ahead
        # of aws-build-1 in the governor's start order, cheapest first (the on-demand burst hosts were retired 2026-11-16). No unity_ci_gate: a reclaim kills
        # what runs, so they take nightlies and bulk work, not merge gates (ucp-1778).
        # 16 cores with SMT, so five slots of three cores (ci_hosts below).
        aws-spot-1:
          host_tier: standard
          thermal_cap_exempt: an EC2 VM; AWS owns its cooling
          ansible_host: i-0b4c89a54f8e25ad5
          ansible_user: ubuntu
          ansible_ssh_common_args: >-
            -o ProxyCommand="aws ssm start-session --profile bnb --region us-east-2
            --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p"
          unity_ci_slots: 5
          unity_ci_full: true
          unity_ci_images_pull: true
          unity_ci_images:
            - unityci/editor:ubuntu-6000.0.85f1-base-3
            - unityci/editor:ubuntu-6000.3.27f1-base-3
          unity_ci_lan: false
          unity_ci_library_s3: aws-burst-1-libraries-311141527647
        aws-spot-2:
          host_tier: standard
          thermal_cap_exempt: an EC2 VM; AWS owns its cooling
          ansible_host: i-0c244a80e9cf430b1
          ansible_user: ubuntu
          ansible_ssh_common_args: >-
            -o ProxyCommand="aws ssm start-session --profile bnb --region us-east-2
            --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p"
          unity_ci_slots: 5
          unity_ci_full: true
          unity_ci_images_pull: true
          unity_ci_images:
            - unityci/editor:ubuntu-6000.0.85f1-base-3
            - unityci/editor:ubuntu-6000.3.27f1-base-3
          unity_ci_lan: false
          unity_ci_library_s3: aws-burst-1-libraries-311141527647
        aws-spot-3:
          host_tier: standard
          thermal_cap_exempt: an EC2 VM; AWS owns its cooling
          ansible_host: i-04ca535b8876dff6f
          ansible_user: ubuntu
          ansible_ssh_common_args: >-
            -o ProxyCommand="aws ssm start-session --profile bnb --region us-east-2
            --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p"
          unity_ci_slots: 5
          unity_ci_full: true
          unity_ci_images_pull: true
          unity_ci_images:
            - unityci/editor:ubuntu-6000.0.85f1-base-3
            - unityci/editor:ubuntu-6000.3.27f1-base-3
          unity_ci_lan: false
          unity_ci_library_s3: aws-burst-1-libraries-311141527647


    # macOS hosts in the same Unity pool (site.yml, "Unity CI runner pool
    # (macOS)"). Native editor, no container, so no ci_hosts budget: macOS has
    # no cpusets. Rendered into the CI topology like unity_ci_runners.
    unity_ci_mac_runners:
      # No Mac in the pool since 2026-11-10: the Mac Studio, its only host, was
      # sold. Add a Mac here to bring the
      # pool back.
      hosts: {}

    # Service hosts: no CI of any kind (GitHub runners, Unity slots, the
    # Forgejo runner). hp-victus holds Frigate; asus-laptop holds the
    # databases and the home Forgejo copy.
    # On 2026-11-13 hp-victus ran those beside six runners at load15 41.5 on
    # 24 threads and 90C, 31G and no swap, and went NotReady, taking Forgejo
    # down; asus ran at load 21-29 on 16 threads and 90.8C with three. Neither
    # alerted. In the 48h after #953 took CI off asus (11-14 to 11-16), its
    # IO full pressure averaged 5.7% (1h peak 20%) against 40-58% on 11-10 to
    # 11-13, and Prometheus there had no liveness kill (two before): its three
    # restarts were two asus reboots and one clean exit shared with
    # victoria-metrics (asus-prometheus-48h-verify).
    # scripts/render-ci-topology.py fails CI when a host here is in
    # linux_ci_runners, unity_ci_runners or ci_hosts, and the "Retire CI on
    # no_ci_hosts" play in site.yml removes what a host still runs. Before
    # placing any work on any host, read scripts/host-headroom.py <host>.
    no_ci_hosts:
      hosts:
        hp-victus:
        asus-laptop:

    # One CPU and memory budget per CI host (roles/ci-host-budget): every runner
    # and container of every CI workload on the host shares it, and what is left
    # stays with k3s and the OS. Starting values, tuned against a full nightly.
    # ci_caps: the job kinds the host can run (light, heavy, unity, unity-build, forgejo).
    # Every slot takes each of them its kind can hold (scripts/render-ci-topology.py
    # HOST_CAPS says which), so a Unity test slot also takes its host's light (and heavy, after
    # make-logical-possum-p4-apply) jobs. A host's own slots of a kind need that kind here; a cloud host takes no
    # light or heavy, so a small job never powers a paid host. Drop a cap and
    # re-apply to take it off every slot of the host.
    ci_hosts:
      hosts:
        # 8 cores / 16 threads, SMT siblings are n and n+8. Cores 0-1 (CPUs
        # 0-1, 8-9) are k3s and the OS; k3s_cpus pins pods there with 4 CPUs of
        # allocatable, after 6-CPU backtests landed beside CI and the 15-minute
        # load hit 18 (2026-11-10). The platform runners get cores 5-7 and their SMT
        # siblings. Since 2026-11-17 the host has 32 GB (was 96 GB) and no Unity slot:
        # one light slot capped at 6G, k3s and the OS about 12 GiB, the rest left for
        # 4-6 Claude sessions. ci_unity_cpus stays set because ci-host-budget asserts it
        # does not overlap ci_linux_cpus; the Unity slice holds no units.
        razer-laptop:
          ci_caps: [light]
          ci_cpus: 2-7,10-15
          ci_memory_max: 6G
          ci_unity_cpus: 2-4,10-12
          ci_unity_slot_cpus: []
          ci_unity_memory_max: 6G
          ci_linux_cpus: 5-7,13-15
          k3s_cpus: 0-1,8-9
          ci_linux_memory_max: 6G
        # ms-a2: 16 cores / 32 threads, SMT siblings n and n+16 (sysfs,
        # 2026-11-16), 91G. Cores 0-1 are k3s and the OS, as on razer. Each Unity
        # slot gets three cores and 16G (docs/unity-ci-hardware.md sizing), cores
        # 2-13. Cores 14-15 (CPUs 14-15,30-31) are the two light slots' and the
        # heavy slot's (linux_ci_runners), 16G between them (a light job is about
        # 0.6G), which leaves 21G for the host and k3s.
        ms-a2:
          ci_caps: [light, heavy, unity, forgejo]
          ci_cpus: 2-15,18-31
          ci_memory_max: 70G
          ci_linux_cpus: 14-15,30-31
          ci_linux_memory_max: 16G
          ci_unity_cpus: 2-13,18-29
          ci_unity_slot_cpus: ["2-4,18-20", "5-7,21-23", "8-10,24-26", "11-13,27-29"]
          ci_unity_memory_max: 54G
          ci_unity_slot_memory_max: 16G
          k3s_cpus: 0-1,16-17
        # deskslim-2: 12 cores / 24 threads, SMT siblings n and n+12, 60G. Cores
        # 0-1 are k3s and the OS; three slots of three cores and 14G on cores
        # 2-10, which leaves core 11 and 18G for the host. A fourth slot would take
        # k3s's cores.
        deskslim-2:
          ci_caps: [light, unity]
          ci_cpus: 2-10,14-22
          ci_memory_max: 42G
          ci_unity_cpus: 2-10,14-22
          ci_unity_slot_cpus: ["2-4,14-16", "5-7,17-19", "8-10,20-22"]
          ci_unity_memory_max: 42G
          ci_unity_slot_memory_max: 14G
          k3s_cpus: 0-1,12-13
        # The workstation: Ryzen 9 9950X3D, 16 cores / 32 threads, SMT
        # siblings n and n+16 (lscpu -e and sysfs L3 caches, 2026-11-16), 124G.
        # Keep the 96 MiB V-cache CCD (CPUs 0-7,16-23) for the human's desktop
        # and agents. CI uses six whole cores on the 32 MiB CCD; cores 14-15
        # (CPUs 14-15,30-31) also stay outside CI. Each Unity slot gets three
        # cores and 16G; the two together stop at 32G. No platform runners.
        cachyos-x8664-main:
          ci_caps: [unity]
          ci_cpus: 8-13,24-29
          ci_memory_max: 32G
          ci_unity_cpus: 8-13,24-29
          ci_unity_slot_cpus: ["8-10,24-26", "11-13,27-29"]
          ci_unity_memory_max: 32G
          ci_unity_slot_memory_max: 16G
        # windows-media-ci, the Hyper-V VM: 12 vcores / 24 threads, SMT siblings
        # are n and n+1 (lscpu), 49G. Cores 0-2 (CPUs 0-5) stay with the guest OS,
        # docker and the runner agents; each Unity slot gets three cores and stops
        # at 14G, and the two light slots, the heavy and the two Forgejo slots share
        # cores 9-11 (CPUs 18-23) and 20G.
        # No temperature: a VM has no k10temp, so the governor admits on
        # idle, PSI and memory alone.
        windows-media-ci:
          ci_caps: [light, heavy, unity, forgejo]
          ci_cpus: 6-23
          ci_memory_max: 42G
          ci_unity_cpus: 6-17
          ci_unity_slot_cpus: ["6-11", "12-17"]
          ci_unity_memory_max: 22G
          ci_unity_slot_memory_max: 14G
          ci_linux_cpus: 18-23
          ci_linux_memory_max: 20G
        # aws-build-1, the same m7a.8xlarge: build slots 1-3 of 10 cores for whole-game
        # player builds, 36G each (a build SIGKILLed at 14G on aws-burst-1, #1817;
        # razer builds in 20G), and test slots 4-9 of 5 cores and 16G, two on each build
        # slot's cores (unity_ci_slot_groups, so a group's 32G fits its build slot's 36G).
        # Core 0 stays with the OS and the SSM agent, core 31 is spare.
        aws-build-1:
          ci_caps: [unity, unity-build]
          ci_cpus: 1-31
          ci_memory_max: 116G
          ci_unity_cpus: 1-30
          ci_unity_slot_cpus: ["1-10", "11-20", "21-30", "1-5", "6-10", "11-15", "16-20", "21-25", "26-30"]
          ci_unity_memory_max: 108G
          ci_unity_slot_memory_max: [36G, 36G, 36G, 16G, 16G, 16G, 16G, 16G, 16G]
        # The Spot hosts: 16 cores with SMT (vCPU n and n+16 share core n), core 0 and its
        # twin left to the OS, five slots of three whole cores and 16G each.
        aws-spot-1:
          ci_caps: [unity]
          ci_cpus: 1-15,17-31
          ci_memory_max: 112G
          ci_unity_cpus: 1-15,17-31
          ci_unity_slot_cpus: ["1-3,17-19", "4-6,20-22", "7-9,23-25", "10-12,26-28", "13-15,29-31"]
          ci_unity_memory_max: 100G
          ci_unity_slot_memory_max: 16G
        aws-spot-2:
          ci_caps: [unity]
          ci_cpus: 1-15,17-31
          ci_memory_max: 112G
          ci_unity_cpus: 1-15,17-31
          ci_unity_slot_cpus: ["1-3,17-19", "4-6,20-22", "7-9,23-25", "10-12,26-28", "13-15,29-31"]
          ci_unity_memory_max: 100G
          ci_unity_slot_memory_max: 16G
        aws-spot-3:
          ci_caps: [unity]
          ci_cpus: 1-15,17-31
          ci_memory_max: 112G
          ci_unity_cpus: 1-15,17-31
          ci_unity_slot_cpus: ["1-3,17-19", "4-6,20-22", "7-9,23-25", "10-12,26-28", "13-15,29-31"]
          ci_unity_memory_max: 100G
          ci_unity_slot_memory_max: 16G

    # Nodes that run the game servers (apps/playground-server pins to the
    # kblab.me/game-server label, roles/node-labels sets it). Each host keeps
    # game_server_cpus out of its ci_cpus, so a CI burst cannot take the cores a
    # game's tick runs on. Moving the server to another box (a mini PC, the
    # Razer) is this group, that host's ci_cpus, and the router's LAN answer and
    # UDP forward (apps/playground-server/README.md).
    # Fleet workers: hosts fleet-dispatch places light claude sessions on, over
    # ssh. dotfiles .local/lib/fleet-hosts.sh reads this group from this file
    # alone, so its vars stay here and never move to group_vars/. Provisioned
    # by roles/fleet-worker; claude-acct token push gives it each Claude account's token. Runbook:
    # docs/runbooks/fleet-worker.md.
    #   fleet_place      false keeps a provisioned host out of placement
    #   fleet_max_live   sessions at once on it (a light item is one run unit)
    #   fleet_repos      what it clones, and the repos whose items it takes;
    #                    dest is the same path as on the workstation
    #   fleet_ssh_host  where fleet-dispatch ssh goes when ansible_host is not
    #                    it (a cloud worker: an instance id behind SSM)
    #   fleet_power      governor: the ci-runner-governor starts and stops it
    #                    on fleet-dispatch's demand (its config.json "workers")
    #   fleet_tailscale  true joins the tailnet (role tailscale-node)
    #   fleet_lease      false: a peer that never holds the fleet lease (default: Arch and
    #                    not governor-powered, so a machine that sleeps or lacks agent-web never does)
    #   ssh_host_ed25519 its /etc/ssh/ssh_host_ed25519_key.pub. Every machine in
    #                    fleet_workers, fleet_controllers and desktop_workstations
    #                    has one, and each trusts the others' under every name
    #                    it is dialed by (roles/host-identity)
    fleet_workers:
      vars:
        fleet_max_live: 1
        fleet_repos:
          - dest: ~/.dotfiles
            repo: https://github.com/Kblack0610/.dotfiles.git
      hosts:
        # The first worker (2026-11-07): wired and always on, 16 threads and
        # 32 GB since the RAM move (hc-328), 96 GB before. It ran the singleton lanes 2026-11-15 to
        # 11-16 while the workstation was down; not placed yet.
        razer-laptop:
          fleet_place: false
          ssh_host_ed25519: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINmhQxBIidZJ6HtH0d5CRf4sj0l1CPYymCrvN/dcypAa

    # Machines the human drives the fleet from: they read and start sessions
    # but never run one, so they are not fleet_workers and only the host-identity
    # play targets this group. cachyos-rog (ROG Flow, 16 GB) is the mobile seat for when the human
    # is not on Moonlight to the workstation. It roams and sleeps, so it is not
    # on the fleet-pulse roster. Host-key trust between roster machines is built
    # from this inventory (fleet-home-resilience P4).
    # Plan: ~/.claude/plans/feat-fleet-one-agent-container-image-tha.md (p1).
    fleet_controllers:
      hosts:
        cachyos-rog:
          # check-placement needs a tier on every host; probation is the
          # narrowest, and this host is in no group any workload is placed on.
          host_tier: probation
          thermal_cap_exempt: carries no load; it reads and starts sessions but runs none, and roams on battery
          # Tailnet IP: it roams off the LAN, and no DNS here resolves its name.
          ansible_host: 100.102.154.120
          ansible_user: kblack0610
          ssh_host_ed25519: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK39bl75NdWXxa1SKSpgnH1Vg2Jr+WYYHXmK+povqIes

    # No admitted game host until dedicated capacity is commissioned (ask OqbBvu).
    game_server_nodes:
      hosts: {}

    # Discrete GPU switched off (roles/dgpu-off). hp-victus is headless (Forgejo,
    # Frigate) and nothing used its RTX 4060, but the driver's GSP faulted every
    # few minutes and the card idled at 20 W on heatpipes shared with the CPU.
    dgpu_off:
      hosts:
        hp-victus:

    # The fleet's thermal standard (roles/thermal-cap): every x86 Linux machine
    # that carries load has its CPU power capped from setup, so a long job holds it
    # at most 85C sustained instead of at its limit (human, 2026-11-17: a machine
    # hot or not set up to the standard is red). Membership comes from the child
    # groups, so a host added to linux_bare_metal, watchdog_x86 (the x86 k3s nodes)
    # or desktop_workstations is capped with no edit here. An x86 Linux host outside
    # them sets thermal_cap_exempt: <why> (a cloud VM: the provider owns its
    # cooling); scripts/check-thermal-standard.py fails CI on a host with neither.
    # Out of scope: the Pis (no boost or power knob to cap), the Macs (no sysfs;
    # the firmware owns fans and clocks), Windows (the role writes Linux sysfs)
    # and the router.
    # 2026-10-23: asus held 93-96C through the Unity nightly and dropped off the
    # LAN; hp-victus peaked at 98C of 100C crit. 7 days to 2026-11-17, uncapped
    # under Unity CI: ms-a2 peaked at 99.5C, deskslim-2 at 97.6C, and the
    # workstation read a median 96.25C (p90 97C) and peaked at 106.25C.
    thermal_capped:
      children:
        linux_bare_metal:
        watchdog_x86:
        desktop_workstations:
      vars:
        # Boost off, the lever on AMD, which has no writable package power limit
        # (ms-a2's and deskslim-2's RAPL zone has no constraint files, checked
        # 2026-11-17). A host with a better lever overrides it below. Without
        # boost a core runs at base clock: 2.5GHz on ms-a2's 9955HX, 4.4GHz on
        # deskslim-2's 9900X, 4.3GHz on the workstation's 9950X3D.
        thermal_cap_boost: false
      hosts:
        # AMD. Already on the balanced profile when it hit 94C. Charge limit: on
        # the charger 24/7. 2026-11-02: still 94C peak over 12h with boost off on
        # balanced, so quiet. 2026-11-17: quiet with boost off still sat at
        # 90.5C (10m minimum) through the whole walkforward window (01:00-06:30
        # UTC, two to four shards, 27-50% CPU busy) every night, the firmware's
        # own limit, so a clock ceiling under the 3.3GHz base clock. The firmware
        # was already throttling to about 2.3GHz there; at 2.2GHz the 15m max was
        # 78.9C with walkforward on 3.3 cores (busy 40%, load15 6.8). Revisit if
        # a 15m max passes 85C under load, or the asus shards finish fewer folds.
        asus-laptop:
          thermal_cap_platform_profile: quiet
          thermal_cap_charge_limit: 80
          thermal_cap_max_freq_khz: 2200000
        # Intel: firmware PL1 is 55W (MSR; MMIO says 130W). Roughly 1.2C per
        # watt above ambient at 55W/98C, so ~40W should land near 85C. No
        # platform profile and no charge threshold in its firmware.
        # 2026-11-02: at 40/55W it still peaked at 100C over 12h (p90 85C, 4% of
        # the time above 90C); the 55W short-term limit made the peaks. 32/40W.
        # Turbo stays on: RAPL is its cap.
        hp-victus:
          thermal_cap_rapl_long_watts: 32
          thermal_cap_rapl_short_watts: 40
          thermal_cap_boost: true
        # razer-laptop (acpi-cpufreq, a global boost switch), ms-a2 and deskslim-2
        # (amd-pstate-epp) and the workstation have no platform_profile, no
        # writable RAPL limit and no charge threshold: the group default alone.

    # Whole-house audio: one host per room, each a snapclient of the snapserver
    # in apps/snapcast. See ansible/roles/audio-endpoint/README.md.
    # Dedicated boxes (Pi OS / Armbian) use the default alsa backend; add one
    # once it is flashed and on the LAN (and give it a DHCP -lan reservation),
    # e.g. the living-room Pi with the turntable on its UFO202 line input:
    #   livingroom-audio:
    #     ansible_host: 192.168.1.NNN
    #     audio_endpoint_capture: true
    audio_endpoints:
      vars:
        # The name apps/snapcast's README points clients at. *.kblab.me resolves
        # on the LAN to a k3s node (192.168.1.124), and servicelb publishes the
        # snapserver LoadBalancer ports (1704 stream, 4953 Turntable) on every
        # node. Confirm once apps/snapcast is merged and reconciled.
        audio_endpoint_snapserver_host: snapcast.kblab.me
      hosts:
        # Office: the desktop itself is the endpoint (Scarlett Solo -> HS5).
        # snapclient runs as a user service mixed into PipeWire.
        cachyos-x8664-main:
          audio_endpoint_backend: pulse
        # Living room: Giada DN24 (Raspberry Pi CM4, Pi OS bookworm, user giada)
        # with a Behringer UFO202. UFO202 out -> RX-V385 AUDIO 2 (house music);
        # UFO202 in <- turntable via a Y-splitter whose other leg feeds the
        # receiver directly, so records play live in this room and the capture
        # streams them to the snapserver Turntable source for the other rooms.
        audio-living:
          ansible_host: 192.168.1.120   # audio-living-lan
          ansible_user: giada
          audio_endpoint_capture: true
          # Synced copy goes to the receiver over HDMI so this room matches the
          # network rooms (no inter-room echo). The UFO202 out stays on an
          # analog input as a "direct records, this room only" option.
          # The box does not come back from a software reboot: it needs its
          # physical power button, so never reboot it remotely.
          audio_endpoint_playback_device: "hdmi:CARD=vc4hdmi1,DEV=0"   # 2nd HDMI port (HDMI-A-2)
        # Bedroom: Raspberry Pi 3B+ (Pi OS trixie, Wi-Fi) with the speaker on the
        # onboard 3.5mm jack, so the card to find is "Headphones" (bcm2835), not
        # a USB interface. The kitchen room is the wall tablet's browser client
        # (snapcast-tablet.js), not a Pi.
        audio-bedroom:
          ansible_host: 192.168.1.122   # audio-bedroom-lan
          audio_endpoint_card_hint: "Headphones"

    # Hetzner Cloud hosts, created by playbooks/hetzner-provision.yml through
    # the Hetzner API (token: group_vars/hetzner/vault.sops.yaml). Not on the
    # LAN: ansible_host is the public IPv4 until the host joins the tailnet.
    hetzner:
      vars:
        ansible_user: root
        thermal_cap_exempt: a Hetzner Cloud VM; Hetzner owns its cooling
        hcloud_location: hel1
        # Inbound SSH only from the home WAN IP, and only until the tailnet is
        # up; then this list goes empty and the firewall drops all inbound.
        # The home WAN IP lives in the vault because this repo is public.
        hcloud_ssh_sources: ["{{ vault_home_wan_cidr }}"]
        hcloud_ssh_public_key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
      hosts:
        # Forgejo's primary home since 2026-11-13, after hp-victus hung twice
        # (plan virtual-strolling-nova). cx33 had no capacity in nbg1 that day,
        # so hel1 at the same price. The volume holds /mnt/forgejo/data.
        forge-hel1:
          host_tier: standard
          ansible_host: 37.27.152.40   # public IPv4 from the provision play
          # On the tailnet at 100.125.203.14 since 2026-11-14 (role tailscale-node).
          # ansible_host and hcloud_ssh_sources move to it once asus' seed rsync,
          # which goes to the public IP, is done (Cutover phase).
          hcloud_server_type: cx33
          hcloud_image: debian-13
          hcloud_volume_gb: 300
          # Ports bind on the tailnet IP only. Whether Forgejo runs here is the
          # fence's call: forge-primary.kblab.me names the live host (apps/forgejo/README.md).
          forgejo_host_http_bind: 100.125.203.14
          # asus-laptop root's key for the seed rsync of /mnt/backups/forgejo-live;
          # removed after cutover.
          forgejo_host_seed_keys:
            - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICV9ptpa8CBromzDCkEEJ9lxkyDQlv2fWZwA7ncrmLSV asus-forge-seed
