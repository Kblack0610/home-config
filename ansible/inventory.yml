---
# Ansible inventory for home-config bare-metal hosts.
#
# Layers:
#   - PXE:     cold-boot OS install (unchanged)
#   - Ansible: this file — everything below the kubelet, plus non-k3s hosts
#   - Flux:    k3s workloads (unchanged)
#
# IP truth lives in infrastructure/dhcp/devices.yaml, but k3s nodes assigned
# post-devices.yaml (thinkcentre, hp-victus) are sourced from `kubectl get nodes`.
# Update both files when adding a host.

#
# IMPORTANT: the short names below (pi5-master, pi5-worker2, etc.) are
# **Ansible inventory aliases only**. They work with `ansible-playbook --limit`
# because Ansible looks them up in this file, but they are NOT DNS-resolvable.
# For ad-hoc `ssh`, `kubectl`, `curl`, etc., use the DHCP-assigned LAN name
# (`pi5-master-lan`, `pi5-worker2-lan`, ...) or the IP. The LAN names come
# from `infrastructure/dhcp/devices.yaml` via OpenWRT's dnsmasq.

all:
  vars:
    # Default SSH user on Linux hosts provisioned via PXE (matches the
    # workstation account that PXE kickstart seeds with the key).
    ansible_user: kblack0610

  children:
    linux_bare_metal:
      hosts:
        thinkcentre:
          ansible_host: 192.168.1.100
        hp-victus:
          ansible_host: 192.168.1.243
        # asus-laptop is reachable only on a non-standard port historically and
        # has no stable SSH alias (see lessons 2026-04-01). Kept listed but not
        # targeted by Phase A — manage via kubectl until SSH is normalised.
        asus-laptop:
          ansible_host: 192.168.1.152
          ansible_port: 2222
          unreachable: true

    # This workstation, managed over a local connection (no SSH). Hosts the
    # gungan dictation ASR daemons (see roles/asr-servers).
    desktop_workstations:
      hosts:
        cachyos-x8664-main:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3

    macos_hosts:
      hosts:
        mac-studio:
          ansible_host: 192.168.1.4
          ansible_user: kblack0610
        mac-mini:
          ansible_host: 192.168.1.7
          ansible_user: kennethblack

    pi_k3s:
      hosts:
        pi5-master:
          ansible_host: 192.168.1.20
          k3s_role: server
        pi5-worker1:
          ansible_host: 192.168.1.21
          k3s_role: agent
        pi5-worker2:
          ansible_host: 192.168.1.22
          k3s_role: agent
        pi5-worker3:
          ansible_host: 192.168.1.23
          k3s_role: agent
        pi4-worker4:
          ansible_host: 192.168.1.24
          k3s_role: agent
        pi4-worker5:
          ansible_host: 192.168.1.124
          k3s_role: agent

    openwrt:
      hosts:
        openwrt-router:
          ansible_host: 192.168.1.1
          ansible_user: root

    # NUT (Network UPS Tools) groups. The single CyberPower CP1500PFCLCDa plugs
    # into pi5-master via USB; pi5-master runs upsd + upsmon-primary and every
    # other Pi runs upsmon-secondary to honour the FSD broadcast.
    nut_server:
      hosts:
        pi5-master:
    nut_clients:
      hosts:
        pi5-worker1:
        pi5-worker2:
        pi5-worker3:
        pi4-worker4:
        pi4-worker5:
