---
# Ansible inventory for home-config bare-metal hosts.
#
# Layers:
#   - PXE:     cold-boot OS install (unchanged)
#   - Ansible: this file — everything below the kubelet, plus non-k3s hosts
#   - Flux:    k3s workloads (unchanged)
#
# IP truth lives in infrastructure/dhcp/devices.yaml, but k3s nodes assigned
# post-devices.yaml (hp-victus) are sourced from `kubectl get nodes`.
# Update both files when adding a host.

#
# IMPORTANT: the short names below (pi5-master, pi5-worker2, etc.) are
# **Ansible inventory aliases only**. They work with `ansible-playbook --limit`
# because Ansible looks them up in this file, but they are NOT DNS-resolvable.
# For ad-hoc `ssh`, `kubectl`, `curl`, etc., use the DHCP-assigned LAN name
# (`pi5-master-lan`, `pi5-worker2-lan`, ...) or the IP. The LAN names come
# from `infrastructure/dhcp/devices.yaml` via OpenWRT's dnsmasq.

all:
  vars:
    # Default SSH user on Linux hosts provisioned via PXE (matches the
    # workstation account that PXE kickstart seeds with the key).
    ansible_user: kblack0610

  children:
    linux_bare_metal:
      hosts:
        hp-victus:
          ansible_host: 192.168.1.243
        # asus-laptop listens on 2222, not 22 (that part of the 2026-04-01 note
        # still holds). The `unreachable: true` flag was removed 2026-08-12:
        # it was stale, and it was load-bearing in the wrong direction. The host
        # answers fine on 2222 with the standard key, but because it was marked
        # unmanaged, its 8TB backup drive's mounts were never owned by Ansible -
        # so when the drive re-enumerated on 2026-08-09 there was no role to fix
        # it with, and the mounts had to be repaired by hand. It now carries the
        # usb-backup-mounts role.
        asus-laptop:
          ansible_host: 192.168.1.152
          ansible_port: 2222
        # Razer Blade 14 (Ryzen 9 8945HS, 96 GB), reinstalled headless by PXE
        # kexec 2026-10-24 as a CI host, and a k3s agent since 2026-10-26. On the LAN through
        # a USB-C ethernet dongle; the DHCP reservation follows that dongle's MAC.
        razer-laptop:
          ansible_host: 192.168.1.26
          # A k3s agent since 2026-10-26, like hp-victus and asus-laptop. Pinned
          # to the server's version: an agent newer than the server is outside
          # the supported skew (hp/asus run v1.34.4 against a v1.33.5 server).
          k3s_role: agent
          k3s_install_version: v1.33.5+k3s1
          k3s_extra_args:
            - --node-label=node.kubernetes.io/friendly-name=razer-laptop
          # Its power button is a keyboard key and it sits stacked, lid shut:
          # a short press powered it off on 2026-10-24. Hold to force off.
          k3s_no_suspend_power_key: ignore

    # This workstation, managed over a local connection (no SSH). Hosts the
    # gungan dictation ASR daemons (see roles/asr-servers).
    desktop_workstations:
      hosts:
        cachyos-x8664-main:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3

    macos_hosts:
      hosts:
        mac-mini:
          ansible_host: 192.168.1.7
          ansible_user: kennethblack
          # The store-console skill drives this Chrome over ssh with the
          # Playwright Extension; the person signs in to the store consoles here.
          brew_extra_casks: [google-chrome]

    # Windows PCs, managed over Windows OpenSSH (see docs/windows-machines.md
    # for the one-time paste that enables sshd and trusts the workstation key).
    # roles/windows-agent-tools makes PowerShell sshd's default shell, hence
    # ansible_shell_type: powershell. It also works on a PC whose sshd shell is
    # still cmd (checked 2026-10-26), so a new PC needs no override.
    windows_hosts:
      vars:
        ansible_connection: ssh
        ansible_shell_type: powershell
      hosts:
        # The living-room Windows and media box (Win10 Pro, Wi-Fi only), and
        # the infra Windows test host: agents drive it over SSH, and it is an
        # opt-in org runner for Windows-only issues, the way mac-mini is for
        # macOS. Not a CI gate. Was living-room-pc (.121) until 2026-10-26.
        windows-media:
          ansible_host: 192.168.1.8   # windows-media-lan
          ansible_user: hughl
          windows_hostname: WINDOWS-MEDIA
          # Agents need a signed-in desktop; this brings it back after a reboot
          # or power cut with no one at the TV.
          windows_baseline_autologon: true

    pi_k3s:
      hosts:
        pi5-master:
          ansible_host: 192.168.1.20
          k3s_role: server
        pi5-worker1:
          ansible_host: 192.168.1.21
          k3s_role: agent
        pi5-worker2:
          ansible_host: 192.168.1.22
          k3s_role: agent
        pi5-worker3:
          ansible_host: 192.168.1.23
          k3s_role: agent
        pi4-worker4:
          ansible_host: 192.168.1.24
          k3s_role: agent
        pi4-worker5:
          ansible_host: 192.168.1.124
          k3s_role: agent

    openwrt:
      hosts:
        openwrt-router:
          ansible_host: 192.168.1.1
          ansible_user: root

    # AdGuard Home - the LAN's filtering resolver, a Raspberry Pi 3B running
    # docker-compose OUTSIDE k3s (it must survive cluster outages, and it owns
    # the *.kblab.me rewrites the cluster's own ingress depends on).
    #
    # Added 2026-09-01. It had been unmanaged since 2026-03: its AdGuardHome.yaml
    # existed only on the SD card, and its node_exporter was installed by hand.
    # .193 was also a DYNAMIC lease that the router hardcodes as its DNS
    # upstream - now pinned in infrastructure/dhcp/devices.yaml.
    adguard:
      hosts:
        pi3-adguard:
          ansible_host: 192.168.1.193

    # Pis that arm the SoC hardware watchdog (roles/hw-watchdog), so a freeze
    # resets the box instead of waiting for someone to pull the plug.
    watchdog_pis:
      children:
        adguard:
      hosts:
        audio-living:
        audio-bedroom:

    # Pis that stream kernel messages to pi5-master and export the undervoltage
    # latch (roles/crash-evidence). Wired only: netconsole needs netpoll, which
    # the Pi Wi-Fi driver (brcmfmac) lacks, so audio-bedroom is not here.
    netconsole_senders:
      children:
        adguard:
      hosts:
        audio-living:

    # NUT (Network UPS Tools) groups. The single CyberPower CP1500PFCLCDa plugs
    # into pi5-master via USB; pi5-master runs upsd + upsmon-primary and every
    # other Pi runs upsmon-secondary to honour the FSD broadcast.
    nut_server:
      hosts:
        pi5-master:
    nut_clients:
      hosts:
        pi5-worker1:
        pi5-worker2:
        pi5-worker3:
        pi4-worker4:
        pi4-worker5:

    # Self-hosted GitHub Actions runners for BlackNBrownStudios/platform
    # (see the "Linux CI runners" play in site.yml).
    # GitHub has no runner priority - an idle runner with matching labels takes
    # the next job - so the slot counts ARE the priority. heavy jobs publish
    # fixed host ports (postgres 5432, mailpit 1025/8025, app ports), so never
    # more than one heavy slot per host. CPU/memory caps are in ci_hosts below.
    # Slot counts are mirrored in apps/github-runner-exporter
    # RUNNER_ROSTER; scripts/check-runner-roster.py fails CI when they disagree.
    linux_ci_runners:
      hosts:
        # Two light slots, was three until 2026-10-28: over the 24h before, asus
        # averaged 60% CPU, peaked at load 57 on 16 threads and 94C, and it holds
        # forgejo and the databases. The third slot moved to razer.
        asus-laptop:
          ci_light_slots: 2
          ci_heavy_slots: 1
        # The heavy slot was 0 for a few hours on 2026-11-03 while two Unity
        # slots filled its 20G ci.slice; with Unity gone it fits again.
        hp-victus:
          ci_light_slots: 2
          ci_heavy_slots: 1
        # One of each since 2026-11-10, on cores of their own (ci_linux_cpus in
        # ci_hosts). Three light and a heavy shared Unity's cores at a quarter of
        # its weight and blew their caps (platform #1488, #1489).
        razer-laptop:
          ci_light_slots: 1
          ci_heavy_slots: 1

    # BNB Unity runner pool (added 2026-10-05; the "Unity CI runner pool" play in
    # site.yml). Org-scoped, label `unity`, for every game repo. Each slot runs
    # one Unity job at a time (a PlayMode shard, an EditMode run, a DodginBalls
    # build), about 4-6 GB each. CPU/memory caps are in ci_hosts below. Every
    # host here is one activation on the shared Unity serial.
    # Mirrored in RUNNER_ROSTER like linux_ci_runners above.
    #
    # Not asus-laptop or hp-victus: since 2026-11-03 both are light/heavy
    # platform workers only. They are k3s nodes, and Unity on them broke the
    # cluster as well as the jobs. asus holds forgejo and the databases and ran
    # at 90C with load 31-35 on 16 threads even with its Unity slot idle.
    # hp-victus has 31G: two Unity slots peaked at 20.2G, its whole CI budget,
    # with 279 OOM kills in the Unity slices from 10-29 to 11-03, and on three
    # of those days the host ran out and the kernel killed litellm and
    # prometheus. Do not add either back; aws-burst-1 is the overflow.
    unity_ci_runners:
      hosts:
        # One slot at first: the same 8 Unity threads as asus had. Its first pool shards
        # (2026-10-24 PlayMode 4 green, 2026-10-26 PlayMode 3 one flaky timed
        # test) match the other hosts, which each fail one different timed test
        # per run.
        # Takes full runs too (unity_ci_full defaults to true). It was reserved
        # for merge gates 2026-10-26 to 10-27; since playground gates run on the
        # pool with a narrow pick, the reservation only slowed the nightly.
        # Several slots since 2026-10-28, each on cores of its own
        # (ci_unity_slot_cpus in ci_hosts), so they cannot starve each other's
        # real-time tests the way asus's two did. In the 24h before, razer
        # averaged 31% CPU, peaked at 65C and used at most 31% of its memory,
        # while about 30 Unity jobs waited on average. Two slots of three cores
        # each the first evening, three of two cores each from 20:00 the same
        # day with about 40 jobs queued. If razer's timed tests fail more often
        # than the other hosts', go back to two.
        # Five since 2026-10-29: slots 4 and 5 float over all of razer's Unity
        # cores and only take work while ci-runner-governor admits them (it
        # withholds a slot when CPU pressure or idle say the host is full). 37
        # jobs queued with razer at 34% CPU and 76G free; the governor, not a
        # fixed count, decides how many of the five run.
        # Two since 2026-11-02, three cores each, as the rule above says: over
        # 10-28 to 11-02 a razer PlayMode job failed 24% of the time against
        # mac-studio's 7%, every FAIL of the 11-02 nightly ran on razer, and the
        # classes were timed ones (GadgetMoves, WeightedStart, SkylineMoves).
        # Failures did not grow with more razer jobs at once, so the two-core
        # slot was the limit, not its neighbours.
        # One since 2026-11-10: the second slot's three cores went to the
        # platform runners (linux_ci_runners), which had none of their own.
        razer-laptop:
          unity_ci_slots: 1
          unity_ci_full: true
          unity_ci_wide: true
          unity_ci_gate: true
        # The workstation, the human's work machine: merge gates only
        # (unity_ci_full false, so no nightly, release or Multi run lands here).
        # apps/ci-runner-governor/config.json repeats this as "full": false for its admit.
        # Each slot has its own three-core cpuset and a 16G cap (ci_hosts below).
        # Uncapped slots took 12 cores and 48G in October; the human asked for
        # these two again on 2026-11-03, once unity-core-playground stopped
        # running a gate's pre-flight here, so a gate's only Unity on this machine
        # is a pool slot. Add a third only after a day of load and temperatures.
        cachyos-x8664-main:
          unity_ci_slots: 2
          unity_ci_full: false
          unity_ci_gate: true
        # The AWS overflow box (platform infra/aws-ci-burst, Terraform), added
        # 2026-11-03: an on-demand m7a.8xlarge in us-east-2a with six slots (five since 11-10). It
        # has no inbound port; SSH runs through SSM Session Manager with the bnb
        # AWS profile, so the workstation needs session-manager-plugin. ansible_host
        # is the instance id: after a Terraform -replace, take the new one from
        # `terraform output -json instance_ids`. Ubuntu, so the editor images are pulled
        # on the box (unity_ci_images_pull) instead of copied. The governor starts
        # and stops it (docs/runbooks/unity-ci-host.md); start it before running
        # the play against it.
        aws-burst-1:
          ansible_host: i-0f1ecf35dc0e78146
          ansible_user: ubuntu
          ansible_ssh_common_args: >-
            -o ProxyCommand="aws ssm start-session --profile bnb --region us-east-2
            --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p"
          # Five since 2026-11-10 (playground ucp-1521): slot 1 is ten cores wide and
          # carries host-aws-burst-1-wide, so Multi can be pinned to it and compared
          # with razer-laptop's slots (Multi failed on CPU at five cores, #1957).
          # It matched razer (Multi 11 ok in 43 min), so it also carries unity-wide:
          # Multi, Soak and Playloop then have a second host (playground ucp-1752).
          unity_ci_slots: 5
          unity_ci_slot_labels:
            1: [host-aws-burst-1-wide, unity-wide]
          unity_ci_full: true
          unity_ci_gate: true
          unity_ci_images_pull: true
          # Base images only: every player build asks for the lan label (playground
          # release.yml, perf-round.yml since #1817), and tests use the base flavor.
          # The windows, mac and android flavors held 63G of its 400G CI volume when
          # it filled on 2026-11-05 (playground ucp-790).
          unity_ci_images:
            - unityci/editor:ubuntu-6000.0.72f1-base-3
            - unityci/editor:ubuntu-6000.0.85f1-base-3
            - unityci/editor:ubuntu-6000.3.27f1-base-3
          unity_ci_lan: false
          # The SSM tunnel copies at under 1 MB/s; S3 is the fast path (platform
          # infra/aws-ci-burst libraries.tf).
          unity_ci_library_s3: aws-burst-1-libraries-311141527647
          # asset-library-hd comes through S3 too, so HD and Slim tour run here as well
          # as on razer-laptop (playground ucp-1752).
          unity_ci_hd_library: true
        # The player-build host (platform infra/aws-ci-burst, added 2026-11-10): an
        # on-demand m7a.8xlarge with a 600G volume, reached like aws-burst-1 (SSM, the
        # same instance profile and library bucket). Its runners carry unity-build and
        # no unity or unity-full (unity_ci_pool, unity_ci_build), so playground
        # release.yml's builds run here and no gate or nightly can. The governor starts
        # it when a build waits (apps/ci-runner-governor/config.json, dedicated).
        # Default image list: desktop builds need the windows flavor.
        aws-build-1:
          ansible_host: i-0856b245ff7a81321
          ansible_user: ubuntu
          ansible_ssh_common_args: >-
            -o ProxyCommand="aws ssm start-session --profile bnb --region us-east-2
            --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p"
          unity_ci_slots: 3
          unity_ci_pool: false
          unity_ci_build: true
          unity_ci_full: false
          unity_ci_images_pull: true
          unity_ci_lan: false
          unity_ci_library_s3: aws-burst-1-libraries-311141527647
        # The Spot twin (platform infra/aws-ci-burst, applied 2026-11-10 when the Mac
        # Studio's six slots left the pool): same m7a.8xlarge, its own 400G data volume,
        # stops on interruption. The governor starts it before aws-burst-1. Six plain
        # slots, no wide slot: Multi and the lan jobs stay on their own track (ucp-1521).
        # No unity_ci_gate: a Spot reclaim would kill a merge gate, so gates stay on the
        # non-preemptible hosts and this one takes full runs only (playground ucp-1778).
        aws-burst-2:
          ansible_host: i-051f266179192763e
          ansible_user: ubuntu
          ansible_ssh_common_args: >-
            -o ProxyCommand="aws ssm start-session --profile bnb --region us-east-2
            --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p"
          unity_ci_slots: 6
          unity_ci_full: true
          unity_ci_images_pull: true
          unity_ci_images:
            - unityci/editor:ubuntu-6000.0.72f1-base-3
            - unityci/editor:ubuntu-6000.0.85f1-base-3
            - unityci/editor:ubuntu-6000.3.27f1-base-3
          unity_ci_lan: false
          unity_ci_library_s3: aws-burst-1-libraries-311141527647

    # macOS hosts in the same Unity pool (site.yml, "Unity CI runner pool
    # (macOS)"). Native editor, no container, so no ci_hosts budget: macOS has
    # no cpusets. Mirrored in RUNNER_ROSTER like unity_ci_runners.
    unity_ci_mac_runners:
      # No Mac in the pool since 2026-11-10: the Mac Studio, its only host, was
      # sold and its six slots moved to aws-burst-2. Add a Mac here to bring the
      # pool back; RUNNER_ROSTER mirrors it.
      hosts: {}

    # One CPU and memory budget per CI host (roles/ci-host-budget): every runner
    # and container of every CI workload on the host shares it, and what is left
    # stays with k3s and the OS. Until 2026-10-24 each workload had its own cap,
    # and on asus they added up to 64G of its 62G before k3s, while hp-victus's
    # Unity runners had no cap at all. Both are k3s nodes; asus holds forgejo,
    # the databases and most PVs, so a CI meltdown there is a cluster outage.
    # Starting values, tuned against a full nightly.
    ci_hosts:
      hosts:
        # Ryzen 9 5900HX, 16 threads alike, 62 GB (+ zram). Platform jobs only
        # (no Unity, see unity_ci_runners).
        asus-laptop:
          ci_cpus: 4-15
          ci_memory_max: 36G
          ci_linux_memory_max: 24G
        # i7-13700HX: CPUs 0-15 are the P-core threads, 16-23 the E-cores.
        # k3s (redis, ntfy) keeps four E-cores. 31 GB, no swap; k3s pods take
        # about 9G. P-core threads 12-15 are the game server's (game_server_cpus
        # in game_server_nodes below), so CI skips them. Platform jobs only (no
        # Unity, see unity_ci_runners), so they get the whole CI budget: a heavy
        # job peaked at 11.3G.
        hp-victus:
          ci_cpus: 0-11,16-19
          ci_memory_max: 20G
          ci_linux_memory_max: 20G
        # 8 cores / 16 threads, SMT siblings are n and n+8. Cores 0-1 (CPUs
        # 0-1, 8-9) are k3s and the OS; k3s_cpus caps pods to 4 CPUs of
        # allocatable, after 6-CPU backtests landed beside CI and the 15-minute
        # load hit 18 (2026-11-10). Unity
        # gets cores 2-4 for its one slot and the platform runners cores 5-7,
        # each on its own, so neither is throttled by the other's weight.
        # 93 GB usable, so CI gets most of it; a Unity job peaks around 8 GB. A
        # slot stops at 20G: without a cap each took the 32G default, five could
        # reach 160G against the 60G Unity budget, and one shard was killed on
        # 11-02 after 462 s.
        razer-laptop:
          ci_cpus: 2-7,10-15
          ci_memory_max: 72G
          ci_unity_cpus: 2-4,10-12
          ci_unity_slot_cpus: ["2-4,10-12"]
          ci_unity_memory_max: 60G
          ci_linux_cpus: 5-7,13-15
          k3s_cpus: 0-1,8-9
          ci_unity_slot_memory_max: 20G
          ci_linux_memory_max: 40G
        # The workstation: Ryzen 9 7900X, 12 cores / 24 threads, SMT siblings are
        # n and n+12, 124G. Cores 0-1 and 8-11 (CPUs 0-1, 8-13, 20-23) stay with
        # the human's desktop and agents. Each Unity slot gets three cores of its
        # own and stops at 16G; the two together stop at 32G, a quarter of the
        # machine. No platform runners.
        cachyos-x8664-main:
          ci_cpus: 2-7,14-19
          ci_memory_max: 32G
          ci_unity_cpus: 2-7,14-19
          ci_unity_slot_cpus: ["2-4,14-16", "5-7,17-19"]
          ci_unity_memory_max: 32G
          ci_unity_slot_memory_max: 16G
        # m7a.8xlarge on-demand (platform infra/aws-ci-burst, since 11-04: Spot
        # reclaimed the 12xlarge 4 times in 9 h): 32 real cores (no SMT), 128 GiB.
        # Core 0 stays with the OS and the SSM agent; cores 1-30 go to one slot of
        # 10 (the wide one, see unity_ci_slot_labels) and four of 5, core 31 is spare. Not 8 slots of 4: at 4 cores a slot ran 3.5x
        # oversubscribed and a batch's first scene took up to 21 s to compose,
        # timing out SwapTo (fixed at 6 cores by #518). Each slot stops at 20G
        # since 11-10 (14G before, over a PlayMode shard's 13.9G max): the wide slot runs
        # Multi's peers, and five at 20G is the 100G Unity budget. Slot 6 was removed by hand on
        # 11-10 (unit, home and org runner), as the play's header says. No k3s and no platform runners here.
        aws-burst-1:
          ci_cpus: 1-31
          ci_memory_max: 112G
          ci_unity_cpus: 1-30
          ci_unity_slot_cpus: ["1-10", "11-15", "16-20", "21-25", "26-30"]
          ci_unity_memory_max: 100G
          ci_unity_slot_memory_max: 20G
        # aws-build-1, the same m7a.8xlarge: three slots of 10 cores for whole-game
        # player builds, 36G each (a build SIGKILLed at 14G on aws-burst-1, #1817;
        # razer builds in 20G). Core 0 and core 31 as on aws-burst-1.
        aws-build-1:
          ci_cpus: 1-31
          ci_memory_max: 116G
          ci_unity_cpus: 1-30
          ci_unity_slot_cpus: ["1-10", "11-20", "21-30"]
          ci_unity_memory_max: 108G
          ci_unity_slot_memory_max: 36G
        # Spot twin of aws-burst-1, the same 32 cores and 128 GiB: six slots of five
        # cores, each stopping at 16G (a PlayMode shard peaks at 13.9G), 96G of the
        # 100G Unity budget.
        aws-burst-2:
          ci_cpus: 1-31
          ci_memory_max: 112G
          ci_unity_cpus: 1-30
          ci_unity_slot_cpus: ["1-5", "6-10", "11-15", "16-20", "21-25", "26-30"]
          ci_unity_memory_max: 100G
          ci_unity_slot_memory_max: 16G

    # Nodes that run the game servers (apps/playground-server pins to the
    # kblab.me/game-server label, roles/game-server-node sets it). Each host keeps
    # game_server_cpus out of its ci_cpus, so a CI burst cannot take the cores a
    # game's tick runs on. Moving the server to another box (a mini PC, the
    # Razer) is this group, that host's ci_cpus, and the router's LAN answer and
    # UDP forward (apps/playground-server/README.md).
    # Fleet workers: hosts fleet-dispatch places light claude sessions on, over
    # ssh. dotfiles .local/lib/fleet-hosts.sh reads this group from this file
    # alone, so its vars stay here and never move to group_vars/. Provisioned
    # by roles/fleet-worker; the human signs each account in once. Runbook:
    # docs/runbooks/fleet-worker.md.
    #   fleet_place      false keeps a provisioned host out of placement
    #   fleet_max_live   sessions at once on it (a light item is one run unit)
    #   fleet_repos      what it clones, and the repos whose items it takes;
    #                    dest is the same path as on the workstation
    #   fleet_state_host where its queue and ask writes go (AGENT_STATE_HOST)
    #   fleet_ssh_host   where fleet-dispatch ssh goes when ansible_host is not
    #                    it (a cloud worker: an instance id behind SSM)
    #   fleet_power      governor: the ci-runner-governor starts and stops it
    #                    on fleet-dispatch's demand (its config.json "workers")
    #   fleet_tailscale  true installs tailscale; `tailscale up` is the human's
    fleet_workers:
      vars:
        fleet_state_host: pc-home-cachy-main.lan
        fleet_max_live: 1
        fleet_repos:
          - dest: ~/.dotfiles
            repo: https://github.com/Kblack0610/.dotfiles.git
      hosts:
        # The first worker (2026-11-07), picked for headroom: 16 threads and
        # 96 GB. Not placed until the role reports it ready and the human has
        # signed it in.
        razer-laptop:
          fleet_place: false

    game_server_nodes:
      hosts:
        hp-victus:
          game_server_cpus: 12-15

    # Hosts whose CPU power is capped so CI holds them below their thermal limit
    # (roles/thermal-cap). 2026-10-23: asus held 93-96C through the Unity
    # nightly and dropped off the LAN; hp-victus peaked at 98C of 100C crit.
    # Target: at most 85C sustained over a full nightly.
    thermal_capped:
      hosts:
        # AMD: no writable package power limit, so boost goes off. Already on
        # the balanced profile when it hit 94C. Charge limit: on the charger 24/7.
        # 2026-11-02: still 94C peak over 12h with boost off on balanced, so quiet.
        asus-laptop:
          thermal_cap_platform_profile: quiet
          thermal_cap_boost: false
          thermal_cap_charge_limit: 80
        # Intel: firmware PL1 is 55W (MSR; MMIO says 130W). Roughly 1.2C per
        # watt above ambient at 55W/98C, so ~40W should land near 85C. No
        # platform profile and no charge threshold in its firmware.
        # 2026-11-02: at 40/55W it still peaked at 100C over 12h (p90 85C, 4% of
        # the time above 90C); the 55W short-term limit made the peaks. 32/40W.
        hp-victus:
          thermal_cap_rapl_long_watts: 32
          thermal_cap_rapl_short_watts: 40
        # acpi-cpufreq with a global boost switch. No platform_profile, no
        # writable RAPL limit, no charge threshold (the battery holds at ~97%,
        # "Not charging", on AC).
        razer-laptop:
          thermal_cap_boost: false

    # Whole-house audio: one host per room, each a snapclient of the snapserver
    # in apps/snapcast. See ansible/roles/audio-endpoint/README.md.
    # Dedicated boxes (Pi OS / Armbian) use the default alsa backend; add one
    # once it is flashed and on the LAN (and give it a DHCP -lan reservation),
    # e.g. the living-room Pi with the turntable on its UFO202 line input:
    #   livingroom-audio:
    #     ansible_host: 192.168.1.NNN
    #     audio_endpoint_capture: true
    audio_endpoints:
      vars:
        # The name apps/snapcast's README points clients at. *.kblab.me resolves
        # on the LAN to a k3s node (192.168.1.124), and servicelb publishes the
        # snapserver LoadBalancer ports (1704 stream, 4953 Turntable) on every
        # node. Confirm once apps/snapcast is merged and reconciled.
        audio_endpoint_snapserver_host: snapcast.kblab.me
      hosts:
        # Office: the desktop itself is the endpoint (Scarlett Solo -> HS5).
        # snapclient runs as a user service mixed into PipeWire.
        cachyos-x8664-main:
          audio_endpoint_backend: pulse
        # Living room: Giada DN24 (Raspberry Pi CM4, Pi OS bookworm, user giada)
        # with a Behringer UFO202. UFO202 out -> RX-V385 AUDIO 2 (house music);
        # UFO202 in <- turntable via a Y-splitter whose other leg feeds the
        # receiver directly, so records play live in this room and the capture
        # streams them to the snapserver Turntable source for the other rooms.
        audio-living:
          ansible_host: 192.168.1.120   # audio-living-lan
          ansible_user: giada
          audio_endpoint_capture: true
          # Synced copy goes to the receiver over HDMI so this room matches the
          # network rooms (no inter-room echo). The UFO202 out stays on an
          # analog input as a "direct records, this room only" option.
          # The box does not come back from a software reboot: it needs its
          # physical power button, so never reboot it remotely.
          audio_endpoint_playback_device: "hdmi:CARD=vc4hdmi1,DEV=0"   # 2nd HDMI port (HDMI-A-2)
        # Bedroom: Raspberry Pi 3B+ (Pi OS trixie, Wi-Fi) with the speaker on the
        # onboard 3.5mm jack, so the card to find is "Headphones" (bcm2835), not
        # a USB interface. The kitchen room is the wall tablet's browser client
        # (snapcast-tablet.js), not a Pi.
        audio-bedroom:
          ansible_host: 192.168.1.122   # audio-bedroom-lan
          audio_endpoint_card_hint: "Headphones"
