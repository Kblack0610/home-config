---
# The ansible-runner pod's ~/.ssh/known_hosts, from the inventory's ssh_host_ed25519
# (apps/ansible-runner/cronjob.yaml); it writes the running user's ~/.ssh/known_hosts, so run it in the pod only. A host with no key there is not trusted, so ssh to it fails.
- name: Trust the inventory's host keys in the runner pod
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Write known_hosts
      ansible.builtin.import_role:
        name: host-identity
        tasks_from: runner_known_hosts
