#   become: true
#   gather_facts: true
#   roles:
#     - role: k3s-agent
#       tags: [k3s]

# dodginballs Unity runner — PRIMARY: hp-victus (32 GB, Arch, k3s node with
# ComfyUI+Prometheus+OpenClaw running but idle). Uses the github-actions-runner-linux
# role with gh_runner_pat override (different repo than thinkcentre's platform binding).
# Labels include 'unity' so the dodginballs release workflow (runs-on: [self-hosted, unity])
# lands here. asus-laptop will join the pool when it comes online (flip its
# unreachable flag + re-run the playbook).
#
# thinkcentre-unity is INTENTIONALLY not in this host list — its systemd unit is
# stopped + disabled (manual save, not decommission). Bring it back with
# `ssh thinkcentre 'sudo systemctl enable --now actions.runner.thinkcentre-unity'`.
- name: dodginballs Unity runner (hp-victus primary)
  hosts: hp-victus
  become: true
  gather_facts: true
  roles:
    - role: github-actions-runner-linux
      vars:
        gh_runner_repo: dodginballs
        gh_runner_name: "{{ inventory_hostname }}-unity"
        gh_runner_labels: [self-hosted, linux, x64, unity]
        gh_runner_pat: "{{ vault_github_dodginballs_pat }}"
      tags: [runner, ci, dodginballs]

# Mac Studio consolidated MLX gateway — single mlx-openai-server (cubist38)
# process serving LLMs, VLMs, and embeddings from one OpenAI-compatible
# endpoint at :8090. Replaces the legacy three-service layout
# (`launchd-mlx-services` role on 8080/8081/8082). Stays on a
# non-conflicting port during the migration soak — both stacks coexist
# until apps/litellm/configmap.yaml is cut over and the legacy role is
# retired (see role README). Embedding gap (previously bridged by a
# stand-alone Ollama LaunchAgent on :8083, now removed) is served by
# this same mlx-openai-server process.
- name: Mac Studio MLX gateway (mlx-openai-server via launchd)
  hosts: mac-studio
  gather_facts: true
  roles:
    - role: launchd-mlx-openai-server
      tags: [mlx-openai, mac, llm]
