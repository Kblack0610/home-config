---
# Top-level playbook. Bind roles to host groups here.
#
# Run:
#   ansible-playbook playbooks/site.yml
#   ansible-playbook playbooks/site.yml --limit thinkcentre
#   ansible-playbook playbooks/site.yml --limit thinkcentre --check --diff
#
# The github-actions-runner-linux role is now bound only to hp-victus (dodginballs
# Unity runner); the thinkcentre platform runner was decommissioned 2026-06-18.
# Future phases will add roles here (k3s-agent, launchd-mlx, openwrt-config, etc.).

- name: Local ASR dictation daemons (Parakeet + whisper.cpp) on this workstation
  # See roles/asr-servers/README.md. Parakeet (:8771) is the gungan default —
  # a transducer that returns empty on silence, so dictation never invents words.
  # whisper.cpp-server (:8772) is the VAD-hardened fallback. Tasks self-elevate
  # (pacman/loginctl use become) so the play runs as the local user for the
  # systemd --user units.
  hosts: cachyos-x8664-main
  gather_facts: true
  roles:
    - role: asr-servers
      tags: [asr, ml, dictation]

- name: Bootstrap — ensure Python is installed so Ansible modules can run
  hosts: thinkcentre
  become: true
  gather_facts: false
  tasks:
    - name: Check for python3
      ansible.builtin.raw: command -v python3
      register: python3_check
      changed_when: false
      failed_when: false
      check_mode: false  # Always run — this is read-only and the next task needs its output.

    - name: Install python (via pacman) if missing
      ansible.builtin.raw: pacman -Sy --noconfirm --needed python
      when: (python3_check.rc | default(1)) != 0

- name: Disable lid-close / suspend on laptop k3s nodes
  # See ansible/roles/k3s-node-no-suspend/README.md — without this, closing
  # a laptop lid removes the node from the cluster (the 2026-05 hp-victus
  # incident took 4 workloads offline for ~2 weeks).
  hosts: hp-victus:asus-laptop
  become: true
  gather_facts: true
  roles:
    - role: k3s-node-no-suspend
      tags: [no-suspend, k3s]

# DECOMMISSIONED 2026-06-18: the thinkcentre platform [self-hosted, linux] runner
# is gone. platform #833 moved the release gate to ubuntu-latest, and #854/#856
# moved preview-smoke + vikunja-close-on-merge to ubuntu-latest (Vikunja reached
# over its public host instead of LAN). No GitHub workflow targets
# [self-hosted, linux] anymore, so this binding was removed and the runner
# deregistered from BlackNBrownStudios/platform. CI is now: Forgejo Actions =
# primary in-cluster (resilient, replicas:2) + github-hosted cloud for the rest.
# The github-actions-runner-linux role is KEPT — the dodginballs Unity runner
# (hp-victus, below) still uses it.

- name: macOS baseline + monitoring (safe Phase D roles)
  hosts: macos_hosts
  gather_facts: true
  roles:
    - role: brew-common
      tags: [brew, mac]
    - role: node-exporter-mac
      tags: [monitoring, mac]

# Phase B: k3s-agent role is AUTHORED but not bound. Applying it against
# running cluster nodes reinstalls k3s — the user enables this binding when
# they are ready to converge the fleet (set vault_k3s_token first).
#
# - name: k3s cluster nodes (pi_k3s + linux_bare_metal)
#   hosts: pi_k3s:linux_bare_metal
#   become: true
#   gather_facts: true
#   roles:
#     - role: k3s-agent
#       tags: [k3s]

# (FleetDM osquery agent removed 2026-07 — FleetDM was decommissioned in favour
# of the gatus fleet surface + Headwind for Android; the osquery-agent role and
# apps/fleet are gone. Device liveness now lives in the gatus `fleet`/gatus-fleet
# groups; see docs/device-fabric.md.)

# dodginballs Unity runner — PRIMARY: hp-victus (32 GB, Arch, k3s node with
# ComfyUI+Prometheus+OpenClaw running but idle). Uses the github-actions-runner-linux
# role with gh_runner_pat override (different repo than thinkcentre's platform binding).
# Labels include 'unity' so the dodginballs release workflow (runs-on: [self-hosted, unity])
# lands here. asus-laptop will join the pool when it comes online (flip its
# unreachable flag + re-run the playbook).
#
# thinkcentre-unity is INTENTIONALLY not in this host list — its systemd unit is
# stopped + disabled (manual save, not decommission). Bring it back with
# `ssh thinkcentre 'sudo systemctl enable --now actions.runner.thinkcentre-unity'`.
- name: dodginballs Unity runner (hp-victus primary)
  hosts: hp-victus
  become: true
  gather_facts: true
  roles:
    - role: github-actions-runner-linux
      vars:
        gh_runner_repo: dodginballs
        gh_runner_name: "{{ inventory_hostname }}-unity"
        gh_runner_labels: [self-hosted, linux, x64, unity]
        gh_runner_pat: "{{ vault_github_dodginballs_pat }}"
      tags: [runner, ci, dodginballs]

# NFS backup target — hp-victus exports /srv/backups so k3s workloads can keep
# an OFF-BOX backup copy on a different machine than the one that produced them.
# Motivating case: forgejo's nightly backup used to write only to a hostPath on
# its own node (asus-laptop); on 2026-07-09 that filled the node's root disk and
# evicted the whole cluster. See roles/nfs-backup-target/ and
# apps/forgejo/backup-cronjob.yaml (the NFS off-box copy step).
- name: NFS backup target (hp-victus — off-box k3s backups)
  hosts: hp-victus
  become: true
  gather_facts: true
  roles:
    - role: nfs-backup-target
      tags: [nfs, backup]

# Network UPS Tools (NUT) — single CyberPower CP1500PFCLCD plugged into
# pi5-master drives a graceful shutdown of the whole k3s fleet when grid
# power fails. The primary (server) runs upsd + upsmon-primary; every
# secondary (client) runs upsmon and halts on FSD broadcast.
#
# All five workers (incl. pi5-worker1) are nut_clients — see inventory.yml.
# (pi5-worker1's SSH-key auth was fixed and it was added to the group; the old
# "intentionally excluded" note was stale, cf. docs/nut-ups.md.)
# Verify with `upsc cyberpower` on pi5-master after first apply.
- name: NUT primary (UPS server on pi5-master)
  hosts: nut_server
  become: true
  gather_facts: true
  roles:
    - role: nut
      tags: [nut, nut-server, ups]

- name: NUT secondaries (Pi workers)
  hosts: nut_clients
  become: true
  gather_facts: true
  roles:
    - role: nut
      tags: [nut, nut-client, ups]

# Mac Studio MLX server — single mlx-openai-server (cubist38) process
# serving chat, vision, and embedding models from one OpenAI-compatible
# endpoint at :8090. Replaces the retired three-service launchd-mlx-services
# layout (8080/8081/8082) and the standalone Ollama embedding LaunchAgent
# on :11434.
#
# Also runs the powermetrics textfile sampler that feeds Apple Silicon
# GPU/ANE/CPU power into the existing node_exporter on :9100. Bound only
# to mac-studio because the mac-mini (iOS builder) doesn't run GPU
# workloads — the metrics there would always read ~0.
- name: Mac Studio MLX server (mlx-openai-server via launchd)
  hosts: mac-studio
  gather_facts: true
  roles:
    - role: launchd-mlx-server
      tags: [mlx, mac, llm]
    - role: launchd-powermetrics-textfile
      tags: [powermetrics, monitoring, mac]

# Phase C (started): OpenWrt router config via the community.openwrt collection
# (pure-shell uci modules, no Python on the router). This first role isolates
# the IoT SSID onto its own VLAN. gather_facts: false is REQUIRED - implicit
# fact-gathering runs Python on the target and fails; community.openwrt.init
# (tags: always) sets up the shell-module machinery for every phased --tags run.
# Disruptive steps are gated behind default-false vars (see the role README);
# ALWAYS run --check --diff first, and apply the firewall phase staged.
#   ansible-playbook playbooks/site.yml --limit openwrt --check --diff
- name: OpenWrt router - IoT VLAN isolation
  hosts: openwrt
  gather_facts: false
  roles:
    - role: community.openwrt.init
      tags: always
    - role: openwrt-iot-vlan
      tags: [openwrt, iot-vlan]

# Yamaha HS5 desk audio endpoint - Phase 0: bring up a USB balanced interface
# as the default ALSA sink so the cluster/HA can drive the monitors. Bound to
# the audio_endpoints group, which is EMPTY until the box is added to the
# inventory, so this play is a no-op until then (adding the host is the only
# step). Board-agnostic (Pi OS or Armbian on a Libre/BigTreeTech board).
# See ansible/roles/audio-endpoint/README.md for the staged roadmap.
- name: HS5 audio endpoint (USB balanced interface -> default ALSA sink)
  hosts: audio_endpoints
  become: true
  gather_facts: true
  roles:
    - role: audio-endpoint
      tags: [audio, hs5, alsa]
