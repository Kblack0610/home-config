---
# Top-level playbook. Bind roles to host groups here.
#
# Run:
#   ansible-playbook playbooks/site.yml
#   ansible-playbook playbooks/site.yml --limit hp-victus
#   ansible-playbook playbooks/site.yml --limit hp-victus --check --diff
#
# The github-actions-runner-linux role runs the org light/heavy runner slots on
# the linux_ci_runners group (the "Linux CI runners" play)
# and the org Unity pool slots (the "Unity CI runner pool" play).
# Future phases will add roles here (k3s-agent, openwrt-config, etc.).

- name: Local ASR dictation daemons (Parakeet + whisper.cpp) on this workstation
  # See roles/asr-servers/README.md. Parakeet (:8771) is the gungan default —
  # a transducer that returns empty on silence, so dictation never invents words.
  # whisper.cpp-server (:8772) is the VAD-hardened fallback. Tasks self-elevate
  # (pacman/loginctl use become) so the play runs as the local user for the
  # systemd --user units.
  hosts: cachyos-x8664-main
  gather_facts: true
  roles:
    - role: asr-servers
      tags: [asr, ml, dictation]
    - role: desktop-firewall
      tags: [firewall, agent-web]

- name: Workstation monitoring (node_exporter)
  # So cc:host_* and the hub:infra board see this machine's load, memory and
  # temperature, including while its two gate-only Unity pool slots run
  # (unity_ci_runners). ufw
  # default-denies inbound, hence the 9100 rule in desktop-firewall. Needs sudo:
  #   ansible-playbook playbooks/site.yml --limit cachyos-x8664-main --tags monitoring -K
  hosts: cachyos-x8664-main
  become: true
  gather_facts: true
  roles:
    - role: node-exporter-linux
      tags: [monitoring]
      vars:
        node_exporter_linux_textfile_dir: /var/lib/node_exporter/textfile
        node_exporter_linux_textfile_owner: kblack0610
    - role: desktop-firewall
      tags: [monitoring, firewall]
    # `ssh <inventory alias>` from this machine (razer-laptop, asus-laptop on
    # 2222, the Pis): /etc/ssh/ssh_config.d/40-home-inventory.conf from the
    # inventory. Apply: --limit cachyos-x8664-main --tags ssh-aliases -K
    - role: ssh-client-inventory
      tags: [ssh-aliases]

- name: Unity CI host monitoring (node_exporter, windows-media-ci)
  # So ci-runner-governor and cc:host_* read the VM's idle, PSI and memory: it is
  # not a k3s node, so the DaemonSet does not scrape it; Prometheus reaches it
  # through standalone-nodes (apps/monitoring/external-standalone-nodes.yaml).
  #   ansible-playbook playbooks/site.yml --limit windows-media-ci --tags monitoring
  hosts: windows-media-ci
  become: true
  gather_facts: true
  roles:
    - role: node-exporter-linux
      tags: [monitoring, unity-ci]

- name: Keep Linux host clocks synced (systemd-timesyncd)
  # See ansible/roles/time-sync/README.md. hp-victus was found ~102s behind the
  # rest of the cluster with NO time daemon at all, while every other node sat
  # within a second. It only surfaced because the fleet-exporter landed there and
  # read gatus results as future-dated, rendering the whole fleet DOWN - but the
  # real exposure is TLS validation, cross-node log ordering and k8s lease/token
  # expiry, none of which look like a clock problem when they break.
  #
  # Targets the Pis too even though they are already synced: the role is
  # idempotent there, and a drifting clock should be prevented fleet-wide rather
  # than fixed per-host after it bites.
  hosts: hp-victus:asus-laptop:razer-laptop:pi_k3s
  become: true
  gather_facts: true
  roles:
    - role: time-sync
      tags: [time, ntp]

- name: Core dump and local-path PV metrics (k3s nodes)
  # Run before the chart change that mounts the directory.
  #   ansible-playbook playbooks/site.yml --limit 'hp-victus:asus-laptop:razer-laptop:pi_k3s' --tags disk-metrics
  hosts: hp-victus:asus-laptop:razer-laptop:pi_k3s
  become: true
  gather_facts: false
  roles:
    - role: node-disk-metrics
      tags: [disk-metrics]

- name: Kubelet image GC under the disk alert (Pi k3s nodes)
  # See roles/k3s-image-gc/README.md. Kubelet's default 85% sat above NodeDiskLow's 80%.
  #   ansible-playbook playbooks/site.yml --limit pi_k3s --tags image-gc
  hosts: pi_k3s
  become: true
  gather_facts: false
  roles:
    - role: k3s-image-gc
      tags: [image-gc, k3s]

- name: CPU per CI runner (Linux runner hosts)
  # The Infra tab's cores per runner: each runner unit's cgroup plus its job
  # container's, every 15s, into node-exporter's textfile dir.
  #   ansible-playbook playbooks/site.yml --limit ci_hosts --tags runner-cpu
  hosts: ci_hosts
  become: true
  gather_facts: true
  roles:
    - role: ci-runner-cpu
      tags: [runner-cpu]

- name: USB backup drive mounts on asus-laptop (survive re-enumeration)
  # See roles/usb-backup-mounts/README.md. The 8TB drive dropped off USB on
  # 2026-08-09 and came back as a different device node; the seven mounts went
  # stale while df/mountpoint kept reporting healthy, and three days of backups
  # silently wrote nothing. This role hands the lifecycle to systemd
  # (x-systemd.automount) so device loss tears the mount down cleanly and device
  # return remounts it by UUID.
  hosts: asus-laptop
  become: true
  gather_facts: true
  roles:
    - role: usb-backup-mounts
      tags: [backup-mounts, storage]

- name: Emotiv EEG archive on asus-laptop
  # Where roles/emotiv-bridge on mac-mini uploads: a write-only rrsync user and
  # /mnt/nas/private/eeg. Apply before the bridge, or its uploads queue in the spool.
  #   ansible-playbook playbooks/site.yml --limit asus-laptop --tags emotiv
  hosts: asus-laptop
  become: true
  gather_facts: false
  roles:
    - role: emotiv-archive-target
      tags: [emotiv, storage]

- name: Disk scrubs and SMART on asus-laptop
  # See roles/disk-health/README.md. Nothing scrubbed these filesystems before
  # 2026-10-31, so rot in a file nobody reads would have gone unnoticed.
  hosts: asus-laptop
  become: true
  gather_facts: true
  roles:
    - role: disk-health
      tags: [disk-health, storage]

- name: Weekly Forgejo restore drill on asus-laptop
  # See roles/forgejo-restore-drill/README.md. A backup nobody restores is a guess;
  # this restores the newest one every week and records the outcome for Sentinel.
  hosts: asus-laptop
  become: true
  gather_facts: false
  roles:
    - role: forgejo-restore-drill
      tags: [forgejo-restore-drill, storage]

- name: Disable lid-close / suspend on laptop k3s nodes and CI hosts
  # See ansible/roles/k3s-node-no-suspend/README.md — without this, closing
  # a laptop lid removes the node from the cluster (the 2026-05 hp-victus
  # incident took 4 workloads offline for ~2 weeks).
  hosts: hp-victus:asus-laptop:razer-laptop
  become: true
  gather_facts: true
  roles:
    - role: k3s-node-no-suspend
      tags: [no-suspend, k3s]

# Linux CI runners (light / heavy), org-scoped for every BlackNBrownStudios
# repo. Added 2026-09-28 for the platform repo only; org-scoped 2026-11-03 so the
# game repos' small jobs (checks, plan and report steps) stop billing hosted
# minutes. Unity jobs have their own pool (the "Unity CI runner pool" play).
#
# History: the thinkcentre [self-hosted, linux] runner was decommissioned
# 2026-06-18 after a power outage froze a release gate queued on it (#833), and
# the direction became "Forgejo local, GitHub cloud". That is REVERSED for
# ordinary CI only: hosted minutes hit the org's $200 Actions budget in
# September 2026 (agent PR volume, ~86 billed min per landed PR), while
# self-hosted minutes cost $0. What keeps the June failure from coming back:
#   - release/deploy jobs (platform deploy-production, release gates, mobile
#     promote; playground steam.yml) stay on ubuntu-latest;
#   - every moved job reads its runs-on from the LINUX_RUNNER_LIGHT /
#     LINUX_RUNNER_HEAVY org variables (["self-hosted","linux","light"] and
#     ["self-hosted","linux","heavy"]), and deleting them sends everything back
#     to ubuntu-latest. A repo variable of the same name overrides the org one,
#     so no repo sets its own.
#
# Heavy jobs publish fixed host ports (postgres 5432, mailpit 1025/8025, app
# ports), so never more than one heavy slot per host.
#
# Slots per host live in inventory.yml (linux_ci_runners); the host's CI
# CPU and memory budget in ci_hosts (roles/ci-host-budget). Each slot is its own
# runner under one `linux-ci` user, with HOME set to the slot's own dir so
# parallel jobs never share a pnpm store, Playwright cache or ~/setup-pnpm, and
# a job-started hook empties the workspace before every job
# (roles/linux-ci-host/templates/job-started.sh.j2). Registration tokens come
# from the control node's `gh` CLI, which needs admin:org for an org runner
# (roles/github-actions-runner-linux/README.md), so there is no standing PAT.
#
# Lowering a slot count does NOT remove the old slot: stop and disable
# actions.runner.<host>-<slot>.service, delete it in the org's runner settings,
# and rm -rf /var/lib/linux-ci/<slot>.
- name: Linux CI runners (light / heavy)
  hosts: linux_ci_runners
  become: true
  gather_facts: true
  vars:
    linux_ci_instances: >-
      {{ (range(1, ci_light_slots + 1) | map('regex_replace', '^', 'light-') | list)
         + (range(1, ci_heavy_slots + 1) | map('regex_replace', '^', 'heavy-') | list) }}
  roles:
    - role: linux-ci-host
      tags: [runner, ci, linux-ci]
  tasks:
    - name: Register the light and heavy runner slots
      ansible.builtin.include_role:
        name: github-actions-runner-linux
        apply:
          tags: [runner, ci, linux-ci]
      loop: "{{ linux_ci_instances }}"
      loop_control:
        loop_var: ci_slot
      vars:
        gh_runner_scope: org
        gh_runner_token_source: gh
        gh_runner_install_packages: false
        gh_runner_user: linux-ci
        gh_runner_group: linux-ci
        gh_runner_user_home: "{{ linux_ci_user_home }}"
        gh_runner_home: "{{ linux_ci_user_home }}/{{ ci_slot }}"
        gh_runner_name: "{{ inventory_hostname }}-{{ ci_slot }}"
        # light or heavy, from the slot name.
        gh_runner_labels: [self-hosted, linux, x64, "{{ ci_slot.split('-')[0] }}"]
        gh_runner_slice: "{{ ci_linux_slice }}"
        gh_runner_env:
          HOME: "{{ linux_ci_user_home }}/{{ ci_slot }}"
          ACTIONS_RUNNER_HOOK_JOB_STARTED: "{{ linux_ci_job_started_hook }}"
      tags: [runner, ci, linux-ci]

- name: Fleet workers (agent sessions fleet-dispatch places over ssh)
  # See docs/runbooks/fleet-worker.md. Per user, not root: the sessions run as
  # ansible_user, at the same paths as on the workstation. The role installs
  # and reports; signing the accounts in is the human's.
  hosts: fleet_workers
  gather_facts: true
  roles:
    - role: fleet-worker
      tags: [fleet-worker, agents]

# macOS hosts (macos_hosts). Shared baseline: brew essentials, node_exporter,
# and macos-baseline (power policy + SSH key sync + auto-login/FileVault
# assert). macos-baseline's pmset tasks self-elevate (become: true), so applying
# the [mac]/[persistence] tags needs an interactive sudo password: add `-K`.
# See docs/mac-machines.md.
- name: macOS baseline + monitoring
  hosts: macos_hosts
  gather_facts: true
  roles:
    - role: brew-common
      tags: [brew, mac]
    - role: node-exporter-mac
      tags: [monitoring, mac]
    # Host persistence: auto-restart after power failure, no sleep, SSH key
    # sync, and assert auto-login/FileVault so the box comes back unattended.
    - role: macos-baseline
      tags: [mac, persistence]
    # Weekly prune of regenerable build caches, reported through the existing
    # node_exporter textfile collector. Unity roots are per-host: the mini is
    # where DodginBalls lives, and a host with no roots set skips that section.
    - role: macos-disk-reclaim
      tags: [mac, disk]
      vars:
        disk_reclaim_unity_roots: "{{ ['/Users/kennethblack/dev/Games/DodginBalls_root'] if inventory_hostname == 'mac-mini' else [] }}"

- name: CPU per CI runner (macOS runner hosts)
  # Sums each Runner.Listener's process tree %CPU every 15s into the textfile
  # dir node-exporter-mac reads. No sudo needed.
  #   ansible-playbook playbooks/site.yml --limit 'unity_ci_mac_runners:mac-mini' --tags runner-cpu
  hosts: unity_ci_mac_runners:mac-mini
  gather_facts: true
  roles:
    - role: ci-runner-cpu
      tags: [runner-cpu]

# mac-mini is the sole self-hosted mobile-CI runner. No workflow pins a runner
# by name, only by the [self-hosted, macOS, arm64] label set.
- name: macOS CI runner (mac-mini only)
  hosts: mac-mini
  gather_facts: true
  roles:
    # token_source=gh mints a registration token via the workstation's `gh` —
    # no PAT in the repo. A recovery apply against a stale registration needs
    # `-e gh_runner_mac_force_reregister=true`.
    - role: github-actions-runner-mac
      tags: [mac, runner]
    # Agents drive this Mac's desktop over ssh (agent-desktop MCP, Peekaboo).
    # Sets up the Mac for agents (sudo, Spotlight, updates, PATH), then asserts
    # the person's one-time privacy grants and no screen lock.
    - role: macos-agent-tools
      tags: [mac, agent-tools]
    # Records the Emotiv EPOC X while it is connected and uploads it encrypted
    # to the NAS (roles/emotiv-bridge/README.md). The NAS end is the
    # emotiv-archive-target play above.
    - role: emotiv-bridge
      tags: [mac, emotiv]
  tasks:
    # Unity's iOS and Mac IL2CPP modules for the editors unity-ci-host-mac
    # manages, for the playground's iOS and Mac builds on this box's
    # m1-playground-mac runner. Asserts Xcode first. No sudo.
    - name: Unity player modules
      ansible.builtin.import_role:
        name: unity-ci-host-mac
        tasks_from: modules
      tags: [mac, unity-modules]

    # The hourly prune of m1-playground-mac's game build trees. Seven held 137G on
    # 2026-11-10 and NodeDiskLow tripped (docs/mac-machines.md#build-tree-prune).
    - name: Keep the build trees from filling the disk
      ansible.builtin.import_role:
        name: unity-ci-host-mac
        tasks_from: disk
      tags: [mac, ci-disk]

# Phase B: k3s-agent role is AUTHORED but not bound. Applying it against
# running cluster nodes reinstalls k3s — the user enables this binding when
# they are ready to converge the fleet (set vault_k3s_token first).
#
# - name: k3s cluster nodes (pi_k3s + linux_bare_metal)
#   hosts: pi_k3s:linux_bare_metal
#   become: true
#   gather_facts: true
#   roles:
#     - role: k3s-agent
#       tags: [k3s]

# The first host the k3s-agent role joins. hp-victus and asus-laptop were joined
# by the PXE cluster profile before the role existed; add them here once their
# agents are pinned to the server's version (they run v1.34.4 against a v1.33.5
# server, so a converge would downgrade them). After the first join, label the
# node by hand, since a kubelet may not set node-role labels on itself:
#   kubectl label node razer-laptop node-role.kubernetes.io/workstation=true
#   ansible-playbook playbooks/site.yml --limit razer-laptop --tags k3s --check --diff
- name: k3s agent (razer-laptop)
  hosts: razer-laptop
  become: true
  gather_facts: true
  roles:
    - role: k3s-agent
      tags: [k3s]

# Fleet (osquery) agent — AUTHORED but not bound. Enrolls hosts into the
# self-hosted FleetDM server (apps/fleet, https://fleet.kblab.me) for the
# cross-OS inventory / live-query pane. Bind only AFTER apps/fleet is deployed
# and the enroll secret is stored as vault_fleet_enroll_secret (see
# apps/fleet/README.md + roles/osquery-agent/README.md). Covers macOS + Pi
# (Debian) hosts; Arch/x86 (hp-victus/cachyos) is a documented
# follow-up (osquery is AUR-only). ALWAYS --check --diff a single host first.
#
# - name: Fleet osquery agent (macOS + Pi hosts)
#   hosts: macos_hosts:pi_k3s
#   gather_facts: true
#   roles:
#     - role: osquery-agent
#       tags: [fleet, osquery]

# Game server nodes (game_server_nodes in inventory.yml): the label the
# playground server's Deployment pins to. The cores it keeps are left out of the
# host's ci_cpus, which the CI plays apply.
- name: Game server nodes
  hosts: game_server_nodes
  become: false
  gather_facts: false
  roles:
    - role: game-server-node
      tags: [game-server]

# BNB Unity runner pool: org-scoped runners every BlackNBrownStudios repo can use
# with runs-on [self-hosted, linux, unity] (added 2026-10-05). Slots per host live
# in inventory.yml (unity_ci_runners); the CPU and memory caps in ci_hosts. Each slot is its own
# runner under the actions-runner user with HOME set to the slot's dir, so slots
# never share a Unity cache or Library. OpenSSH still reads known_hosts from the
# user's passwd home, so unity-ci-host manages GitHub's keys there for every slot.
# All of a host's slots share one Unity machine id, so a host is one activation
# however many slots it has. The unity-ci-host role puts the asset-library copy
# and the editor image on the host.
#
# A new HOST is a new Unity activation on the shared Personal serial: add one
# host at a time (docs/runbooks/unity-ci-host.md, "Unity activation"). Org
# registration tokens need the workstation's gh with admin:org
# (gh auth refresh -h github.com -s admin:org).
#
# hp-victus had two repo-scoped Unity runners, each its own play, until
# 2026-10-29: hp-victus-unity-2 (dodginballs, /var/lib/actions-runner-2) and
# hp-victus-playground (/var/lib/actions-runner-playground). Both became its two
# pool slots here, so every Unity runner is defined in this one play.
#
# Lowering a slot count does NOT remove the old slot: stop and disable
# actions.runner.<host>-unity-pool-<n>.service, delete it in the org's runner
# settings, and rm -rf /var/lib/actions-runner/unity-pool-<n>.
- name: Unity CI runner pool (org-wide)
  hosts: unity_ci_runners
  become: true
  gather_facts: true
  roles:
    # unity-ci-host alone (--tags unity-ci-host) refreshes the asset-library copy
    # and editor images without touching the runners.
    - role: unity-ci-host
      tags: [runner, ci, unity-ci, unity-ci-host]
  tasks:
    - name: Require one CPU list per Unity slot when slots have their own
      ansible.builtin.assert:
        that:
          - ci_unity_slot_cpus | length in [0, unity_ci_slots]
          - unity_ci_build_slots | default(0) <= unity_ci_slots
        fail_msg: >-
          {{ inventory_hostname }} has unity_ci_slots {{ unity_ci_slots }} but
          {{ ci_unity_slot_cpus | length }} entries in ci_unity_slot_cpus, or
          unity_ci_build_slots {{ unity_ci_build_slots | default(0) }} over it.
      tags: [runner, ci, unity-ci]

    # The hourly prune and core-dump cap from linux-ci-host. Without them aws-burst-1,
    # Unity-only and so not in linux_ci_runners, filled its 400G CI volume on 2026-11-05
    # with release-tree copies, and every runner died on "No space left on device".
    - name: Keep the disk from filling
      ansible.builtin.include_role:
        name: linux-ci-host
        tasks_from: disk
        # The slots' job-started hook below reads linux_ci_unity_job_started_hook.
        public: true
        apply:
          tags: [runner, ci, unity-ci, ci-disk]
      tags: [runner, ci, unity-ci, ci-disk]

    - name: Register the Unity pool slots
      ansible.builtin.include_role:
        name: github-actions-runner-linux
        apply:
          tags: [runner, ci, unity-ci]
      loop: "{{ range(1, unity_ci_slots + 1) | list }}"
      loop_control:
        loop_var: unity_slot
      vars:
        gh_runner_scope: org
        gh_runner_token_source: gh
        gh_runner_install_packages: false
        gh_runner_user: "{{ unity_ci_user }}"
        gh_runner_group: "{{ unity_ci_group }}"
        gh_runner_user_home: "{{ unity_ci_user_home }}"
        gh_runner_home: "{{ unity_ci_user_home }}/unity-pool-{{ unity_slot }}"
        gh_runner_name: "{{ inventory_hostname }}-unity-pool-{{ unity_slot }}"
        # unity-full: the hosts full suite runs may take (unity_ci_full in inventory.yml).
        # A registered runner keeps its labels; add one to a live runner with
        # gh api -X POST orgs/BlackNBrownStudios/actions/runners/<id>/labels -f 'labels[]=unity-full'.
        # lan: the slot is on the home LAN, so it can push to git.kblab.me (Shots'
        # gallery image); through Cloudflare a push over 100 MB fails. Off for
        # aws-burst-1 (unity_ci_lan in inventory.yml).
        # unity-wide: slots with the CPU for real-time players (Multi, Soak, Playloop); only slots
        # that passed the ucp-1521 probes (unity_ci_wide, default false, for every slot on the host;
        # one slot alone through unity_ci_slot_labels, as aws-burst-1's slot 1). hd-library: the host
        # holds asset-library-hd (HD, Slim tour); defaults to unity_ci_lan, since only LAN hosts
        # got the tarball, and a cloud host sets unity_ci_hd_library once it reads it from S3.
        # unity_ci_build_slots: slots 1..N carry unity-build in place of unity, unity-full,
        # unity-wide and unity-gate, so no gate or nightly lands on them, and the rest are pool
        # slots (aws-build-1: 3 build slots, 6 test slots; ci-runner-governor's "pairs" keep a
        # build and a test off the same cores).
        # unity_ci_slot_labels adds labels to one slot, so a comparison run can be pinned to it,
        # or a job kept off it (aws-build-1: unity-release on slots 1-2 only).
        # unity-gate: the non-preemptible hosts merge gates may take (unity_ci_gate, default false);
        # a Spot host leaves it off, so a reclaim never kills a gate (playground ucp-1778).
        gh_runner_labels: "{{ [ 'self-hosted', 'linux', 'x64', 'host-' ~ inventory_hostname ] + ([ 'unity-build' ] if unity_slot <= unity_ci_build_slots | default(0) else [ 'unity' ] + ([ 'unity-full' ] if unity_ci_full | default(true) else []) + ([ 'unity-wide' ] if unity_ci_wide | default(false) else []) + ([ 'unity-gate' ] if unity_ci_gate | default(false) else [])) + ([ 'lan' ] if unity_ci_lan | default(true) else []) + ([ 'hd-library' ] if unity_ci_hd_library | default(unity_ci_lan | default(true)) else []) + (unity_ci_slot_labels | default({})).get(unity_slot, []) }}"
        # With ci_unity_slot_cpus each slot gets its own cores (roles/ci-host-budget).
        unity_slot_slice: >-
          {{ (ci_unity_slot_slice_prefix ~ unity_slot ~ '.slice') if ci_unity_slot_cpus | length else ci_unity_slice }}
        gh_runner_slice: "{{ unity_slot_slice }}"
        # UNITY_CACHE_SERVER only where the host runs an Accelerator (unity_ci_accelerator,
        # roles/unity-ci-host), so the other hosts' env, and their slots, are unchanged.
        gh_runner_env: >-
          {{ unity_slot_env | combine({'UNITY_CACHE_SERVER': unity_ci_accelerator}
          if unity_ci_accelerator | default('') | length else {}) }}
        unity_slot_env:
          HOME: "{{ unity_ci_user_home }}/unity-pool-{{ unity_slot }}"
          UNITY_MACHINE_ID_FILE: "{{ unity_ci_machine_id_file }}"
          UNITY_CI_CGROUP_PARENT: "{{ unity_slot_slice }}"
          # One asset-library LFS store per host (scripts/setup/asset-library.sh in
          # the playground): with the default under each slot's HOME, a new slot
          # downloaded the whole 7.9 GB library before its first job could start.
          ASSET_LIBRARY_LFS_STORE: "{{ unity_ci_lfs_store }}"
          # Prunes idle slots' warm trees before the job when the disk is under the floor
          # (roles/linux-ci-host, ci-disk-prune.sh --before-job). Changing this env restarts
          # every slot and kills its job: apply it with the host's slots idle.
          ACTIONS_RUNNER_HOOK_JOB_STARTED: "{{ linux_ci_unity_job_started_hook }}"
      tags: [runner, ci, unity-ci]

# BNB Unity runner pool, macOS hosts (added 2026-10-29, mac-studio until it is
# sold). The same org pool as above, labelled unity/unity-full, unity-native and
# host-<name>, without GitHub's default labels: the jobs that need the Linux
# editor image keep runs-on linux or self-hosted, and the rest (EditMode) run
# natively here. Slot counts are in
# inventory.yml (unity_ci_mac_runners). Every registered slot takes pool jobs;
# the governor cannot judge a Mac's load (no PSI or hwmon), so the slot count is
# the only limit.
#
# To retire a host (the Studio's sale): stop and uninstall each slot with
# ~/actions-runner/unity-pool-<n>/svc.sh, delete the runners in the org's
# settings, and remove the host from unity_ci_mac_runners and RUNNER_ROSTER.
- name: Unity CI runner pool (macOS)
  hosts: unity_ci_mac_runners
  gather_facts: true
  # A non-login ssh shell lacks Homebrew, whose GNU tar ansible's unarchive needs.
  environment:
    PATH: "/opt/homebrew/bin:{{ ansible_env.PATH }}"
  roles:
    - role: unity-ci-host-mac
      tags: [runner, ci, unity-ci, unity-ci-host]
  tasks:
    # A new slot copies slot 1's checkout (an APFS clone: instant, no extra disk)
    # before its runner starts, so it never clones from the forge. Eight slots
    # cold-cloning at once took asus, and Forgejo with it, down on 2026-10-29;
    # the copy also brings slot 1's imported Library. On a fresh host slot 1 has
    # no checkout yet: register it alone (unity_ci_slots: 1), let one job run,
    # then raise the count.
    - name: Seed new slots from slot 1's checkout
      ansible.builtin.shell:
        cmd: >-
          mkdir -p {{ unity_ci_mac_root }}/unity-pool-{{ item }}/_work &&
          /bin/cp -cR {{ unity_ci_mac_root }}/unity-pool-1/_work/{{ unity_ci_mac_seed_repo }}
          {{ unity_ci_mac_root }}/unity-pool-{{ item }}/_work/
        creates: "{{ unity_ci_mac_root }}/unity-pool-{{ item }}/_work/{{ unity_ci_mac_seed_repo }}"
        removes: "{{ unity_ci_mac_root }}/unity-pool-1/_work/{{ unity_ci_mac_seed_repo }}"
      loop: "{{ range(2, unity_ci_slots + 1) | list }}"
      tags: [runner, ci, unity-ci]

    - name: Register the Unity pool slots
      ansible.builtin.include_role:
        name: github-actions-runner-mac
        apply:
          tags: [runner, ci, unity-ci]
      loop: "{{ range(1, unity_ci_slots + 1) | list }}"
      loop_control:
        loop_var: unity_slot
      vars:
        gh_runner_mac_scope: org
        gh_runner_mac_token_source: gh
        gh_runner_mac_home: "{{ unity_ci_mac_root }}/unity-pool-{{ unity_slot }}"
        gh_runner_mac_name: "{{ inventory_hostname }}-unity-pool-{{ unity_slot }}"
        # No self-hosted/macOS/ARM64: with them an org slot here would take the
        # platform repo's [self-hosted, macOS] iOS jobs. Only jobs that ask for the
        # pool labels alone land here (unity-core-playground test.yml EditMode).
        gh_runner_mac_no_default_labels: true
        gh_runner_mac_labels: "{{ [ 'unity', 'unity-native', 'host-' ~ inventory_hostname ] + ([ 'unity-full' ] if unity_ci_full | default(true) else []) }}"
        gh_runner_mac_path: "{{ unity_ci_mac_path }}"
        gh_runner_mac_env:
          HOME: "{{ unity_ci_mac_root }}/unity-pool-{{ unity_slot }}"
          UNITY_CI_NATIVE: "1"
          ASSET_LIBRARY_LFS_STORE: "{{ unity_ci_mac_lfs_store }}"
      tags: [runner, ci, unity-ci]

# NFS backup source: hp-victus exports Forgejo's data (/srv/forgejo) read-only
# to asus-laptop, where the backup jobs write to other disks than the data's.
# See roles/nfs-backup-target/ and apps/forgejo/backup-cronjob.yaml.
- name: NFS backup target (hp-victus)
  hosts: hp-victus
  become: true
  gather_facts: true
  roles:
    - role: nfs-backup-target
      tags: [nfs, backup]

# Network UPS Tools (NUT) — single CyberPower CP1500PFCLCD plugged into
# pi5-master drives a graceful shutdown of the whole k3s fleet when grid
# power fails. The primary (server) runs upsd + upsmon-primary; every
# secondary (client) runs upsmon and halts on FSD broadcast.
#
# All five workers (incl. pi5-worker1) are nut_clients — see inventory.yml.
# (pi5-worker1's SSH-key auth was fixed and it was added to the group; the old
# "intentionally excluded" note was stale, cf. docs/nut-ups.md.)
# Verify with `upsc cyberpower` on pi5-master after first apply.
- name: NUT primary (UPS server on pi5-master)
  hosts: nut_server
  become: true
  gather_facts: true
  roles:
    - role: nut
      tags: [nut, nut-server, ups]

- name: NUT secondaries (Pi workers)
  hosts: nut_clients
  become: true
  gather_facts: true
  roles:
    - role: nut
      tags: [nut, nut-client, ups]

# Phase C (started): OpenWrt router config via the community.openwrt collection
# (pure-shell uci modules, no Python on the router). This first role isolates
# the IoT SSID onto its own VLAN. gather_facts: false is REQUIRED - implicit
# fact-gathering runs Python on the target and fails; community.openwrt.init
# (tags: always) sets up the shell-module machinery for every phased --tags run.
# Disruptive steps are gated behind default-false vars (see the role README);
# ALWAYS run --check --diff first, and apply the firewall phase staged.
#   ansible-playbook playbooks/site.yml --limit openwrt --check --diff
- name: OpenWrt router - IoT VLAN isolation
  hosts: openwrt
  gather_facts: false
  roles:
    - role: community.openwrt.init
      tags: always
    - role: openwrt-iot-vlan
      tags: [openwrt, iot-vlan]

# AdGuard Home on pi3 - the LAN's filtering resolver, outside k3s on purpose.
#
# CAUTION: a config change here restarts the container, which drops ALL house
# DNS for ~10-15s. That is only survivable because infrastructure/openwrt/dns.yaml
# gives dnsmasq a strict-order fallback to a public resolver; the house keeps
# resolving (unfiltered) through the restart, and the gatus "DNS filtering
# active" canary alerts if it ever fails to come back. Do not remove that
# fallback without also making this play a maintenance-window operation.
#
# ALWAYS run --check --diff first:
#   ansible-playbook playbooks/site.yml --limit pi3-adguard --check --diff
- name: AdGuard Home (pi3 - LAN filtering resolver)
  hosts: adguard
  become: true
  gather_facts: true
  roles:
    - role: adguard
      tags: [adguard, dns]

# Arm the SoC hardware watchdog on the Pis nobody should have to power-cycle.
# pi3 hard-froze three times (2026-08-09, 08-23, 09-30) and each time stayed
# dead until someone power-cycled it; the watchdog was present but unarmed.
# The living-room Giada (audio-living) hung the same way after the 2026-10-20
# power blip and stayed off the LAN for 16h until it was unplugged.
# See ansible/roles/hw-watchdog/README.md.
#   ansible-playbook playbooks/site.yml --limit watchdog_pis --tags watchdog --check --diff
- name: Hardware watchdog (reboot itself on a freeze)
  hosts: watchdog_pis
  become: true
  gather_facts: false
  roles:
    - role: hw-watchdog
      tags: [watchdog]

# Cap CPU power on the laptops that run CI, so a long job holds them below their
# thermal limit (2026-10-23: asus at 93-96C for hours before it dropped off the
# LAN; hp-victus peaked at 98C of 100C). Knobs per host in inventory.yml
# (thermal_capped). See ansible/roles/thermal-cap/README.md.
#   ansible-playbook playbooks/site.yml --limit thermal_capped --tags thermal --check --diff
- name: Thermal cap (CI laptops)
  hosts: thermal_capped
  become: true
  gather_facts: false
  roles:
    - role: thermal-cap
      tags: [thermal]

# Keep a headless host's discrete GPU off: no driver, card in D3cold. Remove
# anything holding /dev/nvidia* first, or the unload fails.
# See ansible/roles/dgpu-off/README.md.
#   ansible-playbook playbooks/site.yml --limit dgpu_off --tags dgpu-off --check --diff
- name: Discrete GPU off (headless hosts)
  hosts: dgpu_off
  become: true
  gather_facts: false
  roles:
    - role: dgpu-off
      tags: [dgpu-off, thermal]

# Make the next freeze explain itself: kernel messages stream to pi5-master
# over netconsole, and the firmware's undervoltage latch is exported to
# Prometheus. Receiver first, so the sender has somewhere to talk to.
# See ansible/roles/crash-evidence/README.md.
#   ansible-playbook playbooks/site.yml --limit pi5-master,netconsole_senders --tags crash-evidence --check --diff
- name: netconsole receiver (pi5-master - collects kernel logs from the senders)
  hosts: pi5-master
  become: true
  gather_facts: false
  roles:
    - role: netconsole-receiver
      tags: [crash-evidence, netconsole]

- name: Crash evidence (netconsole sender + undervoltage latch metric)
  hosts: netconsole_senders
  become: true
  gather_facts: true
  roles:
    - role: crash-evidence
      tags: [crash-evidence, netconsole]

# Whole-house audio endpoints: each host is one room of the Snapcast system
# (apps/snapcast). alsa backend = a dedicated Pi/Armbian box whose system
# snapclient owns a USB interface; pulse backend = a desktop whose user
# snapclient mixes into PipeWire. Opt-in capture streams a USB line input (the
# turntable) to the snapserver. No play-level become: privileged tasks
# self-elevate so the pulse backend runs against the login user's systemd
# --user manager. See ansible/roles/audio-endpoint/README.md.
- name: Audio endpoints (snapclient per room, optional turntable capture)
  hosts: audio_endpoints
  gather_facts: true
  roles:
    - role: audio-endpoint
      tags: [audio, snapcast, alsa]

# The dedicated audio boxes (not the desktop endpoint): a synced clock before
# snapclient starts, and node_exporter so fleet.kblab.me and Prometheus see
# them. The fleet check also reads snapclient's unit state, so a box that is up
# but silent shows as down. See apps/gatus-fleet/config.yaml.
- name: Audio boxes - clock and monitoring
  hosts: audio-living:audio-bedroom
  become: true
  gather_facts: true
  roles:
    - role: time-sync
      tags: [time, ntp, audio]
      vars:
        time_sync_wait_at_boot: true
    - role: node-exporter-linux
      tags: [monitoring, audio]
      vars:
        node_exporter_linux_systemd_units: "{{ ['snapclient.service'] + (['audio-endpoint-capture.service'] if audio_endpoint_capture | default(false) else []) }}"

# Bedroom Pi: onboard LEDs off, since people sleep in that room.
- name: Bedroom Pi - LEDs off
  hosts: audio-bedroom
  become: true
  gather_facts: false
  roles:
    - role: pi-leds-off
      tags: [leds, audio]

# Windows PCs over OpenSSH. windows-baseline is the lean debloat (Store apps,
# telemetry, ASUS/OneDrive removal, power, cleanup) plus the computer name;
# windows-agent-tools makes the PC drivable by an agent (PowerShell over SSH,
# script policy, the C:\tools desktop helpers).
# Reboot after the first apply: GPU scheduling, the NIC power setting and a
# new computer name only take effect on boot. See docs/windows-machines.md.
- name: Windows baseline
  hosts: windows_hosts
  gather_facts: false
  roles:
    - role: windows-baseline
      tags: [windows]
    - role: windows-agent-tools
      tags: [windows, agent-tools]

# windows_exporter, so cc:host_* and the hub:infra board see the PC's CPU and
# memory. Scraped by apps/monitoring/external-windows-nodes.yaml.
- name: Windows monitoring (windows_exporter)
  hosts: windows_hosts
  gather_facts: false
  roles:
    - role: windows-exporter
      tags: [windows, monitoring]

# The opt-in Windows test runner (org-scoped, labels self-hosted/Windows/X64/
# host-windows-media). Not a CI gate and not the Unity pool: a job lands here
# only with `runs-on: [self-hosted, windows]`. It runs at logon in the desktop
# session, so it is offline while nobody is logged on. Registration needs
# `gh` with admin:org on the control node, like the Unity pool.
- name: Windows test runner (windows-media only)
  hosts: windows-media
  gather_facts: false
  roles:
    - role: github-actions-runner-windows
      tags: [windows, runner]

# Login passwords on the PXE-built Linux hosts: the user's from
# vault_linux_login_password_hash, root's locked. Last on purpose: its assert
# fails the play while the hash is missing, and a failed host is dropped from
# every LATER play, so nothing else is held up by it. See
# roles/login-passwords/README.md.
- name: Login passwords (bare-metal Linux)
  hosts: linux_bare_metal
  become: true
  gather_facts: false
  roles:
    - role: login-passwords
      tags: [passwords]
