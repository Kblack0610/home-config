---
# Top-level playbook. Bind roles to host groups here.
#
# Run:
#   ansible-playbook playbooks/site.yml
#   ansible-playbook playbooks/site.yml --limit thinkcentre
#   ansible-playbook playbooks/site.yml --limit thinkcentre --check --diff
#
# Phase A binds only the GitHub Actions runner role to thinkcentre.
# Future phases will add roles here (k3s-agent, launchd-mlx, openwrt-config, etc.).

- name: Bootstrap — ensure Python is installed so Ansible modules can run
  hosts: thinkcentre
  become: true
  gather_facts: false
  tasks:
    - name: Check for python3
      ansible.builtin.raw: command -v python3
      register: python3_check
      changed_when: false
      failed_when: false
      check_mode: false  # Always run — this is read-only and the next task needs its output.

    - name: Install python (via pacman) if missing
      ansible.builtin.raw: pacman -Sy --noconfirm --needed python
      when: (python3_check.rc | default(1)) != 0

- name: GitHub Actions self-hosted runners (Linux bare metal)
  hosts: thinkcentre
  become: true
  gather_facts: true
  roles:
    - role: github-actions-runner-linux
      tags: [runner, ci]

- name: macOS baseline + monitoring (safe Phase D roles)
  hosts: macos_hosts
  gather_facts: true
  roles:
    - role: brew-common
      tags: [brew, mac]
    - role: node-exporter-mac
      tags: [monitoring, mac]

