---
# Top-level playbook. Bind roles to host groups here.
#
# Run:
#   ansible-playbook playbooks/site.yml
#   ansible-playbook playbooks/site.yml --limit hp-victus
#   ansible-playbook playbooks/site.yml --limit hp-victus --check --diff
#
# The github-actions-runner-linux role runs the org runners on
# the Unity pool slots and the seats that borrow them, all in the "CI runners
# (Unity slots and the seats that borrow them)" play.
# Future phases will add roles here (k3s-agent, openwrt-config, etc.).

- name: Local ASR dictation daemons (Parakeet + whisper.cpp) on this workstation
  # See roles/asr-servers/README.md. Parakeet (:8771) is the gungan default —
  # a transducer that returns empty on silence, so dictation never invents words.
  # whisper.cpp-server (:8772) is the VAD-hardened fallback. Tasks self-elevate
  # (pacman/loginctl use become) so the play runs as the local user for the
  # systemd --user units.
  hosts: cachyos-x8664-main
  gather_facts: true
  roles:
    - role: asr-servers
      tags: [asr, ml, dictation]
    - role: desktop-firewall
      tags: [firewall, agent-web, pxe]

- name: Workstation monitoring (node_exporter)
  # So cc:host_* and the hub:infra board see this machine's load, memory and
  # temperature, including while its two gate-only Unity pool slots run
  # (unity_ci_runners). ufw
  # default-denies inbound, hence the 9100 rule in desktop-firewall. Needs sudo:
  #   ansible-playbook playbooks/site.yml --limit cachyos-x8664-main --tags monitoring
  # (become password: ansible/README.md, Secrets)
  hosts: cachyos-x8664-main
  become: true
  gather_facts: true
  roles:
    - role: node-exporter-linux
      tags: [monitoring]
      vars:
        node_exporter_linux_textfile_owner: kblack0610
    - role: desktop-firewall
      tags: [monitoring, firewall]
    # Top processes, running services and Docker containers, for the hub machine page:
    #   ansible-playbook playbooks/site.yml --limit cachyos-x8664-main --tags inventory-metrics
    # (become password: ansible/README.md, Secrets)
    - role: node-inventory-metrics
      tags: [inventory-metrics]
      vars:
        node_inventory_metrics_dir: "{{ node_exporter_linux_textfile_dir }}"
    # `ssh <inventory alias>` from this machine (razer-laptop, asus-laptop on
    # 2222, the Pis): /etc/ssh/ssh_config.d/40-home-inventory.conf from the
    # inventory. Apply: --limit cachyos-x8664-main --tags ssh-aliases
    # (become password: ansible/README.md, Secrets)
    - role: ssh-client-inventory
      tags: [ssh-aliases]

- name: Cloud Unity CI host monitoring over the tailnet
  hosts: unity_ci_runners
  become: true
  gather_facts: true
  roles:
    - role: tailscale-node
      when: not (unity_ci_lan | default(true) | bool)
      tags: [monitoring]
    - role: node-exporter-linux
      when: not (unity_ci_lan | default(true) | bool)
      tags: [monitoring]
      vars:
        node_exporter_linux_textfile_dir: /var/lib/node-exporter-textfile

- name: Keep Linux host clocks synced (systemd-timesyncd)
  # See ansible/roles/time-sync/README.md. hp-victus was found ~102s behind the
  # rest of the cluster with NO time daemon at all, while every other node sat
  # within a second. It only surfaced because the fleet-exporter landed there and
  # read gatus results as future-dated, rendering the whole fleet DOWN - but the
  # real exposure is TLS validation, cross-node log ordering and k8s lease/token
  # expiry, none of which look like a clock problem when they break.
  #
  # Targets the Pis too even though they are already synced: the role is
  # idempotent there, and a drifting clock should be prevented fleet-wide rather
  # than fixed per-host after it bites.
  hosts: linux_bare_metal:pi_k3s
  become: true
  gather_facts: true
  roles:
    - role: time-sync
      tags: [time, ntp]

- name: Core dump and local-path PV metrics (k3s nodes)
  # Run before the chart change that mounts the directory.
  #   ansible-playbook playbooks/site.yml --limit 'linux_bare_metal:pi_k3s' --tags disk-metrics
  hosts: linux_bare_metal:pi_k3s
  become: true
  gather_facts: false
  roles:
    - role: node-disk-metrics
      tags: [disk-metrics]

- name: Process, service and Docker container inventory (k3s nodes)
  # For the hub machine page; the workstation's is in its monitoring play.
  #   ansible-playbook playbooks/site.yml --limit 'linux_bare_metal:pi_k3s' --tags inventory-metrics
  hosts: linux_bare_metal:pi_k3s
  become: true
  gather_facts: false
  roles:
    - role: node-inventory-metrics
      tags: [inventory-metrics]

- name: Kubelet image GC under the disk alert (Pi k3s nodes)
  # See roles/k3s-image-gc/README.md. Kubelet's default 85% sat above NodeDiskLow's 80%.
  #   ansible-playbook playbooks/site.yml --limit pi_k3s --tags image-gc
  hosts: pi_k3s
  become: true
  gather_facts: false
  roles:
    - role: k3s-image-gc
      tags: [image-gc, k3s]

- name: CPU per CI runner (Linux runner hosts)
  # The Infra tab's cores and memory per runner: each runner unit's cgroup plus its
  # job containers', every 15s, and each runner home's disk hourly, into
  # node-exporter's textfile dir.
  #   ansible-playbook playbooks/site.yml --limit ci_hosts --tags runner-cpu
  hosts: ci_hosts
  become: true
  gather_facts: true
  roles:
    - role: ci-runner-cpu
      tags: [runner-cpu]

- name: USB backup drive mounts on asus-laptop (survive re-enumeration)
  # See roles/usb-backup-mounts/README.md. The 8TB drive dropped off USB on
  # 2026-08-09 and came back as a different device node; the seven mounts went
  # stale while df/mountpoint kept reporting healthy, and three days of backups
  # silently wrote nothing. This role hands the lifecycle to systemd
  # (x-systemd.automount) so device loss tears the mount down cleanly and device
  # return remounts it by UUID.
  hosts: asus-laptop
  become: true
  gather_facts: true
  roles:
    - role: usb-backup-mounts
      tags: [backup-mounts, storage]

- name: Emotiv EEG archive on asus-laptop
  # Where roles/emotiv-bridge on mac-mini uploads: a write-only rrsync user and
  # /mnt/nas/private/eeg. Apply before the bridge, or its uploads queue in the spool.
  #   ansible-playbook playbooks/site.yml --limit asus-laptop --tags emotiv
  hosts: asus-laptop
  become: true
  gather_facts: false
  roles:
    - role: emotiv-archive-target
      tags: [emotiv, storage]

- name: SMART exporter on every bare-metal Linux host, disk scrubs on asus-laptop
  # See roles/disk-health/README.md. Nothing scrubbed these filesystems before
  # 2026-10-31, so rot in a file nobody reads would have gone unnoticed. The workstation's
  # sudo asks for a password, so its run needs -K.
  hosts: linux_bare_metal:desktop_workstations
  become: true
  gather_facts: true
  roles:
    - role: disk-health
      tags: [disk-health, storage]

- name: Weekly Forgejo restore drill on asus-laptop
  # See roles/forgejo-restore-drill/README.md. A backup nobody restores is a guess;
  # this restores the newest one every week and records the outcome for Sentinel.
  hosts: asus-laptop
  become: true
  gather_facts: false
  roles:
    - role: forgejo-restore-drill
      tags: [forgejo-restore-drill, storage]

- name: Disable lid-close / suspend on laptop k3s nodes and CI hosts
  # See ansible/roles/k3s-node-no-suspend/README.md — without this, closing
  # a laptop lid removes the node from the cluster (the 2026-05 hp-victus
  # incident took 4 workloads offline for ~2 weeks).
  hosts: linux_bare_metal
  become: true
  gather_facts: true
  roles:
    - role: k3s-node-no-suspend
      tags: [no-suspend, k3s]

- name: Unused NIC ports stay down (hosts that list nic_unused_interfaces)
  # See roles/nic-unused-down/README.md: an uncabled r8169 port NetworkManager sets up logs
  # "Link is Down" every boot, which HostNicDown and host-qualify count as a NIC fault.
  #   ansible-playbook playbooks/site.yml --limit ms-a2 --tags nic-unused
  hosts: linux_bare_metal
  become: true
  gather_facts: false
  roles:
    - role: nic-unused-down
      tags: [nic-unused]

# CI runners, org-scoped for every BlackNBrownStudios repo: the slots of inventory.yml
# unity_ci_runners, each taking Unity jobs (and light and heavy where its host has no seats
# for them), and the seats that borrow them (Forgejo, light, heavy, the personal repo runners). Self-hosted
# minutes cost $0; hosted ones hit the org's $200 Actions budget in September 2026. A
# local outage froze a release gate on the thinkcentre runner (2026-06-18, #833), so
# release and deploy jobs stay on ubuntu-latest, and every moved job reads runs-on from
# the LINUX_RUNNER_LIGHT / LINUX_RUNNER_HEAVY org variables: deleting them sends it all
# back to ubuntu-latest.
# Each slot is a runner with HOME in its own dir, so jobs never share a pnpm store or
# Playwright cache; a job hook empties a non-Unity workspace around every job, and a
# light job's first step parks a warm Unity tree's untracked state (roles/ci-host).
# Tokens come from the control node's gh (admin:org), so there is no standing PAT.
# Dropping a Unity slot leaves its runner: scripts/unity-ci-runner-remove.sh. Dropping a
# ci_repo_runners entry too: stop its unit, delete it in the repo's runner settings, rm its dir.
- name: CI runners (Unity slots and the seats that borrow them)
  hosts: unity_ci_runners
  become: true
  gather_facts: true
  vars:
    # Unity slot unity_slot's slice and CPU count, for the slot and for the seats that borrow
    # it (ci_seats): with ci_unity_slot_cpus each slot gets its own cores (roles/ci-host-budget),
    # else the slots share the Unity slice. The count is CI_SLOT_CPUS in every job's env, which
    # platform's turbo runs take as --concurrency: without a cap a turbo job started 10 tasks on
    # a 2-core share and the host's load15 reached 1.58x its CPUs (2026-11-14, ar-2435).
    unity_slot_slice: >-
      {{ (ci_unity_slot_slice_prefix ~ (unity_slot | int) ~ '.slice') if ci_unity_slot_cpus | length else ci_unity_slice }}
    unity_slot_cpus: >-
      {% set spec = ci_unity_slot_cpus[(unity_slot | int) - 1] if ci_unity_slot_cpus | length
      else (ci_unity_cpus or ci_cpus) %}{% set n = namespace(c=0) %}{% for part in spec.split(',')
      if part | trim %}{% set ab = (part | trim).split('-') %}{% set n.c = n.c + (ab[-1] | int)
      - (ab[0] | int) + 1 %}{% endfor %}{{ [1, (n.c / (1 if ci_unity_slot_cpus | length
      else unity_ci_slots)) | int] | max }}
    # The Unity slot number a lend seat borrows ("borrows" is that slot's runner name).
    ci_seat_slot: "{{ ci_seat.borrows | regex_replace('^' ~ inventory_hostname ~ '-unity-pool-', '') | int }}"
    # A seat's slice and CPU count: a standing seat's ("slice", inventory ci_small_slice) are the
    # host's small-job slice and its kind's p90 job rounded up ("job_cpus"), since the slice runs
    # many seats at once (turbo takes CI_SLOT_CPUS as --concurrency, ar-2435); a lend seat's are
    # those of the slot it borrows. A
    # standing seat registers admitted and the governor never moves its labels; a lend seat
    # registers withheld and runs only while the governor lends it its slot.
    ci_seat_standing: "{{ ci_seat.slice is defined }}"
    ci_seat_slice: "{{ ci_small_slice_name if ci_seat.slice is defined else unity_slot_slice }}"
    ci_seat_cpus: "{{ (ci_seat.job_cpus | default(ci_seat.cpus) | float | round(0, 'ceil') | int) if ci_seat.slice is defined else unity_slot_cpus }}"
  roles:
    # What the host's ci_caps need (roles/ci-host). Its own tags pick a part:
    # --tags unity-ci-host refreshes the asset-library copy and editor images
    # without touching the runners, --tags ci-disk the disk guard.
    - role: ci-host
      tags: [runner, ci]
  tasks:
    # A personal repo cannot see org runners, so each ci_repo_runners seat (the
    # topology's, one per MIN_JOB_CORES of the slot it borrows) registers against its one repo (inventory.yml says why), with the
    # workstation's gh as the repo owner. It runs as linux-ci like the Forgejo
    # seats: the role puts every runner user in the docker group, which is
    # root on the host, so a second user would isolate nothing. Its jobs use
    # read-only tokens and no secret but personal-sites' read-scoped Forgejo npm
    # registry token, and the job-completed hook empties the
    # workspace as soon as a job ends, so no private checkout stays on disk.
    # A seat (ci_seats) has no Unity slot of its own. A lend seat runs on the Unity test slot
    # it borrows, in that slot's slice and with its CPU count, so it adds jobs, never cores; it
    # registers withheld, and ci-runner-governor admits it only while it lends it that slot
    # (apps/ci-runner-governor, "Lending"). A standing seat runs in the host's small-job slice,
    # registered admitted, and nothing withholds it (ci_seat_standing above).
    - name: Register the personal repo runner seats
      ansible.builtin.include_role:
        name: github-actions-runner-linux
        apply:
          tags: [runner, ci, linux-ci]
      loop: "{{ ci_seats | selectattr('repo', 'defined') | list }}"
      loop_control:
        loop_var: ci_seat
        label: "{{ ci_seat.name }}"
      vars:
        unity_slot: "{{ ci_seat_slot }}"
        gh_runner_scope: repo
        gh_runner_owner: "{{ ci_seat.repo.split('/')[0] }}"
        gh_runner_repo: "{{ ci_seat.repo.split('/')[1] }}"
        gh_runner_token_source: gh
        gh_runner_install_packages: false
        gh_runner_user: linux-ci
        gh_runner_group: linux-ci
        gh_runner_user_home: "{{ linux_ci_user_home }}"
        gh_runner_home: "{{ linux_ci_user_home }}/{{ ci_seat.name | regex_replace('^' ~ inventory_hostname ~ '-', '') }}"
        gh_runner_name: "{{ ci_seat.name }}"
        gh_runner_labels: "{{ ['self-hosted', 'linux', 'x64'] + ci_seat.caps }}"
        # The governor's seat labels (inventory ci_labels.seat_withheld); none on a standing seat.
        gh_runner_governed_labels: "{{ [] if ci_seat_standing | bool else ['light'] }}"
        gh_runner_withheld_labels: "{{ [] if ci_seat_standing | bool else [ci_labels.seat_withheld] }}"
        gh_runner_withheld_label: "{{ ci_labels.seat_withheld }}"
        gh_runner_register_withheld: "{{ not (ci_seat_standing | bool) }}"
        gh_runner_slice: "{{ ci_seat_slice }}"
        gh_runner_env:
          HOME: "{{ linux_ci_user_home }}/{{ ci_seat.name | regex_replace('^' ~ inventory_hostname ~ '-', '') }}"
          ACTIONS_RUNNER_HOOK_JOB_STARTED: "{{ linux_ci_job_started_hook }}"
          ACTIONS_RUNNER_HOOK_JOB_COMPLETED: "{{ linux_ci_job_completed_hook }}"
          CI_SLOT_CPUS: "{{ ci_seat_cpus }}"
      tags: [runner, ci, linux-ci]

    # The light and heavy seats: org runners of one kind, as the repo seats are on a personal
    # repo. A lend seat (ci_seat_kinds) on a borrowed Unity slot registers withheld and carries
    # the kind's label only while the governor has lent it the slot, so a lent slot runs as many
    # small jobs as the kind's measured weight fits (apps/ci-runner-governor, pack()). A standing
    # seat (ci_small_slice) carries its kind's label always.
    - name: Register the light and heavy seats
      ansible.builtin.include_role:
        name: github-actions-runner-linux
        apply:
          tags: [runner, ci, linux-ci]
      loop: "{{ ci_seats | rejectattr('forge', 'defined') | rejectattr('repo', 'defined') | list }}"
      loop_control:
        loop_var: ci_seat
        label: "{{ ci_seat.name }}"
      vars:
        unity_slot: "{{ ci_seat_slot }}"
        gh_runner_scope: org
        gh_runner_token_source: gh
        gh_runner_install_packages: false
        gh_runner_user: linux-ci
        gh_runner_group: linux-ci
        gh_runner_user_home: "{{ linux_ci_user_home }}"
        gh_runner_home: "{{ linux_ci_user_home }}/{{ ci_seat.name | regex_replace('^' ~ inventory_hostname ~ '-', '') }}"
        gh_runner_name: "{{ ci_seat.name }}"
        gh_runner_labels: "{{ ['self-hosted', 'linux', 'x64'] + ci_seat.caps }}"
        # The governor's seat labels (inventory ci_labels.seat_withheld), one for every lend seat kind.
        gh_runner_governed_labels: "{{ [] if ci_seat_standing | bool else ci_seat.caps }}"
        gh_runner_withheld_labels: "{{ [] if ci_seat_standing | bool else [ci_labels.seat_withheld] }}"
        gh_runner_withheld_label: "{{ ci_labels.seat_withheld }}"
        gh_runner_register_withheld: "{{ not (ci_seat_standing | bool) }}"
        gh_runner_slice: "{{ ci_seat_slice }}"
        gh_runner_env:
          HOME: "{{ linux_ci_user_home }}/{{ ci_seat.name | regex_replace('^' ~ inventory_hostname ~ '-', '') }}"
          ACTIONS_RUNNER_HOOK_JOB_STARTED: "{{ linux_ci_job_started_hook }}"
          ACTIONS_RUNNER_HOOK_JOB_COMPLETED: "{{ linux_ci_job_completed_hook }}"
          CI_SLOT_CPUS: "{{ ci_seat_cpus }}"
      tags: [runner, ci, linux-ci]

    # Every host in the play, so one that loses its seats loses their units too.
    - name: Retire the Forgejo units this host no longer runs
      ansible.builtin.include_role:
        name: forgejo-runner-linux
        tasks_from: retire
        apply:
          tags: [runner, ci, forgejo-ci]
      vars:
        forgejo_seat_names: "{{ ci_seats | selectattr('forge', 'defined') | selectattr('forge', 'eq', 'forgejo') | map(attribute='name') | list }}"
        forgejo_runner_user_home: "{{ linux_ci_user_home }}"
      tags: [runner, ci, forgejo-ci]

    # The Forgejo seats: one on each lendable Unity slot (floor(cpus / MIN_JOB_CORES) seats) of a host whose ci_caps carry
    # forgejo (scripts/render-ci-topology.py), and the standing ones of its small-job slice. A seat's
    # supervisor runs a job only while the governor's lease says forgejo: a lend seat's while it is lent
    # the slot, a standing seat's always, so a down governor stops Forgejo CI and leaves GitHub CI running.
    - name: Register the Forgejo seats
      ansible.builtin.include_role:
        name: forgejo-runner-linux
        apply:
          tags: [runner, ci, forgejo-ci]
      loop: "{{ ci_seats | selectattr('forge', 'defined') | selectattr('forge', 'eq', 'forgejo') | list }}"
      loop_control:
        loop_var: ci_seat
        label: "{{ ci_seat.name }}"
      vars:
        unity_slot: "{{ ci_seat_slot }}"
        forgejo_runner_name: "{{ ci_seat.name }}"
        forgejo_runner_home: "{{ linux_ci_user_home }}/{{ ci_seat.name | regex_replace('^' ~ inventory_hostname ~ '-', '') }}"
        forgejo_runner_user_home: "{{ linux_ci_user_home }}"
        forgejo_runner_slot: "{{ ci_seat.borrows | default(ci_small_slice_name) }}"
        forgejo_runner_slice: "{{ ci_seat_slice }}"
      tags: [runner, ci, forgejo-ci]

    # After the seats, whose roles create the linux-ci user. Playground jobs clone
    # their submodules over ssh (the first light jobs on a new host failed
    # "Host key verification failed" without this, 2026-11-13).
    - name: Trust GitHub's host keys for the linux-ci user
      ansible.builtin.import_role:
        name: ci-host
        tasks_from: github-known-hosts
      vars:
        github_known_hosts_user: linux-ci
        github_known_hosts_group: linux-ci
        github_known_hosts_home: "{{ linux_ci_user_home }}"
      when: ci_seats | length > 0
      tags: [runner, ci, linux-ci]

    # BNB Unity runner pool: org-scoped runners every BlackNBrownStudios repo can use
    # with runs-on [self-hosted, linux, unity] (added 2026-10-05). Slots per host live
    # in inventory.yml (unity_ci_runners); the CPU and memory caps in ci_hosts. Each slot is its own
    # runner under the actions-runner user with HOME set to the slot's dir, so slots
    # never share a Unity cache or Library. OpenSSH still reads known_hosts from the
    # user's passwd home, so ci-host manages GitHub's keys there for every slot.
    # All of a host's slots share one Unity machine id, so a host is one activation
    # however many slots it has. The ci-host role puts the asset-library copy
    # and the editor image on the host.
    #
    # A new HOST is a new Unity activation on the shared Personal serial: add one
    # host at a time (docs/runbooks/unity-ci-host.md, "Unity activation"). Org
    # registration tokens need the workstation's gh with admin:org
    # (gh auth refresh -h github.com -s admin:org).
    #
    # hp-victus had two repo-scoped Unity runners, each its own play, until
    # 2026-10-29: hp-victus-unity-2 (dodginballs, /var/lib/actions-runner-2) and
    # hp-victus-playground (/var/lib/actions-runner-playground). Both became its two
    # pool slots here, so every Unity runner is defined in this one play.
    #
    # Lowering a slot count does NOT remove the old slot: stop and disable
    # actions.runner.<host>-unity-pool-<n>.service, delete it in the org's runner
    # settings, and rm -rf /var/lib/actions-runner/unity-pool-<n>.
    - name: Require one CPU list per Unity slot when slots have their own
      ansible.builtin.assert:
        that:
          - ci_unity_slot_cpus | length in [0, unity_ci_slots | default(0)]
          - (unity_ci_slot_groups | default({})).keys() | reject('in', range(1, unity_ci_slots | default(0) + 1)) | list | length == 0
        fail_msg: >-
          {{ inventory_hostname }} has unity_ci_slots {{ unity_ci_slots }} but
          {{ ci_unity_slot_cpus | length }} entries in ci_unity_slot_cpus, or a build slot
          (a unity_ci_slot_groups key) outside 1-{{ unity_ci_slots }}.
      tags: [runner, ci, unity-ci]

    - name: Register the Unity pool slots
      ansible.builtin.include_role:
        name: github-actions-runner-linux
        apply:
          tags: [runner, ci, unity-ci]
      loop: "{{ range(1, unity_ci_slots + 1) | list }}"
      loop_control:
        loop_var: unity_slot
      vars:
        gh_runner_scope: org
        gh_runner_token_source: gh
        gh_runner_install_packages: false
        gh_runner_user: "{{ unity_ci_user }}"
        gh_runner_group: "{{ unity_ci_group }}"
        gh_runner_user_home: "{{ unity_ci_user_home }}"
        gh_runner_home: "{{ unity_ci_user_home }}/unity-pool-{{ unity_slot }}"
        gh_runner_name: "{{ inventory_hostname }}-unity-pool-{{ unity_slot }}"
        # unity-full: the hosts full suite runs may take (unity_ci_full in inventory.yml).
        # Each apply resets a registered runner's labels to these (the role's label reconcile).
        # lan: the slot is on the home LAN, so it can push to git.kblab.me (Shots'
        # gallery image); through Cloudflare a push over 100 MB fails. Off for
        # the AWS hosts (unity_ci_lan in inventory.yml).
        # unity-wide: slots with the CPU for real-time players (Multi, Soak, Playloop); only slots
        # that passed the ucp-1521 probes (unity_ci_wide, default false, for every slot on the host;
        # one slot alone through unity_ci_slot_labels). hd-library: the host
        # holds asset-library-hd (HD, Slim tour); defaults to unity_ci_lan, since only LAN hosts
        # got the tarball, and a cloud host sets unity_ci_hd_library once it reads it from S3.
        # Build slots, the keys of unity_ci_slot_groups, carry unity-build in place of unity,
        # unity-full, unity-wide and unity-gate, so no gate or nightly lands on them, and the rest
        # are pool slots (aws-build-1: build slots 1-3, test slots 4-9; ms-a2: build slot 5 on
        # test slots 3-4's cores). The governor keeps a build and a test off the same cores.
        # unity_ci_slot_labels adds labels to one slot, so a comparison run can be pinned to it,
        # or a job kept off it (aws-build-1: unity-release on slots 1-2 only).
        # unity-gate: the non-preemptible hosts merge gates may take (unity_ci_gate, default false);
        # a Spot host leaves it off, so a reclaim never kills a gate (playground ucp-1778).
        # The slot's caps come from topology.json (ci_slot_caps): unity-build on a build slot,
        # unity plus the host's light and heavy on a test slot, less the kinds its seats serve
        # (ci_seat_kinds; scripts/render-ci-topology.py HOST_CAPS).
        gh_runner_labels: "{{ [ 'self-hosted', 'linux', 'x64', 'host-' ~ inventory_hostname ] + ci_slot_caps[gh_runner_name] + ([] if unity_slot in unity_ci_slot_groups | default({}) else ([ 'unity-full' ] if unity_ci_full | default(true) else []) + ([ 'unity-wide' ] if unity_ci_wide | default(false) else []) + ([ 'unity-gate' ] if unity_ci_gate | default(false) else [])) + ([ 'unity' ] + ([ 'unity-full' ] if unity_ci_full | default(true) else []) if 'unity-wide' in ci_slot_caps[gh_runner_name] else []) + ([ 'lan' ] if unity_ci_lan | default(true) else []) + ([ 'hd-library' ] if unity_ci_hd_library | default(unity_ci_lan | default(true)) else []) + (unity_ci_slot_labels | default({})).get(unity_slot, []) }}"
        # ci-runner-governor's admit labels and withheld labels (inventory ci_labels, the
        # vocabulary the governor reads from topology.json), plus the shared caps a slot takes
        # (governor.py "shared"): an apply leaves a withheld slot withheld for every kind.
        gh_runner_governed_labels: "{{ [ ci_labels.pool, ci_labels.full, ci_labels.build, 'light', 'heavy' ] + ([ ci_labels.wide ] if ci_labels.wide in ci_slot_caps[gh_runner_name] else []) }}"
        gh_runner_withheld_labels: ["{{ ci_labels.withheld }}", "{{ ci_labels.build_withheld }}"]
        gh_runner_withheld_label: "{{ ci_labels.build_withheld if unity_slot in unity_ci_slot_groups | default({}) else ci_labels.withheld }}"
        # The governor's lend mark: an apply never takes back a slot it lent to a seat.
        gh_runner_kept_labels: ["{{ ci_labels.lent }}"]
        # A new slot registers withheld and runs only once the governor admits it, one per
        # cycle on the host's readings: admitted at registration, deskslim-1's slots took 5
        # PlayMode shards while its first play still ran, and failed them all (ar-4100).
        gh_runner_register_withheld: true
        gh_runner_slice: "{{ unity_slot_slice }}"
        # UNITY_CACHE_SERVER only where the host runs an Accelerator (unity_ci_accelerator,
        # roles/ci-host), so the other hosts' env, and their slots, are unchanged.
        gh_runner_env: >-
          {{ unity_slot_env | combine({'UNITY_CACHE_SERVER': unity_ci_accelerator}
          if unity_ci_accelerator | default('') | length else {}) }}
        unity_slot_env:
          HOME: "{{ unity_ci_user_home }}/unity-pool-{{ unity_slot }}"
          UNITY_MACHINE_ID_FILE: "{{ unity_ci_machine_id_file }}"
          UNITY_CI_CGROUP_PARENT: "{{ unity_slot_slice }}"
          # One asset-library LFS store per host (scripts/setup/asset-library.sh in
          # the playground): with the default under each slot's HOME, a new slot
          # downloaded the whole 7.9 GB library before its first job could start.
          ASSET_LIBRARY_LFS_STORE: "{{ unity_ci_lfs_store }}"
          # Every slot's hook (roles/ci-host job-started.sh): with CI_SLOT_UNITY it prunes
          # idle slots' warm trees before the job when the disk is under the floor, and it never
          # empties a workspace holding a Unity project. At job end it frees what a light or
          # heavy job left (docker containers included). Changing this env restarts every slot and kills its job: apply it with the
          # host's slots idle.
          ACTIONS_RUNNER_HOOK_JOB_STARTED: "{{ linux_ci_job_started_hook }}"
          ACTIONS_RUNNER_HOOK_JOB_COMPLETED: "{{ linux_ci_job_completed_hook }}"
          CI_SLOT_UNITY: "1"
          # The slot's CPU count (unity_slot_cpus), which platform's turbo runs take as
          # --concurrency when a light job lands here.
          CI_SLOT_CPUS: "{{ unity_slot_cpus }}"
      tags: [runner, ci, unity-ci]

    # The Unity slots' old hook, replaced by job-started.sh above once the slots run with it.
    - name: Remove the old Unity job-started hook
      ansible.builtin.file:
        path: /usr/local/lib/linux-ci/unity-job-started.sh
        state: absent
      tags: [runner, ci, unity-ci]

    # The slot labelled slim-tour (unity_ci_slot_labels) keeps its warm trees: ci-disk-prune.sh
    # reads this marker. Every cold Slim tour spent 107 to 125 min importing (playground ucp-1884).
    - name: Mark the slim-tour slot's trees as kept
      ansible.builtin.file:
        path: "{{ unity_ci_user_home }}/unity-pool-{{ item }}/.keep-warm-trees"
        state: "{{ 'touch' if 'slim-tour' in (unity_ci_slot_labels | default({})).get(item, []) else 'absent' }}"
        modification_time: preserve
        access_time: preserve
      loop: "{{ range(1, unity_ci_slots + 1) | list }}"
      # A --check of a slot not yet registered has no slot directory to touch.
      ignore_errors: "{{ ansible_check_mode }}"
      tags: [runner, ci, unity-ci, ci-disk]

# Service hosts carry no CI (no_ci_hosts in inventory.yml says why). The CI
# plays only add, so this one takes off whatever a host still has: every
# actions.runner and forgejo-runner unit, the linux-ci homes and cleanup timer, the CI slices and
# docker's CI cgroup parent, the CI CPU exporter, the k3s CPU pin that kept pods
# off CI's cores, and the org registrations (the workstation's gh, admin:org).
# Idempotent; a clean host reports ok.
#   ansible-playbook playbooks/site.yml --limit no_ci_hosts --tags no-ci
- name: Retire CI on no_ci_hosts
  hosts: no_ci_hosts
  become: true
  gather_facts: false
  tags: [no-ci, ci]
  tasks:
    - name: Find runner units
      ansible.builtin.find:
        paths: /etc/systemd/system
        patterns: ["actions.runner.*.service", "forgejo-runner-*.service"]
      register: _no_ci_units

    - name: Stop and disable runner units and the docker cleanup timer
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop: "{{ _no_ci_units.files | map(attribute='path') | map('basename') | list
                + ['linux-ci-docker-cleanup.timer', 'linux-ci-docker-cleanup.service'] }}"
      failed_when: false

    - name: Remove runner units, linux-ci homes and hooks
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ _no_ci_units.files | map(attribute='path') | list + [
                '/etc/systemd/system/linux-ci-docker-cleanup.timer',
                '/etc/systemd/system/linux-ci-docker-cleanup.service',
                '/var/lib/linux-ci', '/usr/local/lib/linux-ci'] }}"
      register: _no_ci_removed

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      when: _no_ci_removed.changed

    - name: Remove the CI CPU exporter
      ansible.builtin.include_role:
        name: ci-runner-cpu
        tasks_from: retire

    # The role's own unpin: it also drops kubelet's CPU manager checkpoint,
    # without which k3s will not start on the new policy (asus, 2026-11-13).
    - name: Remove the k3s CPU pin
      ansible.builtin.include_role:
        name: ci-host-budget
        tasks_from: k3s-pin
      vars:
        k3s_cpus: ""

    - name: Deregister this host's org runners
      ansible.builtin.shell: |
        set -eu
        gh api orgs/BlackNBrownStudios/actions/runners --paginate \
          -q '.runners[] | select(.name | startswith("{{ inventory_hostname }}-")) | .id' |
        while read -r id; do gh api -X DELETE "orgs/BlackNBrownStudios/actions/runners/$id"; echo "$id"; done
      delegate_to: localhost
      become: false
      register: _no_ci_dereg
      changed_when: _no_ci_dereg.stdout | length > 0
      check_mode: false
      when: not ansible_check_mode

    # Last: it refuses to restart docker under running containers, which fails the host.
    - name: Remove the CI slices and docker's CI cgroup parent
      ansible.builtin.include_role:
        name: ci-host-budget
        tasks_from: retire

- name: Fleet workers (agent sessions fleet-dispatch places over ssh)
  # See docs/runbooks/fleet-worker.md. Per user, not root: the sessions run as
  # ansible_user, at the same paths as on the workstation. The role installs
  # pushes the Claude account tokens from this machine's rbw, and reports what
  # is left for the human.
  hosts: fleet_workers
  gather_facts: true
  roles:
    - role: fleet-worker
      tags: [fleet-worker, agents]

- name: Agent CPU budget (every host agent sessions run on)
  # One hard cpuset over all agent work on the host, CI inside it, so the
  # desktop and the OS keep the rest (roles/agent-host-budget). Root writes the
  # drop-ins under /etc/systemd/user; each user manager reloads onto them.
  hosts: fleet_workers:desktop_workstations
  gather_facts: true
  become: true
  roles:
    - role: agent-host-budget
      tags: [agent-host-budget, agents]

# macOS hosts (macos_hosts). Shared baseline: brew essentials, node_exporter,
# and macos-baseline (power policy + SSH key sync + auto-login/FileVault
# assert). macos-baseline's pmset tasks self-elevate (become: true), so applying
# the [mac]/[persistence] tags needs an interactive sudo password: add `-K`.
# See docs/mac-machines.md.
- name: macOS baseline + monitoring
  hosts: macos_hosts
  gather_facts: true
  roles:
    - role: brew-common
      tags: [brew, mac]
    - role: node-exporter-mac
      tags: [monitoring, mac]
    # Host persistence: auto-restart after power failure, no sleep, SSH key
    # sync, and assert auto-login/FileVault so the box comes back unattended.
    - role: macos-baseline
      tags: [mac, persistence]
    # Weekly prune of regenerable build caches, reported through the existing
    # node_exporter textfile collector. Unity roots are per-host: the mini is
    # where DodginBalls lives, and a host with no roots set skips that section.
    - role: macos-disk-reclaim
      tags: [mac, disk]
      vars:
        disk_reclaim_unity_roots: "{{ ['/Users/kennethblack/dev/Games/DodginBalls_root'] if inventory_hostname == 'mac-mini' else [] }}"

- name: CPU per CI runner (macOS runner hosts)
  # Sums each Runner.Listener's process tree %CPU every 15s into the textfile
  # dir node-exporter-mac reads. No sudo needed.
  #   ansible-playbook playbooks/site.yml --limit 'unity_ci_mac_runners:mac-mini' --tags runner-cpu
  hosts: unity_ci_mac_runners:mac-mini
  gather_facts: true
  roles:
    - role: ci-runner-cpu
      tags: [runner-cpu]

# mac-mini is the sole self-hosted mobile-CI runner. No workflow pins a runner
# by name, only by the [self-hosted, macOS, arm64] label set.
- name: macOS CI runner (mac-mini only)
  hosts: mac-mini
  gather_facts: true
  roles:
    # token_source=gh mints a registration token via the workstation's `gh` —
    # no PAT in the repo. A recovery apply against a stale registration needs
    # `-e gh_runner_mac_force_reregister=true`.
    - role: github-actions-runner-mac
      tags: [mac, runner]
    # Agents drive this Mac's desktop over ssh (agent-desktop MCP, Peekaboo).
    # Sets up the Mac for agents (sudo, Spotlight, updates, PATH), then asserts
    # the person's one-time privacy grants and no screen lock.
    - role: macos-agent-tools
      tags: [mac, agent-tools]
    # Records the Emotiv EPOC X while it is connected and uploads it encrypted
    # to the NAS (roles/emotiv-bridge/README.md). The NAS end is the
    # emotiv-archive-target play above.
    - role: emotiv-bridge
      tags: [mac, emotiv]
  tasks:
    # Unity's iOS and Mac IL2CPP modules for the editors unity-ci-host-mac
    # manages, for the playground's iOS and Mac builds on this box's
    # m1-playground-mac runner. Asserts Xcode first. No sudo.
    - name: Unity player modules
      ansible.builtin.import_role:
        name: unity-ci-host-mac
        tasks_from: modules
      tags: [mac, unity-modules]

    # The hourly prune of m1-playground-mac's game build trees. Seven held 137G on
    # 2026-11-10 and NodeDiskLow tripped (docs/mac-machines.md#build-tree-prune).
    - name: Keep the build trees from filling the disk
      ansible.builtin.import_role:
        name: unity-ci-host-mac
        tasks_from: disk
      tags: [mac, ci-disk]

    # The Unity Accelerator for m1-playground-mac's build trees, on localhost
    # (docs/mac-machines.md#unity-accelerator). Sudo, for Unity's installer.
    - name: Unity Accelerator
      ansible.builtin.import_role:
        name: unity-ci-host-mac
        tasks_from: accelerator
      tags: [mac, unity-accelerator]

    # The keychain mac-sign.sh signs the Mac player from: created, unlocked and in the
    # search list, so a reboot or reset cannot drop it (docs/mac-machines.md#mac-build-keychain).
    - name: Keep the Mac build keychain created, unlocked and listed
      ansible.builtin.import_role:
        name: unity-ci-host-mac
        tasks_from: signing-keychain
      tags: [mac, mac-keychain]

# Every k3s node runs k3s_install_version (group_vars/all/k3s.yml). The server
# goes first: a kubelet may never be newer than the apiserver. Then the agents,
# one at a time, stopping at the first failure. After a new node joins, label it
# by hand (a kubelet may not set node-role labels on itself):
#   kubectl label node <host> node-role.kubernetes.io/workstation=true
- name: k3s server (pi5-master)
  hosts: pi5-master
  become: true
  gather_facts: true
  any_errors_fatal: true
  roles:
    - role: k3s-agent
      tags: [k3s]

- name: k3s agents, one at a time
  hosts: pi_k3s:linux_bare_metal:!pi5-master
  become: true
  gather_facts: true
  serial: 1
  max_fail_percentage: 0
  roles:
    - role: k3s-agent
      tags: [k3s]

# Fleet (osquery) agent — AUTHORED but not bound. Enrolls hosts into the
# self-hosted FleetDM server (apps/fleet, https://fleet.kblab.me) for the
# cross-OS inventory / live-query pane. Bind only AFTER apps/fleet is deployed
# and the enroll secret is stored as vault_fleet_enroll_secret (see
# apps/fleet/README.md + roles/osquery-agent/README.md). Covers macOS + Pi
# (Debian) hosts; Arch/x86 (hp-victus/cachyos) is a documented
# follow-up (osquery is AUR-only). ALWAYS --check --diff a single host first.
#
# - name: Fleet osquery agent (macOS + Pi hosts)
#   hosts: macos_hosts:pi_k3s
#   gather_facts: true
#   roles:
#     - role: osquery-agent
#       tags: [fleet, osquery]

# Tier and game-server labels share one delegated kubectl path.
- name: Kubernetes node labels
  hosts: k3s_nodes
  become: false
  gather_facts: false
  roles:
    - role: node-labels
      tags: [node-labels, game-server]

# BNB Unity runner pool, macOS hosts (added 2026-10-29, mac-studio until it is
# sold). The same org pool as above, labelled unity/unity-full, unity-native and
# host-<name>, without GitHub's default labels: the jobs that need the Linux
# editor image keep runs-on linux or self-hosted, and the rest (EditMode) run
# natively here. Slot counts are in
# inventory.yml (unity_ci_mac_runners). Every registered slot takes pool jobs;
# the governor cannot judge a Mac's load (no PSI or hwmon), so the slot count is
# the only limit.
#
# To retire a host (the Studio's sale): stop and uninstall each slot with
# ~/actions-runner/unity-pool-<n>/svc.sh, delete the runners in the org's
# settings, and remove the host from unity_ci_mac_runners and re-run scripts/render-ci-topology.py.
- name: Unity CI runner pool (macOS)
  hosts: unity_ci_mac_runners
  gather_facts: true
  # A non-login ssh shell lacks Homebrew, whose GNU tar ansible's unarchive needs.
  environment:
    PATH: "/opt/homebrew/bin:{{ ansible_env.PATH }}"
  roles:
    - role: unity-ci-host-mac
      tags: [runner, ci, unity-ci, unity-ci-host]
  tasks:
    # A new slot copies slot 1's checkout (an APFS clone: instant, no extra disk)
    # before its runner starts, so it never clones from the forge. Eight slots
    # cold-cloning at once took asus, and Forgejo with it, down on 2026-10-29;
    # the copy also brings slot 1's imported Library. On a fresh host slot 1 has
    # no checkout yet: register it alone (unity_ci_slots: 1), let one job run,
    # then raise the count.
    - name: Seed new slots from slot 1's checkout
      ansible.builtin.shell:
        cmd: >-
          mkdir -p {{ unity_ci_mac_root }}/unity-pool-{{ item }}/_work &&
          /bin/cp -cR {{ unity_ci_mac_root }}/unity-pool-1/_work/{{ unity_ci_mac_seed_repo }}
          {{ unity_ci_mac_root }}/unity-pool-{{ item }}/_work/
        creates: "{{ unity_ci_mac_root }}/unity-pool-{{ item }}/_work/{{ unity_ci_mac_seed_repo }}"
        removes: "{{ unity_ci_mac_root }}/unity-pool-1/_work/{{ unity_ci_mac_seed_repo }}"
      loop: "{{ range(2, unity_ci_slots + 1) | list }}"
      tags: [runner, ci, unity-ci]

    - name: Register the Unity pool slots
      ansible.builtin.include_role:
        name: github-actions-runner-mac
        apply:
          tags: [runner, ci, unity-ci]
      loop: "{{ range(1, unity_ci_slots + 1) | list }}"
      loop_control:
        loop_var: unity_slot
      vars:
        gh_runner_mac_scope: org
        gh_runner_mac_token_source: gh
        gh_runner_mac_home: "{{ unity_ci_mac_root }}/unity-pool-{{ unity_slot }}"
        gh_runner_mac_name: "{{ inventory_hostname }}-unity-pool-{{ unity_slot }}"
        # No self-hosted/macOS/ARM64: with them an org slot here would take the
        # platform repo's [self-hosted, macOS] iOS jobs. Only jobs that ask for the
        # pool labels alone land here (unity-core-playground test.yml EditMode).
        gh_runner_mac_no_default_labels: true
        gh_runner_mac_labels: "{{ [ 'unity', 'unity-native', 'host-' ~ inventory_hostname ] + ([ 'unity-full' ] if unity_ci_full | default(true) else []) }}"
        gh_runner_mac_path: "{{ unity_ci_mac_path }}"
        gh_runner_mac_env:
          HOME: "{{ unity_ci_mac_root }}/unity-pool-{{ unity_slot }}"
          UNITY_CI_NATIVE: "1"
          ASSET_LIBRARY_LFS_STORE: "{{ unity_ci_mac_lfs_store }}"
      tags: [runner, ci, unity-ci]

# Network UPS Tools (NUT): a single CyberPower CP1500PFCLCD plugged into
# pi5-master shuts down every machine on the UPS when grid power stays out.
# The primary (server) runs upsd + upsmon-primary; every secondary (client)
# runs upsmon and halts on FSD broadcast. Hosts: nut_clients in inventory.yml.
# The workstation is local; its become password is in ansible/README.md, Secrets. Docs: docs/nut-ups.md.
- name: NUT primary (UPS server on pi5-master)
  hosts: nut_server
  become: true
  gather_facts: true
  roles:
    - role: nut
      tags: [nut, nut-server, ups]

- name: NUT secondaries (every other host on the UPS)
  hosts: nut_clients
  become: true
  gather_facts: true
  roles:
    - role: nut
      tags: [nut, nut-client, ups]

# Phase C (started): OpenWrt router config via the community.openwrt collection
# (pure-shell uci modules, no Python on the router). This first role isolates
# the IoT SSID onto its own VLAN. gather_facts: false is REQUIRED - implicit
# fact-gathering runs Python on the target and fails; community.openwrt.init
# (tags: always) sets up the shell-module machinery for every phased --tags run.
# Disruptive steps are gated behind default-false vars (see the role README);
# ALWAYS run --check --diff first, and apply the firewall phase staged.
#   ansible-playbook playbooks/site.yml --limit openwrt --check --diff
- name: OpenWrt router - IoT VLAN isolation
  hosts: openwrt
  gather_facts: false
  roles:
    - role: community.openwrt.init
      tags: always
    # Hardware TSO off (it corrupts forwarded TCP, hc-647) and logd sent to pi5-master.
    #   ansible-playbook playbooks/site.yml --limit openwrt --tags openwrt-base
    - role: openwrt-base
      tags: [openwrt, openwrt-base]
    - role: openwrt-iot-vlan
      tags: [openwrt, iot-vlan]
    # The same key list as every Linux node, in dropbear's file.
    #   ansible-playbook playbooks/site.yml --limit openwrt --tags authorized-keys
    - role: authorized-keys
      tags: [openwrt, authorized-keys]

# AdGuard Home on pi3 - the LAN's filtering resolver, outside k3s on purpose.
#
# CAUTION: a config change here restarts the container, which drops ALL house
# DNS for ~10-15s. That is only survivable because infrastructure/openwrt/dns.yaml
# gives dnsmasq a strict-order fallback to a public resolver; the house keeps
# resolving (unfiltered) through the restart, and the gatus "DNS filtering
# active" canary alerts if it ever fails to come back. Do not remove that
# fallback without also making this play a maintenance-window operation.
#
# ALWAYS run --check --diff first:
#   ansible-playbook playbooks/site.yml --limit pi3-adguard --check --diff
- name: AdGuard Home (pi3 - LAN filtering resolver)
  hosts: adguard
  become: true
  gather_facts: true
  roles:
    - role: adguard
      tags: [adguard, dns]

# Arm the SoC hardware watchdog on the Pis nobody should have to power-cycle.
# pi3 hard-froze three times (2026-08-09, 08-23, 09-30) and each time stayed
