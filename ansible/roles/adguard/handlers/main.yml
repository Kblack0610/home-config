---
# Handlers are gated on `not ansible_check_mode` for the same reason as the nut
# role's: in check mode nothing was really written, so restarting would either
# fail or - worse here - bounce house DNS for no reason.
#
# Restarting AdGuard drops ALL house DNS for the ~10-15s the container takes to
# come back. That is survivable ONLY because infrastructure/openwrt/dns.yaml
# gives dnsmasq a strict-order fallback, so the house keeps resolving
# (unfiltered) meanwhile. If that fallback is ever removed, every converge
# becomes a house-wide outage.
#
# builtin.command rather than community.docker - see the note in tasks/main.yml.

- name: Restart adguard
  # A config-only change needs the process restarted, not the container
  # replaced. `restart` re-reads AdGuardHome.yaml without touching the spec.
  ansible.builtin.command:
    cmd: docker compose restart
    chdir: "{{ adguard_home_dir }}"
  listen: restart adguard
  become: true
  changed_when: true
  when: not ansible_check_mode

- name: Recreate adguard container
  # A compose change (image tag, ports, healthcheck, logging) only takes effect
  # when the container is recreated from the new spec.
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate
    chdir: "{{ adguard_home_dir }}"
  listen: recreate adguard container
  become: true
  changed_when: true
  when: not ansible_check_mode
