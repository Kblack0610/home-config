---
- name: Require a CPU list for agent work on this host
  ansible.builtin.assert:
    that: agent_cpus | length > 0
    fail_msg: >-
      {{ inventory_hostname }} runs agent sessions but has no agent_cpus. Set it
      in inventory.yml: about 85-90% of its CPUs, ci_cpus inside it, k3s_cpus outside.

# Each CPU list as numbers, so the checks below compare CPUs, not strings.
- name: Expand the host's CPU lists
  ansible.builtin.set_fact:
    _agent_cpu_sets: >-
      {% set out = {} %}{% for name, spec in {'agent': agent_cpus,
      'ci': ci_cpus | default(''), 'k3s': k3s_cpus | default('')}.items() %}{% set cpus = [] %}{%
      for part in (spec | string).split(',') if part | trim %}{% set ab = (part | trim).split('-')
      %}{% for c in range(ab[0] | int, (ab[-1] | int) + 1) %}{% set _ = cpus.append(c)
      %}{% endfor %}{% endfor %}{% set _ = out.update({name: cpus}) %}{% endfor %}{{ out }}

# processor_vcpus counts the host's CPUs; processor_nproc is the calling process's affinity,
# which reads 28 of 32 when ansible runs from a pane already inside the cap (2026-11-18).
- name: Require agent_cpus to hold CI, miss k3s and leave the reserve
  ansible.builtin.assert:
    that:
      - _agent_cpu_sets.ci | difference(_agent_cpu_sets.agent) | length == 0
      - _agent_cpu_sets.k3s | intersect(_agent_cpu_sets.agent) | length == 0
      - _agent_cpu_sets.agent | max < ansible_facts.processor_vcpus
      - ansible_facts.processor_vcpus - (_agent_cpu_sets.agent | union(_agent_cpu_sets.k3s) | length) >= agent_cpus_reserve_min
    fail_msg: >-
      {{ inventory_hostname }} ({{ ansible_facts.processor_vcpus }} CPUs): agent_cpus
      {{ agent_cpus }} must contain ci_cpus ({{ ci_cpus | default('none') }}), miss
      k3s_cpus ({{ k3s_cpus | default('none') }}), name only CPUs the host has, and
      leave at least {{ agent_cpus_reserve_min }} CPUs outside it and k3s_cpus.
    quiet: true

- name: Create each agent unit's drop-in directory
  ansible.builtin.file:
    path: "/etc/systemd/user/{{ item }}.d"
    state: directory
    mode: "0755"
  loop: "{{ agent_cpu_units }}"

- name: Pin each agent unit to agent_cpus
  ansible.builtin.template:
    src: agent-cpus.conf.j2
    dest: "/etc/systemd/user/{{ item }}.d/{{ agent_cpus_dropin }}"
    mode: "0644"
  loop: "{{ agent_cpu_units }}"
  register: _agent_cpu_dropins

- name: Find agent CPU drop-ins
  ansible.builtin.find:
    paths: /etc/systemd/user
    recurse: true
    patterns: "{{ agent_cpus_dropin }}"
  register: _agent_cpu_found

- name: Remove the drop-in of a unit no longer in agent_cpu_units
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _agent_cpu_found.files }}"
  loop_control:
    label: "{{ item.path }}"
  when: (item.path | dirname | basename | regex_replace('\.d$', '')) not in agent_cpu_units
  register: _agent_cpu_removed

# One source for the delegation: a distro that already hands cpuset to user@
# (CachyOS, cachyos-settings' delegate.conf) keeps its own, and this role writes
# one only where none does (Arch on razer-laptop, 2026-11-18).
- name: Find a vendor drop-in that delegates cpuset to user@.service
  ansible.builtin.shell: >-
    grep -lsE '^Delegate=.*\bcpuset\b' /usr/lib/systemd/system/user@.service.d/*.conf
  register: _agent_cpu_vendor
  changed_when: false
  failed_when: false
  check_mode: false

- name: Create user@.service's drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/user@.service.d
    state: directory
    mode: "0755"
  when: _agent_cpu_vendor.rc != 0

- name: Hand the cpuset controller to every user manager, where the vendor does not
  ansible.builtin.template:
    src: user-delegate.conf.j2
    dest: /etc/systemd/system/user@.service.d/50-agent-cpuset.conf
    mode: "0644"
  when: _agent_cpu_vendor.rc != 0
  register: _agent_cpu_delegate

- name: Drop this role's delegation where the vendor ships one
  ansible.builtin.file:
    path: /etc/systemd/system/user@.service.d/50-agent-cpuset.conf
    state: absent
  when: _agent_cpu_vendor.rc == 0
  register: _agent_cpu_delegate_gone

- name: Reload systemd onto the delegation
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: _agent_cpu_delegate.changed or _agent_cpu_delegate_gone.changed

# Login users only (UID 1000 and up): a greeter or a system account's manager is
# no agent host, and reloading one that is closing would fail the play.
- name: List the running user managers
  ansible.builtin.shell: |
    set -o pipefail
    loginctl list-users --no-legend | awk '$1 >= 1000 { print $1, $2 }'
  args:
    executable: /bin/bash
  register: _agent_cpu_users
  changed_when: false
  check_mode: false

# Every run, so a re-run heals a host whatever an earlier run left: a
# daemon-reload applies the drop-ins to units already running, panes included,
# with no restart (checked live on the workstation, 2026-11-18). A user manager
# whose cgroup does not hand cpuset down (started before the delegation) takes
# it up only on a re-exec, which keeps every unit running.
- name: Reload each user manager onto the drop-ins
  ansible.builtin.shell: |
    set -o pipefail
    mgr=/sys/fs/cgroup/user.slice/user-{{ item.split()[0] }}.slice/user@{{ item.split()[0] }}.service
    if ! grep -qw cpuset "$mgr/cgroup.subtree_control"; then
      systemctl --user -M {{ item.split()[1] }}@ daemon-reexec && echo reexec
    fi
    systemctl --user -M {{ item.split()[1] }}@ daemon-reload
  args:
    executable: /bin/bash
  loop: "{{ _agent_cpu_users.stdout_lines }}"
  loop_control:
    label: "{{ item.split()[1] }}"
  register: _agent_cpu_reload
  changed_when: "'reexec' in _agent_cpu_reload.stdout or _agent_cpu_dropins.changed or _agent_cpu_removed.changed"
  when: not ansible_check_mode

# The proof: the kernel's cpuset of every running pane and lane is agent_cpus,
# compared as CPU sets (systemd prints one merged and space-separated). It lists
# only the units that differ. EffectiveCPUs, not AllowedCPUs: systemd records
# AllowedCPUs even where the controller is missing and nothing is pinned. Any
# unit it lists is outside the cap, and the apply fails on it.
- name: Find running agent units outside agent_cpus
  ansible.builtin.shell: |
    set -o pipefail
    for u in $(systemctl --user -M {{ item.split()[1] }}@ list-units --no-legend --plain \
        --state=active 'tmux-spawn-*.scope' 'app-agentctl.slice' | awk '{print $1}'); do
      printf '%s %s\n' "$u" "$(systemctl --user -M {{ item.split()[1] }}@ show "$u" -p EffectiveCPUs --value)"
    done | awk -v want='{{ agent_cpus }}' '
      function set(spec,   p, n, i, ab, c, s, seen) {
        n = split(spec, p, /[ ,]+/)
        for (i = 1; i <= n; i++) if (p[i] != "") {
          split(p[i], ab, "-"); if (ab[2] == "") ab[2] = ab[1]
          for (c = ab[1] + 0; c <= ab[2] + 0; c++) seen[c] = 1 }
        for (c = 0; c < 4096; c++) if (c in seen) s = s c ","
        return s }
      BEGIN { w = set(want) }
      NF { u = $1; $1 = ""; if (set($0) != w) print u " on" $0 }'
  args:
    executable: /bin/bash
  loop: "{{ _agent_cpu_users.stdout_lines }}"
  loop_control:
    label: "{{ item.split()[1] }}"
  register: _agent_cpu_live
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Require every running agent unit to sit inside agent_cpus
  ansible.builtin.assert:
    that: _agent_cpu_unpinned | length == 0
    fail_msg: "Agent units whose CPUs are not agent_cpus {{ agent_cpus }}: {{ _agent_cpu_unpinned }}"
    quiet: true
  vars:
    _agent_cpu_unpinned: >-
      {{ _agent_cpu_live.results | default([]) | selectattr('stdout_lines', 'defined')
         | map(attribute='stdout_lines') | flatten | list }}
  when: not ansible_check_mode
