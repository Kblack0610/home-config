---
# asr-servers — local speech-to-text daemons for the gungan dictation client.
# Two systemd --user services exposing OpenAI-style HTTP transcription:
#   parakeet-asr  (:8771) — Parakeet TDT 0.6B ONNX, never hallucinates on silence
#   whisper-asr   (:8772) — whisper.cpp-server, VAD-hardened fallback

# Run as the desktop user (local connection). Overridden from facts at runtime.
asr_user: "{{ ansible_user_id }}"
asr_uid: "{{ ansible_user_uid }}"
asr_home: "{{ ansible_facts['user_dir'] | default(lookup('env', 'HOME')) }}"

# System packages the daemons + client need.
asr_system_packages:
  - jq
  - curl
  - ffmpeg

# --- Parakeet (ONNX / sherpa-onnx) -------------------------------------------
asr_base: "{{ asr_home }}/.local/share/asr"
asr_venv: "{{ asr_base }}/parakeet-venv"
asr_python_version: "3.12"
asr_uv_bin: "{{ asr_home }}/.local/bin/uv"
parakeet_pip_packages:
  - sherpa-onnx
  - fastapi
  - uvicorn
  - python-multipart
  - numpy
  - soundfile
# Weight precision: int8 or fp16. Measured 2026-08-25 on cachyos-x8664-main, fp16
# produced no accuracy gain over int8 on either natural or synthetic speech while
# costing ~2x disk (1.2G vs 652M encoder) and ~30% latency, so int8 stays default.
# Flip to fp16 to re-test on your own voice; everything else follows the variable.
parakeet_precision: int8
parakeet_model_name: "sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-{{ parakeet_precision }}"
parakeet_model_dir: "{{ asr_base }}/models/{{ parakeet_model_name }}"
parakeet_model_url: "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/{{ parakeet_model_name }}.tar.bz2"
# Optional integrity pin for the model tarball ('' = skip, rely on `creates` guard).
parakeet_model_sha256: ""
parakeet_host: 127.0.0.1
parakeet_port: 8771
# Encoder is memory-bandwidth-bound, not core-bound: 4->8 threads saves ~90ms on
# 30s of audio, 8->24 is noise. 8 is the knee.
parakeet_threads: 8

# --- Parakeet contextual biasing (hotwords) ----------------------------------
# A transducer has almost no internal language model, so rare proper nouns come
# out phonetically ("Forgejo" -> "Fargo", "kubectl" -> "cubect"). Contextual
# biasing is the fix, and it requires modified_beam_search: greedy ignores it.
parakeet_decoding_method: modified_beam_search
# Boost applied to hotword paths during beam search. Too high invents the word
# out of unrelated audio; 2.0 measured clean.
parakeet_hotwords_score: 2.0
parakeet_hotwords_file: "{{ asr_base }}/hotwords.txt"
# sherpa-onnx tokenizes hotwords with BPE and needs a SentencePiece-style vocab
# (`token score`). The Parakeet release ships only tokens.txt (`token id`), so we
# derive it: score = -id preserves the original merge order. Lives inside the
# model dir so switching precision or model regenerates it.
parakeet_bpe_vocab: "{{ parakeet_model_dir }}/bpe.vocab"
# Vocabulary this machine actually dictates. Keep to real words the acoustics can
# reach: biasing sharpens a near-miss, it cannot rescue a word the audio lost.
parakeet_hotwords:
  - kubectl
  - kustomization
  - Flux
  - Forgejo
  - Vikunja
  - Immich
  - Traefik
  - Grafana
  - Prometheus
  - sops
  - ansible
  - systemd
  - k3s
  - kblab
  - namespace
  - ingress
  - Parakeet
  - gungan

# --- whisper.cpp-server (fallback) -------------------------------------------
whisper_src: "{{ asr_home }}/src/whisper.cpp"
whisper_server_bin: "{{ whisper_src }}/build/bin/whisper-server"
whisper_repo: "https://github.com/ggml-org/whisper.cpp"
whisper_ref: "v1.8.6"
whisper_build_packages:
  - base-devel
  - cmake
  - git
whisper_model: "{{ asr_home }}/.local/share/whisper-models/ggml-large-v3-turbo.bin"
whisper_host: 127.0.0.1
whisper_port: 8772
whisper_threads: 12

# Silero VAD model (shared by whisper-asr daemon and gungan's local-cli fallback).
vad_model: "{{ asr_home }}/.local/share/whisper-models/ggml-silero-v5.1.2.bin"
vad_model_url: "https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v5.1.2.bin"
vad_model_sha256: "29940d98d42b91fbd05ce489f3ecf7c72f0a42f027e4875919a28fb4c04ea2cf"
# VAD tuning for short push-to-talk dictation (min-speech low so quick words survive).
vad_threshold: "0.5"
vad_min_speech_ms: "100"
vad_min_silence_ms: "100"
vad_speech_pad_ms: "60"
