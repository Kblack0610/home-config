---
galaxy_info:
  role_name: audio_endpoint
  author: home-config
  description: >-
    Make a host one room of the whole-house Snapcast system: a USB interface as
    the default ALSA sink (Pi OS / Armbian) or PipeWire on a desktop, a
    snapclient for the room, and opt-in line-in capture to the snapserver
    (the turntable source).
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: Debian
      versions:
        - all
    - name: Ubuntu
      versions:
        - all
    - name: ArchLinux
      versions:
        - all
  galaxy_tags:
    - audio
    - alsa
    - snapcast
    - airplay
    - homeassistant
dependencies: []
