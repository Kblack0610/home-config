---
# audio-endpoint: one room of the whole-house Snapcast system.
#   install.yml          - ALSA tools, snapclient, capture tools (distro / AUR)
#   card.yml             - Phase 0: find the USB interface (alsa backend / capture)
#   alsa.yml             - Phase 0: default ALSA sink + opt-in test tone
#   snapclient-alsa.yml  - system snapclient owning the card (alsa backend)
#   snapclient-pulse.yml - user snapclient mixing into PipeWire (pulse backend)
#   capture.yml          - opt-in line-in -> snapserver Turntable stream
# The play does not become root at play level; privileged tasks self-elevate so
# the pulse backend can talk to the login user's systemd --user manager.

- name: Validate audio-endpoint settings
  ansible.builtin.assert:
    that:
      - audio_endpoint_backend in ['alsa', 'pulse']
      - ansible_facts['os_family'] in ['Debian', 'Archlinux']
    fail_msg: >-
      audio_endpoint_backend must be 'alsa' or 'pulse' (got
      '{{ audio_endpoint_backend }}'), and the host must be Debian-family or
      Arch (got '{{ ansible_facts['os_family'] }}').
    quiet: true

- name: Require the snapserver address when snapclient or capture is enabled
  ansible.builtin.assert:
    that:
      - audio_endpoint_snapserver_host | string | length > 0
    fail_msg: >-
      audio_endpoint_snapserver_host is empty. Set it to the snapserver LAN
      address (apps/snapcast) for the audio_endpoints group in
      ansible/inventory.yml, or set audio_endpoint_snapclient_enabled=false and
      audio_endpoint_capture=false to run Phase 0 only.
    quiet: true
  when: audio_endpoint_snapclient_enabled | bool or audio_endpoint_capture | bool

- name: Install ALSA tools, snapclient and capture tools
  ansible.builtin.import_tasks: install.yml

- name: Find the USB audio interface
  ansible.builtin.import_tasks: card.yml
  when: audio_endpoint_backend == 'alsa' or audio_endpoint_capture | bool

- name: Default ALSA sink + verification tone
  ansible.builtin.import_tasks: alsa.yml
  when: audio_endpoint_backend == 'alsa'

- name: System snapclient on the USB card
  ansible.builtin.import_tasks: snapclient-alsa.yml
  when:
    - audio_endpoint_snapclient_enabled | bool
    - audio_endpoint_backend == 'alsa'

- name: User snapclient into PipeWire
  ansible.builtin.import_tasks: snapclient-pulse.yml
  when:
    - audio_endpoint_snapclient_enabled | bool
    - audio_endpoint_backend == 'pulse'

- name: Line-in capture to the snapserver
  ansible.builtin.import_tasks: capture.yml
  when: audio_endpoint_capture | bool
