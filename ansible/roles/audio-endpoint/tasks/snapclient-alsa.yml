---
# alsa backend: the packaged system snapclient.service (it reads
# SNAPCLIENT_OPTS from /etc/default/snapclient) plays straight to the USB card,
# named by its ALSA id so a re-enumeration cannot point it at another card.

- name: Configure the system snapclient
  ansible.builtin.template:
    src: snapclient.default.j2
    dest: /etc/default/snapclient
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart system snapclient

# In --check a just-"installed" package is not really there, so neither is
# its unit.
- name: Enable and start the system snapclient
  ansible.builtin.systemd_service:
    name: snapclient.service
    enabled: true
    state: started
  become: true
  when: not (ansible_check_mode and audio_endpoint_apt is changed)
