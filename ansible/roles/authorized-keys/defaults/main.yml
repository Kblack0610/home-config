---
# The keys that may log in as the login user. Additive: a key not listed here
# stays until it is listed with state: absent, so a host is never locked out by
# a short list. The PXE kickstart writes the first two at install time
# (infrastructure/pxe-server/http/kickstart/disk-install.sh, AUTHORIZED_KEYS);
# this role keeps every managed host in step after that.
authorized_keys_user: "{{ ansible_user }}"
# Set to a keys file to manage it directly instead of the user's
# ~/.ssh/authorized_keys (OpenWrt: /etc/dropbear/authorized_keys).
authorized_keys_file: ""
authorized_keys_list:
  - comment: the workstation (cachyos-x8664-main)
    key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM6yTlK3GCzXC2+njcPtTucjwxb53Sb0+JT+TuTD78Jh kblack0610@gmail.com
  - comment: the nightly convergence check (apps/ansible-runner)
    key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAm2iORKcEev3hnxx5sXtYvA4wcO2Xp+dnarHP7/4db1 ansible-runner@home-k3s
  # The human's client since 2026-11-15; it forwards queue and ask writes to
  # the fleet home over ssh.
