---
- name: Authorize the managed keys
  ansible.posix.authorized_key:
    user: "{{ authorized_keys_user }}"
    key: "{{ item.key }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ authorized_keys_list }}"
  loop_control:
    label: "{{ item.comment }}"
  when: authorized_keys_file | length == 0

# OpenWrt: no Python, and dropbear reads one root keys file. The play must run
# community.openwrt.init first (see the OpenWrt play in playbooks/site.yml).
- name: Authorize the managed keys (dropbear)
  community.openwrt.lineinfile:
    path: "{{ authorized_keys_file }}"
    line: "{{ item.key }}"
    state: "{{ item.state | default('present') }}"
    create: true
  loop: "{{ authorized_keys_list }}"
  loop_control:
    label: "{{ item.comment }}"
  when: authorized_keys_file | length > 0
