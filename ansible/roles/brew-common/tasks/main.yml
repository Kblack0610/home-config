---
- name: Check if Homebrew is installed
  ansible.builtin.stat:
    path: "{{ brew_binary }}"
  register: brew_stat

- name: Download Homebrew installer
  ansible.builtin.get_url:
    url: "{{ brew_install_url }}"
    dest: /tmp/brew-install.sh
    mode: "0755"
  when: not brew_stat.stat.exists

- name: Install Homebrew (non-interactive)
  ansible.builtin.command:
    cmd: /tmp/brew-install.sh
    creates: "{{ brew_binary }}"
  environment:
    NONINTERACTIVE: "1"
  when: not brew_stat.stat.exists
  changed_when: true

- name: Install baseline Homebrew packages
  community.general.homebrew:
    name: "{{ brew_common_packages }}"
    state: present
    update_homebrew: false

- name: Install host/group-specific Homebrew packages
  community.general.homebrew:
    name: "{{ brew_extra_packages }}"
    state: present
    update_homebrew: false
  when: brew_extra_packages | length > 0
