---
# One CPU and memory budget for all CI on a host. Every CI runner unit runs under
# ci.slice, in a child slice per workload, so Unity and platform jobs can each use
# the whole budget when the other is idle but never more than it together. Every
# docker container lands there too: docker's default cgroup parent is ci.slice,
# and a job may name a narrower child (the playground's in-docker.sh passes
# --cgroup-parent ci-unity.slice). Set per host in inventory.yml (ci_hosts).

# CPUs CI may use, as an AllowedCPUs list ("4-15"). The rest stay with k3s and
# the OS. A list and not a count because the hosts differ: some have E-cores
# among their CPUs, others have cores that are all alike.
ci_cpus: ""
# Memory for all CI together. Leave room for k3s pods and the OS.
ci_memory_max: 24G

# Unity: optional narrower CPU list inside ci_cpus (empty = all of ci_cpus), and
# a memory cap of its own. About 4-6 GB per Unity job.
ci_unity_cpus: ""
ci_unity_memory_max: 16G
# Optional: one CPU list per Unity pool slot (["2-4,10-12", "5-7,13-15"]), each
# inside ci_unity_cpus. Slot n then runs in its own ci-unity-<n>.slice, a child of
# ci-unity.slice, so two slots never take each other's cores: PlayMode tests run in
# real time and failed when two jobs shared eight threads (2026-10-06). Two
# slots overlap only where ci-runner-governor groups them (inventory unity_ci_slot_groups: a
# build slot and the test slots it never runs beside, aws-build-1), which
# scripts/render-ci-topology.py checks. Empty = every slot shares ci-unity.slice.
# Its length must equal unity_ci_slots.
ci_unity_slot_cpus: []
# true: each slot slice keeps its memory cap but may run on all of Unity's CPUs
# (ci_unity_cpus, else ci_cpus), so a busy job spills onto cores its neighbours leave
# idle; when every slot is busy they share at systemd's default equal CPUWeight.
# ci_unity_slot_cpus then sizes each slot (CI_SLOT_CPUS, its Forgejo seats, the
# governor's weights) instead of fencing it. Why: on ms-a2 slot 2 waited on its six
# threads 46% of the time while slots 1, 3 and 4 sat idle and the host had 15.6 of
# 32 threads busy (2026-11-19). Provisional, low confidence: on trial on ms-a2 only,
# against the PlayMode failure above; revisit after 48 h of PlayMode pass rate and job
# durations against deskslim-2 (hc-720).
ci_unity_slot_share: false
# Memory cap of each of those slot slices, so a runaway Unity dies at this size
# instead of growing to fill ci_unity_memory_max. The slots may add up to more
# than the Unity cap. Peaks count page cache, which a cap reclaims first, so a
# peak under no pressure overstates what a job needs: razer, with room to spare,
# saw 13 of 202 containers over 16G and killed none, including a 38.2G one.
# A list gives each slot its own, one entry per ci_unity_slot_cpus entry.
ci_unity_slot_memory_max: 32G

# CPUs the host's k3s pods run on, outside ci_cpus (empty = no pin). Set, the
# role makes the kubelet reserve every other CPU, so pods run only here and the
# scheduler stops placing more than fits: razer took 6-CPU freqtrade backtests
# beside its CI slots and the 15-minute load hit 18 (2026-11-10).
k3s_cpus: ""
# The k3s unit to restart for its kubelet args (k3s-agent on agents).
k3s_service: "k3s{{ '-agent' if (k3s_role | default('agent')) == 'agent' else '' }}.service"

# Slice names. systemd nests by name: ci-unity.slice is a child of ci.slice.
# The runner units (gh_runner_slice) and the Unity containers
# (UNITY_CI_CGROUP_PARENT, read by the game repos' in-docker.sh) both name these.
ci_slice: ci.slice
ci_unity_slice: ci-unity.slice
# Unity pool slot n's slice (with ci_unity_slot_cpus) is this prefix + n + ".slice".
ci_unity_slot_slice_prefix: "{{ ci_unity_slice | replace('.slice', '-') }}"

# The slices this role no longer runs: the per-workload ones it replaced (2026-10-24),
# and the light/heavy slots' (hc-627, 2026-11-18). Removed on apply.
ci_retired_slices:
  - unity-ci.slice
  - pmp-ci.slice
  # renamed 2026-11-03 when the platform runners became the org light/heavy pool
  - ci-pmp.slice
  - ci-linux.slice
