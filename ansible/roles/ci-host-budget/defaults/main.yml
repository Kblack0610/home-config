---
# One CPU and memory budget for all CI on a host. Every CI runner unit runs under
# ci.slice, in a child slice per workload, so Unity and platform jobs can each use
# the whole budget when the other is idle but never more than it together. Every
# docker container lands there too: docker's default cgroup parent is ci.slice,
# and a job may name a narrower child (the playground's in-docker.sh passes
# --cgroup-parent ci-unity.slice). Set per host in inventory.yml (ci_hosts).

# CPUs CI may use, as an AllowedCPUs list ("4-15"). The rest stay with k3s and
# the OS. A list and not a count because the hosts differ: on hp-victus the last
# eight CPUs are E-cores, on asus all sixteen are alike.
ci_cpus: ""
# Memory for all CI together. Leave room for k3s pods and the OS.
ci_memory_max: 24G

# Unity: optional narrower CPU list inside ci_cpus (empty = all of ci_cpus), and
# a memory cap of its own. About 4-6 GB per Unity job.
ci_unity_cpus: ""
ci_unity_memory_max: 16G
# Optional: one CPU list per Unity pool slot (["2-4,10-12", "5-7,13-15"]), each
# inside ci_unity_cpus and not overlapping. Slot n then runs in its own
# ci-unity-<n>.slice, a child of ci-unity.slice, so two slots never take each
# other's cores: PlayMode tests run in real time and failed when two jobs shared
# eight threads (asus, 2026-10-06). Empty = every slot shares ci-unity.slice.
# Its length must equal unity_ci_slots.
ci_unity_slot_cpus: []
# Memory cap of each of those slot slices, so a runaway Unity dies at this size
# instead of growing to fill ci_unity_memory_max. The slots may add up to more
# than the Unity cap. Peaks count page cache, which a cap reclaims first, so a
# peak under no pressure overstates what a job needs: razer, with room to spare,
# saw 13 of 202 containers over 16G and killed none, including a 38.2G one.
ci_unity_slot_memory_max: 32G
# Unity's share of contended CPUs against the platform slice (systemd default
# 100). Platform jobs still use Unity's CPUs when Unity is idle; when both want
# them, Unity gets about 80%, so a platform burst slows its timed tests less.
# A weight and not a CPU split, which would leave razer's three platform slots
# four threads.
ci_unity_cpu_weight: 400

# Platform (pmp) runners: memory cap of their own; they use all of ci_cpus.
ci_pmp_memory_max: 16G

# Slice names. systemd nests by name: ci-unity.slice is a child of ci.slice.
# The runner units (gh_runner_slice) and the Unity containers
# (UNITY_CI_CGROUP_PARENT, read by the game repos' in-docker.sh) both name these.
ci_slice: ci.slice
ci_unity_slice: ci-unity.slice
ci_pmp_slice: ci-pmp.slice
# Unity pool slot n's slice (with ci_unity_slot_cpus) is this prefix + n + ".slice".
ci_unity_slot_slice_prefix: "{{ ci_unity_slice | replace('.slice', '-') }}"

# The per-workload slices this role replaced (2026-10-24). Removed on apply.
ci_retired_slices:
  - unity-ci.slice
  - pmp-ci.slice
