---
- name: Require a CPU list for CI on this host
  ansible.builtin.assert:
    that: ci_cpus | length > 0
    fail_msg: >-
      {{ inventory_hostname }} has no ci_cpus. Add it to the ci_hosts group in
      inventory.yml with the CPUs CI may use.

# Each CPU list as numbers, so the checks below compare cores, not strings.
- name: Expand the host's CPU lists
  ansible.builtin.set_fact:
    _ci_cpu_sets: >-
      {% set out = {} %}{% for name, spec in {'ci': ci_cpus, 'unity': ci_unity_cpus,
      'linux': ci_linux_cpus, 'k3s': k3s_cpus,
      'slots': ci_unity_slot_cpus | join(',')}.items() %}{% set cpus = [] %}{%
      for part in (spec | string).split(',') if part | trim %}{% set ab = part | trim
      %}{% set ab = ab.split('-') %}{% for c in range(ab[0] | int, (ab[-1] | int) + 1)
      %}{% set _ = cpus.append(c) %}{% endfor %}{% endfor %}{% set _ = out.update({name: cpus})
      %}{% endfor %}{{ out }}

- name: Require the CPU lists to split the host cleanly
  ansible.builtin.assert:
    that:
      - _ci_cpu_sets.unity | difference(_ci_cpu_sets.ci) | length == 0
      - _ci_cpu_sets.linux | difference(_ci_cpu_sets.ci) | length == 0
      - _ci_unity_eff | intersect(_ci_cpu_sets.linux) | length == 0
      - _ci_cpu_sets.slots | difference(_ci_unity_eff) | length == 0
      - _ci_cpu_sets.k3s | intersect(_ci_cpu_sets.ci) | length == 0
      - ci_unity_slot_memory_max is string or ci_unity_slot_memory_max | length == ci_unity_slot_cpus | length
    fail_msg: >-
      {{ inventory_hostname }}: ci_unity_cpus (all of ci_cpus when empty) and
      ci_linux_cpus must sit inside ci_cpus and not overlap, every
      ci_unity_slot_cpus entry inside Unity's, k3s_cpus outside ci_cpus, and a
      ci_unity_slot_memory_max list one entry per slot ({{ _ci_cpu_sets }}).
    quiet: true
  vars:
    _ci_unity_eff: "{{ _ci_cpu_sets.unity or _ci_cpu_sets.ci }}"

- name: Install the CI slices
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.name }}"
    mode: "0644"
  loop:
    - { src: ci.slice.j2, name: "{{ ci_slice }}" }
    - { src: ci-unity.slice.j2, name: "{{ ci_unity_slice }}" }
    - { src: ci-linux.slice.j2, name: "{{ ci_linux_slice }}" }
  loop_control:
    label: "{{ item.name }}"
  register: _ci_slice_units

- name: Install the per-slot Unity slices
  ansible.builtin.template:
    src: ci-unity-slot.slice.j2
    dest: "/etc/systemd/system/{{ ci_unity_slot_slice_prefix ~ ci_unity_slot }}.slice"
    mode: "0644"
  loop: "{{ range(1, ci_unity_slot_cpus | length + 1) | list }}"
  loop_control:
    loop_var: ci_unity_slot
  register: _ci_slot_units

# A host that drops to fewer slots (or back to a shared slice) loses the extra
# slot slices here, so no stale cpuset is left for a unit to land in.
- name: Find per-slot Unity slices
  ansible.builtin.find:
    paths: /etc/systemd/system
    patterns: "{{ ci_unity_slot_slice_prefix }}*.slice"
  register: _ci_slot_found

- name: Remove per-slot Unity slices beyond ci_unity_slot_cpus
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _ci_slot_found.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: >-
    (item.path | basename | replace(ci_unity_slot_slice_prefix, '') | replace('.slice', '') | int)
    > (ci_unity_slot_cpus | length)
  register: _ci_slot_removed

# A unit still inside a retired slice keeps running there until the runner role
# restarts it into the new one (its unit file changes, so it does).
- name: Remove the retired per-workload slices
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop: "{{ ci_retired_slices }}"
  register: _ci_retired_units

- name: Reload systemd after the slices changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: >-
    _ci_slice_units.changed or _ci_retired_units.changed
    or _ci_slot_units.changed or _ci_slot_removed.changed

# k3s pin (k3s_cpus), its own file so the "Retire CI on no_ci_hosts" play in
# site.yml can run the removal half with k3s_cpus unset.
- name: Pin or unpin k3s pods
  ansible.builtin.import_tasks: k3s-pin.yml

# Containers are children of dockerd, not of the runner that asked for them, so a
# job's `docker run` lands in system.slice with no cap unless it passes
# --cgroup-parent. Only the playground does; dodginballs (plain docker run and
# game-ci/unity-builder) and platform service containers did not, and ran
# uncapped until 2026-10-26. Docker's default parent closes that for every repo:
# a container that names no slice goes into the host's CI budget, and one that
# names a narrower slice (the playground's ci-unity.slice) still gets it. Docker
# on these hosts is CI only; k3s runs on containerd.
- name: Read the docker daemon config
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: _ci_docker_daemon_json
  failed_when: false

- name: Ensure the docker config directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"

- name: Default every docker container into the CI budget
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: >-
      {{ ((_ci_docker_daemon_json.content | b64decode | from_json)
          if _ci_docker_daemon_json.content is defined else {})
         | combine({'cgroup-parent': ci_slice}) | to_nice_json }}
    mode: "0644"

# State, not a notify: a refused restart must still be pending on the next run,
# and a handler would be forgotten once the file is already written. live-restore
# is off on these hosts, so restarting dockerd kills the containers of a running
# job; refuse rather than do that.
- name: Check whether dockerd predates its config
  ansible.builtin.shell: |
    set -eu
    # Not installed yet (a new Ubuntu host, where unity-ci-host installs docker
    # after this role): it will start with this config, so nothing is stale.
    systemctl cat docker.service >/dev/null 2>&1 || { echo current; exit 0; }
    started=$(date -d "$(systemctl show docker.service -p ActiveEnterTimestamp --value)" +%s)
    [ "$(stat -c %Y /etc/docker/daemon.json)" -gt "$started" ] && echo stale || echo current
  register: _ci_docker_config_age
  changed_when: false
  check_mode: false

# A running job is a Runner.Worker process, not any container: a workstation
# keeps its own long-lived containers (a dev database, mailpit) that are not CI.
- name: List running CI jobs before restarting docker
  ansible.builtin.command: pgrep -x Runner.Worker
  register: _ci_docker_running
  changed_when: false
  failed_when: _ci_docker_running.rc > 1
  check_mode: false
  when: _ci_docker_config_age.stdout == 'stale'

- name: Refuse to restart docker under a running CI job
  ansible.builtin.assert:
    that: _ci_docker_running.stdout | length == 0
    fail_msg: >-
      A CI job is running on {{ inventory_hostname }}
      ({{ _ci_docker_running.stdout_lines | length }} Runner.Worker), and docker
      must restart to pick up its new config. Re-run this play when the host's
      runners are idle; the restart stays pending until then.
    quiet: true
  when: _ci_docker_config_age.stdout == 'stale' and not ansible_check_mode

- name: Restart docker to load its config
  ansible.builtin.systemd:
    name: docker.service
    state: restarted
  when: _ci_docker_config_age.stdout == 'stale'

