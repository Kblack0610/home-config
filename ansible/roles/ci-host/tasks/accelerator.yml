---
# Unity Accelerator on the docker bridge only (unity_ci_accelerator, defaults/main.yml).
- name: Create the Unity Accelerator store
  ansible.builtin.file:
    path: "{{ unity_ci_accelerator_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# In --check a unit the host lacks is not really written and systemd fails on it, which
# failed the convergence-check run and hid the host's later drift (tuf-b550, 2026-11-21,
# ar-4291). The start below and its restart handler skip only that case.
- name: Check whether the Unity Accelerator unit exists
  ansible.builtin.stat:
    path: /etc/systemd/system/unity-accelerator.service
  register: _unity_ci_accelerator_unit
  check_mode: false

- name: Write the Unity Accelerator unit
  ansible.builtin.template:
    src: unity-accelerator.service.j2
    dest: /etc/systemd/system/unity-accelerator.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart unity-accelerator

- name: Run the Unity Accelerator
  ansible.builtin.systemd:
    name: unity-accelerator.service
    enabled: true
    state: started
    daemon_reload: true
  when: not (ansible_check_mode and not _unity_ci_accelerator_unit.stat.exists)
