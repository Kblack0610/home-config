---
# What keeps a CI host from filling its disk, and every slot's job hook. Every CI
# host gets it (tasks/main.yml), a Unity-only one such as aws-spot-1 too.
- name: Create the disk prune script's and hook's directory
  ansible.builtin.file:
    path: "{{ linux_ci_disk_prune | dirname }}"
    state: directory
    mode: "0755"
  tags: [ci-disk]

- name: Install the disk prune script
  ansible.builtin.copy:
    src: ci-disk-prune.sh
    dest: "{{ linux_ci_disk_prune }}"
    mode: "0755"
  tags: [ci-disk]

- name: Install every slot's job hook (prunes on a Unity slot, empties a non-Unity workspace)
  ansible.builtin.template:
    src: job-started.sh.j2
    dest: "{{ linux_ci_job_started_hook }}"
    mode: "0755"
  tags: [ci-disk]

- name: Link the job hook's job-end name (its file name picks the event)
  ansible.builtin.file:
    src: "{{ linux_ci_job_started_hook | basename }}"
    dest: "{{ linux_ci_job_completed_hook }}"
    state: link
  tags: [ci-disk]

- name: Create the coredump drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/coredump.conf.d
    state: directory
    mode: "0755"
  tags: [ci-disk]

- name: Cap core dumps (the default is 10% of the disk, 93G here)
  ansible.builtin.copy:
    dest: /etc/systemd/coredump.conf.d/50-disk-cap.conf
    mode: "0644"
    content: |
      # Managed by ansible (ci-host).
      [Coredump]
      MaxUse={{ linux_ci_coredump_max_use }}
  tags: [ci-disk]

- name: Install the daily docker cleanup service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - linux-ci-docker-cleanup.service
    - linux-ci-docker-cleanup.timer
  register: _linux_ci_cleanup_units
  tags: [ci-disk]

- name: Reload systemd after unit changes
  ansible.builtin.systemd:
    daemon_reload: true
  when: _linux_ci_cleanup_units.changed
  tags: [ci-disk]

- name: Enable the docker cleanup timer
  ansible.builtin.systemd:
    name: linux-ci-docker-cleanup.timer
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [ci-disk]
