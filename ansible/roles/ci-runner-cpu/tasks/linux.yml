---
- name: Create the textfile directory
  ansible.builtin.file:
    path: "{{ ci_runner_cpu_linux_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the script
  ansible.builtin.copy:
    src: ci-runner-cpu-linux.sh
    dest: /usr/local/bin/ci-runner-cpu
    owner: root
    group: root
    mode: "0755"

- name: Install the service and timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    owner: root
    group: root
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - name: ci-runner-cpu.service
      content: |
        # Managed by ansible (roles/ci-runner-cpu). Do not edit by hand.
        [Unit]
        Description=Export the CPU each CI runner and its job are using for node-exporter

        [Service]
        Type=oneshot
        Nice=10
        TimeoutStartSec=30s
        ExecStart=/usr/local/bin/ci-runner-cpu {{ ci_runner_cpu_linux_textfile_dir }}
    - name: ci-runner-cpu.timer
      content: |
        # Managed by ansible (roles/ci-runner-cpu). Do not edit by hand.
        # A timer because cgroup CPU time has no event to wait on.
        [Unit]
        Description=Export CI runner CPU every {{ ci_runner_cpu_interval_seconds }} seconds

        [Timer]
        OnBootSec=1min
        OnUnitActiveSec={{ ci_runner_cpu_interval_seconds }}s
        AccuracySec=1s

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd for ci-runner-cpu

- name: Apply unit changes before starting the timer
  ansible.builtin.meta: flush_handlers

- name: Enable the timer
  ansible.builtin.systemd:
    name: ci-runner-cpu.timer
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"

- name: Write the first reading now
  ansible.builtin.systemd:
    name: ci-runner-cpu.service
    state: started
  when: not ansible_check_mode
