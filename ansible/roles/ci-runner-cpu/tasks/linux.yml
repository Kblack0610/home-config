---
- name: Create the textfile directory
  ansible.builtin.file:
    path: "{{ ci_runner_cpu_linux_textfile_dir }}"
    state: directory
    owner: "{{ ci_runner_cpu_linux_textfile_owner }}"
    mode: "0755"

- name: Install the script
  ansible.builtin.copy:
    src: ci-runner-cpu-linux.sh
    dest: /usr/local/bin/ci-runner-cpu
    owner: root
    group: root
    mode: "0755"

- name: Install the service and timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    owner: root
    group: root
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - name: ci-runner-cpu.service
      content: |
        # Managed by ansible (roles/ci-runner-cpu). Do not edit by hand.
        [Unit]
        Description=Export the CPU each CI runner and its job are using for node-exporter

        [Service]
        Type=oneshot
        Nice=10
        TimeoutStartSec=30s
        ExecStart=/usr/local/bin/ci-runner-cpu {{ ci_runner_cpu_linux_textfile_dir }}
    - name: ci-runner-cpu.timer
      content: |
        # Managed by ansible (roles/ci-runner-cpu). Do not edit by hand.
        # A timer because cgroup CPU time has no event to wait on.
        [Unit]
        Description=Export CI runner CPU every {{ ci_runner_cpu_interval_seconds }} seconds

        [Timer]
        OnBootSec=1min
        OnUnitActiveSec={{ ci_runner_cpu_interval_seconds }}s
        AccuracySec=1s

        [Install]
        WantedBy=timers.target
    - name: ci-runner-disk.service
      content: |
        # Managed by ansible (roles/ci-runner-cpu). Do not edit by hand.
        [Unit]
        Description=Export the disk each CI runner's home holds for node-exporter

        [Service]
        Type=oneshot
        Nice=19
        IOSchedulingClass=idle
        TimeoutStartSec=30min
        ExecStart=/usr/local/bin/ci-runner-cpu --disk {{ ci_runner_cpu_linux_textfile_dir }}
    - name: ci-runner-disk.timer
      content: |
        # Managed by ansible (roles/ci-runner-cpu). Do not edit by hand.
        # A timer because disk use has no event to wait on; hourly, like the CI disk prune.
        [Unit]
        Description=Export CI runner disk every {{ ci_runner_disk_interval }}

        [Timer]
        OnBootSec=5min
        OnUnitActiveSec={{ ci_runner_disk_interval }}

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd for ci-runner-cpu

- name: Apply unit changes before starting the timer
  ansible.builtin.meta: flush_handlers

- name: Enable the timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [ci-runner-cpu.timer, ci-runner-disk.timer]
  ignore_errors: "{{ ansible_check_mode }}"

- name: Write the first readings now
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    no_block: "{{ item == 'ci-runner-disk.service' }}"
  loop: [ci-runner-cpu.service, ci-runner-disk.service]
  when: not ansible_check_mode
