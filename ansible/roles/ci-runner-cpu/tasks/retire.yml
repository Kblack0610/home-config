---
# The removal half of linux.yml, for the "Retire CI on no_ci_hosts" play in site.yml:
# a host with no runners has no CI CPU to export.
- name: Stop and disable the CI CPU exporter
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: [ci-runner-cpu.timer, ci-runner-cpu.service]
  failed_when: false

- name: Remove the CI CPU exporter and its last reading
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/ci-runner-cpu.timer
    - /etc/systemd/system/ci-runner-cpu.service
    - /usr/local/bin/ci-runner-cpu
    - "{{ ci_runner_cpu_linux_textfile_dir }}/ci_runner.prom"
  register: _ci_runner_cpu_retired

- name: Reload systemd after the exporter went
  ansible.builtin.systemd:
    daemon_reload: true
  when: _ci_runner_cpu_retired.changed
