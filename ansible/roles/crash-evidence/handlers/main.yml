---
# Gated on `not ansible_check_mode`: nothing was written in --check.

- name: Reload netconsole
  # Module options are read only at load time, so a changed target needs an
  # unload + load. The Restart is the unit's ExecStop + ExecStart.
  ansible.builtin.systemd_service:
    name: netconsole
    state: restarted
    daemon_reload: true
  listen: reload netconsole
  when: not ansible_check_mode

- name: Apply the console loglevel
  ansible.builtin.command:
    cmd: /usr/sbin/sysctl -p /etc/sysctl.d/91-netconsole.conf
  listen: apply console loglevel
  changed_when: true
  when: not ansible_check_mode

- name: Reload the throttle timer
  ansible.builtin.systemd_service:
    name: rpi-throttled-textfile.timer
    state: restarted
    daemon_reload: true
  listen: reload throttle timer
  when: not ansible_check_mode
