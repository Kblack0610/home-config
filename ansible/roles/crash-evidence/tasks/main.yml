---
# Leave evidence behind when this host dies without warning: netconsole
# streams kernel messages to another box as they are printed, so the lines
# written in the last second before a freeze survive even though they never
# reach this host's SD card. The Pi undervoltage latch is roles/rpi-throttle-metric.
# See roles/crash-evidence/README.md.

- name: Resolve the netconsole target address from the inventory
  ansible.builtin.set_fact:
    netconsole_target_ip: "{{ hostvars[netconsole_receiver_host].ansible_host }}"
    netconsole_iface: "{{ ansible_default_ipv4.interface }}"

- name: Configure netconsole module options
  # No MAC after the target IP: netconsole then sends to the broadcast MAC, so
  # nothing breaks if the receiver's NIC is ever replaced. Every LAN host sees
  # the frame and all but the target drop it by IP; kernel logging is a
  # handful of lines a day.
  ansible.builtin.copy:
    dest: /etc/modprobe.d/netconsole.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ansible (roles/crash-evidence). Do not edit by hand.
      options netconsole netconsole={{ netconsole_src_port }}@{{ ansible_host }}/{{ netconsole_iface }},{{ netconsole_port }}@{{ netconsole_target_ip }}/
  notify: reload netconsole

- name: Install the netconsole unit
  # Loaded by a unit after network-online rather than modules-load.d: at
  # modules-load time eth0 has no address yet and netconsole refuses to start.
  ansible.builtin.copy:
    dest: /etc/systemd/system/netconsole.service
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ansible (roles/crash-evidence). Do not edit by hand.
      [Unit]
      Description=netconsole kernel log to {{ netconsole_target_ip }}:{{ netconsole_port }}
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/sbin/modprobe netconsole
      ExecStop=/usr/sbin/modprobe -r netconsole

      [Install]
      WantedBy=multi-user.target
  notify: reload netconsole

# 99- so it sorts after Raspberry Pi OS's 98-rpi.conf (kernel.printk = 3),
# which otherwise wins every time systemd-sysctl reapplies.
- name: Remove the old 91- file that 98-rpi.conf overrode
  ansible.builtin.file:
    path: /etc/sysctl.d/91-netconsole.conf
    state: absent

- name: Raise the console loglevel so ERR and WARNING reach netconsole
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-netconsole.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ansible (roles/crash-evidence). Do not edit by hand.
      kernel.printk = {{ netconsole_console_loglevel }} 4 1 3

# A task, not a handler: the read-back below runs before handlers, so a new
# host's first apply failed on printk, and a rerun with the file unchanged never
# applied it (deskslim-1, 2026-11-18).
- name: Apply the console loglevel to the running kernel
  ansible.builtin.shell: |
    set -o pipefail
    before=$(cut -f1 /proc/sys/kernel/printk)
    /usr/sbin/sysctl -q -p /etc/sysctl.d/99-netconsole.conf
    [ "$before" = "$(cut -f1 /proc/sys/kernel/printk)" ] || echo changed
  args:
    executable: /bin/bash
  register: crash_evidence_printk
  changed_when: "'changed' in crash_evidence_printk.stdout"
  when: not ansible_check_mode

- name: Enable netconsole
  ansible.builtin.systemd_service:
    name: netconsole
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

- name: Read back netconsole and loglevel
  ansible.builtin.shell: |
    set -o pipefail
    test -d /sys/module/netconsole && echo netconsole=loaded || echo netconsole=MISSING
    echo "printk=$(cut -f1 /proc/sys/kernel/printk)"
  args:
    executable: /bin/bash
  register: crash_evidence_state
  changed_when: false
  check_mode: false

- name: Report crash-evidence state
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: {{ crash_evidence_state.stdout_lines | join(' ') }}"

- name: Fail if netconsole is not live
  ansible.builtin.fail:
    msg: "{{ inventory_hostname }} crash-evidence not live: {{ crash_evidence_state.stdout_lines | join(' ') }}"
  when:
    - not ansible_check_mode
    - ('netconsole=loaded' not in crash_evidence_state.stdout)
      or ('printk=' ~ netconsole_console_loglevel not in crash_evidence_state.stdout_lines)
