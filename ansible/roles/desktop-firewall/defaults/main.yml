---
# Inbound ports this workstation opens to the LAN. ufw is active on the desktop
# and default-denies inbound, so a service the cluster proxies to needs a rule here.
desktop_firewall_rules:
  # agent-web, fronted by agents.kblab.me (apps/agents). Traefik reaches it from
  # the cluster nodes, which are all on 192.168.1.0/24.
  - port: "8790"
    proto: tcp
    from: 192.168.1.0/24
    comment: agent-web
  # node_exporter, scraped by Prometheus from the cluster nodes
  # (apps/monitoring/external-standalone-nodes.yaml).
  - port: "9100"
    proto: tcp
    from: 192.168.1.0/24
    comment: node-exporter
  # PXE install server (infrastructure/pxe-server), only listening while
  # `pxe-server start` runs. A booting client's first DHCP discover comes from
  # 0.0.0.0, so the proxy-DHCP ports cannot be limited to the LAN range.
  - port: "67"
    proto: udp
    from: any
    comment: pxe-proxy-dhcp
  - port: "4011"
    proto: udp
    from: any
    comment: pxe-proxy-dhcp-4011
  - port: "69"
    proto: udp
    from: 192.168.1.0/24
    comment: pxe-tftp
  - port: "9080"
    proto: tcp
    from: 192.168.1.0/24
    comment: pxe-http
