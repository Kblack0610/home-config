---
- name: Allow LAN access to workstation services
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    from_ip: "{{ item.from }}"
    comment: "{{ item.comment }}"
  loop: "{{ desktop_firewall_rules }}"
  loop_control:
    label: "{{ item.comment }} {{ item.port }}/{{ item.proto }}"
  become: true
