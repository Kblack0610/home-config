---
# What a session on a fleet worker runs: tmux and wt (from the dotfiles), the
# three harnesses, gh for its PRs, python-yaml and jq for fleet-hosts.sh, and
# rust and gcc to build agent-panel.
fleet_worker_packages:
  - git
  - tmux
  - stow
  - jq
  - python-yaml
  - github-cli
  - rust
  - gcc
  - openai-codex
  - opencode
# Ubuntu, the cloud worker (platform infra/aws-ci-burst, fleet-worker-1). It takes
# light claude items only, so it skips codex and opencode, which apt does not carry.
fleet_worker_packages_apt:
  - curl
  - git
  - tmux
  - stow
  - jq
  - python3-yaml
  - gh
# A cloud worker joins the tailnet to reach the state host and be reached by
# fleet-dispatch, with the auth key from SOPS (role tailscale-node).
fleet_tailscale: false
fleet_worker_dotfiles_repo: https://github.com/Kblack0610/.dotfiles.git
# Where fleet-hosts.sh reads the roster from (tasks/main.yml). The same remote and URL
# as the workstation's checkout; git.kennethblack.me does not serve it until #967 cuts over.
fleet_worker_roster_repo: https://git.kblab.me/kblack0610/home-config.git
# The fleet home is the worker fleet_state_host names (inventory.yml). It also
# takes the forwarded queue writes and serves agent-web: tasks/home.yml. The
# store's URLs are not here: every worker reads them from store.env (tasks/store.yml).
fleet_worker_is_home: "{{ inventory_hostname == fleet_state_host.split('.')[0] }}"
# The kubeconfig schedules-sync reads the exporter feed with on the home
# (tasks/home.yml): the scoped account's token and the cluster CA from
# group_vars/fleet_workers/vault.sops.yaml, the server from group_vars/all/k3s.yml.
fleet_home_feed_kubeconfig:
  apiVersion: v1
  kind: Config
  clusters:
    - name: home-k3s
      cluster:
        server: "{{ k3s_url }}"
        certificate-authority-data: "{{ vault_fleet_home_feed_ca | b64encode }}"
  users:
    - name: schedules-sync
      user:
        token: "{{ vault_fleet_home_feed_token }}"
  contexts:
    - name: home-k3s-feed
      context:
        cluster: home-k3s
        user: schedules-sync
        namespace: monitoring
  current-context: home-k3s-feed
