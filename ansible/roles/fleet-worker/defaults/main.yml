---
# What a session on a fleet worker runs: tmux and wt (from the dotfiles), the
# harnesses (claude and opencode; codex runs on the workstation only), gh for
# its PRs, python-yaml and jq for fleet-hosts.sh, bubblewrap, socat and npm for
# srt, the lane sandbox a headless harness runs in (tasks/harnesses.yml installs
# srt itself), and
# rust and gcc to build agent-panel, and mosquitto for agent-mqtt-publish, a
# singleton lane that runs on whichever peer holds the fleet lease. pnpm and uv
# build the standard repos (inventory fleet_workers fleet_repos): personal-sites
# is a pnpm workspace, and trader's checks install their pins with uv.
fleet_worker_packages:
  - git
  - tmux
  - stow
  - jq
  - python-yaml
  - github-cli
  - rust
  - gcc
  - opencode
  - bubblewrap
  - socat
  - nodejs
  - npm
  - mosquitto
  - pnpm
  - uv
# Ubuntu, the cloud worker (platform infra/aws-ci-burst, fleet-worker-1). It takes
# light claude items only, so it skips opencode, which apt does not carry.
fleet_worker_packages_apt:
  - curl
  - git
  - tmux
  - stow
  - jq
  - python3-yaml
  - gh
# A cloud worker joins the tailnet to reach the store and be reached by
# fleet-dispatch, with the auth key from SOPS (role tailscale-node).
fleet_tailscale: false
fleet_worker_dotfiles_repo: https://github.com/Kblack0610/.dotfiles.git
# Where fleet-hosts.sh reads the roster from (tasks/main.yml). The same remote and URL
# as the workstation's checkout; git.kennethblack.me does not serve it until #967 cuts over.
fleet_worker_forgejo_url: https://git.kblab.me
fleet_worker_roster_repo: "{{ fleet_worker_forgejo_url }}/kblack0610/home-config.git"
# The Forgejo bot a session on a worker pushes and opens home-config PRs as (tasks/main.yml):
# write on kblack0610/home-config only, read on the feed's private Forgejo repos; its token is
# vault_fleet_forgejo_token. docs/runbooks/fleet-worker.md, "Forgejo bot token".
fleet_worker_forgejo_user: fleet-worker
# The host every worker trusts for the store (tasks/store.yml): forge-primary is the
# live Forgejo, its ssh on 2222 (apps/forgejo/README.md), the host of store.env's
# STORE_PRIMARY_URL. A store.env that names another host fails the reach check on
# its host key, loudly.
fleet_store_host: forge-primary.kblab.me
fleet_store_port: 2222
# Forgejo's /data/ssh ed25519 host public key (apps/forgejo): rotate it here when the pod's key does.
fleet_store_host_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIHxSGZIZ3Eu5n4h+J9mB0wCBBTjqZMTJCAzvGXnKwHx
# The kubeconfig schedules-sync and agent-web-record use on every worker
# (tasks/peer.yml): the scoped account's token and the cluster CA from
# group_vars/fleet_workers/vault.sops.yaml, the server from group_vars/all/k3s.yml.
fleet_home_feed_kubeconfig:
  apiVersion: v1
  kind: Config
  clusters:
    - name: home-k3s
      cluster:
        server: "{{ k3s_url }}"
        certificate-authority-data: "{{ vault_fleet_home_feed_ca | b64encode }}"
  users:
    - name: schedules-sync
      user:
        token: "{{ vault_fleet_home_feed_token }}"
  contexts:
    - name: home-k3s-feed
      context:
        cluster: home-k3s
        user: schedules-sync
        namespace: monitoring
  current-context: home-k3s-feed
# Whether this peer may hold the fleet lease and so run the singleton lanes and agent-web
# (tasks/peer.yml writes the no-lease marker when false). A non-Arch one builds no
# agent-web, so it does not hold it by default.
fleet_lease: "{{ ansible_facts.os_family == 'Archlinux' }}"
