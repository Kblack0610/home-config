---
# The headless harnesses a worker runs besides claude (fleet_harnesses in inventory.yml). Each is a
# sandboxed opencode harness, so `fleet-dispatch harness-ready` on the worker wants opencode (the
# toolchain), the harness map, its eval config and its lane sandbox profile (all three from the
# private overlay), srt with bwrap and socat, and its gateway key file. fleet-dispatch places an item
# on one only while that probe says it is ready. bwrap, socat and npm come with fleet_worker_packages.
# Runbook: docs/runbooks/fleet-worker.md, "Headless harnesses".

# One pin, the workstation's: dotfiles packages.conf NPM_PACKAGES.
- name: Read the srt pin from the dotfiles
  ansible.builtin.command:
    argv: [grep, -oE, -m1, 'sandbox-runtime@[0-9.]+', "{{ ansible_env.HOME }}/.dotfiles/.local/src/installation_scripts/packages.conf"]
  register: fleet_harness_srt_pin
  changed_when: false
  failed_when: false
  check_mode: false

# Per user, into ~/.local: fleet-dispatch's ssh puts ~/.local/bin first on PATH (dotfiles fleet-hosts.sh).
- name: Install srt at that pin
  when: fleet_harness_srt_pin.rc == 0
  ansible.builtin.command:
    argv: [npm, install, -g, --prefix, "{{ ansible_env.HOME }}/.local", "@anthropic-ai/{{ fleet_harness_srt_pin.stdout }}"]
  register: _fleet_harness_srt
  changed_when: "'added' in _fleet_harness_srt.stdout or 'changed' in _fleet_harness_srt.stdout"

# The controller's map names each harness's key file (its key_file, else the gateway's), at the
# same path under $HOME on both machines, as fleet_repos dests are.
- name: Read each harness's key file from the controller's harness map
  ansible.builtin.set_fact:
    fleet_harness_keys: >-
      {{ fleet_harnesses | map('extract', _map.harnesses) | map(attribute='key_file', default=_map.gateway.key_file)
         | map('regex_replace', '^~/', '') | unique | list }}
  vars:
    _map: "{{ lookup('ansible.builtin.file', lookup('env', 'HOME') ~ '/.config/agentctl/harnesses.json') | from_json }}"

- name: Make the key files' directories
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/{{ item | dirname }}"
    state: directory
  loop: "{{ fleet_harness_keys | map('dirname') | unique | list }}"

# A secret: never logged, and --check skips it. A key the controller lacks is reported, not fatal.
- name: Copy each gateway key file from the controller
  when: (lookup('env', 'HOME') ~ '/' ~ item) is file
  ansible.builtin.copy:
    src: "{{ lookup('env', 'HOME') }}/{{ item }}"
    dest: "{{ ansible_env.HOME }}/{{ item }}"
    mode: "0600"
  loop: "{{ fleet_harness_keys }}"
  no_log: true

- name: Say what the harnesses still lack
  ansible.builtin.set_fact:
    fleet_harness_left: >-
      {{ ([] if fleet_harness_srt_pin.rc == 0 else ['no sandbox-runtime pin in ~/.dotfiles packages.conf, so no srt'])
         + (fleet_harness_keys | map('regex_replace', '^', lookup('env', 'HOME') ~ '/') | reject('file')
            | map('regex_replace', '^', 'gateway key not on this controller: ') | list) }}
