---
# The fleet home: the one worker named by fleet_state_host. Besides what every
# worker runs, it holds the agent store (~/.agent, the queue and asks other
# hosts forward to) and serves agent-web (agents.kblab.me, apps/agents points
# its Endpoints here). Runbook: docs/runbooks/fleet-worker.md, "The fleet home".

# Without lingering, every user unit (agent-web, the lanes, git-sync) stops when
# the last login ends, and a headless home has no login.
- name: Keep the user's units running with nobody logged in (linger)
  become: true
  ansible.builtin.command: loginctl enable-linger {{ ansible_user_id }}
  args:
    creates: /var/lib/systemd/linger/{{ ansible_user_id }}

# Arch only, like agent-panel in main.yml: apt's cargo is too old for it.
- name: Build agent-web (cargo, as the user)
  when: ansible_facts.os_family == "Archlinux"
  ansible.builtin.command: cargo build --release
  args:
    chdir: "{{ ansible_env.HOME }}/.dotfiles/.local/src/agent-web"
  register: _fleet_home_web
  changed_when: "'Compiling' in _fleet_home_web.stderr"

- name: Link agent-web onto PATH
  when: ansible_facts.os_family == "Archlinux"
  ansible.builtin.file:
    src: "{{ ansible_env.HOME }}/.dotfiles/.local/src/agent-web/target/release/agent-web"
    dest: "{{ ansible_env.HOME }}/.local/bin/agent-web"
    state: link
    force: true

# git-sync-agent.sh pushes the store with this key and nothing else. Its public
# half is a write deploy key on Forgejo kblack0610/.agent; the report prints it
# until the store clones.
- name: Make the key the store syncs with
  ansible.builtin.command: ssh-keygen -q -t ed25519 -N '' -C "agent-sync {{ inventory_hostname }}" -f {{ ansible_env.HOME }}/.ssh/id_agent_sync
  args:
    creates: "{{ ansible_env.HOME }}/.ssh/id_agent_sync"

# Scanned from the home itself, which is what dials Forgejo; the controller may
# resolve the name differently or not reach the tailnet at all.
- name: Scan Forgejo's host key from the home
  ansible.builtin.command: ssh-keyscan -t ed25519 -p {{ fleet_home_store_port }} {{ fleet_home_store_host }}
  register: _fleet_home_forge_key
  changed_when: false
  failed_when: false
  check_mode: false

- name: Trust Forgejo's host key
  when: _fleet_home_forge_key.stdout | trim | length > 0
  ansible.builtin.known_hosts:
    name: "[{{ fleet_home_store_host }}]:{{ fleet_home_store_port }}"
    key: "{{ _fleet_home_forge_key.stdout_lines | reject('match', '^#') | first }}"
    state: present

- name: Read whether the store is cloned
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.agent/.git"
  register: fleet_home_store

- name: Read whether the sync key reaches the store
  when: not fleet_home_store.stat.exists
  ansible.builtin.command: git ls-remote {{ fleet_home_store_repo }} HEAD
  environment:
    GIT_SSH_COMMAND: ssh -i {{ ansible_env.HOME }}/.ssh/id_agent_sync -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10
  register: fleet_home_store_reach
  changed_when: false
  failed_when: false
  check_mode: false

# A host that ran the lanes before it was home has a plain ~/.agent of its own
# runtime state. It is kept beside the clone, not merged: the store is the record.
# The lanes and agent-web stop first so nothing writes into the dir being moved;
# `agentctl reload` re-arms them once the human has signed in (the report says so).
- name: Clone the store into ~/.agent (the old dir is kept as ~/.agent.pre-home)
  when:
    - not fleet_home_store.stat.exists
    - fleet_home_store_reach.rc | default(1) == 0
  ansible.builtin.shell: |
    set -eo pipefail
    systemctl --user stop 'agentctl@*.timer' 'agentctl@*.service' agent-web.service || true
    if [ -e "$HOME/.agent.pre-home" ]; then echo "~/.agent.pre-home exists; move it aside first" >&2; exit 1; fi
    if [ -e "$HOME/.agent" ]; then mv "$HOME/.agent" "$HOME/.agent.pre-home"; fi
    GIT_SSH_COMMAND="ssh -i $HOME/.ssh/id_agent_sync -o IdentitiesOnly=yes -o BatchMode=yes" \
      git clone {{ fleet_home_store_repo }} "$HOME/.agent"
  args:
    executable: /bin/bash
    creates: "{{ ansible_env.HOME }}/.agent/.git"

# schedules-sync reads the github-runner-exporter feed with kubectl through the
# API server's Service proxy; without it no state.json is written and every
# nightly: queue hold waits forever. The home has no admin kubeconfig, so it
# gets one for the account that may read that proxy only
# (apps/github-runner-exporter/feed-reader-rbac.yaml), in its own file:
# ~/.kube/config is never written.
- name: Install kubectl, which schedules-sync reads the feed with
  when: ansible_facts.os_family == "Archlinux"
  become: true
  community.general.pacman:
    name: kubectl
    state: present

- name: Make schedules-sync's config dir
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/schedules-sync"
    state: directory
    mode: "0700"

- name: Write the kubeconfig schedules-sync reads the exporter feed with
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.config/schedules-sync/kubeconfig"
    mode: "0600"
    content: "{{ fleet_home_feed_kubeconfig | to_nice_yaml }}"
  no_log: true

- name: Make the schedules-sync unit's drop-in dir
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/systemd/user/schedules-sync.service.d"
    state: directory
    mode: "0755"

- name: Point schedules-sync at that kubeconfig
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/schedules-sync.service.d/exporter-feed.conf"
    mode: "0644"
    content: |
      # Written by home-config roles/fleet-worker (tasks/home.yml).
      [Service]
      Environment=KUBECONFIG=%h/.config/schedules-sync/kubeconfig
  register: _fleet_home_feed_dropin

- name: Reload the user units for that drop-in
  when: _fleet_home_feed_dropin is changed
  ansible.builtin.systemd_service:
    scope: user
    daemon_reload: true

- name: Read whether agent-web has its OAuth client
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.config/agent-web/oauth.json"
  register: fleet_home_oauth

# The unit and its EnvironmentFile come from the private overlay, stowed only
# once gh is signed in.
- name: Read whether agent-web's unit and env file are stowed
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/{{ item }}"
  loop:
    - .config/systemd/user/agent-web.service
    - .config/agent-web/env
  register: fleet_home_web_files

- name: Start agent-web
  when:
    - fleet_home_oauth.stat.exists
    - fleet_home_web_files.results | rejectattr('stat.exists') | list | length == 0
  ansible.builtin.systemd_service:
    name: agent-web.service
    scope: user
    enabled: true
    # A rebuilt binary reaches the running service only through a restart.
    state: "{{ 'restarted' if _fleet_home_web is changed else 'started' }}"
    daemon_reload: true

- name: Read the sync key's public half
  ansible.builtin.slurp:
    src: "{{ ansible_env.HOME }}/.ssh/id_agent_sync.pub"
  register: fleet_home_sync_pub
  failed_when: false

- name: Collect what only the human can do on the home
  ansible.builtin.set_fact:
    fleet_home_left: >-
      {{ ([] if fleet_home_store.stat.exists or fleet_home_store_reach.rc | default(1) == 0 else
          ['add this as a write deploy key on Forgejo kblack0610/.agent, then re-run: '
           ~ (fleet_home_sync_pub.content | default('') | b64decode | trim)])
         + ([] if fleet_home_oauth.stat.exists else
          ['write ~/.config/agent-web/oauth.json (0600) from rbw item agent-web-oauth-client, then re-run'])
         + ([] if fleet_home_web_files.results | rejectattr('stat.exists') | list | length == 0 else
          ['stow the private overlay (gh auth login, then re-run): agent-web needs its unit and ~/.config/agent-web/env']) }}
