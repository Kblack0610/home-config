---
# A fleet worker takes light claude sessions that fleet-dispatch places over
# ssh (dotfiles .local/lib/fleet-hosts.sh). This role installs what such a
# session runs, joins the agent store as a peer (tasks/store.yml), sets up what the
# fleet lease's holder runs (tasks/peer.yml), puts each Claude account's long-lived token on it
# (`claude-acct token push`, from the controller's unlocked rbw) and reports what only the human
# can do: add its store key on Forgejo.
# Runbook: docs/runbooks/fleet-worker.md.

- name: Install the session toolchain
  when: ansible_facts.os_family == "Archlinux"
  become: true
  community.general.pacman:
    name: "{{ fleet_worker_packages }}"
    state: present
    update_cache: true
  register: _fleet_worker_pkgs
  # update_cache counts a refreshed sync db as a change, and --check always does,
  # so ConvergenceDrift fired on every host nightly: only an installed package is one.
  changed_when: _fleet_worker_pkgs.packages | default([]) | length > 0

- name: Install the session toolchain (Ubuntu)
  when: ansible_facts.os_family == "Debian"
  become: true
  ansible.builtin.apt:
    name: "{{ fleet_worker_packages_apt }}"
    state: present
    update_cache: true

- name: Join the tailnet (a cloud worker)
  when: fleet_tailscale | bool
  ansible.builtin.include_role:
    name: tailscale-node
  vars:
    tailscale_node_hostname: "{{ fleet_ssh_host | default(inventory_hostname) }}"

- name: Install Claude Code (its native installer, per user)
  ansible.builtin.shell: set -o pipefail && curl -fsSL https://claude.ai/install.sh | bash
  args:
    executable: /bin/bash
    creates: "{{ ansible_env.HOME }}/.local/bin/claude"

# Cloned at main, then kept there by the dotfiles' own dotfiles-autopull, which
# dotfiles-autopull.timer below runs (no shell starts on a headless worker), not by
# this task: main moves many times a day, so update here would report a change on
# every --check.
# No submodules: two are private ssh remotes a fresh worker cannot reach, and
# a session needs none of them.
- name: Clone the public dotfiles, at main
  ansible.builtin.git:
    repo: "{{ fleet_worker_dotfiles_repo }}"
    dest: "{{ ansible_env.HOME }}/.dotfiles"
    version: main
    update: false
    recursive: false

- name: Disable submodule fetching in the public dotfiles
  community.general.git_config:
    repo: "{{ ansible_env.HOME }}/.dotfiles"
    scope: local
    name: fetch.recurseSubmodules
    value: "false"

# apply_dotfiles removes a plain ~/.bashrc and ~/.zshrc before it stows, so a
# copy of each is kept first. Runs once: the stowed agent-queue marks it done.
- name: Stow the dotfiles (apply_dotfiles)
  ansible.builtin.shell: |
    set -eo pipefail
    for f in "$HOME/.bashrc" "$HOME/.zshrc"; do
      if [ -f "$f" ] && [ ! -L "$f" ]; then cp -n "$f" "$f.pre-dotfiles"; fi
    done
    . "$HOME/.dotfiles/.local/src/installation_scripts/base_functions.sh"
    apply_dotfiles
  args:
    executable: /bin/bash
    creates: "{{ ansible_env.HOME }}/.local/bin/agent-queue"

# agent-panel lists this worker's sessions: the workstation's fleet-sessions runs
# `agent-panel list --json` over ssh, and a worker without it never shows any.
# A narrow task, not the dotfiles' build_local_rust_tools: that also builds
# agent-web, hub and timebox; tasks/peer.yml builds agent-web and hub and installs notes. Arch only: apt's
# cargo (1.75 on Ubuntu 24.04) is older than the Cargo.lock v4 and clap 4.6 here.
# A rebuild on each play is incremental; no timer rebuilds it between plays yet.
- name: Build agent-panel (cargo, as the user)
  when: ansible_facts.os_family == "Archlinux"
  ansible.builtin.command: cargo build --release
  args:
    chdir: "{{ ansible_env.HOME }}/.dotfiles/.local/src/agent-panel"
  register: _fleet_worker_panel
  changed_when: "'Compiling' in _fleet_worker_panel.stderr"

- name: Link agent-panel onto PATH
  when: ansible_facts.os_family == "Archlinux"
  ansible.builtin.file:
    src: "{{ ansible_env.HOME }}/.dotfiles/.local/src/agent-panel/target/release/agent-panel"
    dest: "{{ ansible_env.HOME }}/.local/bin/agent-panel"
    state: link
    force: true

- name: Read whether GitHub is signed in (the private overlay and every PR need it)
  ansible.builtin.command: gh auth status
  register: fleet_worker_gh
  changed_when: false
  failed_when: false
  check_mode: false

- name: Stow the private overlay (setup_dotfiles_private)
  when: fleet_worker_gh.rc == 0
  ansible.builtin.shell: |
    set -eo pipefail
    . "$HOME/.dotfiles/.local/src/installation_scripts/base_functions.sh"
    setup_dotfiles_private
  args:
    executable: /bin/bash
    creates: "{{ ansible_env.HOME }}/.dotfiles-private"

# Same path as on the workstation: fleet-dispatch places an item only when its
# repo's checkout is in this list, and opens the session at that path here.
- name: Clone the repos sessions run in (fleet_repos)
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ item.dest }}"
    remote: "{{ item.remote | default(omit) }}"
    update: false
  loop: "{{ fleet_repos | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"
  failed_when: false   # a private repo needs gh auth first; the report names it

# fleet-hosts.sh reads the roster (inventory.yml) from this checkout's forgejo/master,
# found by its path in the project map. Without it fleet-dispatch on this worker,
# when it holds the fleet lease, sees no other workers. Public on Forgejo, so no key. Kept fetched by fleet-roster-fetch.timer.
- name: Clone home-config, where the fleet roster is read
  ansible.builtin.git:
    repo: "{{ fleet_worker_roster_repo }}"
    dest: "{{ ansible_env.HOME }}/dev/home/home-config"
    remote: forgejo
    version: master
    update: false

# Without lingering, every user unit (the roster fetch, store-sync, and on the lease
# holder agent-web and the lanes) stops when the last login ends, and a headless
# worker has no login.
- name: Keep the user's units running with nobody logged in (linger)
  become: true
  ansible.builtin.command: loginctl enable-linger {{ ansible_user_id }}
  args:
    creates: /var/lib/systemd/linger/{{ ansible_user_id }}

# fleet-hosts also fetches on a read once the last fetch is FLEET_ROSTER_MAX_SECS
# old, but a sandboxed lane cannot take its lock and reads the ref as it is.
- name: Install the roster fetch timer
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/{{ item.name }}"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - name: fleet-roster-fetch.service
      content: |
        # Written by home-config roles/fleet-worker (tasks/main.yml).
        [Unit]
        Description=Fetch the fleet roster (home-config forgejo/master)
        [Service]
        Type=oneshot
        ExecStart=/bin/bash -c '. %h/.dotfiles/.local/lib/fleet-hosts.sh && fleet_roster_fetch'
    - name: fleet-roster-fetch.timer
      content: |
        # Written by home-config roles/fleet-worker (tasks/main.yml).
        [Unit]
        Description=Fetch the fleet roster every 10 minutes, inside fleet-hosts' 15-minute max age
        [Timer]
        OnBootSec=1min
        OnUnitActiveSec=10min
        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  register: _fleet_worker_roster_units

# --check writes no unit, so systemd would not find one it has not seen yet.
- name: Start the roster fetch timer
  when: not (ansible_check_mode and _fleet_worker_roster_units is changed)
  ansible.builtin.systemd_service:
    name: fleet-roster-fetch.timer
    scope: user
    enabled: true
    state: started
    daemon_reload: "{{ _fleet_worker_roster_units is changed }}"

# The dotfiles pull themselves at an interactive shell start (~/.zshrc), and a headless
# worker opens none: razer-laptop sat 27 commits behind from 11-08 to 11-18, so
# store-sync never got linked. Hourly; the script's own 6h throttle sets the real pace.
- name: Install the dotfiles pull timer
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/{{ item.name }}"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - name: dotfiles-autopull.service
      content: |
        # Written by home-config roles/fleet-worker (tasks/main.yml).
        [Unit]
        Description=Bring ~/.dotfiles and ~/.dotfiles-private to main and link what they add
        [Service]
        Type=oneshot
        ExecStart=%h/.local/bin/dotfiles-autopull
    - name: dotfiles-autopull.timer
      content: |
        # Written by home-config roles/fleet-worker (tasks/main.yml).
        [Unit]
        Description=Pull the dotfiles hourly; dotfiles-autopull itself skips a pass under 6h old
        [Timer]
        OnBootSec=5min
        OnUnitActiveSec=1h
        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  register: _fleet_worker_pull_units

- name: Start the dotfiles pull timer
  when: not (ansible_check_mode and _fleet_worker_pull_units is changed)
  ansible.builtin.systemd_service:
    name: dotfiles-autopull.timer
    scope: user
    enabled: true
    state: started
    daemon_reload: "{{ _fleet_worker_pull_units is changed }}"

- name: Read which repos are cloned
  ansible.builtin.stat:
    path: "{{ item.dest | regex_replace('^~', ansible_env.HOME) }}/.git"
  loop: "{{ fleet_repos | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"
  register: fleet_worker_clones

- name: Read the account dirs claude-acct knows
  ansible.builtin.command: >-
    awk '!/^#/ && NF == 2 && $2 != "-" { print $2 }'
    {{ ansible_env.HOME }}/.dotfiles/.config/claude-acct/accounts
  register: fleet_worker_accounts
  changed_when: false
  failed_when: false
  check_mode: false

- name: Create each account dir, empty (the session signs in with the pushed token)
  ansible.builtin.file:
    path: "{{ item | regex_replace('^~', ansible_env.HOME) }}"
    state: directory
    mode: "0700"
  loop: "{{ ['~/.claude'] + fleet_worker_accounts.stdout_lines }}"

# Every roster machine's key comes from the inventory (ssh_host_ed25519), never a scan, so the
# lease holder's fleet-dispatch reaches each worker, and a host that is off cannot leave it untrusted.
- name: Trust the roster's host keys
  ansible.builtin.import_role:
    name: host-identity
    tasks_from: known_hosts

# Before peer.yml: a join stops agent-web, which peer.yml starts again.
- name: Join the agent store as a peer
  ansible.builtin.include_tasks: store.yml

- name: Set up what the fleet lease's holder runs (agent-web, the lanes, schedules-sync)
  ansible.builtin.include_tasks: peer.yml

# The worker has no unlocked rbw (headless, rebooted with nobody to unlock it), so the
# controller's claude-acct copies every account's token to it over ssh stdin and reads each back
# through the worker's own claude-acct. Runs after the dotfiles are on the worker. A failure is
# reported, not fatal; --check skips it, since it writes secrets.
# Doc: dotfiles docs/operations/claude-acct-tokens.md.
- name: Put the Claude account tokens on the worker
  ansible.builtin.command:
    argv:
      - "{{ lookup('env', 'HOME') }}/.local/bin/claude-acct"
      - token
      - push
      - "{{ ((hostvars[inventory_hostname].ansible_user ~ '@') if hostvars[inventory_hostname].ansible_user is defined else '') ~ (fleet_ssh_host | default(inventory_hostname)) }}"
  delegate_to: localhost
  register: fleet_worker_tokens
  failed_when: false

- name: Report what only the human can do
  vars:
    fleet_worker_left: >-
      {{ ([] if fleet_worker_gh.rc == 0 else ['gh auth login, then re-run this play for the private overlay'])
         + ([] if fleet_worker_tokens.rc | default(0) == 0 else
            ['Claude tokens not pushed: ' ~ ('rbw unlock on this machine, then re-run' if fleet_worker_tokens.rc == 2
              else (fleet_worker_tokens.stderr_lines | default([]) | join('; ') | default('rc ' ~ fleet_worker_tokens.rc, true)))])
         + (fleet_worker_clones.results | rejectattr('stat.exists') | map(attribute='item.dest')
            | map('regex_replace', '^', 'not cloned: ') | list)
         + fleet_store_left
         + (fleet_home_left | default([])) }}
  ansible.builtin.debug:
    msg: >-
      {{ ('Ready: ' ~ inventory_hostname ~ ' is a peer of the store; set fleet_place: true in inventory.yml to let fleet-dispatch place sessions here.')
         if fleet_worker_left | length == 0 else
         'Left for the human on ' ~ inventory_hostname ~ ': ' ~ (fleet_worker_left | join('; ')) }}
