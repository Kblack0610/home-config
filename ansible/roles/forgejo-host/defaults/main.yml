---
# Forgejo on a plain Docker host (forge-hel1). Data lives on the Hetzner volume.
forgejo_host_data: /mnt/forgejo/data
# The one pin; scripts/forgejo-restore-drill.sh reads it from here too.
forgejo_host_image: data.forgejo.org/forgejo/forgejo:15.0.11@sha256:5d050e6d623e540923ff54b1c0c7acf41c3f9174a6c7ad515cc0c63d703fcd22
# Where Forgejo's HTTP port listens. Loopback until the tailnet is up; then
# the host's tailnet IP, so the cluster's forgejo-http Service can reach it.
forgejo_host_http_bind: 127.0.0.1
# The connector for the forge-hel1 Cloudflare tunnel (platform infra/forge-tunnel),
# same image as the cluster's public-sites connector, read from its Deployment.
forgejo_host_cloudflared_image: "{{ (lookup('file', playbook_dir ~ '/../../apps/cloudflared-public-sites/deployment.yaml') | from_yaml).spec.template.spec.containers[0].image }}"
# Where the container's sshd (git over ssh) is published, on the same bind.
# The cluster's forgejo-ssh Service (an ExternalName of forge-primary.kblab.me) reaches it.
forgejo_host_ssh_port: 2222
# Postgres for Forgejo's records (SQLite until the switch; forgejo-pg-migrate
# moves the rows). In the compose file, on the volume, reachable only on the
# compose network until standbys stream from it.
forgejo_host_postgres_image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
forgejo_host_postgres_data: /mnt/forgejo/postgres

# Extra root keys, only for the seed copy from asus-laptop; emptied after cutover.
forgejo_host_seed_keys: []

# Hourly jobs as systemd timers, each running files/jobs/<name>.sh in `image`
# with `env`. The timers are enabled on every host, and each run is skipped
# unless the compose forgejo container is up.
forgejo_host_backups: /mnt/forgejo/backups
forgejo_host_jobs:
  # VACUUM INTO plus quick_check, 48 kept, so a restore loses at most an hour
  # of PRs, issues and Actions state. forgejo-backup-pull ships them home.
  - name: forgejo-db-snapshot
    image: alpine:3.24.1
    on_calendar: "*-*-* *:07:00"
    timeout_sec: 900
    volumes:
      - "{{ forgejo_host_data }}:/data"
      - "{{ forgejo_host_backups }}/snapshots:/snapshots"
    env: {}
  # Clears orphaned git locks (closed allowlist, age-gated) and reports each
  # reap to ntfy, so a crash mid-fetch costs at most an hour of mirror sync.
  - name: forgejo-lock-reaper
    image: alpine:3.24.1
    on_calendar: "*-*-* *:17:00"
    timeout_sec: 900
    volumes:
      - "{{ forgejo_host_data }}:/data"
    env:
      # The public ntfy, as the VM has no cluster DNS; the topic name is the
      # only token.
      NTFY_TOPIC: https://ntfy.kblab.me/homelab-alerts
      # Minutes. Must equal the exporter's STALE_LOCK_AFTER (7200s) below, so
      # the detector and the remediator agree on what "orphaned" means. 120 is
      # 2x [git.timeout] MIGRATE=3600 (files/app.ini), the longest a git
      # process Forgejo starts can live; the job cannot see Forgejo's PIDs, so
      # this age gate is the guard against reaping a live lock.
      STALE_MINUTES: "120"

# The mirror exporter (files/mirror-exporter/exporter.py, stdlib python),
# a compose service beside Forgejo; apps/forgejo/scrapeconfig-mirror-exporter.yaml
# scrapes it on 9310.
forgejo_host_exporter_image: python:3.12-alpine
forgejo_host_exporter_env:
  FORGEJO_DB_PATH: /data/gitea/gitea.db
  FORGEJO_REPO_ROOT: /data/git/repositories
  # 2x [git.timeout] MIGRATE=3600 in files/app.ini; older locks were left by a
  # dead process. Raise it with [git.timeout] and STALE_MINUTES above.
  STALE_LOCK_AFTER: "7200"
  DB_REFRESH_SECONDS: "120"
  FS_REFRESH_SECONDS: "600"
  # A direct read-only open works against a WAL database on a read-only mount
  # while Forgejo runs (the -shm exists); against a hot rollback journal, the
  # state a crashed writer leaves, the snapshot copy takes over. Watch
  # forgejo_mirror_exporter_db_read_mode for the live path.
  DB_READ_MODE: auto
  SNAPSHOT_DIR: /tmp/snap
  # 3x the ~61MB database; past it the snapshot path fails loudly
  # (scrape_ok=0, reason=too_large) instead of filling the 256m tmpfs.
  SNAPSHOT_MAX_BYTES: "201326592"

# asus-laptop's forgejo-backup-pull CronJob (apps/forgejo/backup-pull-cronjob.yaml).
# Private half: apps/forgejo/backup-pull-secret.sops.yaml. A root key because
# data/ssh holds root-owned 0600 host keys a full must carry; the forced
# command makes it a read-only rsync of /mnt/forgejo and nothing else.
forgejo_host_pull_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPDLUx/rMduoKIoX/u/op27mjNRk8GYr+5y45gE9LdPi forgejo-backup-pull@asus-laptop
