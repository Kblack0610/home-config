---
# Forgejo on a plain Docker host (forge-hel1). Data lives on the Hetzner volume.
forgejo_host_data: /mnt/forgejo/data
# The image k8s ran, pinned by index digest (apps/forgejo/deployment.yaml).
forgejo_host_image: data.forgejo.org/forgejo/forgejo:14.0.4@sha256:f33e1b5087b7dc3bdbb60ceb0e6f32bf0ce06376328d17c7db86fba62b673f6f
# Stopped until cutover: two Forgejos writing two copies would fork the data.
forgejo_host_running: false
# Where Forgejo's HTTP port listens. Loopback until the tailnet is up; then
# the host's tailnet IP, so the cluster's forgejo-http Service can reach it.
forgejo_host_http_bind: 127.0.0.1
# Extra root keys, only for the seed copy from asus-laptop; emptied after cutover.
forgejo_host_seed_keys: []
