---
# One Forgejo seat per lendable Unity slot (the topology's slots with forge "forgejo", one
# per Unity test slot of a host whose ci_caps carry forgejo). A seat has no cores of its own:
# its supervisor (files/forgejo-seat.py) runs `forgejo-runner one-job` only while
# ci-runner-governor lends it the slot it borrows, in that slot's slice. Called once per
# seat from the CI play in playbooks/site.yml with forgejo_runner_name, forgejo_runner_home,
# forgejo_runner_slot and forgejo_runner_slice set.
forgejo_runner_version: "13.2.1"
forgejo_runner_sha256: bb369fe1ecb50fdc983c0b1d993f19b0920df6e5864511892b3cdbf16d858b34
forgejo_runner_url: "https://code.forgejo.org/forgejo/runner/releases/download/v{{ forgejo_runner_version }}/forgejo-runner-{{ forgejo_runner_version }}-linux-amd64"
forgejo_runner_bin: "/usr/local/bin/forgejo-runner-{{ forgejo_runner_version }}"
forgejo_seat_bin: /usr/local/bin/forgejo-seat
# The record that names the live Forgejo host's tailnet IP (apps/forgejo/README.md,
# "Where Forgejo runs and how to move it"), so a failover moves the runners with it and
# polling, logs and artifacts skip Traefik and CrowdSec. Jobs still clone from ROOT_URL.
forgejo_runner_instance: http://forge-primary.kblab.me:3000
# The governor's lease NodePort (apps/ci-runner-governor/deployment.yaml) at pi5-master, the
# k3s server: a long-poll of up to 300s outlives Traefik's 60s timeout, so no ingress.
forgejo_runner_lease_url: http://192.168.1.20:30321
# The instance registration token: forgejo forgejo-cli actions generate-runner-token
# (docs/credentials.md).
forgejo_runner_token: "{{ vault_forgejo_runner_registration_token }}"
forgejo_runner_user: linux-ci
forgejo_runner_group: linux-ci
forgejo_runner_user_home: /var/lib/linux-ci
# The labels the k3s runner pod served, so every workflow's runs-on stays as it is.
forgejo_runner_labels:
  - "docker:docker://docker:27"
  - "linux-amd64:host"
