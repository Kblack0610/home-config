---
# Where the runner registers. repo: one repo (gh_runner_repo) sees it. org: every repo
# in gh_runner_owner sees it, through the org's Default runner group (the Unity pool).
# An org registration token needs an org admin; with token_source=gh that is the
# workstation's gh with the admin:org scope (gh auth refresh -h github.com -s admin:org).
gh_runner_scope: repo
gh_runner_owner: BlackNBrownStudios
gh_runner_repo: platform
gh_runner_url: "https://github.com/{{ gh_runner_owner }}{{ '' if gh_runner_scope == 'org' else '/' ~ gh_runner_repo }}"
gh_runner_api_path: "{{ 'orgs/' ~ gh_runner_owner if gh_runner_scope == 'org' else 'repos/' ~ gh_runner_owner ~ '/' ~ gh_runner_repo }}"

# PAT override — per-play, for hosts that register against a DIFFERENT repo
# than the default `vault_github_pat` covers (e.g. dodginballs). Undefined by
# default; the role falls back to `vault_github_pat` when unset. See role
# tasks/main.yml for the resolution logic.
# gh_runner_pat: "{{ vault_github_<repo>_pat }}"

# Pin the runner release. Bump deliberately (not automatically) — the runner
# binary self-updates in-place at runtime, but a clean re-provision uses this
# pinned tarball.
gh_runner_version: "2.337.0"
gh_runner_arch: x64
gh_runner_tarball: "actions-runner-linux-{{ gh_runner_arch }}-{{ gh_runner_version }}.tar.gz"
gh_runner_tarball_url: "https://github.com/actions/runner/releases/download/v{{ gh_runner_version }}/{{ gh_runner_tarball }}"
# sha256 for v2.337.0 linux-x64. Fetched from:
#   curl -sL https://github.com/actions/runner/releases/download/v2.337.0/actions-runner-linux-x64-2.337.0.tar.gz | sha256sum
# (matches the SHA block in the release notes). GitHub stops dispatching to
# runners that are too old, so bump this when provisioning a fresh host.
gh_runner_tarball_sha256: "70920811a4f8ad4328818682bca5c6469c1c942fab52448868071d0063816613"

# Host-side paths and identities.
gh_runner_user: actions-runner
gh_runner_group: actions-runner
gh_runner_home: /var/lib/actions-runner
gh_runner_work_dir: _work
# The runner USER's home. Defaults to the instance dir (one runner per user).
# Several instances can share one user by pointing gh_runner_home at
# <user_home>/<instance> - this stays fixed so a second instance never re-homes
# the user out from under the first.
gh_runner_user_home: "{{ gh_runner_home }}"

# Where the registration token comes from:
#   pat - vault_github_pat (or the gh_runner_pat override). Default; this is
#         what the dodginballs Unity binding uses.
#   gh  - mint a short-lived token on the control node with the already
#         authenticated `gh` CLI, so no standing secret is needed (same as the
#         github-actions-runner-mac role).
gh_runner_token_source: pat

# Skip the pacman step when a host-prep role has already installed packages
# (the per-instance loop in the platform CI play would otherwise repeat it).
gh_runner_install_packages: true

# Extra KEY=VALUE lines for the runner's .env (inherited by every job).
gh_runner_env: {}

# Optional systemd slice for the unit (resource caps live on the slice).
gh_runner_slice: ""

# Runner identity. Name defaults to hostname so re-running on a different host
# doesn't collide.
gh_runner_name: "{{ inventory_hostname }}-linux"
gh_runner_labels:
  - self-hosted
  - linux
  - x64
  - docker

# System packages mirroring what platform/tools/setup-mac-runner.sh installs on
# Mac (node@20, pnpm, jq) plus Linux-specific extras.
gh_runner_system_packages:
  - docker
  - docker-buildx
  - git
  - git-lfs
  - jq
  - nodejs-lts-iron
  - pnpm
  - curl
