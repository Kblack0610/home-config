---
# Target repo for the runner. Single-repo runners; change to org-scoped later if needed.
gh_runner_owner: BlackNBrownStudios
gh_runner_repo: platform
gh_runner_url: "https://github.com/{{ gh_runner_owner }}/{{ gh_runner_repo }}"

# PAT override — per-play, for hosts that register against a DIFFERENT repo
# than the default `vault_github_pat` covers (e.g. dodginballs). Undefined by
# default; the role falls back to `vault_github_pat` when unset. See role
# tasks/main.yml for the resolution logic.
# gh_runner_pat: "{{ vault_github_<repo>_pat }}"

# Pin the runner release to GitHub's current required minimum. If this is stale
# by the time the role runs, the runner self-updates on first start — BUT that
# self-update can race the first job dispatch (stale listener accepts a job
# against updated-on-disk binary → no worker spawns → stuck). Keep in sync:
#   gh api /repos/actions/runner/releases/latest --jq .tag_name
gh_runner_version: "2.334.0"
gh_runner_arch: x64
gh_runner_tarball: "actions-runner-linux-{{ gh_runner_arch }}-{{ gh_runner_version }}.tar.gz"
gh_runner_tarball_url: "https://github.com/actions/runner/releases/download/v{{ gh_runner_version }}/{{ gh_runner_tarball }}"
# sha256 for v2.334.0 linux-x64. Fetched from:
#   curl -sL https://github.com/actions/runner/releases/download/v2.334.0/actions-runner-linux-x64-2.334.0.tar.gz | sha256sum
gh_runner_tarball_sha256: "048024cd2c848eb6f14d5646d56c13a4def2ae7ee3ad12122bee960c56f3d271"

# Host-side paths and identities.
gh_runner_user: actions-runner
gh_runner_group: actions-runner
gh_runner_home: /var/lib/actions-runner
gh_runner_work_dir: _work

# Runner identity. Name defaults to hostname so re-running on a different host
# doesn't collide.
gh_runner_name: "{{ inventory_hostname }}-linux"
gh_runner_labels:
  - self-hosted
  - linux
  - x64
  - docker

# System packages mirroring what platform/tools/setup-mac-runner.sh installs on
# Mac (node@20, pnpm, jq) plus Linux-specific extras.
gh_runner_system_packages:
  - docker
  - docker-buildx
  - git
  - git-lfs
  - jq
  - nodejs-lts-iron
  - pnpm
  - curl
