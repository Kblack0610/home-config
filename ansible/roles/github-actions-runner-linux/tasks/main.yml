---
# Resolve the effective PAT. Most hosts use the shared `vault_github_pat`
# (platform-scoped). A per-play override via `gh_runner_pat` lets a second
# playbook register a runner against a DIFFERENT repo (e.g. dodginballs)
# with a separately-scoped PAT — without leaking either across repos.
- name: Resolve GitHub PAT for this runner binding
  ansible.builtin.set_fact:
    _effective_gh_runner_pat: "{{ gh_runner_pat | default(vault_github_pat | default('')) }}"
  no_log: true

- name: Assert GitHub PAT is available
  ansible.builtin.assert:
    that:
      - _effective_gh_runner_pat is defined
      - _effective_gh_runner_pat | length > 10
      - not (_effective_gh_runner_pat is match('^ghp_REPLACE_ME'))
    fail_msg: >-
      No usable GitHub PAT. Either set vault_github_pat in
      group_vars/linux_bare_metal/vault.yml (platform-scoped, default), OR
      pass gh_runner_pat via playbook vars referencing a repo-specific vault
      variable (e.g. vault_github_dodginballs_pat) for a per-repo runner.
      Both values must be `repo`-scoped PATs encrypted via `ansible-vault
      encrypt`.

- name: Install system packages
  community.general.pacman:
    name: "{{ gh_runner_system_packages }}"
    state: present
    update_cache: true

- name: Ensure docker daemon is enabled and running
  ansible.builtin.systemd:
    name: docker.service
    enabled: true
    state: started

- name: Create runner group
  ansible.builtin.group:
    name: "{{ gh_runner_group }}"
    system: true
    state: present

# The runner user's $HOME is the shared BASE dir (not the per-instance home),
# so a second runner play on the same host doesn't flap the user's home dir.
# Each instance's files live under {{ gh_runner_base }}/{{ gh_runner_name }}.
- name: Create runner user
  ansible.builtin.user:
    name: "{{ gh_runner_user }}"
    group: "{{ gh_runner_group }}"
    groups: [docker]
    append: true
    home: "{{ gh_runner_base }}"
    shell: /bin/bash
    system: true
    create_home: true

- name: Ensure runner home and work dirs exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ gh_runner_user }}"
    group: "{{ gh_runner_group }}"
    mode: "0750"
  loop:
    - "{{ gh_runner_home }}"
    - "{{ gh_runner_home }}/{{ gh_runner_work_dir }}"

- name: Download runner tarball
  ansible.builtin.get_url:
    url: "{{ gh_runner_tarball_url }}"
    dest: "/tmp/{{ gh_runner_tarball }}"
    checksum: "sha256:{{ gh_runner_tarball_sha256 }}"
    mode: "0644"
  register: runner_tarball_download

- name: Extract runner tarball into runner home
  ansible.builtin.unarchive:
    src: "/tmp/{{ gh_runner_tarball }}"
    dest: "{{ gh_runner_home }}"
    remote_src: true
    owner: "{{ gh_runner_user }}"
    group: "{{ gh_runner_group }}"
    creates: "{{ gh_runner_home }}/config.sh"

# Ephemeral registration token (valid ~1 hour), fetched from the GitHub API
# using the long-lived PAT. Mirrors the curl in platform/tools/register-mac-runner.sh.
- name: Fetch ephemeral runner registration token from GitHub
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ gh_runner_owner }}/{{ gh_runner_repo }}/actions/runners/registration-token"
    method: POST
    headers:
      Accept: application/vnd.github+json
      Authorization: "Bearer {{ _effective_gh_runner_pat }}"
      X-GitHub-Api-Version: "2022-11-28"
    status_code: 201
    return_content: true
  register: gh_registration_token
  when: not (ansible_check_mode)
  changed_when: false
  no_log: true

- name: Configure runner (idempotent via .runner marker)
  become: true
  become_user: "{{ gh_runner_user }}"
  ansible.builtin.command:
    argv:
      - "{{ gh_runner_home }}/config.sh"
      - --unattended
      - --replace
      - --url
      - "{{ gh_runner_url }}"
      - --token
      - "{{ gh_registration_token.json.token }}"
      - --name
      - "{{ gh_runner_name }}"
      - --labels
      - "{{ gh_runner_labels | join(',') }}"
      - --work
      - "{{ gh_runner_work_dir }}"
    chdir: "{{ gh_runner_home }}"
    creates: "{{ gh_runner_home }}/.runner"
  when: not (ansible_check_mode)
  no_log: true

- name: Install systemd unit for runner
  ansible.builtin.template:
    src: actions.runner.service.j2
    dest: "/etc/systemd/system/actions.runner.{{ gh_runner_name }}.service"
    mode: "0644"
  notify: restart github actions runner

- name: Enable and start the runner
  ansible.builtin.systemd:
    name: "actions.runner.{{ gh_runner_name }}.service"
    enabled: true
    state: started
    daemon_reload: true
