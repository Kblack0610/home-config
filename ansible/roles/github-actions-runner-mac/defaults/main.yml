---
# Target, mirroring github-actions-runner-linux: repo (one repo's runner, the
# mac-mini mobile runner) or org (every repo in the org, the Unity pool slots).
gh_runner_mac_scope: repo
gh_runner_mac_owner: BlackNBrownStudios
gh_runner_mac_repo: platform
gh_runner_mac_url: >-
  {{ 'https://github.com/' ~ gh_runner_mac_owner ~ (('/' ~ gh_runner_mac_repo) if gh_runner_mac_scope == 'repo' else '') }}
# The REST path the registration and removal tokens are minted under.
gh_runner_mac_api_path: >-
  {{ ('repos/' ~ gh_runner_mac_owner ~ '/' ~ gh_runner_mac_repo) if gh_runner_mac_scope == 'repo' else ('orgs/' ~ gh_runner_mac_owner) }}
# svc.sh names the LaunchAgent actions.runner.<owner>-<repo>.<name> for a repo
# runner and actions.runner.<owner>.<name> for an org one.
gh_runner_mac_svc_name: >-
  actions.runner.{{ gh_runner_mac_owner ~ (('-' ~ gh_runner_mac_repo) if gh_runner_mac_scope == 'repo' else '') }}.{{ gh_runner_mac_name }}

# Pin the runner release. Matches the Linux role's pinned version so the
# fleet runs a consistent actions-runner. Bump deliberately.
gh_runner_mac_version: "2.337.0"
gh_runner_mac_arch: arm64  # Both mac-studio (M3 Ultra) and mac-mini (M1) are Apple Silicon.
gh_runner_mac_tarball: "actions-runner-osx-{{ gh_runner_mac_arch }}-{{ gh_runner_mac_version }}.tar.gz"
gh_runner_mac_tarball_url: "https://github.com/actions/runner/releases/download/v{{ gh_runner_mac_version }}/{{ gh_runner_mac_tarball }}"
# sha256 fetched via:
#   curl -sL https://github.com/actions/runner/releases/download/v2.337.0/actions-runner-osx-arm64-2.337.0.tar.gz | sha256sum
# 2.320.0 could no longer register (404, "runner version is out of date",
# 2026-10-29); an installed runner updates itself, so only a new registration
# reads this pin.
gh_runner_mac_tarball_sha256: "5a2cd92908a93d7276a194e1de6008099f3e7946f3f8e14aa7a1a7b4a31fdec2"

# Runner install dir (user-scoped, no root needed for LaunchAgent mode).
# `svc.sh install` on macOS creates a per-user LaunchAgent at
# ~/Library/LaunchAgents/actions.runner.<owner>-<repo>.<name>.plist.
gh_runner_mac_home: "{{ ansible_env.HOME }}/actions-runner"

# Runner identity. Default name = hostname so re-running on a different
# host doesn't collide with an existing registration.
gh_runner_mac_name: "{{ inventory_hostname }}-mac"
gh_runner_mac_labels:
  - self-hosted
  - macOS
  - "{{ gh_runner_mac_arch }}"
# true registers with only gh_runner_mac_labels, without GitHub's own
# self-hosted/macOS/ARM64. An org runner otherwise matches every org job that
# asks for [self-hosted, macOS], such as the platform repo's iOS builds.
gh_runner_mac_no_default_labels: false

# Extra job environment, written to the runner's .env (HOME, for one, gives a
# Unity pool slot its own caches), and the job PATH written to its .path when
# set. A change restarts the runner. Empty = the runner's own defaults.
gh_runner_mac_env: {}
gh_runner_mac_path: ""

# Desired end-state for this runner on this host:
#   present (default) — download, register, install + start the LaunchAgent.
#   absent            — stop + uninstall the LaunchAgent, deregister from
#                       GitHub, and remove local markers. Bind the role in
#                       absent mode to demote a host that is no longer a CI
#                       runner (mac-studio became a dedicated LLM node
#                       2026-07-18; the mac-studio play sets this).
gh_runner_mac_state: present

# Registration-token source (used by BOTH present registration and absent
# deregistration):
#   gh  — mint on the control node via the authenticated `gh` CLI (default;
#         no standing secret in the repo). Workstation applies.
#   pat — GitHub REST API with vault_github_pat. For the in-cluster
#         ansible-runner CronJob, which has no `gh` binary.
gh_runner_mac_token_source: gh

# Self-heal a stale/orphaned local registration (a .runner marker whose
# GitHub-side runner was dropped). When true, the role stops + uninstalls the
# LaunchAgent and removes the marker before reconfiguring. Default false so
# steady-state drift-checks stay idempotent no-ops. Pass
# `-e gh_runner_mac_force_reregister=true` for the one-time recovery apply.
gh_runner_mac_force_reregister: false
