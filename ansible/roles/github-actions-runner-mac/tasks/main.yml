---
- name: Assert GitHub PAT is available from vault
  ansible.builtin.assert:
    that:
      - vault_github_pat is defined
      - vault_github_pat | length > 10
      - not (vault_github_pat is match('^ghp_REPLACE_ME'))
    fail_msg: >-
      vault_github_pat is missing or still the placeholder. Create
      group_vars/macos_hosts/vault.yml with a real PAT (scope: repo) and
      encrypt it via `ansible-vault encrypt`.

- name: Ensure runner home dir exists
  ansible.builtin.file:
    path: "{{ gh_runner_mac_home }}"
    state: directory
    mode: "0750"

- name: Download runner tarball
  ansible.builtin.get_url:
    url: "{{ gh_runner_mac_tarball_url }}"
    dest: "/tmp/{{ gh_runner_mac_tarball }}"
    checksum: "sha256:{{ gh_runner_mac_tarball_sha256 }}"
    mode: "0644"

- name: Extract runner tarball into runner home
  ansible.builtin.unarchive:
    src: "/tmp/{{ gh_runner_mac_tarball }}"
    dest: "{{ gh_runner_mac_home }}"
    remote_src: true
    creates: "{{ gh_runner_mac_home }}/config.sh"

# Ephemeral registration token (valid ~1 hour).
- name: Fetch ephemeral runner registration token from GitHub
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ gh_runner_mac_owner }}/{{ gh_runner_mac_repo }}/actions/runners/registration-token"
    method: POST
    headers:
      Accept: application/vnd.github+json
      Authorization: "Bearer {{ vault_github_pat }}"
      X-GitHub-Api-Version: "2022-11-28"
    status_code: 201
    return_content: true
  register: gh_mac_registration_token
  when: not ansible_check_mode
  changed_when: false
  no_log: true

- name: Configure runner (idempotent via .runner marker)
  ansible.builtin.command:
    argv:
      - "{{ gh_runner_mac_home }}/config.sh"
      - --unattended
      - --replace
      - --url
      - "{{ gh_runner_mac_url }}"
      - --token
      - "{{ gh_mac_registration_token.json.token }}"
      - --name
      - "{{ gh_runner_mac_name }}"
      - --labels
      - "{{ gh_runner_mac_labels | join(',') }}"
    chdir: "{{ gh_runner_mac_home }}"
    creates: "{{ gh_runner_mac_home }}/.runner"
  when: not ansible_check_mode
  no_log: true

# svc.sh install/start manages the LaunchAgent. Idempotent: the script
# no-ops when the plist already exists and the service is running.
- name: Install runner as a LaunchAgent
  ansible.builtin.command:
    argv:
      - "{{ gh_runner_mac_home }}/svc.sh"
      - install
    chdir: "{{ gh_runner_mac_home }}"
    creates: "{{ ansible_env.HOME }}/Library/LaunchAgents/actions.runner.{{ gh_runner_mac_owner }}-{{ gh_runner_mac_repo }}.{{ gh_runner_mac_name }}.plist"
  when: not ansible_check_mode

- name: Ensure runner LaunchAgent is started
  ansible.builtin.command:
    argv:
      - "{{ gh_runner_mac_home }}/svc.sh"
      - start
    chdir: "{{ gh_runner_mac_home }}"
  when: not ansible_check_mode
  changed_when: false
