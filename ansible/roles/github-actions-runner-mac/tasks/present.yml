---
# Registration token comes from one of two sources (gh_runner_mac_token_source):
#   gh  (default) — mint a short-lived token on the CONTROL NODE via the
#                   already-authenticated `gh` CLI. No standing secret in the
#                   repo. Right for workstation applies.
#   pat           — call the GitHub REST API with vault_github_pat. Needed by
#                   the in-cluster ansible-runner CronJob, which has no `gh`.

- name: Assert gh CLI is authenticated on the control node (token_source=gh)
  ansible.builtin.command: gh auth status
  delegate_to: localhost
  run_once: true
  changed_when: false
  when: gh_runner_mac_token_source == 'gh'

- name: Assert GitHub PAT is available from vault (token_source=pat)
  ansible.builtin.assert:
    that:
      - vault_github_pat is defined
      - vault_github_pat | length > 10
      - not (vault_github_pat is match('^ghp_REPLACE_ME'))
    fail_msg: >-
      token_source=pat but vault_github_pat is missing or still the
      placeholder. Add a real PAT (scope: repo) to
      group_vars/macos_hosts/vault.sops.yaml with `sops`, or use the default token_source=gh from a workstation.
  when: gh_runner_mac_token_source == 'pat'

- name: Ensure runner home dir exists
  ansible.builtin.file:
    path: "{{ gh_runner_mac_home }}"
    state: directory
    mode: "0750"

- name: Download runner tarball
  ansible.builtin.get_url:
    url: "{{ gh_runner_mac_tarball_url }}"
    dest: "/tmp/{{ gh_runner_mac_tarball }}"
    checksum: "sha256:{{ gh_runner_mac_tarball_sha256 }}"
    mode: "0644"

- name: Extract runner tarball into runner home
  ansible.builtin.unarchive:
    src: "/tmp/{{ gh_runner_mac_tarball }}"
    dest: "{{ gh_runner_mac_home }}"
    remote_src: true
    creates: "{{ gh_runner_mac_home }}/config.sh"

# Decide whether (re)registration is needed. A stale .runner marker whose
# GitHub-side registration has been dropped is exactly our 2026-07-17 case:
# without force_reregister the marker would make config.sh a no-op and the
# runner would stay orphaned.
- name: Detect existing runner marker
  ansible.builtin.stat:
    path: "{{ gh_runner_mac_home }}/.runner"
  register: gh_mac_runner_marker

- name: Decide whether to (re)register the runner
  ansible.builtin.set_fact:
    gh_mac_need_register: >-
      {{ (not gh_mac_runner_marker.stat.exists) or (gh_runner_mac_force_reregister | bool) }}

# Self-heal: tear down any stale local registration so config.sh can run
# cleanly. Gated on force alone (not on .runner existing): a partially-failed
# prior run can leave orphan markers like .runner_migrated behind WITHOUT a
# .runner, which would still trip "already configured". All steps here are
# idempotent / best-effort, so running them on an already-clean dir is a no-op.
- name: Force re-register — tear down stale runner registration
  when:
    - gh_runner_mac_force_reregister | bool
    - not ansible_check_mode
  block:
    - name: Stop the runner service (best effort)
      ansible.builtin.command:
        argv:
          - "{{ gh_runner_mac_home }}/svc.sh"
          - stop
        chdir: "{{ gh_runner_mac_home }}"
      failed_when: false
      changed_when: true

    - name: Uninstall the runner LaunchAgent (best effort)
      ansible.builtin.command:
        argv:
          - "{{ gh_runner_mac_home }}/svc.sh"
          - uninstall
        chdir: "{{ gh_runner_mac_home }}"
      failed_when: false
      changed_when: true

    # config.sh treats ANY of these as "already configured" and refuses to
    # reconfigure. .runner_migrated / .credentials_migrated are the v2-broker
    # migration markers a runner that has auto-updated past the v2 flow leaves
    # behind — miss them and re-register fails with "already configured" even
    # though .runner is gone (found 2026-07-17 on both Macs).
    - name: Remove stale runner registration files
      ansible.builtin.file:
        path: "{{ gh_runner_mac_home }}/{{ item }}"
        state: absent
      loop:
        - .runner
        - .runner_migrated
        - .credentials
        - .credentials_migrated
        - .credentials_rsaparams

# --- Registration token (only when we actually need to register) ----------
- name: Mint runner registration token via gh (control node)
  ansible.builtin.command:
    argv:
      - gh
      - api
      - --method
      - POST
      - "{{ gh_runner_mac_api_path }}/actions/runners/registration-token"
      - --jq
      - .token
  delegate_to: localhost
  register: gh_mac_gh_token
  changed_when: false
  no_log: true
  when:
    - gh_runner_mac_token_source == 'gh'
    - gh_mac_need_register | bool
    - not ansible_check_mode

- name: Fetch ephemeral runner registration token from GitHub (token_source=pat)
  ansible.builtin.uri:
    url: "https://api.github.com/{{ gh_runner_mac_api_path }}/actions/runners/registration-token"
    method: POST
    headers:
      Accept: application/vnd.github+json
      Authorization: "Bearer {{ vault_github_pat }}"
      X-GitHub-Api-Version: "2022-11-28"
    status_code: 201
    return_content: true
  register: gh_mac_pat_token
  changed_when: false
  no_log: true
  when:
    - gh_runner_mac_token_source == 'pat'
    - gh_mac_need_register | bool
    - not ansible_check_mode

- name: Resolve registration token from the selected source
  ansible.builtin.set_fact:
    gh_mac_reg_token: >-
      {{ gh_mac_gh_token.stdout | trim if gh_runner_mac_token_source == 'gh'
         else gh_mac_pat_token.json.token }}
  no_log: true
  when:
    - gh_mac_need_register | bool
    - not ansible_check_mode

- name: Configure runner (only when (re)registration is needed)
  ansible.builtin.command:
    argv: >-
      {{ [gh_runner_mac_home ~ '/config.sh', '--unattended', '--replace',
          '--url', gh_runner_mac_url, '--token', gh_mac_reg_token,
          '--name', gh_runner_mac_name, '--labels', gh_runner_mac_labels | join(',')]
         + (['--no-default-labels'] if gh_runner_mac_no_default_labels | bool else []) }}
    chdir: "{{ gh_runner_mac_home }}"
    creates: "{{ gh_runner_mac_home }}/.runner"
  when:
    - gh_mac_need_register | bool
    - not ansible_check_mode
  no_log: true

- name: Set extra job environment in the runner .env
  ansible.builtin.lineinfile:
    path: "{{ gh_runner_mac_home }}/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    create: true
    mode: "0640"
  loop: "{{ gh_runner_mac_env | dict2items }}"
  register: _gh_mac_env_file

- name: Set the job PATH in the runner .path
  ansible.builtin.copy:
    dest: "{{ gh_runner_mac_home }}/.path"
    content: "{{ gh_runner_mac_path }}\n"
    mode: "0640"
  when: gh_runner_mac_path | length > 0
  register: _gh_mac_path_file

# svc.sh install/start manages the LaunchAgent. Idempotent: the script
# no-ops when the plist already exists and the service is running.
- name: Install runner as a LaunchAgent
  ansible.builtin.command:
    argv:
      - "{{ gh_runner_mac_home }}/svc.sh"
      - install
    chdir: "{{ gh_runner_mac_home }}"
    creates: "{{ ansible_env.HOME }}/Library/LaunchAgents/{{ gh_runner_mac_svc_name }}.plist"
  when: not ansible_check_mode

# svc.sh writes RunAtLoad only, and runsvc.sh exits 0 when its node wrapper is signalled, so
# a killed runner stayed down until the next boot (2026-11-12: an agent's `pkill -x node` took
# both mac-mini runners offline for 45 minutes). KeepAlive has launchd start it again; svc.sh
# stop unloads the job, so a deliberate stop still holds.
- name: Read the LaunchAgent's KeepAlive
  ansible.builtin.command:
    argv: [plutil, -extract, KeepAlive, raw, "{{ ansible_env.HOME }}/Library/LaunchAgents/{{ gh_runner_mac_svc_name }}.plist"]
  register: _gh_mac_keepalive_now
  changed_when: false
  failed_when: false
  check_mode: false

- name: Restart the runner whenever its process exits (KeepAlive)
  ansible.builtin.command:
    argv: [plutil, -replace, KeepAlive, -bool, "true", "{{ ansible_env.HOME }}/Library/LaunchAgents/{{ gh_runner_mac_svc_name }}.plist"]
  register: _gh_mac_keepalive
  changed_when: true
  when: _gh_mac_keepalive_now.stdout | trim != 'true'

# The runner reads .env and .path when it starts, so a change needs a restart. A restart
# kills the job the runner is running, so it waits for an idle runner; one skipped under
# a job is kept in a marker file, since the next apply would otherwise see no change.
- name: Check for a restart an earlier apply deferred
  ansible.builtin.stat:
    path: "{{ gh_runner_mac_home }}/.restart-pending"
  register: _gh_mac_pending

# A running job is this runner's Runner.Worker; its path is <home>/bin/ or, after a
# self-update, <home>/bin.<version>/.
- name: Check whether the runner is running a job
  ansible.builtin.command:
    argv: [pgrep, -f, "^{{ gh_runner_mac_home }}/bin[^/]*/Runner.Worker"]
  register: _gh_mac_busy
  changed_when: false
  failed_when: _gh_mac_busy.rc > 1
  check_mode: false

- name: Decide whether the runner restarts now
  ansible.builtin.set_fact:
    _gh_mac_restart: "{{ _gh_mac_env_file is changed or _gh_mac_path_file is changed or _gh_mac_keepalive is changed or _gh_mac_pending.stat.exists }}"
    _gh_mac_is_busy: "{{ _gh_mac_busy.rc == 0 }}"

# Reported as changed, so a deferred restart shows in ConvergenceDrift until it runs.
- name: Defer the restart while a job runs
  ansible.builtin.copy:
    dest: "{{ gh_runner_mac_home }}/.restart-pending"
    content: ""
    mode: "0644"
  changed_when: true
  when: _gh_mac_restart and _gh_mac_is_busy

- name: Stop the runner for its restart
  ansible.builtin.command:
    argv:
      - "{{ gh_runner_mac_home }}/svc.sh"
      - stop
    chdir: "{{ gh_runner_mac_home }}"
  failed_when: false
  changed_when: true
  when:
    - _gh_mac_restart and not _gh_mac_is_busy
    - not ansible_check_mode

- name: Clear the deferred restart
  ansible.builtin.file:
    path: "{{ gh_runner_mac_home }}/.restart-pending"
    state: absent
  when: _gh_mac_pending.stat.exists and not _gh_mac_is_busy

- name: Ensure runner LaunchAgent is started
  ansible.builtin.command:
    argv:
      - "{{ gh_runner_mac_home }}/svc.sh"
      - start
    chdir: "{{ gh_runner_mac_home }}"
  when: not ansible_check_mode
  changed_when: false
