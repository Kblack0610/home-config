---
# The machines that dial each other over ssh (fleet-dispatch, agent-queue, wt): every host in
# these groups gets the others' keys, and its own key is checked. A group the inventory lacks
# adds no host.
host_identity_roster_groups: [desktop_workstations, fleet_workers, fleet_controllers]
# Read by ssh for every user on top of ~/.ssh/known_hosts, so no login state is touched, and a
# key here is accepted even when a stale one sits in a user's file.
host_identity_known_hosts_path: /etc/ssh/ssh_known_hosts
host_identity_devices_file: "{{ playbook_dir }}/../../infrastructure/dhcp/devices.yaml"
