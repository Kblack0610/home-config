---
# The machines that dial each other over ssh (fleet-dispatch, agent-queue, wt): every host in
# these groups gets the others' keys, and its own key is checked. A group the inventory lacks
# adds no host.
host_identity_roster_groups: [desktop_workstations, fleet_workers, fleet_controllers]
# Machines roster machines dial outside the roster (the Macs, the CI hosts): their keys go in every
# roster machine's block, but nothing is written on them and their own key is not checked there.
# Without linux_bare_metal, a rebuilt CI host needed a by-hand host key accept on every name.
host_identity_dial_target_groups: [macos_hosts, linux_bare_metal]
# Read by ssh for every user on top of ~/.ssh/known_hosts, so no login state is touched, and a
# key here is accepted even when a stale one sits in a user's file.
host_identity_known_hosts_path: /etc/ssh/ssh_known_hosts
host_identity_devices_file: "{{ playbook_dir }}/../../infrastructure/dhcp/devices.yaml"
# The hosts the runner's convergence-check dials: bare metal included, which is wider than the roster.
host_identity_runner_groups: [linux_bare_metal]
host_identity_runner_known_hosts_path: ~/.ssh/known_hosts
