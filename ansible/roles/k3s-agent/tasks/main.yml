---
- name: Assert k3s_role is one of server/agent
  ansible.builtin.assert:
    that:
      - k3s_role in ['server', 'agent']
    fail_msg: "k3s_role must be 'server' or 'agent' (got: {{ k3s_role }})."

- name: Assert k3s_install_version is pinned
  ansible.builtin.assert:
    that:
      - k3s_install_version is match('^v[0-9]+[.][0-9]+[.][0-9]+[+]k3s[0-9]+$')
    fail_msg: >-
      k3s_install_version must be a pinned release like v1.34.13+k3s1 (got:
      '{{ k3s_install_version }}'). It is set once, in group_vars/all/k3s.yml.

- name: Check if k3s binary is already present
  ansible.builtin.stat:
    path: "{{ k3s_binary_path }}"
  register: k3s_binary_stat

- name: Read the installed k3s version
  ansible.builtin.command:
    argv: ["{{ k3s_binary_path }}", "--version"]
  register: k3s_version_out
  changed_when: false
  check_mode: false
  when: k3s_binary_stat.stat.exists

- name: Compare the installed version with the pin
  ansible.builtin.set_fact:
    k3s_installed_version: "{{ k3s_version_out.stdout | regex_search('v[0-9]+[.][0-9]+[.][0-9]+[+]k3s[0-9]+') }}"
  when: k3s_binary_stat.stat.exists

# A kubelet downgrade is unsupported, and the only path back (the uninstall
# script) deletes every local-path PV under /var/lib/rancher/k3s/storage.
- name: Refuse to downgrade k3s
  ansible.builtin.assert:
    that:
      - (k3s_installed_version | regex_replace('^v|[+].*$', '')) is version(k3s_install_version | regex_replace('^v|[+].*$', ''), '<=')
    fail_msg: >-
      {{ inventory_hostname }} runs {{ k3s_installed_version }}, newer than the
      pin {{ k3s_install_version }}. Raise the pin; never downgrade a node.
  when: k3s_binary_stat.stat.exists

# An agent may run the pin only once the server does, whatever --limit says.
- name: Read the server's k3s version
  ansible.builtin.command:
    argv: ["{{ k3s_binary_path }}", "--version"]
  delegate_to: "{{ k3s_server_host }}"
  register: k3s_server_version_out
  changed_when: false
  check_mode: false
  when:
    - k3s_role == 'agent'
    - k3s_installed_version | default('') != k3s_install_version

- name: Refuse to put an agent ahead of the server
  ansible.builtin.assert:
    that:
      - k3s_install_version in k3s_server_version_out.stdout
    fail_msg: >-
      The server ({{ k3s_server_host }}) is not on {{ k3s_install_version }} yet;
      run `--limit {{ k3s_server_host }} --tags k3s` first.
  when:
    - k3s_role == 'agent'
    - k3s_installed_version | default('') != k3s_install_version
    - not ansible_check_mode

# A fresh node: the upstream installer writes the unit, the token env and the
# flags from k3s_extra_args, then joins.
- name: Join a new node
  when: not k3s_binary_stat.stat.exists
  block:
    - name: Assert k3s_token is available from vault
      ansible.builtin.assert:
        that:
          - vault_k3s_token is defined
          - vault_k3s_token | length > 10
          - not (vault_k3s_token is match('^REPLACE_ME'))
        fail_msg: >-
          vault_k3s_token is missing or still the placeholder. Read the real token
          from the server (pi5-master:/var/lib/rancher/k3s/server/node-token) and
          put it in group_vars/<group>/vault.sops.yaml with `sops`.
      when: k3s_role == 'agent'

    - name: Download k3s installer
      ansible.builtin.get_url:
        url: "{{ k3s_install_url }}"
        dest: /tmp/k3s-install.sh
        mode: "0755"

    - name: Install k3s ({{ k3s_role }})  # noqa: name[template]
      ansible.builtin.command:
        argv: "{{ ['/tmp/k3s-install.sh'] + (k3s_extra_args if k3s_role == 'server' else ['agent'] + k3s_extra_args) }}"
        creates: "{{ k3s_binary_path }}"
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_install_version }}"
        K3S_URL: "{{ k3s_url if k3s_role == 'agent' else '' }}"
        K3S_TOKEN: "{{ k3s_token if k3s_role == 'agent' else '' }}"
      no_log: true

# An existing node off the pin: swap only the binary and restart (k3s docs,
# "Manual upgrades", binary method). The unit, its flags, the token env and the
# data dir stay as they are, so flags the repo does not carry (the Pi agents'
# --with-node-id) survive. Restarting an agent leaves its containers running.
- name: Upgrade an existing node to the pin
  when:
    - k3s_binary_stat.stat.exists
    - k3s_installed_version != k3s_install_version
  block:
    - name: Download k3s {{ k3s_install_version }}  # noqa: name[template]
      ansible.builtin.get_url:
        url: "{{ k3s_release_url }}/{{ k3s_asset }}"
        checksum: "sha256:{{ k3s_release_url }}/sha256sum-{{ k3s_arch }}.txt"
        dest: "{{ k3s_binary_path }}"
        mode: "0755"
        force: true

    - name: Restart k3s on the new binary
      ansible.builtin.systemd:
        name: "{{ k3s_service }}"
        state: restarted

    - name: Wait for k3s to serve again
      ansible.builtin.wait_for:
        port: "{{ 6443 if k3s_role == 'server' else 10250 }}"
        timeout: 300
      when: not ansible_check_mode

- name: Ensure k3s systemd unit is enabled and running
  ansible.builtin.systemd:
    name: "{{ k3s_service }}"
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
