---
- name: Assert k3s_token is available from vault
  ansible.builtin.assert:
    that:
      - vault_k3s_token is defined
      - vault_k3s_token | length > 10
      - not (vault_k3s_token is match('^REPLACE_ME'))
    fail_msg: >-
      vault_k3s_token is missing or still the placeholder. Read the real token
      from the server (pi5-master:/var/lib/rancher/k3s/server/node-token) and
      put it in group_vars/<group>/vault.yml encrypted with `ansible-vault`.

- name: Assert k3s_role is one of server/agent
  ansible.builtin.assert:
    that:
      - k3s_role in ['server', 'agent']
    fail_msg: "k3s_role must be 'server' or 'agent' (got: {{ k3s_role }})."

- name: Check if k3s binary is already present
  ansible.builtin.stat:
    path: "{{ k3s_binary_path }}"
  register: k3s_binary_stat

- name: Download k3s installer
  ansible.builtin.get_url:
    url: "{{ k3s_install_url }}"
    dest: /tmp/k3s-install.sh
    mode: "0755"
  when: not k3s_binary_stat.stat.exists

- name: Install k3s ({{ k3s_role }})  # noqa: name[template]
  ansible.builtin.command:
    argv: "{{ ['/tmp/k3s-install.sh'] + (k3s_extra_args if k3s_role == 'server' else ['agent'] + k3s_extra_args) }}"
    creates: "{{ k3s_binary_path }}"
  environment:
    INSTALL_K3S_CHANNEL: "{{ k3s_install_channel }}"
    INSTALL_K3S_VERSION: "{{ k3s_install_version }}"
    K3S_URL: "{{ k3s_url if k3s_role == 'agent' else '' }}"
    K3S_TOKEN: "{{ k3s_token }}"
  no_log: true
  when: not k3s_binary_stat.stat.exists
  changed_when: true

- name: Ensure k3s systemd unit is enabled and running
  ansible.builtin.systemd:
    name: "k3s{{ '-agent' if k3s_role == 'agent' else '' }}.service"
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
