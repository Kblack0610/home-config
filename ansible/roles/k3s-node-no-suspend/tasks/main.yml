---
# Disable laptop suspend/lid-close behaviors on k3s nodes that happen to be
# laptops (hp-victus, asus-laptop). Without this, closing the lid suspends
# the kubelet, which silently takes the node out of the cluster — exactly
# the failure that bit the 2026-05 home-k3s outage where hp-victus went
# NotReady for two weeks (lid closed accidentally during another task).

- name: Ensure /etc/systemd/logind.conf.d exists (some Arch installs don't ship it)
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Configure systemd-logind to ignore lid-close + other sleep triggers
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/k3s-no-suspend.conf
    mode: "0644"
    owner: root
    group: root
    content: |
      # Managed by Ansible role k3s-node-no-suspend.
      # k3s agents on laptops must NOT suspend — doing so silently removes
      # the node from the cluster. See ansible/roles/k3s-node-no-suspend/.
      [Login]
      HandleLidSwitch=ignore
      HandleLidSwitchDocked=ignore
      HandleLidSwitchExternalPower=ignore
      HandleSuspendKey=ignore
      HandleHibernateKey=ignore
      IdleAction=ignore
  notify: Restart systemd-logind

- name: Mask sleep/suspend/hibernate/hybrid-sleep systemd targets
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
    enabled: false
    state: stopped
  loop:
    - sleep.target
    - suspend.target
    - hibernate.target
    - hybrid-sleep.target

# Apply handlers (logind reload) NOW so the new config takes effect before
# the convergence check runs. Without this the running daemon still has the
# old HandleLidSwitch=suspend on first apply.
- name: Apply pending handlers before live-state check
  ansible.builtin.meta: flush_handlers

# Idempotent convergence check: query live DBus state for every property the
# dropin sets, and if any haven't taken effect (e.g. on a rerun where the
# dropin file was already there but logind was never reloaded — Ansible
# handlers only fire on `changed`, not `ok`), SIGHUP logind to pick them up.
# This makes the role properly self-healing: running it always lands the
# cluster in the desired state, even if a previous run partially landed.
- name: Read live logind state for each managed property
  ansible.builtin.command:
    cmd: >-
      busctl --no-pager get-property org.freedesktop.login1
      /org/freedesktop/login1 org.freedesktop.login1.Manager {{ item }}
  register: logind_props
  changed_when: false
  loop:
    - HandleLidSwitch
    - HandleLidSwitchDocked
    - HandleLidSwitchExternalPower
    - HandleSuspendKey
    - HandleHibernateKey
    - IdleAction

- name: Reload logind if live state hasn't converged with on-disk config
  ansible.builtin.systemd_service:
    name: systemd-logind
    state: reloaded
  when: logind_props.results | map(attribute='stdout') | select('match', '.*ignore.*') | list | length < (logind_props.results | length)

- name: Final verify — all managed properties live as 'ignore'
  ansible.builtin.command:
    cmd: >-
      busctl --no-pager get-property org.freedesktop.login1
      /org/freedesktop/login1 org.freedesktop.login1.Manager {{ item }}
  register: logind_final
  changed_when: false
  failed_when: '"ignore" not in logind_final.stdout'
  loop:
    - HandleLidSwitch
    - HandleLidSwitchDocked
    - HandleLidSwitchExternalPower
    - HandleSuspendKey
    - HandleHibernateKey
    - IdleAction
