---
# launchd-mlx-server role defaults.
#
# Single LaunchAgent serving every model the cluster needs from one
# OpenAI-shaped REST endpoint. Replaces the 3-service legacy
# launchd-mlx-services + Ollama embedding combo.
#
# About the upstream package name (mlx-openai-server): the "openai" refers
# to API SHAPE compatibility (/v1/chat/completions, /v1/embeddings) — not
# the OpenAI vendor. Everything we own (role, launchd label, config dir,
# variable prefix) drops that prefix to avoid the muscle-memory confusion.
#
# The role does NOT create the Python venv. That is a one-time manual
# setup per mac (see this role's README), matching the existing
# precedent in `launchd-mlx-services/`.

# Python venv that ships mlx-openai-server. Created out-of-band — see
# README. Missing venv == role assertion fails fast.
#
# History: during the soak this lived in ~/mlx-oai-env, separate from the
# legacy ~/mlx-env that was pinning mlx-lm 0.30.7 + transformers 5.3.0
# under the retired launchd-mlx-services. After the legacy plists were
# removed and the legacy venv deleted, the venv was rebuilt at the
# canonical ~/mlx-env path with mlx-openai-server installed in it.
mlx_venv_path: "{{ ansible_env.HOME }}/mlx-env"
mlx_python_bin: "{{ mlx_venv_path }}/bin/python3"
mlx_server_bin: "{{ mlx_venv_path }}/bin/mlx-openai-server"

# Per-user LaunchAgent directory — GPU/Metal context belongs to the login
# user, so per-user (gui/$(id -u)) is the right scope.
mlx_launchagents_dir: "{{ ansible_env.HOME }}/Library/LaunchAgents"

# stdout/stderr destination. Survive-process-only logs in /tmp.
mlx_log_dir: /tmp

# Service identity. Single label, single port.
mlx_label: com.mlx-server
mlx_host: "0.0.0.0"
mlx_port: 8090

# Where the rendered server config lives. mlx-openai-server is launched
# with `--config <path>`; we keep it in ~/.config so it sits with the
# user's other tool configs and survives a venv rebuild.
mlx_config_dir: "{{ ansible_env.HOME }}/.config/mlx-server"
mlx_config_path: "{{ mlx_config_dir }}/config.yaml"

mlx_log_level: INFO

# HuggingFace Read token. Dropped to ~/.cache/huggingface/token (mode
# 0600) so first-time model downloads on this host don't hit the
# unauthenticated rate cap. Real value lives in
# group_vars/macos_hosts/vault.yml as `vault_huggingface_token`,
# encrypted with ansible-vault. The role refuses to apply if the token
# is missing or still the placeholder.
mlx_huggingface_token: "{{ vault_huggingface_token | default('') }}"
mlx_huggingface_token_path: "{{ ansible_env.HOME }}/.cache/huggingface/token"

# Model matrix served from the single process. Each entry maps directly to
# one item in the rendered YAML's `models:` list. Pinning is the default
# (omitting `on_demand` keeps the model resident); set `on_demand: true`
# on any entry that should idle-evict.
#
# served_model_name is the id LiteLLM uses in its routes (apps/litellm/
# configmap.yaml `model:` field). Keep it in sync.
#
# Memory budget on mac-studio M3 Ultra (512 GB):
#   Pinned (always resident):
#     Qwen3-Coder-Next-4bit          ~45 GB  (code slot)
#     Qwen3.6-35B-A3B-4bit (mlx)     ~20 GB  (reasoning slot, mlx-community)
#     Qwen3-4B-Instruct-2507-4bit     ~3 GB  (fast slot, latency-sensitive)
#     Qwen3-4B-Instruct-2507-8bit     ~5 GB  (fast slot, tool-reliable A/B)
#     modernbert-embed-base-4bit   ~250 MB   (embedding slot)
#                                  --------
#                                  ~73 GB pinned, ~407 GB usable headroom
#                                  (after ~480 GB wired budget) for the
#                                  on_demand candidates below (loaded one
#                                  at a time) + KV cache + OS + CI runner.
#   The dual-tier expansion candidates (6-bit coder, 480B coder, 397B
#   reasoner, Qwen3-VL, Qwen3-Embedding) are all `on_demand` — see the
#   MEMORY DISCIPLINE note by the mlx_models entries below.
#
# History note: a `smart (GLM-5-4bit)` on_demand slot at ~390 GB and a
# second `reasoning-ud` A/B variant (Unsloth Dynamic) were removed
# 2026-04-29 — GLM-5's cold-load thrashed macOS's VM allocator and
# evicted pages from the pinned slots, causing 60s+ timeouts on `code`
# and `reasoning`. Reasoning A/B was retired with the mlx-community
# variant kept (consumer-stable name in OpenClaw fallback chain).
# Re-add via this file if either slot is wanted again — HuggingFace
# weights are still cached locally.
#
# Why these specific picks:
#   - Coder (Qwen3-Coder-Next-4bit): hybrid attention + MoE w/ 3 B
#     active params, fastest-path coder; no need to upgrade.
#   - Reasoning (Qwen3.6-35B-A3B-4bit): unified VLM
#     (pipeline_tag: image-text-to-text) — but served here as
#     `model_type: lm` until mlx-openai-server's multimodal handler is
#     fixed. With model_type: multimodal (1.7.1 + 1.8.0 both tested) the
#     handler raises `RuntimeError: There is no Stream(gpu, 0) in current
#     thread` at mlx_vlm.py:620 on every request, text or image. Bug
#     reproduces against any VLM (GLM-4.6V-Flash and Qwen3.6 both fail
#     identically), so it's a worker-thread GPU context bug in
#     mlx-openai-server, not model-specific. Effect of `lm` here: text
#     prompts work as expected; image_url content parts are silently
#     ignored. Re-enable multimodal once upstream ships a fix or we
#     switch to a different VLM serving stack (mlx_vlm.server, vllm-mlx,
#     omlx). Tracker: cubist38/mlx-openai-server.
#     GLM-4.6V-Flash-4bit was dropped from the line-up entirely — same
#     bug, no extra value over Qwen3.6 once the bug is fixed.
#   - Embedding (modernbert-embed-base): nomic-family ModernBERT, 768
#     dim — matches mem0's pgvector schema, confirmed loading via
#     foreground smoke test before commit.
# Naming convention for served_model_name:
#   `<category> (<short-model-name>)` — category prefix for routing,
#   model name in parens for at-a-glance identification when listing
#   models or comparing variants. Multiple models can share a category
#   (e.g. `reasoning` mlx-community vs `reasoning-ud` Unsloth Dynamic
#   quant) so we can A/B-test alternatives without renaming consumers.
#   Spaces + parens are JSON-safe; OpenAI clients pass the string
#   verbatim in the request body. The `model_path` is unchanged from
#   the canonical HuggingFace path so weights resolve from the same HF
#   cache location.
#
# Parser registry (from mlx-openai-server's app/parsers/__init__.py
# REASONING_PARSER_MAP + TOOL_PARSER_MAP). Without these, models emit
# raw <tool_call>...</tool_call> and <think>...</think> tokens as plain
# text instead of structured `tool_calls` / `reasoning_content` fields,
# which breaks every agent integration (Codex, Aider, OpenWebUI, etc.).
mlx_models:
  - served_model_name: "code (Qwen3-Coder-Next-4bit)"
    model_path: mlx-community/Qwen3-Coder-Next-4bit
    model_type: lm
    enable_auto_tool_choice: true
    tool_call_parser: qwen3_coder    # FunctionParameterToolParser
    reasoning_parser: qwen3_moe      # Qwen3MoEReasoningParser (Hermes-style <think>)

  # Reasoning slot — mlx-community quant. Served as `lm` (text) — see
  # why-these-specific-picks above. Switch to `multimodal` once
  # mlx-openai-server's VLM handler GPU-thread bug is fixed.
  - served_model_name: "reasoning (Qwen3.6-35B-A3B-4bit)"
    model_path: mlx-community/Qwen3.6-35B-A3B-4bit
    model_type: lm
    enable_auto_tool_choice: true
    tool_call_parser: qwen3_moe      # HermesToolParser (Qwen3 MoE format)
    reasoning_parser: qwen3_5        # Qwen35ReasoningParser

  # Fast slot — small dense Qwen3 4B Instruct (non-thinking, 2507 release)
  # for latency-sensitive workloads where a frontier model is overkill.
  # First consumer: apps/karakeep/ INFERENCE_TEXT_MODEL — bookmark tagging
  # is a tiny extraction task, frontier-class models took ~10–15 s per
  # bookmark and this drops it under a second. ~3 GB resident, pins
  # trivially in the headroom. No tool/reasoning parsers — Karakeep uses
  # plain chat completion; add parsers if a future consumer needs tool
  # calls on this slot. Apache-2.0.
  # https://huggingface.co/mlx-community/Qwen3-4B-Instruct-2507-4bit
  - served_model_name: "fast (Qwen3-4B)"
    model_path: mlx-community/Qwen3-4B-Instruct-2507-4bit
    model_type: lm

  # Embedding endpoint that replaces the (now removed) Ollama LaunchAgent
  # on :11434. 768-dim output, matches what mem0's pgvector store at
  # apps/postgres/ is provisioned for. Verified loading + serving via a
  # foreground smoke test before this entry was committed.
  - served_model_name: "embedding (modernbert-embed-base-4bit)"
    model_path: mlx-community/nomicai-modernbert-embed-base-4bit
    model_type: embeddings

  # ------------------------------------------------------------------
  # Dual-tier expansion (2026-07): best-per-category MLX candidates so
  # each category can be A/B-tested local-vs-Lazer through the gateway.
  # The four entries ABOVE stay pinned + consumer-stable (do not rename
  # them — OpenClaw/Karakeep/binks reference the names verbatim). The
  # entries BELOW are the upgrade/expansion candidates.
  #
  # MEMORY DISCIPLINE — why almost all of these are on_demand:
  #   Pinned fleet base is ~73 GB (code-4bit 45 + reasoning-35B 20 +
  #   fast-4bit 3 + fast-8bit 5 + modernbert 0.25). on_demand models
  #   JIT-load on first request and idle-evict, so each loads ON TOP of
  #   that base one at a time. Individually they fit under the ~480 GB
  #   usable budget; DO NOT pin the big ones or two will co-resident-OOM.
  #   The 1T Kimi flagship (~468 GB) does NOT fit on top of the pinned
  #   fleet at all — it is a separate "flagship mode" (see README), not
  #   an entry here.
  #
  #   on_demand also SIDESTEPS the VLM startup crash: a multimodal model
  #   only instantiates its (currently-fragile) handler when requested,
  #   so a broken VLM can't take down the pinned fleet at boot. Local
  #   vision needs mlx-vlm >= 0.6.5 in the venv (fixes the Stream(gpu,N)
  #   thread bug) OR the server launched with --disable-batching — see
  #   README before flipping any consumer to the vlm route.

  # fast (8-bit) — same model as the pinned fast slot but 8-bit. On 512 GB
  # the extra ~2 GB is free and 8-bit materially improves multi-round
  # tool-call reliability (quantized MLX models drift into malformed tool
  # calls after several rounds). Pinned — it's tiny and latency-sensitive.
  # https://huggingface.co/mlx-community/Qwen3-4B-Instruct-2507-8bit
  - served_model_name: "fast (Qwen3-4B-8bit)"
    model_path: mlx-community/Qwen3-4B-Instruct-2507-8bit
    model_type: lm

  # code (6-bit) — Qwen3-Coder-Next at 6-bit instead of 4-bit. Code is
  # syntax-sensitive; 6-bit avoids the bracket/quote corruption aggressive
  # 4-bit can cause, and you have the RAM. Same qwen3_coder parser as the
  # pinned 4-bit slot, so it's a drop-in A/B. ~65 GB.
  # https://huggingface.co/lmstudio-community/Qwen3-Coder-Next-MLX-6bit
  - served_model_name: "code (Qwen3-Coder-Next-6bit)"
    model_path: lmstudio-community/Qwen3-Coder-Next-MLX-6bit
    model_type: lm
    on_demand: true
    on_demand_idle_timeout: 600
    enable_auto_tool_choice: true
    tool_call_parser: qwen3_coder
    reasoning_parser: qwen3_moe

  # code (heavy) — Qwen3-Coder-480B-A35B, the strongest turnkey MLX coder
  # that fits (480B total / 35B active, ~250 GB at 4-bit). Same qwen3_coder
  # parser, so it's a straight capability upgrade for hard multi-file work.
  # on_demand: too big to pin alongside the fleet.
  # https://huggingface.co/mlx-community/Qwen3-Coder-480B-A35B-Instruct-4bit
  - served_model_name: "code (Qwen3-Coder-480B-A35B-4bit)"
    model_path: mlx-community/Qwen3-Coder-480B-A35B-Instruct-4bit
    model_type: lm
    on_demand: true
    on_demand_idle_timeout: 600
    enable_auto_tool_choice: true
    tool_call_parser: qwen3_coder
    reasoning_parser: qwen3_moe

  # reasoning (big) — Qwen3.5-397B-A17B, the strongest reasoner-per-GB that
  # still leaves fleet headroom (~214 GB at 4-bit, 17B active -> fast).
  # Huge jump over the pinned 35B. Native qwen tool parser. on_demand.
  # https://huggingface.co/mlx-community/Qwen3.5-397B-A17B-4bit
  - served_model_name: "reasoning (Qwen3.5-397B-A17B-4bit)"
    model_path: mlx-community/Qwen3.5-397B-A17B-4bit
    model_type: lm
    on_demand: true
    on_demand_idle_timeout: 600
    enable_auto_tool_choice: true
    tool_call_parser: qwen3           # HermesToolParser (Qwen3 format)
    reasoning_parser: qwen3_5         # Qwen35ReasoningParser

  # vlm — Qwen3-VL-30B-A3B-Instruct at 8-bit (~34 GB, 3B active -> fast),
  # the first LOCAL vision route. model_type: multimodal. on_demand so a
  # fragile VLM handler can't crash the pinned fleet at boot; REQUIRES
  # mlx-vlm >= 0.6.5 in the venv (or --disable-batching) — see README.
  # Replaces the paid vlm (gemini-3-flash) for most image tasks once green.
  # https://huggingface.co/mlx-community/Qwen3-VL-30B-A3B-Instruct-8bit
  - served_model_name: "vlm (Qwen3-VL-30B-A3B-8bit)"
    model_path: mlx-community/Qwen3-VL-30B-A3B-Instruct-8bit
    model_type: multimodal
    on_demand: true
    on_demand_idle_timeout: 600

  # embedding (Qwen3) — Qwen3-Embedding-0.6B, a clear retrieval upgrade over
  # modernbert (multilingual, 32k context, instruction-aware). Its native
  # dim is 1024; mem0's pgvector column is vector(768). DO NOT point mem0 at
  # this until you have CONFIRMED it emits 768 dims (Matryoshka truncation)
  # from this server — otherwise inserts fail with a dim mismatch. Kept
  # on_demand + unwired from consumers as a test candidate for that reason.
  # https://huggingface.co/mlx-community/Qwen3-Embedding-0.6B-4bit-DWQ
  - served_model_name: "embedding (Qwen3-Embedding-0.6B)"
    model_path: mlx-community/Qwen3-Embedding-0.6B-4bit-DWQ
    model_type: embeddings
    on_demand: true
    on_demand_idle_timeout: 600
