---
# Python venv that ships mlx_lm. Created out-of-band (see
# docs/mac-machines.md:34 — `~/mlx-env`). This role does NOT create or
# maintain the venv; missing venv just means services fail to start,
# which is observable via `launchctl list` and log tailing.
mlx_venv_path: "{{ ansible_env.HOME }}/mlx-env"
mlx_python_bin: "{{ mlx_venv_path }}/bin/python3"

# Per-user LaunchAgent directory. LaunchAgents run under the login user —
# the right scope for a GPU workload that needs the user's GPU context.
# LaunchDaemons would run as root and can't touch the user's Metal shaders.
mlx_launchagents_dir: "{{ ansible_env.HOME }}/Library/LaunchAgents"

# Log dir for MLX stdout/stderr. /tmp matches what's documented at
# docs/mac-machines.md:35 — survive-process-only logs, no retention
# (logs rotate on reboot). Override to a persistent dir if needed.
mlx_log_dir: /tmp

# Service matrix. Mirrors docs/mac-machines.md:24-53. Each entry becomes
# a separate ~/Library/LaunchAgents/<label>.plist. Override in host_vars
# to add/remove models.
mlx_services:
  - label: com.mlx-lm.code
    model: mlx-community/Qwen3-Coder-Next-4bit
    port: 8080
  - label: com.mlx-lm.smart
    model: mlx-community/Qwen3-235B-A22B-4bit-DWQ
    port: 8081
  - label: com.mlx-lm.reasoning
    model: mlx-community/DeepSeek-R1-Distill-Qwen-32B-MLX-4Bit
    port: 8082
