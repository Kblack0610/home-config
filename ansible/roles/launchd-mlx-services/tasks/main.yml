---
- name: Warn if the MLX venv python is missing (role does not create it)
  ansible.builtin.stat:
    path: "{{ mlx_python_bin }}"
  register: mlx_python_stat

- name: Assert MLX venv exists
  ansible.builtin.assert:
    that:
      - mlx_python_stat.stat.exists
    fail_msg: >-
      MLX venv python not found at {{ mlx_python_bin }}. Create it first:
      python3 -m venv {{ mlx_venv_path }} && {{ mlx_venv_path }}/bin/pip install mlx-lm
      (per docs/mac-machines.md:34). This role only manages the launchd
      plists; it does not own the venv.

- name: Ensure LaunchAgents directory exists
  ansible.builtin.file:
    path: "{{ mlx_launchagents_dir }}"
    state: directory
    mode: "0755"

- name: Template MLX LaunchAgent plists
  ansible.builtin.template:
    src: mlx-service.plist.j2
    dest: "{{ mlx_launchagents_dir }}/{{ item.label }}.plist"
    mode: "0644"
  loop: "{{ mlx_services }}"
  loop_control:
    label: "{{ item.label }}"
  register: mlx_plist_results

# Reload only the services whose plist actually changed. `launchctl
# bootout` + `bootstrap` re-registers the agent under the current user's
# GUI session. The | default([]) guard lets --check mode pass without
# mlx_plist_results being populated.
- name: Reload MLX services whose plist changed
  ansible.builtin.shell: |
    launchctl bootout gui/$(id -u)/{{ item.item.label }} 2>/dev/null || true
    launchctl bootstrap gui/$(id -u) {{ item.dest }}
  loop: "{{ mlx_plist_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item.label | default('skipped') }}"
  when:
    - not ansible_check_mode
    - item.changed | default(false)
  changed_when: true
