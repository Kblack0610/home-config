---
# Host prep for the BlackNBrownStudios/platform self-hosted runners. The
# runner instances themselves come from the github-actions-runner-linux role,
# applied once per slot by the "Linux CI runners" play in site.yml.

# CPU and memory caps for the runners live in roles/ci-host-budget
# (ci-linux.slice), a dependency of this role.

# Runner user home; each slot lives under it. The job-started hook refuses to
# clean a workspace outside this tree.
linux_ci_user_home: /var/lib/linux-ci
linux_ci_job_started_hook: /usr/local/lib/linux-ci/job-started.sh
linux_ci_disk_prune: /usr/local/lib/linux-ci/ci-disk-prune.sh
linux_ci_coredump_max_use: 5G

# What a light/heavy CI job expects (platform's pnpm and Playwright jobs set the bar) beyond the runner itself. No node/pnpm: the
# workflows install their own with actions/setup-node + pnpm/action-setup.
# The Chromium libraries stand in for `playwright install --with-deps`, which
# only knows apt.
linux_ci_packages:
  - docker
  - docker-buildx
  - git
  - git-lfs
  - jq
  - curl
  - unzip
  - zip
  - github-cli
  - kubectl
  - python
  - python-yaml
  # Playwright Chromium runtime
  - nss
  - nspr
  - alsa-lib
  - at-spi2-core
  - libcups
  - libdrm
  - libxkbcommon
  - libxcomposite
  - libxdamage
  - libxrandr
  - libxfixes
  - libxshmfence
  - mesa
  - pango
  - cairo
  - ttf-liberation
  - noto-fonts
