---
- name: Install light/heavy CI packages
  community.general.pacman:
    name: "{{ linux_ci_packages }}"
    state: present
    update_cache: true

- name: Ensure docker is enabled and running
  ansible.builtin.systemd:
    name: docker.service
    enabled: true
    state: started
  # In --check the package step above is simulated, so a fresh host has no unit yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Create the hook directory
  ansible.builtin.file:
    path: "{{ linux_ci_job_started_hook | dirname }}"
    state: directory
    mode: "0755"

- name: Install the job-started hook (empties the workspace before each job)
  ansible.builtin.template:
    src: job-started.sh.j2
    dest: "{{ linux_ci_job_started_hook }}"
    mode: "0755"

- name: Install the disk prune script
  ansible.builtin.copy:
    src: ci-disk-prune.sh
    dest: "{{ linux_ci_disk_prune }}"
    mode: "0755"
  tags: [ci-disk]

- name: Create the coredump drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/coredump.conf.d
    state: directory
    mode: "0755"
  tags: [ci-disk]

- name: Cap core dumps (the default is 10% of the disk, 93G here)
  ansible.builtin.copy:
    dest: /etc/systemd/coredump.conf.d/50-disk-cap.conf
    mode: "0644"
    content: |
      # Managed by ansible (linux-ci-host).
      [Coredump]
      MaxUse={{ linux_ci_coredump_max_use }}
  tags: [ci-disk]

- name: Install the daily docker cleanup service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - linux-ci-docker-cleanup.service
    - linux-ci-docker-cleanup.timer
  register: _linux_ci_cleanup_units
  tags: [ci-disk]

- name: Reload systemd after unit changes
  ansible.builtin.systemd:
    daemon_reload: true
  when: _linux_ci_cleanup_units.changed
  tags: [ci-disk]

- name: Enable the docker cleanup timer
  ansible.builtin.systemd:
    name: linux-ci-docker-cleanup.timer
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [ci-disk]
