---
- name: Install light/heavy CI packages
  community.general.pacman:
    name: "{{ linux_ci_packages }}"
    state: present
    update_cache: true
  register: _linux_ci_pkgs
  # update_cache counts a refreshed sync db as a change, and --check always does,
  # so ConvergenceDrift fired on every host nightly: only an installed package is one.
  changed_when: _linux_ci_pkgs.packages | default([]) | length > 0

- name: Ensure docker is enabled and running
  ansible.builtin.systemd:
    name: docker.service
    enabled: true
    state: started
  # In --check the package step above is simulated, so a fresh host has no unit yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Create the hook directory
  ansible.builtin.file:
    path: "{{ linux_ci_job_started_hook | dirname }}"
    state: directory
    mode: "0755"

- name: Install the job-started hook (empties the workspace before each job)
  ansible.builtin.template:
    src: job-started.sh.j2
    dest: "{{ linux_ci_job_started_hook }}"
    mode: "0755"

- name: Keep the disk from filling
  ansible.builtin.import_tasks: disk.yml
  tags: [ci-disk]
