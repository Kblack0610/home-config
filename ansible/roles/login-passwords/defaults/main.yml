---
# The login account's password, as a crypt hash (never the plain text). It
# lives in vault_linux_login_password_hash (SOPS,
# group_vars/linux_bare_metal/vault.sops.yaml). See this role's README to set it.
login_passwords_user: "{{ ansible_user }}"
login_passwords_user_hash: "{{ vault_linux_login_password_hash | default('') }}"
