---
# Peekaboo is run by npx from the `agent-desktop` MCP config (dotfiles-private
# .claude/mcp-optional/agent-desktop.json); keep the two versions equal.
agent_tools_peekaboo_version: "4.9.8"
agent_tools_npx: /opt/homebrew/bin/npx
agent_tools_sudoers_name: agent-machine

# Extensions Chrome force-installs from the Web Store (policy
# ExtensionInstallForcelist). The Playwright Extension (Microsoft) is what the
# store-console skill's `stores-browser` MCP connects to.
agent_tools_chrome_forced_extensions:
  - mmlmfjhmonkocbjadbfplnigmagldckm
agent_tools_chrome_update_url: https://clients2.google.com/service/update2/crx
