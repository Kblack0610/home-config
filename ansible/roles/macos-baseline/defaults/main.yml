---
# Workstation public key to keep present in the Mac's authorized_keys.
# Read from the control node at apply time — no key material in the repo.
macos_workstation_pubkey_path: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519.pub"

# Power policy for a headless build/CI box. autorestart is the one that
# matters for power-failure recovery; the rest keep the machine awake so
# it's always reachable and ready to run jobs.
macos_power_settings:
  - { key: autorestart, value: 1 }   # boot automatically after a power failure
  - { key: sleep, value: 0 }         # never system-sleep
  - { key: disksleep, value: 0 }     # never spin down disks
  - { key: displaysleep, value: 0 }  # never sleep the (usually absent) display
  - { key: womp, value: 1 }          # wake-on-LAN
