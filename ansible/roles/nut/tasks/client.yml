---
- name: Render nut.conf (netclient mode)
  ansible.builtin.template:
    src: nut.conf.j2
    dest: /etc/nut/nut.conf
    owner: root
    group: nut
    mode: "0640"
  notify: restart nut-monitor

- name: Render upsmon.conf (secondary)
  ansible.builtin.template:
    src: upsmon.client.conf.j2
    dest: /etc/nut/upsmon.conf
    owner: root
    group: nut
    mode: "0640"
  no_log: true
  notify: restart nut-monitor

- name: Install worker-shutdown.sh (graceful k3s-agent stop)
  ansible.builtin.template:
    src: worker-shutdown.sh.j2
    dest: /etc/nut/worker-shutdown.sh
    owner: root
    group: nut
    mode: "0750"

- name: Enable + start nut-monitor
  ansible.builtin.systemd:
    name: nut-monitor.service
    enabled: true
    state: started
    daemon_reload: true
  # See server.yml for the rationale — package not installed in check mode
  # means systemd unit doesn't exist yet. Same pattern as roles/k3s-agent.
  when: not ansible_check_mode
