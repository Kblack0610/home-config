---
- name: Install ollama via Homebrew
  community.general.homebrew:
    name: "{{ ollama_formula }}"
    state: present

- name: Ensure ollama brew service is running
  community.general.homebrew_services:
    name: "{{ ollama_service_name }}"
    state: started

- name: Verify ollama API is responding
  ansible.builtin.uri:
    url: "http://localhost:{{ ollama_port }}/api/tags"
    return_content: false
    status_code: 200
  register: ollama_probe
  retries: 5
  delay: 2
  until: ollama_probe.status == 200
  when: not ansible_check_mode
  changed_when: false
