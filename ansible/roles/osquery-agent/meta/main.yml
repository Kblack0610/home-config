---
galaxy_info:
  role_name: osquery_agent
  author: home-config
  description: >-
    Install osquery and enroll the host into the self-hosted FleetDM server
    (apps/fleet, https://fleet.kblab.me) via TLS. This is the agent side of the
    cross-OS fleet-management pane: macOS + Debian/Raspberry Pi OS covered here;
    Arch/x86 hosts are a documented follow-up (osquery is AUR-only on Arch).
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: MacOSX
      versions:
        - all
    - name: Debian
      versions:
        - all
  galaxy_tags:
    - fleet
    - osquery
    - fleetdm
    - inventory
dependencies: []
