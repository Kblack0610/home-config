---
# Debian / Raspberry Pi OS: install osquery from its official apt repo. The deb
# ships an osqueryd systemd unit and reads /etc/osquery/osquery.flags, so we only
# add the flagfile + enroll secret and enable the service.
- name: Ensure apt keyrings dir exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Install osquery apt signing key
  ansible.builtin.get_url:
    url: "{{ osquery_apt_key_url }}"
    dest: "{{ osquery_apt_keyring }}"
    mode: "0644"

- name: Add osquery apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by={{ osquery_apt_keyring }}] https://pkg.osquery.io/deb deb main"
    filename: osquery
    state: present
    update_cache: true

- name: Install osquery package
  ansible.builtin.apt:
    name: osquery
    state: present

- name: Ensure osquery config dir exists
  ansible.builtin.file:
    path: "{{ osquery_config_dir }}"
    state: directory
    mode: "0755"

- name: Write Fleet enroll secret
  ansible.builtin.copy:
    dest: "{{ osquery_enroll_secret_path }}"
    content: "{{ fleet_enroll_secret }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: restart osqueryd

- name: Render osquery Fleet flagfile
  ansible.builtin.template:
    src: osquery.flags.j2
    dest: "{{ osquery_flags_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: restart osqueryd

- name: Enable and start osqueryd
  ansible.builtin.systemd:
    name: osqueryd
    enabled: true
    state: started
    daemon_reload: true

# Verify enrollment: osqueryd should register with Fleet within a refresh cycle.
# We confirm the daemon is active and the enroll flow left no fatal error.
- name: Verify osqueryd is active
  ansible.builtin.command: systemctl is-active osqueryd
  register: osqueryd_active
  changed_when: false
  failed_when: osqueryd_active.stdout != 'active'
  when: not ansible_check_mode
