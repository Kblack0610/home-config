galaxy_info:
  role_name: rpi_throttle_metric
  author: kblack0610
  description: >-
    Exports the Raspberry Pi firmware's throttle and undervoltage latch to
    node-exporter, so a weak power supply alerts before it causes an incident.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: Debian
      versions:
        - bookworm
        - trixie
  galaxy_tags:
    - homelab
    - raspberrypi
    - monitoring
dependencies: []
