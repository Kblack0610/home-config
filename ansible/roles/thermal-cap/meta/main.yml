---
galaxy_info:
  role_name: thermal_cap
  author: home-config
  description: >-
    The fleet's thermal standard: caps CPU power on every load-carrying x86
    Linux host (platform profile, boost, Intel RAPL limits) and sets a battery
    charge limit, reapplied at every boot.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: ArchLinux
      versions:
        - rolling
dependencies: []
