---
# Host prep for a macOS host in the BNB Unity runner pool (the "Unity CI runner
# pool (macOS)" play in site.yml). The slots themselves come from
# github-actions-runner-mac, org-scoped, one per slot.
#
# The Linux pool runs Unity in the amd64 unityci/editor image, which an Apple
# Silicon Mac cannot run, so a Mac slot runs the playground's scripts natively
# (UNITY_CI_NATIVE=1 in the slot's .env; unity-core-playground
# scripts/test/in-docker.sh) with the editor installed here. The machine itself
# is the Unity activation, so a Mac host is one activation whatever its slots.

# Where the slots live: <unity_ci_mac_root>/unity-pool-<n>, each also its HOME.
unity_ci_mac_root: "{{ ansible_env.HOME }}/actions-runner"

# The repo a new slot copies from slot 1 (the "Seed new slots" task in site.yml).
unity_ci_mac_seed_repo: unity-core-playground

# Editors the jobs ask for, by the project's ProjectSettings/ProjectVersion.txt
# (m_EditorVersionWithRevision gives the changeset). Add the new one on a Unity
# upgrade; the jobs refuse any other version.
unity_ci_mac_editors:
  - version: 6000.3.27f1
    changeset: 672d562a42a7

unity_ci_mac_hub: /Applications/Unity Hub.app/Contents/MacOS/Unity Hub
# Where Hub puts the editors, <root>/<version>/Unity.app.
unity_ci_mac_editor_root: /Applications/Unity/Hub/Editor

# Player modules tasks/modules.yml adds to each editor: pkg names Unity's
# UnitySetup-<pkg>-for-Editor-<version>.pkg, payload the directory in its
# Payload to copy ('' for all of it), into where under PlaybackEngines it goes,
# and creates a path under into that only the installed module has. The Mac
# player builds with IL2CPP, hence the second module.
unity_ci_mac_modules:
  - pkg: iOS-Support
    payload: iOSSupport
    into: iOSSupport
    creates: UnityEditor.iOS.Extensions.dll
  - pkg: Mac-IL2CPP-Support
    payload: ''
    into: MacStandaloneSupport
    creates: Variations/macos_x64arm64_player_nondevelopment_il2cpp

# Download scratch for tasks/modules.yml, deleted after each install. Under
# ~/Library/Caches, since a pkg expands to about 2 GB.
unity_ci_mac_module_scratch: "{{ ansible_facts.env.HOME }}/Library/Caches/unity-modules"

# The scripts are bash 4+ and GNU (mapfile, flock, stat -c, tail --pid, timeout,
# xargs -r, base64 -w0). Homebrew's GNU tools go first on the job PATH through
# their gnubin dirs, so the scripts run unchanged.
unity_ci_mac_formulae:
  - bash
  - coreutils
  - findutils
  - gnu-sed
  - grep
  - flock
  - git-lfs
  # The runner role unpacks its tarball with ansible unarchive, which needs GNU tar.
  - gnu-tar
  - jq

unity_ci_mac_path: >-
  /opt/homebrew/opt/coreutils/libexec/gnubin:/opt/homebrew/opt/findutils/libexec/gnubin:/opt/homebrew/opt/gnu-sed/libexec/gnubin:/opt/homebrew/opt/grep/libexec/gnubin:/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

# One asset-library LFS store per host, as on Linux (ASSET_LIBRARY_LFS_STORE).
unity_ci_mac_lfs_store: "{{ unity_ci_mac_root }}/.cache/bnb/asset-library-lfs"

# tasks/disk.yml: the hourly prune of the game build trees beside a Mac runner's checkout
# (files/ci-tree-prune.sh; docs/mac-machines.md#build-tree-prune). The runner homes it sweeps;
# m1-playground-mac is hand-registered, so it is named here rather than read from a play.
unity_ci_mac_prune_runners:
  - "{{ ansible_env.HOME }}/actions-runner-playground"
unity_ci_mac_prune_script: "{{ ansible_env.HOME }}/.local/bin/ci-tree-prune.sh"
unity_ci_mac_prune_label: com.kblab.ci-tree-prune
unity_ci_mac_prune_interval_seconds: 3600
# A tree unused this long goes; under this much free disk, idle trees go oldest first.
# NodeDiskLow trips at 20% free.
unity_ci_mac_prune_tree_days: 7
unity_ci_mac_prune_free_pct: 25
