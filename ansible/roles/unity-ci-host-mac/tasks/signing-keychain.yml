---
# The Mac build keychain (files/ensure-build-keychain.sh): created, unlocked and in the user's
# search list on every apply. Bound in site.yml's mac-mini play; no sudo. The script reads
# ~/.config/unity-core-playground/mac-signing.env, which is not templated here: it holds the
# keychain password, which comes from rbw by hand (docs/mac-machines.md#mac-build-keychain).
- name: Create the local bin directory
  ansible.builtin.file:
    path: "{{ unity_ci_mac_keychain_script | dirname }}"
    state: directory
    mode: "0755"
  tags: [mac-keychain]

- name: Install the build keychain script
  ansible.builtin.copy:
    src: ensure-build-keychain.sh
    dest: "{{ unity_ci_mac_keychain_script }}"
    mode: "0755"
  tags: [mac-keychain]

- name: Create, unlock and list the build keychain
  ansible.builtin.command:
    cmd: "{{ unity_ci_mac_keychain_script }}"
  register: _unity_ci_mac_keychain
  changed_when: "'CHANGED' in _unity_ci_mac_keychain.stdout"
  tags: [mac-keychain]
