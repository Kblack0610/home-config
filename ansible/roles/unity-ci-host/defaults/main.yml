---
# Host prep for the BNB Unity runner pool (the "Unity CI runner pool" play in
# site.yml). The runner slots themselves come from github-actions-runner-linux.
# What the jobs expect from a host: unity-core-playground docs/operations/ci.md.

# CPU and memory caps for the Unity runners and their containers live in
# roles/ci-host-budget (ci-unity.slice), a dependency of this role.

unity_ci_user: actions-runner
unity_ci_group: actions-runner
unity_ci_user_home: /var/lib/actions-runner

# Every slot on the host mounts this as the container's /etc/machine-id, so the
# host is one machine (one activation) to Unity whatever its slot count.
unity_ci_machine_id_file: "{{ unity_ci_user_home }}/unity-machine-id"

# The art libraries the game manifests name by their paths on the workstation:
# asset-library (no remote) and asset-library-hd (Forgejo, LFS; the HD venues).
# Each is copied to <unity_ci_user_home>/<name>, and the jobs mount the copies at
# those workstation paths read-only (UNITY_LIBRARY_ROOT in the playground's
# workflow). Only Packages/ is copied. Re-run the play (--tags unity-ci) after a
# library's packages change; a fingerprint of the tree skips an unchanged copy.
unity_ci_asset_libraries:
  - name: asset-library
    source: /home/kblack0610/dev/bnb/games/engine/asset-library
  - name: asset-library-hd
    source: /home/kblack0610/dev/bnb/games/engine/asset-library-hd

# Editor images the jobs build on. Pulling these on the LAN fails (the IPv6 path
# corrupts long downloads), so a missing one is copied from the workstation's
# docker with docker save | docker load. Add the new tags on a Unity upgrade.
# A player build asks for its platform's flavor (playground perf-round.yml, release.yml);
# without it the job pulls, and dies on the corrupted download.
unity_ci_images:
  - unityci/editor:ubuntu-6000.0.72f1-base-3
  - unityci/editor:ubuntu-6000.0.85f1-base-3
  - unityci/editor:ubuntu-6000.3.27f1-base-3
  - unityci/editor:ubuntu-6000.3.27f1-windows-mono-3
  - unityci/editor:ubuntu-6000.3.27f1-mac-mono-3
  - unityci/editor:ubuntu-6000.3.27f1-android-3

unity_ci_packages:
  - docker
  - git
  - git-lfs
  - jq
  - curl
