---
- name: Install Unity CI packages
  community.general.pacman:
    name: "{{ unity_ci_packages }}"
    state: present

- name: Ensure docker is enabled and running
  ansible.builtin.systemd:
    name: docker.service
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"

# Same user the runner role creates; made here first so the files below can be
# owned by it before any slot exists.
- name: Create the runner group
  ansible.builtin.group:
    name: "{{ unity_ci_group }}"
    system: true

- name: Create the runner user
  ansible.builtin.user:
    name: "{{ unity_ci_user }}"
    group: "{{ unity_ci_group }}"
    groups: [docker]
    append: true
    home: "{{ unity_ci_user_home }}"
    shell: /bin/bash
    system: true
    create_home: true

# Each slot's HOME is its own dir, so the jobs' ssh-agent action writes GitHub's
# host keys there; ssh itself reads known_hosts from the user's passwd home
# instead, and refuses the submodule clone without them ("Host key verification
# failed"). The keys come from GitHub's meta API at apply time.
# Through the control node's gh, signed in: GitHub allows 60 anonymous API
# calls an hour per IP, and every machine on the LAN shares one IP.
- name: Read GitHub's SSH host keys
  ansible.builtin.command: gh api meta --jq '.ssh_keys[]'
  changed_when: false
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  register: _unity_ci_github_meta

- name: Create the runner user's .ssh
  ansible.builtin.file:
    path: "{{ unity_ci_user_home }}/.ssh"
    state: directory
    owner: "{{ unity_ci_user }}"
    group: "{{ unity_ci_group }}"
    mode: "0700"

- name: Trust GitHub's host keys for the runner user
  ansible.builtin.known_hosts:
    path: "{{ unity_ci_user_home }}/.ssh/known_hosts"
    name: github.com
    key: "github.com {{ item }}"
  loop: "{{ _unity_ci_github_meta.stdout_lines }}"
  loop_control:
    label: "{{ item.split(' ')[0] }}"

- name: Own the runner user's known_hosts
  ansible.builtin.file:
    path: "{{ unity_ci_user_home }}/.ssh/known_hosts"
    owner: "{{ unity_ci_user }}"
    group: "{{ unity_ci_group }}"
    mode: "0644"
  when: not ansible_check_mode

# 32 hex digits, the /etc/machine-id format. Made once; replacing it makes the
# host a new machine to Unity, which costs an activation.
- name: Create the host's Unity machine id
  ansible.builtin.shell: >-
    umask 022 && od -An -tx1 -N16 /dev/urandom | tr -d ' \n' > {{ unity_ci_machine_id_file }}
    && chown {{ unity_ci_user }}:{{ unity_ci_group }} {{ unity_ci_machine_id_file }}
  args:
    creates: "{{ unity_ci_machine_id_file }}"

# Art library copies (asset-library, asset-library-hd), one folder each under the
# runner's home: tasks/library.yml, once per entry of unity_ci_asset_libraries.
- name: Copy the art libraries
  ansible.builtin.include_tasks: library.yml
  loop: "{{ unity_ci_asset_libraries }}"
  loop_control:
    loop_var: library
    label: "{{ library.name }}"

# Editor images: load a missing one from the workstation's docker. The host's own
# connection details are read here, before the copy is delegated to localhost,
# where ansible_connection and ansible_host would name localhost instead.
- name: Note how this host is reached
  ansible.builtin.set_fact:
    _unity_ci_local: "{{ ansible_connection | default('ssh') == 'local' }}"
    _unity_ci_ssh: >-
      -p {{ ansible_port | default(22) }} {{ ansible_user }}@{{ ansible_host | default(inventory_hostname) }}

- name: Check which editor images the host has
  ansible.builtin.command: docker image inspect --format ok {{ item }}
  loop: "{{ unity_ci_images }}"
  changed_when: false
  failed_when: false
  check_mode: false
  register: _unity_ci_images

- name: Copy missing editor images from the workstation
  ansible.builtin.shell: >-
    set -o pipefail &&
    docker image inspect {{ item.item }} >/dev/null &&
    docker save {{ item.item }} |
    ssh -o BatchMode=yes {{ _unity_ci_ssh }} sudo docker load
  args:
    executable: /bin/bash
  loop: "{{ _unity_ci_images.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.rc != 0
    - not _unity_ci_local
  delegate_to: localhost
  become: false

- name: Assert the workstation itself has the editor images
  ansible.builtin.assert:
    that: item.rc == 0
    fail_msg: "{{ item.item }} is missing here; docker pull it (over IPv4) before applying"
  loop: "{{ _unity_ci_images.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - _unity_ci_local
    - not ansible_check_mode
