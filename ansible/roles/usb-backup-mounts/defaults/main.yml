---
# The 8TB USB backup drive on asus-laptop.
#
# Identified by filesystem UUID, never by device node - the whole point of this
# role. The device node is not stable: this drive was /dev/sdc until 2026-08-09
# and came back as /dev/sda.
usb_backup_fs_uuid: 99a8c3bb-b1d9-4a78-88de-627b429cd147
usb_backup_fs_label: backup8t

# Base mount options shared by every subvolume.
#
# noauto + x-systemd.automount is the fix. systemd-fstab-generator turns an
# x-systemd.automount entry into a .automount unit plus a .mount unit that
# BindsTo the underlying .device unit. Two consequences, and both are the ones
# we needed on 2026-08-09:
#   - device disappears -> systemd STOPS the .mount unit, so the path is left
#     clean instead of a stale mount pointing at a dead device node;
#   - device returns (under any name) -> the next access to the path triggers
#     an automatic remount, resolved by UUID.
#
# Deliberately NO x-systemd.idle-timeout: an idle unmount would make the
# node_filesystem_* series come and go, and the alert in
# apps/monitoring/prometheus-rules-backup-drive.yaml keys off those series.
usb_backup_mount_opts: "noatime,compress=zstd:1,nofail,noauto,x-systemd.automount,x-systemd.device-timeout=10"

# subvol -> mountpoint. A path with no entry here is a plain directory on the root
# disk, which is how langfuse and victoria-metrics backups sat on the disk they
# were protecting until 2026-10-31. A new subvolume is created by this role.
usb_backup_subvolumes:
  - { subvol: "@immich", path: /mnt/backup-8t/immich }
  - { subvol: "@immich-db", path: /mnt/backup-8t/immich-db }
  - { subvol: "@media", path: /mnt/backup-8t/media }
  - { subvol: "@app-config", path: /mnt/backup-8t/app-config }
  - { subvol: "@immich-snapshots", path: /mnt/backup-8t/immich-snapshots }
  - { subvol: "@3d-prints", path: /mnt/backup-8t/3d-prints }
  - { subvol: "@3d-prints-snapshots", path: /mnt/backup-8t/3d-prints-snapshots }
  - { subvol: "@phones", path: /mnt/backup-8t/phones }
  - { subvol: "@phones-snapshots", path: /mnt/backup-8t/phones-snapshots }
  - { subvol: "@forgejo-packages", path: /mnt/backup-8t/forgejo-packages }
  - { subvol: "@forgejo-packages-snapshots", path: /mnt/backup-8t/forgejo-packages-snapshots }
  - { subvol: "@langfuse", path: /mnt/backup-8t/langfuse }
  - { subvol: "@victoria-metrics", path: /mnt/backup-8t/victoria-metrics }
  # Not a subvolume: the whole filesystem, read-only, so one path shows every
  # mirror and snapshot. The NAS [backups] share serves it. btrfs applies ro per
  # mount, so the read-write mounts above are unaffected.
  - { opts: "ro,subvolid=5", path: /mnt/backup-8t/browse }
