apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual-budget-tools
  namespace: actual-budget
  labels:
    app: actual-budget-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: actual-budget-tools
  template:
    metadata:
      labels:
        app: actual-budget-tools
    spec:
      containers:
        - name: actual-budget-tools
          # Build and push to your registry, then update this
          image: ghcr.io/kblack0610/actual-budget-tools:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ACTUAL_SERVER_URL
              value: "http://actual-budget.actual-budget.svc.cluster.local:80"
            - name: ACTUAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: actual-budget-tools
                  key: ACTUAL_PASSWORD
            - name: ACTUAL_BUDGET_ID
              valueFrom:
                secretKeyRef:
                  name: actual-budget-tools
                  key: ACTUAL_BUDGET_ID
            - name: DATABASE_PATH
              value: /data/tools.db
            - name: LISTEN_ADDR
              value: ":8080"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: actual-budget-tools-data
