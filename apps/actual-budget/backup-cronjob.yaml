apiVersion: batch/v1
kind: CronJob
metadata:
  name: actual-budget-backup
  namespace: actual-budget
spec:
  schedule: "0 3 * * *"  # Daily at 3 AM
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # Now that a failed off-box copy fails the job, bound the retries. Each
      # attempt writes a fresh timestamped archive and re-runs the keep-30
      # prune, so the default backoffLimit of 6 would let a single night of NAS
      # downtime push 7 same-day archives through the local set and squeeze out
      # the older days it exists to protect. 3 attempts is enough to ride out a
      # brief NAS blip and still leaves 10 days of local depth.
      backoffLimit: 2
      template:
        spec:
          # No nodeSelector: the job co-locates with the local-path PVC (RWO,
          # same node as the app pod) so it can read /data. The NAS push is
          # network-based (//nas.nas.svc.cluster.local), so it works from any
          # node the PVC happens to live on.
          securityContext:
            fsGroup: 1000
          containers:
            - name: backup
              image: alpine:3.24.1
              env:
                - name: NAS_SMB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backup-nas-credentials
                      key: smb-password
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  apk add --no-cache tar gzip samba-client >/dev/null

                  DATA_DIR=/data
                  KEEP_LOCAL=30
                  # A budget archive has never been under 200KB. 20KB is a floor
                  # low enough never to false-trip and high enough to catch an
                  # empty /data.
                  MIN_BYTES=20480
                  SMB="//nas.nas.svc.cluster.local/private"
                  DEST="backups/home-k3s/actual-budget"

                  log() { echo "[$(date -Iseconds)] $*"; }

                  # --- refuse to back up nothing ---------------------------------
                  # Writing a tiny "successful" tarball over a good backup set is
                  # worse than failing loudly, and it is the failure mode that
                  # hides for weeks. Both files must exist or the PVC is not
                  # mounted where we think it is.
                  if [ ! -f "${DATA_DIR}/server-files/account.sqlite" ]; then
                    log "ERROR: server-files/account.sqlite missing - is the PVC mounted? Refusing to back up."
                    exit 1
                  fi
                  budgets="$(find "${DATA_DIR}/user-files" -maxdepth 1 -name '*.sqlite' 2>/dev/null | wc -l)"
                  if [ "${budgets}" -eq 0 ]; then
                    log "ERROR: no budget .sqlite under user-files. Refusing to back up."
                    exit 1
                  fi
                  log "found ${budgets} budget file(s)"

                  # --- archive ---------------------------------------------------
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  BACKUP_FILE="actual-${TIMESTAMP}.tar.gz"
                  # Snapshot the whole /data dir (SQLite budget files + server-files + blobs)
                  tar -czf "/backup/${BACKUP_FILE}" -C "${DATA_DIR}" .
                  size="$(wc -c < "/backup/${BACKUP_FILE}")"
                  log "created ${BACKUP_FILE} (${size} bytes)"
                  if [ "${size}" -lt "${MIN_BYTES}" ]; then
                    log "ERROR: archive under ${MIN_BYTES} bytes is implausible for a budget. Not uploading."
                    exit 1
                  fi

                  ls -t /backup/actual-*.tar.gz | tail -n +$((KEEP_LOCAL + 1)) | xargs -r rm
                  log "local backup complete: ${BACKUP_FILE}"

                  # --- off-box copy ----------------------------------------------
                  # DELIBERATE EXCEPTION to the house rule. Every other backup job
                  # here treats the NAS copy as best-effort and exits 0 without it
                  # (docs/backup-runbook.md, "NAS upload fails but local backup
                  # succeeds"). This job does not, because the local copy is a
                  # hostPath on the SINGLE node holding the RWO PVC: if that Pi
                  # dies while the off-box copy has been quietly failing, the
                  # finance history is gone outright. There is no offsite tier to
                  # fall back on. Failing loudly costs nothing - the local copy is
                  # already written by this point and survives the job failure.
                  #
                  # smbclient -c does NOT exit non-zero when a command inside it
                  # fails - it prints NT_STATUS_* and carries on - so the previous
                  # unchecked `&&` printed "NAS copy OK" even for a file that had
                  # landed in the share root or nowhere at all. Same trap already
                  # documented in apps/zomboid/backup/backup.sh.
                  smb() {
                    _out="$(smbclient "${SMB}" -U "nas%${NAS_SMB_PASSWORD}" -c "$1" 2>&1)"
                    _bad="$(echo "${_out}" | grep -o 'NT_STATUS_[A-Z_]*' | grep -v 'NT_STATUS_OBJECT_NAME_COLLISION' || true)"
                    if [ -n "${_bad}" ]; then
                      log "ERROR: smbclient '$1' failed: ${_bad}"
                      return 1
                    fi
                    echo "${_out}"
                  }

                  nas_copy() {
                    # mkdir does not create parents, so walk the path a component
                    # at a time. An existing component reports OBJECT_NAME_COLLISION,
                    # which smb() treats as fine.
                    _path=""
                    for _part in $(echo "${DEST}" | tr '/' ' '); do
                      _path="${_path:+${_path}/}${_part}"
                      smb "mkdir ${_path}" >/dev/null || return 1
                    done
                    smb "cd ${DEST}; put /backup/${BACKUP_FILE} ${BACKUP_FILE}" >/dev/null || return 1
                    # Confirm it landed in the RIGHT directory at the RIGHT size.
                    remote_size="$(smb "cd ${DEST}; ls ${BACKUP_FILE}" | awk -v f="${BACKUP_FILE}" '$1==f {print $3}')"
                    if [ -z "${remote_size}" ]; then
                      log "ERROR: ${BACKUP_FILE} is not on the share after upload."
                      return 1
                    fi
                    if [ "${remote_size}" != "${size}" ]; then
                      log "ERROR: size mismatch - local ${size}, remote ${remote_size}."
                      return 1
                    fi
                    log "verified on the share: ${remote_size} bytes"
                  }

                  if nas_copy; then
                    log "NAS copy OK: ${BACKUP_FILE}"
                  else
                    log "ERROR: off-box copy failed. The local copy on this node is good and has been kept, but the finance data now exists on ONE machine only."
                    exit 1
                  fi
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: backup
                  mountPath: /backup
          restartPolicy: OnFailure
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: actual-budget-data
            - name: backup
              hostPath:
                path: /var/backups/actual-budget
                type: DirectoryOrCreate
