apiVersion: batch/v1
kind: CronJob
metadata:
  name: actual-budget-backup
  namespace: actual-budget
spec:
  schedule: "0 3 * * *"  # Daily at 3 AM
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup
              image: alpine:latest
              command:
                - /bin/sh
                - -c
                - |
                  apk add --no-cache tar gzip
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  tar -czf /backup/actual-$TIMESTAMP.tar.gz -C /data .
                  # Keep only last 30 backups
                  ls -t /backup/actual-*.tar.gz | tail -n +31 | xargs -r rm
                  echo "Backup complete: actual-$TIMESTAMP.tar.gz"
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: backup
                  mountPath: /backup
          restartPolicy: OnFailure
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: actual-budget-data
            - name: backup
              hostPath:
                path: /var/backups/actual-budget
                type: DirectoryOrCreate
