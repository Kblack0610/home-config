apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual-budget
  namespace: actual-budget
  labels:
    app: actual-budget
spec:
  replicas: 1
  strategy:
    type: Recreate  # Required for single-writer PVC
  selector:
    matchLabels:
      app: actual-budget
  template:
    metadata:
      labels:
        app: actual-budget
    spec:
      containers:
        - name: actual-budget
          # Keep in step with actual-http-api-deployment.yaml: the API image is an
          # Actual client and is released per server version.
          # 26.2.0 -> 26.8.1: 26.2.0 aborts the whole SimpleFIN batch when any linked
          # account is missing upstream, so four de-listed Capital One accounts blocked
          # bank sync for every other account too. Fixed by 26.4.0 (#7125 per-account
          # error isolation, #7152 missing-account handling). See docs/finance/simplefin-reconnect.md.
          image: actualbudget/actual-server:26.8.1
          imagePullPolicy: Always
          ports:
            - containerPort: 5006
          env:
            - name: ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB
              value: "20"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 5006
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 5006
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: actual-budget-data
