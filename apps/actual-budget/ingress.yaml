apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: actual-budget
  namespace: actual-budget
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`finance.blackk.dev`)  # Update with your domain if different
      kind: Rule
      services:
        - name: actual-budget
          port: 80
      middlewares:
        - name: secure-headers
          namespace: traefik
  tls:
    certResolver: letsencrypt
