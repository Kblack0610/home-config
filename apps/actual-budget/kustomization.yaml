apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: actual-budget

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - backup-nas-secret.yaml
  - backup-cronjob.yaml
  # actual-http-api bridge, plus the two jobs that talk to it: the daily
  # server-side bank sync (and its staleness check) and the quarterly tax CSV.
  # finance-api-secret.yaml holds the Actual server password + budget sync id.
  # See docs/finance/tax-export.md and docs/finance/finance-stack.md.
  - finance-api-secret.yaml
  - actual-http-api-deployment.yaml
  - actual-http-api-service.yaml
  - bank-sync-cronjob.yaml
  - budget-rollover-cronjob.yaml
  - tax-export-cronjob.yaml
