# Quarterly tax-year export: pulls categorized transactions from the
# actual-http-api bridge and writes a per-year CSV to the NAS, next to the
# backups. This is the CPA-handoff artifact.
#
# ACTIVATION-GATED: not listed in kustomization.yaml until finance-api-secret.yaml
# holds the real Actual password + budget-sync-id. Run on-demand once activated:
#   kubectl --context home-k3s create job --from=cronjob/actual-budget-tax-export \
#     tax-export-$(date +%s) -n actual-budget
#
# NOTE: the jq field paths below were written against jhonderson/actual-http-api
# 26.2.0's response shape and have NOT been re-checked against the 26.8.1 image now
# pinned in actual-http-api-deployment.yaml. Validate the FIRST run's CSV against
# your real budget and adjust field names if they moved (see docs/finance/tax-export.md).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: actual-budget-tax-export
  namespace: actual-budget
spec:
  schedule: "0 4 1 1,4,7,10 *"  # 04:00 on the 1st of Jan/Apr/Jul/Oct
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: tax-export
              image: alpine:3.24.1
              env:
                - name: API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: finance-api-credentials
                      key: api-key
                - name: BUDGET_SYNC_ID
                  valueFrom:
                    secretKeyRef:
                      name: finance-api-credentials
                      key: budget-sync-id
                - name: NAS_SMB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backup-nas-credentials
                      key: smb-password
                # Override to export a specific year; defaults to current year.
                - name: TAX_YEAR
                  value: ""
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  apk add --no-cache curl jq samba-client >/dev/null
                  API="http://actual-http-api.actual-budget.svc.cluster.local:5007/v1"
                  SID="$BUDGET_SYNC_ID"
                  YEAR="${TAX_YEAR:-$(date +%Y)}"
                  [ -z "$YEAR" ] && YEAR="$(date +%Y)"
                  SINCE="${YEAR}-01-01"
                  UNTIL="${YEAR}-12-31"
                  OUT="/tmp/actual-tax-${YEAR}.csv"
                  AUTH="x-api-key: ${API_KEY}"

                  # id -> name lookup tables for categories and payees
                  curl -fsS -H "$AUTH" "$API/budgets/$SID/categories" \
                    | jq -r '.data[]? | [.id,.name] | @tsv' > /tmp/cats.tsv || true
                  curl -fsS -H "$AUTH" "$API/budgets/$SID/payees" \
                    | jq -r '.data[]? | [.id,.name] | @tsv' > /tmp/payees.tsv || true
                  lookup() { awk -F'\t' -v id="$2" '$1==id{print $2; f=1} END{if(!f)print ""}' "$1"; }

                  echo "date,account,payee,category,amount,notes,cleared" > "$OUT"
                  curl -fsS -H "$AUTH" "$API/budgets/$SID/accounts" \
                    | jq -r '.data[]? | [.id,.name] | @tsv' \
                    | while IFS="$(printf '\t')" read -r AID ANAME; do
                        curl -fsS -H "$AUTH" "$API/budgets/$SID/accounts/$AID/transactions?since_date=$SINCE" \
                          | jq -r --arg until "$UNTIL" '.data[]? | select(.date <= $until)
                              | [.date, (.payee//""), (.category//""), (.amount//0),
                                 ((.notes//"")|gsub(",";";")), (.cleared//false)] | @tsv' \
                          | while IFS="$(printf '\t')" read -r D PID CID AMT NOTE CLR; do
                              PN=$(lookup /tmp/payees.tsv "$PID"); [ -z "$PN" ] && PN="$PID"
                              CN=$(lookup /tmp/cats.tsv "$CID"); [ -z "$CN" ] && CN="$CID"
                              DOLLARS=$(awk -v a="$AMT" 'BEGIN{printf "%.2f", a/100}')
                              echo "$D,\"$ANAME\",\"$PN\",\"$CN\",$DOLLARS,\"$NOTE\",$CLR"
                            done
                      done
                  ROWS=$(( $(wc -l < "$OUT") - 1 ))
                  echo "Exported $ROWS transactions for tax year $YEAR"
                  [ "$ROWS" -gt 0 ] || { echo "ERROR: zero rows - check API_KEY / budget-sync-id / bridge"; exit 1; }

                  # smbclient -c does not exit non-zero when a command inside it
                  # fails, so every call must be checked for NT_STATUS_. Why, and
                  # the identical copies that move with this one:
                  # apps/zomboid/backup/backup.sh.
                  SMB="//nas.nas.svc.cluster.local/private"
                  DEST="backups/home-k3s/actual-budget/tax-exports"
                  CSV="actual-tax-${YEAR}.csv"

                  smb() {
                    _out="$(smbclient "${SMB}" -U "nas%${NAS_SMB_PASSWORD}" -c "$1" 2>&1)"
                    _bad="$(echo "${_out}" | grep -o 'NT_STATUS_[A-Z_]*' | grep -v 'NT_STATUS_OBJECT_NAME_COLLISION' || true)"
                    if [ -n "${_bad}" ]; then
                      echo "ERROR: smbclient '$1' failed: ${_bad}"
                      return 1
                    fi
                    echo "${_out}"
                  }

                  nas_copy() {
                    _path=""
                    for _part in $(echo "${DEST}" | tr '/' ' '); do
                      _path="${_path:+${_path}/}${_part}"
                      smb "mkdir ${_path}" >/dev/null || return 1
                    done
                    smb "cd ${DEST}; put ${OUT} ${CSV}" >/dev/null || return 1
                    local_size="$(wc -c < "${OUT}")"
                    remote_size="$(smb "cd ${DEST}; ls ${CSV}" | awk -v f="${CSV}" '$1==f {print $3}')"
                    if [ -z "${remote_size}" ]; then
                      echo "ERROR: ${CSV} is not on the share after upload."
                      return 1
                    fi
                    if [ "${remote_size}" != "${local_size}" ]; then
                      echo "ERROR: size mismatch - local ${local_size}, remote ${remote_size}."
                      return 1
                    fi
                    echo "verified on the share: ${remote_size} bytes"
                  }

                  if nas_copy; then
                    echo "NAS copy OK: ${CSV}"
                  else
                    echo "WARN: NAS copy failed, CSV is in the pod at $OUT"
                  fi
