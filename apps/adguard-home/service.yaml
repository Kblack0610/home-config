apiVersion: v1
kind: Service
metadata:
  name: adguard-home-dns
  namespace: adguard-home
  labels:
    app.kubernetes.io/name: adguard-home
  annotations:
    # For k3s servicelb - binds to host network for DNS
    metallb.universe.tf/allow-shared-ip: adguard-home
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: adguard-home
  ports:
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: adguard-home-web
  namespace: adguard-home
  labels:
    app.kubernetes.io/name: adguard-home
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: adguard-home
  ports:
    - name: http-initial
      port: 3000
      targetPort: 3000
      protocol: TCP
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
    - name: dns-over-tls
      port: 853
      targetPort: 853
      protocol: TCP
