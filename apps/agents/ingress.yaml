apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agents
  namespace: agents
  labels:
    app.kubernetes.io/name: agents
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-dns
    # Public on purpose, so a phone can reach it off the LAN without a VPN: external-dns
    # publishes this host and the wildcard tunnel routes it. This page types into live
    # agent sessions, so the gate is the app's Sign in with Forgejo, with 2FA required on
    # the Forgejo account. crowdsec, not monitoring-local-network-only, which is a no-op
    # behind the tunnel (apps/gatus-fleet/ingress.yaml).
    traefik.ingress.kubernetes.io/router.middlewares: crowdsec-crowdsec-bouncer@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - agents.kblab.me
      secretName: agents-tls
  rules:
    - host: agents.kblab.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agents
                port:
                  number: 80
