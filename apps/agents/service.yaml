apiVersion: v1
kind: Service
metadata:
  name: agents
  namespace: agents
  labels:
    app.kubernetes.io/name: agents
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8790
---
# agent-web runs on the fleet home (pc-home-cachy-main, the inventory fleet_state_host), not in
# the cluster: it needs that host's tmux sockets and ~/.claude. This Service only gives
# Traefik a backend; move the IP with fleet_state_host.
apiVersion: v1
kind: Endpoints
metadata:
  name: agents
  namespace: agents
  labels:
    app.kubernetes.io/name: agents
subsets:
  - addresses:
      - ip: 192.168.1.2
    ports:
      - name: http
        port: 8790
