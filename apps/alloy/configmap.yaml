apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alloy
data:
  config.alloy: |
    // Grafana Alloy log shipper (DaemonSet). Two sources per node → Loki:
    //   (a) Kubernetes pod logs (via the kubelet API)
    //   (b) host journald (k3s-agent, forgejo-runner, actions.runner.*, sshd,
    //       and crucially the next boot/power event — the outage-explainability win)

    // ---- (a) pod logs -------------------------------------------------------
    discovery.kubernetes "pods" {
      role = "pod"
      selectors {
        role  = "pod"
        field = "spec.nodeName=" + sys.env("NODE_NAME")
      }
    }

    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        target_label  = "job"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pod_logs.output
      forward_to = [loki.write.default.receiver]
    }

    // ---- (b) host journald --------------------------------------------------
    loki.relabel "journal" {
      forward_to = []
      rule {
        source_labels = ["__journal__systemd_unit"]
        target_label  = "unit"
      }
      rule {
        source_labels = ["__journal__hostname"]
        target_label  = "host"
      }
      rule {
        source_labels = ["__journal__transport"]
        target_label  = "transport"
      }
      rule {
        source_labels = ["__journal_priority_keyword"]
        target_label  = "level"
      }
    }

    loki.source.journal "host" {
      max_age       = "12h"
      path          = "/var/log/journal"
      relabel_rules = loki.relabel.journal.rules
      labels        = { job = "systemd-journal" }
      forward_to    = [loki.write.default.receiver]
    }

    // ---- sink ---------------------------------------------------------------
    loki.write "default" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
      external_labels = { cluster = "home-k3s" }
    }

    // ---- OTLP receiver (Claude Code telemetry) ------------------------------
    // Claude Code emits OTel signals to localhost:4317 (grpc) / localhost:4318
    // (http/protobuf). hostPort in daemonset.yaml binds each Alloy pod to the
    // node IP, so a Claude Code process on the same node (e.g. asus-laptop)
    // reaches Alloy at localhost:4317 / localhost:4318 with no extra routing.
    //
    // Workstation env required in ~/.zshenv (provisioned via dotfiles/Ansible):
    //   CLAUDE_CODE_ENABLE_TELEMETRY=1
    //   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
    //   OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
    //   OTEL_METRICS_EXPORTER=otlp
    //   OTEL_LOGS_EXPORTER=otlp
    //
    // Prerequisite: prometheus.prometheusSpec.enableRemoteWriteReceiver: true
    // must be set in apps/monitoring/helm-values.yaml before metrics flow.
    otelcol.receiver.otlp "claude_code" {
      grpc { endpoint = "0.0.0.0:4317" }
      http { endpoint = "0.0.0.0:4318" }
      output {
        metrics = [otelcol.exporter.prometheus.otel.input]
        logs    = [otelcol.exporter.loki.otel.input]
      }
    }

    otelcol.exporter.prometheus "otel" {
      forward_to = [prometheus.remote_write.otel.receiver]
    }

    prometheus.remote_write "otel" {
      endpoint {
        url = "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
      }
    }

    otelcol.exporter.loki "otel" {
      forward_to = [loki.write.default.receiver]
    }
