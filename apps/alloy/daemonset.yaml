apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alloy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
    spec:
      serviceAccountName: alloy
      # Run on every node, arm64 + amd64 (no arch selector) — mirror the
      # node-exporter DaemonSet. Broad tolerations so control-plane and
      # tainted nodes are covered too.
      tolerations:
        - operator: Exists
      securityContext:
        runAsUser: 0
      containers:
        - name: alloy
          image: grafana/alloy:v1.5.1
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/tmp/alloy
            - --server.http.listen-addr=0.0.0.0:12345
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Consumed by otelcol.exporter.otlphttp "langfuse" in the config via
            # sys.env(). Alloy resolves sys.env() at config load, so a rotation
            # needs a pod restart, not just a secret update.
            - name: LANGFUSE_BASIC_AUTH
              valueFrom:
                secretKeyRef:
                  name: alloy-langfuse
                  key: LANGFUSE_BASIC_AUTH
          ports:
            - name: http
              containerPort: 12345
            # OTLP receiver for Claude Code telemetry.
            # hostPort binds to the node's IP so the workstation process
            # can reach Alloy at localhost:4317 (grpc) / localhost:4318 (http)
            # when Claude Code runs on the same node as an Alloy pod.
            - name: otlp-grpc
              containerPort: 4317
              hostPort: 4317
            - name: otlp-http
              containerPort: 4318
              hostPort: 4318
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            # journald: persistent + runtime journals, read-only.
            - name: journal
              mountPath: /var/log/journal
              readOnly: true
            - name: run-journal
              mountPath: /run/log/journal
              readOnly: true
            - name: machine-id
              mountPath: /etc/machine-id
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: journal
          hostPath:
            path: /var/log/journal
        - name: run-journal
          hostPath:
            path: /run/log/journal
        - name: machine-id
          hostPath:
            path: /etc/machine-id
