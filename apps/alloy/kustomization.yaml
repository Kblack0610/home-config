apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - rbac.yaml
  - secret.sops.yaml
  - daemonset.yaml

# Generated so the name carries a content hash: Alloy has no config reloader
# here, so a plain ConfigMap edit never reached the running pods (they were 57
# days old when this changed). The hash rolls the DaemonSet on every edit.
configMapGenerator:
  - name: alloy-config
    files:
      - config.alloy
    options:
      labels:
        app.kubernetes.io/name: alloy
