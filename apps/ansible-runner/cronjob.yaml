apiVersion: batch/v1
kind: CronJob
metadata:
  name: convergence-check
  namespace: ansible-runner
  labels:
    app.kubernetes.io/name: ansible-runner
    app.kubernetes.io/component: convergence-check
spec:
  # 04:00 daily. Dry-run with --check --diff, so drift is surfaced in logs
  # without changing state. Use `kubectl create job --from=cronjob/...` to
  # trigger an ad-hoc run. For an actual apply (no --check), see README.md.
  schedule: "0 4 * * *"
  timeZone: "America/Los_Angeles"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 604800  # 7 days
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ansible-runner
            app.kubernetes.io/component: convergence-check
        spec:
          restartPolicy: Never
          initContainers:
            - name: clone-repo
              image: alpine/git:v2.52.0
              command:
                - sh
                - -c
                - |
                  set -eu
                  git clone --depth=1 --branch=master \
                    https://github.com/Kblack0610/home-config /workspace
                  git -C /workspace rev-parse HEAD > /workspace/.revision
                  cat /workspace/.revision
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
          containers:
            - name: ansible
              # The semaphore image variant bundles ansible-playbook + collections.
              # Alternatives: cytopia/ansible, alpine/ansible. Swap freely.
              image: semaphoreui/semaphore:v2.17.37-ansible2.16.5
              securityContext:
                # Ephemeral Job container. Running as root keeps things simple:
                # writes to the cloned /workspace, installs galaxy collections,
                # reads the secret-mounted SSH key. No long-running exposure.
                runAsUser: 0
                runAsGroup: 0
              command:
                - sh
                - -c
                - |
                  set -euo pipefail
                  echo "--- Running against home-config revision: $(cat /workspace/.revision) ---"
                  mkdir -p ~/.ssh
                  install -m 0600 /secrets/ssh-privkey ~/.ssh/id_ed25519

                  # ssh-keyscan's stderr used to go to /dev/null. Combined with
                  # `set -e` that made an unreachable target the QUIETEST possible
                  # failure: the job exited 1 having printed nothing but the
                  # revision banner, which is exactly how it failed from at least
                  # 2026-08-06 without anyone being able to see why. Say what
                  # happened instead.
                  # Every host this check should cover, as "alias=ip". thinkcentre
                  # alone used to be the entire scope, which meant the no-suspend
                  # guard on the laptops was never verified by anything - and when
                  # thinkcentre went off-network the job just failed nightly while
                  # checking nothing at all.
                  #
                  # A host being down must not stop the others being checked. That is
                  # the whole point of a drift check: the fleet is partially available
                  # by nature.
                  HOSTS="thinkcentre=192.168.1.100 hp-victus=192.168.1.243 asus-laptop=192.168.1.152"

                  REACHABLE=""
                  SKIPPED=""
                  for entry in $HOSTS; do
                    alias="${entry%%=*}"
                    ip="${entry##*=}"
                    if ssh-keyscan -T 5 -H "$ip" >> ~/.ssh/known_hosts 2>/dev/null; then
                      REACHABLE="${REACHABLE:+$REACHABLE,}$alias"
                    else
                      SKIPPED="${SKIPPED:+$SKIPPED }$alias($ip)"
                    fi
                  done
                  chmod 644 ~/.ssh/known_hosts

                  # Never let a skipped host be silent - an unchecked host looks
                  # exactly like a clean one in the logs otherwise.
                  if [ -n "$SKIPPED" ]; then
                    echo "WARNING: skipping unreachable host(s): $SKIPPED"
                    echo "  They are powered off or off-network. Drift on them is NOT"
                    echo "  being checked. Everything reachable is still checked below."
                  fi

                  if [ -z "$REACHABLE" ]; then
                    echo "ERROR: no target host is reachable ($HOSTS). Nothing could be checked."
                    exit 1
                  fi

                  echo "--- Checking convergence on: $REACHABLE ---"
                  export ANSIBLE_VAULT_PASSWORD_FILE=/secrets/ansible-vault-pass
                  cd /workspace/ansible
                  ansible-galaxy collection install -r requirements.yml --force
                  exec ansible-playbook playbooks/site.yml \
                    --limit "$REACHABLE" \
                    --check --diff
              env:
                - name: ANSIBLE_HOST_KEY_CHECKING
                  value: "False"
                - name: ANSIBLE_STDOUT_CALLBACK
                  value: "default"
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
                - name: secrets
                  mountPath: /secrets
                  readOnly: true
              resources:
                requests:
                  cpu: "50m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
          volumes:
            - name: workspace
              emptyDir: {}
            - name: secrets
              secret:
                secretName: ansible-runner-secrets
                # 0444 so non-root image users (e.g. semaphoreui image runs as
                # uid 1001) can read the mount. We immediately `install -m 0600`
                # into the pod-local ~/.ssh/id_ed25519, and the secret volume
                # is tmpfs anyway — defense-in-depth not weakened materially.
                defaultMode: 0444
