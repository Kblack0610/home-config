server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # The app list changes without the galleries being rebuilt, so never serve a stale one.
  location = /nav.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
  location / {
    return 404;
  }
}
