apiVersion: v1
kind: Service
metadata:
  name: binks-chat
  namespace: binks-api
spec:
  selector:
    app: binks-chat
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: binks-chat
  namespace: binks-api
  labels:
    app: binks-chat
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: binks-chat
  template:
    metadata:
      labels:
        app: binks-chat
    spec:
      tolerations:
        - key: node.cilium.io/agent-not-ready
          operator: Exists
          effect: NoSchedule
      imagePullSecrets:
        - name: forgejo-registry
      containers:
        - name: nginx
          image: git.kblab.me/kblack0610/binks-chat:latest
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
