apiVersion: v1
kind: Service
metadata:
  name: binks-api
  namespace: binks-api
  labels:
    app: binks-api
spec:
  selector:
    app: binks-api
  ports:
    - name: http
      port: 80
      targetPort: 5005
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: binks-api
  namespace: binks-api
  labels:
    app: binks-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: binks-api
  template:
    metadata:
      labels:
        app: binks-api
    spec:
      tolerations:
        - key: node.cilium.io/agent-not-ready
          operator: Exists
          effect: NoSchedule
      imagePullSecrets:
        - name: forgejo-registry
      containers:
        - name: binks-api
          image: git.kblab.me/kblack0610/binks-api:latest
          ports:
            - name: http
              containerPort: 5005
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '5005'
            - name: HOST
              value: 0.0.0.0
            - name: LITELLM_URL
              value: http://litellm.ai-gateway.svc.cluster.local:4000
            - name: DEFAULT_MODEL
              value: 'fast (Qwen3-4B)'
            - name: CORS_ORIGINS
              value: https://binks.chat,https://binks-next.kblab.me
          envFrom:
            - secretRef:
                name: binks-api-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
