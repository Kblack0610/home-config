apiVersion: v1
kind: Service
metadata:
  name: binks-api
  namespace: binks-api
  labels:
    app: binks-api
spec:
  selector:
    app: binks-api
  ports:
    - name: http
      port: 80
      targetPort: 5005
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: binks-api
  namespace: binks-api
  labels:
    app: binks-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: binks-api
  template:
    metadata:
      labels:
        app: binks-api
    spec:
      # amd64-only image (single-arch manifest, no manifest list). Without this
      # the scheduler places the pod on an arm64 Pi and the container dies with
      # `exec format error`. Remove once the image is rebuilt multi-arch.
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
        - key: node.cilium.io/agent-not-ready
          operator: Exists
          effect: NoSchedule
      imagePullSecrets:
        - name: forgejo-registry
      containers:
        - name: binks-api
          image: git.kblab.me/kblack0610/binks-api:latest
          ports:
            - name: http
              containerPort: 5005
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '5005'
            - name: HOST
              value: 0.0.0.0
            - name: LITELLM_URL
              value: http://litellm.ai-gateway.svc.cluster.local:4000
            - name: DEFAULT_MODEL
              value: 'binks-chat'
            - name: SEARXNG_URL
              value: http://searxng.home-assistant.svc.cluster.local:8080
            # web_search tries these SearXNG engines in order, each while its free
            # quota lasts, then the default free engines (Bing). Limits read on the
            # providers' pages 2026-11-13: linkup $20 credit a month (about 4,000
            # searches), firecrawl 1,000 credits a month (about 500 searches, 10 a
            # minute). No card on either account, so cap_usd_month stays 0. Order
            # from the 2026-11-13 per-provider eval (lab docs/eval/). Engines and
            # keys: apps/searxng/README.md. Empty value = default engines only.
            - name: SEARCH_PROVIDERS
              value: >-
                [{"engine":"linkup","quota":4000,"period":"month","usd_per_1k":5,"cap_usd_month":0},
                {"engine":"firecrawl","quota":500,"period":"month","usd_per_1k":7.6,"cap_usd_month":0}]
            - name: CORS_ORIGINS
              value: https://binks.chat
            # Base for the Google and Apple OAuth callbacks
            # (<PUBLIC_URL>/api/auth/{google,apple}/callback). Their client
            # values come from binks-api-secret through envFrom (README, Secrets).
            - name: PUBLIC_URL
              value: https://binks.chat
            # Square billing, sandbox. Real money is the owner's switch:
            # rerun square:setup with the production token, swap these and
            # the SOPS values (apps/binks/api/README.md in the platform repo).
            - name: SQUARE_ENVIRONMENT
              value: sandbox
            - name: SQUARE_LOCATION_ID
              value: LSV4ZKQ05760V
            - name: SQUARE_PLAN_VARIATION_ID
              value: KXHAMBKBADN4PY6TCGGU5VL3
            - name: BINKS_PRICE_CENTS
              value: '800'
          envFrom:
            - secretRef:
                name: binks-api-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
