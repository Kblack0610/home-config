# Production binks.chat — SPA on /, API + WS on /api and /ws, the outside-client doors below.
# TLS is terminated by Cloudflare at the edge; the tunnel uses noTLSVerify
# to talk to Traefik, so no cluster-side cert is needed for binks.chat.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: binks-chat
  namespace: binks-api
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`binks.chat`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: binks-api
          port: 80
    - match: Host(`binks.chat`) && PathPrefix(`/ws`)
      kind: Rule
      services:
        - name: binks-api
          port: 80
    # Outside clients (Claude Code, opencode, the binks CLI): the OAuth server
    # the MCP SDK mounts at the root, the /v1 client API and /mcp itself
    # (platform apps/binks/api/README.md, Client auth). binks-api answers 404
    # on all of them while MCP_ENABLED is off.
    - match: Host(`binks.chat`) && (PathPrefix(`/.well-known/oauth-`) || Path(`/authorize`) || Path(`/token`) || Path(`/register`) || Path(`/revoke`) || PathPrefix(`/v1/`) || Path(`/mcp`))
      kind: Rule
      services:
        - name: binks-api
          port: 80
    - match: Host(`binks.chat`)
      kind: Rule
      services:
        - name: binks-chat
          port: 80
---
# Shared demos (P3 of the binks preview plan): https://play.kblack.dev/p/<id>, a page a
# user published from a chat preview. It lives on its own site, away from binks.chat, so
# a hostile page never shares an origin with the chat or its sign-in. Only /p/ is
# routed, and binks-api answers that Host with /p/<id> and nothing else (PUBLISH_HOST
# in deployment.yaml). external-dns makes the proxied CNAME from this route through the
# target annotation (an IngressRoute has no status address, docs/public-sites.md Zones),
# and Cloudflare terminates TLS as it does for binks.chat.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: binks-demos
  namespace: binks-api
  annotations:
    external-dns.alpha.kubernetes.io/target: ae1da648-4f55-4361-8ff2-320b55be6ac4.cfargotunnel.com
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`play.kblack.dev`) && PathPrefix(`/p/`)
      kind: Rule
      middlewares:
        - name: binks-demos-ratelimit
      services:
        - name: binks-api
          port: 80
---
# A demo is up to 1 MB and anyone may open it, so each visitor gets 60 page loads a
# minute (burst 20) and the chat pod's bandwidth is not the attacker's. Keyed on the IP
# Cloudflare writes: every request arrives through the tunnel, so the TCP peer is the
# cloudflared pod and binks-api's own edge-secret check is set up for binks.chat only.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: binks-demos-ratelimit
  namespace: binks-api
spec:
  rateLimit:
    average: 60
    period: 1m
    burst: 20
    sourceCriterion:
      requestHeaderName: Cf-Connecting-Ip
