# Production binks.chat — SPA on /, API + WS on /api and /ws.
# TLS is terminated by Cloudflare at the edge; the tunnel uses noTLSVerify
# to talk to Traefik, so no cluster-side cert is needed for binks.chat.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: binks-chat
  namespace: binks-api
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`binks.chat`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: binks-api
          port: 80
    - match: Host(`binks.chat`) && PathPrefix(`/ws`)
      kind: Rule
      services:
        - name: binks-api
          port: 80
    - match: Host(`binks.chat`)
      kind: Rule
      services:
        - name: binks-chat
          port: 80
