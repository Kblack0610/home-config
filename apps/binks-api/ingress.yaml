apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: binks-api-shadow
  namespace: binks-api
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`binks-next.kblab.me`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: binks-api
          port: 80
    - match: Host(`binks-next.kblab.me`) && PathPrefix(`/ws`)
      kind: Rule
      services:
        - name: binks-api
          port: 80
  tls:
    secretName: binks-next-kblab-me-tls
---
# Cert request — cert-manager fills in the secret named above.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: binks-next-kblab-me
  namespace: binks-api
spec:
  secretName: binks-next-kblab-me-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: binks-next.kblab.me
  dnsNames:
    - binks-next.kblab.me
