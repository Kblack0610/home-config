apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: binks-api
  namespace: binks-api
  labels:
    # The kube-prometheus-stack release in the monitoring namespace selects
    # ServiceMonitors with this label across all namespaces.
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: binks-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
