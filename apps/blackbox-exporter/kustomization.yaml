# blackbox-exporter: probes every public + private site URL for the HA status
# tiles. Lives in the (helm-managed) `monitoring` namespace alongside Prometheus;
# the namespace itself is owned by the kube-prometheus-stack Helm release, so it
# is NOT created here. The Probe that drives scraping lives in apps/monitoring/.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - deployment.yaml
  - service.yaml
# Generated with a hash suffix so a module change rolls the pod: blackbox reads
# its config once at start and nothing else reloads it.
configMapGenerator:
  - name: blackbox-exporter-config
    files:
      - blackbox.yml
