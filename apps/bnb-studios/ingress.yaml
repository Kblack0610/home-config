apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bnb-studios-web
  labels:
    app: bnb-studios-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - blacknbrownstudios.com
        - www.blacknbrownstudios.com
      secretName: bnb-studios-tls
  rules:
    - host: blacknbrownstudios.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bnb-studios
                port:
                  number: 80
    - host: www.blacknbrownstudios.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bnb-studios
                port:
                  number: 80
