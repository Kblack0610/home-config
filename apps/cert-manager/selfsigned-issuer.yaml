# Self-signed issuer - used only to bootstrap the CA
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
# Root CA Certificate - signed by the bootstrap issuer
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: blackk-lan-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: blackk.lan Root CA
  secretName: blackk-lan-ca-secret
  duration: 87600h # 10 years
  renewBefore: 8760h # 1 year
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
# CA Issuer - this is what ingresses will use (aliased as "letsencrypt" for compatibility)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  ca:
    secretName: blackk-lan-ca-secret
