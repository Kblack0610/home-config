apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kblab.me/criticality: standard
  name: ci-artifacts
  namespace: ci-artifacts
  labels:
    app.kubernetes.io/name: ci-artifacts
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ci-artifacts
  template:
    metadata:
      annotations:
        # Bump when secret.sops.yaml changes: a Secret edit alone does not restart the pod.
        kblab.me/secret-rev: "2"
      labels:
        app.kubernetes.io/name: ci-artifacts
    spec:
      # The NAS disk (nvme1, /mnt/nas/private), not the root disk the minio app's
      # local-path PV shares with every other PV on this node. CI artifacts are
      # disposable: nothing mirrors this directory to the 8TB.
      nodeSelector:
        kubernetes.io/hostname: asus-laptop
        storage.role/nas: "true"
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
          args:
            - server
            - /data
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: ci-artifacts-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ci-artifacts-secret
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_BROWSER
              value: "off"
          ports:
            - name: s3
              containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
      volumes:
        - name: data
          hostPath:
            path: /mnt/nas/private/ci-artifacts
            type: DirectoryOrCreate
