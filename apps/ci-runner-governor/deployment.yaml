apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-runner-governor
  namespace: monitoring
  labels:
    app.kubernetes.io/name: ci-runner-governor
spec:
  # One writer: two governors would each withhold a runner for the same reading.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ci-runner-governor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ci-runner-governor
    spec:
      affinity:
        # Off the CI workstations: the governor pulls their Unity slots when
        # they run hot, so it must not run on one and go down with it. The Pis take it.
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/workstation
                    operator: DoesNotExist
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: governor
          image: python:3.12-alpine
          command: ["python3", "/app/governor.py"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # 1 logs and exports every decision and changes no runner. Dry run
            # since 2026-11-02: it held at most 3 of 13 slots while about 65 jobs
            # waited, so every registered slot carries the pool labels and none is
            # withheld (since 2026-11-03 the pool is mac-studio 6, razer 2, the
            # workstation 2 and aws-burst-1); its logs decide by 2026-11-09 whether
            # the verdicts go live. The pod stays either way: a host pin (machine-mode
            # on the workstation) is acted on even in a dry run. The token
            # is the control node's `gh auth token` (admin:org, what the Unity
            # pool play registers runners with), SOPS-encrypted the same way as
            # apps/github-runner-exporter's; after `gh auth refresh` re-run that
            # recipe with --from-literal=github-token="$(gh auth token)". A standby
            # host whose power block says "live": true is acted on for real anyway.
            - name: DRY_RUN
              value: "1"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ci-runner-governor
                  key: github-token
                  optional: true
            # The ci-governor IAM key for the aws-burst-1 power hook (config.json
            # "power"). Tag-scoped: start, stop and describe on ci-burst=true instances only.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ci-runner-governor
                  key: aws-access-key-id
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ci-runner-governor
                  key: aws-secret-access-key
                  optional: true
            - name: PROMETHEUS_URL
              value: "http://kube-prometheus-stack-prometheus.monitoring:9090"
          ports:
            - name: metrics
              containerPort: 9321
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            # The Infra page's On/Off button (agent-web POST /api/cloud-runner) applies
            # this ConfigMap; it is not in git, so Flux leaves it alone, and optional, so
            # the pod starts without it. The kubelet refreshes it within about a minute.
            - name: override
              mountPath: /override
              readOnly: true
          resources:
            requests:
              memory: "24Mi"
              cpu: "5m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: 9321
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: app
          configMap:
            name: ci-runner-governor
        - name: override
          configMap:
            name: ci-runner-governor-override
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: ci-runner-governor
  namespace: monitoring
  labels:
    app.kubernetes.io/name: ci-runner-governor
spec:
  selector:
    app.kubernetes.io/name: ci-runner-governor
  ports:
    - name: metrics
      port: 9321
      targetPort: 9321
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ci-runner-governor
  namespace: monitoring
  labels:
    app.kubernetes.io/name: ci-runner-governor
spec:
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
  selector:
    matchLabels:
      app.kubernetes.io/name: ci-runner-governor
  namespaceSelector:
    matchNames:
      - monitoring
