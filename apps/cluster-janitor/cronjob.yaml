apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-janitor
  namespace: cluster-janitor
spec:
  # Every 15m. Thresholds below are all >= 15m so one pass never acts on
  # something younger than a pass interval.
  schedule: "*/15 * * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: cluster-janitor
          # Never, not OnFailure: OnFailure deletes the failed pod and its logs
          # (see apps/flux-audit/cronjob.yaml).
          restartPolicy: Never
          containers:
            - name: janitor
              image: alpine/k8s:1.34.4
              command: ["/bin/sh", "/scripts/janitor.sh"]
              env:
                # Separate from homelab-alerts on purpose: these are "done, FYI"
                # records, not pages. NEEDS-YOU lines go out at priority 3-4.
                - name: NTFY_URL
                  value: "http://ntfy.ntfy.svc.cluster.local/homelab-janitor"
                - name: DRY_RUN
                  value: "false"
                - name: FAILED_MIN_AGE_MIN
                  value: "60"
                - name: STUCK_MIN_AGE_MIN
                  value: "15"
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: scripts
              configMap:
                name: cluster-janitor-script
