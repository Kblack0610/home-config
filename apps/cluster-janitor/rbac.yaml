apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-janitor
  namespace: cluster-janitor
---
# Narrow on purpose: read nodes, read/delete pods. No patch, no create,
# nothing on workloads.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-janitor
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-janitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-janitor
subjects:
  - kind: ServiceAccount
    name: cluster-janitor
    namespace: cluster-janitor
