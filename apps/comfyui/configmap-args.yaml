apiVersion: v1
kind: ConfigMap
metadata:
  name: comfyui-args
  namespace: comfyui
  labels:
    app.kubernetes.io/name: comfyui
data:
  # ai-dock reads this file and appends it to ComfyUI's launch command.
  # --listen 0.0.0.0: required for k8s probes and service routing (default is 127.0.0.1)
  comfyui_args.conf: |
    --listen 0.0.0.0
