apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdsec-bouncer
  namespace: crowdsec
  labels:
    app.kubernetes.io/name: crowdsec-bouncer
    app.kubernetes.io/component: bouncer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crowdsec-bouncer
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crowdsec-bouncer
        app.kubernetes.io/component: bouncer
    spec:
      containers:
        - name: bouncer
          image: fbonalair/traefik-crowdsec-bouncer:0.5.0
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CROWDSEC_BOUNCER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secret
                  key: BOUNCER_KEY_traefik
            - name: CROWDSEC_AGENT_HOST
              value: "crowdsec-service.crowdsec.svc.cluster.local:8080"
            - name: CROWDSEC_BOUNCER_SCHEME
              value: "http"
            - name: GIN_MODE
              value: "release"
          livenessProbe:
            httpGet:
              path: /api/v1/ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/ping
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
