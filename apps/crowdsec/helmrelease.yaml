apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
  namespace: crowdsec
spec:
  interval: 30m
  chart:
    spec:
      chart: crowdsec
      version: "0.22.1"
      sourceRef:
        kind: HelmRepository
        name: crowdsec
      interval: 1h
  values:
    container_runtime: containerd

    lapi:
      replicas: 1
      env:
        # Auto-registers a bouncer named "traefik" with this key
        - name: BOUNCER_KEY_traefik
          valueFrom:
            secretKeyRef:
              name: crowdsec-secret
              key: BOUNCER_KEY_traefik
      persistentVolume:
        data:
          enabled: true
          size: 1Gi
          storageClassName: local-path
        config:
          enabled: true
          size: 100Mi
          storageClassName: local-path
      metrics:
        enabled: true
        serviceMonitor:
          enabled: false  # Phase 2
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
      strategy:
        type: Recreate

    agent:
      acquisition:
        - namespace: kube-system
          podName: traefik-*
          program: traefik
      env:
        - name: COLLECTIONS
          value: "crowdsecurity/traefik crowdsecurity/http-cve"
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi

  # The chart's agent init container runs `cscli lapi register --machine
  # <pod name>` on every start. A node reboot restarts the pod under the same
  # name, LAPI answers 403 "user already exist", and the agent crash-loops
  # forever (7 of 8 agents sat down from the 2026-09-30 Pi reboots until 2026-10-24).
  # The credentials from the first registration are still in the pod's
  # emptyDir, so reuse them when the register fails. Chart 0.24.2 still has
  # the same command; drop this patch when upstream makes register idempotent.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: crowdsec-agent
            patch: |
              - op: test
                path: /spec/template/spec/initContainers/0/name
                value: wait-for-lapi-and-register
              - op: replace
                path: /spec/template/spec/initContainers/0/command
                value:
                  - sh
                  - -c
                  - >-
                    until nc "$LAPI_HOST" "$LAPI_PORT" -z; do echo waiting for lapi to start; sleep 5; done;
                    ln -s /staging/etc/crowdsec /etc/crowdsec &&
                    { { cscli lapi register --machine "$USERNAME" -u "$LAPI_URL" --token "$REGISTRATION_TOKEN" &&
                    cp /etc/crowdsec/local_api_credentials.yaml /tmp_config/local_api_credentials.yaml; } ||
                    { [ -s /tmp_config/local_api_credentials.yaml ] &&
                    echo "machine $USERNAME is already registered; reusing its saved credentials"; }; }
