apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
  namespace: crowdsec
spec:
  interval: 30m
  chart:
    spec:
      chart: crowdsec
      version: "0.22.1"
      sourceRef:
        kind: HelmRepository
        name: crowdsec
      interval: 1h
  values:
    container_runtime: containerd

    lapi:
      replicas: 1
      env:
        # Auto-registers a bouncer named "traefik" with this key
        - name: BOUNCER_KEY_traefik
          valueFrom:
            secretKeyRef:
              name: crowdsec-secret
              key: BOUNCER_KEY_traefik
      persistentVolume:
        data:
          enabled: true
          size: 1Gi
          storageClassName: local-path
        config:
          enabled: true
          size: 100Mi
          storageClassName: local-path
      metrics:
        enabled: true
        serviceMonitor:
          enabled: false  # Phase 2
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
      strategy:
        type: Recreate

    agent:
      acquisition:
        - namespace: kube-system
          podName: traefik-*
          program: traefik
      env:
        - name: COLLECTIONS
          value: "crowdsecurity/traefik crowdsecurity/http-cve"
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
