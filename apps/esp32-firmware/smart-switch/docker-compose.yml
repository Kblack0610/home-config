services:
  esp32-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: esp32-smart-switch-dev
    container_name: esp32-smart-switch
    volumes:
      # Mount source code
      - .:/workspace
      # Cache cargo registry for faster builds
      - cargo-cache:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      # Mount target directory for build artifacts
      - ./target:/workspace/target
    environment:
      # Load from .env file
      - WIFI_SSID=${WIFI_SSID}
      - WIFI_PASSWORD=${WIFI_PASSWORD}
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
    working_dir: /workspace
    # For USB passthrough when flashing (Linux)
    # Uncomment the following for device access:
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    # privileged: true
    stdin_open: true
    tty: true

volumes:
  cargo-cache:
  cargo-git:
