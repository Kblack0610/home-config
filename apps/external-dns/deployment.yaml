apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
  labels:
    app.kubernetes.io/name: external-dns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
    spec:
      serviceAccountName: external-dns
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.15.0
          args:
            # Standard Ingresses AND Traefik IngressRoute CRDs (traefik-proxy).
            # traefik-proxy is needed for binks.chat, which is an IngressRoute
            # with edge TLS, not a standard Ingress. --traefik-disable-legacy
            # avoids watching the dead traefik.containo.us group (we use traefik.io).
            - --source=ingress
            - --source=traefik-proxy
            - --traefik-disable-legacy
            - --provider=cloudflare
            - --cloudflare-proxied
            # Point every managed record at the public-sites tunnel (CNAME),
            # NOT the Ingress's LAN LoadBalancer IP (192.168.1.243 — which
            # Cloudflare rejects for a proxied record). All public hostnames on
            # this homelab egress through this one tunnel.
            - --default-targets=ae1da648-4f55-4361-8ff2-320b55be6ac4.cfargotunnel.com
            # external-dns is the SOLE source of truth for public DNS across all
            # four public zones (derived from Ingress/IngressRoute). Terraform
            # manages no DNS. See docs/public-sites.md.
            - --domain-filter=kennethblack.me
            - --domain-filter=blacknbrownstudios.com
            - --domain-filter=binks.chat
            - --domain-filter=kblack.dev
            # Safety with the Terraform-managed tunnel/root records:
            # upsert-only never DELETES a record, and the TXT registry +
            # owner-id means external-dns only touches records IT created.
            - --policy=upsert-only
            - --registry=txt
            - --txt-owner-id=home-k3s
            - --txt-prefix=extdns-
            - --interval=1m
            - --log-level=info
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-api-token
                  key: api-token
          resources:
            requests:
              cpu: "10m"
              memory: "48Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
