apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
  labels:
    app.kubernetes.io/name: external-dns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
    spec:
      serviceAccountName: external-dns
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.15.0
          args:
            - --source=ingress
            - --provider=cloudflare
            - --cloudflare-proxied
            # Scope: only manage records under these zones. Add more zones here
            # (one flag each) as public sites move onto the tunnel.
            - --domain-filter=kennethblack.me
            # Safety with the Terraform-managed tunnel/root records:
            # upsert-only never DELETES a record, and the TXT registry +
            # owner-id means external-dns only touches records IT created.
            - --policy=upsert-only
            - --registry=txt
            - --txt-owner-id=home-k3s
            - --txt-prefix=extdns-
            - --interval=1m
            - --log-level=info
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-api-token
                  key: api-token
          resources:
            requests:
              cpu: "10m"
              memory: "48Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
