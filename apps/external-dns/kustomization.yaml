apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: external-dns

resources:
  - namespace.yaml
  - secret.sops.yaml
  - rbac.yaml
  - deployment.yaml
  - ddns-cronjob.yaml

# Hash-suffixed so a change to ddns.py rolls into the next scheduled run.
configMapGenerator:
  - name: wan-ddns-app
    files:
      - ddns.py

generatorOptions:
  labels:
    app.kubernetes.io/name: wan-ddns
