apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleet
  namespace: fleet
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-dns
    # LAN/Tailscale-only by default: every managed host (Macs, x86, Pis) is on
    # the LAN or Headscale, so agents enroll fine without exposing Fleet to the
    # public internet. There is deliberately NO Cloudflare tunnel route for this
    # host. To allow OFF-NET enrollment (e.g. a laptop that leaves the house),
    # swap this middleware for the crowdsec public bouncer and add a tunnel route:
    #   traefik.ingress.kubernetes.io/router.middlewares: crowdsec-crowdsec-bouncer@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: monitoring-local-network-only@kubernetescrd
spec:
  rules:
    - host: fleet.kblab.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fleet
                port:
                  number: 80
  tls:
    - hosts:
        - fleet.kblab.me
      secretName: fleet-tls
