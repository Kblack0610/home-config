apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-mysql
  namespace: fleet
  labels:
    app.kubernetes.io/name: fleet
    app.kubernetes.io/component: mysql
spec:
  replicas: 1
  strategy:
    # Single-writer local-path PVC; Recreate avoids two mysqld fighting the datadir.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet
      app.kubernetes.io/component: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet
        app.kubernetes.io/component: mysql
    spec:
      # Keep Fleet's datastore OFF asus-laptop (the storage SPOF that hit
      # DiskPressure on 2026-07-09 and took the cluster down). Label ONE stable
      # non-asus node:  kubectl label node <name> fleet.storage/node=true
      # Until that label exists this pod stays Pending by design (never lands on asus).
      nodeSelector:
        fleet.storage/node: "true"
      containers:
        - name: mysql
          # Fleet supports MySQL 8.0.x. Bump this tag to upgrade.
          image: mysql:8.0
          args:
            # Fleet's migrations/queries want these; matches upstream fleetdm guidance.
            - --default-authentication-plugin=caching_sha2_password
            - --innodb-buffer-pool-size=256M
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: "fleet"
            - name: MYSQL_USER
              value: "fleet"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fleet-secret
                  key: mysql-password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fleet-secret
                  key: mysql-root-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fleet-mysql-data
