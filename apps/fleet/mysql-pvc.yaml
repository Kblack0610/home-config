apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fleet-mysql-data
  namespace: fleet
  labels:
    app.kubernetes.io/name: fleet
    app.kubernetes.io/component: mysql
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      # Fleet's schema + host/query/software inventory. 8Gi is comfortable for a
      # ~15-host home fleet; software inventory is the main growth driver.
      storage: 8Gi
