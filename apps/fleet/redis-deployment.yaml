apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-redis
  namespace: fleet
  labels:
    app.kubernetes.io/name: fleet
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet
        app.kubernetes.io/component: redis
    spec:
      # Co-locate with fleet-mysql, off asus-laptop. See mysql-deployment.yaml
      # for the label rationale. Redis here is ephemeral (Fleet live-query pub/sub
      # + caching), so no PVC — a restart just drops in-flight live queries.
      nodeSelector:
        fleet.storage/node: "true"
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes: []
