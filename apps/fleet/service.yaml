apiVersion: v1
kind: Service
metadata:
  name: fleet
  namespace: fleet
  labels:
    app.kubernetes.io/name: fleet
    app.kubernetes.io/component: server
spec:
  selector:
    app.kubernetes.io/name: fleet
    app.kubernetes.io/component: server
  ports:
    # Fleet HTTP port; Traefik terminates TLS at the ingress layer.
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
