apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-config
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo
data:
  app.ini: |
    APP_NAME = Forgejo Git Server
    RUN_MODE = prod

    [server]
    # Canonical public URL — served via Cloudflare Tunnel for VDIs and other
    # devices without LAN/Tailscale access. Internal users on Tailscale can
    # still reach Forgejo at https://git.kblab.me (192.168.1.124) but will
    # see a "different URL" warning banner because of this canonical setting.
    DOMAIN = git.kennethblack.me
    # SSH stays on the internal hostname — Cloudflare Tunnel cannot proxy SSH,
    # so the only working `git clone ssh://` path is from LAN/Tailscale.
    SSH_DOMAIN = git.kblab.me
    ROOT_URL = https://git.kennethblack.me/
    HTTP_PORT = 3000
    SSH_PORT = 22
    START_SSH_SERVER = false
    SSH_LISTEN_PORT = 22
    DISABLE_SSH = false
    OFFLINE_MODE = false
    LFS_START_SERVER = true
    LFS_JWT_SECRET = Aei8uMUYs3o7DMM6ti-RB9lL-h7aH23KpCi4z_AYBQQ
    LFS_HTTP_AUTH_EXPIRY = 20m

    [lfs]
    PATH = /data/git/lfs
    STORAGE_TYPE = local

    [database]
    DB_TYPE = sqlite3
    PATH = /data/gitea/gitea.db

    [repository]
    ROOT = /data/git/repositories

    [security]
    INSTALL_LOCK = true

    [service]
    DISABLE_REGISTRATION = true
    # Forgejo is only reachable at 192.168.1.124 (private RFC1918 / VPN).
    # Disabling signin-view-required lets VPN users browse public repos and
    # pull public container images anonymously. No public-internet exposure.
    REQUIRE_SIGNIN_VIEW = false
    DEFAULT_KEEP_EMAIL_PRIVATE = true
    ENABLE_NOTIFY_MAIL = false

    [openid]
    ENABLE_OPENID_SIGNIN = false
    ENABLE_OPENID_SIGNUP = false

    [session]
    PROVIDER = file

    [actions]
    ENABLED = true
    DEFAULT_ACTIONS_URL = https://data.forgejo.org

    [packages]
    ENABLED = true

    [mirror]
    ENABLED = true
    # Allow per-repo mirror intervals as low as 1m (default MIN_INTERVAL is 10m).
    # Matches cron.update_mirrors.SCHEDULE for near-realtime tag sync.
    # Note: section is [mirror], NOT [repository.mirror] (which Forgejo ignores here).
    MIN_INTERVAL = 1m

    [cron.update_mirrors]
    ENABLED = true
    # 1-minute pull interval: we trigger Forgejo Actions builds via
    # mirrored tag events from GitHub (see DodginBalls pipeline).
    # Well under GitHub API rate limits for the handful of repos mirrored.
    SCHEDULE = @every 1m

    [git.timeout]
    # Large Unity repos (e.g., DodginBalls) need a long initial-clone budget.
    # Default is 600s which times out on the first mirror migration.
    MIGRATE = 3600
    MIRROR = 1800
    CLONE = 1800
    PULL = 1800
    # 600, not the stock 60. Forgejo hard-kills git at this deadline, and a
    # `git gc` SIGKILLed mid commit-graph write leaves an orphaned
    # commit-graph-chain.lock that blocks every later operation on the repo -
    # byte for byte the 2026-09-08 wedge. 60s is sized for small repos; this
    # instance hosts Unity repos big enough that MIGRATE is already 3600.
    # Kept well under the exporter's 7200s stale-lock threshold so a
    # legitimately long gc is never reported as debris.
    GC = 600

    [git.config]
    # git gc --auto runs INSIDE git fetch, so on a mirror it shares a code path
    # and a lock with replication: one crashed gc wedged kblack0610/platform for
    # two weeks on 2026-09-08. Moving gc to the scheduled task below means a
    # failed gc costs one housekeeping run instead of the mirror.
    #
    # The trade-off is real: nothing packs these repos now except the cron, so
    # ForgejoRepoLooseObjectsHigh in apps/monitoring/prometheus-rules-forgejo-mirrors.yaml
    # watches for it falling behind. Do not remove one without the other.
    gc.auto = 0
    # The one that actually mattered. Forgejo ships fetch.writeCommitGraph=true,
    # so `git fetch` writes a SPLIT commit-graph itself on every mirror pull -
    # independently of gc. The 2026-09-08 debris was
    # objects/info/commit-graphs/commit-graph-chain.lock plus a tmp_graph_*,
    # which is the split chain, i.e. the fetch's write and not gc's single-file
    # one. gc.auto=0 alone would have left that crash path wide open.
    #
    # The graph is still maintained: gc.writeCommitGraph stays on, so
    # [cron.git_gc_repos] builds it during scheduled maintenance, where a crash
    # costs one housekeeping run instead of replication.
    fetch.writeCommitGraph = false

    [cron.git_gc_repos]
    ENABLED = true
    SCHEDULE = @every 72h
    TIMEOUT = 10m

    [webhook]
    # Allow LAN-side webhook targets (e.g., notes-sync-bridge.kblab.me at
    # 192.168.1.124) in addition to public hosts. Forgejo's default
    # ALLOWED_HOST_LIST = `external` rejects RFC1918, which trips the
    # in-cluster ~/.notes sync fan-out.
    ALLOWED_HOST_LIST = private,external

    [log]
    MODE = console
    LEVEL = Info

    [other]
    SHOW_FOOTER_VERSION = true
