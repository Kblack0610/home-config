apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo
spec:
  replicas: 1
  strategy:
    type: Recreate  # Required for ReadWriteOnce PVC
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo
    spec:
      # data.forgejo.org is Forgejo's own registry; codeberg.org lost this
      # release's amd64 manifest on 2026-11-11 and now answers 403 (hc-294).
      # Pinned by index digest, so a restart pulls the bytes that were tested.
      initContainers:
        - name: config-seed
          image: data.forgejo.org/forgejo/forgejo:14.0.4@sha256:f33e1b5087b7dc3bdbb60ceb0e6f32bf0ce06376328d17c7db86fba62b673f6f
          command: ["sh", "-c", "mkdir -p /data/gitea/conf && cp /etc/gitea/app.ini /data/gitea/conf/app.ini && chmod 664 /data/gitea/conf/app.ini && chown 1000:1000 /data/gitea/conf/app.ini"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/gitea/app.ini
              subPath: app.ini
      containers:
        - name: forgejo
          image: data.forgejo.org/forgejo/forgejo:14.0.4@sha256:f33e1b5087b7dc3bdbb60ceb0e6f32bf0ce06376328d17c7db86fba62b673f6f
          ports:
            - name: http
              containerPort: 3000
            - name: ssh
              containerPort: 22
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
          # Not optional: without these Forgejo mints fresh secrets on each start.
          envFrom:
            - secretRef:
                name: forgejo-secrets
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/gitea/app.ini
              subPath: app.ini
          resources:
            requests:
              # Its working set (2.2Gi on 2026-11-11), so node-pressure eviction
              # on hp-victus, which ranks pods by use over request, reaches CI
              # and batch pods before Forgejo.
              memory: "2Gi"
              cpu: "50m"
            limits:
              # Cloning large Unity repos (DodginBalls) runs git index-pack which
              # exceeds 1Gi mid-clone and OOMKills the pod. 4Gi gives headroom.
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data-hp-victus
        - name: config
          configMap:
            name: forgejo-config
