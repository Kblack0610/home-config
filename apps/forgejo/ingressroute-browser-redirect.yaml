# Browsers on git.kblab.me get redirected to git.kennethblack.me, the ROOT_URL.
#
# Cookies are per host, and Forgejo builds every link from ROOT_URL, so a
# login on git.kblab.me is lost on the next click (13 logins in 7 days before
# this, 2026-11-07). Only requests that ask for HTML match here; git, docker,
# Flux, the npm registry and gatus never send `Accept: text/html`, so they keep
# the plain route in ingress.yaml. Rule: docs/standards.md, one browser hostname.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: git-browser-to-canonical
  namespace: forgejo
spec:
  redirectRegex:
    regex: "^https?://git\\.kblab\\.me/(.*)"
    replacement: "https://git.kennethblack.me/${1}"
    # 302: browsers do not cache it, so a revert takes effect at once.
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: forgejo-browser-redirect
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`git.kblab.me`) && HeaderRegexp(`Accept`, `text/html`)
      kind: Rule
      # No crowdsec here: Traefik runs without allowCrossNamespace, so an
      # IngressRoute cannot reference crowdsec/crowdsec-bouncer, and this route
      # only answers a 302 to git.kennethblack.me, whose ingress has crowdsec.
      middlewares:
        - name: git-browser-to-canonical
      services:
        - name: forgejo-http
          port: 3000
  tls:
    secretName: forgejo-tls
