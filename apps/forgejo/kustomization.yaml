apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: forgejo

resources:
  - namespace.yaml
  - service-http.yaml
  - service-ssh.yaml
  - ingress.yaml
  - ingressroute-browser-redirect.yaml
  - scrapeconfig-mirror-exporter.yaml
  - backup-pull-cronjob.yaml
  - backup-pull-secret.sops.yaml
  - runner-config-cm.yaml
  - runner-secret.yaml
  - runner-deployment.yaml
  - runner-reader-rbac.yaml

configMapGenerator:
  - name: forgejo-backup-pull-script
    files:
      - backup-pull.sh
