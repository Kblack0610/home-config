apiVersion: batch/v1
kind: CronJob
metadata:
  name: forgejo-lock-reaper
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo
spec:
  # Hourly. Turns "a crash wedges replication until a human notices" into "a
  # crash costs at most ~1h of sync", which is the whole point: apps/forgejo's
  # gc.auto=0 keeps git housekeeping out of the fetch path, but a node reboot or
  # OOM mid-operation can still orphan an index.lock or a ref lock.
  schedule: "17 * * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  # Keep failed pods so their logs survive. With OnFailure/low limits the Job
  # controller deletes them and a recurring failure shows only as
  # BackoffLimitExceeded - the mistake recorded in apps/flux-audit/cronjob.yaml.
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: reaper
              image: alpine:3.24.1
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              env:
                - name: NTFY_TOPIC
                  value: "http://ntfy.ntfy.svc.cluster.local/homelab-alerts"
                # Minutes. Must stay equal to STALE_LOCK_AFTER (7200s) in
                # apps/forgejo-mirror-exporter/deployment.yaml, so the detector
                # and the remediator agree on what "orphaned" means.
                #
                # 120 is 2x [git.timeout] MIGRATE=3600, the longest a
                # Forgejo-invoked git process can live before Forgejo kills it.
                # A pod cannot see Forgejo's PIDs without hostPID, so this age
                # gate IS the guard against reaping a live lock - which is why
                # it is deliberately double the longest legitimate operation.
                - name: STALE_MINUTES
                  value: "120"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  apk add --no-cache curl >/dev/null

                  # Closed allowlist. Never refs/, never objects/pack/, never
                  # the database: an orphaned lock is crash debris, but a ref
                  # lock removed under a live writer would be data loss.
                  NAMES="commit-graph-chain.lock index.lock packed-refs.lock config.lock HEAD.lock"
                  GLOBS="tmp_graph_* tmp_pack_* tmp_idx_* gc.log"

                  FOUND=""
                  for n in $NAMES; do
                    FOUND="$FOUND $(find /data/git/repositories -type f -name "$n" -mmin +"$STALE_MINUTES" 2>/dev/null || true)"
                  done
                  for g in $GLOBS; do
                    FOUND="$FOUND $(find /data/git/repositories -type f -name "$g" -mmin +"$STALE_MINUTES" 2>/dev/null || true)"
                  done

                  # shellcheck disable=SC2086
                  set -- $FOUND
                  if [ "$#" -eq 0 ]; then
                    echo "no orphaned git locks older than ${STALE_MINUTES}m"
                    exit 0
                  fi

                  echo "reaping $# orphaned file(s):"
                  REPORT=""
                  for f in "$@"; do
                    echo "  $f"
                    REPORT="$REPORT
                  $f"
                    rm -f "$f"
                  done

                  # Reaping is never silent. A repo that needs reaping twice is
                  # the signal that something upstream is broken, and that is
                  # only visible if every reap is reported.
                  if ! curl -sf -X POST "$NTFY_TOPIC" \
                    -H "Title: Forgejo: reaped $# orphaned git lock(s)" \
                    -H "Priority: default" \
                    -H "Tags: warning,git" \
                    -d "Removed after ${STALE_MINUTES}m idle (2x git.timeout MIGRATE). A repeat on the same repo means a process is dying mid-operation:
                  $REPORT"; then
                    echo "FATAL: could not deliver the finding to $NTFY_TOPIC"
                    exit 1
                  fi
                  echo "reported $# reaped file(s) to ntfy"
                  exit 0
              volumeMounts:
                # Read-WRITE, unlike the backup job. This is the one thing in
                # the repo that deletes from Forgejo's volume; the allowlist and
                # the age gate above are what make that safe.
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: forgejo-data
