apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo-runner
data:
  config.yaml: |
    log:
      level: info
    runner:
      file: .runner
      capacity: 2
      timeout: 3h
      labels:
        - "docker:docker://node:22-bookworm"
        - "linux-amd64:host"
    container:
      network: bridge
      privileged: false
      options:
      valid_volumes: []
    host:
      workdir_parent: /data/actions
