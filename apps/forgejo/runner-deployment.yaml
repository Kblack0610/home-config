apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo-runner
spec:
  # Two concurrent runners (was: 1, pinned to thinkcentre via nodeSelector). When
  # a workstation node dies (e.g. the power outage that froze a release), the other
  # replica is already live on a different box — instant failover, not the ~5-min
  # eviction-timeout gap a single replica would suffer on a hard node death. The
  # podAntiAffinity below keeps the two pods on different nodes.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
    spec:
      affinity:
        # Schedule only on amd64 workstation nodes (thinkcentre/hp-victus/
        # asus-laptop). DinD needs amd64 + privileged + 6Gi, which the arm64 Pis
        # can't satisfy, so the workstation role label is the correct gate.
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/workstation
                    operator: Exists
        # Spread the two replicas across different nodes for real redundancy.
        # Soft (preferred) so a single live workstation node still runs both
        # rather than leaving a replica Pending.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: forgejo-runner
      containers:
        - name: runner
          image: code.forgejo.org/forgejo/runner:6.3.1
          command:
            - sh
            - -c
            - |
              forgejo-runner register \
                --instance https://git.kblab.me \
                --token "$FORGEJO_RUNNER_REGISTRATION_TOKEN" \
                --name "$POD_NAME" \
                --no-interactive && \
              forgejo-runner daemon --config /etc/forgejo-runner/config.yaml
          env:
            # Unique per-pod runner name (the pod name) — mandatory with >1
            # replica, otherwise both register as "forgejo-runner" and collide.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: FORGEJO_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-secret
                  key: FORGEJO_RUNNER_REGISTRATION_TOKEN
            - name: DOCKER_HOST
              value: tcp://localhost:2375
          volumeMounts:
            - name: runner-config
              mountPath: /etc/forgejo-runner
            - name: runner-data
              mountPath: /data
            - name: docker-certs
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
        - name: dind
          image: docker:27-dind
          securityContext:
            privileged: true
          # Allow push to the in-cluster Forgejo registry without TLS,
          # so workflows can bypass Traefik's per-layer ingress timeout
          # on multi-GB image pushes (see .forgejo/workflows/openclaw-image.yaml).
          args:
            - --insecure-registry=forgejo-http.forgejo.svc.cluster.local:3000
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            - name: dind-storage
              mountPath: /var/lib/docker
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            # placemyparents-api builds pnpm install + tsup + Playwright
            # in a multi-stage Dockerfile — 2Gi got OOMKilled. 6Gi has
            # ample headroom on asus-laptop (64GB physical, ~13% used).
            limits:
              memory: "6Gi"
              cpu: "4000m"
      volumes:
        - name: runner-config
          configMap:
            name: forgejo-runner-config
        - name: runner-data
          emptyDir: {}
        - name: docker-certs
          emptyDir: {}
        - name: dind-storage
          emptyDir: {}
