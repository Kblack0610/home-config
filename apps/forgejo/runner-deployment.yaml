apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
    spec:
      nodeSelector:
        kubernetes.io/hostname: thinkcentre
      containers:
        - name: runner
          image: code.forgejo.org/forgejo/runner:6.3.1
          command:
            - sh
            - -c
            - |
              forgejo-runner register \
                --instance https://git.kblab.me \
                --token "$FORGEJO_RUNNER_REGISTRATION_TOKEN" \
                --name forgejo-runner \
                --no-interactive && \
              forgejo-runner daemon --config /etc/forgejo-runner/config.yaml
          env:
            - name: FORGEJO_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-secret
                  key: FORGEJO_RUNNER_REGISTRATION_TOKEN
            - name: DOCKER_HOST
              value: tcp://localhost:2375
          volumeMounts:
            - name: runner-config
              mountPath: /etc/forgejo-runner
            - name: runner-data
              mountPath: /data
            - name: docker-certs
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
        - name: dind
          image: docker:27-dind
          securityContext:
            privileged: true
          # Allow push to the in-cluster Forgejo registry without TLS,
          # so workflows can bypass Traefik's per-layer ingress timeout
          # on multi-GB image pushes (see .forgejo/workflows/openclaw-image.yaml).
          args:
            - --insecure-registry=forgejo-http.forgejo.svc.cluster.local:3000
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            - name: dind-storage
              mountPath: /var/lib/docker
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
      volumes:
        - name: runner-config
          configMap:
            name: forgejo-runner-config
        - name: runner-data
          emptyDir: {}
        - name: docker-certs
          emptyDir: {}
        - name: dind-storage
          emptyDir: {}
