apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo-runner
spec:
  # Two concurrent runners on two different nodes, neither of them the Forgejo
  # node. When one node dies the other replica is already live, instead of the
  # ~5-min eviction gap a single replica would suffer on a hard node death.
  replicas: 2
  # The anti-affinity below is required and only two nodes qualify, so a surge
  # pod would have nowhere to go and a rollout would hang. Replace one pod at a
  # time instead.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
    spec:
      affinity:
        # amd64 workstation nodes only: DinD needs amd64, privileged and 6Gi,
        # which the arm64 Pis cannot give. Never hp-victus: Forgejo's data PV
        # (forgejo-data-hp-victus) is there since 2026-11-11, so a runner on it
        # shares Forgejo's disk, memory and fate. That leaves asus-laptop and
        # razer-laptop.
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/workstation
                    operator: Exists
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - hp-victus
        # Required, not preferred: with the preferred rule both replicas sat on
        # asus-laptop, so one node took out all of CI. If one of the two nodes
        # is down, its replica stays Pending and the other keeps running.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: forgejo-runner
      containers:
        - name: runner
          image: code.forgejo.org/forgejo/runner:6.3.1
          command:
            - sh
            - -c
            - |
              forgejo-runner register \
                --instance https://git.kblab.me \
                --token "$FORGEJO_RUNNER_REGISTRATION_TOKEN" \
                --name "$POD_NAME" \
                --no-interactive && \
              forgejo-runner daemon --config /etc/forgejo-runner/config.yaml
          env:
            # Unique per-pod runner name (the pod name) — mandatory with >1
            # replica, otherwise both register as "forgejo-runner" and collide.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: FORGEJO_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-secret
                  key: FORGEJO_RUNNER_REGISTRATION_TOKEN
            - name: DOCKER_HOST
              value: tcp://localhost:2375
          volumeMounts:
            - name: runner-config
              mountPath: /etc/forgejo-runner
            - name: runner-data
              mountPath: /data
            - name: docker-certs
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
        - name: dind
          image: docker:27-dind
          securityContext:
            privileged: true
          # Allow push to the in-cluster Forgejo registry without TLS,
          # so workflows can bypass Traefik's per-layer ingress timeout
          # on multi-GB image pushes.
          # The pod's eth0 is 1450 (flannel vxlan); docker0 defaults to 1500,
          # so a build container's TLS handshakes stall (apk add hung 20 min
          # on registry-v1.4.0). Match the pod MTU.
          args:
            - --insecure-registry=forgejo-http.forgejo.svc.cluster.local:3000
            - --mtu=1450
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            - name: dind-storage
              mountPath: /var/lib/docker
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            # placemyparents-api builds pnpm install + tsup + Playwright
            # in a multi-stage Dockerfile - 2Gi got OOMKilled.
            limits:
              memory: "6Gi"
              cpu: "4000m"
        # Nothing else clears dind's store. On 2026-11-10 it held 101G of 59 unused images on
        # razer-laptop, a CI host, and the ci-runner-governor withheld its Unity slots for
        # disk. Built images are pushed when they are built, so one unused past a day goes,
        # and build cache stays under 20G. The CLI has no event for "store grew", so this
        # runs on a fixed cadence.
        - name: dind-prune
          image: docker:27-cli
          command:
            - sh
            - -c
            - |
              PRUNE_EVERY_SECONDS=3600
              # Sleep first: dind is still starting when this container does.
              while sleep "$PRUNE_EVERY_SECONDS"; do
                docker container prune -f --filter until=24h
                docker image prune -af --filter until=24h
                docker builder prune -f --max-used-space 20GB
                docker volume prune -f
              done
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2375
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: runner-config
          configMap:
            name: forgejo-runner-config
        - name: runner-data
          emptyDir: {}
        - name: docker-certs
          emptyDir: {}
        # Over the limit the kubelet evicts the pod and the runner comes back empty, which
        # beats filling the node. dind-prune above keeps it well under: a day of images
        # plus 20G of build cache.
        - name: dind-storage
          emptyDir:
            sizeLimit: 60Gi
