apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo-runner
spec:
  # Two concurrent runners on two different nodes, neither of them the Forgejo
  # node. When one node dies the other replica is already live, instead of the
  # ~5-min eviction gap a single replica would suffer on a hard node death.
  replicas: 2
  # The anti-affinity below is required and only two nodes qualify, so a surge
  # pod would have nowhere to go and a rollout would hang. Replace one pod at a
  # time instead.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
    spec:
      affinity:
        # amd64 workstation nodes only: DinD needs amd64, privileged and 6Gi,
        # which the arm64 Pis cannot give. Never asus-laptop: the forgejo-data
        # PV (local-path) is pinned there, so a runner on it shares Forgejo's
        # disk and dies with it, and its NVMe has controller resets
        # (2026-11-03 07:18 and 13:48). That leaves hp-victus and razer-laptop.
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/workstation
                    operator: Exists
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - asus-laptop
        # Required, not preferred: with the preferred rule both replicas sat on
        # asus-laptop, so one node took out all of CI. If one of the two nodes
        # is down, its replica stays Pending and the other keeps running.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: forgejo-runner
      containers:
        - name: runner
          image: code.forgejo.org/forgejo/runner:6.3.1
          command:
            - sh
            - -c
            - |
              forgejo-runner register \
                --instance https://git.kblab.me \
                --token "$FORGEJO_RUNNER_REGISTRATION_TOKEN" \
                --name "$POD_NAME" \
                --no-interactive && \
              forgejo-runner daemon --config /etc/forgejo-runner/config.yaml
          env:
            # Unique per-pod runner name (the pod name) — mandatory with >1
            # replica, otherwise both register as "forgejo-runner" and collide.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: FORGEJO_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-secret
                  key: FORGEJO_RUNNER_REGISTRATION_TOKEN
            - name: DOCKER_HOST
              value: tcp://localhost:2375
          volumeMounts:
            - name: runner-config
              mountPath: /etc/forgejo-runner
            - name: runner-data
              mountPath: /data
            - name: docker-certs
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
        - name: dind
          image: docker:27-dind
          securityContext:
            privileged: true
          # Allow push to the in-cluster Forgejo registry without TLS,
          # so workflows can bypass Traefik's per-layer ingress timeout
          # on multi-GB image pushes.
          # The pod's eth0 is 1450 (flannel vxlan); docker0 defaults to 1500,
          # so a build container's TLS handshakes stall (apk add hung 20 min
          # on registry-v1.4.0). Match the pod MTU.
          args:
            - --insecure-registry=forgejo-http.forgejo.svc.cluster.local:3000
            - --mtu=1450
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            - name: dind-storage
              mountPath: /var/lib/docker
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            # placemyparents-api builds pnpm install + tsup + Playwright
            # in a multi-stage Dockerfile - 2Gi got OOMKilled.
            limits:
              memory: "6Gi"
              cpu: "4000m"
      volumes:
        - name: runner-config
          configMap:
            name: forgejo-runner-config
        - name: runner-data
          emptyDir: {}
        - name: docker-certs
          emptyDir: {}
        - name: dind-storage
          emptyDir: {}
