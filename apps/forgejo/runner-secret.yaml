apiVersion: v1
kind: Secret
metadata:
  name: forgejo-runner-secret
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo-runner
type: Opaque
stringData:
  # After Forgejo v14 is running:
  # 1. Go to Site Admin > Actions > Runners > Create new runner
  # 2. Copy the registration token
  # 3. Replace PLACEHOLDER below with the real token
  # 4. Encrypt: sops --encrypt --in-place apps/forgejo/runner-secret.yaml
  FORGEJO_RUNNER_REGISTRATION_TOKEN: PLACEHOLDER
