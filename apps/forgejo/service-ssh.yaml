apiVersion: v1
kind: Service
metadata:
  name: forgejo-ssh
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo
spec:
  type: LoadBalancer  # k3s servicelb will assign IP
  selector:
    app.kubernetes.io/name: forgejo
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      protocol: TCP
