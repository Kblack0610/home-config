# Nightly strategy analysis (lab/analyze.py): every strategy x exchange
# backtested per calendar year over all backfilled history, with lookahead and
# recursive bias checks, then windows, intervals, Monte Carlo estimates,
# regimes and correlations rebuilt in the trader database. Past years are
# cached by file, config and freqtrade version, so a normal night redoes only
# the current year; the first run, or a freqtrade bump, redoes everything and
# takes hours. Nothing here touches the bots.
# It runs the trader-ml image (the same repo on freqtrade's FreqAI base), so the
# ML family (user_data/strategies/ml) is backtested too; FreqAI keeps the models
# it trains under user_data/models, here a folder on the lab PVC, so a night
# retrains only the new weekly windows.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: freqtrade-analysis
spec:
  schedule: "45 2 * * *"  # clear of the :20 backfill
  timeZone: "Etc/UTC"  # unset means the controller zone, America/Los_Angeles
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0  # the next night is the retry; failed chunks are retried there
      activeDeadlineSeconds: 64800  # guard: a full first run is a few hours, a normal night under one
      template:
        metadata:
          labels:
            app: freqtrade-analysis
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          initContainers:
            - name: migrate
              image: trader-ml
              # makes the models folder as uid 1000: a subPath kubelet makes is root's, and this PV is a hostPath
              command: ["sh", "-c", "mkdir -p /lab/models && exec python /repo/lab/migrate.py"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: trader-db, key: database-url}
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - {name: lab, mountPath: /lab}
          containers:
            - name: analysis
              image: trader-ml
              command: ["python", "/repo/lab/analyze.py"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: trader-db, key: database-url}
                - name: ANALYZE_EXCHANGES
                  value: "binanceus coinbase kraken okx kucoin"  # a venue x timeframe joins once every pair is backfilled to its oldest candle
                - name: ANALYZE_WORKERS
                  value: "4"  # matches the 4-CPU limit
                - name: ANALYZE_MEMORY_GB
                  value: "8"  # tasks are admitted by estimated memory; 4 GB under the limit for the parent process and estimate error
              resources:
                requests:
                  cpu: "1"  # razer-laptop offers pods 4 CPUs since home-config #732, and the PVC pins this job there
                  memory: 14Gi  # equal to the limit, so the scheduler sees what it uses
                limits:
                  cpu: "4"  # the whole k3s budget on razer-laptop; the walk-forward runs elsewhere since trader plan magical-stargazing-owl phase 3
                  memory: 14Gi  # ANALYZE_MEMORY_GB plus headroom; runs peak near 10.3 GiB at a budget of 8 (2026-11-06), a 5m year of 10 pairs at 1.1 GB, a 1m year at 4 GB
              volumeMounts:
                - {name: lab, mountPath: /lab}
                - {name: lab, mountPath: /repo/user_data/models, subPath: models}
          volumes:
            - name: lab
              persistentVolumeClaim:
                claimName: freqtrade-lab
