# Hourly price backfill for the research venues (okx, kucoin): the same
# lab/backfill.py as freqtrade-backfill, in its own job so OKX's first pass
# (100 candles per request, years of 5m for 22 pairs) never holds back the
# bot venues' hourly candles. No 1m. Both jobs share PVC freqtrade-lab, and
# each replaces only its own exchanges' data_coverage rows.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: freqtrade-backfill-research
spec:
  schedule: "50 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0  # the next hour is the retry
      activeDeadlineSeconds: 21600  # guard: OKX's first pass spans several runs, each keeps the pairs it finished
      template:
        metadata:
          labels:
            app: freqtrade-backfill-research
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          initContainers:
            - name: migrate
              image: trader
              command: ["python", "/repo/lab/migrate.py"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: trader-db, key: database-url}
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          containers:
            - name: backfill
              image: trader
              command: ["python", "/repo/lab/backfill.py"]
              env:
                - name: BACKFILL_EXCHANGES
                  value: "okx kucoin"
                - name: TIMEFRAMES
                  value: "5m 15m 30m 1h 4h 1d"
                - name: FORWARD_EXCHANGES
                  value: ""
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: trader-db, key: database-url}
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  memory: 4Gi  # one freqtrade process per exchange, each holding a full 5m series
              volumeMounts:
                - {name: lab, mountPath: /lab}
          volumes:
            - name: lab
              persistentVolumeClaim:
                claimName: freqtrade-lab
