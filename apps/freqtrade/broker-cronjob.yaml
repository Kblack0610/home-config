# Broker accounts over their official APIs (strategy repo lab/broker.py, docs/platforms.md): Alpaca paper now;
# SnapTrade (Fidelity, read connection) and Robinhood Crypto when their keys are added to trader-brokers. Every key
# in that Secret reaches the pod by envFrom, so adding a source is a Secret edit only; a source with no keys is skipped.
# The real-account clients send only GET; the only client that can order is Alpaca paper, which refuses any host but
# paper-api.alpaca.markets. Same image, database, init migration and node rule as the markets recorders.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trader-broker-read
spec:
  # one broker_balances row per account each hour; SnapTrade allows 10 req/min per account
  schedule: "17 * * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: trader-broker-read
        spec:
          restartPolicy: Never
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - {key: kubernetes.io/arch, operator: In, values: [amd64]}
                      - {key: kubernetes.io/hostname, operator: NotIn, values: [hp-victus]}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          initContainers:
            - name: migrate
              image: trader
              command: ["python", "/repo/lab/migrate.py"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: trader-db, key: database-url}
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          containers:
            - name: broker
              image: trader
              command: ["python", "-m", "lab.broker", "read"]
              envFrom:
                - secretRef: {name: trader-brokers}
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: trader-db, key: database-url}
              resources:
                requests:
                  cpu: 20m
                  memory: 96Mi
                limits:
                  memory: 256Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trader-broker-drill
spec:
  # Alpaca paper only: rest one SPY share at $1, read it back, cancel it (demo_orders); weekdays, US market hours
  schedule: "40 14 * * 1-5"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: trader-broker-drill
        spec:
          restartPolicy: Never
