# Nightly candle snapshot (strategy repo lab/snapshot.py publish): every candle
# file on PVC freqtrade-lab whose content changed goes to MinIO, bucket
# trader-markets, prefix candles/, by its sha256, with a manifest naming them;
# the newest two manifests and their files are kept. The walk-forward pods
# copy it to their own disk (walkforward-cronjob.yaml), so they run on any
# node. The PVC pins this job to its node, as it does the backfill.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: freqtrade-candles-publish
spec:
  schedule: "45 0 * * *"  # after the 00:20 backfill, before the 01:00 walk-forward
  timeZone: "Etc/UTC"  # unset means the controller zone, America/Los_Angeles
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: freqtrade-candles-publish
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: publish
              image: trader
              command: ["python", "/repo/lab/snapshot.py", "publish"]
              env:
                - name: S3_ENDPOINT
                  value: http://minio.minio.svc.cluster.local:9000
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: {name: trader-markets-s3, key: S3_ACCESS_KEY}
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef: {name: trader-markets-s3, key: S3_SECRET_KEY}
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 512Mi  # it streams each file in 8 MB chunks
              volumeMounts:
                - {name: lab, mountPath: /lab, readOnly: true}
          volumes:
            - name: lab
              persistentVolumeClaim:
                claimName: freqtrade-lab
