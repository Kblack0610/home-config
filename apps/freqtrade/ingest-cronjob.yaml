# Ingest every 5 minutes (lab/ingest.py): every bot's trades and a snapshot into the
# trader database, plus an idempotent import of /lab/runs/*/summary.json and
# /lab/league-history.jsonl. The init container applies any new schema
# migration first. Fails if any bot reports it is not in dry run.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: freqtrade-ingest
spec:
  schedule: "*/5 * * * *"
  timeZone: "Etc/UTC"  # unset means the controller zone, America/Los_Angeles
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900  # guard: a run takes seconds
      template:
        metadata:
          labels:
            app: freqtrade-ingest
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          initContainers:
            - name: migrate
              image: trader
              command: ["python", "/repo/lab/migrate.py"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: trader-db, key: database-url}
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          containers:
            - name: ingest
              image: trader
              command: ["python", "/repo/lab/ingest.py"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: trader-db, key: database-url}
                - name: FT_API_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: freqtrade-api, key: password}
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - {name: roster, mountPath: /etc/freqtrade-league}
                - {name: lab, mountPath: /lab, readOnly: true}
          volumes:
            - name: roster
              configMap:
                name: freqtrade-league-roster
            - name: lab
              persistentVolumeClaim:
                claimName: freqtrade-lab
