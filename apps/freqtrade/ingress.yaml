apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trader-web
  namespace: freqtrade
  labels:
    app: trader-web
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-dns
    # Public on purpose, like apps/agents/ingress.yaml: external-dns publishes the host
    # and the wildcard tunnel routes it, so it works off the LAN. The gate is the app's
    # Sign in with Forgejo; crowdsec in front.
    traefik.ingress.kubernetes.io/router.middlewares: crowdsec-crowdsec-bouncer@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - trader.kblab.me
      secretName: trader-tls
  rules:
    - host: trader.kblab.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trader-web
                port:
                  number: 80
