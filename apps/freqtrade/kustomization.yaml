apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: freqtrade

resources:
  - namespace.yaml
  - api-secret.yaml
  - statefulset.yaml
  - lab-pvc.yaml
  - analysis-cronjob.yaml
  - lab-priorityclass.yaml
  - candles-publish-cronjob.yaml
  - walkforward-cronjob.yaml
  - ingest-cronjob.yaml
  - backfill-cronjob.yaml
  - backfill-research-cronjob.yaml
  - lab-backup-cronjob.yaml
  - markets-recorder-cronjob.yaml
  - markets-venue-recorders-cronjob.yaml
  - markets-compact-cronjob.yaml
  - markets-history-cronjob.yaml
  - trader-markets-s3-secret.sops.yaml
  - futures-cronjob.yaml
  - trader-db-secret.sops.yaml
  - trader-web-oauth-secret.sops.yaml
  - watcher-deployment.yaml
  - web-deployment.yaml
  - ingress.yaml
  - servicemonitor.yaml

images:
  # The lab image (strategy repo Dockerfile, built by its CI): Freqtrade 2026.9
  # plus psycopg plus the repo at /repo. Bump digest to ship a strategy or lab
  # change; the tag is the strategy repo commit it was built from.
  - name: trader
    newName: ghcr.io/kblack0610/trader
    digest: sha256:fa2fac47987afdcd28dee235b83c0dc5cacf9b9ad3ff44340eb8c4efb99525fd  # sha-4fbc90e
  # The same repo on freqtrade's FreqAI base (lightgbm), 2.7 GB: only the
  # analysis job runs it, for the ML family. The strategy repo's bump PR moves
  # this digest with trader's.
  - name: trader-ml
    newName: ghcr.io/kblack0610/trader-ml
    digest: sha256:400a839f6e35c53ba054335d8ad450fa4fe2c031c8a563101c0c34e7a87cea05  # sha-4fbc90e

configMapGenerator:
  # Rows here and replicas in statefulset.yaml move together.
  - name: freqtrade-league-roster
    files:
      - roster.tsv
