apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: freqtrade

resources:
  - namespace.yaml
  - api-secret.yaml
  - statefulset.yaml
  - lab-pvc.yaml
  - experiments-cronjob.yaml
  - report-cronjob.yaml
  - ingest-cronjob.yaml
  - backfill-cronjob.yaml
  - lab-backup-cronjob.yaml
  - trader-db-secret.sops.yaml

images:
  # The lab image (strategy repo Dockerfile, built by its CI): Freqtrade 2026.9
  # plus psycopg plus the repo at /repo. Bump digest to ship a strategy or lab
  # change; the tag is the strategy repo commit it was built from.
  - name: trader
    newName: ghcr.io/kblack0610/trader
    digest: sha256:35820529f80e90e59033d6d1d7498506ffe1a16856330879f562b8c04b467dff  # sha-72e06ec

configMapGenerator:
  # Rows here and replicas in statefulset.yaml move together.
  - name: freqtrade-league-roster
    files:
      - roster.tsv
