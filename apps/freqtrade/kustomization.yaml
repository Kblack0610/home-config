apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: freqtrade

resources:
  - namespace.yaml
  - api-secret.yaml
  - statefulset.yaml
  - lab-pvc.yaml
  - analysis-cronjob.yaml
  - lab-priorityclass.yaml
  - candles-publish-cronjob.yaml
  - walkforward-cronjob.yaml
  - calibration-cronjob.yaml
  - ingest-cronjob.yaml
  - backfill-cronjob.yaml
  - backfill-research-cronjob.yaml
  - lab-backup-cronjob.yaml
  - markets-recorder-cronjob.yaml
  - markets-venue-recorders-cronjob.yaml
  - markets-compact-cronjob.yaml
  - markets-history-cronjob.yaml
  - markets-links-cronjob.yaml
  - markets-families-cronjob.yaml
  - trader-markets-s3-secret.sops.yaml
  - trader-odds-api-secret.sops.yaml
  - trader-brokers-secret.sops.yaml
  - broker-cronjob.yaml
  - trader-kalshi-demo-secret.sops.yaml
  - kalshi-demo-drill-cronjob.yaml
  - trader-manifold-secret.sops.yaml
  - manifold-drill-cronjob.yaml
  - trader-wallet-secret.sops.yaml
  - wallet-cronjob.yaml
  - futures-cronjob.yaml
  - trader-db-secret.sops.yaml
  - trader-feeds-secret.sops.yaml   # FEED_DATABASE_URL: read-only feed-ingest ledger (apps/feed-ingest)
  - call-rules-cronjob.yaml   # reads trader-feeds: feed events to scored rule calls (trader lab/call_rules.py)
  - trader-web-oauth-secret.sops.yaml
  - watcher-deployment.yaml
  - web-deployment.yaml
  - ingress.yaml
  - servicemonitor.yaml

images:
  # The lab image (strategy repo Dockerfile, built by its CI): Freqtrade 2026.9
  # plus psycopg plus the repo at /repo. Bump digest to ship a strategy or lab
  # change; the tag is the strategy repo commit it was built from.
  - name: trader
    newName: ghcr.io/kblack0610/trader
    digest: sha256:7d1c9726e4c584eb586295ab612ae6598ecc75da84e8716cdf75158ec4df5af8  # sha-af1dc56
  # The same repo on freqtrade's FreqAI base (lightgbm), 2.7 GB: only the
  # analysis job runs it, for the ML family. The strategy repo's bump PR moves
  # this digest with trader's.
  - name: trader-ml
    newName: ghcr.io/kblack0610/trader-ml
    digest: sha256:e13999bc240275ee35378dcb064f361a5a4e3764c73644deab5e8c81b0663a27  # sha-af1dc56

configMapGenerator:
  # Rows here and replicas in statefulset.yaml move together.
  - name: freqtrade-league-roster
    files:
      - roster.tsv
