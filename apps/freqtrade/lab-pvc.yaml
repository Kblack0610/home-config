# Price history (data/<exchange>, kept by the backfill job), experiment runs
# and the report history. local-path is RWO and node-pinned (hp-victus), and
# the size is not enforced; every CronJob that mounts it lands on that node.
# Backed up weekly by lab-backup-cronjob.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: freqtrade-lab
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
