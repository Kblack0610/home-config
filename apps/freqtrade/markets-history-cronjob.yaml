  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0  # the next run resumes; a retry would only page the venue again
      activeDeadlineSeconds: 7200  # guard: the run stops itself after 50 min plus the page or date in hand
      template:
        metadata:
          labels:
            app: trader-markets-history-bars
        spec:
          restartPolicy: Never
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
