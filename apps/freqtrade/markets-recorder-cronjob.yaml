# Markets recorder (strategy repo lab/markets/recorder.py, docs/markets.md Recorder): every open
# Kalshi market's top of book, change-only, as parquet into MinIO bucket trader-markets, plus market
# metadata, resolutions and a market_sweeps row into the trader database. A sweep takes 3 to 4.5 min,
# so Forbid skips a tick rather than overlapping. Read-only, public API, no venue key.
# Kept off hp-victus, whose memory limits are overcommitted (plan id-like-to-setup-abundant-seahorse).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trader-markets-recorder
spec:
  schedule: "*/5 * * * *"
  timeZone: "Etc/UTC"  # unset means the controller zone, America/Los_Angeles
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900  # guard: a sweep takes under 5 min
      template:
        metadata:
          labels:
            app: trader-markets-recorder
        spec:
          restartPolicy: Never
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - {key: kubernetes.io/arch, operator: In, values: [amd64]}
                      - {key: kubernetes.io/hostname, operator: NotIn, values: [hp-victus]}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          initContainers:
            - name: migrate
              image: trader
              command: ["python", "/repo/lab/migrate.py"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: trader-db, key: database-url}
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          containers:
            - name: recorder
              image: trader
              command: ["python", "-m", "lab.markets.recorder"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: trader-db, key: database-url}
                - name: S3_ENDPOINT
                  value: http://minio.minio.svc.cluster.local:9000
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: {name: trader-markets-s3, key: S3_ACCESS_KEY}
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef: {name: trader-markets-s3, key: S3_SECRET_KEY}
              resources:
                # Measured 214 MiB RSS live (171k markets), 316 MiB staging 180k new quotes (2026-11-11, tr-184).
                # 1Gi gives over 3x the observed peak, including cold quote staging.
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  memory: 1Gi
