# Daily league report (lab/report.py): reads every bot's API, appends
# /lab/league-history.jsonl and writes /lab/reports/<date>.md. Fails if any
# bot reports it is not in dry run.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: freqtrade-report
spec:
  schedule: "30 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: freqtrade-report
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: report
              image: trader
              command: ["python", "/repo/lab/report.py"]
              env:
                - name: FT_API_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: freqtrade-api, key: password}
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - {name: roster, mountPath: /etc/freqtrade-league}
                - {name: lab, mountPath: /lab}
          volumes:
            - name: roster
              configMap:
                name: freqtrade-league-roster
            - name: lab
              persistentVolumeClaim:
                claimName: freqtrade-lab
