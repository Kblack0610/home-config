# Weekly walk-forward test (lab/walkforward.py): for each of the last six whole
# months, hyperopt tunes each candidate (league strategies, then promote and
# watch suggestions) on the 180 days before it, then that unseen month is
# backtested as is and tuned. Months are cached, so a normal week runs only the
# newest one; the first run, or a freqtrade bump, runs all six and takes hours.
# Retune suggestions follow from it. Nothing here touches the bots.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: freqtrade-walkforward
spec:
  schedule: "0 9 * * 6"  # Saturday, after the night's analysis and clear of the :20 backfill
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0  # next week is the retry; failed months are retried there
      activeDeadlineSeconds: 172800  # guard: a first run on three venues is about 20 hours, a normal week a few
      template:
        metadata:
          labels:
            app: freqtrade-walkforward
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          initContainers:
            - name: migrate
              image: trader
              command: ["python", "/repo/lab/migrate.py"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: trader-db, key: database-url}
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          containers:
            - name: walkforward
              image: trader
              command: ["python", "/repo/lab/walkforward.py"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: trader-db, key: database-url}
                - name: WF_EXCHANGES
                  value: binanceus okx kucoin
                - name: WF_FOLDS
                  value: "12"
                - name: WF_WORKERS
                  value: "10"
                - name: WF_MEMORY_GB
                  value: "12"
              resources:
                requests:
                  cpu: "6"
                  memory: 14Gi  # equal to the limit, as in analysis-cronjob.yaml
                limits:
                  memory: 14Gi  # WF_MEMORY_GB of estimated fold memory plus the interpreter and suggest
              volumeMounts:
                - {name: lab, mountPath: /lab}
          volumes:
            - name: lab
              persistentVolumeClaim:
                claimName: freqtrade-lab
