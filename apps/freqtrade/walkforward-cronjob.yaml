# Nightly walk-forward test (lab/walkforward.py): for each of the last WF_FOLDS
# whole months, hyperopt tunes each candidate (league strategies, then promote and
# watch suggestions) on the 180 days before it, then that unseen month is
# backtested as is and tuned. Each fold is stored as it finishes and skipped once
# stored, so a normal night runs only new candidates and a new month; a first run,
# or a freqtrade bump, takes several nights, each stopping at WF_BUDGET_S and
# carrying on where the last stopped.
# Retune suggestions follow from it. Nothing here touches the bots.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: freqtrade-walkforward
spec:
  schedule: "0 1 * * *"  # nightly, alongside the 02:45 analysis; both fit on razer-laptop
  timeZone: "Etc/UTC"  # unset means the controller zone, America/Los_Angeles
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0  # the next night is the retry; failed months are retried there
      activeDeadlineSeconds: 28800  # ends by 09:00 UTC; WF_BUDGET_S stops a run in time, so a first run (about 53 h of folds) is several recorded nights
      template:
        metadata:
          labels:
            app: freqtrade-walkforward
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          initContainers:
            - name: migrate
              image: trader
              command: ["python", "/repo/lab/migrate.py"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: trader-db, key: database-url}
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          containers:
            - name: walkforward
              image: trader
              command: ["python", "/repo/lab/walkforward.py"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: trader-db, key: database-url}
                - name: WF_EXCHANGES
                  value: binanceus okx kucoin
                - name: WF_FOLDS
                  value: "12"
                - name: WF_WORKERS
                  value: "10"
                - name: WF_MEMORY_GB
                  value: "12"
                - name: WF_BUDGET_S  # starts no fold after this: the deadline less WF_TIMEOUT (10800) and 30 min for the post steps
                  value: "16200"
              resources:
                requests:
                  cpu: "6"
                  memory: 14Gi  # equal to the limit, as in analysis-cronjob.yaml
                limits:
                  memory: 14Gi  # WF_MEMORY_GB of estimated fold memory plus the interpreter and suggest
              volumeMounts:
                - {name: lab, mountPath: /lab}
          volumes:
            - name: lab
              persistentVolumeClaim:
                claimName: freqtrade-lab
