apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  namespace: frigate
  labels:
    app.kubernetes.io/name: frigate
spec:
  replicas: 1
  # RWO local-path volumes and one USB Coral: the old pod must be gone first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: frigate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frigate
    spec:
      # The Coral USB Accelerator is plugged into hp-victus, and the
      # local-path volumes live there.
      nodeSelector:
        kubernetes.io/hostname: hp-victus
      initContainers:
        # Git is the source of truth for config.yml (see the header of config.yml).
        - name: install-config
          image: alpine:3.24.1
          command: ["sh", "-c", "cp /seed/config.yml /config/config.yml"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: seed
              mountPath: /seed
      containers:
        - name: frigate
          image: ghcr.io/blakeblackshear/frigate:0.18.0
          env:
            - name: TZ
              value: America/Los_Angeles
          envFrom:
            - secretRef:
                name: frigate-camera
          ports:
            - name: http-auth
              containerPort: 8971
            - name: http-internal
              containerPort: 5000
            - name: rtsp
              containerPort: 8554
            - name: webrtc-tcp
              containerPort: 8555
              protocol: TCP
            - name: webrtc-udp
              containerPort: 8555
              protocol: UDP
          # The Coral re-enumerates when Frigate loads its firmware
          # (1a6e:089a -> 18d1:9302), so the pod gets the whole USB bus and
          # device access, not one fixed device node.
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /api/version
              port: http-internal
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/version
              port: http-internal
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media/frigate
            - name: cache
              mountPath: /tmp/cache
            - name: dshm
              mountPath: /dev/shm
            - name: usb
              mountPath: /dev/bus/usb
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: frigate-config
        - name: media
          persistentVolumeClaim:
            claimName: frigate-media
        - name: seed
          configMap:
            name: frigate-config
        - name: usb
          hostPath:
            path: /dev/bus/usb
            type: Directory
        # Recording segments land here before they are moved to /media; RAM
        # saves the SSD the churn.
        - name: cache
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        # Frigate's frame buffers. One 640x480 detect stream needs well under
        # this; raise it with each camera added (see Frigate's shm docs).
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
