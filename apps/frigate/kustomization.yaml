apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: frigate

configMapGenerator:
  - name: frigate-config
    files:
      - config.yml

resources:
  - namespace.yaml
  - pvc.yaml
  - camera-secret.yaml
  - backup-nas-secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - backup-cronjob.yaml
