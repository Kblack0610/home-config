# Both PVCs bind on hp-victus (local-path is WaitForFirstConsumer and the pod is
# pinned there). local-path does NOT enforce the size: the media volume can grow
# until the node disk is full, so record retention in config.yml is the real cap.
# hp-victus had 169G free (82% used) on 2026-10-17.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-config
  namespace: frigate
  labels:
    app.kubernetes.io/name: frigate
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-media
  namespace: frigate
  labels:
    app.kubernetes.io/name: frigate
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 80Gi
