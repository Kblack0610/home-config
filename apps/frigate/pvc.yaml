# Both PVCs bind on hp-victus (local-path is WaitForFirstConsumer and the pod is
# pinned there). local-path does NOT enforce the size: the media volume can grow
# until the node disk is full, so record retention in config.yml is the real cap.
# hp-victus had 298G free on 2026-11-16.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-config
  namespace: frigate
  labels:
    app.kubernetes.io/name: frigate
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-media
  namespace: frigate
  labels:
    app.kubernetes.io/name: frigate
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 150Gi
  # The bound PV; Flux owns this field. Drop it in a move PR or on a rebuilt cluster
  # (docs/runbooks/move-local-path-pvc.md).
  volumeName: pvc-740d1112-29b8-4bd9-aa6d-45f95d629573
