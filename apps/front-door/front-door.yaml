# https://kblab.me: one static page listing every system by group, on the web-kit shell.
# index.html is generated by scripts/gen-ha-launcher.py from the ingresses; the kit files
# are the dotfiles commit pinned in kit.lock, fetched and checked by fetch-kit.sh.
apiVersion: v1
kind: Service
metadata:
  name: front-door
  labels:
    app: front-door
spec:
  selector:
    app: front-door
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-door
  labels:
    app: front-door
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front-door
  template:
    metadata:
      labels:
        app: front-door
    spec:
      initContainers:
        - name: fetch-kit
          image: nginxinc/nginx-unprivileged:1.29-alpine
          command: ["sh", "/files/fetch-kit.sh", "/kit"]
          volumeMounts:
            - name: files
              mountPath: /files
            - name: kit
              mountPath: /kit
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: files
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: files
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: kit
              mountPath: /usr/share/nginx/html/kit
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: files
          configMap:
            name: front-door-files
        - name: kit
          emptyDir:
            sizeLimit: 1Mi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: front-door
  labels:
    app: front-door
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
    # Reachable off the LAN through the wildcard tunnel, like the HA redirect it replaces:
    # it lists names and links, and every site behind them keeps its own sign-in.
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: crowdsec-crowdsec-bouncer@kubernetescrd
    # The page is the list, not an entry on it; status.kblab.me watches the sites it links.
    homepage.kblab.me/launcher: "false"
    gatus.kblab.me/monitor: "false"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - kblab.me
      secretName: front-door-tls
  rules:
    - host: kblab.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: front-door
                port:
                  number: 80
