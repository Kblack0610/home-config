server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # The list changes with every regenerated ingress set, so never serve a stale one.
  location = / {
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }
  location /kit/ {
    try_files $uri =404;
  }
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
  location / {
    return 404;
  }
}
