apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-registry
  labels:
    app.kubernetes.io/name: game-registry
spec:
  replicas: 1
  # One writer at a time: the retention sweep and the SQLite import below assume it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: game-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: game-registry
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: forgejo-registry
      # Copies the v1.7.0 SQLite file into Postgres once; a marker row makes every later
      # start a no-op. Removed, with game-registry-data, once the import is verified.
      initContainers:
        - name: import-sqlite
          image: git.kblab.me/kblack0610/bnb-game-servers/registry:registry-v1.8.0
          args: ["import-sqlite", "/data/registry.db"]
          envFrom:
            - secretRef:
                name: game-registry-saves
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: registry
          image: git.kblab.me/kblack0610/bnb-game-servers/registry:registry-v1.8.0
          ports:
            - name: http
              containerPort: 8080
            # The admin site, routed only by ingress-admin.yaml (games.kblab.me/playground).
            - name: admin
              containerPort: 8081
            # Prometheus /metrics for the live fleet, scraped by servicemonitor.yaml. No
            # ingress names this port.
            - name: metrics
              containerPort: 9090
          env:
            - name: PORT
              value: "8080"
            # Postgres (DATABASE_URL), the game-saves bucket keys and ACCOUNT_PEPPER come
            # from saves-secret.sops.yaml (registry README, "Storage and the SQLite import").
            - name: S3_ENDPOINT
              value: minio.minio.svc.cluster.local:9000
            # Traefik sits in front, so the caller's address is in X-Forwarded-For.
            - name: TRUST_PROXY
              value: "1"
            - name: SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: game-registry-tokens
                  key: SERVER_TOKEN
            - name: HOST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: game-registry-tokens
                  key: HOST_TOKEN
            # The admin site: overrides, Forgejo sign-in, Save to repo (registry README,
            # "Overrides and the admin site"). Tokens and the OAuth app come from admin-secret.yaml.
            - name: ADMIN_PORT
              value: "8081"
            - name: ADMIN_BASE
              value: /playground
            - name: ADMIN_USERS
              value: kblack0610
            # The Fleet page's home servers: listed and scaled through zomboid-control
            # (apps/zomboid/control, servers.json), with its token copied into
            # control-token-secret.yaml.
            - name: CONTROL_API
              value: http://zomboid-control.zomboid.svc
            - name: CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: game-registry-control
                  key: CONTROL_TOKEN
            - name: METRICS_PORT
              value: "9090"
            # A session's graphs and logs on the Game fleet dashboard
            # (apps/monitoring/dashboards/game-fleet.json; panel 100 is the logs).
            - name: GRAFANA_URL
              value: https://grafana.kblab.me/d/kb-game-fleet/game-fleet?var-id={id}
            - name: LOGS_URL
              value: https://grafana.kblab.me/d/kb-game-fleet/game-fleet?var-id={id}&var-pod={pod}&viewPanel=100
            # Online games on Edgegap (registry README, "Online games"). EDGEGAP_TOKEN comes
            # from admin-secret.yaml; this caps how many run at once, since each one bills.
            - name: EDGEGAP_MAX
              value: "2"
            # The browser signs in on Forgejo's ROOT_URL host; the token and userinfo calls
            # are server-side, so they use the in-cluster service (as Grafana does).
            - name: OAUTH_AUTH_URL
              value: https://git.kennethblack.me/login/oauth/authorize
            - name: OAUTH_TOKEN_URL
              value: http://forgejo-http.forgejo.svc:3000/login/oauth/access_token
            - name: OAUTH_USERINFO_URL
              value: http://forgejo-http.forgejo.svc:3000/login/oauth/userinfo
            - name: OAUTH_REDIRECT_URL
              value: https://games.kblab.me/playground/auth/callback
          envFrom:
            - secretRef:
                name: game-registry-admin
            - secretRef:
                name: game-registry-saves
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              # A snapshot upload is held whole (up to 8 MiB, plus its gzip).
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: game-registry-data
