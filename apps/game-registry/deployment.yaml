apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-registry
  labels:
    app.kubernetes.io/name: game-registry
spec:
  replicas: 1
  # One SQLite file on a local-path volume: never two writers.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: game-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: game-registry
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: forgejo-registry
      containers:
        - name: registry
          image: git.kblab.me/kblack0610/bnb-game-servers/registry:registry-v1.6.0
          ports:
            - name: http
              containerPort: 8080
            # The admin site, routed only by ingress-admin.yaml (games.kblab.me/playground).
            - name: admin
              containerPort: 8081
          env:
            - name: PORT
              value: "8080"
            - name: DB_PATH
              value: /data/registry.db
            # Traefik sits in front, so the caller's address is in X-Forwarded-For.
            - name: TRUST_PROXY
              value: "1"
            - name: SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: game-registry-tokens
                  key: SERVER_TOKEN
            - name: HOST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: game-registry-tokens
                  key: HOST_TOKEN
            # The admin site: overrides, Forgejo sign-in, Save to repo (registry README,
            # "Overrides and the admin site"). Tokens and the OAuth app come from admin-secret.yaml.
            - name: ADMIN_PORT
              value: "8081"
            - name: ADMIN_BASE
              value: /playground
            - name: ADMIN_USERS
              value: kblack0610
            - name: SERVER_CONTROL_URL
              value: https://games.kblab.me/
            # Online games on Edgegap (registry README, "Online games"). EDGEGAP_TOKEN comes
            # from admin-secret.yaml; this caps how many run at once, since each one bills.
            - name: EDGEGAP_MAX
              value: "2"
            # The browser signs in on Forgejo's ROOT_URL host; the token and userinfo calls
            # are server-side, so they use the in-cluster service (as Grafana does).
            - name: OAUTH_AUTH_URL
              value: https://git.kennethblack.me/login/oauth/authorize
            - name: OAUTH_TOKEN_URL
              value: http://forgejo-http.forgejo.svc:3000/login/oauth/access_token
            - name: OAUTH_USERINFO_URL
              value: http://forgejo-http.forgejo.svc:3000/login/oauth/userinfo
            - name: OAUTH_REDIRECT_URL
              value: https://games.kblab.me/playground/auth/callback
          envFrom:
            - secretRef:
                name: game-registry-admin
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: game-registry-data
