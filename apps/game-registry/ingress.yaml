apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: game-registry
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-dns
    # LAN and tailnet only, like the game servers it lists.
    traefik.ingress.kubernetes.io/router.middlewares: monitoring-local-network-only@kubernetescrd
spec:
  rules:
    - host: games.kblab.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: game-registry
                port:
                  number: 8080
  tls:
    - hosts:
        - games.kblab.me
      secretName: game-registry-tls
