# Thinkpad (pc-laptop-cachy, 192.168.1.3)
# Secondary: game server 2 only. Registry lives on HP.
#
# Image pulled from Forgejo container registry at git.kblab.me.
#
# Usage: docker compose -f docker-compose.server2.yml pull && \
#        docker compose -f docker-compose.server2.yml up -d

services:
  game-server-2:
    image: git.kblab.me/kblack0610/bnb-game-servers/dodginballs-server:${SERVER_IMAGE_TAG:-latest}
    ports:
      - "7771:7771/udp"
    environment:
      REGISTRY_URL: "http://192.168.1.2:8080"
      SERVER_TOKEN: "${SERVER_TOKEN}"
      SERVER_NAME: "Home Thinkpad Server 2"
      SERVER_PORT: "7771"
      MAX_PLAYERS: "8"
      REGION: "home"
      SERVER_ADDRESS: "192.168.1.3"
    restart: unless-stopped
