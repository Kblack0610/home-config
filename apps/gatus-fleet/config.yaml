# fleet.kblab.me - THE MACHINES. Every device that is a computer, not a service.
#
# status.kblab.me answers "are my APPS up". This answers "are my MACHINES up",
# and it is the only surface that covers the work laptop - nothing can poll into
# a corporate-managed box, so it pushes outbound instead.
#
# TWO MECHANISMS, chosen by reachability, not by taste:
#   poll  - machines we can reach: already-exporting, always-on, on-LAN.
#   push  - machines we cannot reach: roaming, NAT'd, off-LAN, firewalled.
#
# NAMES MUST BE KEBAB-CASE. The status bars match $FLEET_ROSTER (a
# space-separated list) against the `name` field, so a name containing a space
# can never be rostered. Gatus itself derives key = <group>_<name>, lowercasing
# and mapping / _ , . and whitespace to '-'.
storage:
  type: sqlite
  path: /data/gatus.db

# Expose /metrics so Prometheus can scrape this and Grafana can render the real
# fleet view. This is the ONLY source that covers PUSHED machines - node_exporter
# gives depth for the polled ones (k3s nodes, Macs), but nothing scrapes the work
# laptop, because nothing can reach into it. Gatus is where its liveness exists
# at all.
#
# It also buys ordering: gatus sorts its own groups ALPHABETICALLY (android,
# homelab, iot, k3s, workplace) with no way to reorder, so "work at the top" is
# not expressible on this page. In Grafana, panel order is ours.
metrics: true

ui:
  title: KB Fleet
  header: KB Fleet - every machine

# --- PUSH: machines that report in, because nothing can reach them ---
# Gatus only materializes an external-endpoint once it receives that host's
# FIRST push. Until then it is absent from /api/v1/endpoints/statuses entirely -
# not stale, MISSING. That is why the bars count against $FLEET_ROSTER instead
# of against this list: a never-enrolled machine must show amber, not vanish.
external-endpoints:
  # The whole point of this instance. Corporate-managed, off-LAN, unpollable:
  # nothing can reach INTO these, so an outbound heartbeat is the only option.
  #
  # One key per physical machine, deliberately. The tempting shortcut is a
  # single `work` endpoint that whichever box is live pushes to - which is
  # exactly the bug the old `mac` endpoint had (two Macs, one key, each
  # masking the other's death). One employer today, but keep the per-machine
  # key shape: the second one comes back the next time there are two.
  #
  # `lazer-machine` (Deloitte VDI) removed 2026-08-17 - that contract ended, the
  # box is gone, and its last heartbeat was 2026-08-15. A retired machine left
  # declared here is worse than absent: it goes stale and pins the fleet glyph
  # amber forever, which is the same false-signal trap the iot Pi Zeros hit.
  - name: gp-mac         # Gigantic Playground
    group: workplace
    token: "${FLEET_TOKEN}"

  # Personal computers that roam or firewall inbound.
  - name: linux-cachyos
    group: homelab
    token: "${FLEET_TOKEN}"
  - name: windows
    group: homelab
    token: "${FLEET_TOKEN}"

  # Android tablets. They cannot run a cron curl, so apps/headwind-fleet-bridge
  # polls Headwind's devices table and pushes on their behalf. Key is
  # android_<device-number>; the bridge's FLEET_GROUP must match this group.
  - name: h0001        # Lenovo Tab M11 (TB330)
    group: android
    token: "${FLEET_TOKEN}"
  - name: h0002        # Lenovo Tab M11 (TB336)
    group: android
    token: "${FLEET_TOKEN}"
  - name: h0003        # Lenovo Tab M9 (TB305)
    group: android
    token: "${FLEET_TOKEN}"

  # Personal CARRY phones (Tier A - light touch, NOT Headwind). These push their
  # OWN heartbeat from Termux (fleet-pulse push.sh under Termux:Boot + cron), so
  # unlike h0001-h0003 they do NOT go through apps/headwind-fleet-bridge. A phone
  # sleeps (Android Doze pauses cron), so it is declared here to show on the board
  # with last-seen semantics but is deliberately kept OUT of FLEET_ROSTER on the
  # desktop status bars - rostering a sleeping device pins the glyph amber forever
  # (same reasoning as the removed iot Pi Zeros below). Onboard with
  # `termux-fleet-onboard` (dotfiles). Key is android_<name>.
  - name: ken-s25-main    # Galaxy S25 (daily driver) - Tier-A push heartbeat from Termux (not Headwind)
    group: android
    token: "${FLEET_TOKEN}"

# --- POLL: machines we can reach, already exporting, no agent to install ---
endpoints:
  # Macs: node_exporter via the node-exporter-mac ansible role (site.yml).
  # Deliberately poll-only - there are TWO Macs, so a single pushed `mac`
  # endpoint would have both writing the same key and each masking the other's
  # death.
  - name: mac-studio
    group: homelab
    url: "http://192.168.1.4:9100/metrics"
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  - name: mac-mini
    group: homelab
    url: "http://192.168.1.7:9100/metrics"
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  # k3s NODES. Nothing monitored these before: the `home-k3s` group on
  # status.kblab.me is 11 cluster-DNS SERVICE checks and never touches a node,
  # so "is pi5-worker2 alive" had no answer anywhere. node-exporter already
  # runs on every node with hostNetwork:true (kube-prometheus-stack subchart),
  # so this is pure config - no new agent, no ansible role.
  #
  # IPs come from `kubectl get nodes`, NOT infrastructure/dhcp/devices.yaml -
  # that file omits the Pi Zeros/Pi3/thinkcentre and disagrees with
  # ansible/inventory.yml about pi4-worker5 (.25 there vs .124 in reality).
  - name: pi5-master
    group: k3s
    url: "http://192.168.1.20:9100/metrics"
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  - name: pi5-worker1
    group: k3s
    url: "http://192.168.1.21:9100/metrics"
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  - name: pi5-worker2
    group: k3s
    url: "http://192.168.1.22:9100/metrics"
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  - name: pi5-worker3
    group: k3s
    url: "http://192.168.1.23:9100/metrics"
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  - name: pi4-worker4
    group: k3s
    url: "http://192.168.1.24:9100/metrics"
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  - name: pi4-worker5
    group: k3s
    url: "http://192.168.1.124:9100/metrics"
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  - name: asus-laptop
    group: k3s
    url: "http://192.168.1.152:9100/metrics"
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  - name: hp-victus
    group: k3s
    url: "http://192.168.1.243:9100/metrics"
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  # IoT (pi-zero-1/2/3, bespoke Rust pi-monitor on :9200) REMOVED for now: all
  # three are physically down, so they only rendered as three permanent red bars.
  # They were already excluded from $FLEET_ROSTER (they sleep by design, and
  # counting them would pin the glyph amber forever - mirroring
  # prometheus-rules-node-health.yaml, which excludes iot-pi-nodes from NodeDown
  # "to avoid false pages"), so removing them changes no health signal.
  #
  # To re-add when the Pi Zeros come back: an `endpoints:` entry each, group `iot`,
  # url http://192.168.1.8{0,1,2}:9200/metrics, interval 120s, [STATUS] == 200.
  # Prometheus still scrapes them independently via
  # apps/monitoring/external-iot-nodes.yaml - that is untouched.

