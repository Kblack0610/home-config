apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus-fleet
  namespace: gatus-fleet
  labels:
    app.kubernetes.io/name: gatus-fleet
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gatus-fleet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gatus-fleet
    spec:
      # Same pin as apps/gatus: the data hostPath lives on the NAS mount, which is
      # on asus-laptop. KNOWN LIMITATION: this instance therefore cannot report on
      # the health of the node it runs on - the same trap that let alertmanager be
      # evicted by the DiskPressure it was supposed to report. The backstop is the
      # status bars, which go RED when this API is unreachable at all.
      nodeSelector:
        kubernetes.io/hostname: asus-laptop
        storage.role/nas: "true"
      containers:
        - name: gatus
          image: twinproduction/gatus:v5.14.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # Shared bearer token for the push endpoints. Gatus substitutes
            # ${FLEET_TOKEN} in its config at load time.
            # FOLLOW-UP: one token authenticates every machine, so any holder can
            # forge any host's heartbeat. That is tolerable while the holders are
            # all machines we own; it stops being tolerable now that it also sits
            # on a corporate laptop and a VDI. Gatus supports a distinct token per
            # external-endpoint - move to per-device values.
            - name: FLEET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gatus-fleet-token
                  key: FLEET_TOKEN
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /config/config.yaml
              subPath: config.yaml
            - name: data
              mountPath: /data
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: gatus-fleet-config
        - name: data
          hostPath:
            path: /mnt/nas/private/gatus-fleet
            type: DirectoryOrCreate
        - name: localtime
          hostPath:
            path: /etc/localtime
