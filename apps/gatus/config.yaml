      - "[BODY].status == ok"

  - name: PlaceMyParents Web
    group: apps
    url: "http://placemyparents-web.placemyparents-preview.svc/"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 500"

  # --- placemyparents production (DigitalOcean, external) ---
  # The two endpoints above are the home-k3s PREVIEW deployment. Without these,
  # an outage of the real public site or API goes unnoticed here.
  - name: placemyparents.com (prod web)
    group: placemyparents-prod
    url: "https://placemyparents.com/api/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[CERTIFICATE_EXPIRATION] > 240h"
      - "[RESPONSE_TIME] < 3000"

  - name: api.placemyparents.com (prod API)
    group: placemyparents-prod
    url: "https://api.placemyparents.com/api/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[BODY].environment == production"
      - "[CERTIFICATE_EXPIRATION] > 240h"
      - "[RESPONSE_TIME] < 3000"

  - name: Forgejo Registry
    group: apps
    url: "http://forgejo-http.forgejo.svc:3000/v2/"
    interval: 120s
    conditions:
      - "[STATUS] < 500"

  # --- databases ---
  - name: PlaceMyParents DB
    group: databases
    url: "tcp://placemyparents-postgres.placemyparents-preview.svc:5432"
    interval: 120s
    conditions:
      - "[CONNECTED] == true"

  # --- monitoring ---
  - name: Grafana
    group: monitoring
    url: "http://kube-prometheus-stack-grafana.monitoring.svc:80/api/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  - name: Prometheus
    group: monitoring
    url: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/-/healthy"
    interval: 60s
