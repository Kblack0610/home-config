    interval: 60s
    client:
      insecure: true
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*Binks Chat*)"

  - name: binks.chat /api/health
    group: ingress
    url: "https://binks.chat/api/health"
    interval: 60s
    client:
      insecure: true
