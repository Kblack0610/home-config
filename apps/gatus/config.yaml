storage:
  type: sqlite
  path: /data/gatus.db

ui:
  title: KB Lab Status
  header: KB Lab Infrastructure
  # Gatus has no action surface - ui.buttons are plain hyperlinks and the dashboard is
  # read-only - so anything you press lives in Home Assistant. This is the hand-off.
  buttons:
    - name: "Game server controls"
      link: "https://hass.kblab.me/lovelace/ops"

# This instance is APPS. Machines live on fleet.kblab.me (apps/gatus-fleet/).
#
# The fleet / mac-machines / iot-fleet groups used to be here, which meant
# machine liveness was scattered across three groups on the apps dashboard.
# They now live on the machines instance, along with the k3s nodes and the work
# laptop + VDI that could never be represented here.
endpoints:
  # --- home-k3s services ---
  - name: Home Assistant
    group: home-k3s
    url: "http://home-assistant.home-assistant.svc:8123/"
    interval: 60s
    conditions:
      - "[STATUS] < 500"

  - name: LiteLLM
    group: home-k3s
    url: "http://litellm.ai-gateway.svc:4000/health/readiness"
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  - name: Headscale
    group: home-k3s
    url: "http://headscale.headscale.svc:8080/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  - name: Headscale UI
    group: home-k3s
    url: "http://headscale-ui.headscale.svc:80/"
    interval: 60s
    conditions:
      - "[STATUS] < 500"

  - name: Mosquitto
    group: home-k3s
    url: "tcp://mosquitto.mosquitto.svc:1883"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"

  - name: MQTT2Prom
    group: home-k3s
    url: "http://mqtt2prom.mqtt2prom.svc:9201/metrics"
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  - name: NAS (SMB)
    group: home-k3s
    url: "tcp://nas.nas.svc:445"
    interval: 120s
    conditions:
      - "[CONNECTED] == true"

  - name: CrowdSec LAPI
    group: home-k3s
    url: "http://crowdsec-service.crowdsec.svc:8080/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  - name: CrowdSec Bouncer
    group: home-k3s
    url: "http://crowdsec-bouncer.crowdsec.svc:8080/api/v1/ping"
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  - name: Immich
    group: home-k3s
    url: "http://immich-server.immich.svc/api/server/ping"
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  - name: Immich ML
    group: home-k3s
    url: "http://immich-ml.immich.svc:3003/ping"
    interval: 120s
    conditions:
      - "[STATUS] == 200"

  # Probes the CONTROL API, not the game server. The game server is scale-to-zero by
  # design, so monitoring it directly would alert every time nobody is playing - which
  # is most of the time, and is the correct state. What must always be up is the thing
  # that can WAKE it: if this is down, nobody can start a session.
  #
  # The game server's own up/down now shows in the game-servers group below, which is
  # readable-but-not-alertable for exactly the reason above.
  - name: Zomboid Control
    group: home-k3s
    url: "http://zomboid-control.zomboid.svc:80/healthz"
    interval: 120s
    conditions:
      - "[STATUS] == 200"

  # --- game servers ---
  # Read as "is it up right now", NOT as health. These are scale-to-zero, so a red dot
  # is the normal resting state ("nobody is playing") and uptime percentages here are
  # meaningless by construction - do not "fix" a low number. Nothing pages off this
  # group; there is no alerting block in this file.
  #
  # RCON is the probe because it only binds once the world has finished loading, so
  # CONNECTED means genuinely joinable rather than merely scheduled.
  - name: Zomboid
    group: game-servers
    url: "tcp://zomboid-rcon.zomboid.svc:27015"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"

