apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: github-runner-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: github-runner-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-runner-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: python:3.12-alpine
          command: ["python3", "/app/exporter.py"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # Fine-grained PAT, resource owner BlackNBrownStudios, read-only:
            # Organization > Self-hosted runners: Read, Repository > Actions: Read
            # (all repos). Minted by a human, then:
            #   kubectl create secret generic github-runner-exporter -n monitoring \
            #     --from-literal=github-token=<PAT> --dry-run=client -o yaml \
            #     > apps/github-runner-exporter/github-runner-exporter-secret.yaml
            #   sops --encrypt --in-place apps/github-runner-exporter/github-runner-exporter-secret.yaml
            # and uncomment it in kustomization.yaml. Optional so the pod runs
            # without it and the dashboard shows api_ok=0, not a crashloop.
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-runner-exporter
                  key: github-token
                  optional: true
            - name: RUNNER_SOURCES
              value: "repos/BlackNBrownStudios/platform orgs/BlackNBrownStudios"
            - name: RUN_REPOS
              value: "BlackNBrownStudios/platform BlackNBrownStudios/unity-core BlackNBrownStudios/unity-core-harness BlackNBrownStudios/unity-core-playground BlackNBrownStudios/dodginballs"
            # host:pool:slots. Mirrors ansible/inventory.yml (platform_ci_runners
            # pmp_*_slots, unity_ci_runners unity_ci_slots, the mac-mini runner).
            # Change a slot count there, change it here.
            - name: RUNNER_ROSTER
              value: "asus-laptop:pmp-light:3 asus-laptop:pmp-heavy:1 asus-laptop:unity:2 hp-victus:pmp-light:2 hp-victus:pmp-heavy:1 cachyos-x8664-main:unity:2 mac-mini:macos:1"
          ports:
            - name: metrics
              containerPort: 9320
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
          resources:
            requests:
              memory: "24Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: 9320
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 9320
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: script
          configMap:
            name: github-runner-exporter-script
---
apiVersion: v1
kind: Service
metadata:
  name: github-runner-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: github-runner-exporter
spec:
  selector:
    app.kubernetes.io/name: github-runner-exporter
  ports:
    - name: metrics
      port: 9320
      targetPort: 9320
  type: ClusterIP
---
# 60s, not 30s: every scrape is ~12 GitHub API calls (see exporter.py), and
# runner state does not change faster than a minute matters.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: github-runner-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: github-runner-exporter
spec:
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
  selector:
    matchLabels:
      app.kubernetes.io/name: github-runner-exporter
  namespaceSelector:
    matchNames:
      - monitoring
