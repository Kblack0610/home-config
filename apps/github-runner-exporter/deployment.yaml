# Its own account, bound to nothing: it reads only GitHub and Forgejo.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-runner-exporter
  namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: github-runner-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: github-runner-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-runner-exporter
    spec:
      serviceAccountName: github-runner-exporter
      affinity:
        # Off the CI workstations: the governor reads its runner list from
        # this exporter, so it must not go down with a hot CI host either.
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/workstation
                    operator: DoesNotExist
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: python:3.12-alpine
          command: ["python3", "/app/exporter.py"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # Fine-grained PAT, resource owner BlackNBrownStudios, all repos,
            # read-only: Organization > Self-hosted runners, Repository > Actions,
            # Repository > Administration (listing a REPO's runners needs it).
            # Minted by a human, then:
            #   kubectl create secret generic github-runner-exporter -n monitoring \
            #     --from-literal=github-token=<PAT> --dry-run=client -o yaml \
            #     > apps/github-runner-exporter/github-runner-exporter-secret.yaml
            #   sops --encrypt --in-place apps/github-runner-exporter/github-runner-exporter-secret.yaml
            # and uncomment it in kustomization.yaml. Optional so the pod runs
            # without it and the dashboard shows api_ok=0, not a crashloop.
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-runner-exporter
                  key: github-token
                  optional: true
            # The Kblack0610 repos' token: the Kblack0610 gh CLI OAuth token (scopes repo,
            # workflow), since the BlackNBrownStudios PAT cannot read Kblack0610's private
            # repos. exporter.py sends GITHUB_TOKEN_<OWNER> for that owner's repos.
            # Rotate: docs/credentials.md.
            - name: GITHUB_TOKEN_KBLACK0610
              valueFrom:
                secretKeyRef:
                  name: github-runner-exporter
                  key: github-token-kblack0610
                  optional: true
            # Org-scoped runners (the Unity pool). Repo-scoped runners are read
            # from every repo in RUN_REPOS and every repo a topology slot names.
            - name: RUNNER_ORGS
              value: "BlackNBrownStudios"
            - name: RUN_REPOS
              value: "BlackNBrownStudios/platform BlackNBrownStudios/unity-core BlackNBrownStudios/unity-core-harness BlackNBrownStudios/unity-core-playground"
            # Read only for the run feed schedules-sync writes its run ledger from (it polls
            # none of these itself): no runners, no metrics. Every personal GitHub repo with
            # CI, read with GITHUB_TOKEN_KBLACK0610.
            - name: FEED_REPOS
              value: "Kblack0610/.dotfiles Kblack0610/freqtrade_trading_attempt Kblack0610/android-suite Kblack0610/zmk_config Kblack0610/openmptcsetup Kblack0610/.dotfiles-private Kblack0610/ebay-lister Kblack0610/gungan-speak Kblack0610/playtest-bot"
            # Forgejo repos whose Actions jobs and tasks are read; the topology's
            # forgejo slots are the runners (pool="forgejo", forge="forgejo").
            - name: FORGEJO_REPOS
              value: "kblack0610/platform kblack0610/home-config kblack0610/bnb-game-servers kblack0610/personal-sites kblack0610/tilecast kblack0610/audio kblack0610/asset-library kblack0610/.notes"
            # Forgejo access token of kblack0610 (the admin), scopes read:repository
            # and read:admin: the jobs list is owner-only and the runner list is
            # admin-only. Minted with the admin CLI (docs/credentials.md), stored as
            # data key forgejo-token. Optional: without it every forgejo:* source
            # reads api_ok=0 and no Forgejo runner rows show.
            - name: FORGEJO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-runner-exporter
                  key: forgejo-token
                  optional: true
          ports:
            - name: metrics
              containerPort: 9320
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            # Every slot the inventory gives CI (apps/ci-topology): the expected
            # rows, so a slot whose runner never registered still shows as missing.
            - name: topology
              mountPath: /topology
              readOnly: true
          resources:
            # 34Mi in use before the /api/ci/details feed (2026-11-11). Its job records are
            # the window's ~2,400 runs, ~3 jobs each, across RUN_REPOS and FEED_REPOS:
            # filled, they grew a python:3.12-alpine process by 48Mi as step dicts and 30Mi
            # as the step blobs slim_job keeps now (2026-11-12). At 96Mi the pod was
            # OOMKilled every ~1.5-2h with the cache still filling, so the playground's
            # jobs were never read; a full cache is ~80Mi, and 128Mi leaves a run-list
            # refresh (10 pages of ~1.5 MB each, parsed at once) room above it.
            requests:
              memory: "64Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: 9320
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 9320
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: script
          configMap:
            name: github-runner-exporter-script
        - name: topology
          configMap:
            name: ci-topology
---
apiVersion: v1
kind: Service
metadata:
  name: github-runner-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: github-runner-exporter
spec:
  selector:
    app.kubernetes.io/name: github-runner-exporter
  ports:
    - name: metrics
      port: 9320
      targetPort: 9320
  type: ClusterIP
---
# 60s, not 30s: a scrape is ~30-50 GitHub API calls (runners per repo, active
# runs of RUN_REPOS and FEED_REPOS and their jobs), ~3000/h at most against the
# PAT's 5000/h. The 24h
# finished-run list adds ~60/h (re-read every 10 min) plus one call per newly
# finished run, and a cold start ~500 once, at most HISTORY_CALL_BUDGET (50) per
# scrape and none below HISTORY_FLOOR (1000) remaining. The 5000/h is per USER,
# shared with every gh session on the account and with ci-runner-governor:
# 2026-10-29 a local test run drained it, and this exporter and the governor
# both read nothing until the hourly reset. On a 403/429 at zero remaining the
# exporter stops calling that bucket (orgs/ and repos/ are charged apart)
# until GitHub's reset time.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: github-runner-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: github-runner-exporter
spec:
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
  selector:
    matchLabels:
      app.kubernetes.io/name: github-runner-exporter
  namespaceSelector:
    matchNames:
      - monitoring
