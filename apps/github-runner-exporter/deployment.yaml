# Its own account so apps/forgejo/runner-reader-rbac.yaml can let it read the
# Forgejo runner pods, their logs and the runner ConfigMap, and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-runner-exporter
  namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: github-runner-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: github-runner-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-runner-exporter
    spec:
      serviceAccountName: github-runner-exporter
      affinity:
        # Off the CI workstations: the governor reads its runner list from
        # this exporter, so it must not go down with a hot CI host either.
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/workstation
                    operator: DoesNotExist
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: python:3.12-alpine
          command: ["python3", "/app/exporter.py"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # Fine-grained PAT, resource owner BlackNBrownStudios, all repos,
            # read-only: Organization > Self-hosted runners, Repository > Actions,
            # Repository > Administration (listing a REPO's runners needs it).
            # Minted by a human, then:
            #   kubectl create secret generic github-runner-exporter -n monitoring \
            #     --from-literal=github-token=<PAT> --dry-run=client -o yaml \
            #     > apps/github-runner-exporter/github-runner-exporter-secret.yaml
            #   sops --encrypt --in-place apps/github-runner-exporter/github-runner-exporter-secret.yaml
            # and uncomment it in kustomization.yaml. Optional so the pod runs
            # without it and the dashboard shows api_ok=0, not a crashloop.
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-runner-exporter
                  key: github-token
                  optional: true
            # Org-scoped runners (the Unity pool). Repo-scoped runners are read
            # from every repo in RUN_REPOS.
            - name: RUNNER_ORGS
              value: "BlackNBrownStudios"
            - name: RUN_REPOS
              value: "BlackNBrownStudios/platform BlackNBrownStudios/unity-core BlackNBrownStudios/unity-core-harness BlackNBrownStudios/unity-core-playground BlackNBrownStudios/dodginballs"
            # host:pool:slots. Mirrors ansible/inventory.yml (linux_ci_runners
            # ci_*_slots, unity_ci_runners and unity_ci_mac_runners unity_ci_slots), the mac-mini's
            # two runners (mac-mini-mac, m1-playground-mac) and the opt-in windows-media test runner.
            # Change a slot count there, change it here.
            - name: RUNNER_ROSTER
              value: "asus-laptop:light:2 asus-laptop:heavy:1 hp-victus:light:2 hp-victus:heavy:1 razer-laptop:light:1 razer-laptop:heavy:1 razer-laptop:unity:1 cachyos-x8664-main:unity:2 aws-burst-1:unity:5 aws-burst-2:unity:6 aws-build-1:unity-build:3 mac-mini:macos:2 windows-media:windows:1"
            # Runner hosts off the home LAN, so the runner rows say site="cloud" and the
            # hover and board can count cloud vs local. Mirrors the inventory hosts with
            # unity_ci_lan: false; scripts/check-runner-roster.py fails if they drift.
            - name: CLOUD_HOSTS
              value: "aws-burst-1 aws-burst-2 aws-build-1"
            # Forgejo repos whose Actions jobs and tasks are read; the forgejo-runner
            # pods are the runners (pool="forgejo", forge="forgejo").
            - name: FORGEJO_REPOS
              value: "kblack0610/platform kblack0610/home-config kblack0610/bnb-game-servers kblack0610/personal-sites kblack0610/dodginballs"
            # Forgejo access token of kblack0610, scope read:repository only: the
            # jobs list is owner-only (Forgejo v14 api.go: reqOwner) and needs a
            # token even on a public repo. Minted by a human, then:
            #   sops apps/github-runner-exporter/github-runner-exporter-secret.yaml
            # and add a data key forgejo-token (base64). Optional: without it every
            # forgejo:repos/* source reads api_ok=0, and the runner rows still show.
            - name: FORGEJO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-runner-exporter
                  key: forgejo-token
                  optional: true
          ports:
            - name: metrics
              containerPort: 9320
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
          resources:
            # 34Mi in use before the /api/ci/details feed (2026-11-11), 50Mi with its job
            # records (each finished job's steps over the 24h window); its run records add
            # about 1 KB per run of the window, ~2 MB.
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "96Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: 9320
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 9320
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: script
          configMap:
            name: github-runner-exporter-script
---
apiVersion: v1
kind: Service
metadata:
  name: github-runner-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: github-runner-exporter
spec:
  selector:
    app.kubernetes.io/name: github-runner-exporter
  ports:
    - name: metrics
      port: 9320
      targetPort: 9320
  type: ClusterIP
---
# 60s, not 30s: a scrape is ~20-40 GitHub API calls (runners per repo, active
# runs and their jobs), ~2400/h at most against the PAT's 5000/h. The 24h
# finished-run list adds ~60/h (re-read every 10 min) plus one call per newly
# finished run, and a cold start ~500 once, at most HISTORY_CALL_BUDGET (50) per
# scrape and none below HISTORY_FLOOR (1000) remaining. The 5000/h is per USER,
# shared with every gh session on the account and with ci-runner-governor:
# 2026-10-29 a local test run drained it, and this exporter and the governor
# both read nothing until the hourly reset. On a 403/429 at zero remaining the
# exporter stops calling that bucket (orgs/ and repos/ are charged apart)
# until GitHub's reset time.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: github-runner-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: github-runner-exporter
spec:
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
  selector:
    matchLabels:
      app.kubernetes.io/name: github-runner-exporter
  namespaceSelector:
    matchNames:
      - monitoring
