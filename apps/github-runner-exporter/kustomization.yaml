apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Runs in monitoring: it reads only the GitHub API, so it owns no namespace of
# its own. Same configMapGenerator shape as apps/fleet-exporter: the hashed
# name means an exporter.py edit rolls the pod.
namespace: monitoring

configMapGenerator:
  - name: github-runner-exporter-script
    files:
      - exporter.py

resources:
  - deployment.yaml
  - feed-reader-rbac.yaml   # the account schedules-sync reads the feed with on every fleet worker
  - github-runner-exporter-secret.yaml   # github-token, github-token-kblack0610, forgejo-token: docs/credentials.md
