apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale
  namespace: headscale
  labels:
    app.kubernetes.io/name: headscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headscale
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headscale
    spec:
      initContainers:
        - name: init-keys
          image: busybox:1.38
          command:
            - sh
            - -c
            - |
              set -e
              # Write noise key with required 'privkey:' prefix
              echo "privkey:${HEADSCALE_NOISE_PRIVATE_KEY}" > /var/lib/headscale/noise_private.key
              chmod 600 /var/lib/headscale/noise_private.key
              echo "Noise key written to /var/lib/headscale/noise_private.key"
          env:
            - name: HEADSCALE_NOISE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: headscale-secrets
                  key: HEADSCALE_NOISE_PRIVATE_KEY
          volumeMounts:
            - name: data
              mountPath: /var/lib/headscale
      containers:
        - name: headscale
          image: headscale/headscale:0.23.0
          imagePullPolicy: IfNotPresent
          command:
            - headscale
            - serve
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 50443
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: stun
              containerPort: 3478
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/headscale
              readOnly: true
            - name: data
              mountPath: /var/lib/headscale
            - name: run
              mountPath: /var/run/headscale
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: false

        # Headscale UI sidecar (optional web admin interface)
        - name: headscale-ui
          image: ghcr.io/gurucomputing/headscale-ui:2024.02.24-beta1
          imagePullPolicy: IfNotPresent
          ports:
            - name: ui
              containerPort: 80
              protocol: TCP
          env:
            - name: HEADSCALE_URL
              value: "http://localhost:8080"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

      volumes:
        - name: config
          configMap:
            name: headscale-config
        - name: data
          persistentVolumeClaim:
            claimName: headscale-data
        - name: run
          emptyDir: {}

      securityContext:
        fsGroup: 1000
