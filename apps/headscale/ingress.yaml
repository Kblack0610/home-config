apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headscale
  namespace: headscale
  labels:
    app.kubernetes.io/name: headscale
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: ""
spec:
  tls:
    - hosts:
        - headscale.blackk.lan
      secretName: headscale-tls
  rules:
    - host: headscale.blackk.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headscale
                port:
                  number: 8080
---
# Ingress for Headscale UI (web admin interface)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headscale-ui
  namespace: headscale
  labels:
    app.kubernetes.io/name: headscale-ui
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
    - hosts:
        - headscale-ui.blackk.lan
      secretName: headscale-ui-tls
  rules:
    - host: headscale-ui.blackk.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headscale-ui
                port:
                  number: 80
