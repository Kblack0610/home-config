# Template for Headscale secrets
# Copy this file to secret.local.yaml and fill in real values
# DO NOT commit secret.local.yaml to git
apiVersion: v1
kind: Secret
metadata:
  name: headscale-secrets
  namespace: headscale
  labels:
    app.kubernetes.io/name: headscale
type: Opaque
stringData:
  # Generate with: openssl rand -hex 32
  HEADSCALE_NOISE_PRIVATE_KEY: "YOUR_NOISE_PRIVATE_KEY_HERE"
