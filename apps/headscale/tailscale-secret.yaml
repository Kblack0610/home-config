# Tailscale pre-auth key for subnet router
# Generate key: headscale preauthkeys create --user subnet-router --reusable --expiration 365d
# This file is encrypted by SOPS (matches .*secret.*\.yaml$ pattern)
apiVersion: v1
kind: Secret
metadata:
  name: tailscale-auth
  namespace: headscale
  labels:
    app.kubernetes.io/name: tailscale-subnet-router
type: Opaque
stringData:
  TS_AUTHKEY: "ROTATE-THIS-KEY-THEN-SOPS-ENCRYPT"
