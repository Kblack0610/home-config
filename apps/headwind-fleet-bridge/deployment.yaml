apiVersion: apps/v1
kind: Deployment
metadata:
  name: headwind-fleet-bridge
  namespace: headwind-mdm
  labels:
    app.kubernetes.io/name: headwind-fleet-bridge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: headwind-fleet-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headwind-fleet-bridge
    spec:
      containers:
        - name: bridge
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # psycopg is the only non-stdlib dep; install the musl binary wheel
              # once at startup (~a few MB). Mirrors notes-sync-bridge's apk add.
              pip install --no-cache-dir --quiet "psycopg[binary]"
              exec python /app/bridge.py
          env:
            - name: SQL_HOST
              value: postgres.databases.svc.cluster.local
            - name: SQL_PORT
              value: "5432"
            # Reuses the app's DB password (same namespace) - the bridge only
            # SELECTs the devices table.
            - name: SQL_PASS
              valueFrom:
                secretKeyRef:
                  name: headwind-mdm-secret
                  key: sql-pass
            - name: FLEET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: headwind-fleet-bridge-secret
                  key: fleet-token
            # The machines instance (fleet.kblab.me), NOT the apps one. Tablets are
            # machines; status.kblab.me is for services.
            - name: GATUS_URL
              value: "http://gatus-fleet.gatus-fleet.svc.cluster.local:8080"
            # Must match the tablets' group in apps/gatus-fleet/configmap.yaml -
            # gatus keys are <group>_<name>, so a mismatch is a silent 404.
            - name: FLEET_GROUP
              value: "android"
            - name: INTERVAL
              value: "60"          # < the readers' 180s window, so timestamps stay fresh
            - name: DEVICE_STALE_AFTER
              value: "900"         # device "up" if Headwind saw it < 15 min ago
            - name: DRY_RUN
              value: "false"
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
          resources:
            requests:
              memory: "48Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            # The loop touches /tmp/alive each pass; restart if it stalls > 3 min.
            exec:
              command:
                - /bin/sh
                - -c
                - "test $(( $(date +%s) - $(cat /tmp/alive 2>/dev/null || echo 0) )) -lt 180"
            initialDelaySeconds: 45
            periodSeconds: 60
            failureThreshold: 3
      volumes:
        - name: script
          configMap:
            name: headwind-fleet-bridge-script
