# k3s-specific Configuration for Home Assistant
# This file contains settings optimized for k3s clusters
#
# USAGE:
# helm install home-assistant pajikos/home-assistant \
#   --namespace home-assistant \
#   -f values.yaml \
#   -f k3s-values.yaml

# ============================================================================
# Storage Configuration for k3s
# ============================================================================
persistence:
  config:
    enabled: true
    # k3s comes with local-path-provisioner by default
    storageClass: "local-path"
    accessMode: ReadWriteOnce
    size: 10Gi

# ============================================================================
# Service Configuration - Use LoadBalancer with Traefik
# ============================================================================
# k3s includes Traefik by default, but you can also use its built-in
# ServiceLB (Klipper LoadBalancer) for LoadBalancer services

service:
  main:
    enabled: true
    type: LoadBalancer  # Uses k3s ServiceLB by default
    ports:
      http:
        port: 8123
    # Optional: Specify a specific IP (must be on your network)
    # loadBalancerIP: "192.168.1.100"

# ============================================================================
# Alternative: Use Traefik Ingress (k3s default)
# ============================================================================
# If you prefer to use Traefik (included in k3s), uncomment this:

# service:
#   main:
#     type: ClusterIP
#     ports:
#       http:
#         port: 8123

# ingress:
#   main:
#     enabled: true
#     className: traefik
#     annotations:
#       traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
#       # For automatic HTTPS redirect:
#       # traefik.ingress.kubernetes.io/router.middlewares: default-redirect-https@kubernetescrd
#     hosts:
#       - host: home.local  # <-- UPDATE or use IP like 192.168.1.10.nip.io
#         paths:
#           - path: /
#             pathType: Prefix

# ============================================================================
# Network CIDRs for k3s (Default values)
# ============================================================================
config:
  http:
    use_x_forwarded_for: true
    trusted_proxies:
      # k3s default pod CIDR
      - 10.42.0.0/16
      # k3s default service CIDR
      - 10.43.0.0/16
      # Your local network (if accessing from LAN)
      - 192.168.0.0/16

# ============================================================================
# Resource Limits - Adjusted for smaller home servers
# ============================================================================
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# ============================================================================
# k3s-specific Notes
# ============================================================================
#
# Storage:
# - k3s includes 'local-path-provisioner' which stores PVs in /var/lib/rancher/k3s/storage
# - Data persists on the node's local disk
# - If you have multiple nodes, consider using Longhorn for replicated storage
#
# Networking:
# - k3s includes Traefik v2 ingress controller by default
# - ServiceLB (Klipper-lb) provides LoadBalancer IPs using host ports
# - Default CNI is Flannel
#
# Accessing Home Assistant:
# Option 1: LoadBalancer (easiest)
#   - Service will get an IP from your LAN
#   - Access at http://<service-ip>:8123
#
# Option 2: Traefik Ingress
#   - Access at http://<node-ip> (Traefik routes by hostname)
#   - Set up DNS or use nip.io (e.g., home.192.168.1.10.nip.io)
#
# Option 3: NodePort
#   - Access at http://<any-node-ip>:30123
#
# ============================================================================
# Disabling Traefik (if you want to use NGINX or another ingress)
# ============================================================================
#
# To disable Traefik in k3s and use another ingress controller:
#
# 1. Edit k3s config (usually /etc/rancher/k3s/config.yaml):
#    disable:
#      - traefik
#
# 2. Restart k3s:
#    systemctl restart k3s
#
# 3. Install your preferred ingress controller:
#    helm install ingress-nginx ingress-nginx/ingress-nginx --namespace ingress-nginx --create-namespace
#
# ============================================================================
# Multi-node k3s Considerations
# ============================================================================
#
# If running k3s across multiple nodes:
#
# 1. Storage: Use Longhorn for replicated storage
#    helm repo add longhorn https://charts.longhorn.io
#    helm install longhorn longhorn/longhorn --namespace longhorn-system --create-namespace
#
# 2. USB Devices: Use nodeSelector to pin pod to node with USB stick
#    See usb-device-values.yaml for details
#
# 3. Database: Consider external database for HA (PostgreSQL/MariaDB)
#    config:
#      recorder:
#        db_url: "postgresql://user:password@postgres.default.svc.cluster.local/homeassistant"
