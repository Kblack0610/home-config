# USB Device Configuration for Home Assistant
# Use this configuration if you need to connect Zigbee, Z-Wave, or other USB devices
#
# PREREQUISITES:
# 1. Identify which node has the USB device plugged in
# 2. Label that node: kubectl label node <node-name> hardware.homeassistant=usb-devices
# 3. Find your device path: ls -la /dev/tty* or lsusb
#
# Common device paths:
# - Zigbee (Conbee/Sonoff): /dev/ttyACM0 or /dev/ttyUSB0
# - Z-Wave (Aeotec): /dev/ttyACM0 or /dev/serial/by-id/usb-*
# - Bluetooth: /dev/ttyAMA0
#
# USAGE:
# helm install home-assistant pajikos/home-assistant \
#   --namespace home-assistant \
#   -f values.yaml \
#   -f usb-device-values.yaml

# ============================================================================
# Node Selection - Force pod to run on node with USB device
# ============================================================================
nodeSelector:
  hardware.homeassistant: "usb-devices"  # Must match your node label

# ============================================================================
# Security Context - Required for hardware access
# ============================================================================
securityContext:
  privileged: true  # Required for USB device access

# Alternative (more restrictive, but may not work for all devices):
# securityContext:
#   capabilities:
#     add:
#       - SYS_ADMIN
#       - SYS_RAWIO

# ============================================================================
# Persistence - USB Device Mounts
# ============================================================================
persistence:
  # Config volume (merge with values.yaml or ensure it exists)
  config:
    enabled: true
    accessMode: ReadWriteOnce
    size: 10Gi

  # Zigbee USB stick (e.g., Conbee II, Sonoff Zigbee)
  zigbee-device:
    enabled: true
    type: hostPath
    hostPath: /dev/ttyACM0  # <-- UPDATE THIS to your device path
    mountPath: /dev/ttyACM0
    # For multiple Zigbee devices, use by-id:
    # hostPath: /dev/serial/by-id/usb-dresden_elektronik_ingenieurtechnik_GmbH_ConBee_II_DE2400000-if00
    # mountPath: /dev/serial/by-id/usb-dresden_elektronik_ingenieurtechnik_GmbH_ConBee_II_DE2400000-if00

  # Z-Wave USB stick (uncomment if needed)
  # zwave-device:
  #   enabled: true
  #   type: hostPath
  #   hostPath: /dev/ttyUSB0  # <-- UPDATE THIS
  #   mountPath: /dev/ttyUSB0

  # Bluetooth adapter (uncomment if needed)
  # bluetooth-device:
  #   enabled: true
  #   type: hostPath
  #   hostPath: /dev/ttyAMA0  # <-- UPDATE THIS
  #   mountPath: /dev/ttyAMA0

  # Optional: Mount entire USB bus (not recommended, but works for complex setups)
  # usb-bus:
  #   enabled: true
  #   type: hostPath
  #   hostPath: /dev/bus/usb
  #   mountPath: /dev/bus/usb

# ============================================================================
# Additional Configuration for USB Devices
# ============================================================================

# Environment variables that may be needed for specific integrations
env:
  TZ: "America/Chicago"  # <-- UPDATE THIS
  # Uncomment if using specific integrations:
  # ZWAVEJS_DEVICE_PATH: "/dev/ttyUSB0"
  # ZIGBEE_DEVICE: "/dev/ttyACM0"

# ============================================================================
# Finding Your Device Path
# ============================================================================
#
# To find your device, SSH to the node and run:
#
# 1. List all USB devices:
#    lsusb
#
# 2. List all serial devices:
#    ls -la /dev/tty*
#
# 3. Find devices by ID (RECOMMENDED - survives reboots):
#    ls -la /dev/serial/by-id/
#
# 4. Monitor device addition (plug/unplug device while running):
#    dmesg -w
#
# ============================================================================
# Device Permissions
# ============================================================================
#
# If you get permission errors, you may need to adjust permissions on the host:
#
# Option 1: Add permissions temporarily (lost on reboot):
#   chmod 666 /dev/ttyACM0
#
# Option 2: Add udev rule (permanent):
#   Create /etc/udev/rules.d/99-usb-serial.rules with:
#   KERNEL=="ttyACM0", MODE="0666"
#
#   Then reload: udevadm control --reload-rules && udevadm trigger
#
# ============================================================================
# Troubleshooting
# ============================================================================
#
# 1. Check if device is visible in pod:
#    kubectl exec -it -n home-assistant <pod-name> -- ls -la /dev/tty*
#
# 2. Check pod is on correct node:
#    kubectl get pod -n home-assistant -o wide
#
# 3. Check node label:
#    kubectl get nodes --show-labels | grep homeassistant
#
# 4. If pod won't schedule:
#    kubectl describe pod -n home-assistant <pod-name>
#    Look for "node selector" errors
#
# 5. Test device access:
#    kubectl exec -it -n home-assistant <pod-name> -- cat /dev/ttyACM0
#    (You should see garbage output if device is accessible)
