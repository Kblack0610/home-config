# Home Assistant Helm Chart Values
# Using the pajikos/home-assistant chart
# Repository: https://github.com/pajikos/home-assistant-helm-chart

# ============================================================================
# Controller Configuration
# ============================================================================
controller:
  # Use statefulset for stable network identity and persistent storage
  type: statefulset

# ============================================================================
# Image Configuration
# ============================================================================
image:
  repository: ghcr.io/home-assistant/home-assistant
  pullPolicy: IfNotPresent
  # Pin to a specific version for stability (optional)
  # tag: "2024.11.0"

# ============================================================================
# Environment Variables
# ============================================================================
env:
  # CRITICAL: Set your timezone
  TZ: "America/Chicago"  # <-- UPDATE THIS to your timezone

# ============================================================================
# Service Configuration
# Choose ONE method to expose Home Assistant
# ============================================================================
service:
  main:
    enabled: true
    # Option 1: LoadBalancer (easiest for local cluster with MetalLB)
    type: LoadBalancer
    ports:
      http:
        port: 8123

    # Option 2: NodePort (access via node IP:port)
    # type: NodePort
    # ports:
    #   http:
    #     port: 8123
    #     nodePort: 30123  # Choose any port 30000-32767

    # Option 3: ClusterIP (use with Ingress below)
    # type: ClusterIP
    # ports:
    #   http:
    #     port: 8123

# ============================================================================
# Ingress Configuration (Recommended for production)
# ============================================================================
ingress:
  main:
    enabled: false  # Set to true if using Ingress
    # annotations:
    #   cert-manager.io/cluster-issuer: "letsencrypt-prod"
    #   nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    # className: nginx  # or traefik, etc.
    # hosts:
    #   - host: home.example.com  # <-- UPDATE THIS
    #     paths:
    #       - path: /
    #         pathType: Prefix
    # tls:
    #   - secretName: home-assistant-tls
    #     hosts:
    #       - home.example.com

# ============================================================================
# Persistence Configuration (CRITICAL)
# ============================================================================
persistence:
  config:
    enabled: true
    # storageClass: "local-path"  # Specify if not using default
    accessMode: ReadWriteOnce
    size: 10Gi
    # To use an existing PVC instead of creating a new one:
    # existingClaim: "home-assistant-config-pvc"

  # Uncomment if you need access to USB devices (Zigbee/Z-Wave)
  # See usb-device-values.yaml for full USB configuration
  # usb:
  #   enabled: true
  #   type: hostPath
  #   hostPath: /dev/ttyACM0  # <-- UPDATE to your device path
  #   mountPath: /dev/ttyACM0

# ============================================================================
# Security Context
# ============================================================================
securityContext:
  # Required if mounting USB devices
  # privileged: true

  # Standard security (recommended if not using USB devices)
  # capabilities:
  #   add:
  #     - NET_ADMIN
  #     - NET_RAW

# ============================================================================
# Node Selector (For USB Devices)
# ============================================================================
# If you have USB devices (Zigbee/Z-Wave) plugged into a specific node,
# you must pin the pod to that node. First label your node:
# kubectl label node <node-name> hardware.homeassistant=usb-devices
#
# nodeSelector:
#   hardware.homeassistant: "usb-devices"

# ============================================================================
# Resources
# ============================================================================
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

# ============================================================================
# Probes
# ============================================================================
probes:
  liveness:
    enabled: true
    custom: true
    spec:
      httpGet:
        path: /
        port: 8123
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 5

  readiness:
    enabled: true
    custom: true
    spec:
      httpGet:
        path: /
        port: 8123
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

# ============================================================================
# Home Assistant Configuration
# ============================================================================
# You can inject configuration.yaml content here, or manage it
# through the UI after initial setup
# config:
#   homeassistant:
#     name: "My Home"
#     latitude: 0.0
#     longitude: 0.0
#     elevation: 0
#     unit_system: metric
#     time_zone: "America/Chicago"
#     currency: USD
#     country: US
#
#   http:
#     use_x_forwarded_for: true
#     trusted_proxies:
#       # Add your cluster's Pod CIDR
#       - 10.42.0.0/16  # <-- UPDATE to your cluster's pod network
#       # Add your cluster's Service CIDR
#       - 10.43.0.0/16  # <-- UPDATE to your cluster's service network
#       # Add your ingress controller IP if using one
#       # - 192.168.1.100/32
