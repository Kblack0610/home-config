apiVersion: batch/v1
kind: CronJob
metadata:
  name: home-assistant-backup
  namespace: home-assistant
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # One retry, not the default six: each attempt writes a 500 MB archive
      # to pi5-master's SD card.
      backoffLimit: 1
      # Forbid would let one hung run skip every later night.
      activeDeadlineSeconds: 3600
      template:
        spec:
          containers:
            - name: backup
              image: alpine:3.24.1
              env:
                - name: NAS_SMB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backup-nas-credentials
                      key: smb-password
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  apk add --no-cache tar gzip samba-client sqlite >/dev/null

                  # Config has been a quarter of a GB for months. 1MB is a floor
                  # low enough never to false-trip and high enough to catch an
                  # unmounted PVC.
                  MIN_BYTES=1048576
                  SMB="//nas.nas.svc.cluster.local/private"
                  DEST="backups/home-k3s/home-assistant"

                  log() { echo "[$(date -Iseconds)] $*"; }

                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  BACKUP_FILE="home-assistant-${TIMESTAMP}.tar.gz"

                  # Keep 7 here, not the 30 the other jobs keep: this hostPath is on
                  # pi5-master's 29G SD card, and 30 archives of 300-420 MB each
                  # (9.7G) tripped NodeDiskLow on 2026-11-10. The NAS keeps the
                  # longer history. Rotate to 6 before writing the 7th, so a full
                  # disk frees room instead of failing ahead of the rotation.
                  ls -t /backup/home-assistant-*.tar.gz 2>/dev/null | tail -n +7 | xargs -r rm

                  # Write under .partial and rename only once the archive passes,
                  # so a failed attempt leaves nothing behind. On 2026-11-13/14
                  # every retry left a 500 MB archive (21 files, 8.7G).
                  rm -f /backup/*.partial
                  PART="/backup/${BACKUP_FILE}.partial"
                  trap 'rm -f "${PART}"' EXIT

                  # home-assistant_v2.db is the live recorder DB (1.4G). tar of the
                  # live file exits 1 ("file changed as we read it"), so copy it
                  # with VACUUM INTO, one read transaction that HA's writes do not
                  # restart (.backup does), and archive that copy in its place.
                  # The log is excluded for the same reason.
                  # /snap is an emptyDir, which outlives a container restart.
                  # The copy is added without the ./ prefix, so the excludes for
                  # the live files do not match it.
                  rm -f /snap/home-assistant_v2.db
                  SNAP=""
                  if [ -f /data/home-assistant_v2.db ]; then
                    sqlite3 -cmd '.timeout 60000' /data/home-assistant_v2.db "VACUUM INTO '/snap/home-assistant_v2.db'"
                    SNAP="-C /snap home-assistant_v2.db"
                  else
                    log "WARN: /data/home-assistant_v2.db is missing; archiving the config without the recorder DB."
                  fi
                  tar -czf "${PART}" \
                    --exclude=./home-assistant_v2.db --exclude=./home-assistant_v2.db-wal \
                    --exclude=./home-assistant_v2.db-shm --exclude='./home-assistant.log*' \
                    -C /data . ${SNAP}
                  rm -f /snap/home-assistant_v2.db
                  gzip -t "${PART}"
                  size="$(wc -c < "${PART}")"
                  log "created ${BACKUP_FILE} (${size} bytes)"
                  # Writing a tiny "successful" archive and then rotating the good
                  # ones out behind it is the failure mode that hides for
                  # weeks. Refuse instead.
                  if [ "${size}" -lt "${MIN_BYTES}" ]; then
                    log "ERROR: archive under ${MIN_BYTES} bytes is implausible - is the PVC mounted? Not uploading."
                    exit 1
                  fi
                  mv "${PART}" "/backup/${BACKUP_FILE}"
                  log "local backup complete: ${BACKUP_FILE}"

                  # Off-box copy. Best-effort by design (docs/backup-runbook.md):
                  # the local copy is the success condition, so this warns and
                  # exits 0. smbclient -c does not exit non-zero when a command
                  # inside it fails, so every call must be checked for NT_STATUS_.
                  # Why, and the identical copies that move with this one:
                  # apps/zomboid/backup/backup.sh.
                  smb() {
                    _out="$(smbclient "${SMB}" -U "nas%${NAS_SMB_PASSWORD}" -c "$1" 2>&1)"
                    _bad="$(echo "${_out}" | grep -o 'NT_STATUS_[A-Z_]*' | grep -v 'NT_STATUS_OBJECT_NAME_COLLISION' || true)"
                    if [ -n "${_bad}" ]; then
                      log "ERROR: smbclient '$1' failed: ${_bad}"
                      return 1
                    fi
                    echo "${_out}"
                  }

                  nas_copy() {
                    # mkdir does not create parents, so walk the path a component
                    # at a time. An existing component reports OBJECT_NAME_COLLISION,
                    # which smb() treats as fine.
                    _path=""
                    for _part in $(echo "${DEST}" | tr '/' ' '); do
                      _path="${_path:+${_path}/}${_part}"
                      smb "mkdir ${_path}" >/dev/null || return 1
                    done
                    smb "cd ${DEST}; put /backup/${BACKUP_FILE} ${BACKUP_FILE}" >/dev/null || return 1
                    # Confirm it landed in the RIGHT directory at the RIGHT size.
                    remote_size="$(smb "cd ${DEST}; ls ${BACKUP_FILE}" | awk -v f="${BACKUP_FILE}" '$1==f {print $3}')"
                    if [ -z "${remote_size}" ]; then
                      log "ERROR: ${BACKUP_FILE} is not on the share after upload."
                      return 1
                    fi
                    if [ "${remote_size}" != "${size}" ]; then
                      log "ERROR: size mismatch - local ${size}, remote ${remote_size}."
                      return 1
                    fi
                    log "verified on the share: ${remote_size} bytes"
                  }

                  if nas_copy; then
                    log "NAS copy OK: ${BACKUP_FILE}"
                  else
                    log "WARN: off-box copy failed. The local copy on this node is good, but the OFF-BOX copy is missing."
                  fi
              volumeMounts:
                # Read-write so sqlite can open the WAL index (-shm) beside the
                # live DB for VACUUM INTO; it only reads the data. Read-only
                # fails whenever HA is not holding the DB open.
                - name: data
                  mountPath: /data
                - name: backup
                  mountPath: /backup
                - name: snap
                  mountPath: /snap
          restartPolicy: OnFailure
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: home-assistant-config
            - name: backup
              hostPath:
                path: /var/backups/home-assistant
                type: DirectoryOrCreate
            - name: snap
              emptyDir:
                sizeLimit: 4Gi
