default_config:

homeassistant:
  packages: !include_dir_named packages

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 10.42.0.0/16
    - 10.43.0.0/16
    - 192.168.1.0/24

lovelace:
  mode: yaml
  # YAML mode hides the UI Resources registry, so vendored custom cards MUST be
  # declared directly here. Files are downloaded by the `install-lovelace-cards`
  # init container into /config/www/community → served by HA at /local/community.
  resources:
    - url: /local/community/mushroom/mushroom.js
      type: module
    - url: /local/community/button-card/button-card.js
      type: module
    - url: /local/community/bubble-card/bubble-card.js
      type: module
    - url: /local/community/auto-entities/auto-entities.js
      type: module
    - url: /local/community/mini-graph-card/mini-graph-card-bundle.js
      type: module
    - url: /local/community/kiosk-mode/kiosk-mode.js
      type: module
    # Nest-Hub photo layer (Phase 1.5): rotating-photo screensaver + clock/weather hero.
    - url: /local/community/wallpanel/wallpanel.js?v=4.65.1
      type: module
    - url: /local/community/clock-weather-card/clock-weather-card.js?v=2.9.3
      type: module
  # Second YAML dashboard (the default "Homelab" stays at /lovelace). The key
  # must contain a hyphen. Reached at /wall-panels; the wall tablets load this.
  dashboards:
    wall-panels:
      mode: yaml
      filename: dashboards/wall.yaml
      title: Wall
      icon: mdi:tablet-dashboard
      show_in_sidebar: true

# card-mod must load as a frontend module (not just a Lovelace resource) so it
# also styles more-info dialogs. Merges with the frontend from default_config.
frontend:
  extra_module_url:
    - /local/community/card-mod/card-mod.js

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# pyscript backs the wall-panel plug-settings editor: its app at
# /config/pyscript/plug_settings.py registers non-admin-callable services that
# write the HA registries (area / name / icon / labels) and toggle switch_as_x,
# so any kiosk user can configure a plug. hass_is_global + allow_all_imports let
# the app import HA's registry helpers. Safe on this LAN/Tailscale-only instance.
pyscript:
  allow_all_imports: true
  hass_is_global: true

logger:
  default: warning
  logs:
    homeassistant.components.rest: warning
