# Home Assistant Configuration
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# Automation, scripts, scenes
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# ============================================
# K3S CLUSTER MONITORING
# ============================================
# Sensors for cluster nodes (CPU, RAM, Disk)
sensor cluster_nodes: !include sensors_cluster.yaml

# Sensors for individual pods/containers
sensor pods: !include sensors_pods.yaml

# ============================================
# LOGGING (Optional - reduce verbosity)
# ============================================
logger:
  default: warning
  logs:
    homeassistant.components.rest: warning
