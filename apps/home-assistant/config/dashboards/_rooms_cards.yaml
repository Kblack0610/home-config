# Shared ROOM LAYOUT — the home view, grouped by room.
#
# Included as the `cards:` of one grid section on BOTH the Overview (home) view
# and the wall Home view, so the room layout lives in ONE place. Each room is a
# heading + an auto-entities grid filtered by the room's HA AREA, so it is driven
# entirely by the area metadata (pyscript/room_layout.yaml): assign a device to a
# room in the wall Settings view and it appears here automatically — no dashboard
# edit needed.
#
# tap_action is only toggle / more-info here, never `navigate`: the Overview
# dashboard uses /lovelace/* paths and the wall uses /wall-panels/*, so a shared
# file can't hard-code a navigation path. Full per-device detail pages stay on
# the Devices tab.

- type: heading
  heading: Office
  icon: mdi:briefcase

- type: custom:auto-entities
  show_empty: false
  card_param: cards
  card: { type: grid, columns: 2, square: false }
  filter:
    include:
      - entity_id: switch.*plug*
        area: Office
        options: &plug_tile
          type: custom:mushroom-template-card
          primary: "{{ state_attr(entity, 'friendly_name') or entity }}"
          secondary: "{{ 'On' if is_state(entity, 'on') else 'Off' }}"
          icon: "{{ state_attr(entity, 'icon') or 'mdi:power-plug' }}"
          icon_color: "{{ 'amber' if is_state(entity, 'on') else 'disabled' }}"
          tap_action: { action: toggle }
  sort: { method: friendly_name }

- type: heading
  heading: Bedroom
  icon: mdi:bed
- type: custom:auto-entities
  show_empty: false
  card_param: cards
  card: { type: grid, columns: 2, square: false }
  filter:
    include:
      - { entity_id: switch.*plug*, area: Bedroom, options: *plug_tile }
  sort: { method: friendly_name }

- type: heading
  heading: Kitchen
  icon: mdi:fridge-outline
- type: custom:auto-entities
  show_empty: false
  card_param: cards
  card: { type: grid, columns: 2, square: false }
  filter:
    include:
      - { entity_id: switch.*plug*, area: Kitchen, options: *plug_tile }
  sort: { method: friendly_name }

- type: heading
  heading: Living Room
  icon: mdi:sofa
- type: custom:auto-entities
  show_empty: false
  card_param: cards
  card: { type: grid, columns: 2, square: false }
  filter:
    include:
      # Plugs / switches assigned to the Living Room (toggle).
      - { entity_id: switch.*plug*, area: Living Room, options: *plug_tile }
      # Robot vacuum — status + battery, tap opens its controls (more-info).
      - entity_id: vacuum.*
        area: Living Room
        options:
          type: custom:mushroom-template-card
          primary: Robot Vacuum
          secondary: >-
            {{ states('sensor.tapovacuummop_status') }} ·
            {{ states('sensor.tapovacuummop_battery') }}%
          icon: mdi:robot-vacuum
          icon_color: >-
            {{ 'red' if states('sensor.tapovacuummop_error') not in ['Ok','unknown','unavailable']
               else 'green' if is_state('vacuum.tapovacuummop','docked') else 'blue' }}
          tap_action: { action: more-info }
      # Litter box — status + today's count (more-info).
      - entity_id: sensor.cat_litter_box_status
        area: Living Room
        options:
          type: custom:mushroom-template-card
          primary: Litter Box
          secondary: >-
            {{ states('sensor.cat_litter_box_status') }} ·
            {{ states('sensor.cat_litter_box_excretions_per_day') }} today
          icon: mdi:cat
          icon_color: "{{ 'orange' if is_state('sensor.cat_litter_box_status','Cat_into') else 'blue' }}"
          tap_action: { action: more-info }
  sort: { method: friendly_name }
