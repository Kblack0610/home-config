# Tap-to-talk: wakes THIS tablet's voice satellite as if "binks" was heard.
# Shared by the Home view and the screensaver column in wall.yaml.
#
# The dashboard is one file for every tablet, so the room comes from the
# browser: the voice_satellite card remembers which assist_satellite this
# browser is bound to in localStorage ("vs-satellite-entity", falling back to
# "vs-panel-config".satellite_entity, the same lookup the card itself does).
# A browser with no room assigned (Admin -> Voice Room) gets no button.
# Big icon over one word, the same shape as the screensaver's Dashboard button.
type: custom:button-card
name: Talk
icon: mdi:microphone
layout: vertical
variables:
  satellite: |
    [[[
      let id = null;
      try { id = localStorage.getItem('vs-satellite-entity'); } catch (e) {}
      if (!id) {
        try { id = (JSON.parse(localStorage.getItem('vs-panel-config') || '{}')).satellite_entity || null; } catch (e) {}
      }
      return id && states[id] ? id : '';
    ]]]
tap_action:
  action: perform-action
  perform_action: voice_satellite.wake
  target:
    entity_id: "[[[ return variables.satellite; ]]]"
  haptic: medium
styles:
  card:
    - display: "[[[ return variables.satellite ? 'block' : 'none'; ]]]"
    - height: 130px
    - padding: 16px
    - border-radius: 18px
    - background: rgba(var(--rgb-card-background-color, 255, 255, 255), 0.72)
    - backdrop-filter: blur(6px)
    - box-shadow: none
  icon:
    - width: 64px
    - color: '#2196f3'
  name:
    - font-size: 18px
    - font-weight: 500
