# Device detail subview — Fumoi litter box (LocalTuya). subview:true → hidden
# from the tab bar, reached from the Devices hub. Entities seeded by the
# seed-localtuya init container (see docs/smart-home-control.md). DP labels are
# from the Tuya cloud spec + a live button-by-button correlation (2026-07-03):
# DP9 = Clean, DP102/107 = light colour/brightness, DP110 = real Status. There
# is no power DP (the unit just plugs in) and DP108 work_state was static noise.
title: Litter Box
path: device-litterbox
icon: mdi:cat
subview: true
type: sections
max_columns: 3
sections:
  - type: grid
    cards:
      - type: heading
        heading: Controls
        icon: mdi:cat
      - type: tile
        entity: button.cat_litter_box_clean
        name: Clean
      - type: tile
        entity: button.cat_litter_box_start
        name: Start
      - type: tile
        entity: switch.cat_litter_box_auto_clean
        name: Auto Clean
      - type: tile
        entity: select.cat_litter_box_mode
        name: Mode
      - type: tile
        entity: number.cat_litter_box_clean_delay
        name: Clean Delay
        features:
          - type: numeric-input
            style: buttons

  - type: grid
    cards:
      - type: heading
        heading: Light
        icon: mdi:lightbulb
      - type: tile
        entity: select.cat_litter_box_light_color
        name: Color
      - type: tile
        entity: number.cat_litter_box_light_brightness
        name: Brightness
        features:
          - type: numeric-input
            style: buttons

  - type: grid
    cards:
      - type: heading
        heading: Status
        icon: mdi:information-outline
      - type: tile
        entity: sensor.cat_litter_box_status
        name: Status
      - type: tile
        entity: sensor.cat_litter_box_trigger_source
        name: Trigger Source
      - type: tile
        entity: sensor.cat_litter_box_use_time
        name: Use Time

  - type: grid
    cards:
      - type: heading
        heading: Cat Metrics
        icon: mdi:cat
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.cat_litter_box_cat_weight
            name: Cat Weight (raw ×0.1)
          - entity: sensor.cat_litter_box_excretions_per_day
            name: Excretions / Day
          - entity: sensor.cat_litter_box_excretion_time_daily
            name: Excretion Time (Daily)
