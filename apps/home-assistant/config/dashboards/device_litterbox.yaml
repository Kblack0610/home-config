# Device detail subview — Fumoi litter box (LocalTuya). subview:true → hidden
# from the tab bar, reached from the Devices hub. Entities seeded by the
# seed-localtuya init container (see docs/smart-home-control.md). DP labels are
# authoritative from the Tuya cloud device spec (cat_weight / excretion_* /
# manual_clean / work_state), not the earlier provisional guesses.
title: Litter Box
path: device-litterbox
icon: mdi:cat
subview: true
type: sections
max_columns: 3
sections:
  - type: grid
    cards:
      - type: heading
        heading: Litter Box
        icon: mdi:cat
      - type: tile
        entity: switch.cat_litter_box_power
        name: Power
      - type: tile
        entity: switch.cat_litter_box_auto_clean
        name: Auto Clean
      - type: tile
        entity: button.cat_litter_box_start_clean
        name: Start Clean
      - type: tile
        entity: button.cat_litter_box_manual_clean
        name: Manual Clean
      - type: tile
        entity: select.cat_litter_box_mode
        name: Mode
      - type: tile
        entity: number.cat_litter_box_clean_delay
        name: Clean Delay
        features:
          - type: numeric-input
            style: buttons

  - type: grid
    cards:
      - type: heading
        heading: Status
        icon: mdi:information-outline
      - type: tile
        entity: sensor.cat_litter_box_status
        name: Status
      - type: tile
        entity: sensor.cat_litter_box_work_state
        name: Work State
      - type: tile
        entity: sensor.cat_litter_box_use_time
        name: Use Time

  - type: grid
    cards:
      - type: heading
        heading: Cat Metrics
        icon: mdi:cat
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.cat_litter_box_cat_weight
            name: Cat Weight (raw ×0.1)
          - entity: sensor.cat_litter_box_excretions_per_day
            name: Excretions / Day
          - entity: sensor.cat_litter_box_excretion_time_daily
            name: Excretion Time (Daily)
