# Device detail subview — Speakers / Cast (mDNS-discovered media players + TTS).
# subview:true → hidden from the tab bar, reached from the Devices hub. Migrated
# from the old voice.yaml tab; the media-player list now auto-populates.
title: Speakers
path: device-speakers
icon: mdi:cast-audio-variant
subview: true
type: sections
max_columns: 3
sections:
  - type: grid
    cards:
      - type: heading
        heading: Cast Devices
        icon: mdi:cast-audio
      # Auto-populates as Nest Hub / Mini / Audio / Chromecast appear on the LAN.
      - type: custom:auto-entities
        show_empty: false
        card:
          type: entities
          title: Media players
          state_color: true
        filter:
          include:
            - domain: media_player
        sort:
          method: friendly_name

  - type: grid
    cards:
      - type: heading
        heading: Quick Announce
        icon: mdi:bullhorn
      - type: entities
        show_header_toggle: false
        entities:
          - entity: input_text.voice_announce_message
          - entity: input_select.voice_announce_language
      - type: button
        name: Announce to all cast devices
        icon: mdi:bullhorn-variant
        tap_action:
          action: call-service
          service: script.tts_announce_all_cast
          data:
            message: "{{ states('input_text.voice_announce_message') }}"
            language: "{{ states('input_select.voice_announce_language') }}"

  - type: grid
    cards:
      - type: heading
        heading: Test
        icon: mdi:test-tube
      - type: markdown
        content: >
          From **Developer Tools → Services**, call `script.tts_announce`
          with `target: media_player.<your_device>` and
          `message: "hello world"` to confirm a specific device works.
