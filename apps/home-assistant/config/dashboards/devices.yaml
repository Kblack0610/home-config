# Devices hub — the main/first tab. A grid of standardized device summary cards
# (mushroom-template-card: icon + name + state line + state-colored icon), each
# tapping through to its detail subview (device_<slug>.yaml, subview: true).
# Add a card here for each new device; the detail file is shared with the wall
# dashboard via !include. Nav paths are dashboard-absolute (/lovelace/…), so the
# wall dashboard keeps its own thin hub pointing at /wall-panels/… .
title: Devices
path: devices
icon: mdi:devices
type: sections
max_columns: 3
sections:
  - type: grid
    cards:
      - type: heading
        heading: Devices
        icon: mdi:devices

      - type: custom:mushroom-template-card
        primary: Robot Vacuum
        secondary: >-
          {{ states('sensor.tapovacuummop_status') }} ·
          {{ states('sensor.tapovacuummop_battery') }}% ·
          last {{ states('sensor.tapovacuummop_last_clean_area') }}
        icon: mdi:robot-vacuum
        icon_color: >-
          {{ 'red' if states('sensor.tapovacuummop_error') not in ['Ok','unknown','unavailable']
             else 'green' if states('vacuum.tapovacuummop') == 'docked' else 'blue' }}
        multiline_secondary: true
        tap_action: { action: navigate, navigation_path: /lovelace/device-vacuum }

      - type: custom:mushroom-template-card
        primary: Litter Box
        secondary: >-
          {{ states('sensor.cat_litter_box_status') }} ·
          {{ states('sensor.cat_litter_box_excretions_per_day') }} today
        icon: mdi:cat
        icon_color: >-
          {{ 'green' if is_state('sensor.cat_litter_box_status','Cleaning')
             else 'orange' if is_state('sensor.cat_litter_box_status','Cat_into') else 'blue' }}
        multiline_secondary: true
        tap_action: { action: navigate, navigation_path: /lovelace/device-litterbox }

      - type: custom:mushroom-template-card
        primary: Bambu A1
        secondary: >-
          {{ states('sensor.bambu_a1_print_status') }} ·
          {{ states('sensor.bambu_a1_print_progress') }}%
        icon: mdi:printer-3d-nozzle
        icon_color: >-
          {{ 'blue' if states('sensor.bambu_a1_print_status') in ['printing','running']
             else 'green' if states('sensor.bambu_a1_print_status') in ['finish','idle'] else 'grey' }}
        multiline_secondary: true
        tap_action: { action: navigate, navigation_path: /lovelace/device-bambu }

      - type: custom:mushroom-template-card
        primary: Elegoo Neptune
        secondary: >-
          {{ states('sensor.neptune_print_state') }} ·
          {{ states('sensor.neptune_print_progress') }}%
        icon: mdi:printer-3d-nozzle
        icon_color: >-
          {{ 'grey' if states('sensor.neptune_printer_status') in ['unavailable','unknown']
             else 'blue' if states('sensor.neptune_print_state') == 'printing' else 'green' }}
        multiline_secondary: true
        tap_action: { action: navigate, navigation_path: /lovelace/device-neptune }

      - type: custom:mushroom-template-card
        primary: Speakers
        secondary: >-
          {{ states.media_player | list | count }} cast device(s)
        icon: mdi:cast-audio-variant
        icon_color: >-
          {{ 'blue' if states.media_player | selectattr('state','eq','playing') | list | count > 0
             else 'grey' }}
        tap_action: { action: navigate, navigation_path: /lovelace/device-speakers }
