# Overview — a real at-a-glance landing (greeting + top-line system health +
# a compact device glance). Deep per-service / per-Mac / model-endpoint tables
# live in Ops; full device controls live in the Devices tab. Keep this lean.
title: Overview
path: overview
icon: mdi:view-dashboard
type: sections
max_columns: 3
sections:
  - type: grid
    cards:
      - type: custom:mushroom-template-card
        primary: >-
          {{ ['Good morning','Good afternoon','Good evening'][0 if now().hour < 12 else 1 if now().hour < 18 else 2] }}
        secondary: '{{ now().strftime("%A %-d %B · %-I:%M %p") }}'
        icon: mdi:home-account
        icon_color: blue
        multiline_secondary: true
        tap_action: { action: none }
      - type: custom:mushroom-chips-card
        chips:
          - type: entity
            entity: sun.sun
            icon: mdi:white-balance-sunny
          - type: template
            icon: mdi:devices
            content: Devices
            tap_action: { action: navigate, navigation_path: /lovelace/devices }

  - type: grid
    cards:
      - type: heading
        heading: System Health
        icon: mdi:server-network
      - type: tile
        entity: sensor.cluster_nodes_online
        name: K3s Nodes
      - type: tile
        entity: sensor.mac_machines_online
        name: Macs
      - type: gauge
        entity: sensor.cluster_cpu_average
        name: Cluster CPU
        min: 0
        max: 100
        severity:
          green: 0
          yellow: 60
          red: 80
      - type: gauge
        entity: sensor.cluster_ram_average
        name: Cluster RAM
        min: 0
        max: 100
        severity:
          green: 0
          yellow: 70
          red: 85

  # Home = rooms. Each room's devices auto-populate from its HA area; the layout
  # is shared with the wall Home view via dashboards/_rooms_cards.yaml. Full
  # per-device detail pages live on the Devices tab (chip above).
  - type: grid
    cards: !include _rooms_cards.yaml
