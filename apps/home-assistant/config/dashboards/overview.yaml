# Overview — a real at-a-glance landing (greeting + top-line system health +
# a compact device glance). Deep per-service / per-Mac / model-endpoint tables
# live in Ops; full device controls live in the Devices tab. Keep this lean.
title: Overview
path: overview
icon: mdi:view-dashboard
type: sections
max_columns: 3
sections:
  - type: grid
    cards:
      - type: custom:mushroom-template-card
        primary: >-
          {{ ['Good morning','Good afternoon','Good evening'][0 if now().hour < 12 else 1 if now().hour < 18 else 2] }}
        secondary: '{{ now().strftime("%A %-d %B · %-I:%M %p") }}'
        icon: mdi:home-account
        icon_color: blue
        multiline_secondary: true
        tap_action: { action: none }
      - type: custom:mushroom-chips-card
        chips:
          - type: entity
            entity: sun.sun
            icon: mdi:white-balance-sunny
          - type: template
            icon: mdi:devices
            content: Devices
            tap_action: { action: navigate, navigation_path: /lovelace/devices }

  - type: grid
    cards:
      - type: heading
        heading: System Health
        icon: mdi:server-network
      - type: tile
        entity: sensor.cluster_nodes_online
        name: K3s Nodes
      - type: tile
        entity: sensor.mac_machines_online
        name: Macs
      - type: gauge
        entity: sensor.cluster_cpu_average
        name: Cluster CPU
        min: 0
        max: 100
        severity:
          green: 0
          yellow: 60
          red: 80
      - type: gauge
        entity: sensor.cluster_ram_average
        name: Cluster RAM
        min: 0
        max: 100
        severity:
          green: 0
          yellow: 70
          red: 85

  - type: grid
    cards:
      - type: heading
        heading: Devices
        icon: mdi:devices
      # Compact glance — full controls live in the Devices tab / detail pages.
      - type: custom:mushroom-template-card
        primary: Robot Vacuum
        secondary: >-
          {{ states('sensor.tapovacuummop_status') }} ·
          {{ states('sensor.tapovacuummop_battery') }}%
        icon: mdi:robot-vacuum
        icon_color: >-
          {{ 'red' if states('sensor.tapovacuummop_error') not in ['Ok','unknown','unavailable']
             else 'green' if states('vacuum.tapovacuummop') == 'docked' else 'blue' }}
        tap_action: { action: navigate, navigation_path: /lovelace/device-vacuum }
      - type: custom:mushroom-template-card
        primary: Litter Box
        secondary: >-
          {{ states('sensor.cat_litter_box_status') }} ·
          {{ states('sensor.cat_litter_box_excretions_per_day') }} today
        icon: mdi:cat
        icon_color: >-
          {{ 'orange' if is_state('sensor.cat_litter_box_status','Cat_into') else 'blue' }}
        tap_action: { action: navigate, navigation_path: /lovelace/device-litterbox }
      # Smart plugs — auto-populates EVERY plug (entity_id switch.*plug* catches
      # Shelly + Athom + any future one, and excludes non-plug switches). Each
      # card shows the plug's ROOM (its HA area, set from the wall Settings view)
      # as secondary text. Tap toggles the relay; live watts live in the Energy
      # views. Modular by design.
      - type: custom:auto-entities
        show_empty: false
        card_param: cards
        card:
          type: grid
          columns: 2
          square: false
        filter:
          include:
            - entity_id: switch.*plug*
              options:
                type: custom:mushroom-template-card
                primary: "{{ state_attr(entity, 'friendly_name') or entity }}"
                secondary: "{{ area_name(entity) or 'Unassigned' }}"
                icon: "{{ state_attr(entity, 'icon') or 'mdi:power-plug' }}"
                icon_color: "{{ 'amber' if is_state(entity, 'on') else 'disabled' }}"
                tap_action:
                  action: toggle
        sort:
          method: friendly_name
