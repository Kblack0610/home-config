# Overview — a real at-a-glance landing (greeting + top-line system health +
# a compact device glance). Deep per-service / per-Mac / model-endpoint tables
# live in Ops; full device controls live in the Devices tab. Keep this lean.
title: Overview
path: overview
icon: mdi:view-dashboard
type: sections
max_columns: 3
sections:
  - type: grid
    cards:
      - type: custom:mushroom-template-card
        primary: >-
          {{ ['Good morning','Good afternoon','Good evening'][0 if now().hour < 12 else 1 if now().hour < 18 else 2] }}
        secondary: '{{ now().strftime("%A %-d %B · %-I:%M %p") }}'
        icon: mdi:home-account
        icon_color: blue
        multiline_secondary: true
        tap_action: { action: none }
      - type: custom:mushroom-chips-card
        chips:
          - type: entity
            entity: sun.sun
            icon: mdi:white-balance-sunny
          - type: template
            icon: mdi:devices
            content: Devices
            tap_action: { action: navigate, navigation_path: /lovelace/devices }

  - type: grid
    cards:
      - type: heading
        heading: System Health
        icon: mdi:server-network
      - type: tile
        entity: sensor.cluster_nodes_online
        name: K3s Nodes
      - type: tile
        entity: sensor.mac_machines_online
        name: Macs
      - type: gauge
        entity: sensor.cluster_cpu_average
        name: Cluster CPU
        min: 0
        max: 100
        severity:
          green: 0
          yellow: 60
          red: 80
      - type: gauge
        entity: sensor.cluster_ram_average
        name: Cluster RAM
        min: 0
        max: 100
        severity:
          green: 0
          yellow: 70
          red: 85

  - type: grid
    cards:
      - type: heading
        heading: Devices
        icon: mdi:devices
      # Compact glance — full controls live in the Devices tab / detail pages.
      - type: custom:mushroom-template-card
        primary: Robot Vacuum
        secondary: >-
          {{ states('sensor.tapovacuummop_status') }} ·
          {{ states('sensor.tapovacuummop_battery') }}%
        icon: mdi:robot-vacuum
        icon_color: >-
          {{ 'red' if states('sensor.tapovacuummop_error') not in ['Ok','unknown','unavailable']
             else 'green' if states('vacuum.tapovacuummop') == 'docked' else 'blue' }}
        tap_action: { action: navigate, navigation_path: /lovelace/device-vacuum }
      - type: custom:mushroom-template-card
        primary: Litter Box
        secondary: >-
          {{ states('sensor.cat_litter_box_status') }} ·
          {{ states('sensor.cat_litter_box_excretions_per_day') }} today
        icon: mdi:cat
        icon_color: >-
          {{ 'orange' if is_state('sensor.cat_litter_box_status','Cat_into') else 'blue' }}
        tap_action: { action: navigate, navigation_path: /lovelace/device-litterbox }
      # Smart plugs — tap toggles the relay; secondary shows live draw.
      - type: custom:mushroom-template-card
        entity: switch.shellyplugusg4_acebe6f28334
        primary: Shelly Plug 1
        secondary: >-
          {{ states('switch.shellyplugusg4_acebe6f28334') }} ·
          {{ states('sensor.shellyplugusg4_acebe6f28334_power') }} W
        icon: mdi:power-plug
        icon_color: "{{ 'green' if is_state('switch.shellyplugusg4_acebe6f28334','on') else 'grey' }}"
        tap_action: { action: toggle }
      - type: custom:mushroom-template-card
        entity: switch.shellyplugusg4_acebe6f2a1e8
        primary: Shelly Plug 2 (Lamp)
        secondary: >-
          {{ states('switch.shellyplugusg4_acebe6f2a1e8') }} ·
          {{ states('sensor.shellyplugusg4_acebe6f2a1e8_power') }} W
        icon: mdi:power-plug
        icon_color: "{{ 'green' if is_state('switch.shellyplugusg4_acebe6f2a1e8','on') else 'grey' }}"
        tap_action: { action: toggle }
