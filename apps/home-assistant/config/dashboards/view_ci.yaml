# Shared view: included by ui-lovelace.yaml (Homelab) and dashboards/phone.yaml.
# What every self-hosted CI runner is doing right now, what it last did, what
# each pool is for, and what is waiting - from packages/ci_runners.yaml. The
# deep view (recent runs, trends) is Grafana's "CI / Runners" dashboard.
#
# STRICT MODE: the markdown card renders templates strictly, so an undefined
# variable blanks the WHOLE card. Prometheus drops labels whose value is empty
# (a job with no branch, a waiting job with no runs-on labels), so every
# optional label is read with .get(), never as m.label. Test a change with
# render_template strict=true over the HA websocket before shipping.
title: CI
path: ci
icon: mdi:progress-wrench
type: sections
max_columns: 2
sections:
  - type: grid
    cards:
      - type: heading
        heading: CI runners
        heading_style: title
      - type: custom:mushroom-template-card
        primary: Running
        secondary: "{{ states('sensor.ci_runners_running') }} jobs"
        icon: mdi:run-fast
        icon_color: "{{ 'blue' if states('sensor.ci_runners_running') | int(0) > 0 else 'grey' }}"
      - type: custom:mushroom-template-card
        primary: Waiting
        secondary: "{{ states('sensor.ci_jobs_waiting') }} jobs"
        icon: mdi:timer-sand
        icon_color: "{{ 'orange' if states('sensor.ci_jobs_waiting') | int(0) > 0 else 'green' }}"
      - type: custom:mushroom-template-card
        primary: Offline / missing
        secondary: "{{ states('sensor.ci_runners_down') }} runners"
        icon: mdi:server-off
        icon_color: "{{ 'red' if states('sensor.ci_runners_down') | int(0) > 0 else 'green' }}"
      - type: custom:mushroom-template-card
        primary: GitHub API
        secondary: "{{ states('sensor.ci_github_api') }}"
        icon: mdi:github
        icon_color: "{{ 'green' if is_state('sensor.ci_github_api', 'ok') else 'red' }}"
      - type: markdown
        title: Runners
        content: |
          {%- macro ago(s) -%}{{ (s // 86400) ~ 'd' if s >= 86400 else ((s // 3600) ~ 'h ' ~ ((s % 3600) // 60) ~ 'm' if s >= 3600 else (s // 60) ~ 'm') }}{%- endmacro -%}
          {%- set rows = state_attr('sensor.ci_runners_running', 'result') or [] -%}
          {%- set hist = state_attr('sensor.ci_runner_history', 'result') or [] -%}
          {%- set now_s = as_timestamp(now()) | int(0) -%}
          {%- set icons = {'running': 'mdi:play-circle', 'idle': 'mdi:sleep', 'offline': 'mdi:lan-disconnect', 'missing': 'mdi:help-circle-outline'} -%}
          {%- if not rows -%}
          No runner data (GitHub API: {{ states('sensor.ci_github_api') }}).
          {%- else -%}
          {%- for st in ['running', 'offline', 'missing', 'idle'] -%}
          {%- for r in rows | selectattr('metric.state', 'eq', st) | sort(attribute='metric.name') -%}
          {%- set m = r.metric -%}
          {%- set s = r.value[1] | int(0) -%}
          <ha-icon icon="{{ icons[st] }}"></ha-icon> **{{ m.get('name', '?') }}** ({{ m.get('pool', '?') }})
          {%- if st == 'running' and m.get('url') %} {{ ago(s) }}: {{ m.get('repo', '') }} / {{ m.get('workflow', '') }} / [{{ m.get('job_name', 'job') | replace('|', '/') }}]({{ m.get('url') }}){% if m.get('branch') %} on `{{ m.get('branch') }}`{% endif %}
          {%- elif st == 'running' %} busy on {{ m.get('repo', 'an unwatched repo') }}
          {%- else %} {{ st }}{%- endif %}
          {%- set l = hist | selectattr('metric.name', 'eq', m.get('name')) | first -%}
          {%- if st != 'running' and l is defined and l -%}
          {%- set lm = l.metric %}<br>last: {{ lm.get('last_repo', '') }} / {{ lm.get('last_workflow', '') }} / [{{ lm.get('last_job', 'job') | replace('|', '/') }}]({{ lm.get('last_url', '') }}) {{ lm.get('last_conclusion', '') }}, {{ ago(now_s - (l.value[1] | int(0))) }} ago
          {%- endif %}

          {% endfor -%}
          {%- endfor -%}
          {%- endif -%}

  - type: grid
    cards:
      - type: heading
        heading: Waiting for a runner
        heading_style: title
      - type: markdown
        content: |
          {%- macro ago(s) -%}{{ (s // 86400) ~ 'd' if s >= 86400 else ((s // 3600) ~ 'h ' ~ ((s % 3600) // 60) ~ 'm' if s >= 3600 else (s // 60) ~ 'm') }}{%- endmacro -%}
          {%- set rows = state_attr('sensor.ci_jobs_waiting', 'result') or [] -%}
          {%- if not rows -%}
          Nothing waiting.
          {%- else -%}
          {%- for r in rows -%}
          {%- set m = r.metric -%}
          <ha-icon icon="mdi:timer-sand"></ha-icon> {{ ago(r.value[1] | int(0)) }}: {{ m.get('repo', '') }} / {{ m.get('workflow', '') }} / [{{ m.get('job_name', 'job') | replace('|', '/') }}]({{ m.get('url', '') }}){% if m.get('branch') %} on `{{ m.get('branch') }}`{% endif %}{% if m.get('labels') %}, needs `{{ m.get('labels') }}`{% endif %}

          {% endfor -%}
          {%- endif -%}
      - type: heading
        heading: What each pool runs
        heading_style: title
      - type: markdown
        content: |
          {%- set rows = state_attr('sensor.ci_pool_workflows', 'result') or [] -%}
          {%- if not rows -%}
          No recent history yet.
          {%- else -%}
          {%- for pool in rows | map(attribute='metric') | map(attribute='pool') | unique | sort -%}
          **{{ pool }}**: {% for r in rows | selectattr('metric.pool', 'eq', pool) -%}{{ r.metric.get('repo', '') }} / {{ r.metric.get('workflow', '') }}{{ ', ' if not loop.last }}{%- endfor %}

          {% endfor -%}
          {%- endif -%}
      - type: custom:bubble-card
        card_type: button
        button_type: name
        name: Open Grafana CI dashboard
        icon: mdi:chart-box
        tap_action:
          action: url
          url_path: https://grafana.kblab.me/d/kb-ci-runners
