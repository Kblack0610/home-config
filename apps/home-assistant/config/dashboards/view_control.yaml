# Shared view: included by BOTH dashboards/wall.yaml and dashboards/phone.yaml.
# Navigation paths are RELATIVE (home, device-*) so they resolve inside whichever dashboard
# shows the view; an absolute /wall-panels/... path here would strand the phone.
# ─────────────────────────────── CONTROL ─────────────────────────────────
title: Control
path: control
icon: mdi:tune
type: sections
max_columns: 3
sections:
  - type: grid
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: name
        name: Home
        icon: mdi:home
        tap_action:
          action: navigate
          navigation_path: home
      - type: heading
        heading: Lights & switches
        heading_style: title
      - type: custom:auto-entities
        show_empty: false
        card_param: cards
        card:
          type: grid
          columns: 2
          square: false
        filter:
          include:
            - domain: light
              options:
                type: custom:mushroom-light-card
            - domain: fan
              options:
                type: custom:mushroom-fan-card
            - domain: switch
              options:
                type: custom:mushroom-entity-card
  - type: grid
    cards:
      - type: heading
        heading: Scenes & scripts
        heading_style: title
      - type: custom:auto-entities
        show_empty: false
        card:
          type: entities
          state_color: true
        filter:
          include:
            - domain: scene
            - domain: script
  - type: grid
    cards:
      - type: heading
        heading: Energy
        heading_style: title
      - type: custom:auto-entities
        show_empty: false
        card_param: cards
        card:
          type: grid
          columns: 2
          square: false
        filter:
          include:
            - domain: sensor
              attributes:
                device_class: power
              options:
                type: custom:mushroom-entity-card
                icon: mdi:flash
            - domain: sensor
              attributes:
                device_class: energy
              options:
                type: custom:mushroom-entity-card
                icon: mdi:lightning-bolt
        sort:
          method: friendly_name
  - type: grid
    cards:
      - type: heading
        heading: Climate
        heading_style: title
      - type: custom:auto-entities
        show_empty: false
        card_param: cards
        card:
          type: grid
          columns: 1
          square: false
        filter:
          include:
            - domain: climate
              options:
                type: custom:mushroom-climate-card
  - type: grid
    cards:
      - type: heading
        heading: Fans (IR)
        heading_style: title
      # Honeywell QuietSet — IR remote was lost; codes come from the DB, fired
      # via the Broadlink. Stateless 3-button remote: Power / Speed / Oscillate.
      - type: custom:mushroom-template-card
        primary: Honeywell — Power
        icon: mdi:power
        icon_color: blue
        tap_action:
          action: perform-action
          perform_action: script.honeywell_fan_power
      - type: custom:mushroom-template-card
        primary: Honeywell — Speed
        icon: mdi:fan
        icon_color: cyan
        tap_action:
          action: perform-action
          perform_action: script.honeywell_fan_speed
      - type: custom:mushroom-template-card
        primary: Honeywell — Oscillate
        icon: mdi:fan-chevron
        icon_color: teal
        tap_action:
          action: perform-action
          perform_action: script.honeywell_fan_oscillate
  - type: grid
    cards:
      - type: markdown
        content: >
          Controls populate automatically as devices are added. This view
          uses `auto-entities`, so new lights, switches, fans, scenes,
          scripts, energy sensors (Shelly plugs) and climate entities (AC via
          Broadlink) appear here with no edits.
