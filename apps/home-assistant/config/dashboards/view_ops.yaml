# Shared view: included by BOTH dashboards/wall.yaml and dashboards/phone.yaml.
# Navigation paths are RELATIVE (home, device-*) so they resolve inside whichever dashboard
# shows the view; an absolute /wall-panels/... path here would strand the phone.
# ────────────────────────────── OPS / FLEET ──────────────────────────────
# Glanceable homelab + device-fleet status from existing sensors. Offline /
# low-battery rosters use auto-entities (empty-safe) and auto-populate as
# iot-fleet ESP32/Pi devices register over MQTT. Heavier bits (embedded
# Grafana, prometheus integration, watchman, ntfy alerting) are a follow-up.
title: Ops
path: ops
icon: mdi:server-network
type: sections
max_columns: 3
sections:
  - type: grid
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: name
        name: Home
        icon: mdi:home
        tap_action: { action: navigate, navigation_path: home }
      - type: heading
        heading: Cluster
        heading_style: title
      - type: custom:mushroom-template-card
        primary: Nodes online
        secondary: "{{ states('sensor.cluster_nodes_online') }} / {{ states('sensor.homelab_total_nodes') }}"
        icon: mdi:kubernetes
        icon_color: "{{ 'green' if states('sensor.cluster_nodes_online') == states('sensor.homelab_total_nodes') else 'orange' }}"
      - type: custom:mushroom-template-card
        primary: Cluster CPU
        secondary: "{{ states('sensor.cluster_cpu_average') }}%"
        icon: mdi:cpu-64-bit
        icon_color: "{{ 'green' if states('sensor.cluster_cpu_average')|float(0) < 80 else 'orange' }}"
      - type: custom:mushroom-template-card
        primary: Cluster RAM
        secondary: "{{ states('sensor.cluster_ram_average') }}%"
        icon: mdi:memory
        icon_color: "{{ 'green' if states('sensor.cluster_ram_average')|float(0) < 85 else 'orange' }}"
      - type: custom:mushroom-template-card
        primary: Macs online
        secondary: "{{ states('sensor.mac_machines_online') }}"
        icon: mdi:apple
        icon_color: blue
  - type: grid
    cards:
      - type: heading
        heading: Node load
        heading_style: title
      - type: custom:mini-graph-card
        name: Node CPU
        hours_to_show: 12
        points_per_hour: 4
        line_width: 2
        entities:
          - { entity: sensor.node_1_cpu, name: n1 }
          - { entity: sensor.node_2_cpu, name: n2 }
          - { entity: sensor.node_3_cpu, name: n3 }
          - { entity: sensor.node_4_cpu, name: n4 }
          - { entity: sensor.node_5_cpu, name: n5 }
  - type: grid
    cards:
      - type: heading
        heading: Services
        heading_style: title
      - type: custom:mushroom-template-card
        primary: Services
        secondary: >-
          {{ (states.binary_sensor | selectattr('attributes.device_class','eq','connectivity') | selectattr('state','eq','on') | list | count) }} up ·
          {{ states('sensor.services_down_count') }} down
        icon: mdi:lan-connect
        icon_color: "{{ 'red' if states('sensor.services_down_count')|int(0) > 0 else 'green' }}"
      # Only renders when something is actually down (show_empty:false).
      - type: custom:auto-entities
        show_empty: false
        card:
          type: entities
          title: Down
          state_color: true
        filter:
          include:
            - domain: binary_sensor
              attributes: { device_class: connectivity }
              state: "off"
        sort: { method: friendly_name }
  - type: grid
    cards:
      - type: heading
        heading: Fleet health
        heading_style: title
      # Offline roster — auto-populates as iot-fleet/MQTT devices register.
      - type: custom:auto-entities
        show_empty: false
        card:
          type: entities
          title: Offline / unavailable
          state_color: true
        filter:
          include:
            - { state: unavailable }
            - { state: unknown }
          exclude:
            - entity_id: "*weather*"
            - entity_id: "sun.*"
        sort: { method: friendly_name }
      # Low-battery roster (battery-powered fleet devices).
      - type: custom:auto-entities
        show_empty: false
        card:
          type: entities
          title: Low battery
        filter:
          include:
            - { attributes: { device_class: battery }, state: "< 30" }
        sort: { method: state, numeric: true }
