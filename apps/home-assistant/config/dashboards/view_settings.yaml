# Shared view: included by BOTH dashboards/wall.yaml and dashboards/phone.yaml.
# Navigation paths are RELATIVE (home, device-*) so they resolve inside whichever dashboard
# shows the view; an absolute /wall-panels/... path here would strand the phone.
# ────────────────────────────── SETTINGS ─────────────────────────────────
# Only what someone changes from the wall. Names and rooms belong to
# pyscript/room_layout.yaml, per-tablet idle data to pyscript/wall_panels.yaml.
title: Settings
path: settings
icon: mdi:tune
type: sections
max_columns: 2
sections:
  - type: grid
    cards:
      - !include _home_button.yaml
      - type: heading
        heading: Wall tablets
        heading_style: title
      # All four panels. wall_idle.py applies a change at once; docs/wall-panels.md.
      - type: entities
        entities:
          - entity: input_number.wall_brightness
          - entity: input_boolean.wall_keep_screen_on
          - entity: input_select.wall_sleep_behavior
          - entity: input_datetime.wall_night_start
          - entity: input_datetime.wall_night_end
      # What fired on the wall and what each satellite heard: dashboards/view_log.yaml.
      - type: button
        name: Event log
        icon: mdi:history
        show_state: false
        tap_action: { action: navigate, navigation_path: log }
