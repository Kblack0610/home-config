# Shared view: included by BOTH dashboards/wall.yaml and dashboards/phone.yaml.
# Navigation paths are RELATIVE (home, device-*) so they resolve inside whichever dashboard
# shows the view; an absolute /wall-panels/... path here would strand the phone.
# ────────────────────────────── SETTINGS ─────────────────────────────────
# Only what someone changes from the wall. Names and rooms belong to
# pyscript/room_layout.yaml, per-tablet idle data to pyscript/wall_panels.yaml.
title: Settings
path: settings
icon: mdi:tune
type: sections
max_columns: 2
sections:
  - type: grid
    cards:
      - !include _home_button.yaml
      - type: heading
        heading: Wall tablets
        heading_style: title
      - type: entities
        entities:
          - entity: input_select.wall_sleep_behavior
