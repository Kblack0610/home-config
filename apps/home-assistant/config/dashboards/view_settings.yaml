# Shared view: included by BOTH dashboards/wall.yaml and dashboards/phone.yaml.
# Navigation paths are RELATIVE (home, device-*) so they resolve inside whichever dashboard
# shows the view; an absolute /wall-panels/... path here would strand the phone.
# ────────────────────────────── SETTINGS ─────────────────────────────────
# User-configurable plug metadata. ANY user (non-admin, on the kiosk) can set
# each plug's room, name, icon, category and whether it's a light. Tapping a
# plug in the list loads it into the always-visible editor (top); Save writes
# HA's native registries via the pyscript plug_settings app
# (config/pyscript/plug_settings.py) — no admin, no browser_mod.
# The plug list uses custom:button-card because HA core does NOT template
# tap_action service data; button-card's [[[ ]]] JS does, so it can pass the
# tapped plug's entity_id to pyscript.plug_load.
title: Settings
path: settings
icon: mdi:home-edit
type: sections
max_columns: 2
sections:
  # ── Editor (always visible; reflects the plug you tap in the list) ──
  - type: grid
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: name
        name: Home
        icon: mdi:home
        tap_action: { action: navigate, navigation_path: home }
      - type: heading
        heading: Plug Settings
        heading_style: title
      - type: markdown
        content: >
          **Tap a plug below**, then set its **name**, **room**, **icon**,
          **category**, and whether it counts as a **light** — and press
          **Save**. Changes apply everywhere (dashboards + voice).
      - type: custom:mushroom-template-card
        primary: >-
          {% set t = states('input_text.plug_edit_target') %}
          {{ state_attr(t, 'friendly_name') if t not in ['', 'unknown', 'unavailable']
             else 'No plug selected' }}
        secondary: >-
          {% set t = states('input_text.plug_edit_target') %}
          {{ 'Room: ' ~ (area_name(t) or 'Unassigned') if t not in ['', 'unknown', 'unavailable']
             else 'Tap a plug in the list below' }}
        icon: >-
          {% set t = states('input_text.plug_edit_target') %}
          {{ state_attr(t, 'icon') or 'mdi:power-plug' if t not in ['', 'unknown', 'unavailable']
             else 'mdi:cursor-default-click' }}
        icon_color: blue
      - type: entities
        title: Editor
        state_color: true
        entities:
          - entity: input_text.plug_edit_name
          - entity: input_select.plug_edit_room
          - entity: input_text.plug_edit_new_room
          - entity: input_select.plug_edit_category
          - entity: input_text.plug_edit_icon
          - entity: input_boolean.plug_edit_is_light
      - type: custom:mushroom-template-card
        primary: Save changes
        secondary: Writes to the selected plug
        icon: mdi:content-save
        icon_color: green
        tap_action:
          action: call-service
          service: pyscript.plug_apply
          data: {}
  # ── Plug list (tap a plug to load it into the editor above) ──
  - type: grid
    cards:
      - type: heading
        heading: Plugs
        heading_style: title
      - type: custom:auto-entities
        show_empty: false
        card_param: cards
        card:
          type: grid
          columns: 1
          square: false
        filter:
          include:
            - entity_id: switch.*plug*
              options:
                type: custom:button-card
                icon: mdi:power-plug
                show_label: true
                size: 28px
                styles:
                  card: [{ padding: 12px }]
                  grid: [{ grid-template-areas: '"i n" "i l"' }, { grid-template-columns: min-content 1fr }]
                  name: [{ justify-self: start }, { font-weight: bold }]
                  label: [{ justify-self: start }, { color: var(--secondary-text-color) }]
                name: |
                  [[[ return states[entity.entity_id].attributes.friendly_name || entity.entity_id ]]]
                label: |
                  [[[
                    var eid = entity.entity_id;
                    var e = hass.entities ? hass.entities[eid] : null;
                    var aid = e ? e.area_id : null;
                    if (!aid && e && e.device_id && hass.devices) { aid = (hass.devices[e.device_id]||{}).area_id; }
                    var a = (aid && hass.areas) ? hass.areas[aid] : null;
                    return (a ? a.name : 'Unassigned') + ' · tap to edit';
                  ]]]
                tap_action:
                  action: call-service
                  service: pyscript.plug_load
                  service_data:
                    entity_id: "[[[ return entity.entity_id ]]]"
        sort:
          method: friendly_name
