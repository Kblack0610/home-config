# ─────────────────────────────────────────────────────────────────────────
# Wall-panel dashboard (Phase 5.5) — loaded by the kitchen + secondary tablets.
# Custom cards are vendored by the `install-lovelace-cards` init container and
# declared in configuration.yaml. This dashboard is intentionally empty-safe:
# control sections use `auto-entities`, so they render fine now (few entities)
# and fill in automatically as Zigbee/ESPHome devices land (Phase 5).
#
# Profiles × views: wall tablets log in as NON-ADMIN users → kiosk-mode hides
# the header/sidebar. Admin (Kenneth) keeps full chrome; ?disable_km also exits.
# Per-view `visible:` profile-gating is added in Phase 5 once the HA users exist.
# ─────────────────────────────────────────────────────────────────────────
title: Wall

kiosk_mode:
  non_admin_settings:
    kiosk: true

views:
  # ───────────────────────────── HOME / GLANCE ─────────────────────────────
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Controls
            icon: mdi:tune
            tap_action:
              action: navigate
              navigation_path: /wall-panels/control
          - type: custom:mushroom-template-card
            primary: >-
              {{ ['Good morning','Good afternoon','Good evening'][0 if now().hour < 12 else 1 if now().hour < 18 else 2] }}
            secondary: '{{ now().strftime("%A %-d %B · %-I:%M %p") }}'
            icon: mdi:tablet-dashboard
            icon_color: blue
            multiline_secondary: true
            tap_action:
              action: none
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sun.sun
                icon: mdi:white-balance-sunny
              - type: template
                icon: mdi:image-multiple
                content: Photos
                tap_action:
                  action: url
                  url_path: http://immich-kiosk.kblab.me?disable_ui=true
      - type: grid
        cards:
          - type: heading
            heading: Announce
            heading_style: title
          - type: custom:mushroom-entity-card
            entity: input_text.voice_announce_message
            icon: mdi:message-text
          - type: custom:mushroom-select-card
            entity: input_select.voice_announce_language
          - type: custom:mushroom-template-card
            primary: Announce to all speakers
            icon: mdi:bullhorn-variant
            icon_color: amber
            tap_action:
              action: call-service
              service: script.tts_announce_all_cast
              data:
                message: "{{ states('input_text.voice_announce_message') }}"
                language: "{{ states('input_select.voice_announce_language') }}"
      - type: grid
        cards:
          - type: heading
            heading: Speakers & media
            heading_style: title
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              title: Cast devices
              state_color: true
            filter:
              include:
                - domain: media_player
            sort:
              method: friendly_name

  # ─────────────────────────────── CONTROL ─────────────────────────────────
  - title: Control
    path: control
    icon: mdi:tune
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Home
            icon: mdi:home
            tap_action:
              action: navigate
              navigation_path: /wall-panels/home
          - type: heading
            heading: Lights & switches
            heading_style: title
          - type: custom:auto-entities
            show_empty: false
            card_param: cards
            card:
              type: grid
              columns: 2
              square: false
            filter:
              include:
                - domain: light
                  options:
                    type: custom:mushroom-light-card
                - domain: fan
                  options:
                    type: custom:mushroom-fan-card
                - domain: switch
                  options:
                    type: custom:mushroom-entity-card
      - type: grid
        cards:
          - type: heading
            heading: Scenes & scripts
            heading_style: title
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              state_color: true
            filter:
              include:
                - domain: scene
                - domain: script
      - type: grid
        cards:
          - type: markdown
            content: >
              Controls populate automatically as devices are added (Phase 5 —
              Zigbee / ESPHome). This view uses `auto-entities`, so new lights,
              switches, fans, scenes and scripts appear here with no edits.
