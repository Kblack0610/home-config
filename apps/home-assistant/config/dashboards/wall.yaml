# ─────────────────────────────────────────────────────────────────────────
# Wall-panel dashboard (Phase 5.5 / 1.5) — the kitchen + secondary tablets.
# Custom cards vendored by the `install-lovelace-cards` init container.
#
# Nest-Hub experience: after `idle_time`s of no touch, lovelace-wallpanel fades
# into a fullscreen slideshow of random Immich photos (via the immich-kiosk
# /image endpoint) with a big clock/date overlay — tap to return. While active,
# the Home view is a glanceable hub (clock+weather, status chips, homelab/printer
# tiles, announce, cast media). Empty-safe: device sections use auto-entities and
# fill in as Zigbee/ESPHome land (Phase 5).
#
# Profiles × views: wall tablets log in as NON-ADMIN users → kiosk-mode hides the
# header/sidebar. Admin keeps full chrome; ?disable_km exits. ?kiosk previews it.
# ─────────────────────────────────────────────────────────────────────────
title: Wall

kiosk_mode:
  non_admin_settings:
    kiosk: true

# ── Split control-panel screensaver (lovelace-wallpanel → immich-kiosk) ─────
# wallpanel provides the screensaver trigger (idle, fullscreen, keep-awake) and
# a tap-to-dismiss gesture; the photo CONTENT is immich-kiosk's full page,
# embedded via wallpanel's `iframe+` URL mode. That keeps immich-kiosk's NATIVE
# big clock/date + image-metadata overlays and automatic side-by-side PORTRAIT
# PAIRING (KIOSK_LAYOUT=splitview, on the immich-kiosk deployment).
#
# The idle screen is no longer JUST photos: wallpanel's info box is repurposed as
# a translucent CONTROL PANEL pinned to the right ~36% (weather + homelab/device
# status + an Expand hint), while photos + kiosk's clock fill the rest.
#
# INTERACTION (important — fixes the old "have to click twice" pain): with
# content_interaction:true + a full-screen kiosk iframe, taps were SWALLOWED by
# the iframe, so a tap never reliably dismissed the screensaver. We set
# content_interaction:FALSE so ANY tap (photos OR panel) reliably ends the
# screensaver on the FIRST tap and reveals the full Home dashboard = "full view".
# The control panel is therefore GLANCEABLE (its cards render but taps expand
# rather than toggle in place) — the real controls live one tap away on Home.
# NOTE: do NOT add ?disable_ui=true to the kiosk URL — verified via Playwright
# that it ALSO hides the clock/date/metadata overlays (not just nav chrome).
wallpanel:
  enabled: true
  fullscreen: true
  hide_toolbar: true
  hide_sidebar: true
  idle_time: 20
  # Keep the display awake while the dashboard/screensaver is open (browser Wake
  # Lock API). For a mounted tablet, also set OS/kiosk keep-awake (docs/wall-panels.md).
  keep_screen_on_time: 86400
  show_progress_bar: false
  image_url: 'iframe+https://immich-kiosk.kblab.me/'
  # First tap anywhere dismisses the screensaver → Home (see INTERACTION above).
  content_interaction: false
  # Control panel shown over the photos (right-pinned by the style block below).
  cards:
    # Weather forecast — no clock here (kiosk already draws a big clock over the
    # photos; a second clock would be redundant).
    - type: weather-forecast
      entity: weather.forecast_home
      forecast_type: daily
      show_current: true
      card_mod:
        style: |
          ha-card { background: rgba(20,20,22,0.38); border: none; box-shadow: none; backdrop-filter: blur(3px); }
    # Homelab + device status at a glance (reuses Home-view entities).
    - type: custom:mushroom-chips-card
      alignment: center
      chips:
        - type: template
          icon: mdi:server-network
          icon_color: blue
          content: "{{ states('sensor.cluster_nodes_online') }}/{{ states('sensor.homelab_total_nodes') }}"
        - type: template
          icon: mdi:robot-vacuum
          content: "{{ states('sensor.tapovacuummop_status') }}"
        - type: template
          icon: mdi:cat
          content: "{{ states('sensor.cat_litter_box_status') }}"
      card_mod:
        style: |
          ha-card { background: transparent; border: none; box-shadow: none; }
    # Expand affordance — advertises that a tap opens the full dashboard. (Any tap
    # ends the screensaver → Home, so this is a hint/label, not a special action.)
    - type: custom:mushroom-template-card
      primary: Full dashboard
      secondary: Tap anywhere to open
      icon: mdi:gesture-tap
      icon_color: amber
      tap_action: { action: navigate, navigation_path: /wall-panels/home }
      card_mod:
        style: |
          ha-card { background: rgba(20,20,22,0.38); border: none; box-shadow: none; backdrop-filter: blur(3px); }
  style:
    # Pin the info box as a translucent right-hand control column (~36% wide,
    # full height), fading in from the photos. Tune the width/gradient on-tablet.
    wallpanel-screensaver-info-box:
      position: absolute
      top: '0'
      right: '0'
      bottom: '0'
      left: auto
      transform: none
      width: 36%
      height: 100%
      margin: '0'
      padding: 28px
      box-sizing: border-box
      display: flex
      flex-direction: column
      justify-content: center
      gap: 14px
      overflow-y: auto
      background: 'linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0.5) 26%)'

views:
  # ───────────────────────────── HOME / GLANCE ─────────────────────────────
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          # Always-works greeting hero (renders regardless of integrations).
          - type: custom:mushroom-template-card
            primary: >-
              {{ ['Good morning','Good afternoon','Good evening'][0 if now().hour < 12 else 1 if now().hour < 18 else 2] }}
            secondary: '{{ now().strftime("%A %-d %B · %-I:%M %p") }}'
            icon: mdi:tablet-dashboard
            icon_color: blue
            multiline_secondary: true
            tap_action: { action: none }
          # Clock + multi-day forecast hero. Needs the Met.no integration added
          # (Settings → Devices → Add Integration → Met.no) → weather.forecast_home.
          - type: custom:clock-weather-card
            entity: weather.forecast_home
            forecast_rows: 4
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:tune
                content: Controls
                tap_action: { action: navigate, navigation_path: /wall-panels/control }
              - type: template
                icon: mdi:robot-vacuum
                content: Devices
                tap_action: { action: navigate, navigation_path: /wall-panels/devices }
              - type: template
                icon: mdi:map-marker-radius
                content: Local
                tap_action: { action: navigate, navigation_path: /wall-panels/local }
              - type: template
                icon: mdi:image-multiple
                content: Photos
                tap_action: { action: navigate, navigation_path: /wall-panels/photos }
              - type: template
                icon: mdi:server-network
                icon_color: blue
                content: "{{ states('sensor.cluster_nodes_online') }}/{{ states('sensor.homelab_total_nodes') }}"
                tap_action: { action: navigate, navigation_path: /wall-panels/ops }
              - type: template
                icon: mdi:play-box-multiple
                content: Media
                tap_action: { action: navigate, navigation_path: /wall-panels/media }
              - type: template
                icon: mdi:home-edit
                content: Settings
                tap_action: { action: navigate, navigation_path: /wall-panels/settings }
              - type: template
                icon: mdi:cog
                content: Admin
                tap_action: { action: navigate, navigation_path: /wall-panels/admin }
              - type: entity
                entity: sun.sun
                icon: mdi:white-balance-sunny
      - type: grid
        cards:
          - type: heading
            heading: Devices
            heading_style: title
          # At-a-glance device status; tap a chip to open its detail page.
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                icon: mdi:robot-vacuum
                content: "{{ states('sensor.tapovacuummop_status') }}"
                icon_color: >-
                  {{ 'red' if states('sensor.tapovacuummop_error') not in ['Ok','unknown','unavailable']
                     else 'green' if is_state('vacuum.tapovacuummop','docked') else 'blue' }}
                tap_action: { action: navigate, navigation_path: /wall-panels/device-vacuum }
              - type: template
                icon: mdi:cat
                content: "{{ states('sensor.cat_litter_box_status') }}"
                icon_color: "{{ 'orange' if is_state('sensor.cat_litter_box_status','Cat_into') else 'blue' }}"
                tap_action: { action: navigate, navigation_path: /wall-panels/device-litterbox }
              - type: template
                icon: mdi:printer-3d-nozzle
                content: >-
                  {% set s = states('sensor.a1_03900d5b1110644_print_status') %}{{ 'off' if s in ['unavailable','unknown'] else s }}
                icon_color: >-
                  {{ 'grey' if states('sensor.a1_03900d5b1110644_print_status') in ['unavailable','unknown'] else 'blue' }}
                tap_action: { action: navigate, navigation_path: /wall-panels/device-bambu }
              - type: template
                icon: mdi:cast-audio-variant
                content: "{{ states.media_player | list | count }} speakers"
                tap_action: { action: navigate, navigation_path: /wall-panels/device-speakers }
      - type: grid
        cards:
          - type: heading
            heading: Smart Plugs
            heading_style: title
          # Auto-populates every plug (switch.*plug*): Shelly, Athom, future.
          # Each card shows the plug's ROOM (its HA area, set from the Settings
          # view) as secondary text — "Unassigned" until a user places it. Tap
          # toggles the relay; live watts are in the Energy section below.
          - type: custom:auto-entities
            show_empty: false
            card_param: cards
            card:
              type: grid
              columns: 2
              square: false
            filter:
              include:
                - entity_id: switch.*plug*
                  options:
                    type: custom:mushroom-template-card
                    primary: "{{ state_attr(entity, 'friendly_name') or entity }}"
                    secondary: "{{ area_name(entity) or 'Unassigned' }}"
                    icon: "{{ state_attr(entity, 'icon') or 'mdi:power-plug' }}"
                    icon_color: "{{ 'amber' if is_state(entity, 'on') else 'disabled' }}"
                    tap_action:
                      action: toggle
            sort:
              method: friendly_name
      - type: grid
        cards:
          - type: heading
            heading: Homelab
            heading_style: title
          - type: custom:mushroom-template-card
            primary: Cluster
            secondary: "{{ states('sensor.cluster_nodes_online') }} nodes · CPU {{ states('sensor.cluster_cpu_average') }}%"
            icon: mdi:kubernetes
            icon_color: "{{ 'green' if states('sensor.cluster_cpu_average')|float(0) < 80 else 'orange' }}"
            tap_action: { action: navigate, navigation_path: /wall-panels/ops }
      - type: grid
        cards:
          - type: heading
            heading: Announce
            heading_style: title
          - type: custom:mushroom-entity-card
            entity: input_text.voice_announce_message
            icon: mdi:message-text
          - type: custom:mushroom-select-card
            entity: input_select.voice_announce_language
          - type: custom:mushroom-template-card
            primary: Announce to all speakers
            icon: mdi:bullhorn-variant
            icon_color: amber
            tap_action:
              action: call-service
              service: script.tts_announce_all_cast
              data:
                message: "{{ states('input_text.voice_announce_message') }}"
                language: "{{ states('input_select.voice_announce_language') }}"
  # ────────────────────────────── DEVICES ──────────────────────────────────
  # Rich device hub (mirrors the main dashboard's Devices tab): each card taps
  # through to its shared detail subview at /wall-panels/device-*, with a chips
  # stat row for glance info. Printers get their own section. Self-contained —
  # no navigating off the kiosk.
  - title: Devices
    path: devices
    icon: mdi:devices
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Home
            icon: mdi:home
            tap_action: { action: navigate, navigation_path: /wall-panels/home }
          - type: heading
            heading: Devices
            heading_style: title
          - type: vertical-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Robot Vacuum
                secondary: "{{ states('sensor.tapovacuummop_status') }}"
                icon: mdi:robot-vacuum
                icon_color: >-
                  {{ 'red' if states('sensor.tapovacuummop_error') not in ['Ok','unknown','unavailable']
                     else 'green' if states('vacuum.tapovacuummop') == 'docked' else 'blue' }}
                tap_action: { action: navigate, navigation_path: /wall-panels/device-vacuum }
              - type: custom:mushroom-chips-card
                alignment: start
                chips:
                  - type: entity
                    entity: sensor.tapovacuummop_battery
                    icon: mdi:battery
                  - type: entity
                    entity: sensor.tapovacuummop_last_clean_area
                    icon: mdi:ruler-square
                  - type: entity
                    entity: sensor.tapovacuummop_error
                    icon: mdi:alert-circle-outline
          - type: vertical-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Litter Box
                secondary: "{{ states('sensor.cat_litter_box_status') }}"
                icon: mdi:cat
                icon_color: >-
                  {{ 'orange' if is_state('sensor.cat_litter_box_status','Cat_into') else 'blue' }}
                tap_action: { action: navigate, navigation_path: /wall-panels/device-litterbox }
              - type: custom:mushroom-chips-card
                alignment: start
                chips:
                  - type: entity
                    entity: sensor.cat_litter_box_cat_weight
                    icon: mdi:scale
                  - type: template
                    entity: sensor.cat_litter_box_excretions_per_day
                    icon: mdi:cat
                    content: "{{ states('sensor.cat_litter_box_excretions_per_day') }}/day"
                  - type: entity
                    entity: sensor.cat_litter_box_use_time
                    icon: mdi:timer-outline
          - type: vertical-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Speakers
                secondary: "{{ states.media_player | list | count }} cast device(s)"
                icon: mdi:cast-audio-variant
                icon_color: >-
                  {{ 'blue' if states.media_player | selectattr('state','eq','playing') | list | count > 0
                     else 'grey' }}
                tap_action: { action: navigate, navigation_path: /wall-panels/device-speakers }
      - type: grid
        cards:
          - type: heading
            heading: 3D Printers
            heading_style: title
          - type: vertical-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Bambu A1
                secondary: "{{ states('sensor.a1_03900d5b1110644_print_status') }}"
                icon: mdi:printer-3d-nozzle
                icon_color: >-
                  {{ 'grey' if states('sensor.a1_03900d5b1110644_print_status') in ['unavailable','unknown']
                     else 'blue' if states('sensor.a1_03900d5b1110644_print_status') in ['printing','running']
                     else 'green' }}
                tap_action: { action: navigate, navigation_path: /wall-panels/device-bambu }
              - type: custom:mushroom-chips-card
                alignment: start
                chips:
                  - type: entity
                    entity: sensor.a1_03900d5b1110644_print_progress
                    icon: mdi:progress-clock
                  - type: entity
                    entity: sensor.a1_03900d5b1110644_current_stage
                  - type: entity
                    entity: sensor.a1_03900d5b1110644_nozzle_temperature
                    icon: mdi:printer-3d-nozzle-heat
          - type: vertical-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Elegoo Neptune
                secondary: "{{ states('sensor.neptune_print_state') }}"
                icon: mdi:printer-3d-nozzle
                icon_color: >-
                  {{ 'grey' if states('sensor.neptune_printer_status') in ['unavailable','unknown']
                     else 'blue' if states('sensor.neptune_print_state') == 'printing' else 'green' }}
                tap_action: { action: navigate, navigation_path: /wall-panels/device-neptune }
              - type: custom:mushroom-chips-card
                alignment: start
                chips:
                  - type: entity
                    entity: sensor.neptune_print_progress
                    icon: mdi:progress-clock
                  - type: entity
                    entity: sensor.neptune_extruder_temp
                    icon: mdi:printer-3d-nozzle-heat

  # ─────────────────────────────── CONTROL ─────────────────────────────────
  - title: Control
    path: control
    icon: mdi:tune
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Home
            icon: mdi:home
            tap_action:
              action: navigate
              navigation_path: /wall-panels/home
          - type: heading
            heading: Lights & switches
            heading_style: title
          - type: custom:auto-entities
            show_empty: false
            card_param: cards
            card:
              type: grid
              columns: 2
              square: false
            filter:
              include:
                - domain: light
                  options:
                    type: custom:mushroom-light-card
                - domain: fan
                  options:
                    type: custom:mushroom-fan-card
                - domain: switch
                  options:
                    type: custom:mushroom-entity-card
      - type: grid
        cards:
          - type: heading
            heading: Scenes & scripts
            heading_style: title
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              state_color: true
            filter:
              include:
                - domain: scene
                - domain: script
      - type: grid
        cards:
          - type: heading
            heading: Energy
            heading_style: title
          - type: custom:auto-entities
            show_empty: false
            card_param: cards
            card:
              type: grid
              columns: 2
              square: false
            filter:
              include:
                - domain: sensor
                  attributes:
                    device_class: power
                  options:
                    type: custom:mushroom-entity-card
                    icon: mdi:flash
                - domain: sensor
                  attributes:
                    device_class: energy
                  options:
                    type: custom:mushroom-entity-card
                    icon: mdi:lightning-bolt
            sort:
              method: friendly_name
      - type: grid
        cards:
          - type: heading
            heading: Climate
            heading_style: title
          - type: custom:auto-entities
            show_empty: false
            card_param: cards
            card:
              type: grid
              columns: 1
              square: false
            filter:
              include:
                - domain: climate
                  options:
                    type: custom:mushroom-climate-card
      - type: grid
        cards:
          - type: markdown
            content: >
              Controls populate automatically as devices are added. This view
              uses `auto-entities`, so new lights, switches, fans, scenes,
              scripts, energy sensors (Shelly plugs) and climate entities (AC via
              Broadlink) appear here with no edits.

  # ─────────────────────────────── LOCAL ───────────────────────────────────
  # Self-contained local-info tab for the wall tablet (no navigating off the
  # kiosk). Map plots home + person (live once the HA Companion app is attached)
  # + public geo_location feeds (USGS quakes, seeded geo_json_events entry); plus
  # a live rain-radar. The richer version (with hourly forecast) lives on the main
  # dashboard at /lovelace/local. Wave 2/3 add calendar/concerts + surf/tide/cams.
  - title: Local
    path: local
    icon: mdi:map-marker-radius
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Home
            icon: mdi:home
            tap_action: { action: navigate, navigation_path: /wall-panels/home }
          - type: heading
            heading: Map
            heading_style: title
          - type: map
            default_zoom: 9
            aspect_ratio: "1:1"
            geo_location_sources:
              - geo_json_events
            entities:
              - entity: person.kblack0610
              - entity: zone.home
      - type: grid
        cards:
          - type: heading
            heading: Rain radar
            heading_style: title
          - type: iframe
            url: "https://embed.windy.com/embed2.html?lat=32.72&lon=-117.16&detailLat=32.72&detailLon=-117.16&zoom=8&level=surface&overlay=radar&menu=&message=true&marker=&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=default&metricTemp=default&radarRange=-1"
            aspect_ratio: "100%"
      - type: grid
        cards:
          - type: heading
            heading: Surf & tide
            heading_style: title
          - type: custom:mushroom-template-card
            primary: Swell
            secondary: >-
              {% set h = states('sensor.surf_swell_height') %}
              {{ 'Offline' if h in ['unknown','unavailable',''] else h ~ ' ft @ ' ~ states('sensor.surf_swell_period') ~ 's' }}
            icon: mdi:waves
            icon_color: blue
          - type: custom:mushroom-template-card
            primary: Tide
            secondary: >-
              {% set t = states('sensor.san_diego_tides') %}
              {{ 'Offline' if t in ['unknown','unavailable',''] else t }}
            icon: mdi:wave
            icon_color: cyan

  # ────────────────────────────── OPS / FLEET ──────────────────────────────
  # Glanceable homelab + device-fleet status from existing sensors. Offline /
  # low-battery rosters use auto-entities (empty-safe) and auto-populate as
  # iot-fleet ESP32/Pi devices register over MQTT. Heavier bits (embedded
  # Grafana, prometheus integration, watchman, ntfy alerting) are a follow-up.
  - title: Ops
    path: ops
    icon: mdi:server-network
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Home
            icon: mdi:home
            tap_action: { action: navigate, navigation_path: /wall-panels/home }
          - type: heading
            heading: Cluster
            heading_style: title
          - type: custom:mushroom-template-card
            primary: Nodes online
            secondary: "{{ states('sensor.cluster_nodes_online') }} / {{ states('sensor.homelab_total_nodes') }}"
            icon: mdi:kubernetes
            icon_color: "{{ 'green' if states('sensor.cluster_nodes_online') == states('sensor.homelab_total_nodes') else 'orange' }}"
          - type: custom:mushroom-template-card
            primary: Cluster CPU
            secondary: "{{ states('sensor.cluster_cpu_average') }}%"
            icon: mdi:cpu-64-bit
            icon_color: "{{ 'green' if states('sensor.cluster_cpu_average')|float(0) < 80 else 'orange' }}"
          - type: custom:mushroom-template-card
            primary: Cluster RAM
            secondary: "{{ states('sensor.cluster_ram_average') }}%"
            icon: mdi:memory
            icon_color: "{{ 'green' if states('sensor.cluster_ram_average')|float(0) < 85 else 'orange' }}"
          - type: custom:mushroom-template-card
            primary: Macs online
            secondary: "{{ states('sensor.mac_machines_online') }}"
            icon: mdi:apple
            icon_color: blue
      - type: grid
        cards:
          - type: heading
            heading: Node load
            heading_style: title
          - type: custom:mini-graph-card
            name: Node CPU
            hours_to_show: 12
            points_per_hour: 4
            line_width: 2
            entities:
              - { entity: sensor.node_1_cpu, name: n1 }
              - { entity: sensor.node_2_cpu, name: n2 }
              - { entity: sensor.node_3_cpu, name: n3 }
              - { entity: sensor.node_4_cpu, name: n4 }
              - { entity: sensor.node_5_cpu, name: n5 }
      - type: grid
        cards:
          - type: heading
            heading: Services
            heading_style: title
          - type: custom:mushroom-template-card
            primary: Services
            secondary: >-
              {{ (states.binary_sensor | selectattr('attributes.device_class','eq','connectivity') | selectattr('state','eq','on') | list | count) }} up ·
              {{ states('sensor.services_down_count') }} down
            icon: mdi:lan-connect
            icon_color: "{{ 'red' if states('sensor.services_down_count')|int(0) > 0 else 'green' }}"
          # Only renders when something is actually down (show_empty:false).
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              title: Down
              state_color: true
            filter:
              include:
                - domain: binary_sensor
                  attributes: { device_class: connectivity }
                  state: "off"
            sort: { method: friendly_name }
      - type: grid
        cards:
          - type: heading
            heading: Fleet health
            heading_style: title
          # Offline roster — auto-populates as iot-fleet/MQTT devices register.
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              title: Offline / unavailable
              state_color: true
            filter:
              include:
                - { state: unavailable }
                - { state: unknown }
              exclude:
                - entity_id: "*weather*"
                - entity_id: "sun.*"
            sort: { method: friendly_name }
          # Low-battery roster (battery-powered fleet devices).
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              title: Low battery
            filter:
              include:
                - { attributes: { device_class: battery }, state: "< 30" }
            sort: { method: state, numeric: true }

  # ──────────────────────────────── PHOTOS ─────────────────────────────────
  # Full-screen Immich slideshow as a dedicated tab (separate from the idle
  # screensaver). Served by the immich-kiosk app (no auth on LAN).
  - title: Photos
    path: photos
    icon: mdi:image-multiple
    panel: true
    cards:
      - type: iframe
        url: 'https://immich-kiosk.kblab.me?disable_ui=true'
        aspect_ratio: 100%

  # ──────────────────────────────── MEDIA ──────────────────────────────────
  # Jellyfin: the "Open Jellyfin" button works now (web UI). For in-HA control,
  # add the Jellyfin integration (Settings → Devices → Add Integration → Jellyfin
  # → jellyfin.kblab.me + API key) — it creates media_player entities per active
  # session. For playback ON the tablet, install Findroid (Amazon Appstore / F-Droid).
  - title: Media
    path: media
    icon: mdi:play-box-multiple
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Home
            icon: mdi:home
            tap_action: { action: navigate, navigation_path: /wall-panels/home }
          - type: heading
            heading: Jellyfin
            heading_style: title
          - type: custom:mushroom-template-card
            primary: Open Jellyfin
            secondary: Browse & play the library
            icon: mdi:jellyfish
            icon_color: purple
            tap_action: { action: url, url_path: 'https://jellyfin.kblab.me' }
          - type: markdown
            content: >
              **In-HA control** needs the Jellyfin integration added
              (Settings → Devices → Add Integration → Jellyfin). **Playback on this
              tablet**: install Findroid. HA acts as the remote / now-playing.
      - type: grid
        cards:
          - type: heading
            heading: Players
            heading_style: title
          - type: custom:auto-entities
            show_empty: false
            card_param: cards
            card:
              type: grid
              columns: 1
              square: false
            filter:
              include:
                - domain: media_player
                  options:
                    type: custom:mushroom-media-player-card
                    media_controls: [play_pause, next]
                    volume_controls: [volume_buttons]
            sort: { method: friendly_name }

  # ──────────────────────────────── ADMIN ──────────────────────────────────
  # Quick links + system controls. NOTE: visibility is NOT security — this view
  # is shown to everyone for now. Real protection comes in Phase 5: family/guest
  # become NON-ADMIN HA users, so the restart/update actions below are rejected
  # server-side for them regardless of what the UI shows. A PIN popup (cosmetic)
  # + per-profile `visible:` gating land then too.
  # ────────────────────────────── SETTINGS ─────────────────────────────────
  # User-configurable plug metadata. ANY user (non-admin, on the kiosk) can set
  # each plug's room, name, icon, category and whether it's a light. Tapping a
  # plug in the list loads it into the always-visible editor (top); Save writes
  # HA's native registries via the pyscript plug_settings app
  # (config/pyscript/plug_settings.py) — no admin, no browser_mod.
  # The plug list uses custom:button-card because HA core does NOT template
  # tap_action service data; button-card's [[[ ]]] JS does, so it can pass the
  # tapped plug's entity_id to pyscript.plug_load.
  - title: Settings
    path: settings
    icon: mdi:home-edit
    type: sections
    max_columns: 2
    sections:
      # ── Editor (always visible; reflects the plug you tap in the list) ──
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Home
            icon: mdi:home
            tap_action: { action: navigate, navigation_path: /wall-panels/home }
          - type: heading
            heading: Plug Settings
            heading_style: title
          - type: markdown
            content: >
              **Tap a plug below**, then set its **name**, **room**, **icon**,
              **category**, and whether it counts as a **light** — and press
              **Save**. Changes apply everywhere (dashboards + voice).
          - type: custom:mushroom-template-card
            primary: >-
              {% set t = states('input_text.plug_edit_target') %}
              {{ state_attr(t, 'friendly_name') if t not in ['', 'unknown', 'unavailable']
                 else 'No plug selected' }}
            secondary: >-
              {% set t = states('input_text.plug_edit_target') %}
              {{ 'Room: ' ~ (area_name(t) or 'Unassigned') if t not in ['', 'unknown', 'unavailable']
                 else 'Tap a plug in the list below' }}
            icon: >-
              {% set t = states('input_text.plug_edit_target') %}
              {{ state_attr(t, 'icon') or 'mdi:power-plug' if t not in ['', 'unknown', 'unavailable']
                 else 'mdi:cursor-default-click' }}
            icon_color: blue
          - type: entities
            title: Editor
            state_color: true
            entities:
              - entity: input_text.plug_edit_name
              - entity: input_select.plug_edit_room
              - entity: input_text.plug_edit_new_room
              - entity: input_select.plug_edit_category
              - entity: input_text.plug_edit_icon
              - entity: input_boolean.plug_edit_is_light
          - type: custom:mushroom-template-card
            primary: Save changes
            secondary: Writes to the selected plug
            icon: mdi:content-save
            icon_color: green
            tap_action:
              action: call-service
              service: pyscript.plug_apply
              data: {}
      # ── Plug list (tap a plug to load it into the editor above) ──
      - type: grid
        cards:
          - type: heading
            heading: Plugs
            heading_style: title
          - type: custom:auto-entities
            show_empty: false
            card_param: cards
            card:
              type: grid
              columns: 1
              square: false
            filter:
              include:
                - entity_id: switch.*plug*
                  options:
                    type: custom:button-card
                    icon: mdi:power-plug
                    show_label: true
                    size: 28px
                    styles:
                      card: [{ padding: 12px }]
                      grid: [{ grid-template-areas: '"i n" "i l"' }, { grid-template-columns: min-content 1fr }]
                      name: [{ justify-self: start }, { font-weight: bold }]
                      label: [{ justify-self: start }, { color: var(--secondary-text-color) }]
                    name: |
                      [[[ return states[entity.entity_id].attributes.friendly_name || entity.entity_id ]]]
                    label: |
                      [[[
                        var eid = entity.entity_id;
                        var e = hass.entities ? hass.entities[eid] : null;
                        var aid = e ? e.area_id : null;
                        if (!aid && e && e.device_id && hass.devices) { aid = (hass.devices[e.device_id]||{}).area_id; }
                        var a = (aid && hass.areas) ? hass.areas[aid] : null;
                        return (a ? a.name : 'Unassigned') + ' · tap to edit';
                      ]]]
                    tap_action:
                      action: call-service
                      service: pyscript.plug_load
                      service_data:
                        entity_id: "[[[ return entity.entity_id ]]]"
            sort:
              method: friendly_name

  - title: Admin
    path: admin
    icon: mdi:cog
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Home
            icon: mdi:home
            tap_action: { action: navigate, navigation_path: /wall-panels/home }
          - type: heading
            heading: Links
            heading_style: title
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                icon: mdi:chart-areaspline
                content: Grafana
                tap_action: { action: url, url_path: 'https://grafana.kblab.me' }
              - type: template
                icon: mdi:fire
                content: Prometheus
                tap_action: { action: url, url_path: 'https://prometheus.kblab.me' }
              - type: template
                icon: mdi:git
                content: Forgejo
                tap_action: { action: url, url_path: 'https://git.kblab.me' }
              - type: template
                icon: mdi:check-all
                content: Vikunja
                tap_action: { action: url, url_path: 'https://vikunja.kblab.me' }
      - type: grid
        cards:
          - type: heading
            heading: System
            heading_style: title
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              title: Updates
            filter:
              include:
                - domain: update
            sort: { method: friendly_name }
          - type: custom:mushroom-template-card
            primary: Restart Home Assistant
            secondary: Admin only
            icon: mdi:restart
            icon_color: red
            tap_action:
              action: call-service
              service: homeassistant.restart
              confirmation:
                text: Restart Home Assistant now?

  # ── Shared device-detail subviews (subview: true → hidden from the wall's view
  # switcher; reached from the Devices hub above at /wall-panels/device-*). These
  # are the SAME files the main dashboard includes, so the two never drift.
  - !include device_vacuum.yaml
  - !include device_litterbox.yaml
  - !include device_bambu.yaml
  - !include device_neptune.yaml
  - !include device_speakers.yaml
