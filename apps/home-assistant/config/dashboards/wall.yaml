# ─────────────────────────────────────────────────────────────────────────
# Wall-panel dashboard (Phase 5.5 / 1.5) — the kitchen + secondary tablets.
# Custom cards vendored by the `install-lovelace-cards` init container.
#
# Nest-Hub experience: after `idle_time`s of no touch, lovelace-wallpanel fades
# into a fullscreen slideshow of random Immich photos (via the immich-kiosk
# /image endpoint) with a big clock/date overlay — tap to return. While active,
# the Home view is a glanceable hub (clock+weather, status chips, homelab/printer
# tiles, announce, cast media). Empty-safe: device sections use auto-entities and
# fill in as Zigbee/ESPHome land (Phase 5).
#
# Profiles × views: wall tablets log in as NON-ADMIN users → kiosk-mode hides the
# header/sidebar. Admin keeps full chrome; ?disable_km exits. ?kiosk previews it.
# ─────────────────────────────────────────────────────────────────────────
title: Wall

kiosk_mode:
  non_admin_settings:
    kiosk: true

# ── Rotating-photo screensaver (lovelace-wallpanel) ────────────────────────
# image_url MUST carry ?t=${timestamp}: newer wallpanel caches a static URL
# forever, so the cache-buster is what makes immich-kiosk hand back a NEW random
# photo each cycle. HTTPS host (HA is HTTPS → http would be mixed-content blocked).
# The big clock/date is wallpanel's built-in info box (no weather dependency), so
# the screensaver looks right immediately, before Met.no is added.
wallpanel:
  enabled: true
  fullscreen: true
  hide_toolbar: true
  hide_sidebar: true
  idle_time: 20
  display_time: 45
  crossfade_time: 3
  show_progress_bar: false
  image_url: 'https://immich-kiosk.kblab.me/image?t=${timestamp}'
  image_fit_landscape: cover
  image_fit_portrait: contain
  style:
    wallpanel-screensaver-info-box:
      font-size: 9vh
      color: '#ffffff'
      text-shadow: '0 2px 10px rgba(0,0,0,0.7)'

views:
  # ───────────────────────────── HOME / GLANCE ─────────────────────────────
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          # Always-works greeting hero (renders regardless of integrations).
          - type: custom:mushroom-template-card
            primary: >-
              {{ ['Good morning','Good afternoon','Good evening'][0 if now().hour < 12 else 1 if now().hour < 18 else 2] }}
            secondary: '{{ now().strftime("%A %-d %B · %-I:%M %p") }}'
            icon: mdi:tablet-dashboard
            icon_color: blue
            multiline_secondary: true
            tap_action: { action: none }
          # Clock + multi-day forecast hero. Needs the Met.no integration added
          # (Settings → Devices → Add Integration → Met.no) → weather.forecast_home.
          - type: custom:clock-weather-card
            entity: weather.forecast_home
            forecast_rows: 4
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:tune
                content: Controls
                tap_action: { action: navigate, navigation_path: /wall-panels/control }
              - type: template
                icon: mdi:image-multiple
                content: Photos
                tap_action: { action: url, url_path: 'https://immich-kiosk.kblab.me?disable_ui=true' }
              - type: template
                icon: mdi:server-network
                icon_color: blue
                content: "{{ states('sensor.cluster_nodes_online') }}/{{ states('sensor.homelab_total_nodes') }}"
              - type: entity
                entity: sun.sun
                icon: mdi:white-balance-sunny
      - type: grid
        cards:
          - type: heading
            heading: Homelab
            heading_style: title
          - type: custom:mushroom-template-card
            primary: Cluster
            secondary: "{{ states('sensor.cluster_nodes_online') }} nodes · CPU {{ states('sensor.cluster_cpu_average') }}%"
            icon: mdi:kubernetes
            icon_color: "{{ 'green' if states('sensor.cluster_cpu_average')|float(0) < 80 else 'orange' }}"
            tap_action: { action: navigate, navigation_path: /lovelace/ops }
          - type: custom:mushroom-template-card
            primary: Bambu A1
            secondary: "{{ states('sensor.bambu_a1_print_status') }} · {{ states('sensor.bambu_a1_print_progress') }}%"
            icon: mdi:printer-3d-nozzle
            icon_color: "{{ 'blue' if states('sensor.bambu_a1_print_status') not in ['idle','offline','unavailable'] else 'green' }}"
            tap_action: { action: navigate, navigation_path: /lovelace/printing }
          - type: custom:mushroom-template-card
            primary: Neptune
            secondary: "{{ states('sensor.neptune_printer_status') }} · {{ states('sensor.neptune_print_progress') }}%"
            icon: mdi:printer-3d
            icon_color: amber
            tap_action: { action: navigate, navigation_path: /lovelace/printing }
      - type: grid
        cards:
          - type: heading
            heading: Announce
            heading_style: title
          - type: custom:mushroom-entity-card
            entity: input_text.voice_announce_message
            icon: mdi:message-text
          - type: custom:mushroom-select-card
            entity: input_select.voice_announce_language
          - type: custom:mushroom-template-card
            primary: Announce to all speakers
            icon: mdi:bullhorn-variant
            icon_color: amber
            tap_action:
              action: call-service
              service: script.tts_announce_all_cast
              data:
                message: "{{ states('input_text.voice_announce_message') }}"
                language: "{{ states('input_select.voice_announce_language') }}"
      - type: grid
        cards:
          - type: heading
            heading: Speakers & media
            heading_style: title
          - type: custom:auto-entities
            show_empty: false
            card_param: cards
            card:
              type: grid
              columns: 1
              square: false
            filter:
              include:
                - domain: media_player
                  options:
                    type: custom:mushroom-media-player-card
                    media_controls: [play_pause, next]
                    volume_controls: [volume_buttons]
            sort:
              method: friendly_name

  # ─────────────────────────────── CONTROL ─────────────────────────────────
  - title: Control
    path: control
    icon: mdi:tune
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Home
            icon: mdi:home
            tap_action:
              action: navigate
              navigation_path: /wall-panels/home
          - type: heading
            heading: Lights & switches
            heading_style: title
          - type: custom:auto-entities
            show_empty: false
            card_param: cards
            card:
              type: grid
              columns: 2
              square: false
            filter:
              include:
                - domain: light
                  options:
                    type: custom:mushroom-light-card
                - domain: fan
                  options:
                    type: custom:mushroom-fan-card
                - domain: switch
                  options:
                    type: custom:mushroom-entity-card
      - type: grid
        cards:
          - type: heading
            heading: Scenes & scripts
            heading_style: title
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              state_color: true
            filter:
              include:
                - domain: scene
                - domain: script
      - type: grid
        cards:
          - type: markdown
            content: >
              Controls populate automatically as devices are added (Phase 5 —
              Zigbee / ESPHome). This view uses `auto-entities`, so new lights,
              switches, fans, scenes and scripts appear here with no edits.
