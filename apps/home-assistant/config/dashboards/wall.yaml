# ─────────────────────────────────────────────────────────────────────────
# Wall-panel dashboard (Phase 5.5 / 1.5) — the kitchen + secondary tablets.
# Custom cards vendored by the `install-lovelace-cards` init container.
#
# After the idle timeout, lovelace-wallpanel dims the panel to that time of day's
# idle mode: the Home view by day, the Sleep behavior choice at night (see the
# wallpanel block below). While active,
# the Home view is a fixed three-column hub under a nav bar (layout: docs/wall-panels.md
# "Home layout"). Empty-safe: room tiles use auto-entities and fill in as devices
# get an area.
#
# Profiles × views: wall tablets log in as NON-ADMIN users → kiosk-mode hides the
# header/sidebar. Admin keeps full chrome; ?disable_km exits. ?kiosk previews it.
# ─────────────────────────────────────────────────────────────────────────
title: Wall

kiosk_mode:
  non_admin_settings:
    kiosk: true

# ── Clickable control-panel screensaver (lovelace-wallpanel) ──
# wallpanel owns idle on each tablet: its timer starts the screensaver and a touch
# ends it. Which screensaver runs and how bright the panel is come from
# pyscript/wall_idle.py and the per-tablet data in pyscript/wall_panels.yaml, read
# here per tablet through ${browser_id}, the browser_mod Browser ID in its kiosk URL:
#   idle_time           sensor.wall_idle_seconds_<panel>, read at page load
#   screensaver_entity  input_boolean.wall_idle_<panel>, on while idle
#   profile_entity      sensor.wall_screensaver_<panel>, names one of the below
# The screensavers, each one piece the data can pick:
#   scenery -> base config below: apps/wall-ambient (Wikimedia scenery from the
#              "Wall Scenery" album mixed with animated shader scenes) behind
#              FULL-SCREEN controls.
#   family  -> profiles.family: immich-kiosk family photos with the narrow
#              right-hand control column.
#   black   -> profiles.black: solid black.
#   off     -> profiles.off: nothing on top, so the Home view stays visible.
# wallpanel deep-merges a profile into the base config (arrays replace, objects
# merge key by key), so a profile's style must set every key the base style sets,
# or the scenery value leaks into it.
#
# INTERACTION MODEL for scenery and family (black and off end on any tap):
#   - content_interaction: true         -> taps reach the panel cards.
#   - stop_screensaver_on_mouse_click: false / _move: false -> a tap TOGGLES the
#     tile IN PLACE and does NOT drop the screensaver. This is what kills the old
#     "have to click twice" feel (a tap acts directly instead of first dismissing).
#   - The ONLY way out is the "Dashboard" button - it `navigate`s, and
#     stop_screensaver_on_location_change (default true) ends the screensaver and
#     lands on the full Home dashboard = the "admin ui tap in the corner".
# NOTE: do NOT add ?disable_ui=true to the kiosk URL - it also hides kiosk's
# clock/date/metadata overlays (verified via Playwright), not just nav chrome.
wallpanel:
  enabled: true
  fullscreen: true
  hide_toolbar: true
  hide_sidebar: true
  idle_time: "${entity:sensor.wall_idle_seconds_${browser_id}}"
  # No fade in: a tablet that draws slowly never finishes the fade, so its black
  # screensaver stays invisible. Brightness jumps at once anyway.
  fade_in_time: 0
  # window.browser_mod loads with the page; wait for it so ${browser_id} resolves.
  wait_for_browser_mod_time: 5
  # Keep the display awake while the dashboard/screensaver is open (browser Wake
  # Lock API). For a mounted tablet, also set OS/kiosk keep-awake (docs/wall-panels.md).
  keep_screen_on_time: 86400
  show_progress_bar: false
  # Cadence knobs (scenery slides between shader scenes, seconds per shader
  # scene) are query params, documented in apps/wall-ambient/ambient.js.
  image_url: 'iframe+https://wall-ambient.kblab.me/?scenery=4&trippy_secs=45'
  # Clickable panel that stays up on tap; only the Dashboard button exits.
  content_interaction: true
  stop_screensaver_on_mouse_click: false
  stop_screensaver_on_mouse_move: false
  # wallpanel only ends the screensaver when window.location.href CHANGES. The
  # screensaver usually starts on Home, so a Dashboard tap that navigates to the
  # Home it is already on is a no-op and the photos stay up ("works sometimes").
  # Parking the idle screen on a distinct Home URL makes every Dashboard tap a
  # real location change. It also returns an idle panel to Home from any view.
  screensaver_start_navigation_path: /wall-panels/home?kiosk&idle
  screensaver_entity: "input_boolean.wall_idle_${browser_id}"
  profile_entity: "sensor.wall_screensaver_${browser_id}"
  # Scenery layout: two columns across the whole screen, quick actions left and
  # rooms right, below a clear top band where the clock and weather sit.
  cards:
    - type: vertical-stack
      cards:
        - &alert_card !include _home_alert_card.yaml
        # Two big squares side by side, Talk and Dashboard, and the health pill under
        # the mic. A browser with no voice room hides Talk and leaves its cell empty.
        - &actions_card
          type: grid
          columns: 2
          square: false
          cards:
            # Tap-to-talk, reachable without leaving the screensaver.
            - !include _talk_card.yaml
            # Corner "admin" tap, the only exit: navigating off the ?idle URL that
            # screensaver_start_navigation_path parks on ends the screensaver -> Home.
            # Same shape as _talk_card.yaml.
            - type: custom:button-card
              name: Dashboard
              icon: mdi:view-dashboard
              layout: vertical
              tap_action: { action: navigate, navigation_path: /wall-panels/home?kiosk }
              styles:
                card:
                  - height: 130px
                  - padding: 16px
                  - border-radius: 18px
                  - background: rgba(var(--rgb-card-background-color, 255, 255, 255), 0.72)
                  - backdrop-filter: blur(6px)
                  - box-shadow: none
                icon:
                  - width: 64px
                  - color: '#2196f3'
                name:
                  - font-size: 18px
                  - font-weight: 500
            # Overall health: green when nothing is down, red when anything is, grey
            # when the sensor is. services_down_count is the same "down" the phone,
            # the Ops view and the ntfy alert read. Tap opens Ops for the detail.
            - type: custom:button-card
              entity: sensor.services_down_count
              icon: mdi:heart-pulse
              layout: icon_name
              name: >-
                [[[ const n = Number(entity && entity.state);
                    return Number.isNaN(n) ? 'Health' : n > 0 ? n + ' down' : 'All up'; ]]]
              tap_action: { action: navigate, navigation_path: /wall-panels/ops?kiosk }
              styles:
                card:
                  - padding: 6px 12px
                  - border-radius: 14px
                  - background: rgba(var(--rgb-card-background-color, 255, 255, 255), 0.72)
                  - box-shadow: none
                icon:
                  - width: 22px
                  - color: >-
                      [[[ const n = Number(entity && entity.state);
                          return Number.isNaN(n) ? '#9e9e9e' : n > 0 ? '#ff5252' : '#4caf50'; ]]]
                name:
                  - font-size: 14px
                  - justify-self: start
                  - padding-left: 8px
    # Room quick-actions - the SHARED area-driven room layout (one source of truth
    # with the Home view; tap a plug tile to toggle it). Empty rooms auto-hide.
    - &rooms_card
      type: vertical-stack
      cards: !include _rooms_cards.yaml
  style:
    wallpanel-screensaver-info-box:
      position: absolute
      top: '0'
      right: '0'
      bottom: '0'
      left: '0'
      transform: none
      width: 100%
      height: 100%
      margin: '0'
      padding: 22vh 3vw 3vh
      box-sizing: border-box
      display: flex
      flex-direction: column
      justify-content: flex-start
      gap: 12px
      overflow-y: auto
      # Light scrim low on the screen, where the tiles sit, so the scenery stays
      # bright at the top and text stays legible below.
      background: 'linear-gradient(to bottom, rgba(0,0,0,0) 15%, rgba(0,0,0,0.3) 45%, rgba(0,0,0,0.4) 100%)'
      text-shadow: '0 1px 4px rgba(0,0,0,0.85)'
      # Room headings sit on the scenery, not on a card.
      --ha-heading-card-title-color: '#fff'
      # Square room tiles scale with screen HEIGHT, so all four rooms fit a 600px
      # tall Tab M9 as well as an 800px M11, and stop at 120px so a portrait
      # tablet's single wide column fits too (the tile cap in _rooms_cards.yaml).
      --wall-tile-max: min(15vh, 120px)
      # wallpanel sizes every card wrapper from this variable (default 500px),
      # which overflows a grid column; auto lets each card fill its column.
      --wp-card-width: auto
    wallpanel-screensaver-info-box-content:
      display: grid
      width: 100%
      max-width: 100%
      # Even halves on a landscape tablet, one column in portrait (a column needs
      # 420px). A fixed track minimum, not auto, stops a long alert widening its half.
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr))
      gap: 3vw
      align-items: start
  profiles:
    # Family photos, with the narrow translucent control column on the right.
    family:
      image_url: 'iframe+https://immich-kiosk.kblab.me/'
      cards:
        - *alert_card
        - *actions_card
        - *rooms_card
      style:
        wallpanel-screensaver-info-box:
          left: auto
          width: 42%
          padding: 24px
          # Barely-there scrim so the photo shows through the control column; the
          # room/quick-action cards carry their own backgrounds for legibility.
          background: 'linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0.05) 30%)'
          --wp-card-width: 500px
        # A single full-width column (wallpanel defaults it to a centered grid
        # that can overflow a narrow box -> the old "half a card").
        wallpanel-screensaver-info-box-content:
          display: block
          grid-template-columns: none
          gap: normal
          align-items: normal
    black:
      # No photos: blank canvas for the black overlay.
      show_images: false
      # After 1 s in screensaver mode, the overlay goes solid #000.
      black_screen_after_time: 1
      # Single tap anywhere exits back to the dashboard (no "Dashboard" button needed).
      content_interaction: false
      stop_screensaver_on_mouse_click: true
      stop_screensaver_on_mouse_move: false
      # Clear the control column: nothing to show on a black screen.
      cards: []
    # The Home view stays visible under a clear overlay that catches the waking tap.
    "off":
      show_images: false
      content_interaction: false
      stop_screensaver_on_mouse_click: true
      stop_screensaver_on_mouse_move: false
      cards: []
      style:
        wallpanel-screensaver-container:
          background: transparent
        wallpanel-screensaver-info-box:
          background: none

views:
  # ───────────────────────────── HOME / GLANCE ─────────────────────────────
  # A fixed layout so every tablet shows the same thing in the same spot:
  #   header  one even row of nav buttons (destinations only)
  #   NOW     alert, clock + weather, talk, cluster and printer status, announce
  #   ROOMS   the shared area-driven room tiles (_rooms_cards.yaml)
  #   MEDIA   music, then cameras
  # Exactly three sections, so a 3-column tablet fills one row with no holes; a
  # narrower one (2 columns) puts MEDIA under NOW. Keep it at three: a fourth
  # section starts a new row under the tallest column.
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 3
    dense_section_placement: true
    header:
      layout: center
      card:
        type: grid
        columns: 9
        square: false
        cards:
          - &nav
            type: custom:mushroom-template-card
            primary: Controls
            icon: mdi:tune
            icon_color: blue
            layout: vertical
            tap_action: { action: navigate, navigation_path: control }
          - { <<: *nav, primary: Devices, icon: mdi:robot-vacuum, tap_action: { action: navigate, navigation_path: devices } }
          - { <<: *nav, primary: Music, icon: mdi:music, tap_action: { action: navigate, navigation_path: music } }
          - { <<: *nav, primary: Media, icon: mdi:play-box-multiple, tap_action: { action: navigate, navigation_path: media } }
          - { <<: *nav, primary: Local, icon: mdi:map-marker-radius, tap_action: { action: navigate, navigation_path: local } }
          - <<: *nav
            primary: Agents
            icon: mdi:robot
            icon_color: >-
              {{ 'red' if states('sensor.agents_problem') | int(0) > 0
                 else 'amber' if is_state('binary_sensor.agents_need_attention', 'on') else 'blue' }}
            tap_action: { action: navigate, navigation_path: agents }
          - { <<: *nav, primary: Photos, icon: mdi:image-multiple, tap_action: { action: navigate, navigation_path: photos } }
          - { <<: *nav, primary: Settings, icon: mdi:tune, tap_action: { action: navigate, navigation_path: settings } }
          - { <<: *nav, primary: Admin, icon: mdi:cog, icon_color: grey, tap_action: { action: navigate, navigation_path: admin } }
    sections:
      # NOW
      - type: grid
        cards:
          # The current household alert, if any; hidden when there is none.
          - !include _home_alert_card.yaml
          # Clock + forecast. Needs the Met.no integration (weather.forecast_home).
          - type: custom:clock-weather-card
            entity: weather.forecast_home
            forecast_rows: 3
            grid_options: { columns: full }
          - !include _talk_card.yaml
          - type: custom:mushroom-template-card
            primary: Cluster
            secondary: >-
              {{ states('sensor.cluster_nodes_online') }}/{{ states('sensor.homelab_total_nodes') }} nodes ·
              CPU {{ states('sensor.cluster_cpu_average') | float(0) | round(0) | int }}%
            icon: mdi:kubernetes
            icon_color: >-
              {{ 'orange' if states('sensor.cluster_cpu_average') | float(0) >= 80
                 or states('sensor.cluster_nodes_online') | int(0) < states('sensor.homelab_total_nodes') | int(0)
                 else 'green' }}
            tap_action: { action: navigate, navigation_path: ops }
          - type: custom:mushroom-template-card
            primary: 3D printer
            secondary: >-
              {% set s = states('sensor.a1_03900d5b1110644_print_status') %}
              {{ 'Off' if s in ['unavailable', 'unknown'] else s | replace('_', ' ') | capitalize }}
            icon: mdi:printer-3d-nozzle
            icon_color: >-
              {{ 'disabled' if states('sensor.a1_03900d5b1110644_print_status') in ['unavailable', 'unknown'] else 'blue' }}
            tap_action: { action: navigate, navigation_path: device-bambu }
          # Announce, folded away: it is used rarely and takes three rows open.
          - type: custom:expander-card
            title: Announce
            icon: mdi:bullhorn-variant
            expanded: false
            storage-id: home-announce
            grid_options: { columns: full }
            cards:
              - type: custom:mushroom-entity-card
                entity: input_text.voice_announce_message
                icon: mdi:message-text
              - type: custom:mushroom-select-card
                entity: input_select.voice_announce_language
              - type: custom:mushroom-template-card
                primary: Announce to all speakers
                icon: mdi:bullhorn-variant
                icon_color: amber
                tap_action:
                  action: perform-action
                  perform_action: script.tts_announce
      # ROOMS: devices grouped by their HA area, shared with the Overview home view
      # and the screensaver. Tap toggles a plug or opens more-info.
      - type: grid
        cards: !include _rooms_cards.yaml
      # MEDIA: the shared Music and Cameras cards (also on the phone Home), in one
      # section so the layout stays at three sections.
      - type: grid
        cards:
          - !include _music_card.yaml
          - !include _cameras_card.yaml
  - !include view_devices.yaml

  - !include view_control.yaml

  - !include view_local.yaml

  - !include view_ops.yaml

  - !include view_agents.yaml

  # ──────────────────────────────── PHOTOS ─────────────────────────────────
  # Full-screen Immich slideshow as a dedicated tab (separate from the idle
  # screensaver). Served by the immich-kiosk app (no auth on LAN).
  - title: Photos
    path: photos
    icon: mdi:image-multiple
    panel: true
    cards:
      - type: iframe
        url: 'https://immich-kiosk.kblab.me?disable_ui=true'
        aspect_ratio: 100%

  # -------------------------------- MUSIC ---------------------------------
  # One section per Snapcast room. Per room: the Music Assistant player (now
  # playing, play/pause, skip, browse MA's library/radio/Spotify, join other
  # rooms), its volume, and the room's Snapcast client, whose Source picks the
  # stream (Turntable, default, or the MA stream). MA only offers its own
  # streams, so Turntable comes from the Snapcast entity. Source is a GROUP
  # setting: rooms joined into one Snapcast group switch together.
  # No per-tablet "own room first": every tablet logs in as the same HA user, and
  # only wallpanel reads the Browser ID, so a card cannot tell which tablet it is on.
  # A room whose players do not exist yet (kitchen, until the kitchen tablet's
  # Snapcast client connects) shows a note instead of a missing-entity warning;
  # a state condition reads a missing entity as `unavailable`.
  - title: Music
    path: music
    icon: mdi:music
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - !include _home_button.yaml
          - type: heading
            heading: Living Room
            icon: mdi:sofa
          - type: media-control
            entity: media_player.living_room
            grid_options: { columns: full }
          - type: tile
            entity: media_player.living_room
            name: Volume
            hide_state: true
            features_position: inline
            features: [{ type: media-player-volume-slider }]
            grid_options: { columns: full }
          - type: tile
            entity: media_player.living_room_snapcast_client
            name: Source
            icon: mdi:record-player
            hide_state: true
            features_position: inline
            features: [{ type: media-player-source }]
            grid_options: { columns: full }
      - type: grid
        cards:
          - type: heading
            heading: Office
            icon: mdi:briefcase
          - type: media-control
            entity: media_player.office
            grid_options: { columns: full }
          - type: tile
            entity: media_player.office
            name: Volume
            hide_state: true
            features_position: inline
            features: [{ type: media-player-volume-slider }]
            grid_options: { columns: full }
          - type: tile
            entity: media_player.office_snapcast_client
            name: Source
            icon: mdi:record-player
            hide_state: true
            features_position: inline
            features: [{ type: media-player-source }]
            grid_options: { columns: full }
      - type: grid
        cards:
          - type: heading
            heading: Kitchen
            icon: mdi:fridge-outline
          - type: markdown
            content: >-
              Kitchen speaker offline. If the kitchen tablet has never joined
              Snapcast, pull down on it once to reload the page.
            visibility:
              - { condition: state, entity: media_player.kitchen, state: unavailable }
          - type: media-control
            entity: media_player.kitchen
            grid_options: { columns: full }
            visibility:
              - { condition: state, entity: media_player.kitchen, state_not: unavailable }
          - type: tile
            entity: media_player.kitchen
            name: Volume
            hide_state: true
            features_position: inline
            features: [{ type: media-player-volume-slider }]
            grid_options: { columns: full }
            visibility:
              - { condition: state, entity: media_player.kitchen, state_not: unavailable }
          - type: tile
            entity: media_player.kitchen_snapcast_client
            name: Source
            icon: mdi:record-player
            hide_state: true
            features_position: inline
            features: [{ type: media-player-source }]
            grid_options: { columns: full }
            visibility:
              - { condition: state, entity: media_player.kitchen_snapcast_client, state_not: unavailable }

  - !include view_media.yaml

  - !include view_settings.yaml
  - !include view_log.yaml

  # ──────────────────────────────── ADMIN ──────────────────────────────────
  # Quick links + system controls. NOTE: visibility is NOT security — this view
  # is shown to everyone for now. Real protection comes in Phase 5: family/guest
  # become NON-ADMIN HA users, so the restart/update actions below are rejected
  # server-side for them regardless of what the UI shows. A PIN popup (cosmetic)
  # + per-profile `visible:` gating land then too.
  - title: Admin
    path: admin
    icon: mdi:cog
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - !include _home_button.yaml
          # Voice Room: pick which room satellite THIS tablet is (per-browser).
          # Opens the voice_satellite integration panel — set the room + Start,
          # then use the OS back gesture (or Home above) to return to the dashboard.
          # This is how you rotate a tablet to a different room.
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Voice Room
            icon: mdi:microphone-message
            tap_action: { action: navigate, navigation_path: /voice-satellite }
          - type: heading
            heading: Links
            heading_style: title
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                icon: mdi:chart-areaspline
                content: Grafana
                tap_action: { action: url, url_path: 'https://grafana.kblab.me' }
              - type: template
                icon: mdi:fire
                content: Prometheus
                tap_action: { action: url, url_path: 'https://prometheus.kblab.me' }
              - type: template
                icon: mdi:git
                content: Forgejo
                tap_action: { action: url, url_path: 'https://git.kblab.me' }
      - type: grid
        cards:
          - type: heading
            heading: System
            heading_style: title
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              title: Updates
            filter:
              include:
                - domain: update
            sort: { method: friendly_name }
          - type: custom:mushroom-template-card
            primary: Restart Home Assistant
            secondary: Admin only
            icon: mdi:restart
            icon_color: red
            tap_action:
              action: call-service
              service: homeassistant.restart
              confirmation:
                text: Restart Home Assistant now?

  # ── Shared device-detail subviews (subview: true → hidden from the wall's view
  # switcher; reached from the Devices hub above at /wall-panels/device-*). These
  # are the SAME files the main dashboard includes, so the two never drift.
  - !include device_vacuum.yaml
  - !include device_litterbox.yaml
  - !include device_bambu.yaml
  - !include device_neptune.yaml
  - !include device_speakers.yaml
