# ─────────────────────────────────────────────────────────────────────────
# Wall-panel dashboard (Phase 5.5 / 1.5) — the kitchen + secondary tablets.
# Custom cards vendored by the `install-lovelace-cards` init container.
#
# Nest-Hub experience: after `idle_time`s of no touch, lovelace-wallpanel fades
# into a fullscreen slideshow of random Immich photos (via the immich-kiosk
# /image endpoint) with a big clock/date overlay — tap to return. While active,
# the Home view is a glanceable hub (clock+weather, status chips, homelab/printer
# tiles, announce, cast media). Empty-safe: device sections use auto-entities and
# fill in as Zigbee/ESPHome land (Phase 5).
#
# Profiles × views: wall tablets log in as NON-ADMIN users → kiosk-mode hides the
# header/sidebar. Admin keeps full chrome; ?disable_km exits. ?kiosk previews it.
# ─────────────────────────────────────────────────────────────────────────
title: Wall

kiosk_mode:
  non_admin_settings:
    kiosk: true

# ── Clickable control-panel screensaver (lovelace-wallpanel → immich-kiosk) ──
# wallpanel provides the screensaver trigger (idle, fullscreen, keep-awake); the
# photo CONTENT is immich-kiosk's full page via wallpanel's `iframe+` URL mode
# (keeps kiosk's big clock/date + metadata + splitview portrait pairing).
#
# The idle screen is a CLICKABLE panel, not a dead photo: wallpanel's info box is
# a translucent ROOM QUICK-ACTIONS column pinned right (the shared, area-driven
# _rooms_cards layout — tap a plug tile to toggle it), plus a "Dashboard" button.
#
# INTERACTION MODEL (this is the important bit):
#   - content_interaction: true         → taps reach the panel cards.
#   - stop_screensaver_on_mouse_click: false / _move: false → a tap TOGGLES the
#     tile IN PLACE and does NOT drop the screensaver. This is what kills the old
#     "have to click twice" feel (a tap acts directly instead of first dismissing).
#   - The ONLY way out is the "Dashboard" button — it `navigate`s, and
#     stop_screensaver_on_location_change (default true) ends the screensaver and
#     lands on the full Home dashboard = the "admin ui tap in the corner".
#   - screensaver_entity: toggling input_boolean.wall_screensaver starts/stops the
#     frame → the on-dashboard "Screensaver" button + easy testing (idle is 8s).
# NOTE: do NOT add ?disable_ui=true to the kiosk URL — it also hides kiosk's
# clock/date/metadata overlays (verified via Playwright), not just nav chrome.
wallpanel:
  enabled: true
  fullscreen: true
  hide_toolbar: true
  hide_sidebar: true
  idle_time: 8
  # Keep the display awake while the dashboard/screensaver is open (browser Wake
  # Lock API). For a mounted tablet, also set OS/kiosk keep-awake (docs/wall-panels.md).
  keep_screen_on_time: 86400
  show_progress_bar: false
  image_url: 'iframe+https://immich-kiosk.kblab.me/'
  # Clickable panel that stays up on tap; only the Dashboard button exits.
  content_interaction: true
  stop_screensaver_on_mouse_click: false
  stop_screensaver_on_mouse_move: false
  # On-demand start/stop from a dashboard button (and easy testing).
  screensaver_entity: input_boolean.wall_screensaver
  # Night mode (22:00 - 07:00): sensor.wall_mode goes to "night" and wallpanel
  # merges the overrides below, replacing the photo screensaver with a solid-black
  # screen. The mic / wake-word satellite stays alive (no OS screen-off).
  # See: apps/home-assistant/config/packages/wall_night_mode.yaml
  profile_entity: sensor.wall_mode
  profiles:
    night:
      # Longer grace before the screen goes dark.
      idle_time: 60
      # No photos at night — blank canvas for the black overlay.
      show_images: false
      # After 1 s in screensaver mode, the overlay goes solid #000.
      black_screen_after_time: 1
      # Single tap anywhere exits back to the dashboard (no "Dashboard" button needed).
      content_interaction: false
      stop_screensaver_on_mouse_click: true
      stop_screensaver_on_mouse_move: false
      # Clear the right-hand control column: nothing to show on a black screen.
      cards: []
  cards:
    # Corner "admin" tap — the only exit: navigate ends the screensaver → Home.
    - type: custom:mushroom-template-card
      primary: Dashboard
      icon: mdi:view-dashboard
      icon_color: blue
      tap_action: { action: navigate, navigation_path: /wall-panels/home }
      card_mod:
        style: |
          ha-card { background: rgba(20,20,22,0.42); border: none; box-shadow: none; backdrop-filter: blur(3px); }
    # Room quick-actions — the SHARED area-driven room layout (one source of truth
    # with the Home view; tap a plug tile to toggle it). Empty rooms auto-hide.
    - type: vertical-stack
      cards: !include _rooms_cards.yaml
  style:
    # Translucent right-hand control column, full height. Tune width on-tablet.
    wallpanel-screensaver-info-box:
      position: absolute
      top: '0'
      right: '0'
      bottom: '0'
      left: auto
      transform: none
      width: 42%
      height: 100%
      margin: '0'
      padding: 24px
      box-sizing: border-box
      display: flex
      flex-direction: column
      justify-content: flex-start
      gap: 12px
      overflow-y: auto
      # Barely-there scrim so the photo shows through the control column; the
      # room/quick-action cards carry their own backgrounds for legibility.
      background: 'linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0.05) 30%)'
      # Shadow darkens only the text glyphs (headings/labels) so they stay
      # readable over bright photos WITHOUT a photo-blocking scrim.
      text-shadow: '0 1px 4px rgba(0,0,0,0.85)'
    # Force the card container to a single full-width column (wallpanel defaults it
    # to a centered grid that can overflow a narrow box → the old "half a card").
    wallpanel-screensaver-info-box-content:
      display: block
      width: 100%
      max-width: 100%
      grid-template-columns: none

views:
  # ───────────────────────────── HOME / GLANCE ─────────────────────────────
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          # Always-works greeting hero (renders regardless of integrations).
          - type: custom:mushroom-template-card
            primary: >-
              {{ ['Good morning','Good afternoon','Good evening'][0 if now().hour < 12 else 1 if now().hour < 18 else 2] }}
            secondary: '{{ now().strftime("%A %-d %B · %-I:%M %p") }}'
            icon: mdi:tablet-dashboard
            icon_color: blue
            multiline_secondary: true
            tap_action: { action: none }
          # Clock + multi-day forecast hero. Needs the Met.no integration added
          # (Settings → Devices → Add Integration → Met.no) → weather.forecast_home.
          - type: custom:clock-weather-card
            entity: weather.forecast_home
            forecast_rows: 4
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:tune
                content: Controls
                tap_action: { action: navigate, navigation_path: /wall-panels/control }
              - type: template
                icon: mdi:robot-vacuum
                content: Devices
                tap_action: { action: navigate, navigation_path: /wall-panels/devices }
              - type: template
                icon: mdi:map-marker-radius
                content: Local
                tap_action: { action: navigate, navigation_path: /wall-panels/local }
              - type: template
                icon: mdi:robot
                icon_color: >-
                  {{ 'red' if states('sensor.agents_problem') | int(0) > 0
                     else 'amber' if is_state('binary_sensor.agents_need_attention', 'on') else 'blue' }}
                content: Agents
                tap_action: { action: navigate, navigation_path: /wall-panels/agents }
              - type: template
                icon: mdi:image-multiple
                content: Photos
                tap_action: { action: navigate, navigation_path: /wall-panels/photos }
              # Start the photo screensaver on demand (wallpanel binds this entity
              # via screensaver_entity; it flips back off when the frame stops).
              - type: template
                icon: mdi:monitor-screenshot
                content: Screensaver
                tap_action:
                  action: call-service
                  service: input_boolean.turn_on
                  target: { entity_id: input_boolean.wall_screensaver }
              - type: template
                icon: mdi:server-network
                icon_color: blue
                content: "{{ states('sensor.cluster_nodes_online') }}/{{ states('sensor.homelab_total_nodes') }}"
                tap_action: { action: navigate, navigation_path: /wall-panels/ops }
              - type: template
                icon: mdi:play-box-multiple
                content: Media
                tap_action: { action: navigate, navigation_path: /wall-panels/media }
              - type: template
                icon: mdi:home-edit
                content: Settings
                tap_action: { action: navigate, navigation_path: /wall-panels/settings }
              - type: template
                icon: mdi:cog
                content: Admin
                tap_action: { action: navigate, navigation_path: /wall-panels/admin }
              - type: entity
                entity: sun.sun
                icon: mdi:white-balance-sunny
      - type: grid
        cards:
          - type: heading
            heading: Devices
            heading_style: title
          # At-a-glance device status; tap a chip to open its detail page.
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                icon: mdi:robot-vacuum
                content: "{{ states('sensor.tapovacuummop_status') }}"
                icon_color: >-
                  {{ 'red' if states('sensor.tapovacuummop_error') not in ['Ok','unknown','unavailable']
                     else 'green' if is_state('vacuum.tapovacuummop','docked') else 'blue' }}
                tap_action: { action: navigate, navigation_path: /wall-panels/device-vacuum }
              - type: template
                icon: mdi:cat
                content: "{{ states('sensor.cat_litter_box_status') }}"
                icon_color: "{{ 'orange' if is_state('sensor.cat_litter_box_status','Cat_into') else 'blue' }}"
                tap_action: { action: navigate, navigation_path: /wall-panels/device-litterbox }
              - type: template
                icon: mdi:printer-3d-nozzle
                content: >-
                  {% set s = states('sensor.a1_03900d5b1110644_print_status') %}{{ 'off' if s in ['unavailable','unknown'] else s }}
                icon_color: >-
                  {{ 'grey' if states('sensor.a1_03900d5b1110644_print_status') in ['unavailable','unknown'] else 'blue' }}
                tap_action: { action: navigate, navigation_path: /wall-panels/device-bambu }
              - type: template
                icon: mdi:cast-audio-variant
                content: "{{ states.media_player | list | count }} speakers"
                tap_action: { action: navigate, navigation_path: /wall-panels/device-speakers }
      # Rooms — devices grouped by their HA area. Shared with the Overview home
      # view via dashboards/_rooms_cards.yaml (one layout, both dashboards). Tap
      # toggles a plug / opens more-info; live watts are in the Energy section.
      - type: grid
        cards: !include _rooms_cards.yaml
      - type: grid
        cards:
          - type: heading
            heading: Homelab
            heading_style: title
          - type: custom:mushroom-template-card
            primary: Cluster
            secondary: "{{ states('sensor.cluster_nodes_online') }} nodes · CPU {{ states('sensor.cluster_cpu_average') }}%"
            icon: mdi:kubernetes
            icon_color: "{{ 'green' if states('sensor.cluster_cpu_average')|float(0) < 80 else 'orange' }}"
            tap_action: { action: navigate, navigation_path: /wall-panels/ops }
      - type: grid
        cards:
          - type: heading
            heading: Announce
            heading_style: title
          - type: custom:mushroom-entity-card
            entity: input_text.voice_announce_message
            icon: mdi:message-text
          - type: custom:mushroom-select-card
            entity: input_select.voice_announce_language
          - type: custom:mushroom-template-card
            primary: Announce to all speakers
            icon: mdi:bullhorn-variant
            icon_color: amber
            tap_action:
              action: call-service
              service: script.tts_announce_all_cast
              data:
                message: "{{ states('input_text.voice_announce_message') }}"
                language: "{{ states('input_select.voice_announce_language') }}"
  - !include view_devices.yaml

  - !include view_control.yaml

  - !include view_local.yaml

  - !include view_ops.yaml

  - !include view_agents.yaml

  # ──────────────────────────────── PHOTOS ─────────────────────────────────
  # Full-screen Immich slideshow as a dedicated tab (separate from the idle
  # screensaver). Served by the immich-kiosk app (no auth on LAN).
  - title: Photos
    path: photos
    icon: mdi:image-multiple
    panel: true
    cards:
      - type: iframe
        url: 'https://immich-kiosk.kblab.me?disable_ui=true'
        aspect_ratio: 100%

  - !include view_media.yaml

  - !include view_settings.yaml

  # ──────────────────────────────── ADMIN ──────────────────────────────────
  # Quick links + system controls. NOTE: visibility is NOT security — this view
  # is shown to everyone for now. Real protection comes in Phase 5: family/guest
  # become NON-ADMIN HA users, so the restart/update actions below are rejected
  # server-side for them regardless of what the UI shows. A PIN popup (cosmetic)
  # + per-profile `visible:` gating land then too.
  - title: Admin
    path: admin
    icon: mdi:cog
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Home
            icon: mdi:home
            tap_action: { action: navigate, navigation_path: /wall-panels/home }
          # Voice Room: pick which room satellite THIS tablet is (per-browser).
          # Opens the voice_satellite integration panel — set the room + Start,
          # then use the OS back gesture (or Home above) to return to the dashboard.
          # This is how you rotate a tablet to a different room.
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Voice Room
            icon: mdi:microphone-message
            tap_action: { action: navigate, navigation_path: /voice-satellite }
          - type: heading
            heading: Links
            heading_style: title
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                icon: mdi:chart-areaspline
                content: Grafana
                tap_action: { action: url, url_path: 'https://grafana.kblab.me' }
              - type: template
                icon: mdi:fire
                content: Prometheus
                tap_action: { action: url, url_path: 'https://prometheus.kblab.me' }
              - type: template
                icon: mdi:git
                content: Forgejo
                tap_action: { action: url, url_path: 'https://git.kblab.me' }
              - type: template
                icon: mdi:check-all
                content: Vikunja
                tap_action: { action: url, url_path: 'https://vikunja.kblab.me' }
      - type: grid
        cards:
          - type: heading
            heading: System
            heading_style: title
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              title: Updates
            filter:
              include:
                - domain: update
            sort: { method: friendly_name }
          - type: custom:mushroom-template-card
            primary: Restart Home Assistant
            secondary: Admin only
            icon: mdi:restart
            icon_color: red
            tap_action:
              action: call-service
              service: homeassistant.restart
              confirmation:
                text: Restart Home Assistant now?

  # ── Shared device-detail subviews (subview: true → hidden from the wall's view
  # switcher; reached from the Devices hub above at /wall-panels/device-*). These
  # are the SAME files the main dashboard includes, so the two never drift.
  - !include device_vacuum.yaml
  - !include device_litterbox.yaml
  - !include device_bambu.yaml
  - !include device_neptune.yaml
  - !include device_speakers.yaml
