# ─────────────────────────────────────────────────────────────────────────
# Wall-panel dashboard (Phase 5.5 / 1.5) — the kitchen + secondary tablets.
# Custom cards vendored by the `install-lovelace-cards` init container.
#
# Nest-Hub experience: after `idle_time`s of no touch, lovelace-wallpanel fades
# into a fullscreen slideshow of random Immich photos (via the immich-kiosk
# /image endpoint) with a big clock/date overlay — tap to return. While active,
# the Home view is a glanceable hub (clock+weather, status chips, homelab/printer
# tiles, announce, cast media). Empty-safe: device sections use auto-entities and
# fill in as Zigbee/ESPHome land (Phase 5).
#
# Profiles × views: wall tablets log in as NON-ADMIN users → kiosk-mode hides the
# header/sidebar. Admin keeps full chrome; ?disable_km exits. ?kiosk previews it.
# ─────────────────────────────────────────────────────────────────────────
title: Wall

kiosk_mode:
  non_admin_settings:
    kiosk: true

# ── Photo screensaver (lovelace-wallpanel → immich-kiosk full page) ─────────
# wallpanel provides the screensaver trigger (idle, fullscreen, keep-awake,
# tap-dismiss); the CONTENT is immich-kiosk's full page, embedded via wallpanel's
# `iframe+` URL mode. That gives immich-kiosk's NATIVE clock/date + image-metadata
# overlays and automatic side-by-side PORTRAIT PAIRING (KIOSK_LAYOUT=splitview,
# configured on the immich-kiosk deployment). NOTE: do NOT add ?disable_ui=true —
# verified via Playwright that it ALSO hides the clock/date/metadata overlays
# (not just nav chrome). kiosk's nav menu is hover/tap-activated → invisible on a
# wall tablet. content_interaction lets taps reach the page; wallpanel's own
# info-box clock is disabled here (kiosk draws its own).
wallpanel:
  enabled: true
  fullscreen: true
  hide_toolbar: true
  hide_sidebar: true
  idle_time: 20
  # Keep the display awake while the dashboard/screensaver is open (browser Wake
  # Lock API). For a mounted tablet, also set OS/kiosk keep-awake (docs/wall-panels.md).
  keep_screen_on_time: 86400
  show_progress_bar: false
  image_url: 'iframe+https://immich-kiosk.kblab.me/'
  content_interaction: true
  style:
    wallpanel-screensaver-info-box:
      display: none

views:
  # ───────────────────────────── HOME / GLANCE ─────────────────────────────
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          # Always-works greeting hero (renders regardless of integrations).
          - type: custom:mushroom-template-card
            primary: >-
              {{ ['Good morning','Good afternoon','Good evening'][0 if now().hour < 12 else 1 if now().hour < 18 else 2] }}
            secondary: '{{ now().strftime("%A %-d %B · %-I:%M %p") }}'
            icon: mdi:tablet-dashboard
            icon_color: blue
            multiline_secondary: true
            tap_action: { action: none }
          # Clock + multi-day forecast hero. Needs the Met.no integration added
          # (Settings → Devices → Add Integration → Met.no) → weather.forecast_home.
          - type: custom:clock-weather-card
            entity: weather.forecast_home
            forecast_rows: 4
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:tune
                content: Controls
                tap_action: { action: navigate, navigation_path: /wall-panels/control }
              - type: template
                icon: mdi:robot-vacuum
                content: Devices
                tap_action: { action: navigate, navigation_path: /wall-panels/devices }
              - type: template
                icon: mdi:map-marker-radius
                content: Local
                tap_action: { action: navigate, navigation_path: /wall-panels/local }
              - type: template
                icon: mdi:image-multiple
                content: Photos
                tap_action: { action: navigate, navigation_path: /wall-panels/photos }
              - type: template
                icon: mdi:server-network
                icon_color: blue
                content: "{{ states('sensor.cluster_nodes_online') }}/{{ states('sensor.homelab_total_nodes') }}"
                tap_action: { action: navigate, navigation_path: /wall-panels/ops }
              - type: template
                icon: mdi:play-box-multiple
                content: Media
                tap_action: { action: navigate, navigation_path: /wall-panels/media }
              - type: template
                icon: mdi:cog
                content: Admin
                tap_action: { action: navigate, navigation_path: /wall-panels/admin }
              - type: entity
                entity: sun.sun
                icon: mdi:white-balance-sunny
      - type: grid
        cards:
          - type: heading
            heading: Homelab
            heading_style: title
          - type: custom:mushroom-template-card
            primary: Cluster
            secondary: "{{ states('sensor.cluster_nodes_online') }} nodes · CPU {{ states('sensor.cluster_cpu_average') }}%"
            icon: mdi:kubernetes
            icon_color: "{{ 'green' if states('sensor.cluster_cpu_average')|float(0) < 80 else 'orange' }}"
            tap_action: { action: navigate, navigation_path: /lovelace/ops }
          - type: custom:mushroom-template-card
            primary: Bambu A1
            secondary: >-
              {% set s = states('sensor.a1_03900d5b1110644_print_status') %}
              {{ 'Offline' if s in ['unknown','unavailable',''] else s ~ ' · ' ~ states('sensor.a1_03900d5b1110644_print_progress') ~ '%' }}
            icon: mdi:printer-3d-nozzle
            icon_color: >-
              {% set s = states('sensor.a1_03900d5b1110644_print_status') %}
              {{ 'grey' if s in ['unknown','unavailable',''] else 'green' if s == 'idle' else 'blue' }}
            tap_action: { action: navigate, navigation_path: /wall-panels/device-bambu }
          - type: custom:mushroom-template-card
            primary: Neptune
            secondary: >-
              {% set s = states('sensor.neptune_printer_status') %}
              {{ 'Offline' if s in ['unknown','unavailable',''] else s ~ ' · ' ~ states('sensor.neptune_print_progress') ~ '%' }}
            icon: mdi:printer-3d
            icon_color: >-
              {% set s = states('sensor.neptune_printer_status') %}
              {{ 'grey' if s in ['unknown','unavailable',''] else 'amber' }}
            tap_action: { action: navigate, navigation_path: /wall-panels/device-neptune }
      - type: grid
        cards:
          - type: heading
            heading: Announce
            heading_style: title
          - type: custom:mushroom-entity-card
            entity: input_text.voice_announce_message
            icon: mdi:message-text
          - type: custom:mushroom-select-card
            entity: input_select.voice_announce_language
          - type: custom:mushroom-template-card
            primary: Announce to all speakers
            icon: mdi:bullhorn-variant
            icon_color: amber
            tap_action:
              action: call-service
              service: script.tts_announce_all_cast
              data:
                message: "{{ states('input_text.voice_announce_message') }}"
                language: "{{ states('input_select.voice_announce_language') }}"
      - type: grid
        cards:
          - type: heading
            heading: Speakers & media
            heading_style: title
          - type: custom:auto-entities
            show_empty: false
            card_param: cards
            card:
              type: grid
              columns: 1
              square: false
            filter:
              include:
                - domain: media_player
                  options:
                    type: custom:mushroom-media-player-card
                    media_controls: [play_pause, next]
                    volume_controls: [volume_buttons]
            sort:
              method: friendly_name

  # ─────────────────────────────── CONTROL ─────────────────────────────────
  - title: Control
    path: control
    icon: mdi:tune
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Home
            icon: mdi:home
            tap_action:
              action: navigate
              navigation_path: /wall-panels/home
          - type: heading
            heading: Lights & switches
            heading_style: title
          - type: custom:auto-entities
            show_empty: false
            card_param: cards
            card:
              type: grid
              columns: 2
              square: false
            filter:
              include:
                - domain: light
                  options:
                    type: custom:mushroom-light-card
                - domain: fan
                  options:
                    type: custom:mushroom-fan-card
                - domain: switch
                  options:
                    type: custom:mushroom-entity-card
      - type: grid
        cards:
          - type: heading
            heading: Scenes & scripts
            heading_style: title
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              state_color: true
            filter:
              include:
                - domain: scene
                - domain: script
      - type: grid
        cards:
          - type: markdown
            content: >
              Controls populate automatically as devices are added (Phase 5 —
              Zigbee / ESPHome). This view uses `auto-entities`, so new lights,
              switches, fans, scenes and scripts appear here with no edits.

  # ────────────────────────────── DEVICES ──────────────────────────────────
  # Self-contained device control for the wall tablet (no navigating off the
  # kiosk to the main dashboard). Robot vacuum first; add more device sections
  # here as Zigbee/ESPHome land.
  - title: Devices
    path: devices
    icon: mdi:devices
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Home
            icon: mdi:home
            tap_action: { action: navigate, navigation_path: /wall-panels/home }
          - type: heading
            heading: Devices
            heading_style: title
          # Standardized device cards → shared detail subviews at /wall-panels/device-*
          # (the SAME device_*.yaml files the main dashboard uses; included below).
          - type: custom:mushroom-template-card
            primary: Robot Vacuum
            secondary: >-
              {{ states('sensor.tapovacuummop_status') }} ·
              {{ states('sensor.tapovacuummop_battery') }}%
            icon: mdi:robot-vacuum
            icon_color: >-
              {{ 'red' if states('sensor.tapovacuummop_error') not in ['Ok','unknown','unavailable']
                 else 'green' if states('vacuum.tapovacuummop') == 'docked' else 'blue' }}
            tap_action: { action: navigate, navigation_path: /wall-panels/device-vacuum }
          - type: custom:mushroom-template-card
            primary: Litter Box
            secondary: >-
              {{ states('sensor.cat_litter_box_status') }} ·
              {{ states('sensor.cat_litter_box_excretions_per_day') }} today
            icon: mdi:cat
            icon_color: >-
              {{ 'orange' if is_state('sensor.cat_litter_box_status','Cat_into') else 'blue' }}
            tap_action: { action: navigate, navigation_path: /wall-panels/device-litterbox }
          - type: custom:mushroom-template-card
            primary: Bambu A1
            secondary: >-
              {{ states('sensor.a1_03900d5b1110644_print_status') }} ·
              {{ states('sensor.a1_03900d5b1110644_print_progress') }}%
            icon: mdi:printer-3d-nozzle
            icon_color: >-
              {{ 'blue' if states('sensor.a1_03900d5b1110644_print_status') in ['printing','running']
                 else 'green' if states('sensor.a1_03900d5b1110644_print_status') in ['finish','idle'] else 'grey' }}
            tap_action: { action: navigate, navigation_path: /wall-panels/device-bambu }
          - type: custom:mushroom-template-card
            primary: Elegoo Neptune
            secondary: >-
              {{ states('sensor.neptune_print_state') }} ·
              {{ states('sensor.neptune_print_progress') }}%
            icon: mdi:printer-3d-nozzle
            icon_color: >-
              {{ 'grey' if states('sensor.neptune_printer_status') in ['unavailable','unknown']
                 else 'blue' if states('sensor.neptune_print_state') == 'printing' else 'green' }}
            tap_action: { action: navigate, navigation_path: /wall-panels/device-neptune }
          - type: custom:mushroom-template-card
            primary: Speakers
            secondary: '{{ states.media_player | list | count }} cast device(s)'
            icon: mdi:cast-audio-variant
            icon_color: >-
              {{ 'blue' if states.media_player | selectattr('state','eq','playing') | list | count > 0
                 else 'grey' }}
            tap_action: { action: navigate, navigation_path: /wall-panels/device-speakers }

  # ─────────────────────────────── LOCAL ───────────────────────────────────
  # Self-contained local-info tab for the wall tablet (no navigating off the
  # kiosk). Map plots home + person (live once the HA Companion app is attached)
  # + public geo_location feeds (USGS quakes, seeded geo_json_events entry); plus
  # a live rain-radar. The richer version (with hourly forecast) lives on the main
  # dashboard at /lovelace/local. Wave 2/3 add calendar/concerts + surf/tide/cams.
  - title: Local
    path: local
    icon: mdi:map-marker-radius
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Home
            icon: mdi:home
            tap_action: { action: navigate, navigation_path: /wall-panels/home }
          - type: heading
            heading: Map
            heading_style: title
          - type: map
            default_zoom: 9
            aspect_ratio: "1:1"
            geo_location_sources:
              - geo_json_events
            entities:
              - entity: person.kblack0610
              - entity: zone.home
      - type: grid
        cards:
          - type: heading
            heading: Rain radar
            heading_style: title
          - type: iframe
            url: "https://embed.windy.com/embed2.html?lat=32.72&lon=-117.16&detailLat=32.72&detailLon=-117.16&zoom=8&level=surface&overlay=radar&menu=&message=true&marker=&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=default&metricTemp=default&radarRange=-1"
            aspect_ratio: "100%"
      - type: grid
        cards:
          - type: heading
            heading: Surf & tide
            heading_style: title
          - type: custom:mushroom-template-card
            primary: Swell
            secondary: >-
              {% set h = states('sensor.surf_swell_height') %}
              {{ 'Offline' if h in ['unknown','unavailable',''] else h ~ ' ft @ ' ~ states('sensor.surf_swell_period') ~ 's' }}
            icon: mdi:waves
            icon_color: blue
          - type: custom:mushroom-template-card
            primary: Tide
            secondary: >-
              {% set t = states('sensor.san_diego_tides') %}
              {{ 'Offline' if t in ['unknown','unavailable',''] else t }}
            icon: mdi:wave
            icon_color: cyan

  # ────────────────────────────── OPS / FLEET ──────────────────────────────
  # Glanceable homelab + device-fleet status from existing sensors. Offline /
  # low-battery rosters use auto-entities (empty-safe) and auto-populate as
  # iot-fleet ESP32/Pi devices register over MQTT. Heavier bits (embedded
  # Grafana, prometheus integration, watchman, ntfy alerting) are a follow-up.
  - title: Ops
    path: ops
    icon: mdi:server-network
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Home
            icon: mdi:home
            tap_action: { action: navigate, navigation_path: /wall-panels/home }
          - type: heading
            heading: Cluster
            heading_style: title
          - type: custom:mushroom-template-card
            primary: Nodes online
            secondary: "{{ states('sensor.cluster_nodes_online') }} / {{ states('sensor.homelab_total_nodes') }}"
            icon: mdi:kubernetes
            icon_color: "{{ 'green' if states('sensor.cluster_nodes_online') == states('sensor.homelab_total_nodes') else 'orange' }}"
          - type: custom:mushroom-template-card
            primary: Cluster CPU
            secondary: "{{ states('sensor.cluster_cpu_average') }}%"
            icon: mdi:cpu-64-bit
            icon_color: "{{ 'green' if states('sensor.cluster_cpu_average')|float(0) < 80 else 'orange' }}"
          - type: custom:mushroom-template-card
            primary: Cluster RAM
            secondary: "{{ states('sensor.cluster_ram_average') }}%"
            icon: mdi:memory
            icon_color: "{{ 'green' if states('sensor.cluster_ram_average')|float(0) < 85 else 'orange' }}"
          - type: custom:mushroom-template-card
            primary: Macs online
            secondary: "{{ states('sensor.mac_machines_online') }}"
            icon: mdi:apple
            icon_color: blue
      - type: grid
        cards:
          - type: heading
            heading: Node load
            heading_style: title
          - type: custom:mini-graph-card
            name: Node CPU
            hours_to_show: 12
            points_per_hour: 4
            line_width: 2
            entities:
              - { entity: sensor.node_1_cpu, name: n1 }
              - { entity: sensor.node_2_cpu, name: n2 }
              - { entity: sensor.node_3_cpu, name: n3 }
              - { entity: sensor.node_4_cpu, name: n4 }
              - { entity: sensor.node_5_cpu, name: n5 }
      - type: grid
        cards:
          - type: heading
            heading: Printers
            heading_style: title
          - type: custom:mushroom-template-card
            primary: Bambu A1
            secondary: >-
              {% set s = states('sensor.a1_03900d5b1110644_print_status') %}
              {{ 'Offline' if s in ['unknown','unavailable',''] else s ~ ' · ' ~ states('sensor.a1_03900d5b1110644_print_progress') ~ '%' }}
            icon: mdi:printer-3d-nozzle
            icon_color: >-
              {% set s = states('sensor.a1_03900d5b1110644_print_status') %}
              {{ 'grey' if s in ['unknown','unavailable',''] else 'green' if s == 'idle' else 'blue' }}
          - type: custom:mushroom-template-card
            primary: Neptune
            secondary: >-
              {% set s = states('sensor.neptune_printer_status') %}
              {{ 'Offline' if s in ['unknown','unavailable',''] else s ~ ' · ' ~ states('sensor.neptune_print_progress') ~ '%' }}
            icon: mdi:printer-3d
            icon_color: >-
              {% set s = states('sensor.neptune_printer_status') %}
              {{ 'grey' if s in ['unknown','unavailable',''] else 'amber' }}
      - type: grid
        cards:
          - type: heading
            heading: Services
            heading_style: title
          - type: custom:mushroom-template-card
            primary: Services
            secondary: >-
              {{ (states.binary_sensor | selectattr('attributes.device_class','eq','connectivity') | selectattr('state','eq','on') | list | count) }} up ·
              {{ states('sensor.services_down_count') }} down
            icon: mdi:lan-connect
            icon_color: "{{ 'red' if states('sensor.services_down_count')|int(0) > 0 else 'green' }}"
          # Only renders when something is actually down (show_empty:false).
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              title: Down
              state_color: true
            filter:
              include:
                - domain: binary_sensor
                  attributes: { device_class: connectivity }
                  state: "off"
            sort: { method: friendly_name }
      - type: grid
        cards:
          - type: heading
            heading: Fleet health
            heading_style: title
          # Offline roster — auto-populates as iot-fleet/MQTT devices register.
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              title: Offline / unavailable
              state_color: true
            filter:
              include:
                - { state: unavailable }
                - { state: unknown }
              exclude:
                - entity_id: "*weather*"
                - entity_id: "sun.*"
            sort: { method: friendly_name }
          # Low-battery roster (battery-powered fleet devices).
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              title: Low battery
            filter:
              include:
                - { attributes: { device_class: battery }, state: "< 30" }
            sort: { method: state, numeric: true }

  # ──────────────────────────────── PHOTOS ─────────────────────────────────
  # Full-screen Immich slideshow as a dedicated tab (separate from the idle
  # screensaver). Served by the immich-kiosk app (no auth on LAN).
  - title: Photos
    path: photos
    icon: mdi:image-multiple
    panel: true
    cards:
      - type: iframe
        url: 'https://immich-kiosk.kblab.me?disable_ui=true'
        aspect_ratio: 100%

  # ──────────────────────────────── MEDIA ──────────────────────────────────
  # Jellyfin: the "Open Jellyfin" button works now (web UI). For in-HA control,
  # add the Jellyfin integration (Settings → Devices → Add Integration → Jellyfin
  # → jellyfin.kblab.me + API key) — it creates media_player entities per active
  # session. For playback ON the tablet, install Findroid (Amazon Appstore / F-Droid).
  - title: Media
    path: media
    icon: mdi:play-box-multiple
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Home
            icon: mdi:home
            tap_action: { action: navigate, navigation_path: /wall-panels/home }
          - type: heading
            heading: Jellyfin
            heading_style: title
          - type: custom:mushroom-template-card
            primary: Open Jellyfin
            secondary: Browse & play the library
            icon: mdi:jellyfish
            icon_color: purple
            tap_action: { action: url, url_path: 'https://jellyfin.kblab.me' }
          - type: markdown
            content: >
              **In-HA control** needs the Jellyfin integration added
              (Settings → Devices → Add Integration → Jellyfin). **Playback on this
              tablet**: install Findroid. HA acts as the remote / now-playing.
      - type: grid
        cards:
          - type: heading
            heading: Players
            heading_style: title
          - type: custom:auto-entities
            show_empty: false
            card_param: cards
            card:
              type: grid
              columns: 1
              square: false
            filter:
              include:
                - domain: media_player
                  options:
                    type: custom:mushroom-media-player-card
                    media_controls: [play_pause, next]
                    volume_controls: [volume_buttons]
            sort: { method: friendly_name }

  # ──────────────────────────────── ADMIN ──────────────────────────────────
  # Quick links + system controls. NOTE: visibility is NOT security — this view
  # is shown to everyone for now. Real protection comes in Phase 5: family/guest
  # become NON-ADMIN HA users, so the restart/update actions below are rejected
  # server-side for them regardless of what the UI shows. A PIN popup (cosmetic)
  # + per-profile `visible:` gating land then too.
  - title: Admin
    path: admin
    icon: mdi:cog
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Home
            icon: mdi:home
            tap_action: { action: navigate, navigation_path: /wall-panels/home }
          - type: heading
            heading: Links
            heading_style: title
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                icon: mdi:chart-areaspline
                content: Grafana
                tap_action: { action: url, url_path: 'https://grafana.kblab.me' }
              - type: template
                icon: mdi:fire
                content: Prometheus
                tap_action: { action: url, url_path: 'https://prometheus.kblab.me' }
              - type: template
                icon: mdi:git
                content: Forgejo
                tap_action: { action: url, url_path: 'https://git.kblab.me' }
              - type: template
                icon: mdi:check-all
                content: Vikunja
                tap_action: { action: url, url_path: 'https://vikunja.kblab.me' }
      - type: grid
        cards:
          - type: heading
            heading: System
            heading_style: title
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              title: Updates
            filter:
              include:
                - domain: update
            sort: { method: friendly_name }
          - type: custom:mushroom-template-card
            primary: Restart Home Assistant
            secondary: Admin only
            icon: mdi:restart
            icon_color: red
            tap_action:
              action: call-service
              service: homeassistant.restart
              confirmation:
                text: Restart Home Assistant now?

  # ── Shared device-detail subviews (subview: true → hidden from the wall's view
  # switcher; reached from the Devices hub above at /wall-panels/device-*). These
  # are the SAME files the main dashboard includes, so the two never drift.
  - !include device_vacuum.yaml
  - !include device_litterbox.yaml
  - !include device_bambu.yaml
  - !include device_neptune.yaml
  - !include device_speakers.yaml
