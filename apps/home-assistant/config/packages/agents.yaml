# Agent fleet rollups for the dashboards, and the phone overview widget.
# The per-agent entities are NOT defined here: sensor.agent_<runner>, sensor.agent_watch_<name>,
# sensor.agent_asks_open, sensor.agent_sessions and sensor.agent_overview come from MQTT discovery, published by
# agent-mqtt-publish on the workstation (dotfiles). Runners are the ones carrying a
# `last_outcome` attribute; watches are sensor.agent_watch_*.
template:
  - sensor:
      - name: Agents working
        unique_id: agents_working
        icon: mdi:robot-outline
        state: >-
          {{ states.sensor | selectattr('attributes.last_outcome', 'defined')
             | selectattr('state', 'eq', 'working') | list | count
             + (state_attr('sensor.agent_sessions', 'working') | int(0)) }}

      # A runner whose last run errored, or a sentinel watch that is tripped.
      - name: Agents problem
        unique_id: agents_problem
        icon: mdi:robot-dead-outline
        state: >-
          {{ (states.sensor | selectattr('attributes.last_outcome', 'defined')
              | selectattr('state', 'eq', 'error') | list | count)
           + (states.sensor | selectattr('entity_id', 'match', 'sensor\.agent_watch_')
              | selectattr('state', 'in', ['TRIP', 'ERROR']) | list | count) }}
        attributes:
          names: >-
            {{ ((states.sensor | selectattr('attributes.last_outcome', 'defined')
                 | selectattr('state', 'eq', 'error') | list)
              + (states.sensor | selectattr('entity_id', 'match', 'sensor\.agent_watch_')
                 | selectattr('state', 'in', ['TRIP', 'ERROR']) | list))
               | map(attribute='object_id') | map('replace', 'agent_watch_', '')
               | map('replace', 'agent_', '') | list }}

      # The phone home-screen Template widget: {{ state_attr('sensor.agent_widget', 'html') }}.
      # The HTML is an attribute because a state over 255 chars is rejected outright, and it is
      # rendered here so the widget stays one expression and any format change lands without
      # retyping it on the phone. Layout: custom_templates/phone_widget.jinja.
      - name: Agent widget
        unique_id: agent_widget
        icon: mdi:cellphone-text
        state: >-
          {% set s = [states('sensor.system_health'), states('sensor.agent_overview')] %}
          {{ 'critical' if 'critical' in s else 'ok' if s == ['ok', 'ok'] else 'warn' }}
        attributes:
          html: >-
            {% from 'phone_widget.jinja' import widget %}{{ widget() }}

  - binary_sensor:
      # Something wants the human: a problem above, an open ask, or a live session flagged `!`.
      - name: Agents need attention
        unique_id: agents_attention
        icon: mdi:account-alert
        state: >-
          {{ states('sensor.agents_problem') | int(0) > 0
             or states('sensor.agent_asks_open') | int(0) > 0
             or state_attr('sensor.agent_sessions', 'attention') | int(0) > 0 }}

# Claude spend over a rolling 24h, from the OTel metrics every session exports
# (Alloy -> Prometheus). service_name=claude-agentctl is the headless runners.
rest:
  # System health, the rows the waybar health chip reads: every domain's level plus what is not ok
  # inside it, in `result` for the widget to render (a state stops at 255 chars). The query is
  # {__name__=~"cc:(overall_status|domain_status)"} or {__name__=~"cc:(watch_state|component_status|red_now)"} > 0
  - resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=%7B__name__%3D~%22cc%3A(overall_status%7Cdomain_status)%22%7D%20or%20%7B__name__%3D~%22cc%3A(watch_state%7Ccomponent_status%7Cred_now)%22%7D%20%3E%200"
    scan_interval: 60
    sensor:
      - name: System health
        unique_id: system_health
        icon: mdi:heart-pulse
        json_attributes_path: "$.data"
        json_attributes:
          - result
        value_template: >-
          {% set o = value_json.data.result | selectattr('metric.__name__', 'eq', 'cc:overall_status')
                      | map(attribute='value') | map('last') | first | default('') %}
          {{ {'0': 'ok', '1': 'warn', '2': 'critical'}.get(o, 'unknown') }}

  - resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=cc%3Aclaude_code_cost_24h_usd%3Aby_service"
    scan_interval: 300
    sensor:
      - name: Agent cost 24h
        unique_id: agent_cost_24h
        icon: mdi:currency-usd
        unit_of_measurement: USD
        state_class: measurement
        value_template: >-
          {{ value_json.data.result | map(attribute='value') | map('last')
             | map('float', 0) | sum | round(2) }}
      - name: Agent cost 24h headless
        unique_id: agent_cost_24h_headless
        icon: mdi:robot-outline
        unit_of_measurement: USD
        state_class: measurement
        value_template: >-
          {{ value_json.data.result | selectattr('metric.service_name', 'eq', 'claude-agentctl')
             | map(attribute='value') | map('last') | map('float', 0) | sum | round(2) }}

  # Claude account room, from claude-acct's textfile (claude_acct.prom, every 15 min), Claude
  # accounts only: the same metrics carry the codex and LiteLLM sources under other kinds.
  # "alt 7% bnb 85%! main 95%! max4 72%!": `!` is no room, the published room verdict
  # (over its weekly pace or into its reserve).
  - resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=%7B__name__%3D~%22claude_account_%28week_used_percent%7Croom%29%22%2Ckind%3D%22claude%22%7D"
    scan_interval: 300
    sensor:
      - name: Agent accounts
        unique_id: agent_accounts
        icon: mdi:account-clock
        value_template: >-
          {% set r = value_json.data.result %}
          {% set ns = namespace(o=[]) %}
          {% for a in r | selectattr('metric.__name__', 'eq', 'claude_account_week_used_percent')
                        | sort(attribute='metric.account') %}
          {% set room = r | selectattr('metric.__name__', 'eq', 'claude_account_room')
                          | selectattr('metric.account', 'eq', a.metric.account)
                          | map(attribute='value') | map('last') | first | default('1') %}
          {% set ns.o = ns.o + [a.metric.account ~ ' ' ~ (a.value[1] | float(0) | round(0) | int)
                                ~ '%' ~ ('!' if room == '0' else '')] %}
          {% endfor %}
          {{ ns.o | join(' ') }}
