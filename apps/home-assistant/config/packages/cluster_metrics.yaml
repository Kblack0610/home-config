rest:
  - resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=100-(avg%20by(instance)(rate(node_cpu_seconds_total%7Binstance%3D%22192.168.1.20%3A9100%22%2Cmode%3D%22idle%22%7D%5B2m%5D))*100)"
    scan_interval: 30
    sensor:
      - name: Node 1 CPU
        unique_id: node_1_cpu
        unit_of_measurement: "%"
        value_template: >-
          {% if value_json.data.result | count > 0 %}
            {{ value_json.data.result[0].value[1] | float(0) | round(1) }}
          {% else %}
            unknown
          {% endif %}
  - resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=(1-node_memory_MemAvailable_bytes%7Binstance%3D%22192.168.1.20%3A9100%22%7D/node_memory_MemTotal_bytes%7Binstance%3D%22192.168.1.20%3A9100%22%7D)*100"
    scan_interval: 30
    sensor:
