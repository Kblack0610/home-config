# Wave 3 — Surf & tide data for the Local dashboard (San Diego coast).
# Low-maintenance by design: free public APIs, no keys, matching the existing
# REST-sensor pattern in packages/site_status.yaml.
#
# SURF: Open-Meteo Marine API (free, no key). The query point is offshore
# Point Loma / Ocean Beach (public ocean coords, not home) — the API snaps to
# the nearest marine grid cell, so it must sit in the water or it returns null.
# `length_unit=imperial` → feet; periods in seconds, directions in degrees.
rest:
  - resource: "https://marine-api.open-meteo.com/v1/marine?latitude=32.75&longitude=-117.27&current=wave_height,wave_period,wave_direction,swell_wave_height,swell_wave_period,swell_wave_direction&length_unit=imperial&timezone=America%2FLos_Angeles"
    scan_interval: 1800   # 30 min — marine model updates hourly
    sensor:
      - name: "Surf Swell Height"
        unique_id: surf_swell_height
        value_template: "{{ value_json.current.swell_wave_height }}"
        unit_of_measurement: "ft"
        state_class: measurement
        icon: mdi:waves
      - name: "Surf Swell Period"
        unique_id: surf_swell_period
        value_template: "{{ value_json.current.swell_wave_period }}"
        unit_of_measurement: "s"
        state_class: measurement
        icon: mdi:timer-outline
      - name: "Surf Swell Direction"
        unique_id: surf_swell_direction
        value_template: "{{ value_json.current.swell_wave_direction }}"
        unit_of_measurement: "°"
        icon: mdi:compass-outline
      - name: "Surf Wave Height"
        unique_id: surf_wave_height
        value_template: "{{ value_json.current.wave_height }}"
        unit_of_measurement: "ft"
        state_class: measurement
        icon: mdi:waves
      - name: "Surf Wave Period"
        unique_id: surf_wave_period
        value_template: "{{ value_json.current.wave_period }}"
        unit_of_measurement: "s"
        state_class: measurement
        icon: mdi:timer-outline

  # TIDES: NOAA CO-OPS predictions as a RESILIENT REST sensor (no key).
  # Station 9410170 = San Diego (Broadway Pier). Deliberately NOT the built-in
  # `noaa_tides` integration: that validates the station at setup and fails
  # PERMANENTLY (until an HA restart) if NOAA's API is down at boot. A REST
  # sensor instead just goes `unavailable` on an outage and self-heals on the
  # next poll. State = next hi/lo tide; today's full schedule is in attributes.
  # (NOAA `date=today` covers the current day, so late-night the "next" briefly
  # reads unknown until midnight — acceptable.)
  - resource: "https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?station=9410170&product=predictions&datum=MLLW&time_zone=lst_ldt&interval=hilo&units=english&format=json&date=today"
    scan_interval: 21600   # 6h — daily hi/lo predictions are static
    sensor:
      - name: "San Diego Tides"
        unique_id: san_diego_tides
        icon: mdi:wave
        value_template: >-
          {% set preds = value_json.predictions | default([], true) %}
          {% set ns = namespace(next=none) %}
          {% for p in preds %}
            {% if ns.next is none and as_timestamp(strptime(p.t, '%Y-%m-%d %H:%M')) > as_timestamp(now()) %}
              {% set ns.next = p %}
            {% endif %}
          {% endfor %}
          {% if ns.next is not none %}{{ 'High' if ns.next.type == 'H' else 'Low' }} {{ '%.1f'|format(ns.next.v|float(0)) }} ft @ {{ as_timestamp(strptime(ns.next.t, '%Y-%m-%d %H:%M')) | timestamp_custom('%-I:%M %p') }}{% else %}unknown{% endif %}
        json_attributes:
          - predictions
