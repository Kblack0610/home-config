# Plug settings — the editable-UI half of the wall-panel Settings view.
#
# A FIXED set of "staging" helpers holds the plug currently being edited, so the
# inline editor auto-scales to any number of plugs (only the target pointer
# changes). On the wall Settings view, tapping a plug calls pyscript.plug_load,
# which fills these helpers from the plug's current registry metadata; the helpers
# are rendered as an always-visible editor block; Save calls pyscript.plug_apply,
# which writes them back to HA's native registries. No browser_mod dependency.
#
# input_select options here are just the seed palette; pyscript.plug_load
# refreshes the Room list from live areas and the Category list from labels each
# time a plug is loaded.

input_text:
  plug_edit_target:
    name: Plug being edited (entity_id)
    max: 255
    icon: mdi:identifier
  plug_edit_name:
    name: Name
    max: 255
    icon: mdi:rename-box
  plug_edit_icon:
    name: Icon (mdi:...)
    max: 64
    icon: mdi:emoticon-outline
  plug_edit_new_room:
    name: New room (optional)
    max: 64
    icon: mdi:home-plus

input_select:
  plug_edit_room:
    name: Room
    icon: mdi:floor-plan
    options:
      - Unassigned
      - Living Room
      - Kitchen
      - Bedroom
      - Office
      - Garage
      - Bathroom
  plug_edit_category:
    name: Category
    icon: mdi:shape-outline
    options:
      - "—"
      - Lamp
      - Appliance
      - Fan
      - Heater
      - Printer

input_boolean:
  plug_edit_is_light:
    name: Treat as a light
    icon: mdi:lightbulb
