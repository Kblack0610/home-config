# Voice targets: spoken announcements on the house speakers.
#
# The house speakers are Music Assistant players (Snapcast rooms). The script
# speaks through the Google Translate TTS entity from the onboarding config
# entry, with announce: true so Music Assistant pauses the music and resumes it.
# Dashboards call script.tts_announce with no data; it reads the two helpers.

input_text:
  voice_announce_message:
    name: Announce message
    initial: "Homelab announcement"
    max: 240

input_select:
  voice_announce_language:
    name: Language
    options:
      - en
      - es
      - es-419
    initial: en
    icon: mdi:translate

script:
  tts_announce:
    alias: TTS Announce
    description: >-
      Speak a message on the house speakers. With no data it speaks the
      Announce message helper, in the Language helper, on every available room.
    mode: parallel
    max: 10
    fields:
      target:
        description: media_player entity_id(s) to speak on. Default is every available house room.
        example: media_player.office
      message:
        description: What to say. Default is input_text.voice_announce_message.
        example: "Dinner is ready."
      language:
        description: TTS language code. Default is input_select.voice_announce_language.
        example: en
    sequence:
      - variables:
          # The house rooms. Unavailable players are skipped so one dead room
          # does not fail the whole announcement.
          rooms:
            - media_player.kitchen
            - media_player.living_room
            - media_player.audio_bedroom
            - media_player.office
          players: >-
            {{ target if target is defined and target
               else rooms | reject('is_state', ['unavailable', 'unknown']) | list }}
          msg: >-
            {{ message if message is defined and message
               else states('input_text.voice_announce_message') }}
          lang: >-
            {{ language if language is defined and language
               else states('input_select.voice_announce_language') }}
      - condition: template
        value_template: "{{ players | count > 0 and msg | length > 0 }}"
      - action: media_player.play_media
        target:
          entity_id: "{{ players }}"
        data:
          media_content_id: >-
            media-source://tts/tts.google_translate_en_com?message={{ msg | urlencode }}&language={{ lang }}
          media_content_type: music
          announce: true
