# Wall-panel idle helpers, and reloading the panels after a restart. The behaviour
# and the per-tablet data are in pyscript/wall_idle.py and pyscript/wall_panels.yaml.
#
# wallpanel binds input_boolean.wall_idle_<panel> via screensaver_entity: on while
# that tablet's screensaver runs. Turning one off wakes that tablet.
input_boolean:
  wall_idle_wall_bedroom:
    name: Wall idle bedroom
    icon: mdi:sleep
  wall_idle_wall_office:
    name: Wall idle office
    icon: mdi:sleep
  wall_idle_wall_kitchen:
    name: Wall idle kitchen
    icon: mdi:sleep
  wall_idle_wall_living_room:
    name: Wall idle living room
    icon: mdi:sleep
  # Settings view: on keeps every panel at Brightness with no screensaver, day and night.
  wall_keep_screen_on:
    name: Keep screen on
    icon: mdi:monitor-eye

# Settings view controls for all four panels. No `initial`: it would reset the
# value on every restart. wall_idle.py seeds them once from wall_panels.yaml.
input_number:
  wall_brightness:
    name: Brightness
    icon: mdi:brightness-6
    min: 5
    max: 100
    step: 5
    mode: slider
    unit_of_measurement: "%"

input_datetime:
  wall_night_start:
    name: Night starts
    icon: mdi:weather-night
    has_date: false
    has_time: true
  wall_night_end:
    name: Night ends
    icon: mdi:weather-sunny
    has_date: false
    has_time: true

# What an idle panel does at night. Only what every tablet can do is listed.
input_select:
  wall_sleep_behavior:
    name: Sleep behavior
    icon: mdi:weather-night
    options:
      - Black screensaver
      - Dim view

# A tablet keeps the dashboard it loaded until its page reloads, so a wall.yaml
# change (which restarts HA) never reaches a panel by itself. Once wall_idle.py has
# published the panels' settings, press the FreeKiosk MQTT `reload` button of every
# panel that has one. Panels are found by device model "(FreeKiosk)", because entity
# ids differ per tablet (button.freekiosk_<id>_reload vs button.wall_office_reload).
# Panels without FreeKiosk MQTT are not covered: enable it per docs/wall-panels.md.
automation:
  # Night start and end are helpers, so the time trigger follows the Settings view
  # with no re-registration; wall_idle.py re-applies every panel on the event.
  - id: wall_panels_period_change
    alias: "Wall panels: night starts or ends"
    mode: single
    trigger:
      - platform: time
        at: input_datetime.wall_night_start
      - platform: time
        at: input_datetime.wall_night_end
    action:
      - event: wall_period_changed

  - id: wall_panels_reload_after_start
    alias: "Wall panels: reload after Home Assistant starts"
    mode: single
    trigger:
      - platform: event
        event_type: wall_panels_ready
    action:
      # Wait for the MQTT buttons to come back; the timeout is only a guard.
      - wait_template: >
          {% set ns = namespace(down=0) %}
          {% for e in integration_entities('mqtt')
               if e is match('button\\..*_reload$') and '(FreeKiosk)' in (device_attr(e, 'model') or '')
                  and states(e) == 'unavailable' %}{% set ns.down = ns.down + 1 %}{% endfor %}
          {{ ns.down == 0 }}
        timeout: "00:05:00"
        continue_on_timeout: true
      - variables:
          panels: >
            {% set ns = namespace(up=[]) %}
            {% for e in integration_entities('mqtt')
                 if e is match('button\\..*_reload$') and '(FreeKiosk)' in (device_attr(e, 'model') or '')
                    and states(e) != 'unavailable' %}{% set ns.up = ns.up + [e] %}{% endfor %}
            {{ ns.up }}
      - condition: template
        value_template: "{{ panels | count > 0 }}"
      - service: button.press
        target:
          entity_id: "{{ panels }}"
