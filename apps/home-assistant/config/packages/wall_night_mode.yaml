# Wall panel schedule: picks which screensaver the wall panels show.
#
# This sensor is the wallpanel `profile_entity` (dashboards/wall.yaml). Its state
# names the wallpanel profile merged on top of the base config:
#   day    (Mon-Sat 07:00-22:00) no profile, base config: scenery and animated
#          visuals (apps/wall-ambient) behind full-screen controls.
#   family (Sun 07:00-22:00) family photos (immich-kiosk) with the narrow
#          right-hand control column.
#   night  (22:00-07:00) black screen after 1 s, 60 s idle grace, any tap exits.
#
# The mic (Binks wake word) stays live throughout: wallpanel's in-dashboard
# screensaver never navigates away or turns the display off at the OS level,
# so getUserMedia and the assist satellite keep running all night. For the same
# reason a black screen dims through FreeKiosk's brightness (0 at night, while the
# shared screensaver boolean is on) and never through `screen_power`.
#
# To change the schedule: edit the {% if %} block below and push to forgejo.
template:
  - sensor:
      - name: "Wall mode"
        unique_id: wall_mode
        state: >
          {% set h = now().hour %}
          {% if h >= 22 or h < 7 %}night
          {% elif now().weekday() == 6 %}family
          {% else %}day{% endif %}
        icon: >
          {% if this.state == 'night' %}mdi:weather-night
          {% elif this.state == 'family' %}mdi:image-multiple
          {% else %}mdi:white-balance-sunny{% endif %}

# Panels are found by entity suffix, because ids differ per tablet (the bedroom is
# number.freekiosk_<id>_brightness_control). The boolean is shared, so a tap on one
# panel brightens them all until it goes idle again; 07:00 restores through wall_mode.
automation:
  - id: wall_panels_black_screen_brightness
    alias: "Wall panels: lowest brightness on the night black screen"
    mode: restart
    trigger:
      - platform: state
        entity_id: input_boolean.wall_screensaver
      - platform: state
        entity_id: sensor.wall_mode
    variables:
      awake_brightness: 50
      panels: >-
        {{ integration_entities('mqtt') | select('match', 'number\\..*_brightness_control$')
           | reject('is_state', 'unavailable') | list }}
    action:
      - service: number.set_value
        target:
          entity_id: "{{ panels }}"
        data:
          value: >-
            {{ 0 if is_state('sensor.wall_mode', 'night') and is_state('input_boolean.wall_screensaver', 'on')
               else awake_brightness }}
