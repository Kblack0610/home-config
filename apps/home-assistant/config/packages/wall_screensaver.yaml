# Wall screensaver control, and reloading the panels after a restart.
#
# An entity that lovelace-wallpanel binds to via `screensaver_entity` (set on the
# wall dashboard's wallpanel block). Turning it ON starts the photo screensaver
# on the wall tablets; wallpanel flips it back OFF when the screensaver stops.
# This gives a dashboard "Screensaver" button and an easy way to test the frame
# without waiting out the idle timeout.
#
# NOTE: one shared boolean drives every tablet at once (fine for now / testing).
# For per-tablet control, switch to a per-panel entity keyed by BrowserID later.
input_boolean:
  wall_screensaver:
    name: Wall screensaver
    icon: mdi:image-multiple

# A tablet keeps the dashboard it loaded until its page reloads, so a wall.yaml
# change (which restarts HA) never reaches a panel by itself. After every HA start,
# press the FreeKiosk MQTT `reload` button of every panel that has one. Panels are
# found by device model "(FreeKiosk)", because entity ids differ per tablet
# (button.freekiosk_<id>_reload vs button.wall_office_reload). Panels without
# FreeKiosk MQTT are not covered: enable it per docs/wall-panels.md.
automation:
  - id: wall_panels_reload_after_start
    alias: "Wall panels: reload after Home Assistant starts"
    mode: single
    trigger:
      - platform: homeassistant
        event: start
    action:
      # Wait for the MQTT buttons to come back; the timeout is only a guard.
      - wait_template: >
          {% set ns = namespace(down=0) %}
          {% for e in integration_entities('mqtt')
               if e is match('button\\..*_reload$') and '(FreeKiosk)' in (device_attr(e, 'model') or '')
                  and states(e) == 'unavailable' %}{% set ns.down = ns.down + 1 %}{% endfor %}
          {{ ns.down == 0 }}
        timeout: "00:05:00"
        continue_on_timeout: true
      - variables:
          panels: >
            {% set ns = namespace(up=[]) %}
            {% for e in integration_entities('mqtt')
                 if e is match('button\\..*_reload$') and '(FreeKiosk)' in (device_attr(e, 'model') or '')
                    and states(e) != 'unavailable' %}{% set ns.up = ns.up + [e] %}{% endfor %}
            {{ ns.up }}
      - condition: template
        value_template: "{{ panels | count > 0 }}"
      - service: button.press
        target:
          entity_id: "{{ panels }}"
