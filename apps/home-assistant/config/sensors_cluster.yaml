# K3s Cluster Monitoring Sensors
# Pulls data from Prometheus (kube-prometheus-stack)
# Add to configuration.yaml: sensor: !include sensors_cluster.yaml

# ============================================
# NODE: raspberrypi (Control Plane) - 192.168.1.20
# ============================================
- platform: rest
  name: "Node 1 CPU"
  resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=100-(avg by(instance)(rate(node_cpu_seconds_total%7Binstance%3D%22192.168.1.20%3A9100%22%2Cmode%3D%22idle%22%7D%5B2m%5D))*100)"
  value_template: "{{ value_json.data.result[0].value[1] | float | round(1) }}"
  unit_of_measurement: "%"
  scan_interval: 30

- platform: rest
  name: "Node 1 RAM"
  resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=(1-node_memory_MemAvailable_bytes%7Binstance%3D%22192.168.1.20%3A9100%22%7D/node_memory_MemTotal_bytes%7Binstance%3D%22192.168.1.20%3A9100%22%7D)*100"
  value_template: "{{ value_json.data.result[0].value[1] | float | round(1) }}"
  unit_of_measurement: "%"
  scan_interval: 30

- platform: rest
  name: "Node 1 Disk"
  resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=(1-node_filesystem_avail_bytes%7Binstance%3D%22192.168.1.20%3A9100%22%2Cmountpoint%3D%22%2F%22%2Cfstype!%3D%22tmpfs%22%7D/node_filesystem_size_bytes%7Binstance%3D%22192.168.1.20%3A9100%22%2Cmountpoint%3D%22%2F%22%2Cfstype!%3D%22tmpfs%22%7D)*100"
  value_template: "{{ value_json.data.result[0].value[1] | float | round(1) }}"
  unit_of_measurement: "%"
  scan_interval: 60

