# K3s Pod Monitoring Sensors
# Pulls data from Prometheus cAdvisor metrics
# PromQL regex handles pod name churn automatically — no manual updates needed
#
# Add to configuration.yaml with: sensor: !include sensors_pods.yaml

# ============================================
# CORE SERVICES
# ============================================

# Home Assistant
- platform: rest
  name: "HA Container CPU"
  resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=sum(rate(container_cpu_usage_seconds_total%7Bnamespace%3D%22home-assistant%22%2Cpod%3D~%22home-assistant.*%22%2Ccontainer!%3D%22%22%7D%5B2m%5D))*100"
  value_template: "{{ value_json.data.result[0].value[1] | float | round(2) }}"
  unit_of_measurement: "%"
  scan_interval: 30

- platform: rest
  name: "HA Container RAM"
  resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=sum(container_memory_working_set_bytes%7Bnamespace%3D%22home-assistant%22%2Cpod%3D~%22home-assistant.*%22%2Ccontainer!%3D%22%22%7D)/1024/1024"
  value_template: "{{ value_json.data.result[0].value[1] | float | round(1) }}"
  unit_of_measurement: "MB"
  scan_interval: 30

