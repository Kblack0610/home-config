# K3s Pod Monitoring Sensors
# These sensors pull from Netdata REST API
#
# NOTE: Pod chart names include pod IDs which change on restart.
# After pod restarts, update the chart names by running:
#   curl -s "http://<node-ip>:19999/api/v1/charts" | jq -r '.charts | keys[]' | grep <app-name>
#
# Add to configuration.yaml with: sensor: !include sensors_pods.yaml

# ============================================
# CORE SERVICES
# ============================================

# Home Assistant
- platform: rest
  name: "HA Container CPU"
  resource: "http://192.168.1.20:19999/api/v1/data?chart=cgroup_k8s_cntr_home-assistant_home-assistant-6f98b46cd4-9htfx_home-assistant.cpu&points=1&format=json"
  value_template: "{{ value_json.data[0][1] | float | round(2) }}"
  unit_of_measurement: "%"
  scan_interval: 30

- platform: rest
  name: "HA Container RAM"
  resource: "http://192.168.1.20:19999/api/v1/data?chart=cgroup_k8s_cntr_home-assistant_home-assistant-6f98b46cd4-9htfx_home-assistant.mem_usage&points=1&format=json"
  value_template: "{{ (value_json.data[0][1] | float / 1024 / 1024) | round(1) }}"
  unit_of_measurement: "MB"
  scan_interval: 30

