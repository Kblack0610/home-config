      value_template: "{{ value_json.data.result[0].value[1] | float | round(1) }}"
      unit_of_measurement: "%"
      scan_interval: 30

    - platform: rest
      name: "Node 2 Disk"
      resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=(1-node_filesystem_avail_bytes%7Binstance%3D%22192.168.1.21%3A9100%22%2Cmountpoint%3D%22%2F%22%2Cfstype!%3D%22tmpfs%22%7D/node_filesystem_size_bytes%7Binstance%3D%22192.168.1.21%3A9100%22%2Cmountpoint%3D%22%2F%22%2Cfstype!%3D%22tmpfs%22%7D)*100"
      value_template: "{{ value_json.data.result[0].value[1] | float | round(1) }}"
      unit_of_measurement: "%"
      scan_interval: 60

    # Node 3 - 192.168.1.22
    - platform: rest
      name: "Node 3 CPU"
      resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=100-(avg by(instance)(rate(node_cpu_seconds_total%7Binstance%3D%22192.168.1.22%3A9100%22%2Cmode%3D%22idle%22%7D%5B2m%5D))*100)"
      value_template: "{{ value_json.data.result[0].value[1] | float | round(1) }}"
      unit_of_measurement: "%"
      scan_interval: 30

    - platform: rest
      name: "Node 3 RAM"
      resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=(1-node_memory_MemAvailable_bytes%7Binstance%3D%22192.168.1.22%3A9100%22%7D/node_memory_MemTotal_bytes%7Binstance%3D%22192.168.1.22%3A9100%22%7D)*100"
      value_template: "{{ value_json.data.result[0].value[1] | float | round(1) }}"
      unit_of_measurement: "%"
      scan_interval: 30

    - platform: rest
      name: "Node 3 Disk"
      resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=(1-node_filesystem_avail_bytes%7Binstance%3D%22192.168.1.22%3A9100%22%2Cmountpoint%3D%22%2F%22%2Cfstype!%3D%22tmpfs%22%7D/node_filesystem_size_bytes%7Binstance%3D%22192.168.1.22%3A9100%22%2Cmountpoint%3D%22%2F%22%2Cfstype!%3D%22tmpfs%22%7D)*100"
      value_template: "{{ value_json.data.result[0].value[1] | float | round(1) }}"
      unit_of_measurement: "%"
      scan_interval: 60

    # Node 4 - 192.168.1.23
    - platform: rest
      name: "Node 4 CPU"
      resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=100-(avg by(instance)(rate(node_cpu_seconds_total%7Binstance%3D%22192.168.1.23%3A9100%22%2Cmode%3D%22idle%22%7D%5B2m%5D))*100)"
      value_template: "{{ value_json.data.result[0].value[1] | float | round(1) }}"
      unit_of_measurement: "%"
      scan_interval: 30

    - platform: rest
      name: "Node 4 RAM"
      resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=(1-node_memory_MemAvailable_bytes%7Binstance%3D%22192.168.1.23%3A9100%22%7D/node_memory_MemTotal_bytes%7Binstance%3D%22192.168.1.23%3A9100%22%7D)*100"
      value_template: "{{ value_json.data.result[0].value[1] | float | round(1) }}"
      unit_of_measurement: "%"
      scan_interval: 30

    - platform: rest
      name: "Node 4 Disk"
      resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=(1-node_filesystem_avail_bytes%7Binstance%3D%22192.168.1.23%3A9100%22%2Cmountpoint%3D%22%2F%22%2Cfstype!%3D%22tmpfs%22%7D/node_filesystem_size_bytes%7Binstance%3D%22192.168.1.23%3A9100%22%2Cmountpoint%3D%22%2F%22%2Cfstype!%3D%22tmpfs%22%7D)*100"
      value_template: "{{ value_json.data.result[0].value[1] | float | round(1) }}"
      unit_of_measurement: "%"
      scan_interval: 60

    # Node 5 - 192.168.1.124
    - platform: rest
      name: "Node 5 CPU"
      resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=100-(avg by(instance)(rate(node_cpu_seconds_total%7Binstance%3D%22192.168.1.124%3A9100%22%2Cmode%3D%22idle%22%7D%5B2m%5D))*100)"
      value_template: "{{ value_json.data.result[0].value[1] | float | round(1) }}"
      unit_of_measurement: "%"
      scan_interval: 30

    - platform: rest
      name: "Node 5 RAM"
      resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=(1-node_memory_MemAvailable_bytes%7Binstance%3D%22192.168.1.124%3A9100%22%7D/node_memory_MemTotal_bytes%7Binstance%3D%22192.168.1.124%3A9100%22%7D)*100"
      value_template: "{{ value_json.data.result[0].value[1] | float | round(1) }}"
      unit_of_measurement: "%"
      scan_interval: 30

    - platform: rest
      name: "Node 5 Disk"
      resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=(1-node_filesystem_avail_bytes%7Binstance%3D%22192.168.1.124%3A9100%22%2Cmountpoint%3D%22%2F%22%2Cfstype!%3D%22tmpfs%22%7D/node_filesystem_size_bytes%7Binstance%3D%22192.168.1.124%3A9100%22%2Cmountpoint%3D%22%2F%22%2Cfstype!%3D%22tmpfs%22%7D)*100"
      value_template: "{{ value_json.data.result[0].value[1] | float | round(1) }}"
      unit_of_measurement: "%"
      scan_interval: 60

    # ============================================
    # MAC MACHINES (Apple Silicon - node_exporter via Prometheus)
    # ============================================

    # Mac Studio M3 Ultra - 192.168.1.4 (Ollama, GH Actions runner)
    - platform: rest
      name: "Mac Studio CPU"
      resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=100-(avg(rate(node_cpu_seconds_total%7Binstance%3D%22192.168.1.4%3A9100%22%2Cmode%3D%22idle%22%7D%5B2m%5D))*100)"
      value_template: "{{ value_json.data.result[0].value[1] | float | round(1) }}"
      unit_of_measurement: "%"
      scan_interval: 30

    - platform: rest
      name: "Mac Studio RAM"
      resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=(1-node_memory_free_bytes%7Binstance%3D%22192.168.1.4%3A9100%22%7D/node_memory_total_bytes%7Binstance%3D%22192.168.1.4%3A9100%22%7D)*100"
      value_template: "{{ value_json.data.result[0].value[1] | float | round(1) }}"
      unit_of_measurement: "%"
      scan_interval: 30

    - platform: rest
      name: "Mac Studio Disk"
      resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=(1-node_filesystem_avail_bytes%7Binstance%3D%22192.168.1.4%3A9100%22%2Cmountpoint%3D%22%2F%22%7D/node_filesystem_size_bytes%7Binstance%3D%22192.168.1.4%3A9100%22%2Cmountpoint%3D%22%2F%22%7D)*100"
      value_template: "{{ value_json.data.result[0].value[1] | float | round(1) }}"
      unit_of_measurement: "%"
      scan_interval: 60

    # Mac Mini M1 - 192.168.1.7 (GH Actions runner, iOS builds)
    - platform: rest
      name: "Mac Mini CPU"
      resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=100-(avg(rate(node_cpu_seconds_total%7Binstance%3D%22192.168.1.7%3A9100%22%2Cmode%3D%22idle%22%7D%5B2m%5D))*100)"
      value_template: "{{ value_json.data.result[0].value[1] | float | round(1) }}"
      unit_of_measurement: "%"
      scan_interval: 30

    - platform: rest
      name: "Mac Mini RAM"
      resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=(1-node_memory_free_bytes%7Binstance%3D%22192.168.1.7%3A9100%22%7D/node_memory_total_bytes%7Binstance%3D%22192.168.1.7%3A9100%22%7D)*100"
      value_template: "{{ value_json.data.result[0].value[1] | float | round(1) }}"
      unit_of_measurement: "%"
      scan_interval: 30

    - platform: rest
      name: "Mac Mini Disk"
      resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=(1-node_filesystem_avail_bytes%7Binstance%3D%22192.168.1.7%3A9100%22%2Cmountpoint%3D%22%2F%22%7D/node_filesystem_size_bytes%7Binstance%3D%22192.168.1.7%3A9100%22%2Cmountpoint%3D%22%2F%22%7D)*100"
      value_template: "{{ value_json.data.result[0].value[1] | float | round(1) }}"
      unit_of_measurement: "%"
      scan_interval: 60

    # Ollama Status (Mac Studio - fallback)
    - platform: rest
      name: "Ollama Status"
      resource: "http://192.168.1.4:11434/api/tags"
      value_template: "{{ value_json.models | length }}"
      unit_of_measurement: "models"
      scan_interval: 60

    # MLX LM Servers (Mac Studio - primary inference)
    - platform: rest
      name: "MLX Code Server"
      resource: "http://192.168.1.4:8080/v1/models"
      value_template: "{{ value_json.data | length }}"
      unit_of_measurement: "models"
      scan_interval: 60

    - platform: rest
      name: "MLX Smart Server"
      resource: "http://192.168.1.4:8081/v1/models"
      value_template: "{{ value_json.data | length }}"
      unit_of_measurement: "models"
      scan_interval: 60

    - platform: rest
      name: "MLX Reasoning Server"
      resource: "http://192.168.1.4:8082/v1/models"
      value_template: "{{ value_json.data | length }}"
      unit_of_measurement: "models"
      scan_interval: 60

    # Cluster Averages (Template Sensors)
    - platform: template
      sensors:
        cluster_cpu_average:
          friendly_name: "Cluster CPU Average"
          unit_of_measurement: "%"
          value_template: >-
            {% set nodes = [
              states('sensor.node_1_cpu') | float(0),
              states('sensor.node_2_cpu') | float(0),
              states('sensor.node_3_cpu') | float(0),
              states('sensor.node_4_cpu') | float(0),
              states('sensor.node_5_cpu') | float(0)
            ] %}
            {% set valid = nodes | select('gt', 0) | list %}
            {{ (valid | sum / valid | length) | round(1) if valid | length > 0 else 0 }}

        cluster_ram_average:
          friendly_name: "Cluster RAM Average"
          unit_of_measurement: "%"
          value_template: >-
            {% set nodes = [
              states('sensor.node_1_ram') | float(0),
              states('sensor.node_2_ram') | float(0),
              states('sensor.node_3_ram') | float(0),
              states('sensor.node_4_ram') | float(0),
              states('sensor.node_5_ram') | float(0)
            ] %}
            {% set valid = nodes | select('gt', 0) | list %}
            {{ (valid | sum / valid | length) | round(1) if valid | length > 0 else 0 }}

        cluster_nodes_online:
          friendly_name: "Cluster Nodes Online"
          unit_of_measurement: "nodes"
          value_template: >-
            {% set nodes = [
              states('sensor.node_1_cpu'),
              states('sensor.node_2_cpu'),
              states('sensor.node_3_cpu'),
              states('sensor.node_4_cpu'),
              states('sensor.node_5_cpu')
            ] %}
            {{ nodes | reject('in', ['unknown', 'unavailable']) | list | length }}

        mac_machines_online:
          friendly_name: "Mac Machines Online"
          unit_of_measurement: "nodes"
          value_template: >-
            {% set macs = [
              states('sensor.mac_studio_cpu'),
              states('sensor.mac_mini_cpu')
            ] %}
            {{ macs | reject('in', ['unknown', 'unavailable']) | list | length }}

        homelab_total_nodes:
          friendly_name: "Homelab Total Nodes"
          unit_of_measurement: "nodes"
          value_template: >-
            {% set all = [
              states('sensor.node_1_cpu'),
              states('sensor.node_2_cpu'),
              states('sensor.node_3_cpu'),
              states('sensor.node_4_cpu'),
              states('sensor.node_5_cpu'),
              states('sensor.mac_studio_cpu'),
              states('sensor.mac_mini_cpu')
            ] %}
            {{ all | reject('in', ['unknown', 'unavailable']) | list | length }}

  # ============================================
  # POD/APP MONITORING (via Prometheus cAdvisor)
  # PromQL regex handles pod name churn automatically
  # ============================================
  sensors_pods.yaml: |
    # Home Assistant
    - platform: rest
      name: "HA Container CPU"
      resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=sum(rate(container_cpu_usage_seconds_total%7Bnamespace%3D%22home-assistant%22%2Cpod%3D~%22home-assistant.*%22%2Ccontainer!%3D%22%22%7D%5B2m%5D))*100"
      value_template: "{{ value_json.data.result[0].value[1] | float | round(2) }}"
      unit_of_measurement: "%"
      scan_interval: 30

    - platform: rest
      name: "HA Container RAM"
      resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=sum(container_memory_working_set_bytes%7Bnamespace%3D%22home-assistant%22%2Cpod%3D~%22home-assistant.*%22%2Ccontainer!%3D%22%22%7D)/1024/1024"
      value_template: "{{ value_json.data.result[0].value[1] | float | round(1) }}"
      unit_of_measurement: "MB"
      scan_interval: 30

    # Traefik (Ingress)
    - platform: rest
      name: "Traefik CPU"
      resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=sum(rate(container_cpu_usage_seconds_total%7Bnamespace%3D%22kube-system%22%2Cpod%3D~%22traefik.*%22%2Ccontainer!%3D%22%22%7D%5B2m%5D))*100"
      value_template: "{{ value_json.data.result[0].value[1] | float | round(2) }}"
      unit_of_measurement: "%"
      scan_interval: 30

    - platform: rest
      name: "Traefik RAM"
      resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=sum(container_memory_working_set_bytes%7Bnamespace%3D%22kube-system%22%2Cpod%3D~%22traefik.*%22%2Ccontainer!%3D%22%22%7D)/1024/1024"
      value_template: "{{ value_json.data.result[0].value[1] | float | round(1) }}"
      unit_of_measurement: "MB"
      scan_interval: 30

    # Cloudflare Tunnel
    - platform: rest
      name: "Cloudflared CPU"
      resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=sum(rate(container_cpu_usage_seconds_total%7Bnamespace%3D%22apps%22%2Cpod%3D~%22cloudflared.*%22%2Ccontainer!%3D%22%22%7D%5B2m%5D))*100"
      value_template: "{{ value_json.data.result[0].value[1] | float | round(2) }}"
      unit_of_measurement: "%"
      scan_interval: 30

    # PlaceMyParents API
    - platform: rest
      name: "PlaceMyParents API CPU"
      resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=sum(rate(container_cpu_usage_seconds_total%7Bnamespace%3D%22apps%22%2Cpod%3D~%22placemyparents-api.*%22%2Ccontainer!%3D%22%22%7D%5B2m%5D))*100"
      value_template: "{{ value_json.data.result[0].value[1] | float | round(2) }}"
      unit_of_measurement: "%"
      scan_interval: 30

    # PlaceMyParents Web
    - platform: rest
      name: "PlaceMyParents Web CPU"
      resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=sum(rate(container_cpu_usage_seconds_total%7Bnamespace%3D%22apps%22%2Cpod%3D~%22placemyparents-web.*%22%2Ccontainer!%3D%22%22%7D%5B2m%5D))*100"
      value_template: "{{ value_json.data.result[0].value[1] | float | round(2) }}"
      unit_of_measurement: "%"
      scan_interval: 30

    # PlaceMyParents Postgres
    - platform: rest
      name: "PlaceMyParents DB CPU"
      resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=sum(rate(container_cpu_usage_seconds_total%7Bnamespace%3D%22apps%22%2Cpod%3D~%22placemyparents-postgres.*%22%2Ccontainer!%3D%22%22%7D%5B2m%5D))*100"
      value_template: "{{ value_json.data.result[0].value[1] | float | round(2) }}"
      unit_of_measurement: "%"
      scan_interval: 30

    # Registry
    - platform: rest
      name: "Registry CPU"
      resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=sum(rate(container_cpu_usage_seconds_total%7Bnamespace%3D%22registry%22%2Cpod%3D~%22registry.*%22%2Ccontainer!%3D%22%22%7D%5B2m%5D))*100"
      value_template: "{{ value_json.data.result[0].value[1] | float | round(2) }}"
      unit_of_measurement: "%"
      scan_interval: 30
