      name: "Registry CPU"
      resource: "http://192.168.1.21:19999/api/v1/data?chart=cgroup_k8s_cntr_registry_registry-887c68bdb-hj55v_registry.cpu&points=1&format=json"
      value_template: "{{ value_json.data[0][1] | float | round(2) }}"
      unit_of_measurement: "%"
      scan_interval: 30
