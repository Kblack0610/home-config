        {{ ((used / total) * 100) | round(1) }}
      unit_of_measurement: "%"
      scan_interval: 30

    - platform: rest
      name: "Node 3 Disk"
      resource: "http://192.168.1.22:19999/api/v1/data?chart=disk_space._&points=1&format=json"
      value_template: >-
        {% set avail = value_json.data[0][1] | float %}
        {% set used = value_json.data[0][2] | float %}
        {% set reserved = value_json.data[0][3] | float %}
        {% set total = avail + used + reserved %}
        {{ ((used / total) * 100) | round(1) if total > 0 else 0 }}
      unit_of_measurement: "%"
      scan_interval: 60

    # Node 4 - 192.168.1.23
    - platform: rest
      name: "Node 4 CPU"
      resource: "http://192.168.1.23:19999/api/v1/data?chart=system.cpu&points=1&format=json&options=abs"
      value_template: "{{ ((value_json.data[0][6] | float) + (value_json.data[0][7] | float)) | round(1) }}"
      unit_of_measurement: "%"
      scan_interval: 30

    - platform: rest
      name: "Node 4 RAM"
      resource: "http://192.168.1.23:19999/api/v1/data?chart=system.ram&points=1&format=json"
      value_template: >-
        {% set used = value_json.data[0][1] | float %}
        {% set buffers = value_json.data[0][2] | float %}
        {% set cached = value_json.data[0][4] | float %}
        {% set free = value_json.data[0][3] | float %}
        {% set total = used + buffers + cached + free %}
        {{ ((used / total) * 100) | round(1) }}
      unit_of_measurement: "%"
      scan_interval: 30

    - platform: rest
      name: "Node 4 Disk"
      resource: "http://192.168.1.23:19999/api/v1/data?chart=disk_space._&points=1&format=json"
      value_template: >-
        {% set avail = value_json.data[0][1] | float %}
        {% set used = value_json.data[0][2] | float %}
        {% set reserved = value_json.data[0][3] | float %}
        {% set total = avail + used + reserved %}
        {{ ((used / total) * 100) | round(1) if total > 0 else 0 }}
      unit_of_measurement: "%"
      scan_interval: 60

    # Node 5 - 192.168.1.124
    - platform: rest
      name: "Node 5 CPU"
      resource: "http://192.168.1.124:19999/api/v1/data?chart=system.cpu&points=1&format=json&options=abs"
      value_template: "{{ ((value_json.data[0][6] | float) + (value_json.data[0][7] | float)) | round(1) }}"
      unit_of_measurement: "%"
      scan_interval: 30

    - platform: rest
      name: "Node 5 RAM"
      resource: "http://192.168.1.124:19999/api/v1/data?chart=system.ram&points=1&format=json"
      value_template: >-
        {% set used = value_json.data[0][1] | float %}
        {% set buffers = value_json.data[0][2] | float %}
        {% set cached = value_json.data[0][4] | float %}
        {% set free = value_json.data[0][3] | float %}
        {% set total = used + buffers + cached + free %}
        {{ ((used / total) * 100) | round(1) }}
      unit_of_measurement: "%"
      scan_interval: 30

    - platform: rest
      name: "Node 5 Disk"
      resource: "http://192.168.1.124:19999/api/v1/data?chart=disk_space._&points=1&format=json"
      value_template: >-
        {% set avail = value_json.data[0][1] | float %}
        {% set used = value_json.data[0][2] | float %}
        {% set reserved = value_json.data[0][3] | float %}
        {% set total = avail + used + reserved %}
        {{ ((used / total) * 100) | round(1) if total > 0 else 0 }}
      unit_of_measurement: "%"
      scan_interval: 60

    # K3s System (Always Stable)
    - platform: rest
      name: "K3s Server CPU"
      resource: "http://192.168.1.20:19999/api/v1/data?chart=app.k3s-server_cpu_utilization&points=1&format=json"
      value_template: "{{ value_json.data[0][1] | float | round(2) }}"
      unit_of_measurement: "%"
      scan_interval: 30

    - platform: rest
      name: "K3s Server RAM"
      resource: "http://192.168.1.20:19999/api/v1/data?chart=app.k3s-server_mem_usage&points=1&format=json"
      value_template: "{{ (value_json.data[0][1] | float / 1024 / 1024) | round(1) }}"
      unit_of_measurement: "MB"
      scan_interval: 30

    - platform: rest
      name: "Containerd CPU"
      resource: "http://192.168.1.20:19999/api/v1/data?chart=app.containerd_cpu_utilization&points=1&format=json"
      value_template: "{{ value_json.data[0][1] | float | round(2) }}"
      unit_of_measurement: "%"
      scan_interval: 30

    # Cluster Averages (Template Sensors)
    - platform: template
      sensors:
        cluster_cpu_average:
          friendly_name: "Cluster CPU Average"
          unit_of_measurement: "%"
          value_template: >-
            {% set nodes = [
              states('sensor.node_1_cpu') | float(0),
              states('sensor.node_2_cpu') | float(0),
              states('sensor.node_3_cpu') | float(0),
              states('sensor.node_4_cpu') | float(0),
              states('sensor.node_5_cpu') | float(0)
            ] %}
            {% set valid = nodes | select('gt', 0) | list %}
            {{ (valid | sum / valid | length) | round(1) if valid | length > 0 else 0 }}

        cluster_ram_average:
          friendly_name: "Cluster RAM Average"
          unit_of_measurement: "%"
          value_template: >-
            {% set nodes = [
              states('sensor.node_1_ram') | float(0),
              states('sensor.node_2_ram') | float(0),
              states('sensor.node_3_ram') | float(0),
              states('sensor.node_4_ram') | float(0),
              states('sensor.node_5_ram') | float(0)
            ] %}
            {% set valid = nodes | select('gt', 0) | list %}
            {{ (valid | sum / valid | length) | round(1) if valid | length > 0 else 0 }}

        cluster_nodes_online:
          friendly_name: "Cluster Nodes Online"
          unit_of_measurement: "nodes"
          value_template: >-
            {% set nodes = [
              states('sensor.node_1_cpu'),
              states('sensor.node_2_cpu'),
              states('sensor.node_3_cpu'),
              states('sensor.node_4_cpu'),
              states('sensor.node_5_cpu')
            ] %}
            {{ nodes | reject('in', ['unknown', 'unavailable']) | list | length }}

  # ============================================
  # POD/APP MONITORING (Requires update after pod restarts)
  # Run: ./scripts/update-pod-sensors.sh to get new chart names
  # ============================================
  sensors_pods.yaml: |
    # PlaceMyParents API (Node 3 - 192.168.1.22)
    - platform: rest
      name: "PlaceMyParents API CPU"
      resource: "http://192.168.1.22:19999/api/v1/data?chart=cgroup_k8s_cntr_apps_placemyparents-api-bc8684949-9jsw2_placemyparents-api.cpu&points=1&format=json"
      value_template: "{{ value_json.data[0][1] | float | round(2) }}"
      unit_of_measurement: "%"
      scan_interval: 30

    # PlaceMyParents Web (Node 2 - 192.168.1.21)
