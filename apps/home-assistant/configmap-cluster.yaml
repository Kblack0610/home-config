apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-cluster-config
  namespace: home-assistant
data:
  # ============================================
  # HOMELAB NODE MONITORING (Stable - Always Works)
  # ============================================
  sensors_cluster.yaml: |
    # Node 1 (Control Plane) - 192.168.1.20
    - platform: rest
      name: "Node 1 CPU"
      resource: "http://192.168.1.20:19999/api/v1/data?chart=system.cpu&points=1&format=json&options=abs"
      value_template: "{{ ((value_json.data[0][6] | float) + (value_json.data[0][7] | float)) | round(1) }}"
      unit_of_measurement: "%"
      scan_interval: 30

    - platform: rest
      name: "Node 1 RAM"
      resource: "http://192.168.1.20:19999/api/v1/data?chart=system.ram&points=1&format=json"
      value_template: >-
        {% set used = value_json.data[0][1] | float %}
        {% set buffers = value_json.data[0][2] | float %}
        {% set cached = value_json.data[0][4] | float %}
        {% set free = value_json.data[0][3] | float %}
        {% set total = used + buffers + cached + free %}
        {{ ((used / total) * 100) | round(1) }}
      unit_of_measurement: "%"
      scan_interval: 30

    - platform: rest
      name: "Node 1 Disk"
      resource: "http://192.168.1.20:19999/api/v1/data?chart=disk_space._&points=1&format=json"
      value_template: >-
        {% set avail = value_json.data[0][1] | float %}
        {% set used = value_json.data[0][2] | float %}
        {% set reserved = value_json.data[0][3] | float %}
        {% set total = avail + used + reserved %}
        {{ ((used / total) * 100) | round(1) if total > 0 else 0 }}
      unit_of_measurement: "%"
      scan_interval: 60

    # Node 2 - 192.168.1.21
    - platform: rest
      name: "Node 2 CPU"
      resource: "http://192.168.1.21:19999/api/v1/data?chart=system.cpu&points=1&format=json&options=abs"
      value_template: "{{ ((value_json.data[0][6] | float) + (value_json.data[0][7] | float)) | round(1) }}"
      unit_of_measurement: "%"
      scan_interval: 30

    - platform: rest
      name: "Node 2 RAM"
      resource: "http://192.168.1.21:19999/api/v1/data?chart=system.ram&points=1&format=json"
      value_template: >-
        {% set used = value_json.data[0][1] | float %}
        {% set buffers = value_json.data[0][2] | float %}
        {% set cached = value_json.data[0][4] | float %}
        {% set free = value_json.data[0][3] | float %}
        {% set total = used + buffers + cached + free %}
        {{ ((used / total) * 100) | round(1) }}
      unit_of_measurement: "%"
      scan_interval: 30

    - platform: rest
      name: "Node 2 Disk"
      resource: "http://192.168.1.21:19999/api/v1/data?chart=disk_space._&points=1&format=json"
      value_template: >-
        {% set avail = value_json.data[0][1] | float %}
        {% set used = value_json.data[0][2] | float %}
        {% set reserved = value_json.data[0][3] | float %}
        {% set total = avail + used + reserved %}
        {{ ((used / total) * 100) | round(1) if total > 0 else 0 }}
      unit_of_measurement: "%"
      scan_interval: 60

    # Node 3 - 192.168.1.22
    - platform: rest
      name: "Node 3 CPU"
      resource: "http://192.168.1.22:19999/api/v1/data?chart=system.cpu&points=1&format=json&options=abs"
      value_template: "{{ ((value_json.data[0][6] | float) + (value_json.data[0][7] | float)) | round(1) }}"
      unit_of_measurement: "%"
      scan_interval: 30

    - platform: rest
      name: "Node 3 RAM"
      resource: "http://192.168.1.22:19999/api/v1/data?chart=system.ram&points=1&format=json"
      value_template: >-
        {% set used = value_json.data[0][1] | float %}
