      resource: "http://192.168.1.20:19999/api/v1/data?chart=cgroup_k8s_cntr_kube-system_traefik-c98fdf6fb-qp9sp_traefik.cpu&points=1&format=json"
      value_template: "{{ value_json.data[0][1] | float | round(2) }}"
