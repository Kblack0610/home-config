      name: "PlaceMyParents Web CPU"
      resource: "http://192.168.1.21:19999/api/v1/data?chart=cgroup_k8s_cntr_apps_placemyparents-web-85949bc67b-5bfxv_placemyparents-web.cpu&points=1&format=json"
      value_template: "{{ value_json.data[0][1] | float | round(2) }}"
      unit_of_measurement: "%"
      scan_interval: 30

    # PlaceMyParents Postgres (Node 4 - 192.168.1.23)
