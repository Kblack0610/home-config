      name: "Node 2 CPU"
      resource: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=100-(avg by(instance)(rate(node_cpu_seconds_total%7Binstance%3D%22192.168.1.21%3A9100%22%2Cmode%3D%22idle%22%7D%5B2m%5D))*100)"
      value_template: "{{ value_json.data.result[0].value[1] | float | round(1) }}"
