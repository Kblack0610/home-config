      resource: "http://192.168.1.23:19999/api/v1/data?chart=cgroup_k8s_cntr_apps_placemyparents-postgres-6b6855ddf4-b8wvw_placemyparents-postgres.cpu&points=1&format=json"
      value_template: "{{ value_json.data[0][1] | float | round(2) }}"
      unit_of_measurement: "%"
      scan_interval: 30

    # Cloudflared (Node 1 - 192.168.1.20)
