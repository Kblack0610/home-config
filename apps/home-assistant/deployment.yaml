apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
    spec:
      initContainers:
        - name: install-bambu-lab
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -eu
              VERSION="v2.2.21"
              TARGET="/config/custom_components/bambu_lab"
              MARKER="$TARGET/.version"
              if [ -f "$MARKER" ] && [ "$(cat "$MARKER")" = "$VERSION" ]; then
                echo "bambu_lab $VERSION already installed, skipping"
                exit 0
              fi
              apk add --no-cache wget unzip
              rm -rf "$TARGET"
              mkdir -p "$TARGET"
              wget -q -O /tmp/bambu_lab.zip \
                "https://github.com/greghesp/ha-bambulab/releases/download/$VERSION/bambu_lab.zip"
              unzip -o -q /tmp/bambu_lab.zip -d "$TARGET"
              echo "$VERSION" > "$MARKER"
              rm /tmp/bambu_lab.zip
              echo "bambu_lab $VERSION installed"
          volumeMounts:
            - name: config
              mountPath: /config
        # Tapo RV30 robot vacuum: local-only (TPAP/SPAKE2+) reverse-engineered
        # integration. No release .zip asset exists, so we pull the tag source
        # tarball and copy out the custom_components/tapo_rv30 dir. RESILIENT:
        # `set -u` + final `exit 0` so a failed download never blocks HA boot;
        # the marker is written only on success, so a failure retries next start.
        - name: install-tapo-rv30
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -u
              VERSION="v0.3.0"
              TARGET="/config/custom_components/tapo_rv30"
              MARKER="$TARGET/.version"
              if [ -f "$MARKER" ] && [ "$(cat "$MARKER")" = "$VERSION" ]; then
                echo "tapo_rv30 $VERSION already installed, skipping"
                exit 0
              fi
              apk add --no-cache wget tar >/dev/null
              mkdir -p /config/custom_components
              if wget -q -O /tmp/rv30.tgz \
                  "https://github.com/epg-pers/tapo-rv30-ha/archive/refs/tags/$VERSION.tar.gz"; then
                rm -rf "$TARGET"; mkdir -p "$TARGET"
                tar -xzf /tmp/rv30.tgz -C /tmp
                cp -r /tmp/tapo-rv30-ha-*/custom_components/tapo_rv30/. "$TARGET/"
                rm -rf /tmp/rv30.tgz /tmp/tapo-rv30-ha-*
                echo "$VERSION" > "$MARKER"
                echo "tapo_rv30 $VERSION installed"
              else
                echo "WARN: tapo_rv30 download failed; no marker written, will retry next start"
              fi
              exit 0
          volumeMounts:
            - name: config
              mountPath: /config
        # LocalTuya (xZetsubou fork): fully-local control of Tuya WiFi devices
        # (e.g. the Fumoi litter box) — no cloud in the control path. No release
        # .zip asset, so pull the tag source tarball and copy custom_components/
        # localtuya. RESILIENT: `set -u` + final `exit 0` so a failed download
        # never blocks HA boot; the marker is written only on success → retries
        # next start. The device config entry is seeded separately (see the
        # LocalTuya section in docs/smart-home-control.md).
        - name: install-localtuya
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -u
              VERSION="2025.11.0"
              TARGET="/config/custom_components/localtuya"
              MARKER="$TARGET/.version"
              if [ -f "$MARKER" ] && [ "$(cat "$MARKER")" = "$VERSION" ]; then
                echo "localtuya $VERSION already installed, skipping"
                exit 0
              fi
              apk add --no-cache wget tar >/dev/null
              mkdir -p /config/custom_components
              if wget -q -O /tmp/lt.tgz \
                  "https://github.com/xZetsubou/hass-localtuya/archive/refs/tags/$VERSION.tar.gz"; then
                rm -rf "$TARGET"; mkdir -p "$TARGET"
                tar -xzf /tmp/lt.tgz -C /tmp
                cp -r /tmp/hass-localtuya-*/custom_components/localtuya/. "$TARGET/"
                rm -rf /tmp/lt.tgz /tmp/hass-localtuya-*
                echo "$VERSION" > "$MARKER"
                echo "localtuya $VERSION installed"
              else
                echo "WARN: localtuya download failed; no marker written, will retry next start"
              fi
              exit 0
          volumeMounts:
            - name: config
              mountPath: /config
        # Binks assistant — Extended OpenAI Conversation (jekalmin), pinned to 1.1.0,
        # the last release compatible with HA 2025.11 (2.x needs HA >=2026.3; 1.1.0
        # requires openai~=2.2.0 which HA 2025.11 already bundles, so no runtime pip).
        # Gives a conversation agent that can target our LiteLLM base_url. RESILIENT:
        # set -u + final exit 0 so a failed download never blocks HA boot; marker
        # written only on success so a failure retries next start.
        - name: install-extended-openai-conversation
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -u
              VERSION="1.1.0"
              TARGET="/config/custom_components/extended_openai_conversation"
              MARKER="$TARGET/.version"
              if [ -f "$MARKER" ] && [ "$(cat "$MARKER")" = "$VERSION" ]; then
                echo "extended_openai_conversation $VERSION already installed, skipping"
                exit 0
              fi
              apk add --no-cache wget tar >/dev/null
              mkdir -p /config/custom_components
              if wget -q -O /tmp/eoc.tgz \
                  "https://github.com/jekalmin/extended_openai_conversation/archive/refs/tags/$VERSION.tar.gz"; then
                rm -rf "$TARGET"; mkdir -p "$TARGET"
                tar -xzf /tmp/eoc.tgz -C /tmp
                cp -r /tmp/extended_openai_conversation-*/custom_components/extended_openai_conversation/. "$TARGET/"
                rm -rf /tmp/eoc.tgz /tmp/extended_openai_conversation-*
                echo "$VERSION" > "$MARKER"
                echo "extended_openai_conversation $VERSION installed"
              else
                echo "WARN: extended_openai_conversation download failed; no marker, will retry next start"
              fi
              exit 0
          volumeMounts:
            - name: config
              mountPath: /config
        # Binks voice (Stage 2) — OpenAI-compatible STT (fabio-garavini's
        # openai_whisper_cloud). Routes speech-to-text through our LiteLLM
        # `stt (whisper-turbo)` model, so no Wyoming/whisper container is needed.
        # No PyPI requirements. No GitHub releases exist, so pin a commit SHA for
        # reproducibility. RESILIENT: set -u + final exit 0; marker on success only.
        - name: install-openai-whisper-cloud
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -u
              VERSION="af4abafb47aaaa387e8cdb949fb838026517da6d"  # main @ 2026-07, manifest 1.3.0
              TARGET="/config/custom_components/openai_whisper_cloud"
              MARKER="$TARGET/.version"
              if [ -f "$MARKER" ] && [ "$(cat "$MARKER")" = "$VERSION" ]; then
                echo "openai_whisper_cloud $VERSION already installed, skipping"
                exit 0
              fi
              apk add --no-cache wget tar >/dev/null
              mkdir -p /config/custom_components
              if wget -q -O /tmp/owc.tgz \
                  "https://github.com/fabio-garavini/ha-openai-whisper-stt-api/archive/$VERSION.tar.gz"; then
                rm -rf "$TARGET"; mkdir -p "$TARGET"
                tar -xzf /tmp/owc.tgz -C /tmp
                cp -r /tmp/ha-openai-whisper-stt-api-*/custom_components/openai_whisper_cloud/. "$TARGET/"
                rm -rf /tmp/owc.tgz /tmp/ha-openai-whisper-stt-api-*
                echo "$VERSION" > "$MARKER"
                echo "openai_whisper_cloud $VERSION installed"
              else
                echo "WARN: openai_whisper_cloud download failed; no marker, will retry next start"
              fi
              exit 0
          volumeMounts:
            - name: config
              mountPath: /config
        # Vendor pinned Lovelace custom cards + browser_mod for the wall-panel
        # dashboards (we don't run HACS; everything is git-pinned + reproducible).
        # RESILIENT BY DESIGN: `set -u` (not -e) and a final `exit 0` so a failed
        # download NEVER blocks HA from starting; the success marker is only
        # written when ALL downloads succeed, so a partial failure retries on the
        # next restart. Bump VERSION to force a re-vendor.
        - name: install-lovelace-cards
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -u
              VERSION="2026-06-29-1"
              WWW="/config/www/community"
              MARKER="$WWW/.version"
              if [ -f "$MARKER" ] && [ "$(cat "$MARKER")" = "$VERSION" ]; then
                echo "lovelace cards $VERSION already vendored, skipping"
                exit 0
              fi
              apk add --no-cache wget tar >/dev/null
              mkdir -p "$WWW" /config/custom_components
              FAIL=0
              dl() {  # dl <url> <dest>
                mkdir -p "$(dirname "$2")"
                if wget -q -O "$2" "$1"; then
                  echo "ok    $2"
                else
                  echo "WARN  failed: $1"; rm -f "$2"; FAIL=$((FAIL+1))
                fi
              }
              dl "https://github.com/piitaya/lovelace-mushroom/releases/download/v5.1.1/mushroom.js"                 "$WWW/mushroom/mushroom.js"
              dl "https://github.com/custom-cards/button-card/releases/download/v7.0.1/button-card.js"              "$WWW/button-card/button-card.js"
              dl "https://raw.githubusercontent.com/Clooos/Bubble-Card/v3.2.3/dist/bubble-card.js"                  "$WWW/bubble-card/bubble-card.js"
              dl "https://raw.githubusercontent.com/thomasloven/lovelace-auto-entities/v1.16.1/auto-entities.js"    "$WWW/auto-entities/auto-entities.js"
              dl "https://raw.githubusercontent.com/thomasloven/lovelace-card-mod/v4.2.1/card-mod.js"               "$WWW/card-mod/card-mod.js"
              dl "https://github.com/kalkih/mini-graph-card/releases/download/v0.13.0/mini-graph-card-bundle.js"    "$WWW/mini-graph-card/mini-graph-card-bundle.js"
              dl "https://github.com/NemesisRE/kiosk-mode/releases/download/v14.0.0/kiosk-mode.js"                  "$WWW/kiosk-mode/kiosk-mode.js"
              # Phase 1.5 — Nest-Hub photo layer: wallpanel (rotating-photo screensaver) + clock-weather hero.
              dl "https://github.com/j-a-n/lovelace-wallpanel/releases/download/v4.65.1/wallpanel.js"              "$WWW/wallpanel/wallpanel.js"
              dl "https://github.com/pkissling/clock-weather-card/releases/download/v2.9.3/clock-weather-card.js"  "$WWW/clock-weather-card/clock-weather-card.js"
              # browser_mod is a Python custom_component (frontend bundled); install the dir.
              if wget -q -O /tmp/bm.tgz "https://github.com/thomasloven/hass-browser_mod/archive/refs/tags/v2.13.5.tar.gz"; then
                tar -xzf /tmp/bm.tgz -C /tmp
                rm -rf /config/custom_components/browser_mod
                cp -r /tmp/hass-browser_mod-2.13.5/custom_components/browser_mod /config/custom_components/browser_mod
                rm -rf /tmp/bm.tgz /tmp/hass-browser_mod-2.13.5
                echo "ok    browser_mod"
              else
                echo "WARN  failed: browser_mod"; FAIL=$((FAIL+1))
              fi
              if [ "$FAIL" -eq 0 ]; then
                echo "$VERSION" > "$MARKER"
                echo "all lovelace cards vendored ($VERSION)"
              else
                echo "WARN: $FAIL download(s) failed; no marker written, will retry next start"
              fi
              exit 0
          volumeMounts:
            - name: config
              mountPath: /config
        - name: sync-managed-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /config/packages /config/dashboards

              # Make this sync AUTHORITATIVE: packages/ and dashboards/ contain
              # ONLY git-managed files, so prune them first. Without this, `cp`
              # leaves orphans behind when a package/dashboard is removed from
              # git — and HA keeps loading the stale file (e.g. a dropped package
              # erroring on every start). Pruning makes the PVC match git exactly.
              rm -f /config/packages/*.yaml /config/dashboards/*.yaml

              cp /managed-config/configuration.yaml /config/configuration.yaml
              cp /managed-config/automations.yaml /config/automations.yaml
              cp /managed-config/scripts.yaml /config/scripts.yaml
              cp /managed-config/scenes.yaml /config/scenes.yaml
              cp /managed-config/ui-lovelace.yaml /config/ui-lovelace.yaml

              cp /managed-config/package_cluster_metrics.yaml /config/packages/cluster_metrics.yaml
              cp /managed-config/package_service_metrics.yaml /config/packages/service_metrics.yaml
              cp /managed-config/package_homelab_endpoints.yaml /config/packages/homelab_endpoints.yaml
              cp /managed-config/package_derived_metrics.yaml /config/packages/derived_metrics.yaml
              cp /managed-config/package_printing_neptune.yaml /config/packages/printing_neptune.yaml
              cp /managed-config/package_voice_targets.yaml /config/packages/voice_targets.yaml
              cp /managed-config/package_site_status.yaml /config/packages/site_status.yaml
              cp /managed-config/package_fleet_alerts.yaml /config/packages/fleet_alerts.yaml
              cp /managed-config/package_marine.yaml /config/packages/marine.yaml

              cp /managed-config/dashboard_overview.yaml /config/dashboards/overview.yaml
              cp /managed-config/dashboard_local.yaml /config/dashboards/local.yaml
              cp /managed-config/dashboard_ops.yaml /config/dashboards/ops.yaml
              cp /managed-config/dashboard_admin.yaml /config/dashboards/admin.yaml
              cp /managed-config/dashboard_printing.yaml /config/dashboards/printing.yaml
              cp /managed-config/dashboard_vacuum.yaml /config/dashboards/vacuum.yaml
              cp /managed-config/dashboard_launcher.yaml /config/dashboards/launcher.yaml
              cp /managed-config/dashboard_voice.yaml /config/dashboards/voice.yaml
              cp /managed-config/dashboard_wall.yaml /config/dashboards/wall.yaml
          volumeMounts:
            - name: config
              mountPath: /config
            - name: managed-config
              mountPath: /managed-config
        - name: seed-integrations
          image: ghcr.io/home-assistant/home-assistant:stable
          command:
            - python3
            - -c
            - |
              import json, os, uuid
              from datetime import datetime, timezone

              CONFIG_FILE = "/config/.storage/core.config_entries"
              DOMAIN = "bambu_lab"

              serial = os.environ.get("BAMBU_SERIAL", "").upper()
              host = os.environ.get("BAMBU_HOST", "")
              access_code = os.environ.get("BAMBU_ACCESS_CODE", "")

              if not all([serial, host, access_code]):
                  print("WARN: Bambu credentials not set, skipping config seeding")
                  exit(0)

              os.makedirs(os.path.dirname(CONFIG_FILE), exist_ok=True)

              if os.path.exists(CONFIG_FILE):
                  with open(CONFIG_FILE) as f:
                      store = json.load(f)
              else:
                  store = {"version": 1, "minor_version": 4, "key": "core.config_entries", "data": {"entries": []}}

              # Ensure all existing entries have required fields
              dirty = False
              for e in store["data"]["entries"]:
                  if "subentries" not in e:
                      e["subentries"] = {}
                      dirty = True

              for entry in store["data"]["entries"]:
                  if entry.get("domain") == DOMAIN and entry.get("data", {}).get("serial") == serial:
                      if dirty:
                          with open(CONFIG_FILE, "w") as f:
                              json.dump(store, f, indent=2)
                          print("Patched existing entries with missing fields")
                      print(f"Config entry for {DOMAIN} serial={serial} already exists, skipping")
                      exit(0)

              now = datetime.now(timezone.utc).isoformat()
              entry = {
                  "created_at": now,
                  "data": {
                      "device_type": "A1",
                      "serial": serial,
                  },
                  "disabled_by": None,
                  "discovery_keys": {},
                  "domain": DOMAIN,
                  "entry_id": uuid.uuid4().hex,
                  "minor_version": 1,
                  "modified_at": now,
                  "options": {
                      "region": "",
                      "email": "",
                      "username": "",
                      "name": f"A1-{serial}",
                      "host": host,
                      "local_mqtt": True,
                      "auth_token": "",
                      "access_code": access_code,
                      "print_cache_count": 100,
                      "timelapse_cache_count": 1,
                      "usage_hours": 0.0,
                      "disable_ssl_verify": False,
                      "enable_firmware_update": False,
                      "force_ip": False,
                  },
                  "pref_disable_new_entities": False,
                  "pref_disable_polling": False,
                  "source": "user",
                  "subentries": {},
                  "title": serial,
                  "unique_id": None,
                  "version": 2,
              }

              store["data"]["entries"].append(entry)
              with open(CONFIG_FILE, "w") as f:
                  json.dump(store, f, indent=2)
              print(f"Seeded {DOMAIN} config entry for serial={serial}")
          env:
            - name: BAMBU_SERIAL
              valueFrom:
                secretKeyRef:
                  name: bambu-a1-credentials
                  key: serial
            - name: BAMBU_HOST
              valueFrom:
                secretKeyRef:
                  name: bambu-a1-credentials
                  key: host
            - name: BAMBU_ACCESS_CODE
              valueFrom:
                secretKeyRef:
                  name: bambu-a1-credentials
                  key: access-code
          volumeMounts:
            - name: config
              mountPath: /config
        # Seed the tapo_rv30 config entry (the integration is config-flow-only).
        # Schema mirrors custom_components/tapo_rv30/config_flow.py @ v0.3.0:
        # entry.data = {host, username, password}; unique_id = host; VERSION = 1.
        - name: seed-tapo-rv30
          image: ghcr.io/home-assistant/home-assistant:stable
          command:
            - python3
            - -c
            - |
              import json, os, uuid
              from datetime import datetime, timezone

              CONFIG_FILE = "/config/.storage/core.config_entries"
              DOMAIN = "tapo_rv30"

              host = os.environ.get("RV30_HOST", "")
              username = os.environ.get("RV30_USERNAME", "")
              password = os.environ.get("RV30_PASSWORD", "")

              if not all([host, username, password]):
                  print("WARN: RV30 credentials not set, skipping config seeding")
                  exit(0)

              os.makedirs(os.path.dirname(CONFIG_FILE), exist_ok=True)

              if os.path.exists(CONFIG_FILE):
                  with open(CONFIG_FILE) as f:
                      store = json.load(f)
              else:
                  store = {"version": 1, "minor_version": 4, "key": "core.config_entries", "data": {"entries": []}}

              for entry in store["data"]["entries"]:
                  if entry.get("domain") == DOMAIN and entry.get("data", {}).get("host") == host:
                      print(f"Config entry for {DOMAIN} host={host} already exists, skipping")
                      exit(0)

              now = datetime.now(timezone.utc).isoformat()
              entry = {
                  "created_at": now,
                  "data": {
                      "host": host,
                      "username": username,
                      "password": password,
                  },
                  "disabled_by": None,
                  "discovery_keys": {},
                  "domain": DOMAIN,
                  "entry_id": uuid.uuid4().hex,
                  "minor_version": 1,
                  "modified_at": now,
                  "options": {},
                  "pref_disable_new_entities": False,
                  "pref_disable_polling": False,
                  "source": "user",
                  "subentries": {},
                  "title": f"Tapo RV30 ({host})",
                  "unique_id": host,
                  "version": 1,
              }

              store["data"]["entries"].append(entry)
              with open(CONFIG_FILE, "w") as f:
                  json.dump(store, f, indent=2)
              print(f"Seeded {DOMAIN} config entry for host={host}")
          env:
            - name: RV30_HOST
              valueFrom:
                secretKeyRef:
                  name: tapo-rv30-credentials
                  key: host
            - name: RV30_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tapo-rv30-credentials
                  key: username
            - name: RV30_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tapo-rv30-credentials
                  key: password
          volumeMounts:
            - name: config
              mountPath: /config
        # Seed a geo_json_events config entry → public markers on the Map (USGS
        # earthquakes near home). The integration is config-flow-only (no YAML
        # platform), so we seed it like Bambu/Tapo. Schema mirrors
        # geo_json_events/config_flow.py: data = {url, latitude, longitude,
        # radius(km)}; VERSION = 1. Home coords are read from HA's OWN runtime
        # config (.storage/core.config) so precise coordinates never live in git
        # (this repo mirrors to GitHub). Idempotent: keyed on domain + feed url.
        - name: seed-geo-feeds
          image: ghcr.io/home-assistant/home-assistant:stable
          command:
            - python3
            - -c
            - |
              import json, os, uuid
              from datetime import datetime, timezone

              ENTRIES = "/config/.storage/core.config_entries"
              CORE = "/config/.storage/core.config"
              DOMAIN = "geo_json_events"
              URL = "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_week.geojson"
              RADIUS_KM = 500.0
              TITLE = "USGS Earthquakes M2.5+ (week)"

              # Home coords from HA's runtime config — keeps them out of git.
              try:
                  with open(CORE) as f:
                      core = json.load(f)
                  lat = core["data"]["latitude"]
                  lon = core["data"]["longitude"]
              except Exception as e:
                  print(f"WARN: could not read home coords ({e}); skipping geo feed seed")
                  exit(0)

              if not os.path.exists(ENTRIES):
                  print("WARN: core.config_entries missing; skipping (HA not initialised yet)")
                  exit(0)

              with open(ENTRIES) as f:
                  store = json.load(f)
              entries = store["data"]["entries"]

              for e in entries:
                  if e.get("domain") == DOMAIN and e.get("data", {}).get("url") == URL:
                      print(f"{DOMAIN} entry for feed already exists, skipping")
                      exit(0)

              # HA is strict on load — ensure existing entries carry subentries.
              for e in entries:
                  e.setdefault("subentries", {})

              now = datetime.now(timezone.utc).isoformat()
              entries.append({
                  "created_at": now,
                  "data": {"url": URL, "latitude": lat, "longitude": lon, "radius": RADIUS_KM},
                  "disabled_by": None,
                  "discovery_keys": {},
                  "domain": DOMAIN,
                  "entry_id": uuid.uuid4().hex,
                  "minor_version": 1,
                  "modified_at": now,
                  "options": {},
                  "pref_disable_new_entities": False,
                  "pref_disable_polling": False,
                  "source": "user",
                  "subentries": {},
                  "title": TITLE,
                  "unique_id": None,
                  "version": 1,
              })
              with open(ENTRIES, "w") as f:
                  json.dump(store, f, indent=2)
              print(f"Seeded {DOMAIN} feed entry centered on home")
          volumeMounts:
            - name: config
              mountPath: /config
        # Seed the LocalTuya hub config entry (domain "localtuya", ENTRIES_VERSION
        # = 4) for the Fumoi litter box. no_cloud=True → fully local. GOTCHA:
        # localtuya/__init__.py reads region/client_id/client_secret/user_id
        # UNCONDITIONALLY (before the no_cloud branch), so those keys must exist
        # (empty) even for a local-only entry — omit them and setup KeyErrors.
        # Entities: DP1-5 are confirmed writable controls (types verified vs the
        # Tuya cloud schema); DP6/7/8/9/110 are read-only sensors with PROVISIONAL
        # labels (confirm semantics via a live clean cycle, then relabel).
        # manual_clean + factory_reset are omitted (unknown/destructive DP id).
        # Idempotent on domain. Seed schema mirrors custom_components/localtuya
        # config_flow.py @ 2025.11.0 (per-platform flow_schema required keys).
        - name: seed-localtuya
          image: ghcr.io/home-assistant/home-assistant:stable
          command:
            - python3
            - -c
            - |
              import json, os, uuid
              from datetime import datetime, timezone

              CONFIG_FILE = "/config/.storage/core.config_entries"
              DOMAIN = "localtuya"

              device_id = os.environ.get("LT_DEVICE_ID", "")
              local_key = os.environ.get("LT_LOCAL_KEY", "")
              host = os.environ.get("LT_HOST", "")
              protocol = os.environ.get("LT_PROTOCOL", "3.3")
              name = os.environ.get("LT_NAME", "Tuya Device")

              if not all([device_id, local_key, host]):
                  print("WARN: LocalTuya credentials not set, skipping config seeding")
                  raise SystemExit(0)
              if not os.path.exists(CONFIG_FILE):
                  print("WARN: core.config_entries missing; HA not initialised yet, skipping")
                  raise SystemExit(0)

              with open(CONFIG_FILE) as f:
                  store = json.load(f)
              entries = store["data"]["entries"]

              for e in entries:
                  if e.get("domain") == DOMAIN:
                      print(f"{DOMAIN} entry already exists, skipping")
                      raise SystemExit(0)

              # HA is strict on load — ensure existing entries carry subentries.
              for e in entries:
                  e.setdefault("subentries", {})

              def ent(dp, platform, fname, **extra):
                  d = {"platform": platform, "id": dp, "friendly_name": fname,
                       "entity_category": "None"}
                  d.update(extra)
                  return d

              entities = [
                  ent("1", "switch", "Power",
                      restore_on_reconnect=False, is_passive_entity=False),
                  ent("2", "select", "Mode",
                      select_options={"auto_clean": "Auto clean", "manual_clean": "Manual clean"},
                      restore_on_reconnect=False, is_passive_entity=False),
                  ent("3", "button", "Start Clean"),
                  ent("4", "switch", "Auto Clean",
                      restore_on_reconnect=False, is_passive_entity=False),
                  ent("5", "number", "Clean Delay",
                      min_value=1.0, max_value=60.0, step_size=1.0, unit_of_measurement="min"),
                  ent("8", "sensor", "Litter Level"),
                  ent("6", "sensor", "Counter A"),
                  ent("7", "sensor", "Counter B"),
                  ent("9", "binary_sensor", "Bin Full", state_on="true"),
                  ent("110", "sensor", "Status"),
              ]

              device = {
                  "friendly_name": name,
                  "host": host,
                  "device_id": device_id,
                  "local_key": local_key,
                  "protocol_version": protocol,
                  "enable_debug": False,
                  "entities": entities,
              }

              now = datetime.now(timezone.utc).isoformat()
              entries.append({
                  "created_at": now,
                  "data": {
                      "region": "us", "client_id": "", "client_secret": "", "user_id": "",
                      "no_cloud": True,
                      "devices": {device_id: device},
                  },
                  "disabled_by": None,
                  "discovery_keys": {},
                  "domain": DOMAIN,
                  "entry_id": uuid.uuid4().hex,
                  "minor_version": 1,
                  "modified_at": now,
                  "options": {},
                  "pref_disable_new_entities": False,
                  "pref_disable_polling": False,
                  "source": "user",
                  "subentries": {},
                  "title": name,
                  "unique_id": None,
                  "version": 4,
              })
              with open(CONFIG_FILE, "w") as f:
                  json.dump(store, f, indent=2)
              print(f"Seeded {DOMAIN} entry with {len(entities)} entities for {name}")
          env:
            - name: LT_DEVICE_ID
              valueFrom:
                secretKeyRef:
                  name: localtuya-litterbox-credentials
                  key: device-id
            - name: LT_LOCAL_KEY
              valueFrom:
                secretKeyRef:
                  name: localtuya-litterbox-credentials
                  key: local-key
            - name: LT_HOST
              valueFrom:
                secretKeyRef:
                  name: localtuya-litterbox-credentials
                  key: host
            - name: LT_PROTOCOL
              valueFrom:
                secretKeyRef:
                  name: localtuya-litterbox-credentials
                  key: protocol-version
            - name: LT_NAME
              valueFrom:
                secretKeyRef:
                  name: localtuya-litterbox-credentials
                  key: friendly-name
          volumeMounts:
            - name: config
              mountPath: /config
        # Seed remote_calendar config entries → read-only iCal feeds on the
        # dashboard ("what's on": concerts, events, holidays). Config-flow-only,
        # so seed like the others. It's resilient (retries via ConfigEntryNotReady
        # if a feed is briefly unreachable). Baseline = the PUBLIC US Holidays feed
        # (safe in git). PRIVATE feeds (a Songkick personal concert .ics, your own
        # calendar's secret iCal) come from an OPTIONAL SOPS secret as a JSON array
        # HA_REMOTE_CALENDARS_JSON=[{"name":..,"url":..}] so their tokens never
        # enter git. Idempotent: keyed on domain + feed url.
        - name: seed-remote-calendars
          image: ghcr.io/home-assistant/home-assistant:stable
          command:
            - python3
            - -c
            - |
              import json, os, uuid
              from datetime import datetime, timezone

              ENTRIES = "/config/.storage/core.config_entries"
              DOMAIN = "remote_calendar"

              feeds = [{
                  "name": "US Holidays",
                  "url": "https://calendar.google.com/calendar/ical/en.usa%23holiday%40group.v.calendar.google.com/public/basic.ics",
              }, {
                  # In-cluster spotify-concerts bridge → concerts near home for
                  # your Spotify artists (empty until that app's creds are set).
                  "name": "Concerts",
                  "url": "http://spotify-concerts.spotify-concerts.svc.cluster.local/concerts.ics",
              }]
              extra = os.environ.get("HA_REMOTE_CALENDARS_JSON", "").strip()
              if extra:
                  try:
                      feeds += json.loads(extra)
                  except Exception as e:
                      print(f"WARN: bad HA_REMOTE_CALENDARS_JSON ({e}); ignoring")

              if not os.path.exists(ENTRIES):
                  print("WARN: core.config_entries missing; skipping")
                  exit(0)

              with open(ENTRIES) as f:
                  store = json.load(f)
              entries = store["data"]["entries"]
              for e in entries:
                  e.setdefault("subentries", {})

              existing = {e.get("data", {}).get("url") for e in entries if e.get("domain") == DOMAIN}
              now = datetime.now(timezone.utc).isoformat()
              added = 0
              for feed in feeds:
                  url = (feed.get("url") or "").strip()
                  name = (feed.get("name") or "").strip()
                  if not url or not name:
                      continue
                  if url.startswith("webcal://"):
                      url = "https://" + url[len("webcal://"):]
                  if url in existing:
                      print(f"remote_calendar '{name}' already exists, skipping")
                      continue
                  entries.append({
                      "created_at": now,
                      "data": {"calendar_name": name, "url": url},
                      "disabled_by": None,
                      "discovery_keys": {},
                      "domain": DOMAIN,
                      "entry_id": uuid.uuid4().hex,
                      "minor_version": 1,
                      "modified_at": now,
                      "options": {},
                      "pref_disable_new_entities": False,
                      "pref_disable_polling": False,
                      "source": "user",
                      "subentries": {},
                      "title": name,
                      "unique_id": None,
                      "version": 1,
                  })
                  existing.add(url)
                  added += 1
                  print(f"Seeded remote_calendar '{name}'")
              if added:
                  with open(ENTRIES, "w") as f:
                      json.dump(store, f, indent=2)
              print(f"remote_calendar seed done (+{added})")
          env:
            - name: HA_REMOTE_CALENDARS_JSON
              valueFrom:
                secretKeyRef:
                  name: home-assistant-calendars
                  key: feeds-json
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /config
        # Seed the Binks conversation agent (extended_openai_conversation is
        # config-flow-only). Idempotent on domain. It uses the LEGACY conversation
        # agent API, so its agent_id IS this config entry_id (the pipeline seed
        # below looks it up). Model + persona live in options; skip_authentication
        # keeps HA boot independent of LiteLLM being reachable at that instant.
        - name: seed-binks-conversation
          image: ghcr.io/home-assistant/home-assistant:stable
          command:
            - python3
            - -c
            - |
              import json, os, uuid
              from datetime import datetime, timezone

              ENTRIES = "/config/.storage/core.config_entries"
              DOMAIN = "extended_openai_conversation"

              api_key = os.environ.get("LITELLM_ASSIST_KEY", "").strip()
              if not api_key:
                  print("WARN: LITELLM_ASSIST_KEY not set; skipping Binks conversation seed")
                  exit(0)

              os.makedirs(os.path.dirname(ENTRIES), exist_ok=True)
              if os.path.exists(ENTRIES):
                  with open(ENTRIES) as f:
                      store = json.load(f)
              else:
                  store = {"version": 1, "minor_version": 4, "key": "core.config_entries", "data": {"entries": []}}
              entries = store["data"]["entries"]
              for e in entries:
                  e.setdefault("subentries", {})

              for e in entries:
                  if e.get("domain") == DOMAIN:
                      print("Binks conversation entry already exists, skipping")
                      exit(0)

              prompt = (
                  'You are "Binks", the voice of this Home Assistant smart home. '
                  'Speak in short, warm, natural sentences — one or two at most, meant to be read aloud. '
                  'Helpful, a touch playful, never verbose.\n\n'
                  'Current time: {{now()}}\n\n'
                  'You can see and control these exposed devices:\n'
                  '```csv\n'
                  'entity_id,name,state,aliases\n'
                  '{% for entity in exposed_entities -%}\n'
                  "{{ entity.entity_id }},{{ entity.name }},{{ entity.state }},{{ entity.aliases | join('/') }}\n"
                  '{% endfor -%}\n'
                  '```\n\n'
                  'Rules:\n'
                  '- To perform an action, call the execute_services function with the correct domain, service '
                  'and entity_id from the list above. Act on clear commands without asking for confirmation.\n'
                  '- Call execute_services only for a requested action, never just to read state (states are above).\n'
                  '- If a request is ambiguous or the device is not listed, say so briefly instead of guessing.\n'
                  '- Keep every reply short enough to speak aloud.'
              )

              now = datetime.now(timezone.utc).isoformat()
              entries.append({
                  "created_at": now,
                  "data": {
                      "api_key": api_key,
                      "base_url": "http://litellm.ai-gateway.svc.cluster.local:4000/v1",
                      "skip_authentication": True,
                      "name": "Binks",
                  },
                  "disabled_by": None,
                  "discovery_keys": {},
                  "domain": DOMAIN,
                  "entry_id": uuid.uuid4().hex,
                  "minor_version": 1,
                  "modified_at": now,
                  "options": {
                      "chat_model": "vlm (gemini-3-flash)",
                      "max_tokens": 500,
                      "temperature": 0.4,
                      "top_p": 1,
                      "use_tools": True,
                      "max_function_calls_per_conversation": 3,
                      "prompt": prompt,
                  },
                  "pref_disable_new_entities": False,
                  "pref_disable_polling": False,
                  "source": "user",
                  "subentries": {},
                  "title": "Binks",
                  "unique_id": None,
                  "version": 1,
              })
              with open(ENTRIES, "w") as f:
                  json.dump(store, f, indent=2)
              print("Seeded Binks conversation agent (extended_openai_conversation)")
          env:
            - name: LITELLM_ASSIST_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-assist-credentials
                  key: api-key
          volumeMounts:
            - name: config
              mountPath: /config
        # Expose a conservative, action-only set of entities to the Assist
        # "conversation" assistant so Binks can control them. Reads the entity
        # registry; allow-lists actionable domains (deliberately NOT lock/alarm).
        # Idempotent + non-destructive: only sets entities that have no existing
        # conversation decision, so a user un-expose in the UI is never overridden.
        - name: seed-binks-expose
          image: ghcr.io/home-assistant/home-assistant:stable
          command:
            - python3
            - -c
            - |
              import json, os

              REG = "/config/.storage/core.entity_registry"
              EXP = "/config/.storage/homeassistant.exposed_entities"
              ALLOW = {"light", "switch", "scene", "script", "fan", "cover",
                       "climate", "media_player", "vacuum", "input_boolean"}

              if not os.path.exists(REG):
                  print("WARN: entity registry missing (fresh install?); skipping expose seed")
                  exit(0)
              with open(REG) as f:
                  reg = json.load(f)
              wanted = [e["entity_id"] for e in reg["data"]["entities"]
                        if e["entity_id"].split(".")[0] in ALLOW
                        and not e.get("hidden_by") and not e.get("disabled_by")]

              if os.path.exists(EXP):
                  with open(EXP) as f:
                      store = json.load(f)
              else:
                  store = {"version": 1, "minor_version": 1, "key": "homeassistant.exposed_entities",
                           "data": {"assistants": {}, "exposed_entities": {}}}
              ee = store["data"].setdefault("exposed_entities", {})

              added = 0
              for eid in wanted:
                  node = ee.setdefault(eid, {"assistants": {}})
                  assistants = node.setdefault("assistants", {})
                  if "conversation" not in assistants:
                      assistants["conversation"] = {"should_expose": True}
                      added += 1
              if added:
                  with open(EXP, "w") as f:
                      json.dump(store, f, indent=2)
              print(f"Assist exposure seed done (+{added} newly exposed, {len(wanted)} candidates)")
          volumeMounts:
            - name: config
              mountPath: /config
        # Stage 2 — seed the openai_whisper_cloud STT config entry in "Custom"
        # provider mode, pointed at our LiteLLM transcription endpoint. NOTE: for
        # a custom provider the component uses the URL AS-IS (it does NOT append
        # /v1/audio/transcriptions), so the URL must be the FULL endpoint. No
        # network validation happens at entry load, so HA boot stays independent
        # of LiteLLM. Idempotent on domain. Entity id derives from name → stt.binks_stt.
        - name: seed-openai-stt
          image: ghcr.io/home-assistant/home-assistant:stable
          command:
            - python3
            - -c
            - |
              import json, os, uuid
              from datetime import datetime, timezone

              ENTRIES = "/config/.storage/core.config_entries"
              DOMAIN = "openai_whisper_cloud"

              api_key = os.environ.get("LITELLM_ASSIST_KEY", "").strip()
              if not api_key:
                  print("WARN: LITELLM_ASSIST_KEY not set; skipping STT seed")
                  exit(0)

              os.makedirs(os.path.dirname(ENTRIES), exist_ok=True)
              if os.path.exists(ENTRIES):
                  with open(ENTRIES) as f:
                      store = json.load(f)
              else:
                  store = {"version": 1, "minor_version": 4, "key": "core.config_entries", "data": {"entries": []}}
              entries = store["data"]["entries"]
              for e in entries:
                  e.setdefault("subentries", {})

              for e in entries:
                  if e.get("domain") == DOMAIN:
                      print("STT entry already exists, skipping")
                      exit(0)

              now = datetime.now(timezone.utc).isoformat()
              entries.append({
                  "created_at": now,
                  "data": {
                      "custom_provider": True,
                      "name": "Binks STT",
                      "url": "http://litellm.ai-gateway.svc.cluster.local:4000/v1/audio/transcriptions",
                      "api_key": api_key,
                  },
                  "disabled_by": None,
                  "discovery_keys": {},
                  "domain": DOMAIN,
                  "entry_id": uuid.uuid4().hex,
                  "minor_version": 3,
                  "modified_at": now,
                  "options": {
                      "model": "stt (whisper-turbo)",
                      "temperature": 0,
                      "prompt": "",
                  },
                  "pref_disable_new_entities": False,
                  "pref_disable_polling": False,
                  "source": "user",
                  "subentries": {},
                  "title": "Binks STT",
                  "unique_id": None,
                  "version": 1,
              })
              with open(ENTRIES, "w") as f:
                  json.dump(store, f, indent=2)
              print("Seeded Binks STT (openai_whisper_cloud, custom → litellm whisper-turbo)")
          env:
            - name: LITELLM_ASSIST_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-assist-credentials
                  key: api-key
          volumeMounts:
            - name: config
              mountPath: /config
        # Stage 3 — seed the Wyoming integration config entry pointing at our
        # in-cluster wyoming-openwakeword service (apps/openwakeword). Config-flow
        # only, so seed it like the others. async_setup_entry raises
        # ConfigEntryNotReady if the service is unreachable → HA boot is safe
        # (setup_retry) and the wake_word.openwakeword entity appears once it
        # connects. Idempotent on domain + host.
        - name: seed-wyoming-openwakeword
          image: ghcr.io/home-assistant/home-assistant:stable
          command:
            - python3
            - -c
            - |
              import json, os, uuid
              from datetime import datetime, timezone

              ENTRIES = "/config/.storage/core.config_entries"
              DOMAIN = "wyoming"
              HOST = "wyoming-openwakeword.home-assistant.svc.cluster.local"
              PORT = 10400

              os.makedirs(os.path.dirname(ENTRIES), exist_ok=True)
              if os.path.exists(ENTRIES):
                  with open(ENTRIES) as f:
                      store = json.load(f)
              else:
                  store = {"version": 1, "minor_version": 4, "key": "core.config_entries", "data": {"entries": []}}
              entries = store["data"]["entries"]
              for e in entries:
                  e.setdefault("subentries", {})

              for e in entries:
                  if e.get("domain") == DOMAIN and e.get("data", {}).get("host") == HOST:
                      print("Wyoming (openwakeword) entry already exists, skipping")
                      exit(0)

              now = datetime.now(timezone.utc).isoformat()
              entries.append({
                  "created_at": now,
                  "data": {"host": HOST, "port": PORT},
                  "disabled_by": None,
                  "discovery_keys": {},
                  "domain": DOMAIN,
                  "entry_id": uuid.uuid4().hex,
                  "minor_version": 1,
                  "modified_at": now,
                  "options": {},
                  "pref_disable_new_entities": False,
                  "pref_disable_polling": False,
                  "source": "user",
                  "subentries": {},
                  "title": "openwakeword",
                  "unique_id": None,
                  "version": 1,
              })
              with open(ENTRIES, "w") as f:
                  json.dump(store, f, indent=2)
              print(f"Seeded Wyoming entry → {HOST}:{PORT} (openwakeword)")
          volumeMounts:
            - name: config
              mountPath: /config
        # Seed a "Binks" Assist pipeline whose conversation engine is the Binks
        # agent (agent_id = the extended_openai_conversation entry_id, looked up
        # here) and make it the preferred pipeline. Stage 1 is chat-only, so
        # stt/tts/wake stay null; later stages patch stt_engine/tts_engine/
        # wake_word on this SAME pipeline (existing values are preserved on
        # re-run). Idempotent on pipeline name "Binks". The prior "Home Assistant"
        # pipeline is kept in items so it stays selectable.
        - name: seed-binks-pipeline
          image: ghcr.io/home-assistant/home-assistant:stable
          command:
            - python3
            - -c
            - |
              import json, os, uuid

              ENTRIES = "/config/.storage/core.config_entries"
              PIPE = "/config/.storage/assist_pipeline.pipelines"

              if not os.path.exists(ENTRIES):
                  print("WARN: core.config_entries missing; skipping pipeline seed")
                  exit(0)
              with open(ENTRIES) as f:
                  entries = json.load(f)["data"]["entries"]
              agent_id = next((e["entry_id"] for e in entries
                               if e.get("domain") == "extended_openai_conversation"), None)
              if not agent_id:
                  print("WARN: Binks conversation entry not found; skipping pipeline seed")
                  exit(0)

              # Stage 2 STT: the openai_whisper_cloud entity. Resolve its real
              # entity_id from the registry; fall back to the deterministic id
              # derived from its name ("Binks STT") on first boot before it exists.
              stt_engine = "stt.binks_stt"
              REG = "/config/.storage/core.entity_registry"
              if os.path.exists(REG):
                  with open(REG) as f:
                      for ent in json.load(f)["data"]["entities"]:
                          if ent.get("platform") == "openai_whisper_cloud":
                              stt_engine = ent["entity_id"]
                              break

              if os.path.exists(PIPE):
                  with open(PIPE) as f:
                      store = json.load(f)
              else:
                  store = {"version": 1, "minor_version": 2, "key": "assist_pipeline.pipelines",
                           "data": {"items": [], "preferred_item": None}}
              items = store["data"]["items"]

              binks = next((p for p in items if p.get("name") == "Binks"), None)
              if binks is None:
                  binks = {"id": uuid.uuid4().hex, "name": "Binks"}
                  items.append(binks)
                  print("Created Binks pipeline")
              else:
                  print("Binks pipeline exists; refreshing conversation engine")
              binks.update({
                  "conversation_engine": agent_id,
                  "conversation_language": "en",
                  "language": "en",
                  "stt_engine": stt_engine,
                  "stt_language": "en",
                  "tts_engine": "tts.google_translate_en_com",
                  "tts_language": "en",
                  "tts_voice": binks.get("tts_voice"),
                  # Stage 3 wake word. Validated with the built-in "okay_nabu";
                  # flip wake_word_id to "hey_binks" once hey_binks.tflite is
                  # trained and shipped into apps/openwakeword (/custom).
                  "wake_word_entity": "wake_word.openwakeword",
                  "wake_word_id": "okay_nabu",
                  "prefer_local_intents": False,
              })
              store["data"]["preferred_item"] = binks["id"]
              with open(PIPE, "w") as f:
                  json.dump(store, f, indent=2)
              print(f"Binks pipeline preferred (agent={agent_id}, stt={stt_engine}, "
                    f"tts=tts.google_translate_en_com, wake=wake_word.openwakeword/okay_nabu)")
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:stable
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: managed-config
          configMap:
            name: home-assistant-managed-config
