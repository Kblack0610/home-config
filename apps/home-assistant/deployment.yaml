apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate  # Important for single-instance apps with PVCs
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
    spec:
      initContainers:
        # Copy sensor configs from ConfigMap to PVC (only if they don't exist)
        - name: copy-cluster-config
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              # Copy sensor configs if they don't exist
              if [ ! -f /config/sensors_cluster.yaml ]; then
                echo "Copying sensors_cluster.yaml..."
                cp /configmap/sensors_cluster.yaml /config/
              fi
              if [ ! -f /config/sensors_pods.yaml ]; then
                echo "Copying sensors_pods.yaml..."
                cp /configmap/sensors_pods.yaml /config/
              fi
              # Show what's in config
              echo "Config files:"
              ls -la /config/*.yaml 2>/dev/null || echo "No yaml files yet"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cluster-config
              mountPath: /configmap
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:stable
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: cluster-config
          configMap:
            name: home-assistant-cluster-config
