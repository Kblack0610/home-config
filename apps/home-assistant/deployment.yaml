        # Expose a conservative, action-only set of entities to the Assist
        # "conversation" assistant so Binks can control them. Reads the entity
        # registry; allow-lists actionable domains (deliberately NOT lock/alarm).
        # Idempotent + non-destructive: only sets entities that have no existing
        # conversation decision, so a user un-expose in the UI is never overridden.
        - name: seed-binks-expose
          image: ghcr.io/home-assistant/home-assistant:stable
          command:
            - python3
            - -c
            - |
              import json, os

              REG = "/config/.storage/core.entity_registry"
              EXP = "/config/.storage/homeassistant.exposed_entities"
              ALLOW = {"light", "switch", "scene", "script", "fan", "cover",
                       "climate", "media_player", "vacuum", "input_boolean"}

              if not os.path.exists(REG):
                  print("WARN: entity registry missing (fresh install?); skipping expose seed")
                  exit(0)
              with open(REG) as f:
                  reg = json.load(f)
              wanted = [e["entity_id"] for e in reg["data"]["entities"]
                        if e["entity_id"].split(".")[0] in ALLOW
                        and not e.get("hidden_by") and not e.get("disabled_by")]

              if os.path.exists(EXP):
                  with open(EXP) as f:
                      store = json.load(f)
              else:
                  store = {"version": 1, "minor_version": 1, "key": "homeassistant.exposed_entities",
                           "data": {"assistants": {}, "exposed_entities": {}}}
              ee = store["data"].setdefault("exposed_entities", {})

              added = 0
              for eid in wanted:
                  node = ee.setdefault(eid, {"assistants": {}})
                  assistants = node.setdefault("assistants", {})
                  if "conversation" not in assistants:
                      assistants["conversation"] = {"should_expose": True}
                      added += 1
              if added:
                  with open(EXP, "w") as f:
                      json.dump(store, f, indent=2)
              print(f"Assist exposure seed done (+{added} newly exposed, {len(wanted)} candidates)")
