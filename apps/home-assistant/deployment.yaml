apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
    spec:
      initContainers:
        - name: install-hacs
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -eu
              TARGET="/config/custom_components/hacs"
              if [ -d "$TARGET" ]; then
                echo "HACS already installed, skipping"
                exit 0
              fi
              apk add --no-cache wget unzip
              mkdir -p /config/custom_components
              wget -q -O /tmp/hacs.zip \
                "https://github.com/hacs/integration/releases/latest/download/hacs.zip"
              mkdir -p "$TARGET"
              unzip -q /tmp/hacs.zip -d "$TARGET"
              rm /tmp/hacs.zip
              echo "HACS installed to $TARGET"
          volumeMounts:
            - name: config
              mountPath: /config
        - name: sync-managed-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /config/packages /config/dashboards

              cp /managed-config/configuration.yaml /config/configuration.yaml
              cp /managed-config/automations.yaml /config/automations.yaml
              cp /managed-config/scripts.yaml /config/scripts.yaml
              cp /managed-config/scenes.yaml /config/scenes.yaml
              cp /managed-config/ui-lovelace.yaml /config/ui-lovelace.yaml

              cp /managed-config/package_cluster_metrics.yaml /config/packages/cluster_metrics.yaml
              cp /managed-config/package_service_metrics.yaml /config/packages/service_metrics.yaml
              cp /managed-config/package_homelab_endpoints.yaml /config/packages/homelab_endpoints.yaml
              cp /managed-config/package_derived_metrics.yaml /config/packages/derived_metrics.yaml

              cp /managed-config/dashboard_overview.yaml /config/dashboards/overview.yaml
              cp /managed-config/dashboard_ops.yaml /config/dashboards/ops.yaml
              cp /managed-config/dashboard_admin.yaml /config/dashboards/admin.yaml
              cp /managed-config/dashboard_printing.yaml /config/dashboards/printing.yaml
          volumeMounts:
            - name: config
              mountPath: /config
            - name: managed-config
              mountPath: /managed-config
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:stable
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: managed-config
          configMap:
            name: home-assistant-managed-config
