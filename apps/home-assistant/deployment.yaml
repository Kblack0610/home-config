apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
    spec:
      initContainers:
        - name: install-bambu-lab
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -eu
              VERSION="v2.2.21"
              TARGET="/config/custom_components/bambu_lab"
              MARKER="$TARGET/.version"
              if [ -f "$MARKER" ] && [ "$(cat "$MARKER")" = "$VERSION" ]; then
                echo "bambu_lab $VERSION already installed, skipping"
                exit 0
              fi
              apk add --no-cache wget unzip
              rm -rf "$TARGET"
              mkdir -p "$TARGET"
              wget -q -O /tmp/bambu_lab.zip \
                "https://github.com/greghesp/ha-bambulab/releases/download/$VERSION/bambu_lab.zip"
              unzip -o -q /tmp/bambu_lab.zip -d "$TARGET"
              echo "$VERSION" > "$MARKER"
              rm /tmp/bambu_lab.zip
              echo "bambu_lab $VERSION installed"
          volumeMounts:
            - name: config
              mountPath: /config
        # Tapo RV30 robot vacuum: local-only (TPAP/SPAKE2+) reverse-engineered
        # integration. No release .zip asset exists, so we pull the tag source
        # tarball and copy out the custom_components/tapo_rv30 dir. RESILIENT:
        # `set -u` + final `exit 0` so a failed download never blocks HA boot;
        # the marker is written only on success, so a failure retries next start.
        - name: install-tapo-rv30
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -u
              VERSION="v0.3.0"
              TARGET="/config/custom_components/tapo_rv30"
              MARKER="$TARGET/.version"
              if [ -f "$MARKER" ] && [ "$(cat "$MARKER")" = "$VERSION" ]; then
                echo "tapo_rv30 $VERSION already installed, skipping"
                exit 0
              fi
              apk add --no-cache wget tar >/dev/null
              mkdir -p /config/custom_components
              if wget -q -O /tmp/rv30.tgz \
                  "https://github.com/epg-pers/tapo-rv30-ha/archive/refs/tags/$VERSION.tar.gz"; then
                rm -rf "$TARGET"; mkdir -p "$TARGET"
                tar -xzf /tmp/rv30.tgz -C /tmp
                cp -r /tmp/tapo-rv30-ha-*/custom_components/tapo_rv30/. "$TARGET/"
                rm -rf /tmp/rv30.tgz /tmp/tapo-rv30-ha-*
                echo "$VERSION" > "$MARKER"
                echo "tapo_rv30 $VERSION installed"
              else
                echo "WARN: tapo_rv30 download failed; no marker written, will retry next start"
              fi
              exit 0
          volumeMounts:
            - name: config
              mountPath: /config
        # LocalTuya (xZetsubou fork): fully-local control of Tuya WiFi devices
        # (e.g. the Fumoi litter box) — no cloud in the control path. No release
        # .zip asset, so pull the tag source tarball and copy custom_components/
        # localtuya. RESILIENT: `set -u` + final `exit 0` so a failed download
        # never blocks HA boot; the marker is written only on success → retries
        # next start. The device config entry is seeded separately (see the
        # LocalTuya section in docs/smart-home-control.md).
        - name: install-localtuya
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -u
              VERSION="2025.11.0"
              TARGET="/config/custom_components/localtuya"
              MARKER="$TARGET/.version"
              if [ -f "$MARKER" ] && [ "$(cat "$MARKER")" = "$VERSION" ]; then
                echo "localtuya $VERSION already installed, skipping"
                exit 0
              fi
              apk add --no-cache wget tar >/dev/null
              mkdir -p /config/custom_components
              if wget -q -O /tmp/lt.tgz \
                  "https://github.com/xZetsubou/hass-localtuya/archive/refs/tags/$VERSION.tar.gz"; then
                rm -rf "$TARGET"; mkdir -p "$TARGET"
                tar -xzf /tmp/lt.tgz -C /tmp
                cp -r /tmp/hass-localtuya-*/custom_components/localtuya/. "$TARGET/"
                rm -rf /tmp/lt.tgz /tmp/hass-localtuya-*
                echo "$VERSION" > "$MARKER"
                echo "localtuya $VERSION installed"
              else
                echo "WARN: localtuya download failed; no marker written, will retry next start"
              fi
              exit 0
          volumeMounts:
            - name: config
              mountPath: /config
        # Binks assistant — Extended OpenAI Conversation (jekalmin), pinned to 1.1.0,
        # the last release compatible with HA 2025.11 (2.x needs HA >=2026.3; 1.1.0
        # requires openai~=2.2.0 which HA 2025.11 already bundles, so no runtime pip).
        # Gives a conversation agent that can target our LiteLLM base_url. RESILIENT:
        # set -u + final exit 0 so a failed download never blocks HA boot; marker
        # written only on success so a failure retries next start.
        - name: install-extended-openai-conversation
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -u
              VERSION="1.1.0"
              TARGET="/config/custom_components/extended_openai_conversation"
              MARKER="$TARGET/.version"
              if [ -f "$MARKER" ] && [ "$(cat "$MARKER")" = "$VERSION" ]; then
                echo "extended_openai_conversation $VERSION already installed, skipping"
                exit 0
              fi
              apk add --no-cache wget tar >/dev/null
              mkdir -p /config/custom_components
              if wget -q -O /tmp/eoc.tgz \
                  "https://github.com/jekalmin/extended_openai_conversation/archive/refs/tags/$VERSION.tar.gz"; then
                rm -rf "$TARGET"; mkdir -p "$TARGET"
                tar -xzf /tmp/eoc.tgz -C /tmp
                cp -r /tmp/extended_openai_conversation-*/custom_components/extended_openai_conversation/. "$TARGET/"
                rm -rf /tmp/eoc.tgz /tmp/extended_openai_conversation-*
                echo "$VERSION" > "$MARKER"
                echo "extended_openai_conversation $VERSION installed"
              else
                echo "WARN: extended_openai_conversation download failed; no marker, will retry next start"
              fi
              exit 0
          volumeMounts:
            - name: config
              mountPath: /config
        # Binks voice (Stage 2) — OpenAI-compatible STT (fabio-garavini's
        # openai_whisper_cloud). Routes speech-to-text through our LiteLLM
        # `stt (whisper-turbo)` model, so no Wyoming/whisper container is needed.
        # No PyPI requirements. No GitHub releases exist, so pin a commit SHA for
        # reproducibility. RESILIENT: set -u + final exit 0; marker on success only.
        - name: install-openai-whisper-cloud
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -u
              VERSION="af4abafb47aaaa387e8cdb949fb838026517da6d"  # main @ 2026-07, manifest 1.3.0
              TARGET="/config/custom_components/openai_whisper_cloud"
              MARKER="$TARGET/.version"
              if [ -f "$MARKER" ] && [ "$(cat "$MARKER")" = "$VERSION" ]; then
                echo "openai_whisper_cloud $VERSION already installed, skipping"
                exit 0
              fi
              apk add --no-cache wget tar >/dev/null
              mkdir -p /config/custom_components
              if wget -q -O /tmp/owc.tgz \
                  "https://github.com/fabio-garavini/ha-openai-whisper-stt-api/archive/$VERSION.tar.gz"; then
                rm -rf "$TARGET"; mkdir -p "$TARGET"
                tar -xzf /tmp/owc.tgz -C /tmp
                cp -r /tmp/ha-openai-whisper-stt-api-*/custom_components/openai_whisper_cloud/. "$TARGET/"
                rm -rf /tmp/owc.tgz /tmp/ha-openai-whisper-stt-api-*
                echo "$VERSION" > "$MARKER"
                echo "openai_whisper_cloud $VERSION installed"
              else
                echo "WARN: openai_whisper_cloud download failed; no marker, will retry next start"
              fi
              exit 0
          volumeMounts:
            - name: config
              mountPath: /config
        # Binks voice (Stage 4) — jxlarrea's voice_satellite: a self-hosted custom
        # Lovelace card + integration that turns a wall tablet into an always-on
        # voice satellite (in-browser microWakeWord → the Binks Assist pipeline).
        # The release .zip unpacks FLAT to the contents of the component dir, and
        # the card JS auto-registers via add_extra_js_url (no lovelace: resources
        # entry needed). One pip dep (mutagen) is auto-installed by HA at boot.
        # RESILIENT: set -u + final exit 0; marker on success only.
        - name: install-voice-satellite
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -u
              VERSION="2026.6.3"
              TARGET="/config/custom_components/voice_satellite"
              MARKER="$TARGET/.version"
              if [ -f "$MARKER" ] && [ "$(cat "$MARKER")" = "$VERSION" ]; then
                echo "voice_satellite $VERSION already installed, skipping"
                exit 0
              fi
              apk add --no-cache wget unzip >/dev/null
              mkdir -p /config/custom_components
              if wget -q -O /tmp/vs.zip \
                  "https://github.com/jxlarrea/voice-satellite-card-integration/releases/download/$VERSION/voice-satellite-card.zip"; then
                rm -rf "$TARGET"; mkdir -p "$TARGET"
                unzip -o -q /tmp/vs.zip -d "$TARGET"
                rm /tmp/vs.zip
                echo "$VERSION" > "$MARKER"
                echo "voice_satellite $VERSION installed"
              else
                echo "WARN: voice_satellite download failed; no marker, will retry next start"
              fi
              exit 0
          volumeMounts:
            - name: config
              mountPath: /config
        # Vendor pinned Lovelace custom cards + browser_mod for the wall-panel
        # dashboards (we don't run HACS; everything is git-pinned + reproducible).
        # RESILIENT BY DESIGN: `set -u` (not -e) and a final `exit 0` so a failed
        # download NEVER blocks HA from starting; the success marker is only
        # written when ALL downloads succeed, so a partial failure retries on the
        # next restart. Bump VERSION to force a re-vendor.
        - name: install-lovelace-cards
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -u
              VERSION="2026-07-08-1"
              WWW="/config/www/community"
              MARKER="$WWW/.version"
              if [ -f "$MARKER" ] && [ "$(cat "$MARKER")" = "$VERSION" ]; then
                echo "lovelace cards $VERSION already vendored, skipping"
                exit 0
              fi
              apk add --no-cache wget tar >/dev/null
              mkdir -p "$WWW" /config/custom_components
              FAIL=0
              dl() {  # dl <url> <dest>
                mkdir -p "$(dirname "$2")"
                if wget -q -O "$2" "$1"; then
                  echo "ok    $2"
                else
                  echo "WARN  failed: $1"; rm -f "$2"; FAIL=$((FAIL+1))
                fi
              }
              dl "https://github.com/piitaya/lovelace-mushroom/releases/download/v5.1.1/mushroom.js"                 "$WWW/mushroom/mushroom.js"
              dl "https://github.com/custom-cards/button-card/releases/download/v7.0.1/button-card.js"              "$WWW/button-card/button-card.js"
              dl "https://raw.githubusercontent.com/Clooos/Bubble-Card/v3.2.3/dist/bubble-card.js"                  "$WWW/bubble-card/bubble-card.js"
              dl "https://raw.githubusercontent.com/thomasloven/lovelace-auto-entities/v1.16.1/auto-entities.js"    "$WWW/auto-entities/auto-entities.js"
              dl "https://raw.githubusercontent.com/thomasloven/lovelace-card-mod/v4.2.1/card-mod.js"               "$WWW/card-mod/card-mod.js"
              dl "https://github.com/kalkih/mini-graph-card/releases/download/v0.13.0/mini-graph-card-bundle.js"    "$WWW/mini-graph-card/mini-graph-card-bundle.js"
              dl "https://github.com/NemesisRE/kiosk-mode/releases/download/v14.0.0/kiosk-mode.js"                  "$WWW/kiosk-mode/kiosk-mode.js"
              # Phase 1.5 — Nest-Hub photo layer: wallpanel (rotating-photo screensaver) + clock-weather hero.
              dl "https://github.com/j-a-n/lovelace-wallpanel/releases/download/v4.65.1/wallpanel.js"              "$WWW/wallpanel/wallpanel.js"
              dl "https://github.com/pkissling/clock-weather-card/releases/download/v2.9.3/clock-weather-card.js"  "$WWW/clock-weather-card/clock-weather-card.js"
              # browser_mod is a Python custom_component (frontend bundled); install the dir.
              if wget -q -O /tmp/bm.tgz "https://github.com/thomasloven/hass-browser_mod/archive/refs/tags/v2.13.5.tar.gz"; then
                tar -xzf /tmp/bm.tgz -C /tmp
                rm -rf /config/custom_components/browser_mod
                cp -r /tmp/hass-browser_mod-2.13.5/custom_components/browser_mod /config/custom_components/browser_mod
                rm -rf /tmp/bm.tgz /tmp/hass-browser_mod-2.13.5
                echo "ok    browser_mod"
              else
                echo "WARN  failed: browser_mod"; FAIL=$((FAIL+1))
              fi
              # pyscript is a Python custom_component: it exposes non-admin-callable
              # services that write the HA registries (area/name/icon/labels) so any
              # wall-panel user can configure a plug from the Settings view (HA has
              # no built-in set-area/set-name service and the native editors are
              # admin-only + hidden in kiosk). App code lives in /config/pyscript/.
              if wget -q -O /tmp/ps.tgz "https://github.com/custom-components/pyscript/archive/refs/tags/2.0.1.tar.gz"; then
                tar -xzf /tmp/ps.tgz -C /tmp
                rm -rf /config/custom_components/pyscript
                cp -r /tmp/pyscript-2.0.1/custom_components/pyscript /config/custom_components/pyscript
                rm -rf /tmp/ps.tgz /tmp/pyscript-2.0.1
                echo "ok    pyscript"
              else
                echo "WARN  failed: pyscript"; FAIL=$((FAIL+1))
              fi
              if [ "$FAIL" -eq 0 ]; then
                echo "$VERSION" > "$MARKER"
                echo "all lovelace cards vendored ($VERSION)"
              else
                echo "WARN: $FAIL download(s) failed; no marker written, will retry next start"
              fi
              exit 0
          volumeMounts:
            - name: config
              mountPath: /config
        - name: sync-managed-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /config/packages /config/dashboards /config/pyscript

              # Make this sync AUTHORITATIVE: packages/, dashboards/ and pyscript/
              # contain ONLY git-managed files, so prune them first. Without this,
              # `cp` leaves orphans behind when a package/dashboard/app is removed
              # from git — and HA keeps loading the stale file (e.g. a dropped
              # package erroring on every start). Pruning makes the PVC match git
              # exactly.
              rm -f /config/packages/*.yaml /config/dashboards/*.yaml /config/pyscript/*.py /config/pyscript/*.yaml

              cp /managed-config/configuration.yaml /config/configuration.yaml
              cp /managed-config/automations.yaml /config/automations.yaml
              cp /managed-config/scripts.yaml /config/scripts.yaml
              cp /managed-config/scenes.yaml /config/scenes.yaml
              cp /managed-config/ui-lovelace.yaml /config/ui-lovelace.yaml

              cp /managed-config/package_cluster_metrics.yaml /config/packages/cluster_metrics.yaml
              cp /managed-config/package_service_metrics.yaml /config/packages/service_metrics.yaml
              cp /managed-config/package_homelab_endpoints.yaml /config/packages/homelab_endpoints.yaml
              cp /managed-config/package_derived_metrics.yaml /config/packages/derived_metrics.yaml
              cp /managed-config/package_printing_neptune.yaml /config/packages/printing_neptune.yaml
              cp /managed-config/package_voice_targets.yaml /config/packages/voice_targets.yaml
              cp /managed-config/package_site_status.yaml /config/packages/site_status.yaml
              cp /managed-config/package_fleet_alerts.yaml /config/packages/fleet_alerts.yaml
              cp /managed-config/package_marine.yaml /config/packages/marine.yaml
              cp /managed-config/package_voice_satellite_binks.yaml /config/packages/voice_satellite_binks.yaml
              cp /managed-config/package_plug_settings.yaml /config/packages/plug_settings.yaml

              # pyscript apps (registry-write services for the plug Settings editor)
              cp /managed-config/pyscript_plug_settings.py /config/pyscript/plug_settings.py
              # room-layout seed data read by pyscript.room_layout_seed on startup
              cp /managed-config/pyscript_room_layout.yaml /config/pyscript/room_layout.yaml

              cp /managed-config/dashboard_overview.yaml /config/dashboards/overview.yaml
              # shared room-layout partial, !include'd by overview + wall Home
              cp /managed-config/dashboard_rooms_cards.yaml /config/dashboards/_rooms_cards.yaml
              cp /managed-config/dashboard_local.yaml /config/dashboards/local.yaml
              cp /managed-config/dashboard_ops.yaml /config/dashboards/ops.yaml
              cp /managed-config/dashboard_admin.yaml /config/dashboards/admin.yaml
              cp /managed-config/dashboard_launcher.yaml /config/dashboards/launcher.yaml
              cp /managed-config/dashboard_wall.yaml /config/dashboards/wall.yaml
              # Devices hub + shared per-device detail subviews
              cp /managed-config/dashboard_devices.yaml /config/dashboards/devices.yaml
              cp /managed-config/dashboard_device_vacuum.yaml /config/dashboards/device_vacuum.yaml
              cp /managed-config/dashboard_device_litterbox.yaml /config/dashboards/device_litterbox.yaml
              cp /managed-config/dashboard_device_bambu.yaml /config/dashboards/device_bambu.yaml
              cp /managed-config/dashboard_device_neptune.yaml /config/dashboards/device_neptune.yaml
              cp /managed-config/dashboard_device_speakers.yaml /config/dashboards/device_speakers.yaml
          volumeMounts:
            - name: config
              mountPath: /config
            - name: managed-config
              mountPath: /managed-config
        - name: seed-integrations
          image: ghcr.io/home-assistant/home-assistant:stable
          command:
            - python3
            - -c
            - |
              import json, os, uuid
              from datetime import datetime, timezone

              CONFIG_FILE = "/config/.storage/core.config_entries"
              DOMAIN = "bambu_lab"

              serial = os.environ.get("BAMBU_SERIAL", "").upper()
              host = os.environ.get("BAMBU_HOST", "")
              access_code = os.environ.get("BAMBU_ACCESS_CODE", "")

              if not all([serial, host, access_code]):
                  print("WARN: Bambu credentials not set, skipping config seeding")
                  exit(0)

              os.makedirs(os.path.dirname(CONFIG_FILE), exist_ok=True)

              if os.path.exists(CONFIG_FILE):
                  with open(CONFIG_FILE) as f:
                      store = json.load(f)
              else:
                  store = {"version": 1, "minor_version": 4, "key": "core.config_entries", "data": {"entries": []}}

              # Ensure all existing entries have required fields
              dirty = False
              for e in store["data"]["entries"]:
                  if "subentries" not in e:
                      e["subentries"] = {}
                      dirty = True

              for entry in store["data"]["entries"]:
                  if entry.get("domain") == DOMAIN and entry.get("data", {}).get("serial") == serial:
                      if dirty:
                          with open(CONFIG_FILE, "w") as f:
                              json.dump(store, f, indent=2)
                          print("Patched existing entries with missing fields")
                      print(f"Config entry for {DOMAIN} serial={serial} already exists, skipping")
                      exit(0)

              now = datetime.now(timezone.utc).isoformat()
              entry = {
                  "created_at": now,
                  "data": {
                      "device_type": "A1",
                      "serial": serial,
                  },
                  "disabled_by": None,
                  "discovery_keys": {},
                  "domain": DOMAIN,
                  "entry_id": uuid.uuid4().hex,
                  "minor_version": 1,
                  "modified_at": now,
                  "options": {
                      "region": "",
                      "email": "",
                      "username": "",
                      "name": f"A1-{serial}",
                      "host": host,
                      "local_mqtt": True,
                      "auth_token": "",
                      "access_code": access_code,
                      "print_cache_count": 100,
                      "timelapse_cache_count": 1,
                      "usage_hours": 0.0,
                      "disable_ssl_verify": False,
                      "enable_firmware_update": False,
                      "force_ip": False,
                  },
                  "pref_disable_new_entities": False,
                  "pref_disable_polling": False,
                  "source": "user",
                  "subentries": {},
                  "title": serial,
                  "unique_id": None,
                  "version": 2,
              }

              store["data"]["entries"].append(entry)
              with open(CONFIG_FILE, "w") as f:
                  json.dump(store, f, indent=2)
              print(f"Seeded {DOMAIN} config entry for serial={serial}")
          env:
            - name: BAMBU_SERIAL
              valueFrom:
                secretKeyRef:
                  name: bambu-a1-credentials
                  key: serial
            - name: BAMBU_HOST
              valueFrom:
                secretKeyRef:
                  name: bambu-a1-credentials
                  key: host
            - name: BAMBU_ACCESS_CODE
              valueFrom:
                secretKeyRef:
                  name: bambu-a1-credentials
                  key: access-code
          volumeMounts:
            - name: config
              mountPath: /config
        # Seed the tapo_rv30 config entry (the integration is config-flow-only).
        # Schema mirrors custom_components/tapo_rv30/config_flow.py @ v0.3.0:
        # entry.data = {host, username, password}; unique_id = host; VERSION = 1.
        - name: seed-tapo-rv30
          image: ghcr.io/home-assistant/home-assistant:stable
          command:
            - python3
            - -c
            - |
              import json, os, uuid
              from datetime import datetime, timezone

              CONFIG_FILE = "/config/.storage/core.config_entries"
              DOMAIN = "tapo_rv30"

              host = os.environ.get("RV30_HOST", "")
              username = os.environ.get("RV30_USERNAME", "")
              password = os.environ.get("RV30_PASSWORD", "")

              if not all([host, username, password]):
                  print("WARN: RV30 credentials not set, skipping config seeding")
                  exit(0)

              os.makedirs(os.path.dirname(CONFIG_FILE), exist_ok=True)

              if os.path.exists(CONFIG_FILE):
                  with open(CONFIG_FILE) as f:
                      store = json.load(f)
              else:
                  store = {"version": 1, "minor_version": 4, "key": "core.config_entries", "data": {"entries": []}}

              for entry in store["data"]["entries"]:
                  if entry.get("domain") == DOMAIN and entry.get("data", {}).get("host") == host:
                      print(f"Config entry for {DOMAIN} host={host} already exists, skipping")
                      exit(0)

              now = datetime.now(timezone.utc).isoformat()
              entry = {
                  "created_at": now,
                  "data": {
                      "host": host,
                      "username": username,
                      "password": password,
                  },
                  "disabled_by": None,
                  "discovery_keys": {},
                  "domain": DOMAIN,
                  "entry_id": uuid.uuid4().hex,
                  "minor_version": 1,
                  "modified_at": now,
                  "options": {},
                  "pref_disable_new_entities": False,
                  "pref_disable_polling": False,
                  "source": "user",
                  "subentries": {},
                  "title": f"Tapo RV30 ({host})",
                  "unique_id": host,
                  "version": 1,
              }

              store["data"]["entries"].append(entry)
              with open(CONFIG_FILE, "w") as f:
                  json.dump(store, f, indent=2)
              print(f"Seeded {DOMAIN} config entry for host={host}")
          env:
            - name: RV30_HOST
              valueFrom:
                secretKeyRef:
                  name: tapo-rv30-credentials
                  key: host
            - name: RV30_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tapo-rv30-credentials
                  key: username
            - name: RV30_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tapo-rv30-credentials
                  key: password
          volumeMounts:
            - name: config
              mountPath: /config
        # Seed the native Shelly config entries for the two Shelly Plug US Gen4
        # smart plugs. Shelly is a CORE HA integration (no custom-component
        # install needed) — we use the native integration (local RPC/WebSocket)
        # for HA control/entities; the plugs ALSO publish MQTT straight to
        # Mosquitto for Grafana (via mqtt-exporter), independent of HA. Shelly's
        # MQTT is RPC-style and emits NO HA discovery, so the native integration
        # is the only way to get HA entities. Schema mirrors HA core
        # shelly/config_flow.py @ 2026.7: entry.data = {host, port, sleep_period,
        # model, gen}; unique_id = MAC (uppercase, no colons — matches both the
        # mDNS name path and RPC info, so no duplicate discovery entry);
        # VERSION = 1, MINOR_VERSION = 3. Hosts are the pinned DHCP leases
        # (.104/.105). Idempotent: keyed on domain + data.host.
        - name: seed-shelly
          image: ghcr.io/home-assistant/home-assistant:stable
          command:
