        # Seed the LocalTuya hub config entry (domain "localtuya", ENTRIES_VERSION
        # = 4) for the Fumoi litter box. no_cloud=True → fully local. GOTCHA:
        # localtuya/__init__.py reads region/client_id/client_secret/user_id
        # UNCONDITIONALLY (before the no_cloud branch), so those keys must exist
        # (empty) even for a local-only entry — omit them and setup KeyErrors.
        # Entities: DP1-5 are confirmed writable controls (types verified vs the
        # Tuya cloud schema); DP6/7/8/9/110 are read-only sensors with PROVISIONAL
        # labels (confirm semantics via a live clean cycle, then relabel).
        # manual_clean + factory_reset are omitted (unknown/destructive DP id).
        # Idempotent on domain. Seed schema mirrors custom_components/localtuya
        # config_flow.py @ 2025.11.0 (per-platform flow_schema required keys).
        - name: seed-localtuya
          image: ghcr.io/home-assistant/home-assistant:stable
          command:
            - python3
            - -c
            - |
              import json, os, uuid
              from datetime import datetime, timezone

              CONFIG_FILE = "/config/.storage/core.config_entries"
              DOMAIN = "localtuya"

              device_id = os.environ.get("LT_DEVICE_ID", "")
              local_key = os.environ.get("LT_LOCAL_KEY", "")
              host = os.environ.get("LT_HOST", "")
              protocol = os.environ.get("LT_PROTOCOL", "3.3")
              name = os.environ.get("LT_NAME", "Tuya Device")

              if not all([device_id, local_key, host]):
                  print("WARN: LocalTuya credentials not set, skipping config seeding")
                  raise SystemExit(0)
              if not os.path.exists(CONFIG_FILE):
                  print("WARN: core.config_entries missing; HA not initialised yet, skipping")
                  raise SystemExit(0)

              with open(CONFIG_FILE) as f:
                  store = json.load(f)
              entries = store["data"]["entries"]

              # Version-gated (re)seed. Bump SEED_VERSION whenever the entity map
              # below changes; the marker file makes it idempotent yet lets a
              # corrected map replace a previously-seeded one on the next restart.
              SEED_VERSION = "litterbox-lightcontrols-2026-07-03"
              MARKER = "/config/.localtuya_seed_version"
              REGISTRY = "/config/.storage/core.entity_registry"

              if os.path.exists(MARKER):
                  with open(MARKER) as mf:
                      if mf.read().strip() == SEED_VERSION:
                          print(f"LocalTuya seed already at {SEED_VERSION}, skipping")
                          raise SystemExit(0)

              # Drop any prior localtuya entries so the corrected DP map replaces the
              # old provisional one, then purge their entity-registry rows so stale
              # slugs (litter_level / bin_full / counter_*) don't linger.
              stale_ids = [e["entry_id"] for e in entries if e.get("domain") == DOMAIN]
              entries[:] = [e for e in entries if e.get("domain") != DOMAIN]

              # HA is strict on load — ensure existing entries carry subentries.
              for e in entries:
                  e.setdefault("subentries", {})

              if stale_ids and os.path.exists(REGISTRY):
                  with open(REGISTRY) as rf:
                      reg = json.load(rf)
                  rdata = reg.get("data", {})
                  for _k in ("entities", "deleted_entities"):
                      _lst = rdata.get(_k)
                      if isinstance(_lst, list):
                          rdata[_k] = [x for x in _lst if x.get("platform") != DOMAIN]
                  with open(REGISTRY, "w") as rf:
                      json.dump(reg, rf, indent=2)
                  print(f"Purged stale {DOMAIN} entities from registry")

              def ent(dp, platform, fname, **extra):
                  d = {"platform": platform, "id": dp, "friendly_name": fname,
                       "entity_category": "None"}
                  d.update(extra)
                  return d

              # DP map — authoritative Tuya spec + a LIVE button-by-button correlation
              # (2026-07-03, see docs/smart-home-control.md). Findings that reshaped it:
              #   * DP1 `switch` is a DEAD code — the unit has no power button (just plugs
              #     in) and DP1 never moved during the whole session → NOT exposed.
              #   * DP9 `manual_clean` is the app's "Clean" button (fired on Clean press).
              #   * DP102 `doorbell_song` is the LIGHT COLOUR; DP107 `bright_value` is the
              #     LIGHT BRIGHTNESS (both cycled while using the Light control).
              #   * DP110 `data_identification` is the REAL status (Cat_into→Cleaning→
              #     Clean_Pause); DP108 `work_state` stayed static at 8 → dropped as noise.
              #   * DP109 `battery_state` = trigger source (Auto vs App), not battery.
              entities = [
                  ent("2", "select", "Mode",
                      select_options={"auto_clean": "Auto clean", "manual_clean": "Manual clean"},
                      restore_on_reconnect=False, is_passive_entity=False),
                  ent("9", "button", "Clean"),
                  ent("3", "button", "Start"),
                  ent("4", "switch", "Auto Clean",
                      restore_on_reconnect=False, is_passive_entity=False),
                  ent("5", "number", "Clean Delay",
                      min_value=1.0, max_value=60.0, step_size=1.0, unit_of_measurement="min"),
                  ent("102", "select", "Light Color",
                      select_options={"white": "White", "red": "Red", "greed": "Green",
                                      "blue": "Blue", "purple": "Purple"},
                      restore_on_reconnect=False, is_passive_entity=False),
                  ent("107", "number", "Light Brightness",
                      min_value=10.0, max_value=255.0, step_size=1.0),
                  ent("6", "sensor", "Cat Weight"),
                  ent("7", "sensor", "Excretions Per Day"),
                  ent("8", "sensor", "Excretion Time Daily"),
                  ent("103", "sensor", "Use Time"),
                  ent("109", "sensor", "Trigger Source"),
                  ent("110", "sensor", "Status"),
              ]

              device = {
                  "friendly_name": name,
                  "host": host,
                  "device_id": device_id,
                  "local_key": local_key,
                  "protocol_version": protocol,
                  "enable_debug": False,
                  "entities": entities,
              }

              now = datetime.now(timezone.utc).isoformat()
              entries.append({
                  "created_at": now,
                  "data": {
                      "region": "us", "client_id": "", "client_secret": "", "user_id": "",
                      "no_cloud": True,
                      "devices": {device_id: device},
                  },
                  "disabled_by": None,
                  "discovery_keys": {},
                  "domain": DOMAIN,
                  "entry_id": uuid.uuid4().hex,
                  "minor_version": 1,
                  "modified_at": now,
                  "options": {},
                  "pref_disable_new_entities": False,
                  "pref_disable_polling": False,
                  "source": "user",
                  "subentries": {},
                  "title": name,
                  "unique_id": None,
                  "version": 4,
              })
              with open(CONFIG_FILE, "w") as f:
                  json.dump(store, f, indent=2)
              with open(MARKER, "w") as f:
                  f.write(SEED_VERSION)
              print(f"Seeded {DOMAIN} entry with {len(entities)} entities for {name}")
          env:
            - name: LT_DEVICE_ID
              valueFrom:
                secretKeyRef:
                  name: localtuya-litterbox-credentials
                  key: device-id
            - name: LT_LOCAL_KEY
              valueFrom:
                secretKeyRef:
                  name: localtuya-litterbox-credentials
                  key: local-key
            - name: LT_HOST
              valueFrom:
                secretKeyRef:
                  name: localtuya-litterbox-credentials
                  key: host
            - name: LT_PROTOCOL
              valueFrom:
                secretKeyRef:
                  name: localtuya-litterbox-credentials
                  key: protocol-version
            - name: LT_NAME
              valueFrom:
                secretKeyRef:
                  name: localtuya-litterbox-credentials
                  key: friendly-name
          volumeMounts:
            - name: config
              mountPath: /config
        # Seed remote_calendar config entries → read-only iCal feeds on the
        # dashboard ("what's on": concerts, events, holidays). Config-flow-only,
        # so seed like the others. It's resilient (retries via ConfigEntryNotReady
        # if a feed is briefly unreachable). Baseline = the PUBLIC US Holidays feed
        # (safe in git). PRIVATE feeds (a Songkick personal concert .ics, your own
        # calendar's secret iCal) come from an OPTIONAL SOPS secret as a JSON array
        # HA_REMOTE_CALENDARS_JSON=[{"name":..,"url":..}] so their tokens never
        # enter git. Idempotent: keyed on domain + feed url.
        - name: seed-remote-calendars
          image: ghcr.io/home-assistant/home-assistant:stable
          command:
            - python3
            - -c
            - |
              import json, os, uuid
              from datetime import datetime, timezone

              ENTRIES = "/config/.storage/core.config_entries"
              DOMAIN = "remote_calendar"

              feeds = [{
                  "name": "US Holidays",
                  "url": "https://calendar.google.com/calendar/ical/en.usa%23holiday%40group.v.calendar.google.com/public/basic.ics",
              }, {
                  # In-cluster spotify-concerts bridge → concerts near home for
                  # your Spotify artists (empty until that app's creds are set).
                  "name": "Concerts",
                  "url": "http://spotify-concerts.spotify-concerts.svc.cluster.local/concerts.ics",
              }]
              extra = os.environ.get("HA_REMOTE_CALENDARS_JSON", "").strip()
              if extra:
                  try:
                      feeds += json.loads(extra)
                  except Exception as e:
                      print(f"WARN: bad HA_REMOTE_CALENDARS_JSON ({e}); ignoring")

              if not os.path.exists(ENTRIES):
                  print("WARN: core.config_entries missing; skipping")
                  exit(0)

              with open(ENTRIES) as f:
                  store = json.load(f)
              entries = store["data"]["entries"]
              for e in entries:
                  e.setdefault("subentries", {})

              existing = {e.get("data", {}).get("url") for e in entries if e.get("domain") == DOMAIN}
              now = datetime.now(timezone.utc).isoformat()
              added = 0
              for feed in feeds:
                  url = (feed.get("url") or "").strip()
                  name = (feed.get("name") or "").strip()
                  if not url or not name:
                      continue
                  if url.startswith("webcal://"):
                      url = "https://" + url[len("webcal://"):]
                  if url in existing:
                      print(f"remote_calendar '{name}' already exists, skipping")
                      continue
                  entries.append({
                      "created_at": now,
                      "data": {"calendar_name": name, "url": url},
                      "disabled_by": None,
                      "discovery_keys": {},
                      "domain": DOMAIN,
                      "entry_id": uuid.uuid4().hex,
                      "minor_version": 1,
                      "modified_at": now,
                      "options": {},
                      "pref_disable_new_entities": False,
                      "pref_disable_polling": False,
                      "source": "user",
                      "subentries": {},
                      "title": name,
                      "unique_id": None,
                      "version": 1,
                  })
                  existing.add(url)
                  added += 1
                  print(f"Seeded remote_calendar '{name}'")
              if added:
                  with open(ENTRIES, "w") as f:
                      json.dump(store, f, indent=2)
              print(f"remote_calendar seed done (+{added})")
          env:
            - name: HA_REMOTE_CALENDARS_JSON
              valueFrom:
                secretKeyRef:
                  name: home-assistant-calendars
                  key: feeds-json
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /config
