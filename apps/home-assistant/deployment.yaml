        # Seed a baseline ROOM palette into core.area_registry so the wall-panel
        # Settings editor has sensible rooms to pick from on a fresh install and
        # so the plug dashboards can group by room. Areas are a CORE registry
        # (no integration). Schema mirrors the live store @ 2025.11 (id = name
        # slug). Idempotent: an area is added only when its slug is absent, so
        # rooms a user creates live (or HA's onboarding defaults) are never
        # touched. We deliberately do NOT assign plugs to rooms here — the whole
        # point is that any user assigns them live from the Settings view; every
        # plug starts "Unassigned" until a human places it.
        - name: seed-areas
          image: ghcr.io/home-assistant/home-assistant:stable
          command:
            - python3
            - -c
            - |
              import json, os, re
              from datetime import datetime, timezone

              REG = "/config/.storage/core.area_registry"
              # Baseline home rooms. Add more here or live via the Settings editor.
              ROOMS = ["Living Room", "Kitchen", "Bedroom", "Office", "Garage", "Bathroom"]

              def slug(name):
                  return re.sub(r"[^a-z0-9]+", "_", name.lower()).strip("_")

              os.makedirs(os.path.dirname(REG), exist_ok=True)
              if os.path.exists(REG):
                  with open(REG) as f:
                      store = json.load(f)
              else:
                  store = {"version": 1, "minor_version": 8, "key": "core.area_registry",
                           "data": {"areas": []}}
              areas = store["data"]["areas"]
              have = {a.get("id") for a in areas}

              now = datetime.now(timezone.utc).isoformat()
              added = 0
              for name in ROOMS:
                  aid = slug(name)
                  if aid in have:
                      continue
                  areas.append({
                      "aliases": [],
                      "floor_id": None,
                      "humidity_entity_id": None,
                      "icon": None,
                      "id": aid,
                      "labels": [],
                      "name": name,
                      "picture": None,
                      "temperature_entity_id": None,
                      "created_at": now,
                      "modified_at": now,
                  })
                  have.add(aid)
                  added += 1
                  print(f"Seeded area '{name}' (id={aid})")
              if added:
                  with open(REG, "w") as f:
                      json.dump(store, f, indent=2)
              print(f"area seed done (+{added}, {len(areas)} total)")
          volumeMounts:
            - name: config
              mountPath: /config
        # Seed the OFFICIAL `spotify` integration (media_player.spotify). This is
        # the FIRST OAuth integration seeded here, so it writes TWO storage files:
        #   1. .storage/application_credentials — the Spotify app client id/secret
        #      (data.items is a LIST; auth_domain must match the entry's
        #      auth_implementation).
        #   2. .storage/core.config_entries — the spotify entry carrying the OAuth
        #      token. token.expires_at=0 so HA refreshes on boot using the
        #      refresh_token + client creds (a fresh access token is minted at
        #      runtime). Format verified vs HA source; seeder logic unit-tested.
        # Runs only when the OPTIONAL spotify-credentials secret exists (else the
        # pod boots fine with no Spotify). Mint the refresh token with
        # spotify-ha-bootstrap.py. Idempotent on domain=="spotify".
        - name: seed-spotify
          image: ghcr.io/home-assistant/home-assistant:stable
          command:
            - python3
            - -c
            - |
              import json, os, uuid
              from datetime import datetime, timezone

              STORAGE = "/config/.storage"
              ENTRIES = f"{STORAGE}/core.config_entries"
              APPCRED = f"{STORAGE}/application_credentials"
              DOMAIN = "spotify"

              cid = os.environ.get("SPOTIFY_CLIENT_ID", "").strip()
              csec = os.environ.get("SPOTIFY_CLIENT_SECRET", "").strip()
              rt = os.environ.get("SPOTIFY_REFRESH_TOKEN", "").strip()
              uid = os.environ.get("SPOTIFY_USER_ID", "").strip()
              name = os.environ.get("SPOTIFY_NAME", "").strip() or "Spotify"

              if not all([cid, csec, rt, uid]):
                  print("WARN: spotify creds not set, skipping")
                  raise SystemExit(0)

              SCOPES = ("user-modify-playback-state,user-read-playback-state,"
                        "user-read-private,playlist-read-private,"
                        "playlist-read-collaborative,user-library-read,user-top-read,"
                        "user-read-playback-position,user-read-recently-played,"
                        "user-follow-read")

              os.makedirs(STORAGE, exist_ok=True)

              # 1) application_credentials (items is a LIST)
              if os.path.exists(APPCRED):
                  with open(APPCRED) as f:
                      ac = json.load(f)
              else:
                  ac = {"version": 1, "minor_version": 1,
                        "key": "application_credentials", "data": {"items": []}}
              ac.setdefault("data", {}).setdefault("items", [])
              if any(i.get("domain") == DOMAIN for i in ac["data"]["items"]):
                  print("application_credentials: spotify already present")
              else:
                  ac["data"]["items"].append({
                      "client_id": cid, "client_secret": csec, "auth_domain": DOMAIN,
                      "domain": DOMAIN, "name": "Spotify", "id": uuid.uuid4().hex,
                  })
                  with open(APPCRED, "w") as f:
                      json.dump(ac, f, indent=2)
                  print("seeded application_credentials for spotify")

              # 2) spotify config entry (token.expires_at=0 → refreshed on boot)
              if os.path.exists(ENTRIES):
                  with open(ENTRIES) as f:
                      store = json.load(f)
              else:
                  store = {"version": 1, "minor_version": 5,
                           "key": "core.config_entries", "data": {"entries": []}}
              for e in store["data"]["entries"]:
                  e.setdefault("subentries", {})
              if any(e.get("domain") == DOMAIN for e in store["data"]["entries"]):
                  print("spotify config entry already present")
              else:
                  now = datetime.now(timezone.utc).isoformat()
                  store["data"]["entries"].append({
                      "created_at": now,
                      "data": {
                          "auth_implementation": DOMAIN,
                          "token": {
                              "access_token": "seed", "token_type": "Bearer",
                              "expires_in": 0, "refresh_token": rt,
                              "scope": SCOPES, "expires_at": 0,
                          },
                          "id": uid,
                          "name": name,
                      },
                      "disabled_by": None, "discovery_keys": {}, "domain": DOMAIN,
                      "entry_id": uuid.uuid4().hex, "minor_version": 1,
                      "modified_at": now, "options": {},
                      "pref_disable_new_entities": False,
                      "pref_disable_polling": False, "source": "user",
                      "subentries": {}, "title": name, "unique_id": uid, "version": 1,
                  })
                  with open(ENTRIES, "w") as f:
                      json.dump(store, f, indent=2)
                  print(f"seeded spotify config entry for user {uid}")
          env:
            - name: SPOTIFY_CLIENT_ID
              valueFrom: { secretKeyRef: { name: spotify-credentials, key: spotify-client-id, optional: true } }
            - name: SPOTIFY_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: spotify-credentials, key: spotify-client-secret, optional: true } }
            - name: SPOTIFY_REFRESH_TOKEN
              valueFrom: { secretKeyRef: { name: spotify-credentials, key: spotify-refresh-token, optional: true } }
            - name: SPOTIFY_USER_ID
              valueFrom: { secretKeyRef: { name: spotify-credentials, key: spotify-user-id, optional: true } }
            - name: SPOTIFY_NAME
              valueFrom: { secretKeyRef: { name: spotify-credentials, key: spotify-name, optional: true } }
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:stable
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: managed-config
          configMap:
            name: home-assistant-managed-config
