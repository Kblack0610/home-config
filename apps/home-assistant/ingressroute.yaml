apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`homeassistant.home.lan`) || Host(`homeassistant.local`)
      services:
        - name: home-assistant
          port: 8123
