apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: home-assistant

configMapGenerator:
  - name: home-assistant-managed-config
    files:
      - configuration.yaml=config/configuration.yaml
      - automations.yaml=config/automations.yaml
      - scripts.yaml=config/scripts.yaml
      - scenes.yaml=config/scenes.yaml
      - ui-lovelace.yaml=config/ui-lovelace.yaml
      - package_cluster_metrics.yaml=config/packages/cluster_metrics.yaml
      - package_service_metrics.yaml=config/packages/service_metrics.yaml
      - package_homelab_endpoints.yaml=config/packages/homelab_endpoints.yaml
      - package_derived_metrics.yaml=config/packages/derived_metrics.yaml
      - package_printing_neptune.yaml=config/packages/printing_neptune.yaml
      - package_voice_targets.yaml=config/packages/voice_targets.yaml
      - package_site_status.yaml=config/packages/site_status.yaml
      - package_fleet_alerts.yaml=config/packages/fleet_alerts.yaml
      - package_home_alerts.yaml=config/packages/home_alerts.yaml
      - package_voice_health.yaml=config/packages/voice_health.yaml
      - package_marine.yaml=config/packages/marine.yaml
      - package_voice_satellite_binks.yaml=config/packages/voice_satellite_binks.yaml
      - package_voice_pe_pucks.yaml=config/packages/voice_pe_pucks.yaml
      - package_plug_settings.yaml=config/packages/plug_settings.yaml
      - package_wall_screensaver.yaml=config/packages/wall_screensaver.yaml
      - package_wall_night_mode.yaml=config/packages/wall_night_mode.yaml
      - package_avr_yamaha.yaml=config/packages/avr_yamaha.yaml
      - package_honeywell_fan.yaml=config/packages/honeywell_fan.yaml
      - package_zomboid.yaml=config/packages/zomboid.yaml
      - package_amcrest.yaml=config/packages/amcrest.yaml
      - package_agents.yaml=config/packages/agents.yaml
      - package_lamps.yaml=config/packages/lamps.yaml
      - package_ci_runners.yaml=config/packages/ci_runners.yaml
      - package_music_panel.yaml=config/packages/music_panel.yaml
      - pyscript_plug_settings.py=config/pyscript/plug_settings.py
      - pyscript_room_layout.yaml=config/pyscript/room_layout.yaml
      - custom_sentences_en_nevermind.yaml=config/custom_sentences/en/nevermind.yaml
      # Custom microWakeWord model (binary). The voice_satellite in-browser engine
      # loads .tflite files from /config/voice_satellite/models/ and labels the
      # wake-word option by filename (binks.tflite -> "binks"). kustomize base64s
      # the binary into the ConfigMap's binaryData automatically.
      - voice_satellite_model_binks.tflite=config/voice_satellite/models/binks.tflite
      - dashboard_overview.yaml=config/dashboards/overview.yaml
      - dashboard_rooms_cards.yaml=config/dashboards/_rooms_cards.yaml
      - dashboard_cameras_section.yaml=config/dashboards/_cameras_section.yaml
      - dashboard_music_section.yaml=config/dashboards/_music_section.yaml
      - dashboard_talk_card.yaml=config/dashboards/_talk_card.yaml
      - dashboard_home_alert_card.yaml=config/dashboards/_home_alert_card.yaml
      - binks_functions.yaml=config/binks/functions.yaml
      - binks_agent.yaml=config/binks/agent.yaml
      - binks_prompt.jinja=config/binks/prompt.jinja
      - package_binks_answers.yaml=config/packages/binks_answers.yaml
      - binks_answers_init.py=custom_components/binks_answers/__init__.py
      - binks_answers_tool.py=custom_components/binks_answers/tool.py
      - binks_answers_manifest.json=custom_components/binks_answers/manifest.json
      - dashboard_local.yaml=config/dashboards/local.yaml
      - dashboard_ops.yaml=config/dashboards/ops.yaml
      - dashboard_admin.yaml=config/dashboards/admin.yaml
      - dashboard_launcher.yaml=config/dashboards/launcher.yaml
      - dashboard_wall.yaml=config/dashboards/wall.yaml
      - dashboard_devices.yaml=config/dashboards/devices.yaml
      - dashboard_device_vacuum.yaml=config/dashboards/device_vacuum.yaml
      - dashboard_device_litterbox.yaml=config/dashboards/device_litterbox.yaml
      - dashboard_device_bambu.yaml=config/dashboards/device_bambu.yaml
      - dashboard_device_neptune.yaml=config/dashboards/device_neptune.yaml
      - dashboard_device_speakers.yaml=config/dashboards/device_speakers.yaml
      - dashboard_view_agents.yaml=config/dashboards/view_agents.yaml
      - dashboard_view_devices.yaml=config/dashboards/view_devices.yaml
      - dashboard_view_control.yaml=config/dashboards/view_control.yaml
      - dashboard_view_ci.yaml=config/dashboards/view_ci.yaml
      - dashboard_view_local.yaml=config/dashboards/view_local.yaml
      - dashboard_view_ops.yaml=config/dashboards/view_ops.yaml
      - dashboard_view_media.yaml=config/dashboards/view_media.yaml
      - dashboard_view_settings.yaml=config/dashboards/view_settings.yaml
      - dashboard_phone.yaml=config/dashboards/phone.yaml
      - dashboard_sessions_cards.yaml=config/dashboards/_sessions_cards.yaml
      - www_snapcast_tablet.js=config/www/snapcast-tablet.js

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - ingress-apex.yaml
  - middleware-apex-redirect.yaml
  - backup-cronjob.yaml
  - backup-nas-secret.yaml
  - bambu-a1-secret.yaml
  - tapo-rv30-secret.yaml
  - localtuya-secret.yaml
  - calendars-secret.yaml
  - litellm-assist-secret.yaml
  - zomboid-control-token-secret.yaml
  - amcrest-camera-secret.yaml
