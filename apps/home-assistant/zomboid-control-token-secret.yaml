# SECOND COPY of the token in apps/zomboid/control/secret.yaml, for this namespace.
#
# Why a copy and not a reference: k8s Secrets do not cross namespaces, no reflector is
# installed, and both zomboid/ and home-assistant/ set a kustomize `namespace:`
# transformer - so a single multi-doc Secret file cannot emit into both (kustomize
# rewrites the second doc and fails with an ID conflict). A copy is the only option here.
#
# ROTATION: change BOTH this file and apps/zomboid/control/secret.yaml. If they drift,
# the HA buttons 401 while the API itself looks perfectly healthy.
#
# Consumed as ZOMBOID_CONTROL_TOKEN in deployment.yaml, composed into
# ZOMBOID_CONTROL_AUTH, read by config/packages/zomboid.yaml.
apiVersion: v1
kind: Secret
metadata:
    name: zomboid-control-token
    namespace: home-assistant
    labels:
        app.kubernetes.io/name: zomboid-control
type: Opaque
stringData:
