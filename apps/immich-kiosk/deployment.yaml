apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-kiosk
  namespace: immich-kiosk
  labels:
    app.kubernetes.io/name: immich-kiosk
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-kiosk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-kiosk
    spec:
      containers:
        - name: immich-kiosk
          # Open-source Immich slideshow front-end. Serves a kiosk/screensaver
          # URL the wall-panel tablets point at (e.g. ?disable_ui=true&album=<id>).
          # Pinned; bump deliberately. Tag confirmed to exist on ghcr.
          image: ghcr.io/damongolding/immich-kiosk:0.39.3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # Internal cluster DNS for the existing Immich server (port 80 → 2283).
            - name: KIOSK_IMMICH_URL
              value: "http://immich-server.immich.svc.cluster.local"
            - name: KIOSK_IMMICH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: immich-kiosk-secret
                  key: api-key
            - name: TZ
              value: "America/New_York"
            # ── Curated feed ─────────────────────────────────────────────────
            # Show only the "Wall Best (...)" album(s) built nightly by the
            # apps/immich/immich-curate CronJob (family photos, no screenshots),
            # instead of the whole library. Comma-separated album UUIDs.
            # IMPORTANT: the api-key in immich-kiosk-secret MUST belong to the
            # account that OWNS these albums (currently Katie / ktnynas). Immich's
            # /search/random only returns the requesting user's OWN assets, so a
            # cross-account shared album returns nothing and the kiosk silently
            # falls back to random-across-the-whole-library (which leaked Ken's
            # screenshots onto the wall). Keep key-owner == album-owner.
            - { name: KIOSK_ALBUM, value: "d21eaba3-be3d-4717-b607-58b894b28074" }
            # ── Modern photo-frame look (Phase 1.6) ──────────────────────────
            # splitview pairs two PORTRAIT photos side-by-side (landscape/square
            # fall back to single); clock/date + image metadata overlay on top;
            # cross-fade transitions. Weather overlay is added later via a
            # config.yaml (needs an OpenWeatherMap key) — see docs/wall-panels.md.
            - { name: KIOSK_LAYOUT, value: "splitview" }
            - { name: KIOSK_SHOW_TIME, value: "true" }
            - { name: KIOSK_TIME_FORMAT, value: "12" }
            - { name: KIOSK_SHOW_DATE, value: "true" }
            - { name: KIOSK_SHOW_IMAGE_DATE, value: "true" }
            - { name: KIOSK_SHOW_IMAGE_LOCATION, value: "true" }
            - { name: KIOSK_SHOW_ALBUM_NAME, value: "true" }
            - { name: KIOSK_TRANSITION, value: "cross-fade" }
            - { name: KIOSK_CROSS_FADE_TRANSITION_DURATION, value: "2" }
            - { name: KIOSK_DURATION, value: "30" }
            - { name: KIOSK_IMAGE_FIT, value: "cover" }
            - { name: KIOSK_BACKGROUND_BLUR, value: "false" }
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          # TCP probe — independent of Immich reachability / API-key validity,
          # so a placeholder key or transient Immich blip never NotReady-loops.
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            # SOPS weather config → /config/config.yaml (viper searches ./config/).
            - name: kiosk-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: kiosk-config
          secret:
            secretName: immich-kiosk-config
