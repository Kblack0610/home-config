apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-backup
  namespace: immich
spec:
  schedule: "0 3 * * *"  # Daily at 3 AM
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            kubernetes.io/hostname: asus-laptop
            storage.role/nas: "true"
          containers:
            - name: backup
              image: alpine:3.24.1
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: immich-secret
                      key: DB_PASSWORD
                - name: NAS_SMB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backup-nas-credentials
                      key: smb-password
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  apk add --no-cache postgresql16-client gzip samba-client >/dev/null

                  # The dump has been ~150MB for months. 1MB catches a dump that
                  # produced nothing without false-tripping.
                  MIN_BYTES=1048576
                  SMB="//nas.nas.svc.cluster.local/private"
                  DEST="backups/home-k3s/immich"

                  log() { echo "[$(date -Iseconds)] $*"; }

                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  BACKUP_FILE="immich-${TIMESTAMP}.sql.gz"
                  # pipefail matters here: gzip succeeds on empty input, so without
                  # it a failed pg_dump yields a perfectly valid archive of nothing.
                  set -o pipefail
                  pg_dump -h immich-postgres -U immich -d immich | gzip > "/backup/${BACKUP_FILE}"
                  size="$(wc -c < "/backup/${BACKUP_FILE}")"
                  log "created ${BACKUP_FILE} (${size} bytes)"
                  if [ "${size}" -lt "${MIN_BYTES}" ]; then
                    log "ERROR: dump under ${MIN_BYTES} bytes is implausible. Not uploading."
                    exit 1
                  fi

                  ls -t /backup/immich-*.sql.gz | tail -n +31 | xargs -r rm
                  log "local backup complete: ${BACKUP_FILE}"

                  # Off-box copy. Best-effort by design (docs/backup-runbook.md):
                  # the local copy is the success condition, so this warns and
                  # exits 0. smbclient -c does not exit non-zero when a command
                  # inside it fails, so every call must be checked for NT_STATUS_.
                  # Why, and the identical copies that move with this one:
                  # apps/zomboid/backup/backup.sh.
                  smb() {
                    _out="$(smbclient "${SMB}" -U "nas%${NAS_SMB_PASSWORD}" -c "$1" 2>&1)"
                    _bad="$(echo "${_out}" | grep -o 'NT_STATUS_[A-Z_]*' | grep -v 'NT_STATUS_OBJECT_NAME_COLLISION' || true)"
                    if [ -n "${_bad}" ]; then
                      log "ERROR: smbclient '$1' failed: ${_bad}"
                      return 1
                    fi
                    echo "${_out}"
                  }

                  nas_copy() {
                    # mkdir does not create parents, so walk the path a component
                    # at a time. OBJECT_NAME_COLLISION means it already exists.
                    _path=""
                    for _part in $(echo "${DEST}" | tr '/' ' '); do
                      _path="${_path:+${_path}/}${_part}"
                      smb "mkdir ${_path}" >/dev/null || return 1
                    done
                    smb "cd ${DEST}; put /backup/${BACKUP_FILE} ${BACKUP_FILE}" >/dev/null || return 1
                    remote_size="$(smb "cd ${DEST}; ls ${BACKUP_FILE}" | awk -v f="${BACKUP_FILE}" '$1==f {print $3}')"
                    if [ -z "${remote_size}" ]; then
                      log "ERROR: ${BACKUP_FILE} is not on the share after upload."
                      return 1
                    fi
                    if [ "${remote_size}" != "${size}" ]; then
                      log "ERROR: size mismatch - local ${size}, remote ${remote_size}."
                      return 1
                    fi
                    log "verified on the share: ${remote_size} bytes"
                  }

                  if nas_copy; then
                    log "NAS copy OK: ${BACKUP_FILE}"
                  else
                    log "WARN: off-box copy failed. The local copy on this node is good, but the OFF-BOX copy is missing."
                  fi
              volumeMounts:
                - name: backup
                  mountPath: /backup
          restartPolicy: OnFailure
          volumes:
            - name: backup
              hostPath:
                path: /var/backups/immich
                type: DirectoryOrCreate
