apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-ml
  namespace: immich
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/component: machine-learning
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich
      app.kubernetes.io/component: machine-learning
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich
        app.kubernetes.io/component: machine-learning
    spec:
      nodeSelector:
        kubernetes.io/hostname: asus-laptop
        storage.role/nas: "true"
      securityContext:
        supplementalGroups:
          - 987   # render
          - 983   # video
      containers:
        - name: machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:release-rocm
          securityContext:
            privileged: true   # required for /dev/kfd access (same pattern as orcaslicer)
          ports:
            - name: http
              containerPort: 3003
          env:
            - name: HSA_OVERRIDE_GFX_VERSION
              value: "10.3.0"   # Navi 22 (gfx1031) reports as gfx1030
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: dri
              mountPath: /dev/dri
            - name: kfd
              mountPath: /dev/kfd
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "6Gi"
              cpu: "4000m"
          livenessProbe:
            httpGet:
              path: /ping
              port: 3003
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: 3003
            initialDelaySeconds: 60
            periodSeconds: 10
      volumes:
        - name: cache
          hostPath:
            path: /mnt/media/app-config/immich/ml-cache
            type: DirectoryOrCreate
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
        - name: kfd
          hostPath:
            path: /dev/kfd
            type: CharDevice
