apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: intel-gpu-exporter
  namespace: intel-gpu-exporter
  labels:
    app.kubernetes.io/name: intel-gpu-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: intel-gpu-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intel-gpu-exporter
    spec:
      hostNetwork: true
      nodeSelector:
        kubernetes.io/hostname: asus-laptop
      containers:
        - name: intel-gpu-exporter
          image: ghcr.io/clambin/intel-gpu-exporter:0.6.1
          args:
            - --addr=:9101
          ports:
            - name: metrics
              containerPort: 9101
              hostPort: 9101
          volumeMounts:
            - name: dri
              mountPath: /dev/dri
          securityContext:
            privileged: true
          resources:
            requests:
              memory: "50Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
