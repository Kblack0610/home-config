apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep-chrome
  namespace: karakeep
  labels:
    app.kubernetes.io/name: karakeep
    app.kubernetes.io/component: chrome
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: karakeep
      app.kubernetes.io/component: chrome
  template:
    metadata:
      labels:
        app.kubernetes.io/name: karakeep
        app.kubernetes.io/component: chrome
    spec:
      containers:
        - name: chrome
          # Upstream's own headless-shell build (docker/chrome in karakeep-app/karakeep).
          # gcr.io/zenika-hub/alpine-chrome started 403ing in 2026-08 and the pod
          # sat in ImagePullBackOff for 42 days with nothing crawled. The image's
          # run.sh already binds the CDP port (socat 9222 -> chrome 9223), so only
          # pass the flags upstream's docker-compose.yml passes.
          image: ghcr.io/karakeep-app/karakeep-chrome:151.0.7922.47-r1
          args:
            - --disable-gpu
            - --disable-dev-shm-usage
            - --hide-scrollbars
            - --disable-blink-features=AutomationControlled
            - --window-size=1440,900
          ports:
            - name: debug
              containerPort: 9222
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          readinessProbe:
            tcpSocket:
              port: 9222
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9222
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
