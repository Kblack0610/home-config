apiVersion: v1
kind: ConfigMap
metadata:
  name: karakeep-config
  namespace: karakeep
  labels:
    app.kubernetes.io/name: karakeep
data:
  DATA_DIR: /data
  NEXTAUTH_URL: https://karakeep.kblab.me
  MEILI_ADDR: http://karakeep-meilisearch:7700
  BROWSER_WEB_URL: http://karakeep-chrome:9222
  PORT: "3000"
  LOG_LEVEL: notice
  DB_WAL_MODE: "true"
  DISABLE_NEW_RELEASE_CHECK: "true"
  DISABLE_SIGNUPS: "false"
  CRAWLER_STORE_SCREENSHOT: "true"
  CRAWLER_STORE_PDF: "false"
  MAX_ASSET_SIZE_MB: "50"
  TZ: America/New_York
  # AI tagging routed via in-cluster LiteLLM (apps/litellm). Model slot names
  # must match apps/litellm/configmap.yaml model_list entries verbatim
  # (spaces/parens included). INFERENCE_IMAGE_MODEL omitted: no vision route
  # in LiteLLM yet — see apps/litellm/configmap.yaml lines 67-74 (mlx-vlm
  # Stream(gpu,0) bug). Restore once a VLM model_list entry exists.
  OPENAI_BASE_URL: http://litellm.ai-gateway.svc.cluster.local:4000/v1
  INFERENCE_TEXT_MODEL: "code (Qwen3-Coder-Next-4bit)"
  EMBEDDING_TEXT_MODEL: "embedding (modernbert-embed-base-4bit)"
  INFERENCE_ENABLE_AUTO_TAGGING: "true"
  INFERENCE_ENABLE_AUTO_SUMMARIZATION: "true"
