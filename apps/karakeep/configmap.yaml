apiVersion: v1
kind: ConfigMap
metadata:
  name: karakeep-config
  namespace: karakeep
  labels:
    app.kubernetes.io/name: karakeep
data:
  DATA_DIR: /data
  NEXTAUTH_URL: https://karakeep.kblab.me
  MEILI_ADDR: http://karakeep-meilisearch:7700
  BROWSER_WEB_URL: http://karakeep-chrome:9222
  PORT: "3000"
  LOG_LEVEL: notice
  DB_WAL_MODE: "true"
  DISABLE_NEW_RELEASE_CHECK: "true"
  DISABLE_SIGNUPS: "false"
  CRAWLER_STORE_SCREENSHOT: "true"
  CRAWLER_STORE_PDF: "false"
  MAX_ASSET_SIZE_MB: "50"
  TZ: America/New_York
  # AI tagging routed via in-cluster LiteLLM (apps/litellm). The `karakeep`
  # virtual key allows only `fast`, its route `fast (gpt-oss-120b)` and
  # `embedding (gemini-001)`: a model name outside that list is a 403, and from
  # 2026-07-19 to 2026-09-29 every tagging call failed that way silently
  # (LOG_LEVEL notice), 0 tags. Add a model to the key before naming it here.
  # EMBEDDING_TEXT_MODEL is the same 768-dim Gemini embedder mem0 pins; karakeep
  # 0.31 reads it but stores no vectors, so changing it needs no re-index.
  # INFERENCE_IMAGE_MODEL is omitted: tagging images is not enabled.
  OPENAI_BASE_URL: http://litellm.ai-gateway.svc.cluster.local:4000/v1
  INFERENCE_TEXT_MODEL: "fast"
  EMBEDDING_TEXT_MODEL: "embedding (gemini-001)"
  INFERENCE_ENABLE_AUTO_TAGGING: "true"
  INFERENCE_ENABLE_AUTO_SUMMARIZATION: "true"
