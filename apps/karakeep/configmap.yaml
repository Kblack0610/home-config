apiVersion: v1
kind: ConfigMap
metadata:
  name: karakeep-config
  namespace: karakeep
  labels:
    app.kubernetes.io/name: karakeep
data:
  DATA_DIR: /data
  NEXTAUTH_URL: https://karakeep.kblab.me
  MEILI_ADDR: http://karakeep-meilisearch:7700
  BROWSER_WEB_URL: http://karakeep-chrome:9222
  PORT: "3000"
  LOG_LEVEL: notice
  DB_WAL_MODE: "true"
  DISABLE_NEW_RELEASE_CHECK: "true"
  DISABLE_SIGNUPS: "false"
  CRAWLER_STORE_SCREENSHOT: "true"
  CRAWLER_STORE_PDF: "false"
  MAX_ASSET_SIZE_MB: "50"
  TZ: America/New_York
  # AI tagging routed via in-cluster LiteLLM (apps/litellm). Text inference
  # uses the `fast` CATEGORY ALIAS (model_group_alias) so a single toggle in
  # apps/litellm moves karakeep's tagging between the local MLX box and the
  # cloud tier; local->cloud fallback keeps it up if the box drops.
  # EMBEDDING_TEXT_MODEL is PINNED (not aliased): karakeep's stored vectors are
  # tied to the embedder's dimensions, so it must not follow a category flip —
  # swapping it is a deliberate re-index. INFERENCE_IMAGE_MODEL omitted until
  # local vision (mlx-vlm>=0.6.5) is verified; add the `vlm` alias then.
  OPENAI_BASE_URL: http://litellm.ai-gateway.svc.cluster.local:4000/v1
  INFERENCE_TEXT_MODEL: "fast"
  EMBEDDING_TEXT_MODEL: "embedding (modernbert-embed-base-4bit)"
  INFERENCE_ENABLE_AUTO_TAGGING: "true"
  INFERENCE_ENABLE_AUTO_SUMMARIZATION: "true"
