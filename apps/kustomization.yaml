# Root kustomization for all Kubernetes apps
# Flux will apply all resources listed here
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Core infrastructure
  - cert-manager

  # Applications (home-k3s cluster)
  - actual-budget
  - alloy
  - ansible-runner
  - binks-api
  - blackbox-exporter
  - cloudflared-public-sites
  - crowdsec
  - external-dns
  - fleet-exporter
  - flux-audit
  - forgejo
  - gatus
  - gatus-fleet
  - headscale
  - headwind-mdm
  - headwind-fleet-bridge
  - home-assistant
  - immich
  - immich-kiosk
  - jellyfin
  - karakeep
  - langfuse
  - litellm
  - loki
  - mem0
  - minio
  - monitoring
  - mosquitto
  - mqtt2prom
  - nas
  - neptune
  - notes-sync-bridge
  - ntfy
  - ntfy-public
  - nvidia-device-plugin
  - openclaw
  - openwakeword
  - orcaslicer
  - postgres
  - print-service
  - renovate
  - sops-backup-rbac
  - spotify-concerts
  - time-tangle
  - trivy-operator
  - vaultwarden
  - vikunja
  - zomboid

  # Public sites (Cloudflare tunnel → Traefik → service)
  - portfolio
  - bnb-studios
  - office-cup
  - black-dev
  - placemyparents-preview
  - scratch

# Directories under apps/ that are NOT Flux-managed are documented in
# docs/excluded-from-flux.md. The doc lists each one with its runtime, deploy
# mechanism, and rationale. Add a row there in the same PR if you add a
# non-Flux dir under apps/.
