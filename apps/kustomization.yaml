# Root kustomization for all Kubernetes apps
# Flux will apply all resources listed here
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Core infrastructure
  - cert-manager

  # Applications (home-k3s cluster)
  - actual-budget
  - crowdsec
  - forgejo
  - gatus
  - headscale
  - home-assistant
  - immich
  - jellyfin
  - litellm
  - monitoring
  - nas
  - nvidia-device-plugin
  - orcaslicer
  - prowlarr
  - qbittorrent
  - radarr
  - sonarr
  - sops-backup-rbac

  # Public sites (Cloudflare tunnel → Traefik → service)
  - portfolio
  - bnb-studios
  - black-dev

# Excluded from GitOps (Docker Compose or non-K8s):
# - actual-budget-tools (Docker Compose)
# - esp32-firmware (embedded firmware, not K8s)
# - frigate (Docker Compose on standalone Pi)
# - pi3-adguard-home (Docker Compose on Pi3)
