apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: langfuse

resources:
  - statefulset.yaml

# Generated so the name carries a content hash: ClickHouse is mounted file by
# file (subPath), which never picks up a ConfigMap edit. The hash rolls the pod.
configMapGenerator:
  - name: langfuse-ch-config
    files:
      - system-logs.xml
      - profilers-off.xml
    options:
      labels:
        app: langfuse-ch
