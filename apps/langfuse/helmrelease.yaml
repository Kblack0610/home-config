apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: langfuse
  namespace: langfuse
spec:
  interval: 30m
  chart:
    spec:
      chart: langfuse
      version: "2.1.7"
      sourceRef:
        kind: HelmRepository
        name: langfuse
      interval: 1h
  values:
    langfuse:
      # ----------------------------------------------------------------
      # Core crypto - stored in langfuse-secrets (secret.sops.yaml)
      # NEXTAUTH_SECRET: openssl rand -base64 32
      # SALT:           openssl rand -base64 32
      # ENCRYPTION_KEY: openssl rand -hex 32  (64 hex chars - NOT base64)
      # ----------------------------------------------------------------
      nextauth:
        url: https://langfuse.kblab.me
        secret:
          secretKeyRef:
            name: langfuse-secrets
            key: NEXTAUTH_SECRET

      salt:
        secretKeyRef:
          name: langfuse-secrets
          key: SALT

      encryptionKey:
        secretKeyRef:
          name: langfuse-secrets
          key: ENCRYPTION_KEY

      # Inject the rest of langfuse-secrets as env vars.
      # This covers LANGFUSE_INIT_USER_* for headless seeding
      # (org, project, API keys, admin user) on first boot.
      # Docs: langfuse.com/self-hosting/administration/headless-initialization
      additionalEnvFrom:
        - secretRef:
            name: langfuse-secrets

      # ----------------------------------------------------------------
      # Ingress - Traefik TLS, LAN/Tailscale only
      # ----------------------------------------------------------------
      ingress:
        enabled: true
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-dns
          # Restricts to RFC1918 + Tailscale (same as openclaw, mem0)
          traefik.ingress.kubernetes.io/router.middlewares: monitoring-local-network-only@kubernetescrd
        hosts:
          - host: langfuse.kblab.me
            paths:
              - path: /
                pathType: Prefix
        tls:
          enabled: true
          secretName: langfuse-tls

      # Web (Next.js UI + API) - amd64 only (pod.nodeSelector, not top-level)
      web:
        service:
          type: ClusterIP
          port: 3000
        resources:
          requests:
            cpu: 200m
            memory: 768Mi
          limits:
            cpu: "1"
            memory: 2Gi
        pod:
          nodeSelector:
            kubernetes.io/arch: amd64
          # The langfuse-web image does not size Node's heap to the container
          # memory limit, so Node's default old-space cap (~768Mi) OOM-kills the
          # process at boot. Raise it to fit within the 2Gi limit (leaving
          # headroom for non-heap: buffers, code, stacks).
          additionalEnv:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1536"
            # "Sign in with Forgejo" via OIDC discovery on the issuer. The
            # OAuth app is langfuse.kblab.me under kblack0610 in Forgejo; its
            # client ID/secret are AUTH_CUSTOM_CLIENT_* in langfuse-secrets.
            # Password login stays as the fallback (rbw: langfuse).
            - name: AUTH_CUSTOM_NAME
              value: Forgejo
            - name: AUTH_CUSTOM_ISSUER
              value: https://git.kennethblack.me
            - name: AUTH_CUSTOM_SCOPE
              value: openid email profile
            - name: AUTH_CUSTOM_ALLOW_ACCOUNT_LINKING
              value: "true"
            # A Forgejo account whose email matches no Langfuse user becomes
            # a new user in the kblab org. Forgejo registration is disabled,
            # so only accounts made there by the admin can get in.
            - name: LANGFUSE_DEFAULT_ORG_ID
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: LANGFUSE_INIT_ORG_ID
            - name: LANGFUSE_DEFAULT_ORG_ROLE
              value: OWNER

      # Worker (background jobs: trace ingestion, exports, evals) - amd64 only.
      # Same Node heap-sizing fix as web: trace ingestion is memory-heavy and
      # the image does not size the heap to the container limit.
      worker:
        resources:
          requests:
            cpu: 200m
            memory: 768Mi
          limits:
            cpu: "1"
            memory: 2Gi
        pod:
          nodeSelector:
            kubernetes.io/arch: amd64
          additionalEnv:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1536"

    # ----------------------------------------------------------------
    # External Postgres (shared cluster Postgres at databases namespace)
    # Langfuse uses Postgres for transactional data (users, projects,
    # prompts, evals, Prisma migrations). ClickHouse holds trace data.
    # DB provisioned by apps/postgres/langfuse-db-bootstrap-job.yaml.
    # ----------------------------------------------------------------
    postgresql:
      deploy: false
      host: postgres.databases.svc.cluster.local
      port: 5432
      auth:
        username: langfuse
        database: langfuse
        # Pull password from langfuse-secrets; secretKeys must match
        # the actual key name in the Secret (not a Kubernetes key rename).
        existingSecret: langfuse-secrets
        secretKeys:
          userPasswordKey: POSTGRES_PASSWORD
          adminPasswordKey: POSTGRES_PASSWORD

    # ----------------------------------------------------------------
    # External Minio (existing minio.minio.svc.cluster.local:9000)
    # Bucket `langfuse` pre-created:
    #   kubectl -n minio exec deploy/minio -- mc mb /data/langfuse
    # ----------------------------------------------------------------
    s3:
      deploy: false
      bucket: langfuse
      endpoint: http://minio.minio.svc.cluster.local:9000
      region: us-east-1
      forcePathStyle: true
      accessKeyId:
        secretKeyRef:
          name: langfuse-secrets
          key: S3_ACCESS_KEY_ID
      secretAccessKey:
        secretKeyRef:
          name: langfuse-secrets
          key: S3_SECRET_ACCESS_KEY

    # ----------------------------------------------------------------
    # ClickHouse - our own StatefulSet (apps/langfuse/clickhouse/), not the
    # chart's. Chart 2.x would run it through the alpha clickhouse-operator
    # plus a 3-node Keeper; these tables are all non-replicated, so one plain
    # server does the job. Why and how: docs/langfuse-storage.md
    # ----------------------------------------------------------------
    clickhouse:
      deploy: false
      host: langfuse-ch.langfuse.svc.cluster.local
      auth:
        existingSecret: langfuse-secrets
        existingSecretKey: CLICKHOUSE_PASSWORD
      # Both default to true. cluster.enabled makes the migrator write
      # ON CLUSTER DDL; keeper.enabled makes the chart demand the operator's
      # KeeperCluster CRD even with deploy: false.
      cluster:
        enabled: false
      keeper:
        enabled: false

    # ----------------------------------------------------------------
    # Redis/Valkey - bundled subchart (valkey-io). The chart generates
    # langfuse-redis-auth and reuses it on every upgrade (lookup), so the
    # password needs no SOPS entry. noeviction is the chart default, stated
    # here as a guard: Langfuse's queues must not be evicted.
    # ----------------------------------------------------------------
    redis:
      deploy: true
      valkeyConfig: |
        maxmemory-policy noeviction
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
