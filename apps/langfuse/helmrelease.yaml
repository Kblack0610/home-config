apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: langfuse
  namespace: langfuse
spec:
  interval: 30m
  chart:
    spec:
      chart: langfuse
      version: "1.5.39"
      sourceRef:
        kind: HelmRepository
        name: langfuse
      interval: 1h
  # Note: chart ships frozen bitnamilegacy/* images (post-Aug 2025 Bitnami
  # restructure). Acceptable for homelab; revisit if security scans flag CVEs.
  values:
    langfuse:
      # ----------------------------------------------------------------
      # Core crypto — stored in langfuse-secrets (secret.sops.yaml)
      # NEXTAUTH_SECRET: openssl rand -base64 32
      # SALT:           openssl rand -base64 32
      # ENCRYPTION_KEY: openssl rand -hex 32  (64 hex chars — NOT base64)
      # ----------------------------------------------------------------
      nextauth:
        url: https://langfuse.kblab.me
        secret:
          secretKeyRef:
            name: langfuse-secrets
            key: NEXTAUTH_SECRET

      salt:
        secretKeyRef:
          name: langfuse-secrets
          key: SALT

      encryptionKey:
        secretKeyRef:
          name: langfuse-secrets
          key: ENCRYPTION_KEY

      # Seed initial admin — change password on first login
      initializeDefaultUser:
        enabled: true
        email:
          secretKeyRef:
            name: langfuse-secrets
            key: LANGFUSE_INIT_EMAIL
        password:
          secretKeyRef:
            name: langfuse-secrets
            key: LANGFUSE_INIT_PASSWORD
        name:
          secretKeyRef:
            name: langfuse-secrets
            key: LANGFUSE_INIT_NAME

      # ----------------------------------------------------------------
      # Ingress — Traefik TLS, LAN/Tailscale only
      # Service: langfuse-web:http (port 3000) created by the chart
      # ----------------------------------------------------------------
      ingress:
        enabled: true
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-dns
          # Restricts to RFC1918 + Tailscale (same as openclaw, mem0)
          traefik.ingress.kubernetes.io/router.middlewares: monitoring-local-network-only@kubernetescrd
        hosts:
          - host: langfuse.kblab.me
            paths:
              - path: /
                pathType: Prefix
        tls:
          enabled: true
          secretName: langfuse-tls

      # Web (Next.js UI + API) — amd64 only
      web:
        nodeSelector:
          kubernetes.io/arch: amd64
        service:
          type: ClusterIP
          port: 3000
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1536Mi

      # Worker (background jobs: trace ingestion, exports, evals) — amd64 only
      worker:
        nodeSelector:
          kubernetes.io/arch: amd64
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1536Mi

    # ----------------------------------------------------------------
    # External Postgres (shared cluster Postgres at databases namespace)
    # Langfuse uses Postgres for transactional data (users, projects,
    # prompts, evals, Prisma migrations). ClickHouse holds trace data.
    # DB provisioned by apps/postgres/langfuse-db-bootstrap-job.yaml.
    # ----------------------------------------------------------------
    postgresql:
      deploy: false
      host: postgres.databases.svc.cluster.local
      port: 5432
      database: langfuse
      username: langfuse
      password:
        secretKeyRef:
          name: langfuse-secrets
          key: POSTGRES_PASSWORD

    # ----------------------------------------------------------------
    # External Minio (existing minio.minio.svc.cluster.local:9000)
    # Bucket `langfuse` must be created before first deploy:
    #   kubectl -n minio exec deploy/minio -- mc mb /data/langfuse
    # ----------------------------------------------------------------
    s3:
      deploy: false
      bucket: langfuse
      endpoint: http://minio.minio.svc.cluster.local:9000
      region: us-east-1
      forcePathStyle: "true"
      accessKeyId:
        secretKeyRef:
          name: langfuse-secrets
          key: S3_ACCESS_KEY_ID
      secretAccessKey:
        secretKeyRef:
          name: langfuse-secrets
          key: S3_SECRET_ACCESS_KEY

    # ----------------------------------------------------------------
    # ClickHouse — bundled subchart, single-node without ZooKeeper
    # Required for trace/observation analytics in Langfuse v3.
    # Default ships 3 replicas @ 2xlarge + 3 ZooKeeper — overridden here.
    #
    # If upgrade brings chart validation errors on replicaCount:1
    # + clusterEnabled:false, consult langfuse-k8s release notes before
    # bumping the chart version.
    # ----------------------------------------------------------------
    clickhouse:
      deploy: true
      clusterEnabled: false
      replicaCount: 1
      zookeeper:
        enabled: false
      nodeSelector:
        kubernetes.io/arch: amd64
      persistence:
        enabled: true
        size: 20Gi
        storageClassName: local-path
      resourcesPreset: ""
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 4Gi

    # ----------------------------------------------------------------
    # Redis/Valkey — bundled subchart
    # noeviction policy is required by Langfuse; chart validates this.
    # ----------------------------------------------------------------
    redis:
      deploy: true
      primary:
        extraFlags:
          - "--maxmemory-policy noeviction"
      resourcesPreset: ""
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
