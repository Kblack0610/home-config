apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: langfuse
  namespace: langfuse
spec:
  interval: 30m
  chart:
    spec:
      chart: langfuse
      version: "1.5.39"
      sourceRef:
        kind: HelmRepository
        name: langfuse
      interval: 1h
  # Note: chart ships frozen bitnamilegacy/* images (post-Aug 2025 Bitnami
  # restructure). Acceptable for homelab; revisit if security scans flag CVEs.
  values:
    langfuse:
      # ----------------------------------------------------------------
      # Core crypto - stored in langfuse-secrets (secret.sops.yaml)
      # NEXTAUTH_SECRET: openssl rand -base64 32
      # SALT:           openssl rand -base64 32
      # ENCRYPTION_KEY: openssl rand -hex 32  (64 hex chars - NOT base64)
      # ----------------------------------------------------------------
      nextauth:
        url: https://langfuse.kblab.me
        secret:
          secretKeyRef:
            name: langfuse-secrets
            key: NEXTAUTH_SECRET

      salt:
        secretKeyRef:
          name: langfuse-secrets
          key: SALT

      encryptionKey:
        secretKeyRef:
          name: langfuse-secrets
          key: ENCRYPTION_KEY

      # Inject the rest of langfuse-secrets as env vars.
      # This covers LANGFUSE_INIT_USER_* for headless seeding
      # (org, project, API keys, admin user) on first boot.
      # Docs: langfuse.com/self-hosting/administration/headless-initialization
      additionalEnvFrom:
        - secretRef:
            name: langfuse-secrets

      # ----------------------------------------------------------------
      # Ingress - Traefik TLS, LAN/Tailscale only
      # ----------------------------------------------------------------
      ingress:
        enabled: true
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-dns
          # Restricts to RFC1918 + Tailscale (same as openclaw, mem0)
          traefik.ingress.kubernetes.io/router.middlewares: monitoring-local-network-only@kubernetescrd
        hosts:
          - host: langfuse.kblab.me
            paths:
              - path: /
                pathType: Prefix
        tls:
          enabled: true
          secretName: langfuse-tls

      # Web (Next.js UI + API) - amd64 only (pod.nodeSelector, not top-level)
      web:
        service:
          type: ClusterIP
          port: 3000
        resources:
          requests:
            cpu: 200m
            memory: 768Mi
          limits:
            cpu: "1"
            memory: 2Gi
        pod:
          nodeSelector:
            kubernetes.io/arch: amd64
          # The langfuse-web image does not size Node's heap to the container
          # memory limit, so Node's default old-space cap (~768Mi) OOM-kills the
          # process at boot. Raise it to fit within the 2Gi limit (leaving
          # headroom for non-heap: buffers, code, stacks).
          additionalEnv:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1536"

      # Worker (background jobs: trace ingestion, exports, evals) - amd64 only.
      # Same Node heap-sizing fix as web: trace ingestion is memory-heavy and
      # the image does not size the heap to the container limit.
      worker:
        resources:
          requests:
            cpu: 200m
            memory: 768Mi
          limits:
            cpu: "1"
            memory: 2Gi
        pod:
          nodeSelector:
            kubernetes.io/arch: amd64
          additionalEnv:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1536"

    # ----------------------------------------------------------------
    # External Postgres (shared cluster Postgres at databases namespace)
    # Langfuse uses Postgres for transactional data (users, projects,
    # prompts, evals, Prisma migrations). ClickHouse holds trace data.
    # DB provisioned by apps/postgres/langfuse-db-bootstrap-job.yaml.
    # ----------------------------------------------------------------
    postgresql:
      deploy: false
      host: postgres.databases.svc.cluster.local
      port: 5432
      auth:
        username: langfuse
        database: langfuse
        # Pull password from langfuse-secrets; secretKeys must match
        # the actual key name in the Secret (not a Kubernetes key rename).
        existingSecret: langfuse-secrets
        secretKeys:
          userPasswordKey: POSTGRES_PASSWORD
          adminPasswordKey: POSTGRES_PASSWORD

    # ----------------------------------------------------------------
    # External Minio (existing minio.minio.svc.cluster.local:9000)
    # Bucket `langfuse` pre-created:
    #   kubectl -n minio exec deploy/minio -- mc mb /data/langfuse
    # ----------------------------------------------------------------
    s3:
      deploy: false
      bucket: langfuse
      endpoint: http://minio.minio.svc.cluster.local:9000
      region: us-east-1
      forcePathStyle: true
      accessKeyId:
        secretKeyRef:
          name: langfuse-secrets
          key: S3_ACCESS_KEY_ID
      secretAccessKey:
        secretKeyRef:
          name: langfuse-secrets
          key: S3_SECRET_ACCESS_KEY

    # ----------------------------------------------------------------
    # ClickHouse - bundled subchart (Bitnami v8.0.5), single-node
    # Required for trace/observation analytics in Langfuse v3.
    # Default ships 3 replicas @ 2xlarge + 3 ZooKeeper - overridden.
    # Password pinned via existingSecret to survive helm upgrades.
    # ----------------------------------------------------------------
    clickhouse:
      deploy: true
      clusterEnabled: false
      replicaCount: 1
      zookeeper:
        enabled: false
      auth:
        existingSecret: langfuse-secrets
        existingSecretKey: CLICKHOUSE_PASSWORD
      nodeSelector:
        kubernetes.io/arch: amd64
      persistence:
        enabled: true
        size: 20Gi
        storageClassName: local-path
      resourcesPreset: ""
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 4Gi

    # ----------------------------------------------------------------
    # Redis/Valkey - bundled subchart
    # noeviction policy is already the chart default but stated
    # explicitly here as a guard against subchart default changes.
    # ----------------------------------------------------------------
    redis:
      deploy: true
      # Password consumed by BOTH the Valkey subchart AND the langfuse
      # connection-string helper (both read redis.auth.existingSecret).
      # Without this the chart deploys password-protected Valkey but hands
      # web a passwordless redis:// string -> WRONGPASS crash loop.
      auth:
        existingSecret: langfuse-secrets
        existingSecretPasswordKey: REDIS_PASSWORD
      primary:
        extraFlags:
          - "--maxmemory-policy noeviction"
      resourcesPreset: ""
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
