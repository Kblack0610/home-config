apiVersion: batch/v1
kind: CronJob
metadata:
  name: litellm-backup
  namespace: ai-gateway
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup
              image: alpine:3.24.1
              env:
                - name: NAS_SMB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backup-nas-credentials
                      key: smb-password
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  apk add --no-cache tar gzip samba-client >/dev/null

                  # THIS JOB CURRENTLY BACKS UP NOTHING. Every archive it has
                  # written is 104 bytes: the litellm-data PVC is empty because
                  # litellm keeps its keys, spend and config in Postgres
                  # (DATABASE_URL), not on disk. The fix is to dump that database,
                  # not to tar this PVC. Tracked in docs/backup-runbook.md.
                  # No MIN_BYTES floor here on purpose - it would fail every night
                  # for a gap that needs the job repointed, not an alarm.
                  SMB="//nas.nas.svc.cluster.local/private"
                  DEST="backups/home-k3s/litellm"

                  log() { echo "[$(date -Iseconds)] $*"; }

                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  BACKUP_FILE="litellm-${TIMESTAMP}.tar.gz"
                  tar -czf "/backup/${BACKUP_FILE}" -C /data .
                  size="$(wc -c < "/backup/${BACKUP_FILE}")"
                  log "created ${BACKUP_FILE} (${size} bytes)"
                  if [ "${size}" -lt 1024 ]; then
                    log "WARN: ${size} bytes - this archive covers nothing. litellm state lives in Postgres; this job needs repointing."
                  fi

                  ls -t /backup/litellm-*.tar.gz | tail -n +31 | xargs -r rm
                  log "local backup complete: ${BACKUP_FILE}"

                  # Off-box copy. Best-effort by design (docs/backup-runbook.md):
                  # the local copy is the success condition, so this warns and
                  # exits 0. smbclient -c does not exit non-zero when a command
                  # inside it fails, so every call must be checked for NT_STATUS_.
                  # Why, and the identical copies that move with this one:
                  # apps/zomboid/backup/backup.sh.
                  smb() {
                    _out="$(smbclient "${SMB}" -U "nas%${NAS_SMB_PASSWORD}" -c "$1" 2>&1)"
                    _bad="$(echo "${_out}" | grep -o 'NT_STATUS_[A-Z_]*' | grep -v 'NT_STATUS_OBJECT_NAME_COLLISION' || true)"
                    if [ -n "${_bad}" ]; then
                      log "ERROR: smbclient '$1' failed: ${_bad}"
                      return 1
                    fi
                    echo "${_out}"
                  }

                  nas_copy() {
                    # mkdir does not create parents, so walk the path a component
                    # at a time. OBJECT_NAME_COLLISION means it already exists.
                    _path=""
                    for _part in $(echo "${DEST}" | tr '/' ' '); do
                      _path="${_path:+${_path}/}${_part}"
                      smb "mkdir ${_path}" >/dev/null || return 1
                    done
                    smb "cd ${DEST}; put /backup/${BACKUP_FILE} ${BACKUP_FILE}" >/dev/null || return 1
                    remote_size="$(smb "cd ${DEST}; ls ${BACKUP_FILE}" | awk -v f="${BACKUP_FILE}" '$1==f {print $3}')"
                    if [ -z "${remote_size}" ]; then
                      log "ERROR: ${BACKUP_FILE} is not on the share after upload."
                      return 1
                    fi
                    if [ "${remote_size}" != "${size}" ]; then
                      log "ERROR: size mismatch - local ${size}, remote ${remote_size}."
                      return 1
                    fi
                    log "verified on the share: ${remote_size} bytes"
                  }

                  if nas_copy; then
                    log "NAS copy OK: ${BACKUP_FILE}"
                  else
                    log "WARN: off-box copy failed. The local copy on this node is good, but the OFF-BOX copy is missing."
                  fi
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: backup
                  mountPath: /backup
          restartPolicy: OnFailure
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: litellm-data
            - name: backup
              hostPath:
                path: /var/backups/litellm
                type: DirectoryOrCreate
