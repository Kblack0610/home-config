apiVersion: batch/v1
kind: CronJob
metadata:
  name: litellm-backup
  namespace: ai-gateway
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup
              image: alpine:latest
              env:
                - name: NAS_SMB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backup-nas-credentials
                      key: smb-password
              command:
                - /bin/sh
                - -c
                - |
                  apk add --no-cache tar gzip samba-client
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  BACKUP_FILE="litellm-$TIMESTAMP.tar.gz"
                  tar -czf /backup/$BACKUP_FILE -C /data .
                  # Keep only last 30 local backups
                  ls -t /backup/litellm-*.tar.gz | tail -n +31 | xargs -r rm
                  echo "Local backup complete: $BACKUP_FILE"
                  # Upload to NAS (best-effort — local backup still succeeds if NAS is down)
                  smbclient //nas.nas.svc.cluster.local/private -U "nas%${NAS_SMB_PASSWORD}" -c \
                    "mkdir backups; cd backups; mkdir home-k3s; cd home-k3s; mkdir litellm; cd litellm; put /backup/$BACKUP_FILE $BACKUP_FILE" \
                    && echo "NAS copy OK: $BACKUP_FILE" \
                    || echo "WARN: NAS copy failed, local backup still available"
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: backup
                  mountPath: /backup
          restartPolicy: OnFailure
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: litellm-data
            - name: backup
              hostPath:
                path: /var/backups/litellm
                type: DirectoryOrCreate
