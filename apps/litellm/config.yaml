# Every route here is a cloud upstream: Gemini (free tier), Lazer (paid) or
# OpenCode Go (flat plan). There is no self-hosted model tier.
model_list:
  # Naming convention: `<role> (<Model-Name>)`, role-first.
  #
  # Role is the primary axis (code, reasoning, fast, embedding, vlm,
  # stt, tts, image). Multiple models can share a role; tier and
  # modality live in `model_info.tags` and `model_info.mode`, NOT in
  # the name. Consumers call a category alias (model_group_alias) or
  # pick the specific model_name when they want a specific tier.
  #
  # `model:` passes through to upstream: the provider's model id, with
  # an `openai/` prefix for Lazer.

  # Cloud free-tier routes via Google Gemini (native gemini/ provider).
  # The fallback tier behind Lazer (paid, default for
  # chat). Gemini is the only embedding option: Lazer's catalog has no
  # embedding model. Free tier; key in secret.sops.yaml
  # (litellm-db-secrets) as GEMINI_API_KEY.

  - model_name: "assist (gemini-flash)"
    litellm_params:
      model: "gemini/gemini-3.5-flash-lite"
      api_key: os.environ/GEMINI_API_KEY_FAMILY
      timeout: 8
      stream_timeout: 8
    model_info:
      mode: chat
      tags: ["cloud", "gemini", "assist"]
      capabilities:
        tools: true
        code: false
        vision: true
        reasoning: false
        json_mode: true
      supports_function_calling: true

  # embedding cloud: gemini-embedding-001, the gateway's only embedder
  # (mem0 and karakeep pin it). (text-embedding-004 is retired.)
  # Native gemini/ provider — honors output_dimensionality so the vector is
  # forced to 768 dims, matching the pgvector column (apps/mem0/,
  # vector(768)). NOTE: the OpenAI-compatible Google endpoint
  # (openai/ + .../v1beta/openai) ignores `dimensions` and returns gemini's
  # default 3072 → "different vector dimensions 768 and 3072" on insert, so
  # it must NOT be used here. `dimensions: 768` maps to outputDimensionality.
  - model_name: "embedding (gemini-001)"
    litellm_params:
      model: "gemini/gemini-embedding-001"
      api_key: os.environ/GEMINI_API_KEY
      dimensions: 768
    model_info:
      mode: embedding
      tags: ["cloud", "gemini", "free"]

  # ============================================================
  # Paid routes via Lazer (proxy.lazertechnologies.com)
  # ============================================================
  # Picks from Lazer's catalog. The Lazer budget is $250/mo, believed to be enforced by
  # Lazer upstream (unconfirmed); the gateway meters it. LiteLLM cannot price a custom
  # api_base, so every route below carries Lazer's list price
  # (input_cost_per_token etc., $/1M from proxy /v1/models). Without those
  # keys spend records as $0 and no budget could ever trip.
  # No per-route max_budget: the allowance is split into two LiteLLM teams by
  # consumer priority (lazer-core $200/1mo, lazer-pool $50/1mo, README), so
  # route caps would only stack under them and block a heavy day early. tpm/rpm below are runaway-loop guards only.
  # Route NAMES are stable aliases; the upstream `model:` id floats with
  # Lazer's catalog. Probe the id live (POST /v1/chat/completions,
  # max_tokens 16) before changing it: /v1/models lists ids the key cannot
  # reach (qwen-3.7-plus, deepseek-v4-pro and deepseek-v4-flash all 404).
  #
  # Cost control, outermost first:
  #   - teams:             lazer-core $200 (priority must) + lazer-pool $50
  #                        (priority low) per calendar month, the $250 allowance
  #                        (runtime state in the gateway DB, not here)
  #   - tpm/rpm:           runaway-loop / stuck-retry caps per route
  #   - per-virtual-key:   primary control via /key/generate
  #                        allowed_models. binks-api + mem0 use the
  #                        `local-only` key (named before the local tier
  #                        went; it allows `fast (gpt-oss-120b)`);
  #                        Karakeep gets its own `karakeep` key
  #                        (fast + embedding only).

  # code paid - qwen-3-coder via deepinfra. Cheapest coder option.
  - model_name: "code (qwen-3-coder)"
    litellm_params:
      model: "openai/qwen-3.8-max"
      api_base: https://proxy.lazertechnologies.com/v1
      api_key: os.environ/LAZER_API_KEY
      # Lazer list price, $/1M: in 2 out 6 cache_read 0.25 (proxy /v1/models, 2026-10-05).
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000006
      cache_read_input_token_cost: 0.00000025
      tpm: 200000
      rpm: 120
    model_info:
      mode: chat
      tags: ["paid", "lazer"]
      capabilities:
        tools: true
        code: true
        vision: false
        reasoning: false
        json_mode: true
      supports_function_calling: true

  # reasoning paid: glm-5.3, named for what it serves. The scoped `glm-pilot` key
  # (README) allows only this name, so a GLM canary spends against its own cap.
  # Thinking-mode model.
  - model_name: "reasoning (glm-5.3)"
    litellm_params:
      model: "openai/glm-5.3"
      api_base: https://proxy.lazertechnologies.com/v1
      api_key: os.environ/LAZER_API_KEY
      # Lazer list price, $/1M: in 1.4 out 4.4 cache_read 0.26 (proxy /v1/models, 2026-10-05).
      input_cost_per_token: 0.0000014
      output_cost_per_token: 0.0000044
      cache_read_input_token_cost: 0.00000026
      tpm: 100000
      rpm: 60
    model_info:
      mode: chat
      tags: ["paid", "lazer"]
      capabilities:
        tools: true
        code: true
        vision: false
        reasoning: true
        json_mode: true
      supports_function_calling: true

  # fast paid — gpt-oss-120b via cerebras. Cerebras inference is
  # genuinely fast (sub-second p50).
  - model_name: "fast (gpt-oss-120b)"
    litellm_params:
      model: "openai/gpt-oss-120b"
      api_base: https://proxy.lazertechnologies.com/v1
      api_key: os.environ/LAZER_API_KEY
      # Lazer list price, $/1M: in 0.35 out 0.75 (proxy /v1/models, 2026-10-05).
      input_cost_per_token: 0.00000035
      output_cost_per_token: 0.00000075
      tpm: 500000
      rpm: 240
    model_info:
      mode: chat
      tags: ["paid", "lazer"]
      capabilities:
        tools: true
        code: false
        vision: false
        reasoning: false
        json_mode: true

  # vlm paid - gemini-3-flash, the gateway's only VLM route. Serves
  # vision (image + pdf) requests. Image-capable, cheap.
  # NOTE the route name is a STABLE ALIAS; the upstream id below floats.
  # Lazer retired `gemini-3-flash` (now 3.5/3.6), so this route - and the
  # bare `vlm` alias that points at it - returned
  # `400 unknown model: gemini-3-flash` for every vision request. Renaming
  # the route to chase the vendor was rejected: the name is pinned in
  # several repo files and consumer keys, so a rename is churn that
  # repeats on every vendor bump. Only the upstream moves.
  - model_name: "vlm (gemini-3-flash)"
    litellm_params:
      model: "openai/gemini-3.8-flash"
      api_base: https://proxy.lazertechnologies.com/v1
      api_key: os.environ/LAZER_API_KEY
      # Lazer list price, $/1M: in 0.75 out 3.75 cache_read 0.075 (proxy /v1/models, 2026-10-05).
      input_cost_per_token: 0.00000075
      output_cost_per_token: 0.00000375
      cache_read_input_token_cost: 0.000000075
      tpm: 100000
      rpm: 60
    model_info:
      mode: chat
      tags: ["paid", "lazer"]
      capabilities:
        tools: true
        code: false
        vision: true
        reasoning: false
        json_mode: true

  # stt paid — whisper-turbo via groq. Free ($0/$0). No active consumer
  # but exposed for future voice-input use cases.
  - model_name: "stt (whisper-turbo)"
    litellm_params:
      model: "openai/whisper-turbo"
      api_base: https://proxy.lazertechnologies.com/v1
      api_key: os.environ/LAZER_API_KEY
      tpm: 1000000
      rpm: 600
    model_info:
      mode: audio_transcription
      tags: ["paid", "lazer", "free"]
      capabilities:
        audio: true

  # ------------------------------------------------------------
  # Claude behind Lazer (2026-07) — for HARNESSED consumers that need a
  # real Claude model, reached through LiteLLM's Anthropic `/v1/messages`
  # bridge. First consumer: the headless `delivery-loop` agentctl agent
  # (~/.dotfiles/.local/bin/delivery-loop), which runs `claude -p` with
  # ANTHROPIC_BASE_URL=https://llm.kblab.me so the kb-* pipeline's tokens
  # flow through Lazer instead of the native Anthropic subscription.
  #
  # Claude Code REQUIRES an Anthropic Messages endpoint; Lazer is
  # OpenAI-only (no /v1/messages), so the path is Claude Code -> LiteLLM
  # anthropic bridge (translates Anthropic<->OpenAI) -> these Lazer routes.
  # drop_params (litellm_settings) smooths the translation. Scoped key
  # `delivery-loop` (allowed_models = these three); key in rbw as
  # litellm_delivery_loop_key, never committed.
  #
  # TWO naming rules combine here:
  #  1. NAMING EXCEPTION to `<role> (<model>)`: each route is named with the
  #     BARE CANONICAL Anthropic id Claude Code emits. Claude Code
  #     canonicalizes any model it's handed (dots -> hyphens, strips
  #     suffixes) before the wire, so the addressable gateway name MUST equal
  #     that id (`claude-sonnet-5`, `claude-opus-4-8`,
  #     `claude-haiku-4-5-20251001`) or the key 403s / the route 404s.
  #  2. The upstream `model:` id must be a REAL entry in Lazer's catalog
  #     (verified live 2026-07: claude-sonnet-5, claude-opus-4.8,
  #     claude-opus-4.6, claude-haiku-4.5, claude-fable-5 — note there is NO
  #     claude-sonnet-4.6). So the Claude-Code id and the Lazer id differ by
  #     design: e.g. Claude Code's `claude-sonnet-5` -> Lazer `claude-sonnet-5`,
  #     its default background `claude-haiku-4-5-20251001` -> Lazer `claude-haiku-5.5` (4.5 left the catalog by 2026-10-20).
  #
  # sonnet-5 = the loop's workhorse main model (set ANTHROPIC_MODEL to this).
  - model_name: "claude-sonnet-5"
    litellm_params:
      model: "openai/claude-sonnet-5.5"
      api_base: https://proxy.lazertechnologies.com/v1
      api_key: os.environ/LAZER_API_KEY
      # Lazer list price, $/1M: in 2 out 10 cache_read 0.2 cache_write 2.5 (proxy /v1/models, 2026-10-05).
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.00001
      cache_read_input_token_cost: 0.0000002
      cache_creation_input_token_cost: 0.0000025
      tpm: 400000
      rpm: 120
    model_info:
      mode: chat
      tags: ["paid", "lazer"]
      capabilities:
        tools: true
        code: true
        vision: false
        reasoning: false
        json_mode: true
      supports_function_calling: true

  # opus-4.8 = best available; for the heavy pipeline legs (architect/
  # reviewer) or as the main model when max quality is wanted. Tighter cap.
  - model_name: "claude-opus-4-8"
    litellm_params:
      model: "openai/claude-opus-5.5"
      api_base: https://proxy.lazertechnologies.com/v1
      api_key: os.environ/LAZER_API_KEY
      # Lazer list price, $/1M: in 4 out 20 cache_read 0.2 cache_write 5 (proxy /v1/models, 2026-10-05).
      input_cost_per_token: 0.000004
      output_cost_per_token: 0.00002
      cache_read_input_token_cost: 0.0000002
      cache_creation_input_token_cost: 0.000005
      tpm: 200000
      rpm: 60
    model_info:
      mode: chat
      tags: ["paid", "lazer"]
      capabilities:
        tools: true
        code: true
        vision: false
        reasoning: true
        json_mode: true
      supports_function_calling: true

  # haiku-4.5 = the background/small-fast slot. Claude Code hardcodes the id
  # `claude-haiku-4-5-20251001` for background tasks (title-gen, summaries)
  # and ignores ANTHROPIC_SMALL_FAST_MODEL when it's not a claude id, so this
  # route MUST exist under exactly that name or every harnessed run 403s.
  - model_name: "claude-haiku-4-5-20251001"
    litellm_params:
      model: "openai/claude-haiku-5.5"
      api_base: https://proxy.lazertechnologies.com/v1
      api_key: os.environ/LAZER_API_KEY
      # Lazer list price, $/1M: in 0.1 out 0.5 cache_read 0.01 cache_write 0.125 (proxy /v1/models, claude-haiku-5.5, 2026-10-20).
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000005
      cache_read_input_token_cost: 0.00000001
      cache_creation_input_token_cost: 0.000000125
      tpm: 500000
      rpm: 240
    model_info:
      mode: chat
      tags: ["paid", "lazer"]
      capabilities:
        tools: true
        code: false
        vision: false
        reasoning: false
        json_mode: true
      supports_function_calling: true

  # ============================================================
  # Flat-plan routes via OpenCode Go (opencode.ai/inference/go)
  # ============================================================
  # Go is $10/mo flat with a per-model dollar allowance (Go plan column at
  # opencode.ai/docs/go, 2026-11-11: GLM-5.3, Kimi K3 and Haiku 5.5 are $15/mo
  # each), spent in windows of 20% per 5h, 50% per week, 100% per month. Go has
  # no usage API, so each route carries Go's list price: gateway spend then
  # equals what Go counts against the allowance; each route's 5h budget below
  # and the `fleet-go` key's week budget (README) mirror the windows. Extra Usage stays off in the OpenCode
  # console, so a spent window is a refusal there, never a charge.
  #
  # NO fallback edge on any of these (router_settings.fallbacks): a Go refusal
  # must fail the call, not spill flat-plan work onto paid Lazer.
  #
  # Third-party clients must name themselves in User-Agent (static below) and
  # send a stable `x-opencode-session` per conversation. opencode sends that
  # header on every call; litellm_settings.model_group_settings forwards the
  # client's x- headers for these routes only, so Go sees opencode's own
  # session id. Go refuses a call without one (400 MissingSessionID), so a
  # probe sends its own.
  # The Authorization and x-api-key headers are never forwarded (LiteLLM strips
  # them), so the gateway key does not leave the cluster.
  #
  # DeepSeek V4.1 Flash is not routed: it needs the workspace's Global region
  # (OpenCode console, Settings > Privacy), a human step; until then Go 400s it.
  - model_name: "go (glm-5.3)"
    litellm_params:
      model: "openai/glm-5.3"
      api_base: https://opencode.ai/inference/go/openai/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      extra_headers: {"User-Agent": "kblab-litellm-gateway/1.0"}
      # Go list price, $/1M: in 1.40 out 4.40 cache_read 0.26, no cache write (docs/go, 2026-11-11).
      input_cost_per_token: 0.0000014
      output_cost_per_token: 0.0000044
      cache_read_input_token_cost: 0.00000026
      tpm: 400000
      rpm: 30
      # Go's 5h window at 19% of $15 (README, OpenCode Go keys).
      max_budget: 2.85
      budget_duration: 5h
    model_info:
      mode: chat
      tags: ["flat", "opencode-go"]
      capabilities:
        tools: true
        code: true
        vision: false
        reasoning: true
        json_mode: true
      supports_function_calling: true

  - model_name: "go (kimi-k3)"
    litellm_params:
      model: "openai/kimi-k3"
      api_base: https://opencode.ai/inference/go/openai/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      extra_headers: {"User-Agent": "kblab-litellm-gateway/1.0"}
      # Go list price, $/1M: in 3.00 out 15.00 cache_read 0.30 cache_write 3.00 (docs/go, 2026-11-11).
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      cache_read_input_token_cost: 0.0000003
      cache_creation_input_token_cost: 0.000003
      tpm: 400000
      rpm: 30
      # Go's 5h window at 19% of $15 (README, OpenCode Go keys).
      max_budget: 2.85
      budget_duration: 5h
    model_info:
      mode: chat
      tags: ["flat", "opencode-go"]
      capabilities:
        tools: true
        code: true
        vision: false
        reasoning: true
        json_mode: true
      supports_function_calling: true

  # Haiku is served on Go's Anthropic Messages endpoint (LiteLLM appends
  # /v1/messages; Go takes the key as x-api-key). Its price steps up above a
  # 100K-token prompt, which the _above_100k_ keys in model_info model.
  - model_name: "go (claude-haiku-5-5)"
    litellm_params:
      model: "anthropic/claude-haiku-5-5"
      api_base: https://opencode.ai/inference/go/anthropic
      api_key: os.environ/OPENCODE_GO_API_KEY
      extra_headers: {"User-Agent": "kblab-litellm-gateway/1.0"}
      # Go list price, $/1M: in 0.10 out 0.50 cache_read 0.01 cache_write 0.125;
      # above 100K: in 0.50 out 2.50 cache_read 0.05 cache_write 0.625 (docs/go, 2026-11-11).
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000005
      cache_read_input_token_cost: 0.00000001
      cache_creation_input_token_cost: 0.000000125
      tpm: 400000
      rpm: 30
      # Go's 5h window at 19% of $15 (README, OpenCode Go keys).
      max_budget: 2.85
      budget_duration: 5h
    model_info:
      # The above-100K tier sits here, not in litellm_params: the router copies only
      # its fixed set of price keys (128k/200k/272k tiers) from litellm_params, while
      # model_info goes into the cost map whole and the cost code parses any
      # _above_<N>k_ threshold.
      input_cost_per_token_above_100k_tokens: 0.0000005
      output_cost_per_token_above_100k_tokens: 0.0000025
      cache_read_input_token_cost_above_100k_tokens: 0.00000005
      cache_creation_input_token_cost_above_100k_tokens: 0.000000625
      mode: chat
      tags: ["flat", "opencode-go"]
      capabilities:
        tools: true
        code: true
        vision: false
        reasoning: false
        json_mode: true
      supports_function_calling: true


  # ============================================================
  # Free route via the NVIDIA NIM API catalog (integrate.api.nvidia.com)
  # ============================================================
  # NIM's free tier: about 40 requests/min shared by every model on one key,
  # no card, framed by NVIDIA as evaluation, not production: personal fleet
  # trial work only, never client work. Priced at 0, so spend reads $0 and only
  # rpm (35, under NIM's 40) limits it. Key NVIDIA_NIM_API_KEY in
  # secret.sops.yaml (rbw `nvidia-nim-api-key`); gateway key `fleet-nim`.
  #
  # NO fallback edge (router_settings.fallbacks): a NIM 429 must fail the call,
  # not spill free-tier work onto paid Lazer.
  - model_name: "free-deepseek (deepseek-v4.1-flash)"
    litellm_params:
      model: "openai/deepseek-ai/deepseek-v4.1-flash"
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_NIM_API_KEY
      input_cost_per_token: 0
      output_cost_per_token: 0
      rpm: 35
    model_info:
      mode: chat
      tags: ["free", "nvidia-nim"]
      capabilities:
        tools: true
        code: true
        vision: false
        reasoning: true
        json_mode: true
      supports_function_calling: true

router_settings:
  routing_strategy: "simple-shuffle"
  timeout: 900
  # One stable name per category. A consumer calls the short name (e.g.
  # model="fast") and LiteLLM resolves it to the concrete route on the
  # right, so moving a category to another upstream is one edit here,
  # commit, and Flux reconciles: no consumer edits. The explicit route
  # names still work directly for side-by-side A/B testing.
  #
  # NOTE embedding is deliberately NOT wired into any stateful consumer via
  # this alias: mem0/karakeep pin an explicit embedder because a vector
  # store cannot hot-swap embedder dimensions (the pgvector column is 768).
  # Chat/vision/stt are stateless -> safe to toggle; embedding is
  # stateful -> pinned. See each consumer's configmap.
  model_group_alias:
    code: "code (qwen-3-coder)"
    reasoning: "reasoning (glm-5.3)"
    fast: "fast (gpt-oss-120b)"
    vlm: "vlm (gemini-3-flash)"
    embedding: "embedding (gemini-001)"
    stt: "stt (whisper-turbo)"
  # Failover chains (LiteLLM tries the listed models in order when the
  # primary errors/times out):
  #   fast:   Lazer gpt-oss-120b -> Gemini flash
  #   assist: Gemini flash -> Lazer gpt-oss-120b
  # Embedding has no fallback: Gemini is the only 768-dim embedder.
  fallbacks:
    # gpt-oss is also Binks's primary (config/binks/agent.yaml in
    # home-assistant), so its fallback is the free Gemini assist route.
    # The old Gemini 2.0 hop was removed 2026-10-15: Google retired that model
    # (404) and its key had no chat quota, so it turned every recoverable
    # failure into a hard error.
    - {"fast (gpt-oss-120b)": ["assist (gemini-flash)"]}
    # Binks (HA voice): Gemini family key (primary) -> Lazer gpt-oss-120b
    # (verified tool-calling). Keeps voice up across one provider's outage.
    - {"assist (gemini-flash)": ["fast (gpt-oss-120b)"]}

litellm_settings:
  drop_params: true
  request_timeout: 900
  # Callbacks:
  #   prometheus     — per-model metrics on /metrics/ (ServiceMonitor in this dir)
  #   langfuse_otel  — request-level traces to Langfuse, through Alloy for
  #                    redaction. LANGFUSE_OTEL_HOST (not LANGFUSE_HOST) is in
  #                    deployment.yaml and names Alloy. The callback refuses to
  #                    start without LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY,
  #                    so they stay in the secret; Alloy sends its own to Langfuse.
  # tool_compat: JSON-encodes object tool results (OpenAI-compatible upstreams
  # like Lazer require strings) and drops anyOf branches that only say
  # `required` (Gemini rejects them; HA timer tools), and drops the json_schema
  # name on Lazer's Claude routes (Lazer passes it to Anthropic, which 400s). The
  # module sits next to this file in /etc/litellm (tool_compat.py).
  callbacks: ["prometheus", "langfuse_otel", "tool_compat.proxy_handler_instance"]
  # /metrics/ needs no key. LiteLLM only accepts a PROXY ADMIN key there, and a scrape
  # credential with admin power is worse than no credential. Instead the path is
  # unreachable from outside: ingress-metrics-deny.yaml 403s /metrics on llm.kblab.me,
  # so only in-cluster Prometheus (ServiceMonitor -> Service) can read it.
  require_auth_for_metrics_endpoint: false
  # Emit team/key budget gauges from the DB on a cron, not only after a request. The
  # Command Center spend tiles read litellm_team_max_budget_metric and
  # litellm_remaining_team_budget_metric{team_alias="lazer-pool"}, which are otherwise
  # absent after every restart until that team next sends traffic.
  prometheus_initialize_budget_metrics: true
  # Forward the client's x- headers (x-opencode-session above) to these routes
  # only. Other upstreams never see client headers.
  model_group_settings:
    forward_client_headers_to_llm_api:
      - "go (glm-5.3)"
      - "go (kimi-k3)"
      - "go (claude-haiku-5-5)"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Postgres-backed proxy state: virtual keys, per-key/per-model
  # spend tracking, budgets. DATABASE_URL injected via litellm-db-secrets
  # (apps/litellm/secret.sops.yaml). store_model_in_db: false keeps the
  # model_list authoritative in this configmap (git-tracked) — DB only
  # holds keys/spend/budgets. The rescheduler timings are LiteLLM's
