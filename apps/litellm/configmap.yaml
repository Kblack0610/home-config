apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: litellm
data:
  config.yaml: |
    model_list:
      - model_name: mlx-community/Qwen3-Coder-Next-4bit
        litellm_params:
          model: openai/mlx-community/Qwen3-Coder-Next-4bit
          api_base: http://192.168.1.4:8080/v1
          stream: true
          api_key: "mlx"
        model_info:
          supports_function_calling: true

      - model_name: mlx-community/Qwen3-235B-A22B-4bit-DWQ
        litellm_params:
          model: openai/mlx-community/Qwen3-235B-A22B-4bit-DWQ
          api_base: http://192.168.1.4:8081/v1
          stream: true
          api_key: "mlx"
        model_info:
          supports_function_calling: true

      - model_name: mlx-community/DeepSeek-R1-Distill-Qwen-32B-MLX-4Bit
        litellm_params:
          model: openai/mlx-community/DeepSeek-R1-Distill-Qwen-32B-MLX-4Bit
          api_base: http://192.168.1.4:8082/v1
          stream: false
          api_key: "mlx"
        model_info:
          supports_function_calling: true

      # Embedding model used by apps/mem0/ for memory ingest + retrieval.
      # Currently served by mlx-openai-server (cubist38) on Mac Studio
      # via the launchd-mlx-openai-server Ansible role on :8090. The
      # legacy Ollama LaunchAgent on :8083 was removed when that role
      # took over. nomic-embed-text-v1.5 outputs 768-dim vectors; mem0
      # writes them into the pgvector store at apps/postgres/.
      - model_name: nomic-embed-text-v1.5
        litellm_params:
          model: openai/nomic-embed-text-v1.5
          api_base: http://192.168.1.4:8090/v1
          api_key: "mlx"
        model_info:
          mode: embedding

    router_settings:
      routing_strategy: "simple-shuffle"
      timeout: 900

    litellm_settings:
      drop_params: true
      request_timeout: 900

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
