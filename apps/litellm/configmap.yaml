apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: litellm
data:
  config.yaml: |
    # All upstream models served by the single mlx-server on Mac Studio
    # at 192.168.1.4:8090 (managed by ansible/roles/launchd-mlx-server/).
    # Replaces the legacy multi-port layout (8080/8081/8082 chat +
    # 11434 Ollama embedding). Add a new model_list entry here whenever
    # mlx_models in the role's defaults gains an entry; api_base is
    # always 192.168.1.4:8090/v1.
    model_list:
      - model_name: mlx-community/Qwen3-Coder-Next-4bit
        litellm_params:
          model: openai/mlx-community/Qwen3-Coder-Next-4bit
          api_base: http://192.168.1.4:8090/v1
          stream: true
          api_key: "mlx"
        model_info:
          supports_function_calling: true

      # Smart slot — Z.ai's flagship 744 B-param MoE, MIT-licensed.
      # on_demand in mlx-server (390 GB cannot be pinned alongside the
      # other models on the 512 GB box); first request after eviction
      # pays a 5–10 min cold-load. timeout bumped accordingly.
      - model_name: mlx-community/GLM-5-4bit
        litellm_params:
          model: openai/mlx-community/GLM-5-4bit
          api_base: http://192.168.1.4:8090/v1
          stream: true
          api_key: "mlx"
          timeout: 1200
        model_info:
          supports_function_calling: true

      # Reasoning slot — Qwen3.6 with native thinking-budget control.
      # Replaces the older DeepSeek-R1-Distill-Qwen-32B.
      - model_name: mlx-community/Qwen3.6-35B-A3B-4bit
        litellm_params:
          model: openai/mlx-community/Qwen3.6-35B-A3B-4bit
          api_base: http://192.168.1.4:8090/v1
          stream: true
          api_key: "mlx"
        model_info:
          supports_function_calling: true

      # Vision slot — GLM-4.6V Flash, paired with the GLM family for
      # consistent vision/text behaviour. 4-bit, ~7 GB resident.
      - model_name: mlx-community/GLM-4.6V-Flash-4bit
        litellm_params:
          model: openai/mlx-community/GLM-4.6V-Flash-4bit
          api_base: http://192.168.1.4:8090/v1
          stream: true
          api_key: "mlx"
        model_info:
          supports_vision: true
          supports_function_calling: true

      # Embedding model used by apps/mem0/ for memory ingest + retrieval.
      # 768-dim output; mem0 writes vectors into the pgvector store at
      # apps/postgres/.
      #
      # encoding_format pinned to "float" because mlx-openai-server's
      # Pydantic validator rejects null encoding_format (LiteLLM sends
      # null by default; mlx-openai-server expects literal "float" or
      # "base64").
      - model_name: nomicai-modernbert-embed-base-4bit
        litellm_params:
          model: openai/mlx-community/nomicai-modernbert-embed-base-4bit
          api_base: http://192.168.1.4:8090/v1
          api_key: "mlx"
          encoding_format: "float"
          # Per-model drop_params overrides the global litellm_settings.drop_params
          # for this entry's pre-validation chain. mem0's openai embedder always
          # passes `dimensions` regardless of config; LiteLLM's text-embedding-3
          # validator rejects it before the global drop_params runs.
          # additional_drop_params explicitly drops the `dimensions` field
          # before validation, letting the request reach mlx-openai-server.
          drop_params: true
          additional_drop_params: ["dimensions"]
        model_info:
          mode: embedding

    router_settings:
      routing_strategy: "simple-shuffle"
      timeout: 900

    litellm_settings:
      drop_params: true
      request_timeout: 900

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
