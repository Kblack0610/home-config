apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: litellm
data:
  config.yaml: |
    # All upstream models served by the single mlx-server on Mac Studio
    # at 192.168.1.4:8090 (managed by ansible/roles/launchd-mlx-server/).
    # Replaces the legacy multi-port layout (8080/8081/8082 chat +
    # 11434 Ollama embedding). Add a new model_list entry here whenever
    # mlx_models in the role's defaults gains an entry; api_base is
    # always 192.168.1.4:8090/v1.
    model_list:
      # Naming: `<category> (<Model-Name>)` — category prefix lets agents
      # route by purpose (code/reasoning/smart/embedding); the parens'd
      # model name shows what's actually serving so we can compare
      # variants when testing. The `model:` field passes the same string
      # through to mlx-server as `served_model_name`.
      - model_name: "code (Qwen3-Coder-Next-4bit)"
        litellm_params:
          model: "openai/code (Qwen3-Coder-Next-4bit)"
          api_base: http://192.168.1.4:8090/v1
          stream: true
          api_key: "mlx"
        model_info:
          supports_function_calling: true

      # Reasoning slot — Qwen3.6 mlx-community quant, thinking model.
      - model_name: "reasoning (Qwen3.6-35B-A3B-4bit)"
        litellm_params:
          model: "openai/reasoning (Qwen3.6-35B-A3B-4bit)"
          api_base: http://192.168.1.4:8090/v1
          stream: true
          api_key: "mlx"
        model_info:
          supports_function_calling: true

      # No vision-input route currently. Original plan exposed
      # GLM-4.6V-Flash-4bit (and briefly Qwen3.6 as multimodal), but
      # mlx-openai-server 1.7.1 + 1.8.0 both hit a `RuntimeError: There
      # is no Stream(gpu, 0) in current thread` bug at mlx_vlm.py:620
      # against any multimodal handler — bug is upstream and worker-
      # thread-related, not model-specific. Re-add a vision route here
      # once the upstream fix lands or we move to mlx_vlm.server /
      # vllm-mlx / omlx as the VLM serving stack.

      # Fast slot — small dense Qwen3 4B Instruct on the Mac Studio,
      # for latency-sensitive workloads where a frontier model is
      # overkill. First consumer: apps/karakeep/ INFERENCE_TEXT_MODEL
      # (bookmark tagging — sub-second response vs ~10s on `code`).
      # Pinned in mlx-server (ansible/roles/launchd-mlx-server/
      # defaults/main.yml).
      - model_name: "fast (Qwen3-4B)"
        litellm_params:
          model: "openai/fast (Qwen3-4B)"
          api_base: http://192.168.1.4:8090/v1
          stream: true
          api_key: "mlx"

      # Embedding model used by apps/mem0/ for memory ingest + retrieval.
      # 768-dim output; mem0 writes vectors into the pgvector store at
      # apps/postgres/.
      #
      # encoding_format pinned to "float" because mlx-openai-server's
      # Pydantic validator rejects null encoding_format (LiteLLM sends
      # null by default; mlx-openai-server expects literal "float" or
      # "base64").
      - model_name: "embedding (modernbert-embed-base-4bit)"
        litellm_params:
          model: "openai/embedding (modernbert-embed-base-4bit)"
          api_base: http://192.168.1.4:8090/v1
          api_key: "mlx"
          encoding_format: "float"
          # Per-model drop_params overrides the global litellm_settings.drop_params
          # for this entry's pre-validation chain. mem0's openai embedder always
          # passes `dimensions` regardless of config; LiteLLM's text-embedding-3
          # validator rejects it before the global drop_params runs.
          # additional_drop_params explicitly drops the `dimensions` field
          # before validation, letting the request reach mlx-openai-server.
          drop_params: true
          additional_drop_params: ["dimensions"]
        model_info:
          mode: embedding

      # Paid upstream routes have been removed for now. The Lazer proxy
      # `premium (...)` models lived here through 2026-04-29; they were
      # cut so the binks.chat model picker only surfaces the local Mac
      # Studio mlx-server fleet. To add OpenRouter (or any other paid
      # provider) back, drop entries below this comment using
      # `cloud (<openrouter-model-id>)` as the model_name and
      # `os.environ/OPENROUTER_API_KEY` as the api_key, with
      # `api_base: https://openrouter.ai/api/v1`.

    router_settings:
      routing_strategy: "simple-shuffle"
      timeout: 900

    litellm_settings:
      drop_params: true
      request_timeout: 900
      # Mounts /metrics on port 4000 (same as the API). LiteLLM's
      # PrometheusLogger emits per-model RPS, latency histograms (p50-p99),
      # error counters, and token counters — all labeled with `model`.
      # Single-worker deployment (replicas: 1, no --num_workers), so no
      # PROMETHEUS_MULTIPROC_DIR setup needed. Scraped by the in-namespace
      # ServiceMonitor in this directory.
      callbacks: ["prometheus"]

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      # Postgres-backed proxy state: virtual keys, per-key/per-model
      # spend tracking, budgets. DATABASE_URL injected via litellm-db-secrets
      # (apps/litellm/secret.sops.yaml). store_model_in_db: false keeps the
      # model_list authoritative in this configmap (git-tracked) — DB only
      # holds keys/spend/budgets. The rescheduler timings are LiteLLM's
      # recommended values for the per-key budget reset background loop.
      database_url: os.environ/DATABASE_URL
      store_model_in_db: false
      proxy_budget_rescheduler_min_time: 597
      proxy_budget_rescheduler_max_time: 605
