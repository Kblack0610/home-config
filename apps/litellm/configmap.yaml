apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: litellm
data:
  config.yaml: |
    # All upstream models served by the single mlx-server on Mac Studio
    # at 192.168.1.4:8090 (managed by ansible/roles/launchd-mlx-server/).
    # Replaces the legacy multi-port layout (8080/8081/8082 chat +
    # 11434 Ollama embedding). Add a new model_list entry here whenever
    # mlx_models in the role's defaults gains an entry; api_base is
    # always 192.168.1.4:8090/v1.
    model_list:
      # Naming convention: `<role> (<Model-Name>)` — role-first.
      #
      # Role is the primary axis (code, reasoning, fast, embedding, vlm,
      # stt, tts, image). Multiple models can share a role; tier (local
      # vs paid) and modality live in `model_info.tags` and
      # `model_info.mode`, NOT in the name. Local + paid entries with
      # the same role sit next to each other for benchmarking; consumers
      # pick the specific model_id when they want a specific tier.
      #
      # `model:` field passes through to upstream — for the Mac Studio
      # mlx-server it's the served_model_name, for Lazer it's the
      # provider's model id with `openai/` prefix.

      # ============================================================
      # Local routes (Mac Studio mlx-server :8090)
      # ============================================================

      - model_name: "code (Qwen3-Coder-Next-4bit)"
        litellm_params:
          model: "openai/code (Qwen3-Coder-Next-4bit)"
          api_base: http://192.168.1.4:8090/v1
          stream: true
          api_key: "mlx"
        model_info:
          mode: chat
          tags: ["local", "mlx"]
          capabilities:
            tools: true
            code: true
            vision: false
            reasoning: false
            json_mode: true
          supports_function_calling: true

      - model_name: "reasoning (Qwen3.6-35B-A3B-4bit)"
        litellm_params:
          model: "openai/reasoning (Qwen3.6-35B-A3B-4bit)"
          api_base: http://192.168.1.4:8090/v1
          stream: true
          api_key: "mlx"
        model_info:
          mode: chat
          tags: ["local", "mlx"]
          capabilities:
            tools: true
            code: true
            vision: false
            reasoning: true
            json_mode: true
          supports_function_calling: true

      # No local vision-input route currently. mlx-openai-server 1.7.1 +
      # 1.8.0 both hit a `RuntimeError: There is no Stream(gpu, 0) in
      # current thread` bug at mlx_vlm.py:620 against any multimodal
      # handler — bug is upstream and worker-thread-related, not
      # model-specific. Local VLM unblocks once we switch serving stack
      # to mlx_vlm.server / vllm-mlx / omlx; until then the paid
      # vlm (gemini-3-flash) entry below covers OpenClaw's image+pdf slots.

      # Fast slot — small dense Qwen3 4B Instruct, latency-sensitive.
      # First consumer: apps/karakeep/ INFERENCE_TEXT_MODEL.
      - model_name: "fast (Qwen3-4B)"
        litellm_params:
          model: "openai/fast (Qwen3-4B)"
          api_base: http://192.168.1.4:8090/v1
          stream: true
          api_key: "mlx"
        model_info:
          mode: chat
          tags: ["local", "mlx"]
          capabilities:
            tools: false
            code: false
            vision: false
            reasoning: false
            json_mode: true

      # Embedding model used by apps/mem0/ for memory ingest + retrieval.
      # 768-dim output; mem0 writes vectors into pgvector at apps/postgres/.
      #
      # encoding_format pinned to "float" because mlx-openai-server's
      # Pydantic validator rejects null encoding_format. drop_params +
      # additional_drop_params strip mem0's `dimensions` field that
      # LiteLLM's text-embedding-3 validator otherwise rejects.
      - model_name: "embedding (modernbert-embed-base-4bit)"
        litellm_params:
          model: "openai/embedding (modernbert-embed-base-4bit)"
          api_base: http://192.168.1.4:8090/v1
          api_key: "mlx"
          encoding_format: "float"
          drop_params: true
          additional_drop_params: ["dimensions"]
        model_info:
          mode: embedding
          tags: ["local", "mlx"]

      # ============================================================
      # Paid routes via Lazer (proxy.lazertechnologies.com)
      # ============================================================
      # Cost-effective picks from Lazer's catalog (2026-04-30). $250/mo
      # budget; per-route max_budget caps sum to ~$100/30d total ceiling
      # under typical usage.
      #
      # Three layers of cost control per entry:
      #   - tpm/rpm:           runaway-loop / stuck-retry caps
      #   - max_budget:        upstream-side absolute ceiling per route
      #   - per-virtual-key:   primary control via /key/generate
      #                        allowed_models. binks-api + mem0 use the
      #                        `local-only` key (no paid access);
      #                        OpenClaw uses `internal-tools` (all-proxy);
      #                        Karakeep gets its own `karakeep` key
      #                        (fast + embedding only).

      # code paid — qwen-3-coder via deepinfra. Cheapest coder option,
      # same family as local Qwen3-Coder-Next so prompts transfer.
      - model_name: "code (qwen-3-coder)"
        litellm_params:
          model: "openai/qwen-3-coder"
          api_base: https://proxy.lazertechnologies.com/v1
          api_key: os.environ/LAZER_API_KEY
          tpm: 200000
          rpm: 120
          max_budget: 30.00
          budget_duration: 30d
        model_info:
          mode: chat
          tags: ["paid", "lazer"]
          capabilities:
            tools: true
            code: true
            vision: false
            reasoning: false
            json_mode: true
          supports_function_calling: true

      # reasoning paid — deepseek-v4-pro via fireworks. Explicit reasoning
      # model with thinking mode.
      - model_name: "reasoning (deepseek-v4-pro)"
        litellm_params:
          model: "openai/deepseek-v4-pro"
          api_base: https://proxy.lazertechnologies.com/v1
          api_key: os.environ/LAZER_API_KEY
          tpm: 100000
          rpm: 60
          max_budget: 30.00
          budget_duration: 30d
        model_info:
          mode: chat
          tags: ["paid", "lazer"]
          capabilities:
            tools: true
            code: true
            vision: false
            reasoning: true
            json_mode: true
          supports_function_calling: true

      # fast paid — gpt-oss-120b via cerebras. Cerebras inference is
      # genuinely fast (sub-second p50). Pairs with local fast (Qwen3-4B).
      - model_name: "fast (gpt-oss-120b)"
        litellm_params:
          model: "openai/gpt-oss-120b"
          api_base: https://proxy.lazertechnologies.com/v1
          api_key: os.environ/LAZER_API_KEY
          tpm: 500000
          rpm: 240
          max_budget: 20.00
          budget_duration: 30d
        model_info:
          mode: chat
          tags: ["paid", "lazer"]
          capabilities:
            tools: true
            code: false
            vision: false
            reasoning: false
            json_mode: true

      # vlm paid — gemini-3-flash. First VLM route in the gateway
      # (no local equivalent until mlx_vlm bug is sorted). Maps to
      # OpenClaw's image + pdf slots. Image-capable, cheap.
      - model_name: "vlm (gemini-3-flash)"
        litellm_params:
          model: "openai/gemini-3-flash"
          api_base: https://proxy.lazertechnologies.com/v1
          api_key: os.environ/LAZER_API_KEY
          tpm: 100000
          rpm: 60
          max_budget: 20.00
          budget_duration: 30d
        model_info:
          mode: chat
          tags: ["paid", "lazer"]
          capabilities:
            tools: true
            code: false
            vision: true
            reasoning: false
            json_mode: true

      # stt paid — whisper-turbo via groq. Free ($0/$0). No active consumer
      # but exposed for future voice-input use cases.
      - model_name: "stt (whisper-turbo)"
        litellm_params:
          model: "openai/whisper-turbo"
          api_base: https://proxy.lazertechnologies.com/v1
          api_key: os.environ/LAZER_API_KEY
          tpm: 1000000
          rpm: 600
        model_info:
          mode: audio_transcription
          tags: ["paid", "lazer", "free"]
          capabilities:
            audio: true

    router_settings:
      routing_strategy: "simple-shuffle"
      timeout: 900

    litellm_settings:
      drop_params: true
      request_timeout: 900
      # Mounts /metrics on port 4000 (same as the API). LiteLLM's
      # PrometheusLogger emits per-model RPS, latency histograms (p50-p99),
      # error counters, and token counters — all labeled with `model`.
      # Single-worker deployment (replicas: 1, no --num_workers), so no
      # PROMETHEUS_MULTIPROC_DIR setup needed. Scraped by the in-namespace
      # ServiceMonitor in this directory.
      callbacks: ["prometheus"]

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      # Postgres-backed proxy state: virtual keys, per-key/per-model
      # spend tracking, budgets. DATABASE_URL injected via litellm-db-secrets
      # (apps/litellm/secret.sops.yaml). store_model_in_db: false keeps the
      # model_list authoritative in this configmap (git-tracked) — DB only
      # holds keys/spend/budgets. The rescheduler timings are LiteLLM's
      # recommended values for the per-key budget reset background loop.
      database_url: os.environ/DATABASE_URL
      store_model_in_db: false
      proxy_budget_rescheduler_min_time: 597
      proxy_budget_rescheduler_max_time: 605
