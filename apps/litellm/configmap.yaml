apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: litellm
data:
  config.yaml: |
    model_list:
      - model_name: mlx-community/Qwen3-Coder-Next-4bit
        litellm_params:
          model: openai/mlx-community/Qwen3-Coder-Next-4bit
          api_base: http://192.168.1.4:8080/v1
          stream: true
          api_key: "mlx"
        model_info:
          supports_function_calling: true

      - model_name: mlx-community/Qwen3-235B-A22B-4bit-DWQ
        litellm_params:
          model: openai/mlx-community/Qwen3-235B-A22B-4bit-DWQ
          api_base: http://192.168.1.4:8081/v1
          stream: true
          api_key: "mlx"
        model_info:
          supports_function_calling: true

      - model_name: mlx-community/DeepSeek-R1-Distill-Qwen-32B-MLX-4Bit
        litellm_params:
          model: openai/mlx-community/DeepSeek-R1-Distill-Qwen-32B-MLX-4Bit
          api_base: http://192.168.1.4:8082/v1
          stream: false
          api_key: "mlx"
        model_info:
          supports_function_calling: true

      # Embedding model used by apps/mem0/ for memory ingest + retrieval.
      # Served by Ollama on Mac Studio at :11434 (default port; the
      # com.ollama.serve LaunchAgent at ~/Library/LaunchAgents/ on
      # mac-studio binds 0.0.0.0:11434). 768-dim output; mem0 writes
      # vectors into the pgvector store at apps/postgres/.
      #
      # Why Ollama and not mlx-openai-server: mlx-community has not
      # converted nomic-embed-text-v1.5 to MLX (only the unrelated
      # nomicai-modernbert-embed-base family exists). When/if mlx-community
      # ships a 768-dim nomic-v1.5 conversion, swap api_base to :8090 and
      # add the model to ansible/roles/launchd-mlx-openai-server/defaults
      # to consolidate.
      - model_name: nomic-embed-text-v1.5
        litellm_params:
          model: openai/nomic-embed-text:v1.5
          api_base: http://192.168.1.4:11434/v1
          api_key: "ollama"
        model_info:
          mode: embedding

    router_settings:
      routing_strategy: "simple-shuffle"
      timeout: 900

    litellm_settings:
      drop_params: true
      request_timeout: 900

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
