apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: litellm
data:
  config.yaml: |
    # All upstream models served by the single mlx-server on Mac Studio
    # at 192.168.1.4:8090 (managed by ansible/roles/launchd-mlx-server/).
    # Replaces the legacy multi-port layout (8080/8081/8082 chat +
    # 11434 Ollama embedding). Add a new model_list entry here whenever
    # mlx_models in the role's defaults gains an entry; api_base is
    # always 192.168.1.4:8090/v1.
    model_list:
      # Naming convention: `<role> (<Model-Name>)` — role-first.
      #
      # Role is the primary axis (code, reasoning, fast, embedding, vlm,
      # stt, tts, image). Multiple models can share a role; tier (local
      # vs paid) and modality live in `model_info.tags` and
      # `model_info.mode`, NOT in the name. Local + paid entries with
      # the same role sit next to each other for benchmarking; consumers
      # pick the specific model_id when they want a specific tier.
      #
      # `model:` field passes through to upstream — for the Mac Studio
      # mlx-server it's the served_model_name, for Lazer it's the
      # provider's model id with `openai/` prefix.

      # ============================================================
      # Local routes (Mac Studio mlx-server :8090)
      # ============================================================

      - model_name: "code (Qwen3-Coder-Next-4bit)"
        litellm_params:
          model: "openai/code (Qwen3-Coder-Next-4bit)"
          api_base: http://192.168.1.4:8090/v1
          stream: true
          api_key: "mlx"
        model_info:
          mode: chat
          tags: ["local", "mlx"]
          capabilities:
            tools: true
            code: true
            vision: false
            reasoning: false
            json_mode: true
          supports_function_calling: true

      - model_name: "reasoning (Qwen3.6-35B-A3B-4bit)"
        litellm_params:
          model: "openai/reasoning (Qwen3.6-35B-A3B-4bit)"
          api_base: http://192.168.1.4:8090/v1
          stream: true
          api_key: "mlx"
        model_info:
          mode: chat
          tags: ["local", "mlx"]
          capabilities:
            tools: true
            code: true
            vision: false
            reasoning: true
            json_mode: true
          supports_function_calling: true

      # No local vision-input route currently. mlx-openai-server 1.7.1 +
      # 1.8.0 both hit a `RuntimeError: There is no Stream(gpu, 0) in
      # current thread` bug at mlx_vlm.py:620 against any multimodal
      # handler — bug is upstream and worker-thread-related, not
      # model-specific. Local VLM unblocks once we switch serving stack
      # to mlx_vlm.server / vllm-mlx / omlx; until then the paid
      # vlm (gemini-3-flash) entry below covers OpenClaw's image+pdf slots.

      # Fast slot — small dense Qwen3 4B Instruct, latency-sensitive.
      # First consumer: apps/karakeep/ INFERENCE_TEXT_MODEL.
      - model_name: "fast (Qwen3-4B)"
        litellm_params:
          model: "openai/fast (Qwen3-4B)"
          api_base: http://192.168.1.4:8090/v1
          stream: true
          api_key: "mlx"
        model_info:
          mode: chat
          tags: ["local", "mlx"]
          capabilities:
            tools: false
            code: false
            vision: false
            reasoning: false
            json_mode: true

      # Embedding model used by apps/mem0/ for memory ingest + retrieval.
      # 768-dim output; mem0 writes vectors into pgvector at apps/postgres/.
      #
      # encoding_format pinned to "float" because mlx-openai-server's
      # Pydantic validator rejects null encoding_format. drop_params +
      # additional_drop_params strip mem0's `dimensions` field that
      # LiteLLM's text-embedding-3 validator otherwise rejects.
      - model_name: "embedding (modernbert-embed-base-4bit)"
        litellm_params:
          model: "openai/embedding (modernbert-embed-base-4bit)"
          api_base: http://192.168.1.4:8090/v1
          api_key: "mlx"
          encoding_format: "float"
          drop_params: true
          additional_drop_params: ["dimensions"]
        model_info:
          mode: embedding
          tags: ["local", "mlx"]

      # ------------------------------------------------------------
      # Dual-tier expansion (2026-07): local MLX candidates that mirror
      # the paid Lazer routes below, so each category can be A/B-tested
      # local-vs-paid through the gateway and switched with one line via
      # `model_group_alias` (router_settings). These map to the on_demand
      # entries in ansible/roles/launchd-mlx-server/defaults/main.yml —
      # first call JIT-loads the model on Mac Studio (expect a cold-load
      # stall). tpm/rpm here are runaway-loop guards only; local has no
      # per-token cost so there is no max_budget.
      # ------------------------------------------------------------

      # fast (8-bit) — tool-reliable A/B for the pinned fast slot. Pinned
      # on the box, so no cold-load. Prefer this over fast (Qwen3-4B) for
      # multi-round tool-calling.
      - model_name: "fast (Qwen3-4B-8bit)"
        litellm_params:
          model: "openai/fast (Qwen3-4B-8bit)"
          api_base: http://192.168.1.4:8090/v1
          stream: true
          api_key: "mlx"
          tpm: 500000
          rpm: 240
        model_info:
          mode: chat
          tags: ["local", "mlx"]
          capabilities:
            tools: true
            code: false
            vision: false
            reasoning: false
            json_mode: true
          supports_function_calling: true

      # code (6-bit) — higher code fidelity than the pinned 4-bit slot.
      # on_demand on the box.
      - model_name: "code (Qwen3-Coder-Next-6bit)"
        litellm_params:
          model: "openai/code (Qwen3-Coder-Next-6bit)"
          api_base: http://192.168.1.4:8090/v1
          stream: true
          api_key: "mlx"
          tpm: 500000
          rpm: 120
        model_info:
          mode: chat
          tags: ["local", "mlx"]
          capabilities:
            tools: true
            code: true
            vision: false
            reasoning: false
            json_mode: true
          supports_function_calling: true

      # code (heavy) — Qwen3-Coder-480B-A35B, strongest turnkey local coder.
      # on_demand ~250 GB cold load; low rpm since each load is expensive.
      - model_name: "code (Qwen3-Coder-480B-A35B-4bit)"
        litellm_params:
          model: "openai/code (Qwen3-Coder-480B-A35B-4bit)"
          api_base: http://192.168.1.4:8090/v1
          stream: true
          api_key: "mlx"
          tpm: 300000
          rpm: 30
        model_info:
          mode: chat
          tags: ["local", "mlx", "heavy"]
          capabilities:
            tools: true
            code: true
            vision: false
            reasoning: false
            json_mode: true
          supports_function_calling: true

      # reasoning (big) — Qwen3.5-397B-A17B, huge jump over the pinned 35B.
      # on_demand ~214 GB cold load.
      - model_name: "reasoning (Qwen3.5-397B-A17B-4bit)"
        litellm_params:
          model: "openai/reasoning (Qwen3.5-397B-A17B-4bit)"
          api_base: http://192.168.1.4:8090/v1
          stream: true
          api_key: "mlx"
          tpm: 300000
          rpm: 30
        model_info:
          mode: chat
          tags: ["local", "mlx", "heavy"]
          capabilities:
            tools: true
            code: true
            vision: false
            reasoning: true
            json_mode: true
          supports_function_calling: true

      # vlm (local) — Qwen3-VL-30B-A3B, the FIRST local vision route.
      # REQUIRES mlx-vlm >= 0.6.5 in the box venv (fixes the Stream(gpu,N)
      # crash) OR the server launched --disable-batching. Verify a real
      # caption before flipping the `vlm` alias off gemini-3-flash.
      - model_name: "vlm (Qwen3-VL-30B-A3B-8bit)"
        litellm_params:
          model: "openai/vlm (Qwen3-VL-30B-A3B-8bit)"
          api_base: http://192.168.1.4:8090/v1
          stream: true
          api_key: "mlx"
          tpm: 200000
          rpm: 60
        model_info:
          mode: chat
          tags: ["local", "mlx"]
          capabilities:
            tools: false
            code: false
            vision: true
            reasoning: false
            json_mode: true

      # embedding (Qwen3) — retrieval upgrade over modernbert. WARNING:
      # native dim is 1024; mem0's pgvector column is vector(768). DO NOT
      # point mem0/karakeep here until this route is CONFIRMED to emit 768
      # dims from the box (Matryoshka truncation) — else inserts fail with
      # a dim mismatch. Left unwired as a test candidate.
      - model_name: "embedding (Qwen3-Embedding-0.6B)"
        litellm_params:
          model: "openai/embedding (Qwen3-Embedding-0.6B)"
          api_base: http://192.168.1.4:8090/v1
          api_key: "mlx"
          encoding_format: "float"
          drop_params: true
          additional_drop_params: ["dimensions"]
        model_info:
          mode: embedding
          tags: ["local", "mlx"]

      # ============================================================
      # Cloud free-tier routes via Google Gemini (native gemini/ provider)
      # ============================================================
      # Added 2026-06 as the fallback tier between Lazer (paid, default for
      # chat) and Mac Studio (local, last resort). Gemini is the only
      # embedding option that is NOT the (frequently-offline) Mac Studio —
      # Lazer's catalog has no embedding model. Free tier; key in
      # secret.sops.yaml (litellm-db-secrets) as GEMINI_API_KEY.

      # fast cloud — gemini-2.0-flash. Chat fallback for the Lazer `fast`
      # route. NOTE: this Gemini key currently has free-tier generateContent
      # quota = 0 (embeddings work, chat does not), so this route 429s until
      # billing/quota is enabled. Kept defined so it activates automatically
      # once quota exists; Lazer remains the working chat default.
      - model_name: "fast (gemini-2.0-flash)"
        litellm_params:
          model: "gemini/gemini-2.0-flash"
          api_key: os.environ/GEMINI_API_KEY
        model_info:
          mode: chat
          tags: ["cloud", "gemini", "free"]
          capabilities:
            tools: true
            code: false
            vision: true
            reasoning: false
            json_mode: true

      # embedding cloud — gemini-embedding-001 forced to 768 dims
      # (output_dimensionality), matching the local modernbert embedder, so
      # it writes into the SAME pgvector column (apps/mem0/, vector(768)) with
      # no table rebuild. Primary embedder while Mac Studio is offline; falls
      # back to local modernbert. (text-embedding-004 is retired.)
      # Native gemini/ provider — honors output_dimensionality so the vector is
      # forced to 768 dims, matching the pgvector column (apps/mem0/,
      # vector(768)). NOTE: the OpenAI-compatible Google endpoint
      # (openai/ + .../v1beta/openai) ignores `dimensions` and returns gemini's
      # default 3072 → "different vector dimensions 768 and 3072" on insert, so
      # it must NOT be used here. `dimensions: 768` maps to outputDimensionality.
      - model_name: "embedding (gemini-001)"
        litellm_params:
          model: "gemini/gemini-embedding-001"
          api_key: os.environ/GEMINI_API_KEY
          dimensions: 768
        model_info:
          mode: embedding
          tags: ["cloud", "gemini", "free"]

      # ============================================================
      # Paid routes via Lazer (proxy.lazertechnologies.com)
      # ============================================================
      # Cost-effective picks from Lazer's catalog (2026-04-30). $250/mo
      # budget; per-route max_budget caps sum to ~$100/30d total ceiling
      # under typical usage.
      #
      # Three layers of cost control per entry:
      #   - tpm/rpm:           runaway-loop / stuck-retry caps
      #   - max_budget:        upstream-side absolute ceiling per route
      #   - per-virtual-key:   primary control via /key/generate
      #                        allowed_models. binks-api + mem0 use the
      #                        `local-only` key (no paid access);
      #                        OpenClaw uses `internal-tools` (all-proxy);
      #                        Karakeep gets its own `karakeep` key
      #                        (fast + embedding only).

      # code paid — qwen-3-coder via deepinfra. Cheapest coder option,
      # same family as local Qwen3-Coder-Next so prompts transfer.
      - model_name: "code (qwen-3-coder)"
        litellm_params:
          model: "openai/qwen-3-coder"
          api_base: https://proxy.lazertechnologies.com/v1
          api_key: os.environ/LAZER_API_KEY
          tpm: 200000
          rpm: 120
          max_budget: 30.00
          budget_duration: 30d
        model_info:
          mode: chat
          tags: ["paid", "lazer"]
          capabilities:
            tools: true
            code: true
            vision: false
            reasoning: false
            json_mode: true
          supports_function_calling: true

      # reasoning paid — deepseek-v4-pro via fireworks. Explicit reasoning
      # model with thinking mode.
      - model_name: "reasoning (deepseek-v4-pro)"
        litellm_params:
          model: "openai/deepseek-v4-pro"
          api_base: https://proxy.lazertechnologies.com/v1
          api_key: os.environ/LAZER_API_KEY
          tpm: 100000
          rpm: 60
          max_budget: 30.00
          budget_duration: 30d
        model_info:
          mode: chat
          tags: ["paid", "lazer"]
          capabilities:
            tools: true
            code: true
            vision: false
            reasoning: true
            json_mode: true
          supports_function_calling: true

      # fast paid — gpt-oss-120b via cerebras. Cerebras inference is
      # genuinely fast (sub-second p50). Pairs with local fast (Qwen3-4B).
      - model_name: "fast (gpt-oss-120b)"
        litellm_params:
          model: "openai/gpt-oss-120b"
          api_base: https://proxy.lazertechnologies.com/v1
          api_key: os.environ/LAZER_API_KEY
          tpm: 500000
          rpm: 240
          max_budget: 20.00
          budget_duration: 30d
        model_info:
          mode: chat
          tags: ["paid", "lazer"]
          capabilities:
            tools: true
            code: false
            vision: false
            reasoning: false
            json_mode: true

      # vlm paid — gemini-3-flash. First VLM route in the gateway
      # (no local equivalent until mlx_vlm bug is sorted). Maps to
      # OpenClaw's image + pdf slots. Image-capable, cheap.
      - model_name: "vlm (gemini-3-flash)"
        litellm_params:
          model: "openai/gemini-3-flash"
          api_base: https://proxy.lazertechnologies.com/v1
          api_key: os.environ/LAZER_API_KEY
          tpm: 100000
          rpm: 60
          max_budget: 20.00
          budget_duration: 30d
        model_info:
          mode: chat
          tags: ["paid", "lazer"]
          capabilities:
            tools: true
            code: false
            vision: true
            reasoning: false
            json_mode: true

      # stt paid — whisper-turbo via groq. Free ($0/$0). No active consumer
      # but exposed for future voice-input use cases.
      - model_name: "stt (whisper-turbo)"
        litellm_params:
          model: "openai/whisper-turbo"
          api_base: https://proxy.lazertechnologies.com/v1
          api_key: os.environ/LAZER_API_KEY
          tpm: 1000000
          rpm: 600
        model_info:
          mode: audio_transcription
          tags: ["paid", "lazer", "free"]
          capabilities:
            audio: true

    router_settings:
      routing_strategy: "simple-shuffle"
      timeout: 900
      # ONE-LINE LOCAL<->PAID TOGGLE per category. A consumer can call the
      # short stable name (e.g. model="code") and LiteLLM resolves it to the
      # concrete route on the right. To flip a category between the local
      # MLX box and the paid Lazer/Gemini tier, change ONLY the target here,
      # commit, and Flux reconciles — no consumer edits. The explicit route
      # names still work directly for side-by-side A/B testing.
      #
      # Defaults point at the WORKING tier: Mac Studio is currently offline
      # (see the note on the embedding fallback below), so these resolve to
      # Lazer/Gemini today. Flip the value to the matching `(... local ...)`
      # route name once the box is verified up per category.
      model_group_alias:
        code: "code (qwen-3-coder)"            # local: "code (Qwen3-Coder-Next-6bit)" / "...480B-A35B-4bit"
        reasoning: "reasoning (deepseek-v4-pro)"  # local: "reasoning (Qwen3.5-397B-A17B-4bit)"
        fast: "fast (gpt-oss-120b)"            # local: "fast (Qwen3-4B-8bit)"
        vlm: "vlm (gemini-3-flash)"            # local: "vlm (Qwen3-VL-30B-A3B-8bit)" (needs mlx-vlm>=0.6.5)
        embedding: "embedding (gemini-001)"    # local: "embedding (modernbert-embed-base-4bit)"
        stt: "stt (whisper-turbo)"
      # Failover chains (LiteLLM tries the listed models in order when the
      # primary errors/times out). mem0 points its LLM at the Lazer `fast`
      # route and its embedder at Gemini; these chains add resilience:
      #   chat:      Lazer fast  -> Gemini flash -> Mac Studio fast
      #   embedding: Gemini 004  -> Mac Studio modernbert
      fallbacks:
        - {"fast (gpt-oss-120b)": ["fast (gemini-2.0-flash)", "fast (Qwen3-4B)"]}
        - {"fast (gemini-2.0-flash)": ["fast (Qwen3-4B)"]}
        # NOTE: no embedding fallback to modernbert — Mac Studio is offline,
        # so falling back to it turns any transient Gemini hiccup into a hard
        # 500 (+30s) and masks the real error. Re-add once Mac Studio is back:
        #   - {"embedding (gemini-001)": ["embedding (modernbert-embed-base-4bit)"]}

    litellm_settings:
      drop_params: true
      request_timeout: 900
      # Callbacks:
      #   prometheus     — per-model metrics on /metrics/ (ServiceMonitor in this dir)
      #   langfuse_otel  — request-level traces to Langfuse at langfuse.kblab.me
      #                    via OTLP/HTTP. Requires LANGFUSE_PUBLIC_KEY,
      #                    LANGFUSE_SECRET_KEY, LANGFUSE_OTEL_HOST in the secret.
      #                    Get pk/sk from https://langfuse.kblab.me/settings/api-keys
      #                    after Langfuse is up. NOTE: LANGFUSE_OTEL_HOST (not
      #                    LANGFUSE_HOST) is the correct env var for this callback.
      callbacks: ["prometheus", "langfuse_otel"]

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      # Postgres-backed proxy state: virtual keys, per-key/per-model
      # spend tracking, budgets. DATABASE_URL injected via litellm-db-secrets
      # (apps/litellm/secret.sops.yaml). store_model_in_db: false keeps the
      # model_list authoritative in this configmap (git-tracked) — DB only
      # holds keys/spend/budgets. The rescheduler timings are LiteLLM's
      # recommended values for the per-key budget reset background loop.
      database_url: os.environ/DATABASE_URL
      store_model_in_db: false
      proxy_budget_rescheduler_min_time: 597
      proxy_budget_rescheduler_max_time: 605
