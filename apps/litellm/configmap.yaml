apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: litellm
data:
  config.yaml: |
    model_list:
      - model_name: code
        litellm_params:
          model: ollama_chat/qwen3-coder:30b
          api_base: http://192.168.1.4:11434
          stream: true

      - model_name: smart
        litellm_params:
          model: ollama_chat/llama3.1:70b
          api_base: http://192.168.1.4:11434

      - model_name: fast
        litellm_params:
          model: ollama_chat/llama3.1:8b
          api_base: http://192.168.1.4:11434

      - model_name: reasoning
        litellm_params:
          model: ollama_chat/deepseek-r1:70b
          api_base: http://192.168.1.4:11434

    router_settings:
      routing_strategy: "simple-shuffle"
      timeout: 600

    litellm_settings:
      drop_params: true
      request_timeout: 600

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
