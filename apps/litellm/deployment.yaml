apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: litellm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.96.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          args:
            - "--config"
            - "/etc/litellm/config.yaml"
            - "--port"
            - "4000"
          ports:
            - name: http
              containerPort: 4000
          env:
            # Force the /v1/messages (Anthropic) endpoint to translate to the
            # upstream /chat/completions for OpenAI-provider models, instead of
            # the OpenAI Responses API. Required so Claude Code (which only
            # speaks /v1/messages) can reach the Lazer-backed claude-* routes:
            # Lazer is OpenAI-only with no Responses API, so the default path
            # hits a nonexistent upstream URL and 404s. See
            # litellm.use_chat_completions_url_for_anthropic_messages.
            - name: LITELLM_USE_CHAT_COMPLETIONS_URL_FOR_ANTHROPIC_MESSAGES
              value: "true"
          envFrom:
            # litellm-secrets is bootstrapped out-of-band (not in git) and
            # holds LITELLM_MASTER_KEY. litellm-db-secrets is SOPS-managed
            # via secret.sops.yaml in this directory and holds DATABASE_URL,
            # LITELLM_SALT_KEY, UI_USERNAME/PASSWORD, LAZER_API_KEY,
            # STORE_MODEL_IN_DB. Both are merged into the container env.
            - secretRef:
                name: litellm-secrets
            - secretRef:
                name: litellm-db-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/litellm/config.yaml
              subPath: config.yaml
            - name: data
              mountPath: /app/data
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
          resources:
            requests:
              memory: "768Mi"
              cpu: "100m"
            limits:
              # Postgres-backed mode adds the Prisma client, spend-tracker
              # background loop, and budget rescheduler — all materially
              # heavier than the sqlite path. 1Gi was OOMKilled on first
              # boot post-DB-wire (exit 137 within ~45s of startup).
              memory: "2Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: litellm-config
        - name: data
          persistentVolumeClaim:
            claimName: litellm-data
        - name: localtime
          hostPath:
            path: /etc/localtime
