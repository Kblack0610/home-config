apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-gateway

resources:
  - namespace.yaml
  - secret.sops.yaml
  - litellm-secrets.sops.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - ingress-metrics-deny.yaml
  - servicemonitor.yaml
  - backup-cronjob.yaml
  - backup-nas-secret.yaml

# Generated so the name carries a content hash: LiteLLM reads its config only at
# startup, and a plain ConfigMap edit never restarted the pod, so route changes
# went live whenever the pod happened to restart. The hash rolls it on every edit.
configMapGenerator:
  - name: litellm-config
    files:
      - config.yaml
    options:
      labels:
        app.kubernetes.io/name: litellm
