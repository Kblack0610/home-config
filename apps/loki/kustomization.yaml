apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deploys into the existing (Helm-created) monitoring namespace so the Grafana
# Loki datasource (http://loki:3100) resolves without any datasource change.
namespace: monitoring

resources:
  - configmap.yaml
  - pvc.yaml
  - service.yaml
  - deployment.yaml
