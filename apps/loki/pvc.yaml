apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: monitoring
  labels:
    app.kubernetes.io/name: loki
spec:
  accessModes:
    - ReadWriteOnce
  # Single local-path volume — NOT backed up (same caveat as minio). Acceptable
  # for logs: 14d retention, regenerated continuously by Alloy.
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
