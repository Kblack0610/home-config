apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data-nvme
  namespace: monitoring
  labels:
    app.kubernetes.io/name: loki
spec:
  accessModes:
    - ReadWriteOnce
  # local-path binds where the first pod lands; the deployment pins asus-laptop
  # (root NVMe, 927 GB free on 2026-10-29). Not backed up: logs are regenerated
  # continuously, and a year of them is a convenience, not a record.
  storageClassName: local-path
  resources:
    requests:
      storage: 150Gi
---
# The old 14d volume on hp-victus. Kept only until its chunks are copied into
# loki-data-nvme; delete this document after that, and Flux prunes it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: monitoring
  labels:
    app.kubernetes.io/name: loki
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
