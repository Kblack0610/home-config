# mem0 CLIENT credentials — NOT a Kubernetes manifest, NOT deployed (absent from
# kustomization.yaml). This is the credential store for *callers* of mem0 once
# AUTH_DISABLED=false: the mem0-ops skill and agentctl-nightly-sync decrypt this
# at runtime. Kept out of the pod env (which envFrom would inject) on purpose.
#
# Auth model (mem0-api-server): the durable bearer credential is an API key minted
# via POST /api-keys, sent in the **X-API-Key** header (NOT Authorization: Bearer).
# ADMIN_API_KEY/JWT_SECRET in secret.yaml are server-side bootstrap material, not
# the request credential. The admin login below is for the dashboard at
# https://mem0.kblab.me and for re-minting keys.
#
# Decrypt: sops -d apps/mem0/client-credentials.secret.yaml
# Re-mint a key: login (email/password) -> POST /api-keys {"label":"..."} -> .key
