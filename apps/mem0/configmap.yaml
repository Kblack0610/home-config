apiVersion: v1
kind: ConfigMap
metadata:
  name: mem0-config
  namespace: memory
  labels:
    app.kubernetes.io/name: mem0
data:
  # mem0-api-server is env-var driven (no YAML config file). Non-secret
  # values live here; secrets live in `mem0-secrets`. The deployment uses
  # `envFrom: configMapRef + secretRef` so both are merged into the pod
  # env at startup.

  # --- Postgres ---
  # Vector store + app metadata both live on the shared cluster Postgres
  # at apps/postgres/. POSTGRES_DB is the pgvector database; APP_DB_NAME
  # is the SQLAlchemy alembic-managed app metadata DB.
  POSTGRES_HOST: postgres.databases.svc.cluster.local
  POSTGRES_PORT: "5432"
  POSTGRES_DB: mem0
  POSTGRES_USER: mem0
  POSTGRES_COLLECTION_NAME: mem0_memories
  APP_DB_NAME: mem0_app

  # --- LLM + embedder routing ---
  # mem0-api-server uses the openai SDK; setting OPENAI_BASE_URL routes
  # all chat + embedding calls through the in-cluster LiteLLM gateway,
  # which fronts the local MLX models on Mac Studio. No third-party API
  # keys leave the cluster. The model names here MUST match entries in
  # apps/litellm/configmap.yaml (model_name field).
  OPENAI_BASE_URL: http://litellm.ai-gateway.svc.cluster.local:4000/v1
  # LLM = Lazer `fast` (default); LiteLLM router falls back to Gemini flash
  # then Mac Studio. Embedder = Gemini text-embedding-004 (768-dim, matches
  # the pgvector column) since Lazer has no embedder and Mac Studio is often
  # offline; falls back to local modernbert. Fallback chains live in
  # apps/litellm/configmap.yaml router_settings.fallbacks.
  MEM0_DEFAULT_LLM_MODEL: "fast (gpt-oss-120b)"
  MEM0_DEFAULT_EMBEDDER_MODEL: "embedding (gemini-001)"

  # --- Auth ---
  # App-layer auth is ON: every request must carry an API key in the `X-API-Key`
  # header (minted via POST /api-keys; stored in client-credentials.secret.yaml).
  # NOTE: it is NOT "ADMIN_API_KEY as bearer" — ADMIN_API_KEY/JWT_SECRET are
  # server-side bootstrap material; the request credential is the m0sk_ key. See
  # README "Auth model + admin bootstrap". This is the SECOND of two independent
  # layers guarding the public host mem0.kennethblack.me (the first is Cloudflare
  # Access at the edge — see ingress-public.yaml). Global server flag, so it also
  # gates the LAN host mem0.kblab.me.
  #
  # ROLLOUT ORDER (single global flag — flipping this breaks any caller not yet
  # sending the header): land caller updates FIRST (mem0-ops skill, agentctl
  # nightly-sync — sending a bearer token while auth is still disabled is harmless),
  # THEN push this flip. See README.md "Rollout order".
  AUTH_DISABLED: "false"

  # --- Misc ---
  DASHBOARD_URL: https://mem0.kblab.me
  HISTORY_DB_PATH: /app/history/history.db
  MEM0_TELEMETRY: "false"
  REQUEST_LOG_RETENTION_DAYS: "30"
