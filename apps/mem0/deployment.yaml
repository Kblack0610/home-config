apiVersion: apps/v1
kind: Deployment
metadata:
  name: mem0
  namespace: memory
  labels:
    app.kubernetes.io/name: mem0
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mem0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mem0
    spec:
      # Image is built from upstream mem0ai/mem0/server/ on amd64 and
      # pushed to the in-cluster Forgejo registry. See:
      #   apps/mem0/README.md "Rebuilding the image" for the bump
      #   procedure.
      # amd64-only image. Enforce arch so the scheduler can't place the pod
      # on an arm64 node now that it's no longer pinned by a node-local PVC.
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: forgejo-registry
      # Run alembic migrations against APP_DB_NAME before the API server
      # starts. Mirrors the upstream dev compose pattern (which prepends
      # `alembic upgrade head` to the uvicorn command). Init container
      # uses the same image so it has the same alembic env + migrations
      # baked in.
      initContainers:
        - name: alembic-upgrade
          image: git.kblab.me/kblack0610/mem0-server:ece7ff6-libpq
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: mem0-config
            - secretRef:
                name: mem0-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      containers:
        - name: mem0
          image: git.kblab.me/kblack0610/mem0-server:ece7ff6-libpq
          imagePullPolicy: IfNotPresent
          # Patch upstream mem0 v2.0.1 pgvector ranking bug before launching
          # uvicorn. pgvector.search() returns cosine distance as `score`,
          # but score_and_rank() treats `score` as similarity (sorts
          # reverse=True), so the LEAST-similar memories rank first. Convert
          # distance→similarity (`1.0 - r[1]`). Same fix the TypeScript SDK
          # already received in upstream PR #4944; Python equivalent is
          # open as PR #4994. Drop this command override + restore the
          # image's default CMD once #4994 lands and we bump the image tag.
          # The sed range `/ORDER BY distance/,/return \[OutputData/` scopes
          # the substitution to search() only, leaving keyword_search()'s
          # ts_rank score (already-similarity) untouched. The grep gate
          # fails the container if the patch silently misses (e.g., upstream
          # rewrote the line) instead of running with broken ranking.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              F=/usr/local/lib/python3.12/site-packages/mem0/vector_stores/pgvector.py
              sed -i '/ORDER BY distance/,/return \[OutputData/{s/score=float(r\[1\])/score=float(1.0 - r[1])/}' "$F"
              grep -q 'score=float(1.0 - r\[1\])' "$F" || { echo "ERROR: mem0 pgvector rank-fix patch did not apply — upstream may have changed pgvector.py" >&2; exit 1; }
              echo "mem0 pgvector rank-fix patch applied"
              exec uvicorn main:app --host 0.0.0.0 --port 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: mem0-config
            - secretRef:
                name: mem0-secrets
          volumeMounts:
            - name: history
              mountPath: /app/history
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          # FastAPI's auto /docs returns 200 once uvicorn is up — that's
          # what upstream's `make health` uses too.
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        # history.db is mem0's disposable change-audit log. The actual memories
        # live in the shared cluster Postgres (see configmap POSTGRES_*), so this
        # volume holds nothing that must survive a restart. emptyDir keeps the pod
        # un-pinned: a node death just reschedules it. (Was a local-path PVC
        # pinned to one node, which stranded mem0 when thinkcentre died 2026-06.)
        - name: history
          emptyDir: {}
        - name: localtime
          hostPath:
            path: /etc/localtime
