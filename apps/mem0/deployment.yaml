apiVersion: apps/v1
kind: Deployment
metadata:
  name: mem0
  namespace: memory
  labels:
    app.kubernetes.io/name: mem0
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mem0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mem0
    spec:
      # mem0/mem0-api-server:latest publishes only an arm64 manifest as
      # of 2026-04, so this deployment is pinned to an arm64 node. The
      # Pi 5s have plenty of headroom for a Python REST app — actual LLM
      # inference happens on Mac Studio via LiteLLM, mem0 just orchestrates
      # REST + Postgres calls. If/when upstream ships a multi-arch image,
      # drop this nodeSelector.
      nodeSelector:
        kubernetes.io/arch: arm64
      # Run alembic migrations against APP_DB_NAME before the API server
      # starts. Mirrors the upstream dev compose pattern (which prepends
      # `alembic upgrade head` to the uvicorn command). Init container
      # uses the same image so it has the same alembic env + migrations
      # baked in.
      initContainers:
        - name: alembic-upgrade
          image: mem0/mem0-api-server:latest
          imagePullPolicy: IfNotPresent
          workingDir: /app
          # `python -m alembic` rather than `alembic` because the published
          # image doesn't expose the alembic CLI script in $PATH (image is
          # ~90MB, scripts/console_entry_points were stripped). The Python
          # package is installed and importable.
          command: ["python", "-m", "alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: mem0-config
            - secretRef:
                name: mem0-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      containers:
        - name: mem0
          image: mem0/mem0-api-server:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: mem0-config
            - secretRef:
                name: mem0-secrets
          volumeMounts:
            - name: history
              mountPath: /app/history
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          # mem0-api-server doesn't ship a dedicated /health endpoint;
          # `/docs` (FastAPI auto-docs) is what upstream's `make health`
          # uses as a liveness signal. Returns 200 once uvicorn is up.
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: history
          persistentVolumeClaim:
            claimName: mem0-history
        - name: localtime
          hostPath:
            path: /etc/localtime
