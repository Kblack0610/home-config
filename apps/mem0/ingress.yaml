apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mem0
  namespace: memory
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-dns
    # LAN/VPN-only — same middleware used by openclaw, comfyui, neptune.
    # Restricts source IPs to RFC1918 ranges (10/8, 172.16/12, 192.168/16).
    # Tailscale tailnet hits via the LAN-side route, so this also covers
    # tailnet devices that have a LAN-routable address.
    traefik.ingress.kubernetes.io/router.middlewares: monitoring-local-network-only@kubernetescrd
spec:
  rules:
    - host: mem0.kblab.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mem0
                port:
                  number: 8000
  tls:
    - hosts:
        - mem0.kblab.me
      secretName: mem0-tls
