apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microbin
  namespace: microbin
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-dns
    # Tailscale tailnet hits via LAN-side route, so this also covers
    # tailnet devices including phones running Tailscale always-on.
    traefik.ingress.kubernetes.io/router.middlewares: monitoring-local-network-only@kubernetescrd
spec:
  rules:
    - host: scratch.kblab.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: microbin
                port:
                  number: 80
  tls:
    - hosts:
        - scratch.kblab.me
      secretName: microbin-tls
