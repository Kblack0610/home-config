apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: grafana-dashboard-k8s-views-global
    files:
      - k8s-views-global.json
  - name: grafana-dashboard-k8s-views-namespaces
    files:
      - k8s-views-namespaces.json
  - name: grafana-dashboard-k8s-views-nodes
    files:
      - k8s-views-nodes.json
  - name: grafana-dashboard-k8s-views-pods
    files:
      - k8s-views-pods.json
  - name: grafana-dashboard-homelab-all-devices
    files:
      - homelab-all-devices.json
  - name: grafana-dashboard-iot-fleet-devices
    files:
      - iot-fleet-devices.json
