# SMART disk health from every bare-metal Linux host. prometheus-smartctl-exporter runs as
# a systemd unit on each one (ansible role disk-health) on port 9633. Add a host here when
# it joins that play. Out of scope: Pi SD cards (no SMART), the 8TB USB drive (its bridge
# blocks SMART), mac-mini and the Windows boxes (no exporter yet).
apiVersion: v1
kind: Service
metadata:
  name: smartctl-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: smartctl-exporter
    app.kubernetes.io/part-of: monitoring
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: metrics
      port: 9633
      targetPort: 9633
---
apiVersion: v1
kind: Endpoints
metadata:
  name: smartctl-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: smartctl-exporter
subsets:
  - addresses:
      - ip: 192.168.1.152
        hostname: asus-laptop
      - ip: 192.168.1.243
        hostname: hp-victus
      - ip: 192.168.1.26
        hostname: razer-laptop
      - ip: 192.168.1.28
        hostname: ms-a2
      - ip: 192.168.1.19
        hostname: deskslim-1
      - ip: 192.168.1.29
        hostname: deskslim-2
      - ip: 192.168.1.2
        hostname: workstation
    ports:
      - name: metrics
        port: 9633
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: smartctl-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: smartctl-exporter
spec:
  endpoints:
    - port: metrics
      interval: 60s
      scrapeTimeout: 30s
      relabelings:
        # `host` = the address's hostname above (the inventory name), as in
        # external-standalone-nodes.yaml, so alerts and the dashboard name the machine.
        - sourceLabels: [__meta_kubernetes_endpoint_hostname]
          regex: (.+)
          targetLabel: host
  selector:
    matchLabels:
      app.kubernetes.io/name: smartctl-exporter
  namespaceSelector:
    matchNames:
      - monitoring
