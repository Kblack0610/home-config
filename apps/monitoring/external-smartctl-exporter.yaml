# SMART disk health metrics from the NAS host (asus-laptop)
# smartctl_exporter runs as a systemd unit on the NAS, exposing metrics on port 9633
apiVersion: v1
kind: Service
metadata:
  name: smartctl-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: smartctl-exporter
    app.kubernetes.io/part-of: monitoring
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: metrics
      port: 9633
      targetPort: 9633
---
apiVersion: v1
kind: Endpoints
metadata:
  name: smartctl-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: smartctl-exporter
subsets:
  - addresses:
      - ip: 192.168.1.152
    ports:
      - name: metrics
        port: 9633
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: smartctl-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: smartctl-exporter
spec:
  endpoints:
    - port: metrics
      interval: 60s
      scrapeTimeout: 30s
  selector:
    matchLabels:
      app.kubernetes.io/name: smartctl-exporter
  namespaceSelector:
    matchNames:
      - monitoring
