# Standalone devices monitored via node_exporter (port 9100)
# These are not K8s nodes — they run Docker Compose workloads
# Pi3 AdGuard (192.168.1.193): Network-wide DNS + ad-blocking
# audio-living (192.168.1.120) + audio-bedroom (192.168.1.122): Snapcast rooms,
#   node_exporter from the node-exporter-linux ansible role
# razer-laptop left this list on 2026-10-26 when it joined k3s: the cluster's
#   node-exporter DaemonSet scrapes it now, like hp-victus and asus-laptop.

apiVersion: v1
kind: Service
metadata:
  name: standalone-nodes
  namespace: monitoring
  labels:
    app.kubernetes.io/name: standalone-nodes
    app.kubernetes.io/part-of: monitoring
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
---
apiVersion: v1
kind: Endpoints
metadata:
  name: standalone-nodes
  namespace: monitoring
  labels:
    app.kubernetes.io/name: standalone-nodes
subsets:
  - addresses:
      - ip: 192.168.1.193
        hostname: pi3-adguard
      - ip: 192.168.1.120
        hostname: audio-living
      - ip: 192.168.1.122
        hostname: audio-bedroom
    ports:
      - name: metrics
        port: 9100
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: standalone-nodes
  namespace: monitoring
  labels:
    app.kubernetes.io/name: standalone-nodes
spec:
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        # `host` = the address's hostname below (the inventory name), so cc:host_* can
        # name this machine the way the runner exporter and the fleet roster do.
        - sourceLabels: [__meta_kubernetes_endpoint_hostname]
          regex: (.+)
          targetLabel: host
  selector:
    matchLabels:
      app.kubernetes.io/name: standalone-nodes
  namespaceSelector:
    matchNames:
      - monitoring
