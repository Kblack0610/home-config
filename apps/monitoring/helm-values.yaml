# kube-prometheus-stack Helm values
#
# This release is managed by plain Helm (NOT Flux). To apply changes:
#   helm upgrade kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     -n monitoring --version 80.4.1 -f apps/monitoring/helm-values.yaml
#
# Keep this file in sync with what's actually deployed. Changes here do NOT
# auto-apply via Flux.
additionalPrometheusRulesMap:
  rule-name:
    groups:
      - name: node-alerts
        rules:
          - alert: HighNodeCPU
            annotations:
              description: CPU usage is above 80% for more than 5 minutes
              summary: High CPU usage on {{ $labels.instance }}
            expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
            for: 5m
            labels:
              severity: warning
          - alert: HighNodeMemory
            annotations:
              description: Memory usage is above 85% for more than 5 minutes
              summary: High memory usage on {{ $labels.instance }}
            expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
            for: 5m
            labels:
              severity: warning
          - alert: NodeDiskSpaceLow
            annotations:
              description: Disk usage is above 85%
              summary: Disk space low on {{ $labels.instance }}
            expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) * 100 > 85
            for: 5m
            labels:
              severity: warning

alertmanager:
  enabled: true
  # Inline receiver/route config (was: none — Alertmanager had a default null
  # route and alerts went NOWHERE, which is why the thinkcentre outage paged no
  # one). Routes all firing alerts to the in-cluster ntfy as a webhook.
  #
  # Inline here (not a kind: AlertmanagerConfig CRD) on purpose: the operator's
  # alertmanagerConfigMatcherStrategy injects an enforced namespace= matcher into
  # CRD routes, so a cluster-wide NodeDown alert for a Mac/external target (no
  # namespace label) would silently never match. A root-route inline config has
  # no such matcher. This file is plain-Helm — apply with the `helm upgrade` in
  # the header above; the receiver config still lives in git.
  #
  # ntfy needs no auth (auth-default-access: read-write, LAN-only). Subscribe a
  # phone to the `homelab-alerts` topic at https://ntfy.kblab.me/homelab-alerts
  # with Minimum priority High: criticals arrive at 5 (red), the rest at 3 and
  # stay silent in the app list. Topic map: apps/ntfy/README.md.
  #
  # ntfy renders the Alertmanager JSON into a title and one line per alert
  # (message templating, `tpl=yes`). Without it every page was the raw webhook
  # JSON. The templates ride in the URL query because prometheus-operator
  # v0.87 rejects webhook `http_headers` (amtool accepts them, the operator
  # does not, and it then keeps serving the previous config). Decoded:
  #   t = {{if eq .status "resolved"}}Resolved{{else}}Firing{{end}}: {{.commonLabels.alertname}}
  #   m = {{range .alerts}}{{if eq .status "resolved"}}OK: {{end}}{{or .annotations.summary .labels.alertname}}<newline>{{end}}{{if .truncatedAlerts}}+{{.truncatedAlerts}} more{{end}}
  # ntfy cannot template the priority (`p`), so the two levels are two receivers.
  # max_alerts caps a group at 10 alerts per request: ntfy answers 413 "JSON
  # body too large" to a templated body over its limit, and Alertmanager then
  # drops the page (109 Trivy HomelabCriticalVulnerability alerts did). The
  # rest arrive as truncatedAlerts, printed as "+N more".
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: ntfy
      group_by: [alertname, instance]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # Watchdog is an always-firing heartbeat — never page on it.
        - matchers: [alertname = "Watchdog"]
          receiver: "null"
        # InfoInhibitor exists only to inhibit info alerts; it fires whenever
        # any info alert does and is never meant to be delivered.
        - matchers: [alertname = "InfoInhibitor"]
          receiver: "null"
        # Criticals (e.g. NodeDown) page red and remind hourly until resolved.
        - matchers: [severity = "critical"]
          receiver: ntfy-critical
          repeat_interval: 1h
    receivers:
      - name: "null"
      - name: ntfy
        webhook_configs:
          - url: "http://ntfy.ntfy.svc.cluster.local/homelab-alerts?tpl=yes&t=%7B%7Bif%20eq%20.status%20%22resolved%22%7D%7DResolved%7B%7Belse%7D%7DFiring%7B%7Bend%7D%7D%3A%20%7B%7B.commonLabels.alertname%7D%7D&m=%7B%7Brange%20.alerts%7D%7D%7B%7Bif%20eq%20.status%20%22resolved%22%7D%7DOK%3A%20%7B%7Bend%7D%7D%7B%7Bor%20.annotations.summary%20.labels.alertname%7D%7D%0A%7B%7Bend%7D%7D%7B%7Bif%20.truncatedAlerts%7D%7D%2B%7B%7B.truncatedAlerts%7D%7D%20more%7B%7Bend%7D%7D&p=default"
            send_resolved: true
            max_alerts: 10
      - name: ntfy-critical
        webhook_configs:
          - url: "http://ntfy.ntfy.svc.cluster.local/homelab-alerts?tpl=yes&t=%7B%7Bif%20eq%20.status%20%22resolved%22%7D%7DResolved%7B%7Belse%7D%7DFiring%7B%7Bend%7D%7D%3A%20%7B%7B.commonLabels.alertname%7D%7D&m=%7B%7Brange%20.alerts%7D%7D%7B%7Bif%20eq%20.status%20%22resolved%22%7D%7DOK%3A%20%7B%7Bend%7D%7D%7B%7Bor%20.annotations.summary%20.labels.alertname%7D%7D%0A%7B%7Bend%7D%7D%7B%7Bif%20.truncatedAlerts%7D%7D%2B%7B%7B.truncatedAlerts%7D%7D%20more%7B%7Bend%7D%7D&p=max&ta=rotating_light"
            send_resolved: true
            max_alerts: 10
    inhibit_rules:
      - source_matchers: [severity = "critical"]
        target_matchers: [severity = "warning"]
        equal: [alertname, instance]
  alertmanagerSpec:
    nodeSelector:
      kubernetes.io/arch: amd64
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
          storageClassName: local-path
  service:
    nodePort: 30093
    type: NodePort

coreDns:
  enabled: true
  service:
    selector:
      k8s-app: kube-dns

defaultRules:
  create: true
  rules:
    alertmanager: true
    configReloaders: true
    general: true
    k8s: true
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubeScheduler: false
    kubeStateMetrics: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

grafana:
  enabled: true
  # First-boot value only. Grafana keeps the admin password in its own DB after
  # that, so this is NOT the current password: the real one is the vault entry
  # `grafana.kblab.me` (reset 2026-10-06). Kept as the break-glass login for when
  # Forgejo, the normal sign-in below, is down.
  adminPassword: admin
  # Sign in with Forgejo (same pattern as agent-web). The OAuth app is
  # `grafana.kblab.me` (id 5) under kblack0610 on Forgejo; its client id and
  # secret come from the SOPS secret apps/monitoring/grafana-forgejo-oauth-secret.yaml
  # as GF_AUTH_GENERIC_OAUTH_CLIENT_ID / _SECRET, which Grafana reads natively.
  envFromSecret: grafana-forgejo-oauth
  # Read by the Langfuse datasource's secureJsonData below.
  envValueFrom:
    LANGFUSE_CH_PASSWORD:
      secretKeyRef:
        name: grafana-clickhouse-reader
        key: password
  grafana.ini:
    # The Command Center is the landing page. The dashboards sidecar writes every
    # grafana_dashboard ConfigMap into /tmp/dashboards/<file>.
    dashboards:
      default_home_dashboard_path: /tmp/dashboards/command-center.json
    server:
      # Without it Grafana builds the OAuth redirect from localhost:3000.
      root_url: https://grafana.kblab.me
    # Installed at startup, before provisioning, so the Langfuse datasource
    # below finds its type. Pinned: a plugin bump is a deliberate change.
    plugins:
      preinstall_sync: grafana-clickhouse-datasource@4.22.1
    auth.generic_oauth:
      enabled: true
      name: Forgejo
      icon: signin
      allow_sign_up: true
      scopes: openid email profile
      use_pkce: true
      # The browser goes to Forgejo's ROOT_URL host; the token and userinfo
      # calls are server-side, so they use the in-cluster service and skip
      # Cloudflare.
      auth_url: https://git.kennethblack.me/login/oauth/authorize
      token_url: http://forgejo-http.forgejo.svc:3000/login/oauth/access_token
      api_url: http://forgejo-http.forgejo.svc:3000/login/oauth/userinfo
      login_attribute_path: preferred_username
      name_attribute_path: name
      email_attribute_path: email
      # Only kblack0610 gets in (as Grafana server admin); any other Forgejo
      # account is refused at login rather than given a Viewer seat.
      role_attribute_path: "preferred_username == 'kblack0610' && 'GrafanaAdmin' || 'None'"
      role_attribute_strict: true
      allow_assign_grafana_admin: true
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: America/Los_Angeles
  initChownData:
    enabled: false
  nodeSelector:
    kubernetes.io/arch: amd64
  persistence:
    enabled: true
    size: 2Gi
    storageClassName: local-path
  additionalDataSources:
    - access: proxy
      isDefault: false
      name: Loki
      type: loki
      url: http://loki:3100
    # Same PromQL as Prometheus, 2y deep. Pick it for ranges past 7d; the uid is
    # what the generated Agents dashboards pin.
    - access: proxy
      isDefault: false
      name: VictoriaMetrics (long)
      uid: victoriametrics
      type: prometheus
      url: http://victoria-metrics.monitoring.svc:8428
      jsonData:
        timeInterval: 30s
    # Langfuse's own ClickHouse, read-only (user grafana_reader, defined in
    # apps/langfuse/clickhouse/grafana-reader.xml). Langfuse v4 writes spans to
    # default.events_core; traces/observations stopped on 2026-10-29.
    - name: Langfuse (ClickHouse)
      uid: langfuse-clickhouse
      type: grafana-clickhouse-datasource
      access: proxy
      isDefault: false
      jsonData:
        host: langfuse-ch.langfuse.svc.cluster.local
        port: 8123
        protocol: http
        username: grafana_reader
        defaultDatabase: default
        # Sent as max_execution_time; the reader profile caps it at 60.
        queryTimeout: "60"
      secureJsonData:
        password: $LANGFUSE_CH_PASSWORD
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    nodePort: 30300
    type: NodePort
  # Sidecars watch all configmaps/secrets cluster-wide; 256Mi was not enough
  # and both containers were OOMKilled ~1,700 times each before the bump.
  sidecar:
    resources:
      limits:
        cpu: 50m
        memory: 512Mi
      requests:
        cpu: 5m
        memory: 128Mi
    dashboards:
      resources:
        limits:
          cpu: 50m
          memory: 512Mi
        requests:
          cpu: 5m
          memory: 128Mi
    datasources:
      # Sync once in an init container before Grafana starts. The watcher alone
      # needs about 2 minutes for its first cluster-wide list and skips the
      # reload after it (REQ_SKIP_INIT), so a new datasource never appeared
      # until someone called the reload API by hand (2026-10-29).
      initDatasources: true
      resources:
        limits:
          cpu: 50m
          memory: 512Mi
        requests:
          cpu: 5m
          memory: 128Mi

kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false

kubeStateMetrics:
  enabled: true
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

nodeExporter:
  enabled: true
  resources:
    limits:
      cpu: 200m
      memory: 64Mi
    requests:
      cpu: 50m
      memory: 32Mi

prometheus:
  enabled: true
  prometheusSpec:
    # Allow Alloy (and any other OTLP bridge) to push metrics via remote-write.
    # Required for the Claude Code OTel pipeline (Phase 2 observability).
    enableRemoteWriteReceiver: true
    evaluationInterval: 30s
    nodeSelector:
      kubernetes.io/arch: amd64
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    scrapeInterval: 30s
    retention: 7d
    retentionSize: 5GB
    # Long-term copy: 7d stays hot here, everything goes to VictoriaMetrics on
    # asus-laptop (apps/victoria-metrics, 2y). The drop list is control-plane
    # histogram buckets - about 70k of the 238k head series on 2026-10-29 - that
    # only matter for live debugging, which the 7d here still covers.
    remoteWrite:
      - name: victoria-metrics
        url: http://victoria-metrics.monitoring.svc:8428/api/v1/write
        writeRelabelConfigs:
          - sourceLabels: [__name__]
            regex: (apiserver|etcd|workqueue|rest_client|kubelet_runtime_operations)_.*_bucket|apiserver_request_sli_.*
            action: drop
    # 1Gi OOMKilled it at the 2-hourly head compaction (peak 1015Mi with
    # ~225k head series, 35 restarts by 2026-10-27, all at odd hours :00 UTC).
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 200m
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
          storageClassName: local-path
  service:
    nodePort: 30090
    type: NodePort

# NOTE: The previous release had `prometheus-node-exporter.extraArgs: ["" ]`
# which caused the node-exporter pod on raspberrypi (control-plane) to crash
# 2,456 times with "unexpected , try --help". Always supply real flags — never
# an empty string.
#
# --collector.systemd exposes node_systemd_unit_state for bare-metal service
# visibility (e.g. actions.runner.*.service on the platform CI runner hosts). The collector
# opens /var/run/dbus/system_bus_socket on the host — the chart does NOT mount
# this by default, so we add it explicitly via extraHostVolumeMounts below.
prometheus-node-exporter:
  extraArgs:
    - --collector.systemd
    - --collector.systemd.unit-include=^(actions\.runner\..*|docker|kubelet|node_exporter|sshd|forgejo-runner)\.service$
  extraHostVolumeMounts:
    - name: dbus-socket
      hostPath: /run/dbus/system_bus_socket
      mountPath: /var/run/dbus/system_bus_socket
      readOnly: true

prometheusOperator:
  resources:
    limits:
      cpu: 400m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
