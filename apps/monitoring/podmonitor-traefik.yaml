# Scrapes Traefik's own metrics (the k3s chart serves them on the `metrics`
# port, :9100). Per-service request counts by status code are the only record
# of auth failures on a backend: LiteLLM's metric misses invalid-key 401s
# (LiteLLMAuthFailureSpike in prometheus-rules-litellm.yaml).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: traefik
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
      app.kubernetes.io/instance: traefik-kube-system
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 60s
