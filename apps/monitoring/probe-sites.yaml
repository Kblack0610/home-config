# blackbox-exporter Probe for all public + private site URLs.
#
# The `static` target list below is GENERATED from apps/*/ingress*.yaml by
# scripts/gen-ha-launcher.py (same source as the HA launcher + status sensors).
# Edit ingresses + rerun the script; do not hand-edit the target list.
#
# The `release: kube-prometheus-stack` label is required: the operator's default
# probeSelector (probeSelectorNilUsesHelmValues is unset -> true) only picks up
# Probes carrying the Helm release label. Prometheus then scrapes blackbox once
# per target, exposing probe_success{instance="https://<host>"}.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: sites
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  jobName: blackbox-sites
  interval: 60s
  module: http_up
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      # BEGIN_GENERATED_TARGETS (regenerate via scripts/gen-ha-launcher.py)
      static:
        - https://alertmanager.kblab.me
        - https://binks-next.kblab.me
        - https://binks.chat
