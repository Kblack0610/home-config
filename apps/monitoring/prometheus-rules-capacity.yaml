apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-capacity
  namespace: monitoring
  labels:
    app.kubernetes.io/name: homelab-capacity
    app.kubernetes.io/part-of: monitoring
    # REQUIRED, see prometheus-rules-forgejo-mirrors.yaml.
    release: kube-prometheus-stack
spec:
  # Warning is silent on the phone and critical is not, so critical must stay rare.
  # Budget: about 5 pages a week. Thresholds come from a replay of 4.5 days of history
  # (2026-10-27 to 2026-10-31), which is all Prometheus keeps with this data. Each count
  # below is from that replay. Tests: apps/monitoring/tests/capacity.test.yaml.
  groups:
    - name: homelab-capacity.recording
      rules:
        # One series per real device. Excluded: pseudo filesystems, network shares
        # (the server reports them), and Mac simulator and system volumes, which are
        # always full by design. `min by device` folds btrfs subvolumes into one.
        - record: device:node_filesystem_avail:ratio
          expr: >-
            min by (instance, device, job) (
              node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|autofs|vfat|nsfs|devtmpfs|cifs|nfs.*|fuse.*",mountpoint!~"/System/Volumes/(Preboot|VM|Update|xarts|iSCPreboot|Hardware).*|/Library/Developer/.*|/run.*|/boot.*|/var/lib/kubelet.*|/snap.*|/tmp"}
              /
              node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|autofs|vfat|nsfs|devtmpfs|cifs|nfs.*|fuse.*",mountpoint!~"/System/Volumes/(Preboot|VM|Update|xarts|iSCPreboot|Hardware).*|/Library/Developer/.*|/run.*|/boot.*|/var/lib/kubelet.*|/snap.*|/tmp"}
            )
        - record: device:node_filesystem_avail_predict4h:bytes
          expr: >-
            min by (instance, device, job) (
              predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|autofs|vfat|nsfs|devtmpfs|cifs|nfs.*|fuse.*",mountpoint!~"/System/Volumes/(Preboot|VM|Update|xarts|iSCPreboot|Hardware).*|/Library/Developer/.*|/run.*|/boot.*|/var/lib/kubelet.*|/snap.*|/tmp"}[2h], 4 * 3600)
            )
        - record: device:node_filesystem_files_free:ratio
          expr: >-
            min by (instance, device, job) (
              node_filesystem_files_free{fstype!~"tmpfs|ramfs|overlay|squashfs|autofs|vfat|nsfs|devtmpfs|cifs|nfs.*|fuse.*",mountpoint!~"/System/Volumes/(Preboot|VM|Update|xarts|iSCPreboot|Hardware).*|/Library/Developer/.*|/run.*|/boot.*|/var/lib/kubelet.*|/snap.*|/tmp"}
              /
              node_filesystem_files{fstype!~"tmpfs|ramfs|overlay|squashfs|autofs|vfat|nsfs|devtmpfs|cifs|nfs.*|fuse.*",mountpoint!~"/System/Volumes/(Preboot|VM|Update|xarts|iSCPreboot|Hardware).*|/Library/Developer/.*|/run.*|/boot.*|/var/lib/kubelet.*|/snap.*|/tmp"}
            )

    - name: homelab-capacity.pv
      rules:
        # The scrape target's own `namespace` overwrites one in the textfile, so the
        # script writes `claim_namespace` and it becomes `namespace` here.
        - record: local_path_pv:used_over_request:ratio
          expr: >-
            label_replace(local_path_pv_used_bytes, "namespace", "$1", "claim_namespace", "(.+)")
            / on (namespace, persistentvolumeclaim) group_left ()
            max by (namespace, persistentvolumeclaim) (kube_persistentvolumeclaim_resource_requests_storage_bytes)

    - name: homelab-capacity.disk
      rules:
        # `fleet: fix` makes an agent fix it: the sentinel watch alertmanager-fleet reads every
        # active alert with that label and fleet-bench triage queues each as a `red` item for
        # the fix-red skill. Put it only on alerts an agent can act on from the runbook.
        # Kubelet evicts at 5% free and does not stop until 15% free, so a node that
        # trips loses its pods until 10% of the disk comes back. On 2026-10-31 hp-victus
        # crossed 15% at 19:00, 10% at 22:00, and evicted at 00:57.
        - alert: NodeDiskLow
          expr: device:node_filesystem_avail:ratio < 0.20
          for: 30m
          labels:
            severity: warning
            category: capacity
            fleet: fix
          annotations:
            summary: "{{ $labels.instance }} {{ $labels.device }} has {{ $value | humanizePercentage }} free"
        # Not in the replay. Razer sat idle like this twice on 2026-10-31 and 11-01 while jobs
        # queued and the Mac took the overflow, and nothing told anyone.
        - alert: CiHostHeldOutByDisk
          expr: ci_governor_disk_held == 1 and on () ci_governor_queue > 0
          for: 30m
          labels:
            severity: critical
            category: capacity
            fleet: fix
          annotations:
            summary: "{{ $labels.host }} has idle Unity slots held out by low disk while jobs wait: docs/runbooks/node-disk-pressure.md"
        # 1 page in 3 days of history: the 8-hour runner metric gap on 2026-10-31. The 5-minute
        # gap on 2026-11-01, when GitHub's limit ran out at the end of its hour, stays quiet.
        - alert: CiGovernorBlind
          expr: ci_governor_ok == 0
          for: 30m
          labels:
            severity: critical
            category: capacity
            fleet: fix
          annotations:
            summary: "ci-runner-governor has had no reading for 30 minutes, so no Unity slot is being pulled or returned. Check github_runner_exporter_api_ok and GitHub's API limit"
        # A reclaim kills every job on the Spot host. More than 3 in a day means that type is
        # scarce: set its entry spot = false in platform infra/aws-ci-burst (2026-11-13 plan).
        - alert: CiSpotHostReclaimedOften
          expr: increase(ci_governor_fallback_total{reason="reclaim",host=~"aws-spot-.*"}[24h]) > 3
          labels:
            severity: warning
            category: capacity
            fleet: fix
          annotations:
            summary: "{{ $labels.host }} was reclaimed by AWS more than 3 times in 24 h, each killing its jobs: set it on-demand in platform infra/aws-ci-burst variables.tf"
        # GitHub charges orgs/ and repos/ calls to separate 5000-an-hour buckets, and the
        # exporter, governor and boards all go blind when one hits 0. Warning, not a page:
        # it comes ahead of CiGovernorBlind, which only sees the outage after 30 minutes.
        # Replay of 2026-11-04 to 11-11: 4 fires, all on repos (11-09 22:32, 11-10 04:28,
        # 11-10 11:31, 11-10 17:32); orgs never went under 3277. min by (scope) folds the
        # old pod's series into the new one across an exporter restart.
        - alert: GithubApiRateLow
          expr: min by (scope) (github_runner_exporter_rate_remaining) < 500
          for: 10m
          labels:
            severity: warning
            category: capacity
            fleet: fix
          annotations:
            summary: "GitHub API {{ $labels.scope }} bucket has {{ $value }} calls left this hour: docs/runbooks/unity-ci-host.md#github-api-limit"
        # 6 pages in the replay: 4 on asus from the Forgejo backups fixed in #441, 1 the
        # outage, 1 workstation. Would have given 3 hours of warning on 2026-10-31.
        - alert: NodeDiskCritical
          expr: device:node_filesystem_avail:ratio < 0.10
          for: 15m
          labels:
            severity: critical
            category: capacity
            fleet: fix
          annotations:
            summary: "{{ $labels.instance }} {{ $labels.device }} has {{ $value | humanizePercentage }} free"
            description: Kubelet evicts pods at 5% free and keeps evicting until 15% is free.
        # 2 pages in the replay, one of them the outage, which it caught at 19:45. A 6h
        # window never fired on it: CI fills the disk faster than that slope shows.
        - alert: NodeDiskFillingFast
          expr: device:node_filesystem_avail_predict4h:bytes < 0 and device:node_filesystem_avail:ratio < 0.15
          for: 30m
          labels:
            severity: critical
            category: capacity
            fleet: fix
          annotations:
            summary: "{{ $labels.instance }} {{ $labels.device }} is on course to fill within 4 hours"
        - alert: NodeInodesLow
          expr: device:node_filesystem_files_free:ratio < 0.10
          for: 30m
          labels:
            severity: warning
            category: capacity
            fleet: fix
          annotations:
            summary: "{{ $labels.instance }} {{ $labels.device }} has {{ $value | humanizePercentage }} of its inodes free"
        - alert: NodeInodesCritical
          expr: device:node_filesystem_files_free:ratio < 0.05
          for: 5m
          labels:
            severity: critical
            category: capacity
            fleet: fix
          annotations:
            summary: "{{ $labels.instance }} {{ $labels.device }} has {{ $value | humanizePercentage }} of its inodes free"

    # From ansible/roles/node-disk-metrics, on k3s nodes only. New rules, so these have no
    # replay: the series start with this change.
    - name: homelab-capacity.disk-use
      rules:
        - alert: NodeCoreDumps
          expr: node_coredumps_last_hour > 0
          labels:
            severity: warning
            category: capacity
          annotations:
            summary: "{{ $labels.instance }} wrote {{ $value | humanize }} core dumps in the last hour"
        # On 2026-11-10 this paged for razer, hp-victus and asus and no agent was told.
        # `fleet: fix` (see homelab-capacity.disk) sends it to an agent with the runbook.
        - alert: NodeCoreDumpStorm
          expr: node_coredumps_last_hour > 5 or node_coredump_bytes > 10e9
          for: 5m
          labels:
            severity: critical
            category: capacity
            fleet: fix
          annotations:
            summary: "{{ $labels.instance }} is crash looping or holding large core dumps: docs/runbooks/node-crash-storms.md"
        # local-path does not enforce a PV's size, so a PV past its request is taking disk
        # the scheduler and everyone else think is free.
        - alert: LocalPathPvOverRequest
          expr: local_path_pv:used_over_request:ratio > 1
          for: 1h
          labels:
            severity: warning
            category: capacity
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} uses {{ $value | humanizePercentage }} of what it requested"
        # Pages only once the node is short too (the governor's and NodeDiskLow's 20%): a
        # PV far over on a roomy node is a warning, and critical repeats hourly. On
        # 2026-10-31 forgejo-data was at 1133% with 41% of its node free.
        - alert: LocalPathPvFarOverRequest
          expr: >-
            local_path_pv:used_over_request:ratio > 1.5
            and on (instance)
            (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.2)
          for: 1h
          labels:
            severity: critical
            category: capacity
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} uses {{ $value | humanizePercentage }} of what it requested, on a node under 20% free"
        # The rules above go quiet when the timer stops, which reads the same as all clear.
        - alert: NodeDiskMetricsStale
          expr: time() - node_textfile_mtime_seconds{file=~".*node_disk.prom"} > 3600
          for: 15m
          labels:
            severity: warning
            category: capacity
          annotations:
            summary: "{{ $labels.instance }} has not updated its disk metrics for over an hour"
        # macos-disk-reclaim writes these on each pass, weekly at the least. A disk fills
        # quietly when the pass stops or stays skipped, as the mini's did in 2026-11.
        - alert: DiskReclaimStale
          expr: time() - homelab_disk_reclaim_last_run_timestamp_seconds > 8 * 86400
          for: 1h
          labels:
            severity: warning
            category: capacity
          annotations:
            summary: "{{ $labels.instance }} has not run a disk reclaim pass for over 8 days"
        - alert: DiskReclaimSkipped
          expr: homelab_disk_reclaim_skipped == 1
          for: 24h
          labels:
            severity: warning
            category: capacity
          annotations:
            summary: "Disk reclaim on {{ $labels.instance }} has been skipped for a day: {{ $labels.reason }}"

    - name: homelab-capacity.compute
      rules:
        - alert: NodeMemoryLow
          expr: node_memory_MemAvailable_bytes{job=~"node-exporter|standalone-nodes"} / node_memory_MemTotal_bytes < 0.15
          for: 30m
          labels:
            severity: warning
            category: capacity
          annotations:
            summary: "{{ $labels.instance }} has {{ $value | humanizePercentage }} of its memory available"
        # Tasks stalled on memory, which is what hurts; low free memory alone is often
        # just cache. 25% gave 2 pages in the replay, 10% gave 4.
        - alert: NodeMemoryPressure
          expr: rate(node_pressure_memory_stalled_seconds_total[5m]) > 0.25
          for: 10m
          labels:
            severity: critical
            category: capacity
          annotations:
            summary: "{{ $labels.instance }} is stalled on memory {{ $value | humanizePercentage }} of the time"
        # CI hosts run at full CPU by design, so this stays a warning. 13 in the replay.
        - alert: NodeCpuSaturated
          expr: rate(node_pressure_cpu_waiting_seconds_total[5m]) > 0.50
          for: 30m
          labels:
            severity: warning
            category: capacity
          annotations:
            summary: "Tasks on {{ $labels.instance }} are waiting for CPU {{ $value | humanizePercentage }} of the time"
        # An hour with almost every moment contended. 0 in the replay; at 30m it was 3.
        - alert: NodeCpuStarved
          expr: rate(node_pressure_cpu_waiting_seconds_total[5m]) > 0.90
          for: 1h
          labels:
            severity: critical
            category: capacity
          annotations:
            summary: "Tasks on {{ $labels.instance }} have waited for CPU for over an hour"
        - alert: NodeOomKill
          expr: increase(node_vmstat_oom_kill[1h]) > 0
          labels:
            severity: warning
            category: capacity
          annotations:
            summary: "{{ $labels.instance }} killed {{ $value | humanize }} processes for memory in the last hour"
        # 2 in the replay. At 3 an hour it was 10, mostly Unity builds on CI hosts.
        # `fleet: fix` (see homelab-capacity.disk): on 2026-11-10 this paged for razer and no
        # agent was told.
        - alert: NodeOomKillStorm
          expr: increase(node_vmstat_oom_kill[1h]) >= 10
          for: 5m
          labels:
            severity: critical
            category: capacity
            fleet: fix
          annotations:
            summary: "{{ $labels.instance }} killed {{ $value | humanize }} processes for memory in the last hour: docs/runbooks/node-crash-storms.md"
        - alert: ContainerOomKilled
          expr: increase(kube_pod_container_status_restarts_total[15m]) > 0 and on (namespace, pod, container) kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          labels:
            severity: warning
            category: capacity
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} was killed for memory"
        # NodeDown reads `up`, and an evicted exporter takes its `up` series with it, so
        # the node that needs watching most went blind. This reads the node list from
        # kube-state-metrics. 1 in the replay. Joined on pod, because kube_node_info can
        # carry an IPv6 address that never matches a scrape target.
        - alert: NodeExporterMissing
          expr: kube_node_info unless on (node) ((up{job="node-exporter"} == 1) * on (namespace, pod) group_left (node) kube_pod_info{pod=~".*node-exporter.*"})
          for: 15m
          labels:
            severity: critical
            category: capacity
          annotations:
            summary: "No node-exporter data from {{ $labels.node }}"

    - name: homelab-capacity.services
      rules:
        # KubePodCrashLooping is the warning for every namespace. 0 in the replay.
        - alert: CriticalServiceCrashLooping
          expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff", namespace=~"monitoring|ntfy|ntfy-public|vaultwarden|forgejo|kube-system|flux-system|traefik|ai-gateway"} == 1
          for: 1h
          labels:
            severity: critical
            category: capacity
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} has been crash looping for an hour"
        # A critical service whose image cannot be pulled is down until someone
        # acts: on 2026-11-11 Forgejo sat in ImagePullBackOff after codeberg.org
        # lost its amd64 manifest (hc-294). Two pull retries is 10 minutes.
        - alert: CriticalServiceImagePullFailing
          expr: kube_pod_container_status_waiting_reason{reason=~"ErrImagePull|ImagePullBackOff", namespace=~"monitoring|ntfy|ntfy-public|vaultwarden|forgejo|kube-system|flux-system|traefik|ai-gateway"} == 1
          for: 10m
          labels:
            severity: critical
            category: capacity
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} cannot pull the image of {{ $labels.container }}"
        # From the blackbox probes, because cert-manager's metrics are not scraped.
        - alert: CertExpiringSoon
          expr: probe_ssl_earliest_cert_expiry - time() < 14 * 86400
          for: 1h
          labels:
            severity: warning
            category: capacity
          annotations:
            summary: "The certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}"
        - alert: CertExpiringCritical
          expr: probe_ssl_earliest_cert_expiry - time() < 3 * 86400
          for: 1h
          labels:
            severity: critical
            category: capacity
          annotations:
            summary: "The certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}"
        # nas-backup-verify checks that the Forgejo archives are whole, the off-box copy
        # matches, and snapshots are recent. A failed run is a backup you cannot trust.
        # Limited to recent runs, since failed Job objects linger for months.
        - alert: BackupVerifyFailed
          expr: kube_job_status_failed{namespace="nas", job_name=~"nas-backup-verify.*"} > 0 and on (namespace, job_name) (time() - kube_job_status_start_time < 36 * 3600)
          labels:
            severity: critical
            category: backup
          annotations:
            summary: "{{ $labels.job_name }} failed: read its log"
