# Command Center: ONE judgement per domain, read by every renderer.
#
# The Grafana "Command Center" dashboard and the hub tmux board (dotfiles
# .local/src/tmux/command-center.sh) both draw these series and compute nothing
# themselves, so the two can never disagree about what is red.
#
#   cc:component_status{domain,component}  0 ok, 1 warn, 2 red, one row per input
#   cc:domain_status{domain}               worst component in the domain
#   cc:overall_status                       worst domain
#   cc:agents_topic_live{topic}             1 per agents topic published in 20 min; readers join on it
#   cc:watch_state{domain,item}             what is not ok inside a domain: 2 down, 1 warn, one row per item
#   cc:red_now{item}                        what is red right now, one row per item (dashboard table, hub board, waybar day and health chips)
#   cc:<name>                               the numbers the tiles print
#   cc:host_<metric>{host}                  per-machine load for the board's MACHINES rows
#   cc:host_core_busy_ratio{host,cpu}       each core's busy share, the Infra tab's core strip
#   cc:runner_cores_busy / _allowed{host,runner}  cores a CI runner's job uses, and its pinned CPUs
#   cc:host_local_gate{host,worktree,...}  the workstation's local Unity gates (fleet-assess)
#   cc:host_local_slots / _busy / _queued{host}          its gate slots, slots held, runs waiting
#   cc:host_local_open_slots{host}                       the always-open part of its gate slots
#   cc:host_local_done_24h / _pass_ratio_24h{host}       its gates finished in 24h, and pass / finished
#   cc:pool_done_24h / _cancelled_24h / _pass_ratio_24h{pool}  jobs each runner pool finished in 24h
#   cc:pool_slots / _busy / _withheld{pool}  runners that can take a job, those running one, and idle ones the governor withheld
#   cc:site_slots / _busy{site}             the same slots and busy, local (home LAN, workstation gates included) vs cloud
#   cc:github_hosted_running                jobs running now on GitHub's own runners
#
# Status comes from sentinel watches where one exists (they are the curated alarms that
# already page), and from metrics where none does (nodes, heartbeats, runner pools).
# Watch and runner state arrive via agent-mqtt-publish -> mosquitto -> mqtt2prom as
# mqtt_tripped / mqtt_stale / mqtt_failed / (mqtt_running{topic="agents_<host>_<kind>_<name>"} and on (topic) cc:agents_topic_live).
#
# Each component is `(red-case > 0) or (warn-case > 0) or vector(0)`: the comparison
# drops a zero-valued series so `or` falls through to the next case, and vector(0)
# keeps the row present when its inputs are absent.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: command-center
  namespace: monitoring
  labels:
    app.kubernetes.io/name: command-center
    app.kubernetes.io/part-of: monitoring
    release: kube-prometheus-stack
spec:
  groups:
    - name: command-center.components
      interval: 1m
      rules:
        # 1 for each agents topic the feed sent in the last 20 min. mqtt2prom ignores the empty
        # retained payload the publisher sends for a removed runner or watch, so that series
        # keeps its last value forever (11-04: runner wave, red for a day after its conf went).
        # Every watch and runner reader below joins on this, so only live topics count.
        - record: cc:agents_topic_live
          expr: >-
            max by (topic) (changes(mqtt_message_total{topic=~"agents_.+"}[20m]) > 0) * 0 + 1
        # What each sentinel watch means, one row per watch that is not ok: its weight when
        # tripped, 1 when not polled in 3x interval. A watch's domain and weight live only here.
        - record: cc:watch_state
          labels: {domain: k3s}
          expr: >-
            max by (item) (label_replace(((mqtt_tripped{topic=~"agents_.+_watch_(home_k3s_.+|cluster_janitor_alive)"} and on (topic) cc:agents_topic_live) * 2 > 0) or ((mqtt_stale{topic=~"agents_.+_watch_(home_k3s_.+|cluster_janitor_alive)"} and on (topic) cc:agents_topic_live) > 0), "item", "$1", "topic", "agents_.+_watch_(.+)"))
        - record: cc:watch_state
          labels: {domain: prod}
          expr: >-
            max by (item) (label_replace(((mqtt_tripped{topic=~"agents_.+_watch_(pmp_.+|prod_mercury_payouts|posthog_prod_guard)"} and on (topic) cc:agents_topic_live) * 2 > 0) or ((mqtt_stale{topic=~"agents_.+_watch_(pmp_.+|prod_mercury_payouts|posthog_prod_guard)"} and on (topic) cc:agents_topic_live) > 0), "item", "$1", "topic", "agents_.+_watch_(.+)"))
        - record: cc:watch_state
          labels: {domain: llm}
          expr: >-
            max by (item) (label_replace(((mqtt_tripped{topic=~"agents_.+_watch_(mac_studio_mlx)"} and on (topic) cc:agents_topic_live) * 2 > 0) or ((mqtt_stale{topic=~"agents_.+_watch_(mac_studio_mlx)"} and on (topic) cc:agents_topic_live) > 0), "item", "$1", "topic", "agents_.+_watch_(.+)"))
        - record: cc:watch_state
          labels: {domain: ci}
          expr: >-
            max by (item) (label_replace(((mqtt_tripped{topic=~"agents_.+_watch_(.+_runners?_online|playground_nightly)"} and on (topic) cc:agents_topic_live) * 2 > 0) or ((mqtt_stale{topic=~"agents_.+_watch_(.+_runners?_online|playground_nightly)"} and on (topic) cc:agents_topic_live) > 0), "item", "$1", "topic", "agents_.+_watch_(.+)"))
        - record: cc:watch_state
          labels: {domain: queue}
          expr: >-
            max by (item) (label_replace(((mqtt_tripped{topic=~"agents_.+_watch_(queue_starved|shepherd_stuck)"} and on (topic) cc:agents_topic_live) * 2 > 0) or ((mqtt_tripped{topic=~"agents_.+_watch_(heal_flapping|board_chain)"} and on (topic) cc:agents_topic_live) * 1 > 0) or ((mqtt_stale{topic=~"agents_.+_watch_(queue_starved|shepherd_stuck|heal_flapping|board_chain)"} and on (topic) cc:agents_topic_live) > 0), "item", "$1", "topic", "agents_.+_watch_(.+)"))
        - record: cc:watch_state
          labels: {domain: machines}
          expr: >-
            max by (item) (label_replace(((mqtt_tripped{topic=~"agents_.+_watch_(fleet_thermal)"} and on (topic) cc:agents_topic_live) * 1 > 0) or ((mqtt_stale{topic=~"agents_.+_watch_(fleet_thermal)"} and on (topic) cc:agents_topic_live) > 0), "item", "$1", "topic", "agents_.+_watch_(.+)"))
        - record: cc:watch_state
          labels: {domain: spend}
          expr: >-
            max by (item) (label_replace(((mqtt_tripped{topic=~"agents_.+_watch_(lazer_pool_pace|gh_actions_budget_pace|claude_spend_(?:hourly|daily)|claude_account_pace|claude_acct_usage)"} and on (topic) cc:agents_topic_live) * 1 > 0) or ((mqtt_stale{topic=~"agents_.+_watch_(lazer_pool_pace|gh_actions_budget_pace|claude_spend_(?:hourly|daily)|claude_account_pace|claude_acct_usage)"} and on (topic) cc:agents_topic_live) > 0), "item", "$1", "topic", "agents_.+_watch_(.+)"))
        - record: cc:watch_state
          labels: {domain: platform}
          expr: >-
            max by (item) (label_replace(((mqtt_tripped{topic=~"agents_.+_watch_(skill_drift|mem0_search_path|deploy_drift|fleet_liveness)"} and on (topic) cc:agents_topic_live) * 1 > 0) or ((mqtt_stale{topic=~"agents_.+_watch_(skill_drift|mem0_search_path|deploy_drift|fleet_liveness)"} and on (topic) cc:agents_topic_live) > 0), "item", "$1", "topic", "agents_.+_watch_(.+)"))
        # a watch no domain above claims still counts, so a new manifest is never invisible here.
        # aws_burst_power trips whenever the burst runner runs: it pages on start and stop, and is no fault.
        - record: cc:watch_state
          labels: {domain: other}
          expr: >-
            max by (item) (label_replace(((mqtt_tripped{topic=~"agents_.+_watch_.+",topic!~"agents_.+_watch_aws_burst_power"} and on (topic) cc:agents_topic_live) * 2 > 0) or ((mqtt_stale{topic=~"agents_.+_watch_.+",topic!~"agents_.+_watch_aws_burst_power"} and on (topic) cc:agents_topic_live) > 0), "item", "$1", "topic", "agents_.+_watch_(.+)")) unless on (item) cc:watch_state{domain!="other"}
        # Home Assistant's connectivity sensors, the wall pill's "N down": fleet_alerts.yaml publishes each one
        - record: cc:watch_state
          labels: {domain: home}
          expr: >-
            max by (item) (label_replace((mqtt_tripped{topic=~"agents_hass_conn_.+"} and on (topic) cc:agents_topic_live) * 2 > 0, "item", "$1", "topic", "agents_hass_conn_(.+)"))
        - record: cc:component_status
          labels: {domain: k3s, component: watches}
          expr: >-
            max(cc:watch_state{domain="k3s"}) or vector(0)
        - record: cc:component_status
          labels: {domain: prod, component: watches}
          expr: >-
            max(cc:watch_state{domain="prod"}) or vector(0)
        - record: cc:component_status
          labels: {domain: llm, component: watches}
          expr: >-
            max(cc:watch_state{domain="llm"}) or vector(0)
        - record: cc:component_status
          labels: {domain: ci, component: watches}
          expr: >-
            max(cc:watch_state{domain="ci"}) or vector(0)
        - record: cc:component_status
          labels: {domain: queue, component: watches}
          expr: >-
            max(cc:watch_state{domain="queue"}) or vector(0)
        - record: cc:component_status
          labels: {domain: machines, component: watches}
          expr: >-
            max(cc:watch_state{domain="machines"}) or vector(0)
        - record: cc:component_status
          labels: {domain: spend, component: watches}
          expr: >-
            max(cc:watch_state{domain="spend"}) or vector(0)
        - record: cc:component_status
          labels: {domain: platform, component: watches}
          expr: >-
            max(cc:watch_state{domain="platform"}) or vector(0)
        - record: cc:component_status
          labels: {domain: other, component: watches}
          expr: >-
            max(cc:watch_state{domain="other"}) or vector(0)
        - record: cc:component_status
          labels: {domain: home, component: connectivity}
          expr: >-
            max(cc:watch_state{domain="home"}) or vector(0)
        # no connectivity topic in 20 min means Home Assistant stopped reporting, so "home" knows nothing -> 1
        - record: cc:component_status
          labels: {domain: home, component: feed}
          expr: >-
            absent(cc:agents_topic_live{topic=~"agents_hass_conn_.+"}) or vector(0)
        # any NotReady node -> 1 (the home_k3s_node_ready watch already makes it 2)
        - record: cc:component_status
          labels: {domain: k3s, component: nodes}
          expr: >-
            clamp_max(count(kube_node_status_condition{condition="Ready",status="true"} == 0), 1) or vector(0)
        # a k3s box missing heartbeats -> 2; any other machine, or the exporter blind -> 1
        - record: cc:component_status
          labels: {domain: machines, component: heartbeats}
          expr: >-
            (clamp_max(count(fleet_machine_up{group="k3s"} == 0), 1) * 2) or clamp_max(count(fleet_machine_up == 0), 1) or clamp_max(count(fleet_exporter_gatus_reachable == 0), 1) or vector(0)
        # LiteLLM itself not scrapeable -> 2
        - record: cc:component_status
          labels: {domain: llm, component: gateway}
          expr: >-
            (clamp_max(count(up{job="litellm"} == 0), 1) * 2) or (absent(up{job="litellm"}) * 2) or vector(0)
        # any host/pool below its expected size -> 1 (per host: one dead laptop must not hide behind another's full pool)
        - record: cc:component_status
          labels: {domain: ci, component: pools}
          expr: >-
            clamp_max(count(max by (host, pool) (github_runner_pool_online) < max by (host, pool) (github_runner_pool_expected)), 1) or vector(0)
        # any agentctl runner in error or whose last run STALLED -> 1
        - record: cc:component_status
          labels: {domain: agents, component: runners}
          expr: >-
            clamp_max(count((mqtt_failed{topic=~"agents_.+_runner_.+"} and on (topic) cc:agents_topic_live) == 1), 1) or vector(0)
        # agent-mqtt-publish republishes every 5 min; nothing in 20 min means every agent and watch number is frozen -> 1
        - record: cc:component_status
          labels: {domain: agents, component: feed}
          expr: >-
            clamp_max(count(changes(mqtt_message_total{topic=~"agents_.+_summary_asks_open"}[20m]) == 0), 1) or (absent(mqtt_message_total{topic=~"agents_.+_summary_asks_open"})) or vector(0)
        # sentinel stamps its runner state every sweep; nothing in 30 min means no watch is being checked -> 2.
        # A frozen feed freezes this stamp too, so the feed row answers for that case instead.
        - record: cc:component_status
          labels: {domain: agents, component: sentinel}
          expr: >-
            (((time() - max(mqtt_updated_epoch{topic=~"agents_.+_runner_sentinel"}) > 1800) * 0 + 2)
              unless on () (cc:component_status{domain="agents",component="feed"} > 0))
            or (absent(mqtt_updated_epoch{topic=~"agents_.+_runner_sentinel"}) * 2) or vector(0)
        # Lazer allowance: under 25% left -> 1, under 10% -> 2
        - record: cc:component_status
          labels: {domain: spend, component: lazer}
          expr: >-
            ((max(litellm_remaining_team_budget_metric{team_alias="lazer-pool"} / litellm_team_max_budget_metric{team_alias="lazer-pool"}) < bool 0.10) + (max(litellm_remaining_team_budget_metric{team_alias="lazer-pool"} / litellm_team_max_budget_metric{team_alias="lazer-pool"}) < bool 0.25)) or vector(0)
    - name: command-center.rollup
      interval: 1m
      rules:
        - record: cc:domain_status
          expr: max by (domain) (cc:component_status)
        - record: cc:overall_status
          expr: max(cc:domain_status)
    # What is red right now, value 1 per item. The dashboard's "What is red" table, the hub
    # board's red-now line and the waybar day chip read this one series, so they cannot disagree.
    - name: command-center.red
      interval: 1m
      rules:
        - record: cc:red_now
          expr: >-
            clamp_max(count by (item) (
              label_replace(cc:watch_state == 2, "item", "watch $1", "item", "(.+)")
              or label_replace((mqtt_failed{topic=~"agents_.+_runner_.+"} and on (topic) cc:agents_topic_live) == 1, "item", "runner $1", "topic", "agents_.+_runner_(.+)")
              or label_replace(kube_node_status_condition{condition="Ready",status="true"} == 0, "item", "node $1 NotReady", "node", "(.+)")
              or label_replace(cc:component_status{domain="agents",component="feed"} > 0, "item", "agent feed frozen", "", "")
              or label_replace(cc:component_status{domain="agents",component="sentinel"} > 0, "item", "sentinel silent", "", "")), 1)
    # The two things Sentinel cannot page about: its own death, and the feed that carries its
    # state going quiet. Every other agent alarm is a Sentinel watch; these never duplicate one.
    - name: command-center.alerts
      rules:
        - alert: AgentFeedFrozen
          expr: cc:component_status{domain="agents",component="feed"} > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: The agent feed has published nothing in 30 minutes, so every watch, runner and queue number is frozen
            runbook: ~/.config/agentctl/SENTINEL.md (dotfiles-private), "Operate"
        - alert: SentinelSilent
          expr: cc:component_status{domain="agents",component="sentinel"} > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Sentinel has not swept in 40 minutes while the feed is live, so no watch is being checked or paged
            runbook: ~/.config/agentctl/SENTINEL.md (dotfiles-private), "Operate"
    - name: command-center.numbers
      interval: 1m
      rules:
        - record: cc:k3s_nodes_ready
          expr: >-
            sum(kube_node_status_condition{condition="Ready",status="true"})
        - record: cc:k3s_nodes_total
          expr: >-
            count(kube_node_status_condition{condition="Ready",status="true"})
        - record: cc:machines_up
          expr: >-
            sum(fleet_machine_up)
        - record: cc:machines_total
          expr: >-
            max(fleet_roster_size)
        - record: cc:watches_total
          expr: >-
            count(mqtt_tripped{topic=~"agents_.+_watch_.+"} and on (topic) cc:agents_topic_live)
        - record: cc:watches_tripped
          expr: >-
            sum(mqtt_tripped{topic=~"agents_.+_watch_.+"} and on (topic) cc:agents_topic_live)
        - record: cc:watches_stale
          expr: >-
            sum(mqtt_stale{topic=~"agents_.+_watch_.+"} and on (topic) cc:agents_topic_live)
        - record: cc:runners_total
          expr: >-
            count(mqtt_failed{topic=~"agents_.+_runner_.+"} and on (topic) cc:agents_topic_live)
        - record: cc:runners_failed
          expr: >-
            sum(mqtt_failed{topic=~"agents_.+_runner_.+"} and on (topic) cc:agents_topic_live)
        - record: cc:runners_running
          expr: >-
            sum(mqtt_running{topic=~"agents_.+_runner_.+"} and on (topic) cc:agents_topic_live)
        - record: cc:asks_open
          expr: >-
            max(mqtt_state{topic=~"agents_.+_summary_asks_open"})
        - record: cc:sessions_total
          expr: >-
            sum(mqtt_state{topic=~"agents_.+_summary_sessions"})
        - record: cc:sessions_working
          expr: >-
            sum(mqtt_working{topic=~"agents_.+_summary_sessions"})
        - record: cc:sessions_attention
          expr: >-
            sum(mqtt_attention{topic=~"agents_.+_summary_sessions"})
        # Rostered slots only, so online/expected compare like with like: the exporter also
        # reports online runners for a host/pool missing from RUNNER_ROSTER.
        - record: cc:ci_online
          expr: >-
            sum(max by (host, pool) (github_runner_pool_online) and on (host, pool) max by (host, pool) (github_runner_pool_expected))
        - record: cc:ci_expected
          expr: >-
            sum(max by (host, pool) (github_runner_pool_expected))
        - record: cc:lazer_budget_usd
          expr: >-
            max(litellm_team_max_budget_metric{team_alias="lazer-pool"})
        - record: cc:lazer_spend_usd
          expr: >-
            max(litellm_team_max_budget_metric{team_alias="lazer-pool"}) - max(litellm_remaining_team_budget_metric{team_alias="lazer-pool"})
        - record: cc:claude_code_cost_24h_usd
          expr: >-
            sum(increase(claude_code_cost_usage_USD_total[24h]))
    # One row per machine, keyed by its inventory name (the same `host` the runner
    # exporter stamps on github_runner_state), so a runner row and its machine's load
    # join on one label. Rules run in order inside a group, so cc:host_instance is
    # fresh when the rest read it.
    - name: command-center.hosts
      interval: 1m
      rules:
        # instance -> host. k3s nodes: the node-exporter pod's node name (helm-values is
        # plain Helm, so no scrape-time relabel there). Everything scraped from a static
        # Endpoints list (Macs, standalone boxes) carries `host` from the address's
        # hostname via its ServiceMonitor.
        - record: cc:host_instance
          expr: >-
            max by (instance, host) (label_replace(max by (instance, pod) (node_uname_info{job="node-exporter"})
              * on (pod) group_left (node) max by (pod, node) (kube_pod_info{namespace="monitoring"}), "host", "$1", "node", "(.+)"))
            or max by (instance, host) (node_uname_info{host!=""})
        - record: cc:host_cores
          expr: >-
            count by (host) (node_cpu_seconds_total{mode="idle"} * on (instance) group_left (host) cc:host_instance)
            or count by (host) (windows_cpu_time_total{mode="idle", host!=""})
        - record: cc:host_cpu_busy_ratio
          expr: >-
            1 - avg by (host) (rate(node_cpu_seconds_total{mode="idle"}[2m]) * on (instance) group_left (host) cc:host_instance)
            or 1 - avg by (host) (rate(windows_cpu_time_total{mode="idle", host!=""}[2m]))
        # The same per core: an average hides a host with half its cores pinned and half idle.
        # windows_exporter names a core `core="0,3"` (group,index); it becomes `cpu` here.
        - record: cc:host_core_busy_ratio
          expr: >-
            1 - max by (host, cpu) (rate(node_cpu_seconds_total{mode="idle"}[2m]) * on (instance) group_left (host) cc:host_instance)
            or 1 - max by (host, cpu) (label_replace(rate(windows_cpu_time_total{mode="idle", host!=""}[2m]), "cpu", "$1", "core", "(.+)"))
        # Cores each CI runner and its job are using, and the CPUs a pinned slot may use
        # (roles/ci-runner-cpu, a textfile every 15s). Dropped once the file is a minute
        # old, so a stopped timer reads as no figure, not the last one frozen.
        - record: cc:runner_cores_busy
          expr: >-
            max by (host, runner) (ci_runner_cores_busy * on (instance) group_left (host) cc:host_instance
              and on (instance) (time() - node_textfile_mtime_seconds{file=~".*ci_runner.prom"} < 60))
        - record: cc:runner_cores_allowed
          expr: >-
            max by (host, runner) (ci_runner_cpus_allowed * on (instance) group_left (host) cc:host_instance
              and on (instance) (time() - node_textfile_mtime_seconds{file=~".*ci_runner.prom"} < 60))
        # Windows has no load average, so no Windows branch: the board reads "-".
        # Headroom over a working day, not one sample: a host that reads busy now may
        # have idled all afternoon, and the 6h figure is what a rebalance is judged on.
        - record: cc:host_cpu_busy_ratio:avg6h
          expr: >-
            avg_over_time(cc:host_cpu_busy_ratio[6h])
        - record: cc:host_load1
          expr: >-
            max by (host) (node_load1 * on (instance) group_left (host) cc:host_instance)
        # Linux: MemAvailable. macOS has none; app + wired + compressed is what Activity Monitor calls used.
        # Windows: physical_free_bytes is GlobalMemoryStatusEx's available memory.
        - record: cc:host_mem_used_ratio
          expr: >-
            max by (host) (
              (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes
               or (node_memory_active_bytes + node_memory_wired_bytes + node_memory_compressed_bytes) / node_memory_total_bytes)
              * on (instance) group_left (host) cc:host_instance)
            or max by (host) (1 - windows_memory_physical_free_bytes{host!=""} / windows_memory_physical_total_bytes{host!=""})
        # CPU package temperature only (coretemp / k10temp); nvme, wifi and battery sensors would read as the box.
        - record: cc:host_temp_c
          expr: >-
            max by (host) ((node_hwmon_temp_celsius * on (instance, chip) group_left (chip_name) node_hwmon_chip_names{chip_name=~"coretemp|k10temp"})
              * on (instance) group_left (host) cc:host_instance)
        # The workstation is not a runner; its CI is the headless Unity gates agents run
        # there, published by fleet-assess --textfile. Dropped once the file is 3 minutes
        # old, so a stopped timer reads as no gates, not the last minute frozen.
        - record: cc:host_local_gate
          expr: >-
            max without (instance, job, namespace, service, endpoint, pod, container) (fleet_local_gate{host!=""}
              and on (instance) (time() - node_textfile_mtime_seconds{file=~".*fleet_local.prom"} < 180))
        # The workstation's gate slots, from the same textfile. slots.sh owns the slot
        # count (open + burst); fleet-assess only reports it, never re-derives it.
        - record: cc:host_local_slots
          expr: >-
            sum by (host) (fleet_local_slots{host!=""}
              and on (instance) (time() - node_textfile_mtime_seconds{file=~".*fleet_local.prom"} < 180))
        # The rest are room slots, taken only while the machine has room: a ceiling, not capacity.
        - record: cc:host_local_open_slots
          expr: >-
            sum by (host) (fleet_local_slots{host!="", kind="open"}
              and on (instance) (time() - node_textfile_mtime_seconds{file=~".*fleet_local.prom"} < 180))
        - record: cc:host_local_busy
          expr: >-
            max by (host) (fleet_local_slots_busy{host!=""}
              and on (instance) (time() - node_textfile_mtime_seconds{file=~".*fleet_local.prom"} < 180))
        - record: cc:host_local_queued
          expr: >-
            max by (host) (fleet_local_queued{host!=""}
              and on (instance) (time() - node_textfile_mtime_seconds{file=~".*fleet_local.prom"} < 180))
        # Gates finished in the last 24h (run.sh's ledger). pass / all results: absent
        # when nothing finished, so an idle day reads "-" and not 0%, and 0 (not absent)
        # when every gate failed.
        - record: cc:host_local_done_24h
          expr: >-
            sum by (host) (fleet_local_gate_finished{host!=""}
              and on (instance) (time() - node_textfile_mtime_seconds{file=~".*fleet_local.prom"} < 180))
        - record: cc:host_local_pass_ratio_24h
          expr: >-
            (sum by (host) (fleet_local_gate_finished{host!="",result="pass"}
              and on (instance) (time() - node_textfile_mtime_seconds{file=~".*fleet_local.prom"} < 180))
              or cc:host_local_done_24h * 0)
            / (cc:host_local_done_24h > 0)
        - record: cc:agent_sessions_running
          expr: >-
            sum(fleet_agent_sessions{host!=""}
              and on (instance) (time() - node_textfile_mtime_seconds{file=~".*fleet_local.prom"} < 180))
    # CI pools: how many runners each pool has, how many are busy, and how many jobs
    # wait for it. Read next to each other these show balance: a saturated pool
    # beside idle ones. Pools come from the exporter's labels (pool_of), so a job
    # and the runners that could take it share one name. A queued run GitHub never
    # gave jobs (stuck="true") is left out, so its age cannot stand for the queue's.
    # Slots first: busy and waiting fall back to 0 for every pool that has runners.
    - name: command-center.pools
      interval: 1m
      rules:
        # A slot is a runner that can take a job: running, or idle and not withheld by
        # the governor. A withheld runner stays idle in pool="unity" (the governor finds
        # what it can re-admit that way), so counting it read as free capacity beside a
        # queue (2026-11-02: 3 "idle" unity runners that were all withheld).
        - record: cc:pool_slots
          expr: >-
            count by (pool) (max without (instance, pod, job, namespace, service, endpoint, container)
              (github_runner_state{state="running"})
              or (max without (instance, pod, job, namespace, service, endpoint, container) (github_runner_state{state="idle"})
                unless on (name) (max without (instance, pod, job, namespace, service, endpoint, container) (github_runner_withheld) == 1)))
        - record: cc:pool_withheld
          expr: >-
            count by (pool) (max without (instance, pod, job, namespace, service, endpoint, container)
              (github_runner_state{state="idle"})
              and on (name) (max without (instance, pod, job, namespace, service, endpoint, container) (github_runner_withheld) == 1))
            or cc:pool_slots * 0
        - record: cc:pool_busy
          expr: >-
            count by (pool) (max without (instance, pod, job, namespace, service, endpoint, container)
              (github_runner_state{state="running"}))
            or cc:pool_slots * 0
        # The same slots and busy split by where the machine is: site="cloud" for the
        # exporter's CLOUD_HOSTS (inventory unity_ci_lan: false), "local" otherwise. The
        # workstation's always-open gate slots count as local, so readers never add
        # them again. The src label keeps the two halves apart under `or`.
        - record: cc:site_slots
          expr: >-
            sum by (site) (
              label_replace(count by (site) (max without (instance, pod, job, namespace, service, endpoint, container)
                (github_runner_state{state="running"})
                or (max without (instance, pod, job, namespace, service, endpoint, container) (github_runner_state{state="idle"})
                  unless on (name) (max without (instance, pod, job, namespace, service, endpoint, container) (github_runner_withheld) == 1))),
                "src", "runners", "", "")
              or label_replace(label_replace(sum(cc:host_local_open_slots), "site", "local", "", ""), "src", "gates", "", ""))
        - record: cc:site_busy
          expr: >-
            sum by (site) (
              label_replace(count by (site) (max without (instance, pod, job, namespace, service, endpoint, container)
                (github_runner_state{state="running"})), "src", "runners", "", "")
              or label_replace(label_replace(sum(cc:host_local_busy), "site", "local", "", ""), "src", "gates", "", ""))
            or cc:site_slots * 0
        - record: cc:github_hosted_running
          expr: >-
            sum(max without (instance, pod, job, namespace, service, endpoint, container)
              (github_hosted_jobs_running)) or vector(0)
        - record: cc:pool_waiting
          expr: >-
            count by (pool) (max without (instance, pod, job, namespace, service, endpoint, container)
              (github_actions_job_waiting{stuck!="true"}))
            or cc:pool_slots * 0
        - record: cc:pool_oldest_wait_seconds
          expr: >-
            max by (pool) (github_actions_job_waiting{stuck!="true"})
        # Jobs each pool finished in the last 24h (runs created in the window). Jobs on
        # runners that are not ours read pool="github-hosted".
        - record: cc:pool_done_24h
          expr: >-
            sum by (pool) (max without (instance, pod, job, namespace, service, endpoint, container)
              (github_jobs_finished{conclusion=~"success|failure|timed_out|cancelled"}))
        - record: cc:pool_cancelled_24h
          expr: >-
            sum by (pool) (max without (instance, pod, job, namespace, service, endpoint, container)
              (github_jobs_finished{conclusion="cancelled"}))
        # Pass % leaves cancelled (and skipped) out of the denominator: the playground
        # cancels gate runs for closed PRs on purpose (drop-closed-gates.yml), and that
        # is not a pool failing. Absent when nothing passed or failed; 0 when all failed.
        - record: cc:pool_pass_ratio_24h
          expr: >-
            (sum by (pool) (max without (instance, pod, job, namespace, service, endpoint, container)
              (github_jobs_finished{conclusion="success"}))
              or sum by (pool) (max without (instance, pod, job, namespace, service, endpoint, container)
              (github_jobs_finished{conclusion=~"failure|timed_out"})) * 0)
            / (sum by (pool) (max without (instance, pod, job, namespace, service, endpoint, container)
              (github_jobs_finished{conclusion=~"success|failure|timed_out"})) > 0)
        - record: cc:ci_stuck_runs
          expr: >-
            count(max without (instance, pod, job, namespace, service, endpoint, container)
              (github_actions_job_waiting{stuck="true"})) or vector(0)
