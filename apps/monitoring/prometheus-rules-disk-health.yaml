apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-disk-health
  namespace: monitoring
  labels:
    app.kubernetes.io/name: homelab-disk-health
    app.kubernetes.io/part-of: monitoring
    # REQUIRED: without this label Prometheus never loads these rules. See the note in
    # prometheus-rules-node-health.yaml.
    release: kube-prometheus-stack
spec:
  groups:
    - name: homelab-disk-health.alerts
      rules:
        - alert: DiskSmartFailing
          expr: smartctl_device_smart_status == 0
          for: 5m
          labels:
            severity: critical
            fleet: none  # failing hardware: the human replaces the drive
            category: disk-health
          annotations:
            summary: "SMART says {{ $labels.device }} is failing"
            description: >-
              {{ $labels.device }} on {{ $labels.host }} failed its SMART health check.
              Check that its data has a current copy, then plan a replacement. See
              docs/backup-runbook.md, "If a drive fails".
        - alert: DiskCriticalWarning
          expr: smartctl_device_critical_warning > 0
          for: 5m
          labels:
            severity: critical
            fleet: none  # failing hardware: the human replaces the drive
            category: disk-health
          annotations:
            summary: "NVMe critical warning on {{ $labels.device }}"
            description: >-
              {{ $labels.device }} on {{ $labels.host }} reports critical warning
              {{ $value }}. It covers spare capacity, temperature and media going read-only.
        - alert: DiskMediaErrors
          expr: smartctl_device_media_errors > 0
          for: 5m
          labels:
            severity: critical
            fleet: none  # failing hardware: the human replaces the drive
            category: disk-health
          annotations:
            summary: "{{ $value }} media errors on {{ $labels.device }}"
            description: >-
              {{ $labels.device }} on {{ $labels.host }} could not read or write some of
              its media. Run a scrub to find which files are affected.
        # Rot, and the reason to scrub. The only thing that sees it on the 8TB too, which
        # has no SMART (ansible/roles/disk-health/README.md).
        - alert: BtrfsCorruption
          expr: increase(node_btrfs_device_errors_total{type=~"corruption|generation"}[1h]) > 0
          labels:
            severity: critical
            fleet: none  # failing hardware or corrupt data: the human decides the restore
            category: disk-health
          annotations:
            summary: "btrfs {{ $labels.type }} errors on {{ $labels.device }}"
            description: >-
              {{ $labels.device }} on {{ $labels.instance }} returned data that failed its
              checksum. No RAID here, so btrfs cannot repair it: restore the affected files
              from backup. `btrfs scrub status` and the kernel log name them.
        # A warning: a controller reset or a USB drop also counts here, and one is not a
        # failing disk. Rising counts are.
        - alert: BtrfsIOErrors
          expr: increase(node_btrfs_device_errors_total{type=~"read|write|flush"}[1h]) > 0
          labels:
            severity: warning
            fleet: none  # failing hardware: the human replaces the drive
            category: disk-health
          annotations:
            summary: "btrfs {{ $labels.type }} errors on {{ $labels.device }}"
            description: >-
              {{ $labels.device }} on {{ $labels.instance }} had IO errors in the last hour.
              Check the kernel log for controller resets or a USB disconnect, and the
              drive's SMART data if it has any.
        # Wear-out, months ahead. percentage_used is the vendor's estimate of rated life
        # spent; it can pass 100 and the drive keeps working, but past it the vendor
        # promises nothing. 80 leaves time to buy and swap one.
        - alert: DiskWearHigh
          expr: smartctl_device_percentage_used >= 80
          for: 1h
          labels:
            severity: warning
            fleet: none  # wear-out: the human buys the replacement
            category: disk-health
          annotations:
            summary: "{{ $labels.device }} on {{ $labels.host }} has used {{ $value }}% of its rated life"
            description: >-
              {{ $labels.device }} on {{ $labels.host }} reports {{ $value }}% of its rated
              write life used. Plan a replacement before it reaches 100.
        # Spare blocks replace worn ones. The drive's own critical warning trips at the
        # threshold (DiskCriticalWarning); this trips at twice it, while there is time.
        - alert: DiskSpareLow
          expr: smartctl_device_available_spare <= smartctl_device_available_spare_threshold * 2
          for: 1h
          labels:
            severity: warning
            fleet: none  # wear-out: the human buys the replacement
            category: disk-health
          annotations:
            summary: "{{ $labels.device }} on {{ $labels.host }} is down to {{ $value }}% spare"
            description: >-
              {{ $labels.device }} on {{ $labels.host }} has {{ $value }}% spare blocks left,
              within twice the drive's threshold. Its data needs a current copy and the drive
              a replacement.
        # Silence must not read as healthy: an exporter that stopped reports no failing
        # drive. The USB drive never appears here, so it is not counted.
        - alert: SmartExporterDown
          expr: |
            up{job="smartctl-exporter"} == 0
            or absent(up{job="smartctl-exporter"})
          for: 30m
          labels:
            severity: warning
            fleet: fix
            system: telemetry
            category: disk-health
          annotations:
            runbook_url: https://git.kennethblack.me/kblack0610/home-config/src/branch/master/ansible/roles/disk-health/README.md
            summary: "No SMART metrics from {{ $labels.host }}"
            description: >-
              Prometheus cannot scrape prometheus-smartctl-exporter on {{ $labels.host }}
              ({{ $labels.instance }}). Check the unit there; ansible role disk-health
              installs and starts it.
        # A drive that drops off the bus disappears from the exporter before anything else
        # notices. Compared with the most drives the host reported in the last week, so it
        # clears a week after a drive is removed on purpose (or silence it).
        - alert: SmartDriveMissing
          expr: |
            max_over_time(count by (host) (smartctl_device_smart_status)[7d:1h])
            > count by (host) (smartctl_device_smart_status)
          for: 30m
          labels:
            severity: warning
            fleet: none  # a drive off the bus: the human reseats or replaces it
            category: disk-health
          annotations:
            summary: "{{ $labels.host }} reports fewer drives than it did this week"
            description: >-
              smartctl-exporter on {{ $labels.host }} reported {{ $value }} drives at most
              this week and fewer now. A drive dropped off the bus or stopped answering
              SMART. Check `lsblk` and the kernel log there.
