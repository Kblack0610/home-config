# The Freqtrade dry-run league and its lab (apps/freqtrade). Every series comes from the
# trader-web exporter (strategy repo web/exporter.py), which reads the trader database at
# scrape time, so bot state is as old as the newest ingest (every 5 minutes).
#
# Covered elsewhere, on purpose not repeated here: a failed CronJob (HomelabCronJobFailed), a CronJob
# that stops being scheduled (HomelabCronJobNotScheduling), a league pod not ready
# (KubeStatefulSetReplicasMismatch) and the site down (Gatus).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: freqtrade
  namespace: monitoring
  labels:
    app.kubernetes.io/name: freqtrade
    app.kubernetes.io/part-of: monitoring
    release: kube-prometheus-stack
spec:
  groups:
    - name: freqtrade.alerts
      interval: 1m
      rules:
        # The league must never trade real money. The bot config, lab/league.py and ingest all
        # refuse it; this is the page if one of them ever does not.
        - alert: TraderBotNotDryRun
          expr: trader_bot_dry_run == 0
          labels:
            severity: critical
            category: trading
          annotations:
            summary: "Freqtrade bot {{ $labels.bot }} is NOT in dry run: stop the league now: flux suspend kustomization apps, then kubectl -n freqtrade scale sts freqtrade-league --replicas=0"
            description: >-
              The newest ingest snapshot of {{ $labels.bot }} reports dry_run false, so it can
              place real orders. Suspend Flux and scale the league to 0, then find which config or
              roster change turned dry run off (apps/freqtrade/README.md, Troubleshooting).

        # The exporter is the only source for the alert above, so its silence is an alert too.
        - alert: TraderMetricsMissing
          expr: absent(trader_db_up) or trader_db_up == 0
          for: 15m
          labels:
            severity: warning
            category: trading
          annotations:
            summary: "trader-web metrics are missing or cannot read the trader database: the not-dry-run page is blind"

        # The money plan's kill path. Only the watcher itself pages red: the rest are paper
        # bots at Stage 0, so a breach is a rehearsal. An empty watch table has no age series;
        # the Deployment rules cover a watcher that never started.
        - alert: TraderWatcherDown
          expr: trader_watch_age_seconds > 300
          labels:
            severity: critical
            category: trading
          annotations:
            summary: "The freqtrade watcher has not finished a pass for 5 minutes: no daily loss check is running"
            description: >-
              Check the freqtrade-watcher pod and its log. Every bot's equity is going unwatched
              (apps/freqtrade/README.md, Troubleshooting).

        - alert: TraderWatchBotBlind
          expr: trader_watch_unseen_seconds > 300
          labels:
            severity: warning
            category: trading
          annotations:
            summary: "The watcher has not read bot {{ $labels.bot }} for 5 minutes"

        - alert: TraderDailyLossBreach
          expr: trader_watch_breached == 1
          labels:
            severity: warning
            category: trading
          annotations:
            summary: "Bot {{ $labels.bot }} broke the daily loss limit (or a drill forced it); clears at 00:00 UTC"

        # A forgotten drill, or a bot someone paused by hand, trades nothing and looks healthy.
        - alert: TraderBotNotTakingEntries
          expr: trader_watch_running == 0
          for: 30m
          labels:
            severity: warning
            category: trading
          annotations:
            summary: "Bot {{ $labels.bot }} has been paused or stopped for 30 minutes: python lab/watcher.py --drill-end {{ $labels.bot }} if a drill was left on"

        # Ingest writes an error snapshot for a bot whose API does not answer. Ingest runs
        # every 5 minutes, so 70m is a bot that stayed unreachable for 14 runs in a row. A bot
        # that is not in dry run also gets an error snapshot; TraderBotNotDryRun owns that case.
        - alert: TraderBotApiDown
          expr: trader_bot_snapshot_error == 1 unless on (bot) trader_bot_dry_run == 0
          for: 70m
          labels:
            severity: warning
            category: trading
          annotations:
            summary: "Freqtrade bot {{ $labels.bot }} did not answer two ingest runs in a row: kubectl -n freqtrade logs freqtrade-league-<row>"

        - alert: TraderIngestStale
          expr: trader_ingest_age_seconds > 20 * 60
          for: 5m
          labels:
            severity: warning
            category: trading
          annotations:
            summary: "No bot snapshot for {{ $value | humanizeDuration }}: check the freqtrade-ingest CronJob"

        # Backfill runs hourly and appends a few hundred candles; 4h without a new one is a stuck
        # job or an exchange that stopped serving.
        - alert: TraderCandlesStale
          expr: trader_candle_age_seconds > 4 * 3600
          for: 30m
          labels:
            severity: warning
            category: trading
          annotations:
            summary: "Newest {{ $labels.exchange }} candle is {{ $value | humanizeDuration }} old: check the freqtrade-backfill CronJob"

        # The futures job runs daily at 05:35 UTC. Funding settles at 00:00, 08:00 and 16:00, so just before
        # a run the newest row is the previous day's 00:00 settlement, about 29.6h old; past 32h a day was
        # missed, and missed funding is lost once it ages past the exchange's few months of history.
        - alert: TraderFuturesStale
          expr: trader_futures_age_seconds > 32 * 3600
          for: 30m
          labels:
            severity: warning
            category: trading
          annotations:
            summary: "Newest {{ $labels.exchange }} {{ $labels.kind }} row is {{ $value | humanizeDuration }} old: check the freqtrade-futures CronJob"

        - alert: TraderRunFailed
          expr: trader_run_ok == 0
          labels:
            severity: warning
            category: trading
            fleet: fix  # a failed nightly run is an agent's to fix, like TraderRunStale
          annotations:
            summary: "The newest {{ $labels.kind }} run failed: its runs row on trader.kblab.me/runs says why"

        # The nightly reproduce check (strategy repo lab/reproduce.py, last step of the analysis job) ran a
        # sample of cached backtest chunks and walk-forward folds again and one came out different: the
        # cache is serving results the code no longer produces. Its runs row on trader.kblab.me/runs names
        # which ones and what differed. Rerunning will not clear it: find what changed (image, freqtrade,
        # a config, candles) and why it is missing from the cache key.
        - alert: TraderReproMismatch
          expr: trader_repro_mismatch > 0
          labels:
            severity: critical
            category: trading
          annotations:
            summary: "{{ $value }} cached result(s) did not reproduce: see the newest reproduce run on trader.kblab.me/runs"

        # Analysis (02:45, 18h guard) and walk-forward (01:00, 8h guard, WF_BUDGET_S records a catching-up run as a
        # success) are both nightly, so two ok runs are at most about 35 h apart: past 36 h one night produced nothing.
        # At 50 h with no `fleet: fix`, the 2026-11-12 and 11-13 outage reached no agent and fired only on day two.
        # Calibration is weekly (Saturday 10:00), so it is stale after 8 days.
        - alert: TraderRunStale
          expr: |
            time() - trader_run_last_ok_timestamp_seconds{kind=~"analysis|walkforward"} > 36 * 3600
              or time() - trader_run_last_ok_timestamp_seconds{kind="calibration"} > 8 * 86400
          for: 15m
          labels:
            severity: warning
            category: trading
            fleet: fix
          annotations:
            summary: "No successful {{ $labels.kind }} run for {{ $value | humanizeDuration }}"

        # Shadow paper accounts (strategy repo lab/shadow.py, a step of the nightly analysis) gain a mark for
        # yesterday each night, so the newest mark is under about 45 h old even when the run ends late. Past 50 h
        # the step marked nothing: a missed night, or the step failing inside a run that otherwise ended ok.
        # Only while an account is open; when every account has retired the newest mark rightly stops moving.
        - alert: TraderShadowMarksStale
          expr: trader_shadow_marked_age_seconds > 50 * 3600 and on () sum(trader_shadow_accounts{state!="retired"}) > 0
          for: 15m
          labels:
            severity: warning
            category: trading
          annotations:
            summary: "The newest shadow account mark is {{ $value | humanizeDuration }} old: the analysis shadow step marked nothing; see the shadow_* keys in the newest analysis run and trader.kblab.me/accounts"

        # A lab pod the scheduler cannot place. The default KubePodNotReady skips Job pods, and
        # TraderRunStale then waited 50 h, so on 2026-11-11 both nightly pods sat Pending 7 h unseen after
        # razer-laptop's allocatable CPU fell below their request (home-config #732). `fleet: fix` sends
        # it to the agent fleet (see homelab-capacity.disk): the fix is in apps/freqtrade/README.md.
        - alert: TraderLabPodUnschedulable
          expr: max by (pod) (kube_pod_status_unschedulable{namespace="freqtrade"}) > 0
          for: 30m
          labels:
            severity: warning
            category: trading
            fleet: fix
          annotations:
            summary: "{{ $labels.pod }} cannot be scheduled: compare its requests with the nodes' allocatable (kubectl describe pod)"

        # Event-contract markets (strategy repo lab/markets, docs/markets.md). A venue reports while
        # it has a recorder sweep in the last 7 days, so removing a venue's CronJob ends its series
        # instead of alerting forever. 15 minutes is the paper league's max_book_age_min: past it the
        # league already takes no entries on that venue. Polymarket global sweeps every 15 minutes
        # (about 10 a sweep), so it gets the same two missed ticks: 45 minutes.
        - alert: TraderMarketsRecorderStale
          expr: >-
            trader_markets_sweep_age_seconds{venue!="polymarket"} > 15 * 60
            or trader_markets_sweep_age_seconds{venue="polymarket"} > 45 * 60
          labels:
            severity: warning
            category: trading
          annotations:
            summary: "No good {{ $labels.venue }} recorder sweep for {{ $value | humanizeDuration }}: the paper league takes no entries there; failed sweeps and their errors are on trader.kblab.me/markets"

        # A sweep is scheduled every 5 minutes with Forbid, so one that runs past 5 minutes makes the next
        # tick skip and thins the book. This reads the newest good sweep's run time.
        - alert: TraderMarketsSweepSlow
          expr: trader_markets_sweep_duration_seconds{venue!="polymarket"} > 5 * 60
          for: 10m
          labels:
            severity: warning
            category: trading
          annotations:
            summary: "{{ $labels.venue }} recorder sweep took {{ $value | humanizeDuration }}, past the 5 minute schedule: the next tick is skipped"

        # Polymarket global sweeps every 15 minutes and its job is killed at 15 (the compact job's grace),
        # so a sweep past 12 minutes is close to dying before it records anything.
        - alert: TraderMarketsGlobalSweepSlow
          expr: trader_markets_sweep_duration_seconds{venue="polymarket"} > 12 * 60
          for: 30m
          labels:
            severity: warning
            category: trading
          annotations:
            summary: "polymarket recorder sweep took {{ $value | humanizeDuration }}, close to the 15 minute deadline that kills the job"

        # A sweep is every 5 minutes, so 3 failures in an hour is a quarter of them: an adapter or
        # venue error that keeps coming back even while some sweeps still land.
        - alert: TraderMarketsAdapterErrors
          expr: trader_markets_sweeps_failed_1h >= 3
          labels:
            severity: warning
            category: trading
          annotations:
            summary: "{{ $value }} {{ $labels.venue }} recorder sweeps failed in the last hour: market_sweeps.error on trader.kblab.me/markets"

        # Paper money only: a rehearsal of the book's hard stop (strategy repo lab/suggest.toml
        # [book] hard_stop, 0.15 of capital below peak). The peak is the last 30 days of marks.
        - alert: TraderPaperDrawdown
          expr: (max_over_time(trader_paper_equity[30d]) - trader_paper_equity) / trader_paper_capital > 0.15
          for: 15m
          labels:
            severity: warning
            category: trading
          annotations:
            summary: "Paper account {{ $labels.account }} is {{ $value | humanizePercentage }} of its capital below its peak: past the book's hard stop; trader.kblab.me/markets/book"
