apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-scheduled-jobs
  namespace: monitoring
  labels:
    app.kubernetes.io/name: homelab-scheduled-jobs
    app.kubernetes.io/part-of: monitoring
    # REQUIRED. The Prometheus CR selects rules with
    # ruleSelector.matchLabels.release=kube-prometheus-stack. Without this
    # label the CR applies cleanly, `kubectl get prometheusrule` shows it,
    # and Prometheus silently ignores it forever.
    release: kube-prometheus-stack
spec:
  groups:
    - name: homelab-scheduled-jobs.alerts
      interval: 1m
      rules:
        # These replace the bundled KubeJobFailed (disabled in helm-values.yaml).
        # That rule fires once per failed Job object, and a failed Job stays
        # until failedJobsHistoryLimit rotates it out, so a later green run
        # never resolved it: on 2026-11-11 it held 41 alerts, some from August,
        # all in one Alertmanager group, and a real NodeDiskLow went unread.
        #
        # One alert per CronJob, firing while its newest failed run started
        # after its last successful one. The next green run resolves it.
        - alert: HomelabCronJobFailed
          expr: |
            (
              max by (namespace, owner_name) (
                (kube_job_status_start_time * on (namespace, job_name) group_left (owner_name) kube_job_owner{owner_kind="CronJob"})
                and on (namespace, job_name) (kube_job_failed{condition="true"} > 0)
              )
              > on (namespace, owner_name)
              max by (namespace, owner_name) (
                label_replace(kube_cronjob_status_last_successful_time, "owner_name", "$1", "cronjob", "(.*)")
              )
            )
            or
            (
              max by (namespace, owner_name) (
                (kube_job_status_start_time * on (namespace, job_name) group_left (owner_name) kube_job_owner{owner_kind="CronJob"})
                and on (namespace, job_name) (kube_job_failed{condition="true"} > 0)
              )
              unless on (namespace, owner_name)
              label_replace(kube_cronjob_status_last_successful_time, "owner_name", "$1", "cronjob", "(.*)")
            )
          for: 15m
          labels:
            severity: warning
            category: scheduled-jobs
          annotations:
            summary: "CronJob failing: {{ $labels.namespace }}/{{ $labels.owner_name }}"
            description: >-
              The newest run of {{ $labels.namespace }}/{{ $labels.owner_name }}
              failed and no run has succeeded since. Logs:
              kubectl -n {{ $labels.namespace }} get jobs, then logs of the newest
              failed one. Resolves on the next successful run.

        # A failed Job no CronJob owns (a bootstrap or one-off Job) has no next
        # run to resolve it. It fires until the Job is fixed or deleted.
        - alert: HomelabJobFailed
          expr: |
            max by (namespace, job_name) (kube_job_failed{condition="true"} > 0)
            unless on (namespace, job_name) kube_job_owner{owner_kind="CronJob"}
          for: 15m
          labels:
            severity: warning
            category: scheduled-jobs
          annotations:
            summary: "Job failed: {{ $labels.namespace }}/{{ $labels.job_name }}"
            description: >-
              {{ $labels.namespace }}/{{ $labels.job_name }} failed and no CronJob
              will re-run it. Fix and re-run it, or delete the Job once read.

        # A CronJob that stops being scheduled at all is the quietest failure
        # of the lot: no failed job exists to alert on, the check simply stops.
        #
        # Measured against each CronJob's OWN next_schedule_time, not a flat
        # "hasn't run in 48h". A flat threshold looks right until you notice
        # nas/ runs four WEEKLY jobs (0 5 * * 0 and friends) - it would have
        # paged on all of them every single week for being healthy, which is
        # how an alert teaches people to ignore it. This form self-adjusts to
        # daily and weekly schedules alike.
        - alert: HomelabCronJobNotScheduling
          expr: |
            time() - kube_cronjob_next_schedule_time{namespace!~"kube-system|flux-system"}
              > 6 * 3600
            and on (namespace, cronjob) kube_cronjob_spec_suspend == 0
          for: 1h
          labels:
            severity: warning
            category: scheduled-jobs
          annotations:
            summary: "CronJob overdue: {{ $labels.namespace }}/{{ $labels.cronjob }}"
            description: >-
              {{ $labels.namespace }}/{{ $labels.cronjob }} is not suspended but
              is more than 6h past its own next scheduled run. Daily backups
              and the flux audit both live here; silence from one of them is
              indistinguishable from success without this alert.
