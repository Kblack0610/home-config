apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-scheduled-jobs
  namespace: monitoring
  labels:
    app.kubernetes.io/name: homelab-scheduled-jobs
    app.kubernetes.io/part-of: monitoring
    # REQUIRED. The Prometheus CR selects rules with
    # ruleSelector.matchLabels.release=kube-prometheus-stack. Without this
    # label the CR applies cleanly, `kubectl get prometheusrule` shows it,
    # and Prometheus silently ignores it forever.
    release: kube-prometheus-stack
spec:
  groups:
    - name: homelab-scheduled-jobs.alerts
      interval: 1m
      rules:
        # NOTE: there is deliberately no "job failed" alert here. The bundled
        # kube-prometheus-stack rule KubeJobFailed already covers it with the
        # same metric, threshold and 15m window, and it routes to the same
        # ntfy topic - a second copy would just page twice for every failure.
        #
        # KubeJobFailed had in fact been firing for flux-audit continuously,
        # because that job reported findings by exiting 1. An alert that fires
        # every night for something working is how alert fatigue starts, and
        # it is why nobody acted on it. That is fixed at the source in
        # apps/flux-audit/cronjob.yaml rather than by muting the alert here.

        # A CronJob that stops being scheduled at all is the quietest failure
        # of the lot: no failed job exists to alert on, the check simply stops.
        #
        # Measured against each CronJob's OWN next_schedule_time, not a flat
        # "hasn't run in 48h". A flat threshold looks right until you notice
        # nas/ runs four WEEKLY jobs (0 5 * * 0 and friends) - it would have
        # paged on all of them every single week for being healthy, which is
        # how an alert teaches people to ignore it. This form self-adjusts to
        # daily and weekly schedules alike.
        - alert: HomelabCronJobNotScheduling
          expr: |
            time() - kube_cronjob_next_schedule_time{namespace!~"kube-system|flux-system"}
              > 6 * 3600
            and on (namespace, cronjob) kube_cronjob_spec_suspend == 0
          for: 1h
          labels:
            severity: warning
            category: scheduled-jobs
          annotations:
            summary: "CronJob overdue: {{ $labels.namespace }}/{{ $labels.cronjob }}"
            description: >-
              {{ $labels.namespace }}/{{ $labels.cronjob }} is not suspended but
              is more than 6h past its own next scheduled run. Daily backups
              and the flux audit both live here; silence from one of them is
              indistinguishable from success without this alert.

    - name: homelab-scheduled-jobs.convergence
      rules:
        # The nightly ansible --check (apps/ansible-runner/cronjob.yaml) writes its PLAY RECAP
        # to the node-exporter textfile dir of the node its pod ran on, so a host can have a
        # file on several nodes: read only its newest run, and only if that is under 2 days old.
        # On 2026-11-10 razer ran a stale linux-ci-docker-cleanup.service without
        # ci-disk-prune.sh and filled to 91%; that night's check had listed the unit as changed.
        # `fleet: fix` queues it for an agent, see prometheus-rules-capacity.yaml.
        # Tests: apps/monitoring/tests/jobs.test.yaml.
        - alert: ConvergenceDrift
          expr: |
            max by (host) (
              ansible_convergence_recap{status="changed"} > 0
              and on (host, instance)
                ansible_convergence_run_timestamp_seconds
                  == on (host) group_left () max by (host) (ansible_convergence_run_timestamp_seconds)
              and on (host, instance)
                time() - ansible_convergence_run_timestamp_seconds < 2 * 86400
            )
          for: 15m
          labels:
            severity: warning
            category: scheduled-jobs
            fleet: fix
          annotations:
            summary: "{{ $labels.host }}: ansible --check would change {{ $value }} tasks: apps/ansible-runner/README.md#convergencedrift"
