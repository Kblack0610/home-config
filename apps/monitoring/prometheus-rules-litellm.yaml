apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: litellm-cost-control
  namespace: monitoring
  labels:
    app.kubernetes.io/name: litellm-cost-control
    app.kubernetes.io/part-of: monitoring
spec:
  groups:
    - name: litellm-cost-control.alerts
      interval: 1m
      rules:
        # Per-virtual-key budget burn-down. Thresholds are absolute dollars
        # remaining rather than ratios because the max-budget value isn't
        # exposed as its own gauge — only the remaining amount is.
        # Defaults assume the key matrix in apps/litellm/README.md
        # (smallest budget = $50/30d for opencode-default). Adjust if you
        # provision a key with a max_budget below $10.
        - alert: LiteLLMVirtualKeyBudgetWarning
          expr: litellm_remaining_api_key_budget_metric < 10
          for: 5m
          labels:
            severity: warning
            category: cost
          annotations:
            summary: "LiteLLM key {{ $labels.api_key_alias }} has < $10 remaining"
            description: "Virtual key '{{ $labels.api_key_alias }}' (hash {{ $labels.hashed_api_key }}) has ${{ printf \"%.2f\" $value }} remaining in its current budget window. Reset cadence depends on the key's budget_duration."

        - alert: LiteLLMVirtualKeyBudgetCritical
          expr: litellm_remaining_api_key_budget_metric < 2
          for: 5m
          labels:
            severity: critical
            category: cost
          annotations:
            summary: "LiteLLM key {{ $labels.api_key_alias }} budget nearly exhausted (< $2)"
            description: "Virtual key '{{ $labels.api_key_alias }}' has only ${{ printf \"%.2f\" $value }} left. Requests will start being rejected with budget_exceeded once it hits 0."

        # Catches runaway loops — spend > $1.50/min sustained for 10m means
        # >$2k/day burn rate. The threshold is a sanity check on automation,
        # not a normal-usage cap. The expr converts to $/min so the alert
        # value is directly readable in $/min units.
        - alert: LiteLLMHighSpendRate
          expr: sum(rate(litellm_spend_metric_total[5m]) * 60) by (api_key_alias) > 1.5
          for: 10m
          labels:
            severity: warning
            category: cost
          annotations:
            summary: "LiteLLM key {{ $labels.api_key_alias }} burning $/min very fast"
            description: "Key '{{ $labels.api_key_alias }}' is spending at {{ printf \"%.2f\" $value }}$/min sustained over 10 minutes. Likely a runaway agent loop or stuck retry."

        # Upstream model deployment health. litellm_deployment_state: 0=healthy,
        # 1=partial outage, 2=fully down (LiteLLM circuit-breaker semantic).
        - alert: LiteLLMUpstreamUnhealthy
          expr: litellm_deployment_state > 0
          for: 5m
          labels:
            severity: warning
            category: availability
          annotations:
            summary: "LiteLLM upstream {{ $labels.litellm_model_name }} unhealthy (state {{ $value }})"
            description: "Upstream '{{ $labels.litellm_model_name }}' (provider {{ $labels.api_provider }}) is in deployment_state {{ $value }} — LiteLLM is shedding traffic from it. Check api_base reachability and upstream service logs."

        # Proxy-side failure rate across all routes. Catches gateway-level
        # auth/config/database problems that aren't tied to a single upstream.
        - alert: LiteLLMHighFailureRate
          expr: |
            sum(rate(litellm_proxy_failed_requests_metric_total[10m]))
            /
            clamp_min(sum(rate(litellm_proxy_total_requests_metric_total[10m])), 0.001)
            > 0.10
          for: 10m
          labels:
            severity: warning
            category: availability
          annotations:
            summary: "LiteLLM proxy failure rate > 10% for 10m"
            description: "Across all virtual keys and models, {{ humanizePercentage $value }} of requests are failing. Check `kubectl -n ai-gateway logs deploy/litellm` for auth, DB, or upstream errors."
