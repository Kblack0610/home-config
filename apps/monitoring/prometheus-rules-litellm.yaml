apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: litellm-cost-control
  namespace: monitoring
  labels:
    app.kubernetes.io/name: litellm-cost-control
    app.kubernetes.io/part-of: monitoring
    # Required by the kube-prometheus-stack operator's ruleSelector
    # (matchLabels: release=kube-prometheus-stack). Without this label
    # the PrometheusRule resource exists in the cluster but Prometheus
    # silently ignores it.
    release: kube-prometheus-stack
spec:
  groups:
    - name: litellm-cost-control.alerts
      interval: 1m
      rules:
        # Per-virtual-key budget burn-down. Thresholds are absolute dollars
        # remaining rather than ratios because the max-budget value isn't
        # exposed as its own gauge — only the remaining amount is.
        # Defaults assume the key matrix in apps/litellm/README.md
        # (smallest budget = $50/30d for opencode-default). Adjust if you
        # provision a key with a max_budget below $10.
        - alert: LiteLLMVirtualKeyBudgetWarning
          expr: litellm_remaining_api_key_budget_metric < 10
          for: 5m
          labels:
            severity: warning
            category: cost
          annotations:
            summary: "LiteLLM key {{ $labels.api_key_alias }} has < $10 remaining"
            description: "Virtual key '{{ $labels.api_key_alias }}' (hash {{ $labels.hashed_api_key }}) has ${{ printf \"%.2f\" $value }} remaining in its current budget window. Reset cadence depends on the key's budget_duration."

        - alert: LiteLLMVirtualKeyBudgetCritical
          expr: litellm_remaining_api_key_budget_metric < 2
          for: 5m
          labels:
            severity: critical
            category: cost
          annotations:
            summary: "LiteLLM key {{ $labels.api_key_alias }} budget nearly exhausted (< $2)"
            description: "Virtual key '{{ $labels.api_key_alias }}' has only ${{ printf \"%.2f\" $value }} left. Requests will start being rejected with budget_exceeded once it hits 0."

        # The must-not-stop team (home services, comms, knowledge-engine,
        # lazer-eval; apps/litellm/README.md). The low-priority lazer-pool
        # team has no alert on purpose: running out there is expected.
        - alert: LiteLLMCoreTeamBudgetWarning
          expr: |
            litellm_remaining_team_budget_metric{team_alias="lazer-core"}
            / clamp_min(litellm_team_max_budget_metric{team_alias="lazer-core"}, 1) < 0.30
          for: 10m
          labels:
            severity: warning
            category: cost
          annotations:
            summary: "Lazer core team under 30% of its monthly budget"
            description: "lazer-core is at {{ humanizePercentage $value }} of its monthly budget. Must-not-stop consumers (karakeep, binks, mem0, Home Assistant, comms, knowledge-engine) stop at 0. Check who is spending: apps/litellm/README.md key list."

        - alert: LiteLLMCoreTeamBudgetCritical
          expr: |
            litellm_remaining_team_budget_metric{team_alias="lazer-core"}
            / clamp_min(litellm_team_max_budget_metric{team_alias="lazer-core"}, 1) < 0.10
          for: 5m
          labels:
            severity: critical
            category: cost
          annotations:
            summary: "Lazer core team under 10% of its monthly budget"
            description: "lazer-core is nearly spent. Must-not-stop consumers start failing with budget_exceeded at 0; fast falls back to Gemini only on an upstream error, not on a budget refusal."

        # Catches runaway loops — spend > $1.50/min sustained for 10m means
        # >$2k/day burn rate. The threshold is a sanity check on automation,
        # not a normal-usage cap. The expr converts to $/min so the alert
        # value is directly readable in $/min units.
        - alert: LiteLLMHighSpendRate
          expr: sum(rate(litellm_spend_metric_total[5m]) * 60) by (api_key_alias) > 1.5
          for: 10m
          labels:
            severity: warning
            category: cost
          annotations:
            summary: "LiteLLM key {{ $labels.api_key_alias }} burning $/min very fast"
            description: "Key '{{ $labels.api_key_alias }}' is spending at {{ printf \"%.2f\" $value }}$/min sustained over 10 minutes. Likely a runaway agent loop or stuck retry."

        # Upstream model deployment health. litellm_deployment_state: 0=healthy,
        # 1=partial outage, 2=fully down (LiteLLM circuit-breaker semantic).
        - alert: LiteLLMUpstreamUnhealthy
          expr: litellm_deployment_state > 0
          for: 5m
          labels:
            severity: warning
            category: availability
          annotations:
            summary: "LiteLLM upstream {{ $labels.litellm_model_name }} unhealthy (state {{ $value }})"
            description: "Upstream '{{ $labels.litellm_model_name }}' (provider {{ $labels.api_provider }}) at {{ $labels.api_base }} is in deployment_state {{ $value }}: LiteLLM is shedding traffic from it. Check api_base reachability and upstream service logs."

        # Proxy-side failure rate per requested route. Catches gateway-level
        # auth/config/database problems, and a quota-capped route (the OpenCode
        # Go routes refuse past their plan window) failing while the rest are
        # fine, which an all-routes ratio drowns. The volume floor keeps one
        # failed probe on an idle route from firing it.
        - alert: LiteLLMHighFailureRate
          expr: |
            (
              sum by (requested_model) (rate(litellm_proxy_failed_requests_metric_total[10m]))
              /
              clamp_min(sum by (requested_model) (rate(litellm_proxy_total_requests_metric_total[10m])), 0.001)
              > 0.10
            )
            and on (requested_model)
            sum by (requested_model) (increase(litellm_proxy_total_requests_metric_total[10m])) >= 5
          for: 10m
          labels:
            severity: warning
            category: availability
          annotations:
            summary: "LiteLLM route {{ $labels.requested_model }} failure rate > 10% for 10m"
            description: "{{ humanizePercentage $value }} of requests to '{{ $labels.requested_model }}' are failing. Check `kubectl -n ai-gateway logs deploy/litellm` for auth, DB, budget or upstream errors."

        # Guessed-key probing. Counts 401s at Traefik, because LiteLLM's own
        # failed-requests metric misses invalid-key 401s. Baseline is about 17 a
        # day (agents calling admin routes); 2026-11-07 a scanner sent 190k in
        # two hours (hc-213). A counter over a window, no hold, so a short burst
        # still fires.
        - alert: LiteLLMAuthFailureSpike
          expr: |
            sum(increase(traefik_service_requests_total{service="ai-gateway-litellm-4000@kubernetes",code="401"}[15m])) > 30
          labels:
            severity: warning
            category: security
          annotations:
            summary: "LiteLLM gateway: {{ $value | printf \"%.0f\" }} rejected keys in 15m"
            description: "Something is sending keys the gateway does not know. Spend is safe (an unknown key gets nothing), but find the caller: the keys tried are in LiteLLM_SpendLogs (status failure, error_code 401), and llm.kblab.me should have no public DNS record (dig +short llm.kblab.me @1.1.1.1 prints nothing). apps/litellm/README.md, Exposure."
