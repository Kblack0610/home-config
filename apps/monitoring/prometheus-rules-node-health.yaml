apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-node-health
  namespace: monitoring
  labels:
    app.kubernetes.io/name: homelab-node-health
    app.kubernetes.io/part-of: monitoring
    # REQUIRED: the kube-prometheus-stack Prometheus selects PrometheusRules with
    # ruleSelector matchLabels {release: kube-prometheus-stack}. Without this label
    # the operator never picks up this file and none of these alerts load — which
    # is exactly why the 2026-07-09 DiskPressure outage (and any NodeDown before
    # it) paged no one. Do not remove.
    release: kube-prometheus-stack
spec:
  groups:
    - name: homelab-node-health.alerts
      rules:
        # A monitored machine stopped responding to node-exporter scrapes. Covers
        # k3s nodes (job=node-exporter, the DaemonSet), Macs (mac-nodes), and the
        # standalone Pi3 (standalone-nodes). This is the alert that would have
        # paged on the thinkcentre power outage. iot-pi-nodes (sleepy Pi Zeros)
        # are intentionally excluded to avoid false pages.
        - alert: NodeDown
          expr: up{job=~"node-exporter|mac-nodes|standalone-nodes"} == 0
          for: 2m
          labels:
            severity: critical
            category: node-health
          annotations:
            summary: "Node down: {{ $labels.instance }} ({{ $labels.job }})"
            description: >-
              node-exporter target {{ $labels.instance }} (job {{ $labels.job }})
              has been unreachable for 2m — the host may be powered off, crashed,
              or off the network.
        # The whole node-exporter scrape job vanished — Prometheus lost its
        # targets, or every k3s node-exporter is gone. Monitoring is blind.
        - alert: NodeExporterAbsent
          expr: absent(up{job="node-exporter"})
          for: 5m
          labels:
            severity: critical
            category: node-health
          annotations:
            summary: "node-exporter scrape job is absent"
            description: >-
              No node-exporter (DaemonSet) targets are being scraped at all.
              Prometheus may have lost its scrape config, or the DaemonSet is
              down cluster-wide — node-down detection is currently blind.
        # NodeDown matches standalone-nodes, but the absent() check above did
        # not: if the pi3 target disappeared from Prometheus entirely, NodeDown
        # would stop matching and nothing would say so. That box runs the LAN's
        # only DNS resolver, so it is the worst one to go quietly unmonitored.
        - alert: StandaloneNodeExporterAbsent
          expr: absent(up{job="standalone-nodes"})
          for: 15m
          labels:
            severity: warning
            category: node-health
          annotations:
            summary: "standalone-nodes scrape job is absent"
            description: >-
              No standalone-nodes targets are being scraped, so pi3 (AdGuard,
              192.168.1.193) is unmonitored and NodeDown cannot fire for it.
              Check apps/monitoring/external-standalone-nodes.yaml and that
              prometheus-node-exporter is running on the host; it is installed
              by ansible/roles/adguard.
        # kubelet raised DiskPressure on a node -> it taints the node and evicts
        # pods. On 2026-07-09 this took down the whole workload cluster (forgejo
        # backups filled asus-laptop's root disk). This is the fast, direct signal
        # for that failure mode. NOTE: in-cluster alerting can itself be evicted
        # by the pressure it is trying to report (alertmanager runs on a node) —
        # the out-of-cluster Sentinel watch (~/.agent/watches/home-k3s-node-disk)
        # is the belt-and-suspenders that survives that case.
        - alert: NodeDiskPressure
          expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
          for: 2m
          labels:
            severity: critical
            category: node-health
          annotations:
            summary: "DiskPressure on {{ $labels.node }}"
            description: >-
              kubelet reports DiskPressure on node {{ $labels.node }} — the node
              is tainted and pods are being evicted/blocked. Free disk on the
              node's root filesystem now (check hostPath backups, containerd, logs).
        # Disk thresholds and the kubelet eviction line: prometheus-rules-capacity.yaml.

        # A node's clock has stopped syncing. Found by accident 2026-07-15:
        # hp-victus had drifted ~102s behind the cluster with NO time daemon
        # running at all (timesyncd disabled, chrony/ntpd absent) - and NOTHING
        # was watching. node_timex_sync_status was already scraped on every node,
        # it was just never alerted on. It surfaced only because the
        # fleet-exporter happened to land on that node and read gatus results as
        # future-dated, rendering the whole fleet DOWN.
        #
        # The cheap symptom was a wrong dashboard. The expensive ones do not look
        # like clock problems when they break: TLS validation (certs are
        # time-bound), cross-node log ordering, k8s lease/token expiry.
        #
        # iot-pi-nodes excluded for the same reason as NodeDown - the Pi Zeros
        # sleep by design and would page constantly.
        - alert: NodeClockNotSynchronising
          expr: node_timex_sync_status{job=~"node-exporter|mac-nodes|standalone-nodes"} == 0
          for: 15m
          labels:
            severity: warning
            category: node-health
          annotations:
            summary: "Clock not syncing on {{ $labels.instance }}"
            description: >-
              {{ $labels.instance }} reports node_timex_sync_status=0 - no NTP sync
              for 15m. Fix with the time-sync ansible role:
              `cd ansible && ansible-playbook playbooks/site.yml --tags time --limit <host>`.
              Check `journalctl -u systemd-timesyncd` and udp/123 egress.

        # Drift big enough to break things even if a daemon claims to be syncing.
        # 60s is far outside NTP's normal correction range and past where TLS and
        # k8s leases start misbehaving.
        - alert: NodeClockSkewed
          expr: >-
            abs(node_time_seconds{job=~"node-exporter|mac-nodes|standalone-nodes"}
                - on() group_left() avg(node_time_seconds{job="node-exporter"})) > 60
          for: 10m
          labels:
            severity: warning
            category: node-health
          annotations:
            summary: "Clock skew on {{ $labels.instance }}"
            description: >-
              {{ $labels.instance }} disagrees with the cluster's mean clock by
              more than 60s. hp-victus sat 102s out and it took a dashboard
              rendering the whole fleet DOWN to notice.

        # pi3 rebooted. Uptime rather than changes(boot_time): a reboot after a
        # long outage would leave the previous sample outside any changes()
        # window and never fire. With roles/hw-watchdog armed, an unplanned
        # reboot here usually means the watchdog caught a freeze - the
        # timestamp is the evidence, so it is worth a page even after recovery.
        - alert: StandaloneHostRebooted
          expr: >-
            (node_time_seconds{job="standalone-nodes"}
              - node_boot_time_seconds{job="standalone-nodes"}) < 1800
          labels:
            severity: warning
            category: node-health
          annotations:
            summary: "{{ $labels.instance }} rebooted (watchdog, power, or by hand)"
            description: >-
              {{ $labels.instance }} has been up for under 30 minutes. If nobody
              rebooted it, it froze and the hardware watchdog reset it, or it lost
              power. Its last kernel messages before the reset are on pi5-master:
              `ssh kblack0610@192.168.1.20 'journalctl -u netconsole-receiver --since "-1h"'`.
              Also check `rpi_throttled{when="since_boot"}` for undervoltage.

        # The Pi firmware latched an undervoltage event since boot. The latch
        # holds until reboot, so this catches a brownout too short for any
        # one-minute sample to see. Metric: roles/crash-evidence.
        - alert: PiUndervoltageSinceBoot
          expr: rpi_throttled{flag="undervoltage",when="since_boot"} == 1
          labels:
            severity: warning
            category: node-health
          annotations:
            summary: "Undervoltage on {{ $labels.instance }} since boot"
            description: >-
              The Raspberry Pi firmware recorded supply voltage below ~4.63V at
              least once since {{ $labels.instance }} last booted. That is the
              leading suspect for its silent freezes. Replace the PSU and cable
              with the official 5.1V supply. Stays firing until the next reboot.

        # CPU package temperature (Intel coretemp, AMD k10temp), any node that
        # exports it. 2026-10-23 the Unity nightly held asus-laptop at 93-96C
        # for hours before it dropped off the LAN, and hp-victus peaked at 98C
        # of its 100C crit; nothing paged. Both rules read the peak over a
        # window, not the instant: a throttling CPU saws between its limit and
        # the 70s, which reset the old instant rules' `for:` every dip. On
        # 2026-11-13 hp-victus spent 29 min above 90C, peaked at 100C and went
        # NotReady while those rules sat pending. Replay, 7 days to 2026-11-13:
        # this one 1165 min on asus-laptop and 660 on hp-victus, the old one 0.
        # Not the workstation, for the reason under NodeCpuCritical.
        - alert: NodeCpuHot
          expr: >-
            max_over_time(instance:node_cpu_package_temp:celsius{instance!="192.168.1.2:9100"}[10m]) > 90
          for: 10m
          labels:
            severity: warning
            category: node-health
          annotations:
            summary: "CPU hot on {{ $labels.instance }} (peaks of {{ $value }}C for 10m)"
            description: >-
              The CPU package on {{ $labels.instance }} has peaked above 90C in
              every 10m window for 10m. Run scripts/host-headroom.py on it and
              move work off; on a laptop, check thermal-cap.service applied after
              the last boot (systemctl status thermal-cap) and lower the cap in
              inventory.yml (thermal_capped) if it did.
        # Not the workstation: a 7900X sits at 95C under load by design, which paged 33
        # times in 2 days to 2026-10-31, and the fleet-thermal watch already owns it.
        # Replay, 7 days to 2026-11-13: 90 min on hp-victus, 0 elsewhere.
        - alert: NodeCpuCritical
          expr: >-
            max_over_time(instance:node_cpu_package_temp:celsius{instance!="192.168.1.2:9100"}[5m]) > 95
          for: 5m
          labels:
            severity: critical
            category: node-health
          annotations:
            summary: "CPU at {{ $value }}C on {{ $labels.instance }}"
            description: >-
              The CPU package on {{ $labels.instance }} has peaked above 95C in
              every 5m window for 5m, close to its thermal limit. The host may
              throttle hard or shut down; asus-laptop dropped off the LAN after
              hours here on 2026-10-23, and hp-victus went NotReady on
              2026-11-13. Move work off it now.
        # Margin from the drive's own warning threshold (temp1_max), which differs per
        # model. hp-victus sat at 77-80C (max 84.85) for 70 min before its NVMe dropped
        # off the bus and the node hung on 2026-11-13. Replay, 14 days to 2026-11-14:
        # fires only on hp-victus, 11-13 22:33 to 23:43.
        - alert: NodeNvmeHot
          expr: >-
            node_hwmon_temp_celsius{chip=~"nvme.*",sensor="temp1"}
            > on (instance, chip, sensor)
            (node_hwmon_temp_max_celsius{chip=~"nvme.*",sensor="temp1"} - 8)
          for: 10m
          labels:
            severity: warning
            category: node-health
          annotations:
            summary: "NVMe {{ $labels.chip }} at {{ $value }}C on {{ $labels.instance }}"
            description: >-
              {{ $labels.chip }} on {{ $labels.instance }} has been within 8C of
              its warning temperature for 10m. An NVMe this hot can throttle or
              drop off the PCIe bus; hp-victus did, and hung, on 2026-11-13.
              Move work off the host and check its airflow and CPU load.
        # A laptop node lost its charger. hp-victus came back from a power-cycle
        # on 2026-11-14 with the charger out, ran 95 minutes on battery at
        # ~20 W and died at 01:41Z; nothing said so. Hosts with no Mains supply
        # never match, and a device battery (scope Device, e.g. a mouse) is not
        # the host's.
        - alert: NodeOnBattery
          expr: >-
            node_power_supply_online == 0
            and on (instance, power_supply) node_power_supply_info{type="Mains"}
          for: 5m
          labels:
            severity: warning
            category: node-health
          annotations:
            summary: "{{ $labels.instance }} is on battery ({{ $labels.power_supply }} offline)"
            description: >-
              The mains supply {{ $labels.power_supply }} on {{ $labels.instance }}
              has read offline for 5m, so the host runs on its battery and goes
              down when it is flat (hp-victus lasted about 95 minutes on
              2026-11-14). Check the charger is plugged in and seated.
        - alert: NodeBatteryLow
          expr: >-
            (
              node_power_supply_capacity < 30
              and on (instance, power_supply) node_power_supply_info{type="Battery",scope=""}
            )
            and on (instance)
            count by (instance) (
              node_power_supply_online == 0
              and on (instance, power_supply) node_power_supply_info{type="Mains"}
            )
          for: 2m
          labels:
            severity: critical
            category: node-health
          annotations:
            summary: "{{ $labels.instance }} battery at {{ $value }}% off mains"
            description: >-
              {{ $labels.power_supply }} on {{ $labels.instance }} is at
              {{ $value }}% with the charger offline. The host goes down within
              minutes; plug the charger in now.
    - name: homelab-node-health.recording
      rules:
        - record: instance:node_cpu_package_temp:celsius
          expr: >-
            max by (instance) (
              node_hwmon_temp_celsius
              * on (instance, chip) group_left (chip_name)
              node_hwmon_chip_names{chip_name=~"coretemp|k10temp"}
            )
