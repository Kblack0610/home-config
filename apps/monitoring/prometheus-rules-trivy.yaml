apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-vulnerabilities
  namespace: monitoring
  labels:
    app.kubernetes.io/name: homelab-vulnerabilities
    app.kubernetes.io/part-of: monitoring
    # REQUIRED. ruleSelector.matchLabels.release=kube-prometheus-stack on the
    # Prometheus CR. Without it this file applies cleanly and is never
    # evaluated -- see the note in prometheus-rules-app-health.yaml.
    release: kube-prometheus-stack
spec:
  groups:
    - name: homelab-vulnerabilities.alerts
      interval: 5m
      rules:
        # Deliberately not "any CVE": trivy runs with ignoreUnfixed
        # (apps/trivy-operator/helmrelease.yaml), so every count here has a fix
        # and the action is bumping a tag. One alert per image, not per
        # container: per container it was 174 alerts for 73 images on
        # 2026-11-11 (home-assistant's seed init containers alone were 40), and
        # ReplicaSets scaled to zero by a rollout are left out. These route to
        # the security digest (helm-values.yaml), never a page.
        - alert: HomelabCriticalVulnerability
          expr: |
            max by (image_registry, image_repository, image_tag) (
              trivy_image_vulnerabilities{severity="Critical"}
              unless on (namespace, resource_name)
              label_replace(kube_replicaset_spec_replicas == 0, "resource_name", "$1", "replicaset", "(.*)")
            ) > 0
          for: 30m
          labels:
            severity: warning
            category: security
          annotations:
            summary: '{{ printf "%.0f" $value }} critical CVEs in {{ $labels.image_repository }}:{{ $labels.image_tag }}'
            description: >-
              {{ $labels.image_registry }}/{{ $labels.image_repository }}:{{ $labels.image_tag }}
              has {{ printf "%.0f" $value }} CRITICAL vulnerabilities with a fix
              available. Bump the pinned tag to a release that fixes them. Where
              it runs: kubectl get vulnerabilityreports -A -o wide | grep
              {{ $labels.image_repository }}

        # The scanner going blind is its own failure. A cluster with zero
        # vulnerability reports looks identical to a perfectly clean one.
        - alert: HomelabVulnerabilityScannerDown
          expr: |
            absent(trivy_image_vulnerabilities) == 1
          for: 1h
          labels:
            severity: warning
            category: security
          annotations:
            summary: "Trivy is not reporting any vulnerability metrics"
            description: >-
              No trivy_image_vulnerabilities series exist. Either the operator
              is down or its ServiceMonitor is not being scraped, which means
              the cluster is unscanned while appearing clean.
