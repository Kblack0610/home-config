# promtool test rules. Run with scripts/test-prometheus-rules.sh. HomelabBackupStale takes its
# line from each CronJob's own schedule: one run interval plus 12h. Every Job here last
# completed at time 0, so the stale age is the eval time.
rule_files:
  - backup-drive.rules.yaml
evaluation_interval: 5m

tests:
  - name: a daily backup trips at 36h, suspended or not, and so does one with no schedule series
    interval: 5m
    input_series:
      - series: 'kube_cronjob_info{namespace="immich",cronjob="immich-backup",schedule="0 3 * * *"}'
        values: '1x500'
      - series: 'kube_job_owner{namespace="immich",job_name="immich-backup-1",owner_kind="CronJob",owner_name="immich-backup"}'
        values: '1x500'
      - series: 'kube_job_status_completion_time{namespace="immich",job_name="immich-backup-1"}'
        values: '0x500'
      # offsite-backup is suspended on purpose as the negative control (hc-337): it must page.
      - series: 'kube_cronjob_info{namespace="offsite-backup",cronjob="offsite-backup",schedule="0 1 * * *"}'
        values: '1x500'
      - series: 'kube_cronjob_spec_suspend{namespace="offsite-backup",cronjob="offsite-backup"}'
        values: '1x500'
      - series: 'kube_job_owner{namespace="offsite-backup",job_name="offsite-backup-1",owner_kind="CronJob",owner_name="offsite-backup"}'
        values: '1x500'
      - series: 'kube_job_status_completion_time{namespace="offsite-backup",job_name="offsite-backup-1"}'
        values: '0x500'
      # Weekdays only names a day range, not one day, so it keeps the daily line.
      - series: 'kube_cronjob_info{namespace="langfuse",cronjob="langfuse-backup",schedule="15 3 * * 1-5"}'
        values: '1x500'
      - series: 'kube_job_owner{namespace="langfuse",job_name="langfuse-backup-1",owner_kind="CronJob",owner_name="langfuse-backup"}'
        values: '1x500'
      - series: 'kube_job_status_completion_time{namespace="langfuse",job_name="langfuse-backup-1"}'
        values: '0x500'
      # No kube_cronjob_info series: the line falls back to 36h rather than none.
      - series: 'kube_job_owner{namespace="frigate",job_name="frigate-backup-1",owner_kind="CronJob",owner_name="frigate-backup"}'
        values: '1x500'
      - series: 'kube_job_status_completion_time{namespace="frigate",job_name="frigate-backup-1"}'
        values: '0x500'
    alert_rule_test:
      - eval_time: 36h
        alertname: HomelabBackupStale
        exp_alerts: []
      - eval_time: 37h
        alertname: HomelabBackupStale
        exp_alerts:
          - exp_labels: {alertname: HomelabBackupStale, severity: critical, fleet: fix, system: recovery, category: backup, namespace: immich, owner_name: immich-backup}
            exp_annotations:
              runbook_url: https://git.kennethblack.me/kblack0610/home-config/src/branch/master/docs/backup-runbook.md
              summary: "Backup stale: immich/immich-backup"
              description: "immich/immich-backup has not completed successfully in 133200 seconds, over one run interval plus 12h (36h daily, 7.5d weekly). The job may be failing, or succeeding while writing nowhere - check the destination is really mounted, not merely listed as mounted."
          - exp_labels: {alertname: HomelabBackupStale, severity: critical, fleet: fix, system: recovery, category: backup, namespace: offsite-backup, owner_name: offsite-backup}
            exp_annotations:
              runbook_url: https://git.kennethblack.me/kblack0610/home-config/src/branch/master/docs/backup-runbook.md
              summary: "Backup stale: offsite-backup/offsite-backup"
              description: "offsite-backup/offsite-backup has not completed successfully in 133200 seconds, over one run interval plus 12h (36h daily, 7.5d weekly). The job may be failing, or succeeding while writing nowhere - check the destination is really mounted, not merely listed as mounted."
          - exp_labels: {alertname: HomelabBackupStale, severity: critical, fleet: fix, system: recovery, category: backup, namespace: langfuse, owner_name: langfuse-backup}
            exp_annotations:
              runbook_url: https://git.kennethblack.me/kblack0610/home-config/src/branch/master/docs/backup-runbook.md
              summary: "Backup stale: langfuse/langfuse-backup"
              description: "langfuse/langfuse-backup has not completed successfully in 133200 seconds, over one run interval plus 12h (36h daily, 7.5d weekly). The job may be failing, or succeeding while writing nowhere - check the destination is really mounted, not merely listed as mounted."
          - exp_labels: {alertname: HomelabBackupStale, severity: critical, fleet: fix, system: recovery, category: backup, namespace: frigate, owner_name: frigate-backup}
            exp_annotations:
              runbook_url: https://git.kennethblack.me/kblack0610/home-config/src/branch/master/docs/backup-runbook.md
              summary: "Backup stale: frigate/frigate-backup"
              description: "frigate/frigate-backup has not completed successfully in 133200 seconds, over one run interval plus 12h (36h daily, 7.5d weekly). The job may be failing, or succeeding while writing nowhere - check the destination is really mounted, not merely listed as mounted."

  - name: weekly backups trip at 7d plus 12h while a daily one beside them trips at 36h
    interval: 5m
    input_series:
      - series: 'kube_cronjob_info{namespace="freqtrade",cronjob="freqtrade-lab-backup",schedule="50 2 * * 0"}'
        values: '1x2200'
      - series: 'kube_job_owner{namespace="freqtrade",job_name="freqtrade-lab-backup-1",owner_kind="CronJob",owner_name="freqtrade-lab-backup"}'
        values: '1x2200'
      - series: 'kube_job_status_completion_time{namespace="freqtrade",job_name="freqtrade-lab-backup-1"}'
        values: '0x2200'
      # The other two spellings of weekly.
      - series: 'kube_cronjob_info{namespace="w",cronjob="at-weekly-backup",schedule="@weekly"}'
        values: '1x2200'
      - series: 'kube_job_owner{namespace="w",job_name="at-weekly-backup-1",owner_kind="CronJob",owner_name="at-weekly-backup"}'
        values: '1x2200'
      - series: 'kube_job_status_completion_time{namespace="w",job_name="at-weekly-backup-1"}'
        values: '0x2200'
      - series: 'kube_cronjob_info{namespace="w",cronjob="sun-backup",schedule="0 4 * * SUN"}'
        values: '1x2200'
      - series: 'kube_job_owner{namespace="w",job_name="sun-backup-1",owner_kind="CronJob",owner_name="sun-backup"}'
        values: '1x2200'
      - series: 'kube_job_status_completion_time{namespace="w",job_name="sun-backup-1"}'
        values: '0x2200'
      # A daily backup in the same namespace keeps its own 36h line.
      - series: 'kube_cronjob_info{namespace="w",cronjob="daily-backup",schedule="0 3 * * *"}'
        values: '1x2200'
      - series: 'kube_job_owner{namespace="w",job_name="daily-backup-1",owner_kind="CronJob",owner_name="daily-backup"}'
        values: '1x2200'
      - series: 'kube_job_status_completion_time{namespace="w",job_name="daily-backup-1"}'
        values: '0x2200'
      # nas is HomelabWeeklyBackupStale's, never this alert's.
      - series: 'kube_cronjob_info{namespace="nas",cronjob="eeg-backup",schedule="15 6 * * *"}'
        values: '1x2200'
      - series: 'kube_job_owner{namespace="nas",job_name="eeg-backup-1",owner_kind="CronJob",owner_name="eeg-backup"}'
        values: '1x2200'
      - series: 'kube_job_status_completion_time{namespace="nas",job_name="eeg-backup-1"}'
        values: '0x2200'
    alert_rule_test:
      - eval_time: 37h
        alertname: HomelabBackupStale
        exp_alerts:
          - exp_labels: {alertname: HomelabBackupStale, severity: critical, fleet: fix, system: recovery, category: backup, namespace: w, owner_name: daily-backup}
            exp_annotations:
              runbook_url: https://git.kennethblack.me/kblack0610/home-config/src/branch/master/docs/backup-runbook.md
              summary: "Backup stale: w/daily-backup"
              description: "w/daily-backup has not completed successfully in 133200 seconds, over one run interval plus 12h (36h daily, 7.5d weekly). The job may be failing, or succeeding while writing nowhere - check the destination is really mounted, not merely listed as mounted."
      - eval_time: 180h
        alertname: HomelabBackupStale
        exp_alerts:
          - exp_labels: {alertname: HomelabBackupStale, severity: critical, fleet: fix, system: recovery, category: backup, namespace: w, owner_name: daily-backup}
            exp_annotations:
              runbook_url: https://git.kennethblack.me/kblack0610/home-config/src/branch/master/docs/backup-runbook.md
              summary: "Backup stale: w/daily-backup"
              description: "w/daily-backup has not completed successfully in 648000 seconds, over one run interval plus 12h (36h daily, 7.5d weekly). The job may be failing, or succeeding while writing nowhere - check the destination is really mounted, not merely listed as mounted."
      - eval_time: 181h
        alertname: HomelabBackupStale
        exp_alerts:
          - exp_labels: {alertname: HomelabBackupStale, severity: critical, fleet: fix, system: recovery, category: backup, namespace: w, owner_name: daily-backup}
            exp_annotations:
              runbook_url: https://git.kennethblack.me/kblack0610/home-config/src/branch/master/docs/backup-runbook.md
              summary: "Backup stale: w/daily-backup"
              description: "w/daily-backup has not completed successfully in 651600 seconds, over one run interval plus 12h (36h daily, 7.5d weekly). The job may be failing, or succeeding while writing nowhere - check the destination is really mounted, not merely listed as mounted."
          - exp_labels: {alertname: HomelabBackupStale, severity: critical, fleet: fix, system: recovery, category: backup, namespace: freqtrade, owner_name: freqtrade-lab-backup}
            exp_annotations:
              runbook_url: https://git.kennethblack.me/kblack0610/home-config/src/branch/master/docs/backup-runbook.md
              summary: "Backup stale: freqtrade/freqtrade-lab-backup"
              description: "freqtrade/freqtrade-lab-backup has not completed successfully in 651600 seconds, over one run interval plus 12h (36h daily, 7.5d weekly). The job may be failing, or succeeding while writing nowhere - check the destination is really mounted, not merely listed as mounted."
          - exp_labels: {alertname: HomelabBackupStale, severity: critical, fleet: fix, system: recovery, category: backup, namespace: w, owner_name: at-weekly-backup}
            exp_annotations:
              runbook_url: https://git.kennethblack.me/kblack0610/home-config/src/branch/master/docs/backup-runbook.md
              summary: "Backup stale: w/at-weekly-backup"
              description: "w/at-weekly-backup has not completed successfully in 651600 seconds, over one run interval plus 12h (36h daily, 7.5d weekly). The job may be failing, or succeeding while writing nowhere - check the destination is really mounted, not merely listed as mounted."
          - exp_labels: {alertname: HomelabBackupStale, severity: critical, fleet: fix, system: recovery, category: backup, namespace: w, owner_name: sun-backup}
            exp_annotations:
              runbook_url: https://git.kennethblack.me/kblack0610/home-config/src/branch/master/docs/backup-runbook.md
              summary: "Backup stale: w/sun-backup"
              description: "w/sun-backup has not completed successfully in 651600 seconds, over one run interval plus 12h (36h daily, 7.5d weekly). The job may be failing, or succeeding while writing nowhere - check the destination is really mounted, not merely listed as mounted."

  - name: a newer success clears a stale daily backup
    interval: 5m
    input_series:
      - series: 'kube_cronjob_info{namespace="immich",cronjob="immich-backup",schedule="0 3 * * *"}'
        values: '1x500'
      - series: 'kube_job_owner{namespace="immich",job_name="immich-backup-1",owner_kind="CronJob",owner_name="immich-backup"}'
        values: '1x500'
      - series: 'kube_job_status_completion_time{namespace="immich",job_name="immich-backup-1"}'
        values: '0x500'
      # A run that completes at 30h (108000s) appears from then on.
      - series: 'kube_job_owner{namespace="immich",job_name="immich-backup-2",owner_kind="CronJob",owner_name="immich-backup"}'
        values: '_x360 1x140'
      - series: 'kube_job_status_completion_time{namespace="immich",job_name="immich-backup-2"}'
        values: '_x360 108000x140'
    alert_rule_test:
      - eval_time: 37h
        alertname: HomelabBackupStale
        exp_alerts: []
