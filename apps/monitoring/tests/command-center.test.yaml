# promtool test rules. Run with scripts/test-prometheus-rules.sh.
rule_files:
  - command-center.rules.yaml
evaluation_interval: 1m

tests:
  - name: per-core busy joins node-exporter to its host and renames the Windows core label
    interval: 1m
    input_series:
      - series: 'node_uname_info{instance="lin:9100",host="lin",job="standalone-nodes"}'
        values: '1x10'
      # idle all minute, then idle a quarter of it
      - series: 'node_cpu_seconds_total{instance="lin:9100",cpu="0",mode="idle"}'
        values: '0+60x10'
      - series: 'node_cpu_seconds_total{instance="lin:9100",cpu="1",mode="idle"}'
        values: '0+15x10'
      - series: 'windows_cpu_time_total{instance="win:9182",host="win",core="0,0",mode="idle"}'
        values: '0+30x10'
    promql_expr_test:
      - expr: cc:host_core_busy_ratio
        eval_time: 5m
        exp_samples:
          - labels: 'cc:host_core_busy_ratio{host="lin",cpu="0"}'
            value: 0
          - labels: 'cc:host_core_busy_ratio{host="lin",cpu="1"}'
            value: 0.75
          - labels: 'cc:host_core_busy_ratio{host="win",cpu="0,0"}'
            value: 0.5

  - name: per-runner cores join the textfile to its host and drop a stale file
    interval: 1m
    input_series:
      - series: 'node_uname_info{instance="lin:9100",host="lin",job="standalone-nodes"}'
        values: '1x10'
      - series: 'node_uname_info{instance="old:9100",host="old",job="standalone-nodes"}'
        values: '1x10'
      - series: 'ci_runner_cores_busy{instance="lin:9100",runner="lin-unity-pool-1"}'
        values: '3x10'
      - series: 'ci_runner_cpus_allowed{instance="lin:9100",runner="lin-unity-pool-1"}'
        values: '6x10'
      - series: 'node_textfile_mtime_seconds{instance="lin:9100",file="/var/lib/node-exporter-textfile/ci_runner.prom"}'
        values: '0+60x10'
      # the timer stopped at minute 0, so by minute 5 this host's reading is stale
      - series: 'ci_runner_cores_busy{instance="old:9100",runner="old-unity-pool-1"}'
        values: '9x10'
      - series: 'node_textfile_mtime_seconds{instance="old:9100",file="/var/lib/node-exporter-textfile/ci_runner.prom"}'
        values: '0x10'
    promql_expr_test:
      - expr: cc:runner_cores_busy
        eval_time: 5m
        exp_samples:
          - labels: 'cc:runner_cores_busy{host="lin",runner="lin-unity-pool-1"}'
            value: 3
      - expr: cc:runner_cores_allowed
        eval_time: 5m
        exp_samples:
          - labels: 'cc:runner_cores_allowed{host="lin",runner="lin-unity-pool-1"}'
            value: 6

  - name: a withheld idle runner is not a pool slot, a withheld runner still draining a job is
    interval: 1m
    input_series:
      - series: 'github_runner_state{name="a",pool="unity",state="running",instance="x"}'
        values: '1x5'
      - series: 'github_runner_state{name="b",pool="unity",state="idle",instance="x"}'
        values: '0x5'
      - series: 'github_runner_state{name="c",pool="unity",state="idle",instance="x"}'
        values: '0x5'
      - series: 'github_runner_state{name="d",pool="unity",state="running",instance="x"}'
        values: '1x5'
      - series: 'github_runner_withheld{name="c",instance="x"}'
        values: '1x5'
      - series: 'github_runner_withheld{name="d",instance="x"}'
        values: '1x5'
      - series: 'github_runner_withheld{name="b",instance="x"}'
        values: '0x5'
    promql_expr_test:
      - expr: cc:pool_slots
        eval_time: 2m
        exp_samples:
          - labels: 'cc:pool_slots{pool="unity"}'
            value: 3
      - expr: cc:pool_withheld
        eval_time: 2m
        exp_samples:
          - labels: 'cc:pool_withheld{pool="unity"}'
            value: 1
      - expr: cc:pool_busy
        eval_time: 2m
        exp_samples:
          - labels: 'cc:pool_busy{pool="unity"}'
            value: 2

  - name: site slots and busy split local from cloud, withheld idle left out, local gates added to local
    interval: 1m
    input_series:
      - series: 'github_runner_state{name="m1",pool="unity",site="local",state="running",instance="x"}'
        values: '1x5'
      - series: 'github_runner_state{name="m2",pool="unity",site="local",state="idle",instance="x"}'
        values: '0x5'
      - series: 'github_runner_state{name="m3",pool="unity",site="local",state="idle",instance="x"}'
        values: '0x5'
      - series: 'github_runner_withheld{name="m3",instance="x"}'
        values: '1x5'
      - series: 'github_runner_state{name="a1",pool="unity",site="cloud",state="running",instance="x"}'
        values: '1x5'
      - series: 'github_runner_state{name="a2",pool="unity",site="cloud",state="running",instance="x"}'
        values: '1x5'
      - series: 'fleet_local_slots{host="ws",kind="open",instance="ws"}'
        values: '2x5'
      - series: 'fleet_local_slots{host="ws",kind="room",instance="ws"}'
        values: '2x5'
      - series: 'fleet_local_slots_busy{host="ws",instance="ws"}'
        values: '1x5'
      - series: 'node_textfile_mtime_seconds{file="/x/fleet_local.prom",instance="ws"}'
        values: '0+60x5'
      - series: 'github_hosted_jobs_running{repo="game",instance="x"}'
        values: '2x5'
      - series: 'github_hosted_jobs_running{repo="web",instance="x"}'
        values: '1x5'
    promql_expr_test:
      - expr: cc:site_slots
        eval_time: 3m
        exp_samples:
          - labels: 'cc:site_slots{site="local"}'
            value: 4
          - labels: 'cc:site_slots{site="cloud"}'
            value: 2
      - expr: cc:site_busy
        eval_time: 3m
        exp_samples:
          - labels: 'cc:site_busy{site="local"}'
            value: 2
          - labels: 'cc:site_busy{site="cloud"}'
            value: 2
      - expr: cc:github_hosted_running
        eval_time: 3m
        exp_samples:
          - labels: 'cc:github_hosted_running'
            value: 3

  - name: a site with runners but none busy reads 0 busy, and no GitHub-hosted jobs reads 0
    interval: 1m
    input_series:
      - series: 'github_runner_state{name="a1",pool="unity",site="cloud",state="idle",instance="x"}'
        values: '0x5'
    promql_expr_test:
      - expr: cc:site_busy
        eval_time: 3m
        exp_samples:
          - labels: 'cc:site_busy{site="cloud"}'
            value: 0
      - expr: cc:github_hosted_running
        eval_time: 3m
        exp_samples:
          - labels: 'cc:github_hosted_running'
            value: 0

  - name: red now is one row per item, from watches, runners, nodes and a frozen feed
    interval: 1m
    input_series:
      - series: 'mqtt_tripped{topic="agents_h_watch_queue_starved",instance="a"}'
        values: '1x10'
      - series: 'mqtt_tripped{topic="agents_h_watch_queue_starved",instance="b"}'
        values: '1x10'
      - series: 'mqtt_tripped{topic="agents_h_watch_ok_one"}'
        values: '0x10'
      - series: 'mqtt_failed{topic="agents_h_runner_fleet_dispatch"}'
        values: '1x10'
      - series: 'kube_node_status_condition{node="n1",condition="Ready",status="true"}'
        values: '0x10'
      - series: 'mqtt_updated_epoch{topic="agents_h_runner_sentinel"}'
        values: '0x10'
    promql_expr_test:
      - expr: cc:red_now
        eval_time: 5m
        exp_samples:
          - labels: 'cc:red_now{item="watch queue_starved"}'
            value: 1
          - labels: 'cc:red_now{item="runner fleet_dispatch"}'
            value: 1
          - labels: 'cc:red_now{item="node n1 NotReady"}'
            value: 1
          - labels: 'cc:red_now{item="agent feed frozen"}'
            value: 1

  - name: sentinel is silent after 30 min with a live feed, and a frozen feed answers for it instead
    interval: 1m
    input_series:
      # the feed republishes every minute; sentinel's stamp stops at 0
      - series: 'mqtt_message_total{topic="agents_h_summary_asks_open"}'
        values: '0+1x60'
      - series: 'mqtt_updated_epoch{topic="agents_h_runner_sentinel"}'
        values: '0x60'
    promql_expr_test:
      - expr: cc:component_status{domain="agents",component="sentinel"}
        eval_time: 25m
        exp_samples:
          - labels: 'cc:component_status{domain="agents",component="sentinel"}'
            value: 0
      - expr: cc:component_status{domain="agents",component="sentinel"}
        eval_time: 35m
        exp_samples:
          - labels: 'cc:component_status{domain="agents",component="sentinel"}'
            value: 2
    alert_rule_test:
      - eval_time: 38m
        alertname: SentinelSilent
        exp_alerts: []
      - eval_time: 45m
        alertname: SentinelSilent
        exp_alerts:
          - exp_labels: {severity: critical, domain: agents, component: sentinel}
            exp_annotations:
              summary: Sentinel has not swept in 40 minutes while the feed is live, so no watch is being checked or paged
              runbook: ~/.config/agentctl/SENTINEL.md (dotfiles-private), "Operate"
      - eval_time: 45m
        alertname: AgentFeedFrozen
        exp_alerts: []

  - name: a frozen feed pages once it has held 10 min, and sentinel stays quiet under it
    interval: 1m
    input_series:
      - series: 'mqtt_message_total{topic="agents_h_summary_asks_open"}'
        values: '5x60'
      - series: 'mqtt_updated_epoch{topic="agents_h_runner_sentinel"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: AgentFeedFrozen
        exp_alerts:
          - exp_labels: {severity: critical, domain: agents, component: feed}
            exp_annotations:
              summary: The agent feed has published nothing in 30 minutes, so every watch, runner and queue number is frozen
              runbook: ~/.config/agentctl/SENTINEL.md (dotfiles-private), "Operate"
      - eval_time: 50m
        alertname: SentinelSilent
        exp_alerts: []
