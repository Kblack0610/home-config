# promtool test rules. Run with scripts/test-prometheus-rules.sh. Covers the lost-merge
# alerts; the series are what apps/forgejo-mirror-exporter emits.
rule_files:
  - forgejo-mirrors.rules.yaml
evaluation_interval: 1m

tests:
  - name: a default-branch rewind pages at once, an unrewound repo does not
    interval: 1m
    input_series:
      - series: 'forgejo_repo_default_branch_rewinds{repo="kblack0610/home-config",branch="master",job="forgejo-mirror-exporter"}'
        values: '0x3 1x5'
      - series: 'forgejo_repo_default_branch_rewinds{repo="kblack0610/platform",branch="develop",job="forgejo-mirror-exporter"}'
        values: '0x8'
    alert_rule_test:
      - eval_time: 3m
        alertname: ForgejoDefaultBranchRewound
        exp_alerts: []
      - eval_time: 4m
        alertname: ForgejoDefaultBranchRewound
        exp_alerts:
          - exp_labels: {alertname: ForgejoDefaultBranchRewound, severity: critical, category: git-integrity, repo: kblack0610/home-config, branch: master, job: forgejo-mirror-exporter}
            exp_annotations:
              summary: "kblack0610/home-config master moved back to an older commit"
              description: "1 update(s) in the last 24h set kblack0610/home-config master back to an older commit, so what was on top (often a merged PR) is no longer on the branch. The dropped sha: kubectl -n forgejo logs deploy/forgejo-mirror-exporter | grep rewind. Re-land it by fast-forward push if it is still a child of the tip, else as a new PR. See docs/gitops.md \"Lost merges\"."

  - name: a ref-clobbering push remote warns after 15 minutes
    interval: 1m
    input_series:
      - series: 'forgejo_repo_push_remote_rewrites_branches{repo="kblack0610/home-config",remote="remote_mirror_x",job="forgejo-mirror-exporter"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 14m
        alertname: ForgejoPushRemoteRewritesBranches
        exp_alerts: []
      - eval_time: 16m
        alertname: ForgejoPushRemoteRewritesBranches
        exp_alerts:
          - exp_labels: {alertname: ForgejoPushRemoteRewritesBranches, severity: warning, category: git-integrity, repo: kblack0610/home-config, remote: remote_mirror_x, job: forgejo-mirror-exporter}
            exp_annotations:
              summary: "kblack0610/home-config remote remote_mirror_x can reset its branches"
              description: "Remote remote_mirror_x in kblack0610/home-config is pushed to and maps a fetch refspec onto refs/heads/, so every push to it writes the value it pushed back to the local branch and drops whatever landed meanwhile. Delete the push mirror, or unset remote.remote_mirror_x.fetch in the bare repo."

  - name: a missing reflog warns after an hour
    interval: 5m
    input_series:
      - series: 'forgejo_repo_default_branch_reflog_present{repo="kblack0610/home-config",branch="master",job="forgejo-mirror-exporter"}'
        values: '0x20'
      - series: 'forgejo_repo_default_branch_reflog_present{repo="kblack0610/platform",branch="develop",job="forgejo-mirror-exporter"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 55m
        alertname: ForgejoDefaultBranchReflogMissing
        exp_alerts: []
      - eval_time: 65m
        alertname: ForgejoDefaultBranchReflogMissing
        exp_alerts:
          - exp_labels: {alertname: ForgejoDefaultBranchReflogMissing, severity: warning, category: git-integrity, repo: kblack0610/home-config, branch: master, job: forgejo-mirror-exporter}
            exp_annotations:
              summary: "kblack0610/home-config master has no reflog"
              description: "Without logs/refs/heads/master a rewind of this branch cannot be seen, so ForgejoDefaultBranchRewound stays quiet whatever happens. Forgejo writes reflogs through its own git config (core.logAllRefUpdates); check it was not turned off."
