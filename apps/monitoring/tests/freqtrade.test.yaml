# promtool test rules. Run with scripts/test-prometheus-rules.sh. The not-dry-run page is
# tested here and never by starting a bot that trades.
rule_files:
  - freqtrade.rules.yaml
evaluation_interval: 1m

tests:
  - name: a bot that reports it is not in dry run pages at once, a dry-run bot does not
    interval: 1m
    input_series:
      - series: 'trader_bot_dry_run{bot="kraken-s001",job="trader-web"}'
        values: '1x5 0x5'
      - series: 'trader_bot_dry_run{bot="kraken-sample",job="trader-web"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: TraderBotNotDryRun
        exp_alerts: []
      - eval_time: 7m
        alertname: TraderBotNotDryRun
        exp_alerts:
          - exp_labels: {alertname: TraderBotNotDryRun, severity: critical, category: trading, bot: kraken-s001, job: trader-web}
            exp_annotations:
              summary: "Freqtrade bot kraken-s001 is NOT in dry run: stop the league now: flux suspend kustomization apps, then kubectl -n freqtrade scale sts freqtrade-league --replicas=0"
              description: "The newest ingest snapshot of kraken-s001 reports dry_run false, so it can place real orders. Suspend Flux and scale the league to 0, then find which config or roster change turned dry run off (apps/freqtrade/README.md, Troubleshooting)."

  - name: missing exporter metrics alert after 15 minutes
    interval: 1m
    input_series:
      - series: 'trader_db_up{job="trader-web"}'
        values: '1x5 _x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: TraderMetricsMissing
        exp_alerts: []
      - eval_time: 30m
        alertname: TraderMetricsMissing
        exp_alerts:
          - exp_labels: {alertname: TraderMetricsMissing, severity: warning, category: trading}
            exp_annotations: {summary: "trader-web metrics are missing or cannot read the trader database: the not-dry-run page is blind"}

  - name: a bot API error alerts after two ingest runs, and not for a bot the not-dry-run page owns
    interval: 1m
    input_series:
      - series: 'trader_bot_snapshot_error{bot="down",job="trader-web"}'
        values: '0x5 1x90'
      - series: 'trader_bot_snapshot_error{bot="live",job="trader-web"}'
        values: '0x5 1x90'
      - series: 'trader_bot_dry_run{bot="live",job="trader-web"}'
        values: '0x95'
      - series: 'trader_bot_snapshot_error{bot="blip",job="trader-web"}'
        values: '0x5 1x60 0x30'
    alert_rule_test:
      - eval_time: 60m
        alertname: TraderBotApiDown
        exp_alerts: []
      - eval_time: 90m
        alertname: TraderBotApiDown
        exp_alerts:
          - exp_labels: {alertname: TraderBotApiDown, severity: warning, category: trading, bot: down, job: trader-web}
            exp_annotations: {summary: "Freqtrade bot down did not answer two ingest runs in a row: kubectl -n freqtrade logs freqtrade-league-<row>"}

  - name: a failed run alerts, a later good run clears it
    interval: 1m
    input_series:
      - series: 'trader_run_ok{kind="analysis",job="trader-web"}'
        values: '0x5 1x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: TraderRunFailed
        exp_alerts:
          - exp_labels: {alertname: TraderRunFailed, severity: warning, category: trading, kind: analysis, job: trader-web}
            exp_annotations: {summary: "The newest analysis run failed: its runs row on trader.kblab.me/runs says why"}
      - eval_time: 8m
        alertname: TraderRunFailed
        exp_alerts: []

  - name: a nightly run kind with no success for 50 hours is stale
    interval: 1m
    input_series:
      # both last succeeded at t=0 (epoch 0), evaluated 3 days later
      - series: 'trader_run_last_ok_timestamp_seconds{kind="analysis",job="trader-web"}'
        values: '0x4400'
      - series: 'trader_run_last_ok_timestamp_seconds{kind="walkforward",job="trader-web"}'
        values: '0x4400'
    alert_rule_test:
      - eval_time: 49h
        alertname: TraderRunStale
        exp_alerts: []
      - eval_time: 72h
        alertname: TraderRunStale
        exp_alerts:
          - exp_labels: {alertname: TraderRunStale, severity: warning, category: trading, kind: analysis, job: trader-web}
            exp_annotations: {summary: "No successful analysis run for 3d 0h 0m 0s"}
          - exp_labels: {alertname: TraderRunStale, severity: warning, category: trading, kind: walkforward, job: trader-web}
            exp_annotations: {summary: "No successful walkforward run for 3d 0h 0m 0s"}

  - name: futures data older than 32 hours warns, a fresh series does not
    interval: 5m
    input_series:
      - series: 'trader_futures_age_seconds{kind="funding",exchange="okx",job="trader-web"}'
        values: '104400+300x72'
      - series: 'trader_futures_age_seconds{kind="open_interest",exchange="kucoin",job="trader-web"}'
        values: '3600x72'
    alert_rule_test:
      - eval_time: 3h
        alertname: TraderFuturesStale
        exp_alerts: []
      - eval_time: 4h
        alertname: TraderFuturesStale
        exp_alerts:
          - exp_labels: {alertname: TraderFuturesStale, severity: warning, category: trading, kind: funding, exchange: okx, job: trader-web}
            exp_annotations:
              summary: "Newest okx funding row is 1d 9h 0m 0s old: check the freqtrade-futures CronJob"

  - name: a sweep that ran past 5 minutes alerts after 10 minutes, a shorter one does not
    interval: 5m
    input_series:
      - series: 'trader_markets_sweep_duration_seconds{venue="kalshi",job="trader-web"}'
        values: '330x6'
      - series: 'trader_markets_sweep_duration_seconds{venue="manifold",job="trader-web"}'
        values: '270x6'
    alert_rule_test:
      - eval_time: 5m
        alertname: TraderMarketsSweepSlow
        exp_alerts: []
      - eval_time: 10m
        alertname: TraderMarketsSweepSlow
        exp_alerts:
          - exp_labels: {alertname: TraderMarketsSweepSlow, severity: warning, category: trading, venue: kalshi, job: trader-web}
            exp_annotations:
              summary: "kalshi recorder sweep took 5m 30s, past the 5 minute schedule: the next tick is skipped"

  - name: a venue whose last good sweep is over 15 minutes old alerts, a fresh one does not
    interval: 1m
    input_series:
      - series: 'trader_markets_sweep_age_seconds{venue="kalshi",job="trader-web"}'
        values: '60+60x20'
      - series: 'trader_markets_sweep_age_seconds{venue="manifold",job="trader-web"}'
        values: '120x20'
    alert_rule_test:
      - eval_time: 13m
        alertname: TraderMarketsRecorderStale
        exp_alerts: []
      - eval_time: 15m
        alertname: TraderMarketsRecorderStale
        exp_alerts:
          - exp_labels: {alertname: TraderMarketsRecorderStale, severity: warning, category: trading, venue: kalshi, job: trader-web}
            exp_annotations:
              summary: "No good kalshi recorder sweep for 16m 0s: the paper league takes no entries there; failed sweeps and their errors are on trader.kblab.me/markets"

  - name: three failed sweeps of a venue in an hour alert, two do not
    interval: 5m
    input_series:
      - series: 'trader_markets_sweeps_failed_1h{venue="kalshi",job="trader-web"}'
        values: '0 1 2 3 3'
      - series: 'trader_markets_sweeps_failed_1h{venue="manifold",job="trader-web"}'
        values: '2x4'
    alert_rule_test:
      - eval_time: 10m
        alertname: TraderMarketsAdapterErrors
        exp_alerts: []
      - eval_time: 15m
        alertname: TraderMarketsAdapterErrors
        exp_alerts:
          - exp_labels: {alertname: TraderMarketsAdapterErrors, severity: warning, category: trading, venue: kalshi, job: trader-web}
            exp_annotations:
              summary: "3 kalshi recorder sweeps failed in the last hour: market_sweeps.error on trader.kblab.me/markets"

  - name: a paper account 15% of capital below its peak alerts after 15 minutes, a shallower one does not
    interval: 5m
    input_series:
      # peak 1100, then 920: 180 of 1000 capital below the peak
      - series: 'trader_paper_equity{account="paper-a",job="trader-web"}'
        values: '1000 1100 920x10'
      - series: 'trader_paper_capital{account="paper-a",job="trader-web"}'
        values: '1000x12'
      # peak 1000, then 900: 10%
      - series: 'trader_paper_equity{account="paper-b",job="trader-web"}'
        values: '1000 900x11'
      - series: 'trader_paper_capital{account="paper-b",job="trader-web"}'
        values: '1000x12'
    alert_rule_test:
      - eval_time: 20m
        alertname: TraderPaperDrawdown
        exp_alerts: []
      - eval_time: 30m
        alertname: TraderPaperDrawdown
        exp_alerts:
          - exp_labels: {alertname: TraderPaperDrawdown, severity: warning, category: trading, account: paper-a, job: trader-web}
            exp_annotations:
              summary: "Paper account paper-a is 18% of its capital below its peak: past the book's hard stop; trader.kblab.me/markets/book"
