rule_files:
  - node-health.rules.yaml

# A throttling CPU saws between its limit and a dip (saw), which the old instant rules
# never fired on. One spike (spike) and the workstation (192.168.1.2) fire neither rule.
tests:
  - name: a sawtooth fires both heat rules, a single spike and the workstation fire neither
    interval: 1m
    input_series:
      - series: 'node_hwmon_temp_celsius{instance="saw:9100",chip="k",sensor="temp1"}'
        values: '85 100 85 100 85 100 85 100 85 100 85 100 85 100 85 100 85 100 85 100 85 100 85 100 85 100 85 100 85 100'
      - series: 'node_hwmon_chip_names{instance="saw:9100",chip="k",chip_name="k10temp"}'
        values: '1x30'
      - series: 'node_hwmon_temp_celsius{instance="spike:9100",chip="c",sensor="temp1"}'
        values: '70 70 70 100 70x26'
      - series: 'node_hwmon_chip_names{instance="spike:9100",chip="c",chip_name="coretemp"}'
        values: '1x30'
      - series: 'node_hwmon_temp_celsius{instance="192.168.1.2:9100",chip="k",sensor="temp1"}'
        values: '99x30'
      - series: 'node_hwmon_chip_names{instance="192.168.1.2:9100",chip="k",chip_name="k10temp"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 3m
        alertname: NodeCpuCritical
        exp_alerts: []
      - eval_time: 7m
        alertname: NodeCpuCritical
        exp_alerts:
          - exp_labels: {alertname: NodeCpuCritical, severity: critical, fleet: none, category: node-health, instance: "saw:9100"}
            exp_annotations:
              summary: "CPU at 100C on saw:9100"
              description: "The CPU package on saw:9100 has peaked above 95C in every 5m window for 5m, close to its thermal limit. The host may throttle hard or shut down; asus-laptop dropped off the LAN after hours here on 2026-10-23, and hp-victus went NotReady on 2026-11-13. Move work off it now."
      - eval_time: 12m
        alertname: NodeCpuHot
        exp_alerts:
          - exp_labels: {alertname: NodeCpuHot, severity: warning, fleet: none, category: node-health, instance: "saw:9100"}
            exp_annotations:
              summary: "CPU hot on saw:9100 (peaks of 100C for 10m)"
              description: "The CPU package on saw:9100 has peaked above 90C in every 10m window for 10m. Run scripts/host-headroom.py on it and move work off; on a laptop, check thermal-cap.service applied after the last boot (systemctl status thermal-cap) and lower the cap in inventory.yml (thermal_capped) if it did."

  # hp-victus on 2026-11-14: charger out, battery draining. A host with mains on, a
  # mouse battery (scope Device) and a device battery on a host with no Mains fire nothing.
  - name: a laptop off its charger warns, then pages when the battery runs low
    interval: 1m
    input_series:
      - series: 'node_power_supply_online{instance="victus:9100",power_supply="ACAD"}'
        values: '0x10'
      - series: 'node_power_supply_info{instance="victus:9100",power_supply="ACAD",type="Mains"}'
        values: '1x10'
      - series: 'node_power_supply_capacity{instance="victus:9100",power_supply="BAT1"}'
        values: '40 35 29 25 20 15 10 7 5 3 1'
      - series: 'node_power_supply_info{instance="victus:9100",power_supply="BAT1",type="Battery"}'
        values: '1x10'
      - series: 'node_power_supply_capacity{instance="victus:9100",power_supply="hidpp_battery_0"}'
        values: '5x10'
      - series: 'node_power_supply_info{instance="victus:9100",power_supply="hidpp_battery_0",type="Battery",scope="Device"}'
        values: '1x10'
      - series: 'node_power_supply_online{instance="plugged:9100",power_supply="AC0"}'
        values: '1x10'
      - series: 'node_power_supply_info{instance="plugged:9100",power_supply="AC0",type="Mains"}'
        values: '1x10'
      - series: 'node_power_supply_capacity{instance="plugged:9100",power_supply="BAT0"}'
        values: '10x10'
      - series: 'node_power_supply_info{instance="plugged:9100",power_supply="BAT0",type="Battery"}'
        values: '1x10'
      - series: 'node_power_supply_online{instance="desk:9100",power_supply="hidpp_battery_0"}'
        values: '0x10'
      - series: 'node_power_supply_info{instance="desk:9100",power_supply="hidpp_battery_0",type="Battery"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: NodeOnBattery
        exp_alerts: []
      - eval_time: 6m
        alertname: NodeOnBattery
        exp_alerts:
          - exp_labels: {alertname: NodeOnBattery, severity: warning, fleet: none, category: node-health, instance: "victus:9100", power_supply: ACAD}
            exp_annotations:
              summary: "victus:9100 is on battery (ACAD offline)"
              description: "The mains supply ACAD on victus:9100 has read offline for 5m, so the host runs on its battery and goes down when it is flat (hp-victus lasted about 95 minutes on 2026-11-14). Check the charger is plugged in and seated."
      - eval_time: 3m
        alertname: NodeBatteryLow
        exp_alerts: []
      - eval_time: 5m
        alertname: NodeBatteryLow
        exp_alerts:
          - exp_labels: {alertname: NodeBatteryLow, severity: critical, fleet: none, category: node-health, instance: "victus:9100", power_supply: BAT1}
            exp_annotations:
              summary: "victus:9100 battery at 15% off mains"
              description: "BAT1 on victus:9100 is at 15% with the charger offline. The host goes down within minutes; plug the charger in now."

  - name: AWS expected power transitions stay quiet while running and unknown failures page
    interval: 1m
    input_series:
    - series: up{job="aws-ci-nodes",host="aws-stopped",instance="stopped:9100"}
      values: '0x10'
    - series: ci_governor_power_state{host="aws-stopped",state="stopped"}
      values: 1x10
    - series: up{job="aws-ci-nodes",host="aws-starting",instance="starting:9100"}
      values: '0x10'
    - series: ci_governor_power_state{host="aws-starting",state="starting"}
      values: 1x10
    - series: up{job="aws-ci-nodes",host="aws-stopping",instance="stopping:9100"}
      values: '0x10'
    - series: ci_governor_power_state{host="aws-stopping",state="stopping"}
      values: 1x10
    - series: up{job="aws-ci-nodes",host="aws-running",instance="running:9100"}
      values: '0x10'
    - series: ci_governor_power_state{host="aws-running",state="running"}
      values: 1x10
    - series: up{job="aws-ci-nodes",host="aws-unknown",instance="unknown:9100"}
      values: '0x10'
    - series: up{job="aws-ci-nodes",host="aws-zero",instance="zero:9100"}
      values: '0x10'
    - series: ci_governor_power_state{host="aws-zero",state="running"}
      values: '0x10'
    - series: up{job="aws-ci-nodes",host="aws-healthy",instance="healthy:9100"}
      values: 1x10
    - series: up{job="standalone-nodes",host="aws-stopped",instance="standalone:9100"}
      values: '0x10'
    - series: up{job="node-exporter",instance="k3s:9100"}
      values: '0x10'
    - series: up{job="mac-nodes",instance="mac:9100"}
      values: '0x10'
    alert_rule_test:
    - eval_time: 3m
      alertname: NodeDown
      exp_alerts:
      - exp_labels:
          job: aws-ci-nodes
          host: aws-running
          instance: running:9100
          severity: critical
          fleet: fix
          category: node-health
        exp_annotations:
          summary: 'Node down: running:9100 (aws-ci-nodes)'
          description: node-exporter target running:9100 (job aws-ci-nodes) has been unreachable for 2m; the host may be powered off, crashed, or off the network.
      - exp_labels:
          job: aws-ci-nodes
          host: aws-unknown
          instance: unknown:9100
          severity: critical
          fleet: fix
          category: node-health
        exp_annotations:
          summary: 'Node down: unknown:9100 (aws-ci-nodes)'
          description: node-exporter target unknown:9100 (job aws-ci-nodes) has been unreachable for 2m; the host may be powered off, crashed, or off the network.
      - exp_labels:
          job: aws-ci-nodes
          host: aws-zero
          instance: zero:9100
          severity: critical
          fleet: fix
          category: node-health
        exp_annotations:
          summary: 'Node down: zero:9100 (aws-ci-nodes)'
          description: node-exporter target zero:9100 (job aws-ci-nodes) has been unreachable for 2m; the host may be powered off, crashed, or off the network.
      - exp_labels:
          job: standalone-nodes
          instance: standalone:9100
          severity: critical
          fleet: fix
          category: node-health
          host: aws-stopped
        exp_annotations:
          summary: 'Node down: standalone:9100 (standalone-nodes)'
          description: node-exporter target standalone:9100 (job standalone-nodes) has been unreachable for 2m; the host may be powered off, crashed, or off the network.
      - exp_labels:
          job: node-exporter
          instance: k3s:9100
          severity: critical
          fleet: fix
          category: node-health
        exp_annotations:
          summary: 'Node down: k3s:9100 (node-exporter)'
          description: node-exporter target k3s:9100 (job node-exporter) has been unreachable for 2m; the host may be powered off, crashed, or off the network.
      - exp_labels:
          job: mac-nodes
          instance: mac:9100
          severity: critical
          fleet: fix
          category: node-health
        exp_annotations:
          summary: 'Node down: mac:9100 (mac-nodes)'
          description: node-exporter target mac:9100 (job mac-nodes) has been unreachable for 2m; the host may be powered off, crashed, or off the network.

  - name: standalone targets remain while the AWS scrape job disappears
    interval: 1m
    input_series:
    - series: up{job="standalone-nodes",instance="standalone:9100"}
      values: 1x20
    alert_rule_test:
    - eval_time: 16m
      alertname: StandaloneNodeExporterAbsent
      exp_alerts:
      - exp_labels:
          job: aws-ci-nodes
          severity: warning
          fleet: fix
          category: node-health
        exp_annotations:
          summary: aws-ci-nodes scrape job is absent
          description: No aws-ci-nodes targets are being scraped, so NodeDown is blind to this job's hosts. Check apps/monitoring/external-standalone-nodes.yaml and that prometheus-node-exporter is running on each host.
  - name: configured stopped AWS targets prevent the absent-job alert
    interval: 1m
    input_series:
    - series: up{job="standalone-nodes",instance="standalone:9100"}
      values: 1x20
    - series: up{job="aws-ci-nodes",host="aws-burst-1",instance="aws:9100"}
      values: '0x20'
    - series: ci_governor_power_state{host="aws-burst-1",state="stopped"}
      values: 1x20
    alert_rule_test:
    - eval_time: 16m
      alertname: StandaloneNodeExporterAbsent
      exp_alerts: []
  - name: AWS targets remain while the standalone scrape job disappears
    interval: 1m
    input_series:
    - series: up{job="aws-ci-nodes",host="aws-build-1",instance="aws:9100"}
      values: 1x20
    alert_rule_test:
    - eval_time: 16m
      alertname: StandaloneNodeExporterAbsent
      exp_alerts:
      - exp_labels:
          job: standalone-nodes
          severity: warning
          fleet: fix
          category: node-health
        exp_annotations:
          summary: standalone-nodes scrape job is absent
          description: No standalone-nodes targets are being scraped, so NodeDown is blind to this job's hosts. Check apps/monitoring/external-standalone-nodes.yaml and that prometheus-node-exporter is running on each host.
  - name: a quarantine taint pages critical once per node, other taints do not
    interval: 1m
    input_series:
    - series: kube_node_spec_taint{node="hp-victus",key="kblab.me/degraded",value="true",effect="NoSchedule",pod="ksm-a"}
      values: 1x5
    - series: kube_node_spec_taint{node="hp-victus",key="kblab.me/degraded",value="true",effect="NoSchedule",pod="ksm-b"}
      values: 1x5
    - series: kube_node_spec_taint{node="razer-laptop",key="node.kubernetes.io/unschedulable",value="",effect="NoSchedule",pod="ksm-a"}
      values: 1x5
    alert_rule_test:
    - eval_time: 1m
      alertname: NodeQuarantined
      exp_alerts:
      - exp_labels:
          node: hp-victus
          severity: critical
          fleet: fix
          category: node-health
        exp_annotations:
          summary: "hp-victus is quarantined (kblab.me/degraded): no new pods land on it"
          description: cluster-janitor tainted hp-victus after a kernel fault, Ready flaps or a mains loss; the node's kblab.me/degraded-reason annotation says which. Pods running there keep running; pods pinned there by a local-path PV stay Pending if they restart. Fix or move per docs/host-tiers.md "Quarantine", then rerun scripts/host-qualify.py, which lifts the taint on a passing record.
