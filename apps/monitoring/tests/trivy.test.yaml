# promtool test rules. Run with scripts/test-prometheus-rules.sh.
rule_files:
  - trivy.rules.yaml
evaluation_interval: 1m

tests:
  - name: one alert per image across containers and revisions; a scaled-down ReplicaSet is left out
    interval: 1m
    input_series:
      # Two containers of the live ReplicaSet and one of an old one, same image.
      - series: 'trivy_image_vulnerabilities{severity="Critical",namespace="ha",name="replicaset-ha-new-main",resource_kind="ReplicaSet",resource_name="ha-new",image_registry="ghcr.io",image_repository="home-assistant/home-assistant",image_tag="1"}'
        values: '3x60'
      - series: 'trivy_image_vulnerabilities{severity="Critical",namespace="ha",name="replicaset-ha-new-seed",resource_kind="ReplicaSet",resource_name="ha-new",image_registry="ghcr.io",image_repository="home-assistant/home-assistant",image_tag="1"}'
        values: '3x60'
      - series: 'trivy_image_vulnerabilities{severity="Critical",namespace="ha",name="replicaset-ha-old-main",resource_kind="ReplicaSet",resource_name="ha-old",image_registry="ghcr.io",image_repository="home-assistant/home-assistant",image_tag="0"}'
        values: '9x60'
      - series: 'kube_replicaset_spec_replicas{namespace="ha",replicaset="ha-new"}'
        values: '1x60'
      - series: 'kube_replicaset_spec_replicas{namespace="ha",replicaset="ha-old"}'
        values: '0x60'
      # A clean image stays quiet.
      - series: 'trivy_image_vulnerabilities{severity="Critical",namespace="ntfy",name="replicaset-ntfy-a-ntfy",resource_kind="ReplicaSet",resource_name="ntfy-a",image_registry="docker.io",image_repository="binwiederhier/ntfy",image_tag="2"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: HomelabCriticalVulnerability
        exp_alerts: []
      - eval_time: 40m
        alertname: HomelabCriticalVulnerability
        exp_alerts:
          - exp_labels: {alertname: HomelabCriticalVulnerability, severity: warning, category: security, image_registry: ghcr.io, image_repository: home-assistant/home-assistant, image_tag: "1"}
            exp_annotations:
              summary: "3 critical CVEs in home-assistant/home-assistant:1"
              description: "ghcr.io/home-assistant/home-assistant:1 has 3 CRITICAL vulnerabilities with a fix available. Bump the pinned tag to a release that fixes them. Where it runs: kubectl get vulnerabilityreports -A -o wide | grep home-assistant/home-assistant"
