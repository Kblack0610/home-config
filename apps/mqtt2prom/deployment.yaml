apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt2prom
  namespace: mqtt2prom
  labels:
    app.kubernetes.io/name: mqtt2prom
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mqtt2prom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mqtt2prom
    spec:
      containers:
        - name: mqtt2prom
          # kpetremann/mqtt-exporter — public, configless. Subscribes to a
          # topic glob (default #), counts messages per topic, parses JSON
          # payloads into per-key gauges. Good fit for IoT visibility +
          # confirming notes-sync traffic without per-metric config.
          image: ghcr.io/kpetremann/mqtt-exporter:1.5
          imagePullPolicy: IfNotPresent
          env:
            - name: MQTT_ADDRESS
              value: "mosquitto.mosquitto.svc.cluster.local"
            - name: MQTT_PORT
              value: "1883"
            - name: MQTT_TOPIC
              value: "#"
            - name: PROMETHEUS_PORT
              value: "9000"
            - name: LOG_LEVEL
              value: "INFO"
          ports:
            - name: metrics
              containerPort: 9000
              protocol: TCP
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
