apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt2prom
  namespace: mqtt2prom
  labels:
    app.kubernetes.io/name: mqtt2prom
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mqtt2prom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mqtt2prom
    spec:
      containers:
        - name: mqtt2prom
          image: ghcr.io/kblack0610/mqtt2prom:latest
          env:
            - name: MQTT_HOST
              value: "mosquitto.mosquitto.svc.cluster.local"
            - name: MQTT_PORT
              value: "1883"
            - name: HTTP_PORT
              value: "9201"
          ports:
            - name: metrics
              containerPort: 9201
              protocol: TCP
          resources:
            requests:
              memory: "16Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          livenessProbe:
            tcpSocket:
              port: 9201
            initialDelaySeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9201
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
