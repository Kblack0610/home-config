apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: music-assistant
  namespace: music-assistant
  labels:
    app.kubernetes.io/name: music-assistant
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-dns
    # LAN-only: off public DNS (see apps/agents/ingress.yaml). MA has its own
    # login, but the FIRST visitor to an un-onboarded server creates the admin
    # account, so it must not be internet-reachable.
    external-dns.alpha.kubernetes.io/controller: none
    traefik.ingress.kubernetes.io/router.middlewares: monitoring-local-network-only@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - music.kblab.me
      secretName: music-assistant-tls
  rules:
    - host: music.kblab.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: music-assistant
                port:
                  number: 8095
