apiVersion: batch/v1
kind: CronJob
metadata:
  name: 3d-prints-backup
  namespace: nas
spec:
  schedule: "45 3 * * 0"  # Weekly, Sunday 3:45 AM (prints change rarely; 14 weekly snapshots ~= 3 months of history)
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            kubernetes.io/hostname: asus-laptop
            storage.role/nas: "true"
          # Privileged: required for btrfs subvolume snapshot/delete commands
          securityContext:
            runAsUser: 0
          containers:
            - name: backup
              image: alpine:3.24.1
              securityContext:
                privileged: true
              # Guards, rsync, snapshot and prune live in mirror-snapshot.sh
              # (the nas-mirror-script ConfigMap), shared with phones-backup.
              command: ["/bin/sh", "/scripts/mirror-snapshot.sh"]
              env:
                - name: NAME
                  value: 3d-prints
                - name: KEEP
                  value: "14"
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: source
                  mountPath: /source
                  readOnly: true
                - name: backup-dest
                  mountPath: /backup-dest
                - name: snapshots
                  mountPath: /snapshots
          # Never, not OnFailure: OnFailure makes the Job controller DELETE
          # the failed pod, taking its logs with it. That is why this job's
          # two days of failures could only be seen as "BackoffLimitExceeded,
          # no pods retained" and had to be diagnosed with a hand-built pod.
          restartPolicy: Never
          volumes:
            - name: script
              configMap:
                name: nas-mirror-script
            - name: source
              hostPath:
                path: /mnt/nas/public/3d-printing
                type: Directory
            - name: backup-dest
              hostPath:
                path: /mnt/backup-8t/3d-prints
                type: DirectoryOrCreate
            - name: snapshots
              hostPath:
                path: /mnt/backup-8t/3d-prints-snapshots
                type: DirectoryOrCreate
