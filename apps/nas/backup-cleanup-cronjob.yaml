apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    kblab.me/criticality: standard
  name: nas-backup-cleanup
  namespace: nas
spec:
  schedule: "0 5 * * 0"  # Sunday at 5 AM (weekly)
  timeZone: America/Los_Angeles
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            kubernetes.io/hostname: asus-laptop
            storage.role/nas: "true"
          containers:
            - name: cleanup
              image: alpine:3.24.1
              command:
                - /bin/sh
                - -c
                - |
                  BACKUP_ROOT="/nas-backups"
                  KEEP=14

                  for APP_DIR in "$BACKUP_ROOT"/*/; do
                    APP=$(basename "$APP_DIR")
                    # Skip sops — has its own retention (4 copies)
                    [ "$APP" = "sops" ] && continue
                    # Match .tar.gz (most apps) and .sql.gz (immich DB dumps)
                    COUNT=$(ls -1 "$APP_DIR"/*.tar.gz "$APP_DIR"/*.sql.gz 2>/dev/null | wc -l)
                    if [ "$COUNT" -gt "$KEEP" ]; then
                      REMOVE=$((COUNT - KEEP))
                      echo "Pruning $REMOVE old backups from $APP (keeping $KEEP)"
                      ls -t "$APP_DIR"/*.tar.gz "$APP_DIR"/*.sql.gz 2>/dev/null | tail -n +"$((KEEP + 1))" | xargs -r rm
                    else
                      echo "$APP: $COUNT backups, nothing to prune"
                    fi
                    # A job whose backup is several files writes one YYYY-MM-DD/
                    # directory per run instead (k3s-server). Same KEEP; the
                    # names sort by date.
                    DAYS=$(ls -1d "$APP_DIR"/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]/ 2>/dev/null | wc -l)
                    if [ "$DAYS" -gt "$KEEP" ]; then
                      echo "Pruning $((DAYS - KEEP)) old dated backups from $APP (keeping $KEEP)"
                      ls -1d "$APP_DIR"/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]/ | sort | head -n "$((DAYS - KEEP))" | xargs -r rm -rf
                    fi
                  done
                  echo "NAS backup cleanup complete"
              volumeMounts:
                - name: nas-backups
                  mountPath: /nas-backups
          # Pinned to one node (its local-path PV or its nodeSelector), so it runs
          # there even when that node is quarantined: the backup is how the node's
          # state leaves it (docs/host-tiers.md, Quarantine).
          tolerations:
            - key: kblab.me/degraded
              operator: Exists
              effect: NoSchedule
          restartPolicy: OnFailure
          volumes:
            - name: nas-backups
              hostPath:
                path: /mnt/nas/private/backups/home-k3s
                type: DirectoryOrCreate
