apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    kblab.me/criticality: standard
  name: nas-backup-verify
  namespace: nas
spec:
  schedule: "0 6 * * 1"  # Monday at 6 AM (weekly)
  timeZone: America/Los_Angeles
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      # An NFS mount that never comes up must still end in a failed Job.
      activeDeadlineSeconds: 14400
      template:
        spec:
          nodeSelector:
            kubernetes.io/hostname: asus-laptop
            storage.role/nas: "true"
          containers:
            - name: verify
              image: alpine:3.24.1
              command:
                - /bin/sh
                - -c
                - |
                  apk add --no-cache gzip
                  BACKUP_ROOT="/nas-backups"
                  MANIFEST="/nas-private/backups/manifest.log"
                  ERRORS=0
                  REPORT="=== Backup Verification Report $(date -Iseconds) ==="

                  # Check each app directory for recent backups (< 48h old)
                  for APP in home-assistant actual-budget music-assistant snapcast karakeep postgres vaultwarden binks; do
                    APP_DIR="$BACKUP_ROOT/$APP"
                    if [ ! -d "$APP_DIR" ]; then
                      REPORT="$REPORT\nFAIL: $APP — backup directory missing"
                      ERRORS=$((ERRORS + 1))
                      continue
                    fi

                    LATEST=$(ls -t "$APP_DIR"/*.tar.gz "$APP_DIR"/*.sql.gz 2>/dev/null | head -1)
                    if [ -z "$LATEST" ]; then
                      REPORT="$REPORT\nFAIL: $APP — no backup files found"
                      ERRORS=$((ERRORS + 1))
                      continue
                    fi

                    # Check age (48h = 172800 seconds)
                    AGE=$(( $(date +%s) - $(stat -c %Y "$LATEST") ))
                    if [ "$AGE" -gt 172800 ]; then
                      REPORT="$REPORT\nFAIL: $APP — latest backup is $(( AGE / 3600 ))h old (> 48h): $(basename "$LATEST")"
                      ERRORS=$((ERRORS + 1))
                    else
                      REPORT="$REPORT\nOK: $APP — latest backup $(basename "$LATEST") ($(( AGE / 3600 ))h ago)"
                    fi

                    # Validate gzip integrity
                    if ! gzip -t "$LATEST" 2>/dev/null; then
                      REPORT="$REPORT\nFAIL: $APP — latest backup is corrupt: $(basename "$LATEST")"
                      ERRORS=$((ERRORS + 1))
                    fi
                  done

                  # Forgejo keeps its backups off the NAS tree, so it gets its own checks.
                  # They read the 8TB copy that forgejo-backup-pull builds from forge-hel1
                  # (forgejo-backup-offbox's until the cutover).
                  FJ_LATEST=$(ls -t /forgejo-backups/forgejo-full-*.tar.gz 2>/dev/null | head -1)
                  if [ -z "$FJ_LATEST" ]; then
                    REPORT="$REPORT\nFAIL: forgejo - no full backup found"
                    ERRORS=$((ERRORS + 1))
                  else
                    FJ_AGE=$(( $(date +%s) - $(stat -c %Y "$FJ_LATEST") ))
                    if [ "$FJ_AGE" -gt 172800 ]; then
                      REPORT="$REPORT\nFAIL: forgejo - latest full is $(( FJ_AGE / 3600 ))h old (> 48h): $(basename "$FJ_LATEST")"
                      ERRORS=$((ERRORS + 1))
                    else
                      REPORT="$REPORT\nOK: forgejo - latest full $(basename "$FJ_LATEST") ($(( FJ_AGE / 3600 ))h ago)"
                    fi
                    if ! gzip -t "$FJ_LATEST" 2>/dev/null; then
                      REPORT="$REPORT\nFAIL: forgejo - latest full is corrupt: $(basename "$FJ_LATEST")"
                      ERRORS=$((ERRORS + 1))
                    fi
                    # The restore drill needs the full's own db, not just any db.
                    FJ_TS=${FJ_LATEST##*/forgejo-full-}; FJ_TS=${FJ_TS%.tar.gz}
                    FJ_DB=/forgejo-backups/forgejo-db-$FJ_TS.db.gz
                    if ! gzip -t "$FJ_DB" 2>/dev/null; then
                      REPORT="$REPORT\nFAIL: forgejo - db for $(basename "$FJ_LATEST") missing or corrupt: $(basename "$FJ_DB")"
                      ERRORS=$((ERRORS + 1))
                    fi
                  fi

                  # 8TB mirrors, as name:max_age_days. Weekly ones get 9, so one run missed by
                  # hours does not fail. /browse is every subvolume, read-only; if the drive
                  # is gone it is an empty directory and every check below fails, as it should.
                  # Age comes from the snapshot name: a snapshot's mtime is its source's.
                  for MIRROR in immich:2 nas-backups:2 3d-prints:9 phones:9 forgejo-packages:9 app-config:9 harvest:9 eeg:2; do
                    NAME="${MIRROR%:*}"
                    MAX="${MIRROR#*:}"
                    SNAP=$(ls -d "/browse/@$NAME-snapshots/$NAME"-* 2>/dev/null | sort | tail -1)
                    if [ -z "$SNAP" ]; then
                      REPORT="$REPORT\nFAIL: $NAME - no snapshot found"
                      ERRORS=$((ERRORS + 1))
                      continue
                    fi
                    SNAP_DAY=$(basename "$SNAP" | sed "s/^$NAME-//; s/-.*$//")
                    SNAP_AGE=$(( ( $(date +%s) - $(date -u -D '%Y%m%d' -d "$SNAP_DAY" +%s) ) / 86400 ))
                    if [ "$SNAP_AGE" -gt "$MAX" ]; then
                      REPORT="$REPORT\nFAIL: $NAME - latest snapshot is $SNAP_AGE days old (> $MAX): $(basename "$SNAP")"
                      ERRORS=$((ERRORS + 1))
                    else
                      REPORT="$REPORT\nOK: $NAME - latest snapshot $(basename "$SNAP") ($SNAP_AGE days ago)"
                    fi
                  done

                  # Check SOPS key backup exists
                  SOPS_DIR="$BACKUP_ROOT/sops"
                  if [ -d "$SOPS_DIR" ] && ls "$SOPS_DIR"/sops-age-*.yaml >/dev/null 2>&1; then
                    SOPS_LATEST=$(ls -t "$SOPS_DIR"/sops-age-*.yaml | head -1)
                    SOPS_AGE=$(( $(date +%s) - $(stat -c %Y "$SOPS_LATEST") ))
                    REPORT="$REPORT\nOK: sops — key backup exists ($(( SOPS_AGE / 86400 ))d ago)"
                  else
                    REPORT="$REPORT\nFAIL: sops — no key backup found"
                    ERRORS=$((ERRORS + 1))
                  fi

                  REPORT="$REPORT\n--- $ERRORS error(s) ---"

                  # Print report
                  printf '%b\n' "$REPORT"

                  # Append to manifest log
                  mkdir -p "$(dirname "$MANIFEST")"
                  printf '%b\n' "$REPORT" >> "$MANIFEST"

                  # Exit non-zero on failures (triggers failed Job for alerting)
                  [ "$ERRORS" -eq 0 ] || exit 1
              volumeMounts:
                - name: nas-backups
                  mountPath: /nas-backups
                - name: nas-private
                  mountPath: /nas-private
                - name: forgejo-backups
                  mountPath: /forgejo-backups
                  readOnly: true
                - name: browse
                  mountPath: /browse
                  readOnly: true
          # Pinned to one node (its local-path PV or its nodeSelector), so it runs
          # there even when that node is quarantined: the backup is how the node's
          # state leaves it (docs/host-tiers.md, Quarantine).
          tolerations:
            - key: kblab.me/degraded
              operator: Exists
              effect: NoSchedule
          # Never, not OnFailure: OnFailure deletes the failed pod and its report.
          restartPolicy: Never
          volumes:
            - name: nas-backups
              hostPath:
                path: /mnt/nas/private/backups/home-k3s
                type: DirectoryOrCreate
            - name: nas-private
              hostPath:
                path: /mnt/nas/private
                type: DirectoryOrCreate
            - name: forgejo-backups
              hostPath:
                path: /mnt/backup-8t/forgejo-backups
                type: Directory
            - name: browse
              hostPath:
                path: /mnt/backup-8t/browse
                type: Directory
