apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nas

# mirror-snapshot.sh is shipped as a ConfigMap (hash-suffixed -> edits roll the
# CronJobs' next pod), shared by every 8TB mirror job below.
configMapGenerator:
  - name: nas-mirror-script
    files:
      - mirror-snapshot.sh

resources:
  - namespace.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - sops-backup-rbac.yaml
  - sops-backup-cronjob.yaml
  - backup-cleanup-cronjob.yaml
  - backup-verify-cronjob.yaml
  - 3d-prints-backup-cronjob.yaml
  - phones-backup-cronjob.yaml
  - forgejo-packages-backup-cronjob.yaml
