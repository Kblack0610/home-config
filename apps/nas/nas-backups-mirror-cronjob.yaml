apiVersion: batch/v1
kind: CronJob
metadata:
  name: nas-backups-mirror
  namespace: nas
spec:
  # Daily 5:30 AM, after the app jobs and the Sunday cleanup. The app backups are on
  # the NAS disk, so without this copy losing that disk loses every one of them.
  schedule: "30 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      template:
        spec:
          nodeSelector:
            kubernetes.io/hostname: asus-laptop
            storage.role/nas: "true"
          # Privileged: required for btrfs subvolume snapshot/delete commands
          securityContext:
            runAsUser: 0
          containers:
            - name: backup
              image: alpine:3.24.1
              securityContext:
                privileged: true
              # Guards, rsync, snapshot and prune live in mirror-snapshot.sh
              # (the nas-mirror-script ConfigMap).
              command: ["/bin/sh", "/scripts/mirror-snapshot.sh"]
              env:
                - name: NAME
                  value: nas-backups
                - name: KEEP
                  value: "14"
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: source
                  mountPath: /source
                  readOnly: true
                - name: backup-dest
                  mountPath: /backup-dest
                - name: snapshots
                  mountPath: /snapshots
          restartPolicy: Never
          volumes:
            - name: script
              configMap:
                name: nas-mirror-script
            - name: source
              hostPath:
                path: /mnt/nas/private/backups
                type: Directory
            # Directory, not DirectoryOrCreate: the subvolumes come from the
            # usb-backup-mounts role.
            - name: backup-dest
              hostPath:
                path: /mnt/backup-8t/nas-backups
                type: Directory
            - name: snapshots
              hostPath:
                path: /mnt/backup-8t/nas-backups-snapshots
                type: Directory
