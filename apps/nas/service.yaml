apiVersion: v1
kind: Service
metadata:
  name: nas
  namespace: nas
  labels:
    app.kubernetes.io/name: nas
spec:
  # Headless service - pod uses hostNetwork directly
  clusterIP: None
  selector:
    app.kubernetes.io/name: nas
  ports:
    - name: smb
      port: 445
      targetPort: 445
      protocol: TCP
