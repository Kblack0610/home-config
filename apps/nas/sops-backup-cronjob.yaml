apiVersion: batch/v1
kind: CronJob
metadata:
  name: sops-key-backup
  namespace: nas
spec:
  schedule: "0 4 * * 0"  # Sunday at 4 AM (weekly)
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: sops-backup-sa
          nodeSelector:
            kubernetes.io/hostname: asus-laptop
            storage.role/nas: "true"
          containers:
            - name: sops-backup
              # Was bitnami/kubectl:latest. Bitnami removed every versioned tag
              # from its free Docker Hub repos in 2025 (images moved to the
              # frozen `bitnamilegacy/*` namespace), so that ref was both
              # unpinnable and no longer maintained. alpine/k8s is what
              # apps/flux-audit already uses, and it has the shell this job
              # needs — registry.k8s.io/kubectl is distroless and would break
              # the `/bin/sh -c` below.
              image: alpine/k8s:1.33.5
              securityContext:
                runAsUser: 0
              command:
                - /bin/sh
                - -c
                - |
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  BACKUP_DIR="/nas-backups/sops"
                  mkdir -p "$BACKUP_DIR"
                  # Extract sops-age secret from flux-system namespace
                  kubectl get secret sops-age -n flux-system -o yaml > "$BACKUP_DIR/sops-age-$TIMESTAMP.yaml"
                  echo "SOPS key backup complete: sops-age-$TIMESTAMP.yaml"
                  # Keep only last 4 copies (monthly rotation)
                  ls -t "$BACKUP_DIR"/sops-age-*.yaml | tail -n +5 | xargs -r rm
                  echo "Retention cleanup done, kept last 4 copies"
              volumeMounts:
                - name: nas-backups
                  mountPath: /nas-backups
          restartPolicy: OnFailure
          volumes:
            - name: nas-backups
              hostPath:
                path: /mnt/nas/private/backups/home-k3s
                type: DirectoryOrCreate
