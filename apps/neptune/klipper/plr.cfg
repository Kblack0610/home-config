# Power-loss resume for the Elegoo Neptune 4 Pro (OpenNept4une, Klipper).
# Canonical copy: home-config apps/neptune/klipper/plr.cfg. Deploy and use: apps/neptune/README.md, "Power-loss resume".
#
# The slicer calls _PLR_SAVE at every layer change (machine preset before_layer_change_gcode). It stores the
# file, the byte offset of that layer and the layer Z in one SAVE_VARIABLE write. After a power cut the record
# survives, _PLR_CHECK flags it at boot, and PLR_RESUME continues the file from that layer without homing Z.
# PRINT_START and PRINT_END (printer.cfg) call _PLR_CLEAR, so a finished, cancelled or new print leaves no record.

[save_variables]
filename: ~/printer_data/config/plr_variables.cfg

[gcode_macro _PLR_SAVE]
description: Save the resume point at a layer change. Called by the slicer, never by hand.
gcode:
  {% set sd = printer.virtual_sdcard %}
  {% if sd.is_active and printer.print_stats.filename %}
    {% set rec = {
      'file': printer.print_stats.filename,
      'pos': sd.file_position,
      'z': params.LAYER_Z|float,
      'ext': printer.extruder.target,
      'bed': printer.heater_bed.target,
      'fan': printer.fan.speed,
    } %}
    SAVE_VARIABLE VARIABLE=plr VALUE='{rec|tojson}'
  {% endif %}

[gcode_macro _PLR_CLEAR]
description: Forget the resume point.
gcode:
  {% if printer.save_variables.variables.plr|default(0) %}
    SAVE_VARIABLE VARIABLE=plr VALUE=0
  {% endif %}

[delayed_gcode _PLR_CHECK]
initial_duration: 10
gcode:
  {% set rec = printer.save_variables.variables.plr|default(0) %}
  {% if rec %}
    M117 Power loss: check part, run PLR_RESUME
    RESPOND TYPE=error MSG="PLR: {rec.file} stopped at Z={rec.z}. If the part is still stuck down, run PLR_RESUME, otherwise run _PLR_CLEAR."
  {% endif %}

[gcode_macro PLR_RESUME]
description: Continue a print a power cut stopped, from the start of its last layer. Check the part first.
gcode:
  {% set rec = printer.save_variables.variables.plr|default(0) %}
  {% if not rec %}
    RESPOND TYPE=error MSG="PLR: no interrupted print is recorded"
  {% elif printer.print_stats.state in ['printing', 'paused'] %}
    RESPOND TYPE=error MSG="PLR: a print is already running"
  {% else %}
    RESPOND MSG="PLR: resuming {rec.file} at Z={rec.z} from byte {rec.pos}"
    M117 PLR: heating bed
    SET_BED_TEMPERATURE TARGET={rec.bed}
    BED_TEMPERATURE_WAIT MINIMUM={rec.bed - 2} MAXIMUM={rec.bed + 4}
    # The nozzle is where the last layer left it: trust that Z instead of homing into the part.
    SET_KINEMATIC_POSITION Z={rec.z}
    G91
    G1 Z5 F600
    G90
    G28 X Y
    BED_MESH_PROFILE LOAD=default
    # Heat and prime at the X/Y home corner, off the part.
    M117 PLR: heating nozzle
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={rec.ext}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={rec.ext - 4} MAXIMUM={rec.ext + 10}
    M83
    G1 E10 F200
    M106 S{(rec.fan * 255)|int}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
    M117 Printing
    M23 {rec.file}
    M26 S{rec.pos}
    M24
  {% endif %}
