apiVersion: v1
kind: ConfigMap
metadata:
  name: netdata-config
  namespace: netdata
  labels:
    app.kubernetes.io/name: netdata
data:
  # Main netdata configuration
  netdata.conf: |
    [global]
      # Run as the netdata user
      run as user = netdata

      # History retention (in seconds) - 7 days of 1-second data
      # Netdata uses tiered storage: 1s data for 1h, 1m for 1d, 1h for 2w
      history = 3996

      # Memory mode: dbengine provides efficient disk-based storage
      memory mode = dbengine

      # Page cache size (MB) - memory used for caching recent data
      page cache size = 64

      # DB engine disk space limit (MB) - history storage on disk
      dbengine multihost disk space = 1024

      # Update frequency (1 second is the default)
      update every = 1

    [web]
      # Web interface settings
      bind to = 0.0.0.0
      default port = 19999

      # Allow access from any IP (k8s handles ingress security)
      allow connections from = *
      allow dashboard from = *

    [plugins]
      # Enable cgroups for container monitoring
      cgroups = yes

      # Enable apps plugin for process monitoring
      apps = yes

      # Enable disk monitoring
      diskspace = yes

      # Enable proc plugin for system stats
      proc = yes

  # Kubernetes-specific monitoring
  go.d.conf: |
    modules:
      k8s_kubelet: yes
      k8s_kubeproxy: yes
      k8s_state: yes

  # Health alarm configuration
  health.conf: |
    [health]
      enabled = yes

      # Reduce alarm notification noise for home lab
      default repeat warning = 1h
      default repeat critical = 15m

  # Stream configuration (for multi-node setups - disabled for single node)
  stream.conf: |
    [stream]
      enabled = no
