apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netdata
  namespace: netdata
  labels:
    app.kubernetes.io/name: netdata
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: netdata
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netdata
      annotations:
        # Prometheus scrape config (if you add Prometheus later)
        prometheus.io/scrape: "true"
        prometheus.io/port: "19999"
        prometheus.io/path: "/api/v1/allmetrics?format=prometheus"
    spec:
      serviceAccountName: netdata
      # Run on all nodes including control plane
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      # Use host network for accurate network monitoring
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: netdata
          image: netdata/netdata:stable
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 19999
              hostPort: 19999
              protocol: TCP
          # Resource limits - Netdata is lightweight
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Security context for host monitoring
          securityContext:
            capabilities:
              add:
                - SYS_PTRACE      # Process tracing
                - SYS_ADMIN       # cgroups access
                - NET_ADMIN       # Network monitoring
          # Health checks
          livenessProbe:
            httpGet:
              path: /api/v1/info
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/info
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          # Environment variables
          env:
            # Kubernetes pod info
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Netdata configuration
            - name: NETDATA_CLAIM_TOKEN
              value: ""  # Optional: Add your Netdata Cloud token here
            - name: NETDATA_CLAIM_URL
              value: "https://app.netdata.cloud"
            # Enable Kubernetes monitoring
            - name: KUBERNETES_SERVICE_HOST
              value: "kubernetes.default.svc"
            - name: KUBERNETES_SERVICE_PORT
              value: "443"
          volumeMounts:
            # Netdata configuration from ConfigMap
            - name: config
              mountPath: /etc/netdata/netdata.conf
              subPath: netdata.conf
            - name: config
              mountPath: /etc/netdata/go.d.conf
              subPath: go.d.conf
            - name: config
              mountPath: /etc/netdata/health.d/health.conf
              subPath: health.conf
            # Host filesystem mounts for monitoring
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: os-release
              mountPath: /host/etc/os-release
              readOnly: true
            - name: passwd
              mountPath: /host/etc/passwd
              readOnly: true
            - name: group
              mountPath: /host/etc/group
              readOnly: true
            # Container runtime socket (k3s uses containerd)
            - name: containerd-sock
              mountPath: /run/containerd/containerd.sock
              readOnly: true
            # Cgroup mount for container metrics
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            # Persistent storage for metrics history
            - name: netdata-cache
              mountPath: /var/cache/netdata
            - name: netdata-lib
              mountPath: /var/lib/netdata
      volumes:
        # Configuration from ConfigMap
        - name: config
          configMap:
            name: netdata-config
        # Host filesystem mounts
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: os-release
          hostPath:
            path: /etc/os-release
        - name: passwd
          hostPath:
            path: /etc/passwd
        - name: group
          hostPath:
            path: /etc/group
        # Containerd socket (k3s default runtime)
        - name: containerd-sock
          hostPath:
            path: /run/k3s/containerd/containerd.sock
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
        # Persistent storage using emptyDir (survives container restarts)
        # For longer persistence, consider using a PVC with local-path
        - name: netdata-cache
          emptyDir: {}
        - name: netdata-lib
          emptyDir: {}
