---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: netdata
  namespace: netdata
  labels:
    app.kubernetes.io/name: netdata
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: netdata
  labels:
    app.kubernetes.io/name: netdata
rules:
  # Read access to cluster resources for monitoring
  - apiGroups: [""]
    resources:
      - pods
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - persistentvolumes
      - persistentvolumeclaims
      - namespaces
      - configmaps
      - secrets
    verbs: ["get", "list", "watch"]
  # Access to metrics
  - apiGroups: [""]
    resources:
      - nodes/metrics
      - nodes/stats
    verbs: ["get"]
  # Access to apps resources
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]
  # Access to batch resources
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  # Access to networking resources
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  # Access to metrics API (for GPU and custom metrics)
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
      - nodes
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: netdata
  labels:
    app.kubernetes.io/name: netdata
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: netdata
subjects:
  - kind: ServiceAccount
    name: netdata
    namespace: netdata
