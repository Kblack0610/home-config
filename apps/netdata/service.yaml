---
# ClusterIP service for internal access and Ingress
apiVersion: v1
kind: Service
metadata:
  name: netdata
  namespace: netdata
  labels:
    app.kubernetes.io/name: netdata
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: netdata
  ports:
    - name: http
      port: 19999
      targetPort: http
      protocol: TCP
---
# Optional: LoadBalancer service for direct external access
# Uncomment if you want a dedicated IP for Netdata
# Note: Since DaemonSet uses hostPort, you can also access via node_ip:19999
