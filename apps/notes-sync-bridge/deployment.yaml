apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-sync-bridge
  namespace: notes-sync-bridge
  labels:
    app.kubernetes.io/name: notes-sync-bridge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: notes-sync-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notes-sync-bridge
    spec:
      containers:
        - name: bridge
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # mosquitto_pub is the only non-stdlib binary we need; install
              # it once at startup. ~3MB, ~2s on a fresh pod.
              if ! command -v mosquitto_pub >/dev/null 2>&1; then
                  apk add --no-cache mosquitto-clients
              fi
              exec python /app/bridge.py
          envFrom:
            - secretRef:
                name: notes-sync-bridge-secret
          env:
            - name: MQTT_HOST
              value: mosquitto.mosquitto.svc.cluster.local
            - name: MQTT_PORT
              value: "1883"
            - name: MQTT_TOPIC
              value: "notes/sync/needed"
            - name: NTFY_URL
              value: "http://ntfy.ntfy.svc.cluster.local/notes-sync"
            - name: LISTEN_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: script
          configMap:
            name: notes-sync-bridge-script
