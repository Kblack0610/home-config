apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-public-server-config
  namespace: ntfy-public
  labels:
    app.kubernetes.io/name: ntfy-public
data:
  server.yml: |
    base-url: "https://ship.blacknbrownstudios.com"
    listen-http: ":80"
    behind-proxy: true
    cache-file: "/var/cache/ntfy/cache.db"
    cache-duration: "12h"
    attachment-cache-dir: "/var/cache/ntfy/attachments"
    auth-file: "/var/lib/ntfy/user.db"
    # Public broker on the open internet (via the Cloudflare tunnel). Unlike the
    # private apps/ntfy instance (LAN-only, no app-layer auth), access here is
    # enforced inside ntfy, declaratively (GitOps-friendly: no CLI seeding, no
    # chicken-and-egg with the auth-file):
    #   - deny-all by default
    #   - everyone (anonymous) gets read-only on the ship topic
    #   - the publisher user gets read-write on ship (CI + weekly digest)
    # The password below is a one-way bcrypt hash (safe in git); the plaintext
    # lives only in the GitHub secret NTFY_SHIP_PASS for CI Basic auth. The
    # teammate subscribes anonymously and needs no account or token.
    auth-default-access: "deny-all"
    auth-users:
      - "publisher:$2a$10$sJ4wmL.MgB7RbhbdB.syoOUOx.esBwFpK0RR7BHJYxL8rpp9JUqNy:user"
    auth-access:
      - "publisher:ship:rw"
      - "everyone:ship:ro"
    behavior-since-time: true
    # Serve the ntfy web app so the URL renders as a browsable feed page.
    web-root: "app"
