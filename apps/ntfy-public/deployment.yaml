apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy-public
  namespace: ntfy-public
  labels:
    app.kubernetes.io/name: ntfy-public
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy-public
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntfy-public
    spec:
      # Access control is declared in the ConfigMap (auth-users + auth-access),
      # so ntfy provisions the publisher user + ACL on startup — no init-container
      # seeding (the CLI can't seed before the server creates the auth-file).
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:v2.24.0
          imagePullPolicy: IfNotPresent
          args:
            - serve
          ports:
            - name: http
              containerPort: 80
          env:
            - name: NTFY_LISTEN_HTTP
              value: ":80"
          volumeMounts:
            - name: data
              mountPath: /var/lib/ntfy
              subPath: lib
            - name: data
              mountPath: /var/cache/ntfy
              subPath: cache
            - name: config
              mountPath: /etc/ntfy
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ntfy-public-data
        - name: config
          configMap:
            name: ntfy-public-server-config
