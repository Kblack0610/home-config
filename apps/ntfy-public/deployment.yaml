apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy-public
  namespace: ntfy-public
  labels:
    app.kubernetes.io/name: ntfy-public
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy-public
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntfy-public
    spec:
      # Seed access control into the auth-file before the server starts.
      # Idempotent: safe to re-run on every pod start (handles password rotation).
      initContainers:
        - name: seed-access
          image: binwiederhier/ntfy:v2.11.0
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # Anonymous read-only on the public broadcast topic.
              ntfy access everyone ship read-only
              # Publisher user (read-write on `ship`); used by CI + weekly digest.
              # `user add` fails if the user already exists — tolerate it, then
              # force the password to match the secret so rotation works.
              NTFY_PASSWORD="$NTFY_PUBLISHER_PASSWORD" ntfy user add --role=user publisher 2>/dev/null || true
              NTFY_PASSWORD="$NTFY_PUBLISHER_PASSWORD" ntfy user change-pass publisher
              ntfy access publisher ship read-write
          env:
            - name: NTFY_PUBLISHER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ntfy-public-publisher
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/ntfy
              subPath: lib
            - name: config
              mountPath: /etc/ntfy
              readOnly: true
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:v2.11.0
          imagePullPolicy: IfNotPresent
          args:
            - serve
          ports:
            - name: http
              containerPort: 80
          env:
            - name: NTFY_LISTEN_HTTP
              value: ":80"
          volumeMounts:
            - name: data
              mountPath: /var/lib/ntfy
              subPath: lib
            - name: data
              mountPath: /var/cache/ntfy
              subPath: cache
            - name: config
              mountPath: /etc/ntfy
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ntfy-public-data
        - name: config
          configMap:
            name: ntfy-public-server-config
