# officecup.blacknbrownstudios.com -> office-cup-web. external-dns derives the
# proxied Cloudflare CNAME (-> the public-sites tunnel) from this Ingress; the
# tunnel's catch-all forwards to Traefik, which host-matches here. TLS via
# cert-manager DNS-01 (letsencrypt-dns) — the CF token covers every zone.
# A preview subdomain under the existing bnb-studios zone; a dedicated
# officecup.com domain can be repointed later (see docs/plans/office-cup_parity.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: office-cup-web
  namespace: office-cup
  labels:
    app: office-cup-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - officecup.blacknbrownstudios.com
      secretName: office-cup-web-tls
  rules:
    - host: officecup.blacknbrownstudios.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: office-cup-web
                port:
                  number: 80
