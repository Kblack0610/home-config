apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw
data:
  openclaw.json: |
    {
      "logging": {
        "level": "info",
        "file": "~/.openclaw/logs/openclaw.log",
        "consoleLevel": "info",
        "consoleStyle": "pretty",
        "redactSensitive": "tools"
      },
      "models": {
        "mode": "merge",
        "providers": {
          "mlx-code": {
            "baseUrl": "http://192.168.1.4:8080/v1",
            "apiKey": "local",
            "api": "openai-completions",
            "models": [
              {
                "id": "mlx-community/Qwen3-Coder-Next-4bit",
                "name": "Qwen3 Coder Next 4bit",
                "reasoning": false,
                "input": ["text"],
                "cost": {
                  "input": 0,
                  "output": 0,
                  "cacheRead": 0,
                  "cacheWrite": 0
                },
                "contextWindow": 128000,
                "maxTokens": 32768
              }
            ]
          },
          "mlx-smart": {
            "baseUrl": "http://192.168.1.4:8081/v1",
            "apiKey": "local",
            "api": "openai-completions",
            "models": [
              {
                "id": "mlx-community/Qwen3-235B-A22B-4bit-DWQ",
                "name": "Qwen3 235B A22B 4bit DWQ",
                "reasoning": true,
                "input": ["text"],
                "cost": {
                  "input": 0,
                  "output": 0,
                  "cacheRead": 0,
                  "cacheWrite": 0
                },
                "contextWindow": 128000,
                "maxTokens": 32768
              }
            ]
          },
          "mlx-reasoning": {
            "baseUrl": "http://192.168.1.4:8082/v1",
            "apiKey": "local",
            "api": "openai-completions",
            "models": [
              {
                "id": "mlx-community/DeepSeek-R1-Distill-Qwen-32B-MLX-4Bit",
                "name": "DeepSeek R1 Distill Qwen 32B MLX 4Bit",
                "reasoning": true,
                "input": ["text"],
                "cost": {
                  "input": 0,
                  "output": 0,
                  "cacheRead": 0,
                  "cacheWrite": 0
                },
                "contextWindow": 64000,
                "maxTokens": 16384
              }
            ]
          }
        }
      },
      "agents": {
        "defaults": {
          "models": {
            "mlx-code/mlx-community/Qwen3-Coder-Next-4bit": {
              "alias": "code"
            },
            "mlx-smart/mlx-community/Qwen3-235B-A22B-4bit-DWQ": {
              "alias": "smart"
            },
            "mlx-reasoning/mlx-community/DeepSeek-R1-Distill-Qwen-32B-MLX-4Bit": {
              "alias": "reasoning"
            }
          },
          "model": {
            "primary": "mlx-smart/mlx-community/Qwen3-235B-A22B-4bit-DWQ",
            "fallbacks": [
              "mlx-code/mlx-community/Qwen3-Coder-Next-4bit",
              "mlx-reasoning/mlx-community/DeepSeek-R1-Distill-Qwen-32B-MLX-4Bit"
            ]
          },
          "workspace": "~/.openclaw/workspace",
          "userTimezone": "America/Los_Angeles",
          "compaction": {
            "mode": "safeguard"
          },
          "thinkingDefault": "low",
          "timeoutSeconds": 600,
          "sandbox": {
            "mode": "off"
          }
        },
        "list": [
          {
            "id": "main",
            "default": true,
            "name": "Home OpenClaw",
            "workspace": "~/.openclaw/workspace",
            "model": {
              "primary": "mlx-smart/mlx-community/Qwen3-235B-A22B-4bit-DWQ",
              "fallbacks": [
                "mlx-code/mlx-community/Qwen3-Coder-Next-4bit"
              ]
            }
          }
        ]
      },
      "tools": {
        "sessions": {
          "visibility": "all"
        }
      },
      "messages": {
        "ackReaction": "👀"
      },
      "commands": {
        "native": "auto",
        "nativeSkills": "auto",
        "restart": true,
        "ownerDisplay": "raw"
      },
      "gateway": {
        "port": 18789,
        "mode": "local",
        "bind": "lan",
        "auth": {
          "mode": "token",
          "allowTailscale": true,
          "rateLimit": {
            "maxAttempts": 10,
            "windowMs": 60000,
            "lockoutMs": 300000,
            "exemptLoopback": true
          }
        },
        "controlUi": {
          "enabled": true,
          "allowedOrigins": [
            "https://openclaw.kblab.me"
          ]
        }
      }
    }
  AGENTS.md: |
    # OpenClaw

    This OpenClaw instance runs on the `home-k3s` cluster for LAN-only access at `openclaw.kblab.me`.

    Prefer the local MLX-backed providers on the Mac Studio for inference:
    - `smart` for general reasoning
    - `code` for coding tasks
    - `reasoning` when explicit deep reasoning is needed

    Treat this workspace as durable cluster state. Avoid destructive changes unless explicitly requested.

