apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "auth": {
          "mode": "token",
          "token": "${OPENCLAW_GATEWAY_TOKEN}"
        },
        "controlUi": {
          "enabled": true,
          "allowInsecureAuth": true
        },
        "trustedProxies": ["10.42.0.0/16", "10.43.0.0/16", "192.168.1.0/24", "127.0.0.1", "10.42.1.67", "10.42.7.0"]
      },
      "agents": {
        "defaults": {
          "model": { "primary": "litellm/code" }
        }
      },
      "models": {
        "mode": "merge",
        "providers": {
          "litellm": {
            "baseUrl": "http://litellm.ai-gateway.svc.cluster.local:4000/v1",
            "apiKey": "${LITELLM_API_KEY}",
            "api": "openai-completions",
            "models": [
              {
                "id": "code",
                "name": "Code (Qwen3 Coder 480B via LiteLLM)",
                "contextWindow": 256000,
                "maxTokens": 32000
              },
              {
                "id": "smart",
                "name": "Smart (Qwen3 235B Q8 via LiteLLM)",
                "contextWindow": 256000,
                "maxTokens": 32000
              },
              {
                "id": "fast",
                "name": "Fast (Mistral Large 123B FP16 via LiteLLM)",
                "contextWindow": 128000,
                "maxTokens": 32000
              },
              {
                "id": "reasoning",
                "name": "Reasoning (DeepSeek V3.1 671B via LiteLLM)",
                "contextWindow": 160000,
                "maxTokens": 32000
              }
            ]
          }
        }
      }
    }
