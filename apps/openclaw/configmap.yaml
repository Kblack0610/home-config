apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw
data:
  openclaw.json: |
    {
      "logging": {
        "level": "info",
        "file": "~/.openclaw/logs/openclaw.log",
        "consoleLevel": "info",
        "consoleStyle": "pretty",
        "redactSensitive": "tools"
      },
      "models": {
        "mode": "merge",
        "providers": {
          "litellm": {
            "baseUrl": "http://litellm.ai-gateway.svc.cluster.local:4000/v1",
            "apiKey": "${LITELLM_API_KEY}",
            "api": "openai-completions",
            "models": [
              {
                "id": "mlx-community/Qwen3-Coder-Next-4bit",
                "name": "Qwen3 Coder Next 4bit (via LiteLLM)",
                "reasoning": false,
                "input": ["text"],
                "contextWindow": 128000,
                "maxTokens": 32768
              },
              {
                "id": "mlx-community/Qwen3.6-35B-A3B-4bit",
                "name": "Qwen3.6 35B A3B 4bit (via LiteLLM)",
                "reasoning": true,
                "input": ["text"],
                "contextWindow": 128000,
                "maxTokens": 32768
              },
              {
                "id": "mlx-community/GLM-5-4bit",
                "name": "GLM-5 4bit (via LiteLLM)",
                "reasoning": true,
                "input": ["text"],
                "contextWindow": 128000,
                "maxTokens": 32768
              },
              {
                "id": "mlx-community/GLM-4.6V-Flash-4bit",
                "name": "GLM-4.6V Flash 4bit Vision (via LiteLLM)",
                "reasoning": false,
                "input": ["text", "image"],
                "contextWindow": 128000,
                "maxTokens": 32768
              }
            ]
          }
        }
      },
      "agents": {
        "defaults": {
          "models": {
            "litellm/mlx-community/Qwen3-Coder-Next-4bit": {
              "alias": "litellm-code"
            },
            "litellm/mlx-community/Qwen3.6-35B-A3B-4bit": {
              "alias": "litellm-smart"
            },
            "litellm/mlx-community/GLM-5-4bit": {
              "alias": "litellm-reasoning"
            },
            "litellm/mlx-community/GLM-4.6V-Flash-4bit": {
              "alias": "litellm-vision"
            }
          },
          "model": {
            "primary": "litellm/mlx-community/Qwen3-Coder-Next-4bit",
            "fallbacks": [
              "litellm/mlx-community/Qwen3.6-35B-A3B-4bit",
              "litellm/mlx-community/GLM-5-4bit"
            ]
          },
          "workspace": "~/.openclaw/workspace",
          "userTimezone": "America/Los_Angeles",
          "compaction": {
            "mode": "safeguard"
          },
          "thinkingDefault": "medium",
          "timeoutSeconds": 600,
          "sandbox": {
            "mode": "off"
          }
        },
        "list": [
          {
            "id": "main",
            "default": true,
            "name": "Home OpenClaw",
            "workspace": "~/.openclaw/workspace",
            "model": {
              "primary": "litellm/mlx-community/Qwen3-Coder-Next-4bit",
              "fallbacks": [
                "litellm/mlx-community/Qwen3.6-35B-A3B-4bit",
                "litellm/mlx-community/GLM-5-4bit"
              ]
            }
          }
        ]
      },
      "tools": {
        "sessions": {
          "visibility": "all"
        }
      },
      "messages": {
        "ackReaction": "👀"
      },
      "commands": {
        "native": "auto",
        "nativeSkills": "auto",
        "restart": true,
        "ownerDisplay": "raw"
      },
      "gateway": {
        "port": 18789,
        "mode": "local",
        "bind": "lan",
        "auth": {
          "mode": "token",
          "allowTailscale": true,
          "rateLimit": {
            "maxAttempts": 10,
            "windowMs": 60000,
            "lockoutMs": 300000,
            "exemptLoopback": true
          }
        },
        "controlUi": {
          "enabled": true,
          "allowedOrigins": [
            "https://openclaw.kblab.me"
          ]
        }
      }
    }
  AGENTS.md: |
    # OpenClaw

    This OpenClaw instance runs on the `home-k3s` cluster for LAN-only access at `openclaw.kblab.me`.

    All inference is routed through the in-cluster LiteLLM gateway, which proxies to the MLX backends on the Mac Studio:
    - `litellm-code` for coding tasks (Qwen3-Coder-Next-4bit) — default primary
    - `litellm-smart` for general reasoning (Qwen3.6-35B-A3B-4bit)
    - `litellm-reasoning` for explicit deep reasoning (GLM-5-4bit)
    - `litellm-vision` for image+text inputs (GLM-4.6V-Flash-4bit)

    Treat this workspace as durable cluster state. Avoid destructive changes unless explicitly requested.

