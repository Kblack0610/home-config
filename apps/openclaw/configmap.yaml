apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw
data:
  openclaw.json: |
    {
      "logging": {
        "level": "info",
        "file": "~/.openclaw/logs/openclaw.log",
        "consoleLevel": "info",
        "consoleStyle": "pretty",
        "redactSensitive": "tools"
      },
      "models": {
        "mode": "merge",
        "providers": {
          "litellm": {
            "baseUrl": "http://litellm.ai-gateway.svc.cluster.local:4000/v1",
            "apiKey": "${LITELLM_API_KEY}",
            "api": "openai-completions",
            "models": [
              {
                "id": "code (Qwen3-Coder-Next-4bit)",
                "name": "code — Qwen3-Coder-Next 4bit",
                "reasoning": false,
                "input": [
                  "text"
                ],
                "contextWindow": 128000,
                "maxTokens": 32768
              },
              {
                "id": "reasoning (Qwen3.6-35B-A3B-4bit)",
                "name": "reasoning — Qwen3.6-35B-A3B 4bit (mlx-community)",
                "reasoning": true,
                "input": [
                  "text"
                ],
                "contextWindow": 128000,
                "maxTokens": 32768
              },
              {
                "id": "fast (Qwen3-4B)",
                "name": "fast — Qwen3 4B (latency-sensitive)",
                "reasoning": false,
                "input": [
                  "text"
                ],
                "contextWindow": 128000,
                "maxTokens": 32768
              },
              {
                "id": "vlm (gemini-3-flash)",
                "name": "vlm — Gemini 3 Flash (vision input + PDF, paid)",
                "reasoning": false,
                "input": [
                  "text",
                  "image"
                ],
                "contextWindow": 1000000,
                "maxTokens": 8192
              }
            ]
          }
        }
      },
      "mcp": {
        "servers": {
          "filesystem": {
            "command": "npx",
            "args": [
              "-y",
              "@modelcontextprotocol/server-filesystem",
              "/home/node/.openclaw/workspace"
            ]
          }
        }
      },
      "agents": {
        "defaults": {
          "models": {
            "litellm/code (Qwen3-Coder-Next-4bit)": {
              "alias": "litellm-code"
            },
            "litellm/reasoning (Qwen3.6-35B-A3B-4bit)": {
              "alias": "litellm-reasoning"
            },
            "litellm/fast (Qwen3-4B)": {
              "alias": "litellm-fast"
            },
            "litellm/vlm (gemini-3-flash)": {
              "alias": "litellm-vlm"
            }
          },
          "model": {
            "primary": "litellm/code (Qwen3-Coder-Next-4bit)",
            "fallbacks": [
              "litellm/reasoning (Qwen3.6-35B-A3B-4bit)"
            ]
          },
          "imageModel": {
            "primary": "litellm/vlm (gemini-3-flash)"
          },
          "pdfModel": {
            "primary": "litellm/vlm (gemini-3-flash)"
          },
          "workspace": "~/.openclaw/workspace",
          "userTimezone": "America/Los_Angeles",
          "compaction": {
            "mode": "safeguard"
          },
          "thinkingDefault": "medium",
          "timeoutSeconds": 600,
          "sandbox": {
            "mode": "off"
          }
        },
        "list": [
          {
            "id": "main",
            "default": true,
            "name": "Home OpenClaw",
            "workspace": "~/.openclaw/workspace",
            "model": {
              "primary": "litellm/code (Qwen3-Coder-Next-4bit)",
              "fallbacks": [
                "litellm/reasoning (Qwen3.6-35B-A3B-4bit)"
              ]
            }
          }
        ]
      },
      "tools": {
        "sessions": {
          "visibility": "all"
        }
      },
      "messages": {
        "ackReaction": "👀"
      },
      "commands": {
        "native": "auto",
        "nativeSkills": "auto",
        "restart": true,
        "ownerDisplay": "raw"
      },
      "gateway": {
        "port": 18789,
        "mode": "local",
        "bind": "lan",
        "auth": {
          "mode": "token",
          "allowTailscale": true,
          "rateLimit": {
            "maxAttempts": 10,
            "windowMs": 60000,
            "lockoutMs": 300000,
            "exemptLoopback": true
          }
        },
        "controlUi": {
          "enabled": true,
          "allowedOrigins": [
            "https://openclaw.kblab.me"
          ]
        }
      },
      "plugins": {
        "entries": {
          "litellm": {
            "enabled": true
          }
        }
      },
      "meta": {
        "lastTouchedVersion": "bootstrap",
        "lastTouchedAt": "2026-01-01T00:00:00.000Z"
      }
    }
  AGENTS.md: |
    # OpenClaw

    This OpenClaw instance runs on the `home-k3s` cluster for LAN-only access at `openclaw.kblab.me`.

    All inference is routed through the in-cluster LiteLLM gateway, which proxies to the single mlx-server on Mac Studio. Aliases follow the
    `category (Model-Name)` naming convention so the model is visible in the route name:
    - `litellm-code` → `code (Qwen3-Coder-Next-4bit)` — default primary, agentic coding + tool calls
    - `litellm-reasoning` → `reasoning (Qwen3.6-35B-A3B-4bit)` — mlx-community quant, thinking model
    - `litellm-fast` → `fast (Qwen3-4B)` — small dense model, latency-sensitive workloads
    - `litellm-embedding` → `embedding (modernbert-embed-base-4bit)` — 768-dim, mem0 / pgvector

    Vision-input slot is currently parked — mlx-openai-server's multimodal handler hits a GPU-thread bug.

    Treat this workspace as durable cluster state. Avoid destructive changes unless explicitly requested.

    ## Operating loop (self-healing on long sessions)

    Local MLX models lose coherence past ~32–64k effective context even when the
    advertised window is 128k. Run the loop below to stay productive across
    long sessions:

    1. **Plan before you build.** First turn on a non-trivial task: write a 3–7
       step plan and the expected verification command. No edits until the plan
       is on the table.
    2. **Verify after every edit batch.** After each tool-call run that wrote
       or changed files, immediately invoke the smallest credible check
       (compile, lint, unit test, `kubectl --dry-run`, schema validate). Treat
       the check output as part of the next turn's input, not as decoration.
    3. **Retry on tool errors before escalating.** If a tool call returns a
       parse / argument / shell error, retry once with corrected inputs in the
       same turn. If it fails twice, stop and ask, do not loop.
    4. **Compact loudly.** When you notice your own context drifting (forgetting
       file paths, repeating questions, contradicting earlier statements),
       say so and write a short "Context refresh" summary covering the goal,
       what's done, what's left, and the active constraints. Then continue.
    5. **Tool preference order.** Native OpenClaw tools (`read`, `write`,
       `bash`, `browser`) > skills (`openclaw skills list` for what's ready,
       includes `coding-agent`, `github`, `gh-issues`, `session-logs`, `tmux`,
       `browser-automation`, etc.) > MCP servers. Reach for MCPs only when
       nothing else covers the need. The `filesystem` MCP is currently wired
       as a fallback; after `coding-agent` lands it likely becomes redundant
       with the native bash/read/write tools.

    ## Known limits

    - One mlx-server endpoint serves all models, so parallel sub-agent fan-out
      serializes. Plan sequentially.
    - Tool-call format quirks on Qwen3-Coder-Next: if a tool result comes back
      malformed, restate the tool args explicitly in the next turn instead of
      retrying the same call.

