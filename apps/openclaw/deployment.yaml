apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openclaw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openclaw
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: init-config
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              set -e
              sed -e "s|\${OPENCLAW_GATEWAY_TOKEN}|${OPENCLAW_GATEWAY_TOKEN}|g" \
                  -e "s|\${LITELLM_API_KEY}|${LITELLM_API_KEY}|g" \
                  /etc/openclaw-config/openclaw.json > /home/node/.openclaw/openclaw.json
              echo "Config with substituted secrets copied to PVC"
          env:
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: LITELLM_API_KEY
          volumeMounts:
            - name: config
              mountPath: /etc/openclaw-config
            - name: data
              mountPath: /home/node/.openclaw
      containers:
        - name: openclaw
          image: alpine/openclaw:latest
          command: ["node", "dist/index.js"]
          args: ["gateway", "--bind", "lan", "--port", "18789"]
          ports:
            - name: gateway
              containerPort: 18789
            - name: bridge
              containerPort: 18790
          env:
            - name: HOME
              value: /home/node
            - name: TERM
              value: xterm-256color
            - name: NODE_ENV
              value: production
          envFrom:
            - secretRef:
                name: openclaw-secrets
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1536Mi"
              cpu: "2000m"
          livenessProbe:
            tcpSocket:
              port: 18789
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 18789
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: openclaw-config
        - name: data
          persistentVolumeClaim:
            claimName: openclaw-data
        - name: localtime
          hostPath:
            path: /etc/localtime
