apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openclaw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openclaw
    spec:
      securityContext:
        fsGroup: 1000
      imagePullSecrets:
        - name: forgejo-registry
      initContainers:
        - name: bootstrap-config
          image: busybox:1.36.1
          env:
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: LITELLM_API_KEY
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /data/workspace /data/logs
              # Hash-gated reseed: only overwrite openclaw.json when the
              # bootstrap source has actually changed. OpenClaw rewrites the
              # file at runtime (adds plugins.entries.* / meta.lastTouchedAt),
              # so an unconditional sed-overwrite on every restart kept
              # generating openclaw.json.clobbered.<ts> files and wiping
              # runtime-managed keys.
              SRC_HASH=$(sha256sum /bootstrap/openclaw.json | awk '{print $1}')
              APPLIED_HASH_FILE=/data/.openclaw-bootstrap-hash
              APPLIED_HASH=""
              [ -f "$APPLIED_HASH_FILE" ] && APPLIED_HASH=$(cat "$APPLIED_HASH_FILE")
              if [ ! -f /data/openclaw.json ] || [ "$APPLIED_HASH" != "$SRC_HASH" ]; then
                if [ -f /data/openclaw.json ]; then
                  TS=$(date -u +%Y-%m-%dT%H-%M-%SZ)
                  cp /data/openclaw.json /data/openclaw.json.bak-bootstrap-$TS
                fi
                sed "s|\${LITELLM_API_KEY}|${LITELLM_API_KEY}|g" \
                  /bootstrap/openclaw.json > /data/openclaw.json
                printf '%s' "$SRC_HASH" > "$APPLIED_HASH_FILE"
              fi
              if [ ! -f /data/workspace/AGENTS.md ]; then
                cp /bootstrap/AGENTS.md /data/workspace/AGENTS.md
              fi
              chown -R 1000:1000 /data
          volumeMounts:
            - name: data
              mountPath: /data
            - name: bootstrap
              mountPath: /bootstrap
      containers:
        - name: openclaw
          image: ghcr.io/openclaw/openclaw:latest
          imagePullPolicy: Always
          command:
            - openclaw
          args:
            - gateway
            - run
          env:
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: LITELLM_API_KEY
          ports:
            - name: http
              containerPort: 18789
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            tcpSocket:
              port: 18789
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 18789
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openclaw-data
        - name: bootstrap
          configMap:
            name: openclaw-config

