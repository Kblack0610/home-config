apiVersion: apps/v1
kind: Deployment
metadata:
  name: orcaslicer
  namespace: orcaslicer
  labels:
    app.kubernetes.io/name: orcaslicer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: orcaslicer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orcaslicer
    spec:
      securityContext:
        supplementalGroups:
          - 987   # render
          - 983   # video
      nodeSelector:
        kubernetes.io/hostname: asus-laptop
        storage.role/nas: "true"
      initContainers:
        - name: seed-config
          image: busybox:1.37
          command:
            - /bin/sh
            - -c
            - |
              set -e
              CONFIG_DIR="/config/.config/OrcaSlicer"
              USER_DIR="$CONFIG_DIR/user/default"
              mkdir -p "$USER_DIR/machine" "$USER_DIR/filament" "$USER_DIR/process"
              # OrcaSlicer.conf (first-run wizard done, vendors, printer list) is
              # seeded once; after that it is the app's own state.
              if [ ! -f "$CONFIG_DIR/OrcaSlicer.conf" ]; then
                cp /seed/orcaslicer.conf "$CONFIG_DIR/OrcaSlicer.conf"
                echo "Seeded OrcaSlicer.conf"
              fi
              # The presets are git's (apps/orcaslicer/profiles/): every start
              # overwrites them, so an edit made here lasts until the next restart.
              # One line per preset: ConfigMap key, folder, preset name.
              while IFS='|' read -r key dir name; do
                [ -n "$key" ] || continue
                cp "/seed/$key.json" "$USER_DIR/$dir/$name.json"
                cp "/seed/$key.info" "$USER_DIR/$dir/$name.info"
              done <<'PRESETS'
              machine-neptune4pro|machine|Elegoo Neptune 4 Pro (0.4 nozzle)-OpenNept4une
              machine-neptune4pro-08|machine|Elegoo Neptune 4 Pro (0.8 nozzle)-OpenNept4une
              machine-bambu-a1|machine|Bambu Lab A1 (0.4 nozzle)-LAN
              filament-pla|filament|Elegoo Generic PLA-OpenNept4une
              filament-petg|filament|Elegoo Generic PETG-OpenNept4une
              process-standard|process|0.20mm Standard @Elegoo Neptune4Pro (0.4 nozzle)-OpenNept4une
              process-petg|process|0.20mm PETG @Elegoo Neptune4Pro (0.4 nozzle)-OpenNept4une
              process-standard-08|process|0.40mm Standard @Elegoo Neptune4Pro (0.8 nozzle)-OpenNept4une
              PRESETS
              # The A1 LAN code and serial live in the SOPS Secret, never in git;
              # the profiles carry @A1_...@ placeholders (scripts/check-secret-store.py).
              sed -i -e "s/@A1_ACCESS_CODE@/$A1_ACCESS_CODE/g" -e "s/@A1_SERIAL@/$A1_SERIAL/g" \
                "$CONFIG_DIR/OrcaSlicer.conf" \
                "$USER_DIR/machine/Bambu Lab A1 (0.4 nozzle)-LAN.json"
              echo "Presets synced from the orcaslicer-profiles ConfigMap."
          env:
            - name: A1_ACCESS_CODE
              valueFrom:
                secretKeyRef:
                  name: bambu-a1-credentials
                  key: access-code
            - name: A1_SERIAL
              valueFrom:
                secretKeyRef:
                  name: bambu-a1-credentials
                  key: serial
          volumeMounts:
            - name: config
              mountPath: /config
            - name: profiles
              mountPath: /seed
              readOnly: true
      containers:
        - name: orcaslicer
          image: lscr.io/linuxserver/orcaslicer:v2.3.2-ls9
          env:
            - name: PUID
              value: "0"
            - name: PGID
              value: "0"
            - name: TZ
              value: America/Los_Angeles
            - name: TITLE
              value: OrcaSlicer
            - name: NO_GAMEPAD
              value: "true"
            - name: DRINODE
              value: "/dev/dri/renderD128"
            - name: SELKIES_FRAMERATE
              value: "30"
            - name: SELKIES_IS_MANUAL_RESOLUTION_MODE
              value: "true"
            - name: SELKIES_MANUAL_WIDTH
              value: "1280"
            - name: SELKIES_MANUAL_HEIGHT
              value: "720"
            - name: SELKIES_USE_CSS_SCALING
              value: "true"
            - name: SELKIES_AUDIO_ENABLED
              value: "false"
            - name: SELKIES_MICROPHONE_ENABLED
              value: "false"
            - name: SELKIES_SECOND_SCREEN
              value: "false"
            - name: LIBGL_ALWAYS_SOFTWARE
              value: "0"
            - name: GALLIUM_DRIVER
              value: ""
            - name: WEBKIT_DISABLE_COMPOSITING_MODE
              value: "1"
            - name: WEBKIT_DISABLE_DMABUF_RENDERER
              value: "1"
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: config
              mountPath: /config
            - name: prints
              mountPath: /prints
            - name: shm
              mountPath: /dev/shm
            - name: dri
              mountPath: /dev/dri
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
          securityContext:
            privileged: true
          lifecycle:
            postStart:
              exec:
                # Privileged containers get all host devices auto-populated into
                # the container's /dev tmpfs. Remove the iGPU nodes so Mesa only
                # enumerates the Radeon Navi 22 dGPU at renderD128.
                command:
                  - /bin/sh
                  - -c
                  - "rm -f /dev/dri/renderD129 /dev/dri/card2 || true"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "4Gi"
              cpu: "4000m"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -x orcaslicer_main > /dev/null"
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          hostPath:
            path: /mnt/media/app-config/orcaslicer
            type: DirectoryOrCreate
        - name: prints
          hostPath:
            path: /mnt/nas/public/3d-printing
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: profiles
          configMap:
            name: orcaslicer-profiles
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
        - name: localtime
          hostPath:
            path: /etc/localtime
