apiVersion: apps/v1
kind: Deployment
metadata:
  name: orcaslicer
  namespace: orcaslicer
  labels:
    app.kubernetes.io/name: orcaslicer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: orcaslicer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orcaslicer
    spec:
      securityContext:
        supplementalGroups:
          - 987   # render
          - 983   # video
      nodeSelector:
        kubernetes.io/hostname: asus-laptop
        storage.role/nas: "true"
      initContainers:
        - name: seed-config
          image: busybox:1.37
          command:
            - /bin/sh
            - -c
            - |
              CONFIG_DIR="/config/.config/OrcaSlicer"
              if [ -f "$CONFIG_DIR/OrcaSlicer.conf" ]; then
                echo "OrcaSlicer config already exists, skipping seed."
                exit 0
              fi
              echo "Seeding OrcaSlicer config from ConfigMap..."
              mkdir -p "$CONFIG_DIR/user/default/machine"
              mkdir -p "$CONFIG_DIR/user/default/filament"
              mkdir -p "$CONFIG_DIR/user/default/process"
              # Main config (marks first-run wizard complete)
              cp /seed/orcaslicer.conf "$CONFIG_DIR/OrcaSlicer.conf"
              # Machine profile
              cp /seed/machine-neptune4pro.json "$CONFIG_DIR/user/default/machine/Elegoo Neptune 4 Pro (0.4 nozzle)-OpenNept4une.json"
              cp /seed/machine-neptune4pro.info "$CONFIG_DIR/user/default/machine/Elegoo Neptune 4 Pro (0.4 nozzle)-OpenNept4une.info"
              # Bambu A1 machine profile
              cp /seed/machine-bambu-a1.json "$CONFIG_DIR/user/default/machine/Bambu Lab A1 (0.4 nozzle)-LAN.json"
              cp /seed/machine-bambu-a1.info "$CONFIG_DIR/user/default/machine/Bambu Lab A1 (0.4 nozzle)-LAN.info"
              # Filament profiles
              cp /seed/filament-pla.json "$CONFIG_DIR/user/default/filament/Elegoo Generic PLA-OpenNept4une.json"
              cp /seed/filament-pla.info "$CONFIG_DIR/user/default/filament/Elegoo Generic PLA-OpenNept4une.info"
              cp /seed/filament-petg.json "$CONFIG_DIR/user/default/filament/Elegoo Generic PETG-OpenNept4une.json"
              cp /seed/filament-petg.info "$CONFIG_DIR/user/default/filament/Elegoo Generic PETG-OpenNept4une.info"
              # Print process profiles
              cp /seed/process-standard.json "$CONFIG_DIR/user/default/process/0.20mm Standard @Elegoo Neptune4Pro (0.4 nozzle)-OpenNept4une.json"
              cp /seed/process-standard.info "$CONFIG_DIR/user/default/process/0.20mm Standard @Elegoo Neptune4Pro (0.4 nozzle)-OpenNept4une.info"
              cp /seed/process-petg.json "$CONFIG_DIR/user/default/process/0.20mm PETG @Elegoo Neptune4Pro (0.4 nozzle)-OpenNept4une.json"
              cp /seed/process-petg.info "$CONFIG_DIR/user/default/process/0.20mm PETG @Elegoo Neptune4Pro (0.4 nozzle)-OpenNept4une.info"
              echo "Config seeding complete."
          volumeMounts:
            - name: config
              mountPath: /config
            - name: profiles
              mountPath: /seed
              readOnly: true
      containers:
        - name: orcaslicer
          image: lscr.io/linuxserver/orcaslicer:v2.3.2-ls9
          env:
            - name: PUID
              value: "0"
            - name: PGID
              value: "0"
            - name: TZ
              value: America/Los_Angeles
            - name: TITLE
              value: OrcaSlicer
            - name: NO_GAMEPAD
              value: "true"
            - name: DRINODE
              value: "/dev/dri/renderD128"
            - name: SELKIES_FRAMERATE
              value: "30"
            - name: SELKIES_IS_MANUAL_RESOLUTION_MODE
              value: "true"
            - name: SELKIES_MANUAL_WIDTH
              value: "1280"
            - name: SELKIES_MANUAL_HEIGHT
              value: "720"
            - name: SELKIES_USE_CSS_SCALING
              value: "true"
            - name: SELKIES_AUDIO_ENABLED
              value: "false"
            - name: SELKIES_MICROPHONE_ENABLED
              value: "false"
            - name: SELKIES_SECOND_SCREEN
              value: "false"
            - name: LIBGL_ALWAYS_SOFTWARE
              value: "0"
            - name: GALLIUM_DRIVER
              value: ""
            - name: WEBKIT_DISABLE_COMPOSITING_MODE
              value: "1"
            - name: WEBKIT_DISABLE_DMABUF_RENDERER
              value: "1"
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: config
              mountPath: /config
            - name: prints
              mountPath: /prints
            - name: shm
              mountPath: /dev/shm
            - name: dri
              mountPath: /dev/dri
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
          securityContext:
            privileged: true
          lifecycle:
            postStart:
              exec:
                # Privileged containers get all host devices auto-populated into
                # the container's /dev tmpfs. Remove the iGPU nodes so Mesa only
                # enumerates the Radeon Navi 22 dGPU at renderD128.
                command:
                  - /bin/sh
                  - -c
                  - "rm -f /dev/dri/renderD129 /dev/dri/card2 || true"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "4Gi"
              cpu: "4000m"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -x orcaslicer_main > /dev/null"
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          hostPath:
            path: /mnt/media/app-config/orcaslicer
            type: DirectoryOrCreate
        - name: prints
          hostPath:
            path: /mnt/nas/public/3d-printing
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: profiles
          configMap:
            name: orcaslicer-profiles
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
        - name: localtime
          hostPath:
            path: /etc/localtime
