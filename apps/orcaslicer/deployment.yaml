apiVersion: apps/v1
kind: Deployment
metadata:
  name: orcaslicer
  namespace: orcaslicer
  labels:
    app.kubernetes.io/name: orcaslicer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: orcaslicer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orcaslicer
    spec:
      nodeSelector:
        kubernetes.io/hostname: asus-laptop
        storage.role/nas: "true"
      containers:
        - name: orcaslicer
          image: lscr.io/linuxserver/orcaslicer:v2.3.2-ls9
          env:
            - name: PUID
              value: "0"
            - name: PGID
              value: "0"
            - name: TZ
              value: America/Los_Angeles
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: config
              mountPath: /config
            - name: prints
              mountPath: /prints
            - name: shm
              mountPath: /dev/shm
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "4Gi"
              cpu: "4000m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          hostPath:
            path: /mnt/media/app-config/orcaslicer
            type: DirectoryOrCreate
        - name: prints
          hostPath:
            path: /mnt/nas/public/3d-printing
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: localtime
          hostPath:
            path: /etc/localtime
