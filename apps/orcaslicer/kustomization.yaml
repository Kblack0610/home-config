apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: orcaslicer

resources:
  - namespace.yaml
  - bambu-a1-secret.yaml
  - deployment.yaml
  - service.yaml
  - tlsoption.yaml
  - ingress.yaml

# The presets are files under profiles/ (named exactly as OrcaSlicer names them),
# plus the k3s first-run OrcaSlicer.conf.
# ConfigMap keys cannot hold spaces, so each gets a short key; the init container
# in deployment.yaml maps the keys back to preset names. apps/print-service mounts
# this ConfigMap by name, so it keeps a fixed name (no hash suffix).
configMapGenerator:
  - name: orcaslicer-profiles
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/name: orcaslicer
    files:
      - orcaslicer.conf=OrcaSlicer.conf
      - machine-neptune4pro.json=profiles/machine/Elegoo Neptune 4 Pro (0.4 nozzle)-OpenNept4une.json
      - machine-neptune4pro.info=profiles/machine/Elegoo Neptune 4 Pro (0.4 nozzle)-OpenNept4une.info
      - machine-neptune4pro-08.json=profiles/machine/Elegoo Neptune 4 Pro (0.8 nozzle)-OpenNept4une.json
      - machine-neptune4pro-08.info=profiles/machine/Elegoo Neptune 4 Pro (0.8 nozzle)-OpenNept4une.info
      - machine-bambu-a1.json=profiles/machine/Bambu Lab A1 (0.4 nozzle)-LAN.json
      - machine-bambu-a1.info=profiles/machine/Bambu Lab A1 (0.4 nozzle)-LAN.info
      - filament-pla.json=profiles/filament/Elegoo Generic PLA-OpenNept4une.json
      - filament-pla.info=profiles/filament/Elegoo Generic PLA-OpenNept4une.info
      - filament-petg.json=profiles/filament/Elegoo Generic PETG-OpenNept4une.json
      - filament-petg.info=profiles/filament/Elegoo Generic PETG-OpenNept4une.info
      - filament-silk-pla.json=profiles/filament/Elegoo Silk PLA-OpenNept4une.json
      - filament-silk-pla.info=profiles/filament/Elegoo Silk PLA-OpenNept4une.info
      - process-standard.json=profiles/process/0.20mm Standard @Elegoo Neptune4Pro (0.4 nozzle)-OpenNept4une.json
      - process-standard.info=profiles/process/0.20mm Standard @Elegoo Neptune4Pro (0.4 nozzle)-OpenNept4une.info
      - process-petg.json=profiles/process/0.20mm PETG @Elegoo Neptune4Pro (0.4 nozzle)-OpenNept4une.json
      - process-petg.info=profiles/process/0.20mm PETG @Elegoo Neptune4Pro (0.4 nozzle)-OpenNept4une.info
      - process-standard-08.json=profiles/process/0.40mm Standard @Elegoo Neptune4Pro (0.8 nozzle)-OpenNept4une.json
      - process-standard-08.info=profiles/process/0.40mm Standard @Elegoo Neptune4Pro (0.8 nozzle)-OpenNept4une.info
      - process-seashell.json=profiles/process/0.12mm Seashell @Elegoo Neptune4Pro (0.4 nozzle)-OpenNept4une.json
      - process-seashell.info=profiles/process/0.12mm Seashell @Elegoo Neptune4Pro (0.4 nozzle)-OpenNept4une.info
      - process-seashell-a1.json=profiles/process/0.12mm Seashell @BBL A1-LAN.json
      - process-seashell-a1.info=profiles/process/0.12mm Seashell @BBL A1-LAN.info
      - process-extrafine.json=profiles/process/0.08mm Extra Fine @Elegoo Neptune4Pro (0.4 nozzle)-OpenNept4une.json
      - process-extrafine.info=profiles/process/0.08mm Extra Fine @Elegoo Neptune4Pro (0.4 nozzle)-OpenNept4une.info
      - process-fine.json=profiles/process/0.12mm Fine @Elegoo Neptune4Pro (0.4 nozzle)-OpenNept4une.json
      - process-fine.info=profiles/process/0.12mm Fine @Elegoo Neptune4Pro (0.4 nozzle)-OpenNept4une.info
      - process-optimal.json=profiles/process/0.16mm Optimal @Elegoo Neptune4Pro (0.4 nozzle)-OpenNept4une.json
      - process-optimal.info=profiles/process/0.16mm Optimal @Elegoo Neptune4Pro (0.4 nozzle)-OpenNept4une.info
      - process-draft.json=profiles/process/0.24mm Draft @Elegoo Neptune4Pro (0.4 nozzle)-OpenNept4une.json
      - process-draft.info=profiles/process/0.24mm Draft @Elegoo Neptune4Pro (0.4 nozzle)-OpenNept4une.info
      - process-extradraft.json=profiles/process/0.28mm Extra Draft @Elegoo Neptune4Pro (0.4 nozzle)-OpenNept4une.json
      - process-extradraft.info=profiles/process/0.28mm Extra Draft @Elegoo Neptune4Pro (0.4 nozzle)-OpenNept4une.info
      - process-seashell-16.json=profiles/process/0.16mm Seashell @Elegoo Neptune4Pro (0.4 nozzle)-OpenNept4une.json
      - process-seashell-16.info=profiles/process/0.16mm Seashell @Elegoo Neptune4Pro (0.4 nozzle)-OpenNept4une.info
      - process-seashell-16-a1.json=profiles/process/0.16mm Seashell @BBL A1-LAN.json
      - process-seashell-16-a1.info=profiles/process/0.16mm Seashell @BBL A1-LAN.info
