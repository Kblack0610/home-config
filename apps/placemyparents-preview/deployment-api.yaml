apiVersion: v1
kind: Service
metadata:
  name: placemyparents-api
  namespace: placemyparents-preview
  labels:
    app: placemyparents-api
spec:
  selector:
    app: placemyparents-api
  ports:
    - name: http
      port: 80
      targetPort: 5002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placemyparents-api
  namespace: placemyparents-preview
  labels:
    app: placemyparents-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: placemyparents-api
  template:
    metadata:
      labels:
        app: placemyparents-api
    spec:
      tolerations:
        - key: node.cilium.io/agent-not-ready
          operator: Exists
          effect: NoSchedule
      imagePullSecrets:
        - name: forgejo-registry
      containers:
        - name: placemyparents-api
          image: git.kblab.me/kblack0610/placemyparents-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5002
          env:
            # NODE_ENV=preview triggers the env-guard in
            # apps/placemyparents/api/src/config/config.ts — it refuses to boot
            # if DATABASE_URL points at the DO managed cluster.
            - name: NODE_ENV
              value: preview
            - name: PORT
              value: '5002'
            - name: HOST
              value: 0.0.0.0
            - name: RUN_MIGRATIONS
              value: 'true'
            - name: FRONTEND_URL
              value: https://pmp.preview.kblab.me
            - name: SQUARE_ENVIRONMENT
              value: sandbox
            - name: SPACES_ENDPOINT
              value: https://sfo3.digitaloceanspaces.com
            - name: SPACES_BUCKET
              value: placemyparents-preview
            - name: SPACES_REGION
              value: us-east-1
            - name: EMAIL_FROM
              value: preview@kblab.me
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: placemyparents-preview-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: placemyparents-preview-secrets
                  key: jwt-secret
            - name: SQUARE_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: placemyparents-preview-secrets
                  key: square-access-token
                  optional: true
            - name: SQUARE_APPLICATION_ID
              valueFrom:
                secretKeyRef:
                  name: placemyparents-preview-secrets
                  key: square-application-id
                  optional: true
            - name: SQUARE_LOCATION_ID
              valueFrom:
                secretKeyRef:
                  name: placemyparents-preview-secrets
                  key: square-location-id
                  optional: true
            - name: SPACES_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: placemyparents-preview-secrets
                  key: spaces-access-key-id
                  optional: true
            - name: SPACES_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: placemyparents-preview-secrets
                  key: spaces-secret-access-key
                  optional: true
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: placemyparents-preview-secrets
                  key: smtp-host
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: placemyparents-preview-secrets
                  key: smtp-port
                  optional: true
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: placemyparents-preview-secrets
                  key: smtp-username
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: placemyparents-preview-secrets
                  key: smtp-password
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
