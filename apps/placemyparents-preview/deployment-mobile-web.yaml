apiVersion: v1
kind: Service
metadata:
  name: placemyparents-mobile-web
  namespace: placemyparents-preview
  labels:
    app: placemyparents-mobile-web
spec:
  selector:
    app: placemyparents-mobile-web
  ports:
    - name: http
      port: 80
      # nginx-unprivileged runs as non-root and cannot bind :80.
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placemyparents-mobile-web
  namespace: placemyparents-preview
  labels:
    app: placemyparents-mobile-web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: placemyparents-mobile-web
  template:
    metadata:
      labels:
        app: placemyparents-mobile-web
    spec:
      tolerations:
        - key: node.cilium.io/agent-not-ready
          operator: Exists
          effect: NoSchedule
      imagePullSecrets:
        - name: forgejo-registry
      containers:
        - name: placemyparents-mobile-web
          image: git.kblab.me/kblack0610/placemyparents-mobile-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          # A static bundle behind nginx. No API URL here: it is baked into the
          # JS at export time by the build, so changing it needs a rebuild.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
