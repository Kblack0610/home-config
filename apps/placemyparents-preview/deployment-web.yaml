apiVersion: v1
kind: Service
metadata:
  name: placemyparents-web
  namespace: placemyparents-preview
  labels:
    app: placemyparents-web
spec:
  selector:
    app: placemyparents-web
  ports:
    - name: http
      port: 80
      targetPort: 3200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placemyparents-web
  namespace: placemyparents-preview
  labels:
    app: placemyparents-web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: placemyparents-web
  template:
    metadata:
      labels:
        app: placemyparents-web
    spec:
      tolerations:
        - key: node.cilium.io/agent-not-ready
          operator: Exists
          effect: NoSchedule
      imagePullSecrets:
        - name: forgejo-registry
      containers:
        - name: placemyparents-web
          image: git.kblab.me/kblack0610/placemyparents-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3200
          env:
            # Next.js runtime mode — distinct from the API's NODE_ENV.
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_API_URL
              value: https://api.pmp.preview.kblab.me
            - name: NEXT_PUBLIC_SQUARE_ENVIRONMENT
              value: sandbox
            - name: NEXT_PUBLIC_SQUARE_APPLICATION_ID
              valueFrom:
                secretKeyRef:
                  name: placemyparents-preview-secrets
                  key: square-application-id
                  optional: true
            - name: NEXT_PUBLIC_SQUARE_LOCATION_ID
              valueFrom:
                secretKeyRef:
                  name: placemyparents-preview-secrets
                  key: square-location-id
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Next.js doesn't expose /api/health in this app — use root.
          # Root returns 200 from Next's SSR layer; for a deeper liveness
          # signal we could add a /api/health route in the web app later.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
