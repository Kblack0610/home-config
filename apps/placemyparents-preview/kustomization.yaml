apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: placemyparents-preview

resources:
  - namespace.yaml
  - registry-secret.yaml
  - secrets.yaml
  - postgres-statefulset.yaml
  - deployment-api.yaml
  - deployment-web.yaml
  - deployment-mobile-web.yaml
  - deployment-gallery.yaml
  - ingress.yaml
  - ingress-gallery.yaml

# The app images are built for amd64 only; on a Pi they exit with
# "exec format error". The strategic-merge patch adds the key and keeps any
# nodeSelector a Deployment sets itself.
patches:
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: any
      spec:
        template:
          spec:
            nodeSelector:
              kubernetes.io/arch: amd64

images:
  - name: git.kblab.me/kblack0610/placemyparents-api
    newTag: pre-9eb5534
  - name: git.kblab.me/kblack0610/placemyparents-web
    newTag: pre-9eb5534
  # No image exists under this name until the first preview run after the
  # platform PR lands, so this pod ImagePullBackOffs until then and that is the
  # expected bootstrap state. The entry has to exist NOW regardless: the
  # workflow's awk rewrites an existing `- name:` block and hard-fails the run
  # if it cannot find all three. A deliberately invalid tag rather than
  # `latest`, so the gap reads as "not built yet" instead of silently serving
  # whatever `latest` happens to point at.
  - name: git.kblab.me/kblack0610/placemyparents-mobile-web
    newTag: pre-9eb5534
  - name: git.kblab.me/kblack0610/placemyparents-gallery
    newTag: pre-9eb5534
