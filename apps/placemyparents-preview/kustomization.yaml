apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: placemyparents-preview

resources:
  - namespace.yaml
  - registry-secret.yaml
  - secrets.yaml
  - postgres-statefulset.yaml
  - deployment-api.yaml
  - deployment-web.yaml
  - ingress.yaml

# The Forgejo workflow .forgejo/workflows/deploy-placemyparents-preview.yml
# (in the platform repo) rewrites these newTag values on every push to main
# via `awk`, then commits the bump back to home-config@master.
images:
  - name: git.kblab.me/kblack0610/placemyparents-api
    newTag: pre-0794f40
  - name: git.kblab.me/kblack0610/placemyparents-web
    newTag: pre-0794f40
