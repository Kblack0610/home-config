apiVersion: apps/v1
kind: Deployment
metadata:
  name: playground-server
  labels:
    app: playground-server
spec:
  # No replicas field on purpose: Flux then does not own it, so `ctl.sh up` and
  # `ctl.sh down` (kubectl scale) stick instead of being reconciled back to 1.
  selector:
    matchLabels:
      app: playground-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: playground-server
    spec:
      # A Unity Linux server build is x86_64 only, and hostNetwork puts the UDP
      # port straight on the node's LAN address - no servicelb proxy pods.
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: hp-victus
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: forgejo-registry
      containers:
        - name: playground-server
          image: git.kblab.me/kblack0610/unity-playground-server:0.3.2-rc9
          args: ["-port", "7770"]
          # Lists the server in the game registry (apps/game-registry) with a join
          # code; a build without the online listing ignores these.
          env:
            - name: REGISTRY_URL
              value: http://game-registry.game-registry.svc:8080
            - name: SERVER_ADDRESS
              value: 192.168.1.243
            - name: SERVER_NAME
              value: Playground server
            - name: SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: game-registry-token
                  key: SERVER_TOKEN
          ports:
            - containerPort: 7770
              hostPort: 7770
              protocol: UDP
              name: fishnet
          # Readiness, so "starting" on the games page means something. Without it
          # the pod is Ready the instant the process starts and the page would say
          # "running" through the whole Unity boot. 7770 is 0x1e5a in /proc/net/udp,
          # and the socket binds once FishNet's transport is actually listening.
          # Note this is hostNetwork, so it reads the node's socket table - another
          # process holding 7770 on this node would also satisfy it.
          readinessProbe:
            exec:
              command: ["grep", "-qi", ":1e5a", "/proc/net/udp"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
