apiVersion: apps/v1
kind: Deployment
metadata:
  name: playground-server
  labels:
    app: playground-server
spec:
  # Always on (2026-10-24): friends join whenever they like, with nobody starting
  # it first. Flux owns the count, so `ctl.sh down` and the games page's stop only
  # last until the next reconcile; to take it down for longer, set 0 here.
  replicas: 1
  selector:
    matchLabels:
      app: playground-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: playground-server
    spec:
      # A Unity Linux server build is x86_64 only, and hostNetwork puts the UDP
      # port straight on the node's LAN address - no servicelb proxy pods.
      # A game server node, not a named host: ansible's game_server_nodes group
      # labels it and keeps CI off the cores it runs on (roles/game-server-node).
      nodeSelector:
        kubernetes.io/arch: amd64
        kblab.me/game-server: "true"
      priorityClassName: game-server
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: forgejo-registry
      containers:
        - name: playground-server
          image: git.kblab.me/kblack0610/unity-playground-server:0.4.0-rc9
          # -devControls: anyone who joins may switch the game, tune it and run admin
          # commands, as in the editor. Without it only a host may, and this server has
          # none. A build from before session access (0.4.0-rc1) ignores it.
          args: ["-port", "7770", "-devControls"]
          # Lists the server in the game registry (apps/game-registry) with a join
          # code; a build without the online listing ignores these. HTTPS, not the
          # in-cluster Service: the player refuses plain http (insecureHttpOption 0).
          env:
            - name: REGISTRY_URL
              value: https://game-registry.kblab.me
            # One name for every player: dnsmasq answers it with the LAN IP inside
            # the house, Cloudflare with the WAN address outside (wan-ddns), where
            # the router forwards UDP 7770 here (infrastructure/openwrt/firewall.yaml).
            - name: SERVER_ADDRESS
              value: playground-play.kblab.me
            - name: SERVER_NAME
              value: Playground server
            - name: SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: game-registry-token
                  key: SERVER_TOKEN
          ports:
            - containerPort: 7770
              hostPort: 7770
              protocol: UDP
              name: fishnet
          # Readiness, so "starting" on the games page means something. Without it
          # the pod is Ready the instant the process starts and the page would say
          # "running" through the whole Unity boot. 7770 is 0x1e5a in /proc/net/udp,
          # and the socket binds once FishNet's transport is actually listening.
          # Note this is hostNetwork, so it reads the node's socket table - another
          # process holding 7770 on this node would also satisfy it.
          readinessProbe:
            exec:
              command: ["grep", "-qi", ":1e5a", "/proc/net/udp"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          # Two cores requested, so it is scheduled with room and gets the larger
          # share when the node is busy. No CPU limit on purpose: a limit is a CFS
          # quota, which stalls the process for the rest of each period once it is
          # spent, and a server tick pays for that as a hitch (the same lesson as
          # ci.slice). rc8 ran at about 800 Mi with two players, close to the old 1 Gi.
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              memory: 2Gi
