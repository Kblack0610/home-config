# The playground's screens gallery, https://apps.kblab.me/playground/: a static page over the
# UI shots its tests keep, rebuilt by the playground repo's shots.yml (nightly after Tests,
# and by hand). The image tag below is moved by scripts/shots/publish.sh there.
apiVersion: v1
kind: Service
metadata:
  name: playground-gallery
  labels:
    app: playground-gallery
spec:
  selector:
    app: playground-gallery
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: playground-gallery
  labels:
    app: playground-gallery
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: playground-gallery
  template:
    metadata:
      labels:
        app: playground-gallery
    spec:
      # The image is built on the x86 Unity runners and has no arm64 variant.
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: forgejo-registry
      containers:
        - name: playground-gallery
          image: git.kblab.me/kblack0610/unity-playground-gallery:latest
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
---
# /playground -> /playground/ (the page's links are relative), then strip the prefix.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: playground-gallery-slash
spec:
  redirectRegex:
    regex: "^(https?://[^/]+/playground)$"
    replacement: "${1}/"
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: playground-gallery-strip
spec:
  stripPrefix:
    prefixes:
      - /playground
---
# Beside PlaceMyParents' gallery on the same host, which keeps "/"; Traefik routes the
# longer prefix here. LAN-only the same way as that one (apps/placemyparents-preview/ingress-gallery.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: playground-gallery
  labels:
    app: playground-gallery
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
    external-dns.alpha.kubernetes.io/exclude: 'true'
    traefik.ingress.kubernetes.io/router.middlewares: >-
      monitoring-local-network-only@kubernetescrd,playground-server-playground-gallery-slash@kubernetescrd,playground-server-playground-gallery-strip@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - apps.kblab.me
      secretName: playground-gallery-tls
  rules:
    - host: apps.kblab.me
      http:
        paths:
          - path: /playground
            pathType: Prefix
            backend:
              service:
                name: playground-gallery
                port:
                  number: 80
