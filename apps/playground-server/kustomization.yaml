apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: playground-server

resources:
  - namespace.yaml
  - rbac.yaml
  - registry-secret.yaml
  - registry-token-secret.yaml
  - priorityclass.yaml
  - deployment.yaml
  - gallery.yaml

# Moved by the playground repo's scripts/shots/publish.sh after each shots run.
images:
  - name: git.kblab.me/kblack0610/unity-playground-gallery
    newTag: "ade750c-188"
  # The home server: newName is the game's server image (the playground repo's
  # scripts/build/games/<id>.json "image"; none for the playground itself) and newTag
  # the release it runs. The playground repo's scripts/server/roll.sh <tag> moves newTag.
  - name: git.kblab.me/kblack0610/unity-playground-server
    newName: git.kblab.me/kblack0610/unity-dodginballs-server
    newTag: "0.5.0-dodginballs7"
