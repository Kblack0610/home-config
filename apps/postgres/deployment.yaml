apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: databases
  labels:
    app.kubernetes.io/name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      # fsGroup tells kubelet to chown the mounted PVC volumes to gid 999
      # (the postgres group inside the official postgres image). Without
      # this, local-path-provisioner creates the hostPath as root and the
      # postgres entrypoint's chown to its uid 999 fails with "Operation
      # not permitted" because the container's capabilities are scoped to
      # the running uid. fsGroup sidesteps the chown entirely.
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          # pgvector ships an official image based on Postgres + the
          # pgvector extension. mem0-api-server requires pgvector for its
          # vector_store backend; future apps can opt into pgvector or
          # ignore it.
          image: pgvector/pgvector:0.8.2-pg17-trixie
          imagePullPolicy: IfNotPresent
          # Note: NO container-level securityContext capability drop here.
          # The postgres entrypoint script needs CHOWN/FOWNER/SETUID/SETGID
          # to drop privileges to the postgres user before starting the DB
          # daemon. Stripping capabilities breaks the entrypoint with
          # "Operation not permitted" on /var/run/postgresql + the data dir.
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
            # PGDATA points inside the PVC mount. The default data path
            # is `/var/lib/postgresql/data` but the pgvector image runs
            # initdb against that exact path, which conflicts with the
            # PVC's `lost+found` dir on local-path-provisioner. Putting
            # the cluster under a subdirectory avoids that.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: postgres-secrets
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - postgres
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - postgres
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0755
        - name: localtime
          hostPath:
            path: /etc/localtime
