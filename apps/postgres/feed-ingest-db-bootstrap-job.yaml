apiVersion: batch/v1
kind: Job
metadata:
  name: feed-ingest-db-bootstrap
  # The feeds database (apps/feed-ingest ledger). Lives here (namespace: databases) so it can read
  # postgres-secrets for the superuser password. Same pattern as trader-db-bootstrap-job.yaml.
  # The ingester creates its own tables; feed_reader (trader) gets SELECT on whatever it creates.
  labels:
    app.kubernetes.io/name: feed-ingest
    app.kubernetes.io/component: db-bootstrap
spec:
  backoffLimit: 3
  # No ttlSecondsAfterFinished: Flux owns this manifest. To re-run, bump the name.
  template:
    metadata:
      labels:
        app.kubernetes.io/name: feed-ingest
        app.kubernetes.io/component: db-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: pgvector/pgvector:0.8.2-pg17-trixie
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: postgres-secrets
          env:
            - name: PGHOST
              value: postgres.databases.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: postgres
            - name: FEED_INGEST_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: feed-ingest-db-secret
                  key: feed-ingest-db-pass
            - name: FEED_READER_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: feed-ingest-db-secret
                  key: feed-reader-db-pass
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              export PGPASSWORD="$POSTGRES_PASSWORD"

              psql -v ON_ERROR_STOP=1 <<-EOSQL
                DO \$\$
                BEGIN
                  IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'feed_ingest') THEN
                    CREATE ROLE feed_ingest LOGIN PASSWORD '${FEED_INGEST_DB_PASS}';
                  ELSE
                    ALTER ROLE feed_ingest WITH LOGIN PASSWORD '${FEED_INGEST_DB_PASS}';
                  END IF;
                  IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'feed_reader') THEN
                    CREATE ROLE feed_reader LOGIN PASSWORD '${FEED_READER_DB_PASS}';
                  ELSE
                    ALTER ROLE feed_reader WITH LOGIN PASSWORD '${FEED_READER_DB_PASS}';
                  END IF;
                END
                \$\$;
                ALTER ROLE feed_reader SET default_transaction_read_only = on;
              EOSQL

              if ! psql -v ON_ERROR_STOP=1 -tA \
                  -c "SELECT 1 FROM pg_database WHERE datname='feeds'" | grep -q 1; then
                psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE feeds OWNER feed_ingest;"
              fi

              psql -v ON_ERROR_STOP=1 -d feeds <<-EOSQL
                GRANT ALL PRIVILEGES ON SCHEMA public TO feed_ingest;
                GRANT CONNECT ON DATABASE feeds TO feed_reader;
                GRANT USAGE ON SCHEMA public TO feed_reader;
                GRANT SELECT ON ALL TABLES IN SCHEMA public TO feed_reader;
                ALTER DEFAULT PRIVILEGES FOR ROLE feed_ingest IN SCHEMA public GRANT SELECT ON TABLES TO feed_reader;
              EOSQL

              echo "feed_ingest and feed_reader roles + feeds database ready."
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
