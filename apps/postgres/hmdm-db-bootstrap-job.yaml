apiVersion: batch/v1
kind: Job
metadata:
  name: hmdm-db-bootstrap
  # Lives under apps/postgres/ (namespace: databases) so it can reach
  # postgres-secrets for the superuser password. Pattern mirrors litellm-db-bootstrap-job.yaml.
  labels:
    app.kubernetes.io/name: headwind-mdm
    app.kubernetes.io/component: db-bootstrap
spec:
  backoffLimit: 3
  # No ttlSecondsAfterFinished: Flux owns this manifest; leaving it Completed
  # is harmless and keeps a kubectl record. To re-run, bump the name suffix.
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headwind-mdm
        app.kubernetes.io/component: db-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: pgvector/pgvector:0.8.2-pg17-trixie
          imagePullPolicy: IfNotPresent
          envFrom:
            # Provides POSTGRES_PASSWORD (superuser) for the initial connection.
            - secretRef:
                name: postgres-secrets
          env:
            - name: PGHOST
              value: postgres.databases.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: postgres
            # hmdm role password -- single source of truth, SOPS-encrypted in
            # hmdm-db-secret (databases ns). The SAME value is in
            # headwind-mdm-secret/sql-pass (headwind-mdm ns) for the app; keep them
            # in sync when rotating. Never hardcode it here (master mirrors to GitHub).
            - name: HMDM_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: hmdm-db-secret
                  key: hmdm-db-pass
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              export PGPASSWORD="$POSTGRES_PASSWORD"

              # Idempotent role: create or update password.
              psql -v ON_ERROR_STOP=1 <<-EOSQL
                DO \$\$
                BEGIN
                  IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'hmdm') THEN
                    CREATE ROLE hmdm LOGIN PASSWORD '${HMDM_DB_PASS}';
                  ELSE
                    ALTER ROLE hmdm WITH LOGIN PASSWORD '${HMDM_DB_PASS}';
                  END IF;
                END
                \$\$;
              EOSQL

              # Idempotent database.
              if ! psql -v ON_ERROR_STOP=1 -tA \
                  -c "SELECT 1 FROM pg_database WHERE datname='hmdm'" | grep -q 1; then
                psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE hmdm OWNER hmdm;"
              fi

              psql -v ON_ERROR_STOP=1 -d hmdm <<-EOSQL
                GRANT ALL PRIVILEGES ON DATABASE hmdm TO hmdm;
                GRANT ALL PRIVILEGES ON SCHEMA public TO hmdm;
              EOSQL

              echo "hmdm role + database ready."
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
