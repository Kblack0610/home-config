apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-db-bootstrap
  # Lives under apps/postgres/ because the parent Kustomization sets
  # `namespace: databases` and Secrets don't cross namespaces — the
  # Job needs envFrom from postgres-secrets. Logically this is a
  # postgres tenant-provisioning step for LiteLLM, complementing
  # 30-litellm.sh in init-configmap.yaml (which only fires on a
  # fresh data dir).
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: db-bootstrap
spec:
  backoffLimit: 3
  # No ttlSecondsAfterFinished: Flux owns this manifest and would
  # recreate (and re-run) the Job each time Kubernetes GC'd it.
  # Leaving it Completed is harmless and gives kubectl a record.
  # To re-run after editing permissions, bump the name suffix.
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/component: db-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: pgvector/pgvector:0.8.2-pg17-trixie
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: postgres-secrets
          env:
            - name: PGHOST
              value: postgres.databases.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: postgres
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              export PGPASSWORD="$POSTGRES_PASSWORD"

              # Idempotent role: create or update password.
              psql -v ON_ERROR_STOP=1 <<-EOSQL
                DO \$\$
                BEGIN
                  IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'litellm') THEN
                    CREATE ROLE litellm LOGIN PASSWORD '${POSTGRES_LITELLM_PASSWORD}';
                  ELSE
                    ALTER ROLE litellm WITH LOGIN PASSWORD '${POSTGRES_LITELLM_PASSWORD}';
                  END IF;
                END
                \$\$;
              EOSQL

              # Idempotent database: CREATE DATABASE can't run inside DO,
              # so guard with a SELECT and only CREATE on miss.
              if ! psql -v ON_ERROR_STOP=1 -tA \
                  -c "SELECT 1 FROM pg_database WHERE datname='litellm'" | grep -q 1; then
                psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE litellm OWNER litellm;"
              fi

              psql -v ON_ERROR_STOP=1 -d litellm <<-EOSQL
                GRANT ALL PRIVILEGES ON DATABASE litellm TO litellm;
                GRANT ALL PRIVILEGES ON SCHEMA public TO litellm;
              EOSQL

              echo "litellm role + database ready."
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
