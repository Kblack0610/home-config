apiVersion: batch/v1
kind: Job
metadata:
  name: trader-db-bootstrap
  # The trader database (apps/freqtrade: league trades, research results). Lives here
  # (namespace: databases) so it can read postgres-secrets for the superuser password.
  # Same pattern as registry-db-bootstrap-job.yaml. Tables come from the lab image (lab/migrate.py).
  labels:
    app.kubernetes.io/name: freqtrade
    app.kubernetes.io/component: db-bootstrap
spec:
  backoffLimit: 3
  # No ttlSecondsAfterFinished: Flux owns this manifest. To re-run, bump the name.
  template:
    metadata:
      labels:
        app.kubernetes.io/name: freqtrade
        app.kubernetes.io/component: db-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: pgvector/pgvector:0.8.2-pg17-trixie
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: postgres-secrets
          env:
            - name: PGHOST
              value: postgres.databases.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: postgres
            # The trader role's password. The same value is inside DATABASE_URL in
            # apps/freqtrade/trader-db-secret.sops.yaml; rotate both together.
            - name: TRADER_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: trader-db-secret
                  key: trader-db-pass
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              export PGPASSWORD="$POSTGRES_PASSWORD"

              psql -v ON_ERROR_STOP=1 <<-EOSQL
                DO \$\$
                BEGIN
                  IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'trader') THEN
                    CREATE ROLE trader LOGIN PASSWORD '${TRADER_DB_PASS}';
                  ELSE
                    ALTER ROLE trader WITH LOGIN PASSWORD '${TRADER_DB_PASS}';
                  END IF;
                END
                \$\$;
              EOSQL

              if ! psql -v ON_ERROR_STOP=1 -tA \
                  -c "SELECT 1 FROM pg_database WHERE datname='trader'" | grep -q 1; then
                psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE trader OWNER trader;"
              fi

              psql -v ON_ERROR_STOP=1 -d trader <<-EOSQL
                GRANT ALL PRIVILEGES ON DATABASE trader TO trader;
                GRANT ALL PRIVILEGES ON SCHEMA public TO trader;
              EOSQL

              echo "trader role + database ready."
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
