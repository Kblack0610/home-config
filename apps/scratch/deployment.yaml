apiVersion: apps/v1
kind: Deployment
metadata:
  name: scratch
  namespace: scratch
  labels:
    app.kubernetes.io/name: scratch
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scratch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scratch
    spec:
      containers:
        - name: microbin
          image: danielszabo99/microbin:2.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MICROBIN_PORT
              value: "8080"
            - name: MICROBIN_BIND
              value: "0.0.0.0"
            - name: MICROBIN_DATA_DIR
              value: "/data"
            - name: MICROBIN_PUBLIC_PATH
              value: "https://scratch.kblab.me"
            - name: MICROBIN_HASH_IDS
              value: "true"
            - name: MICROBIN_QR
              value: "true"
            - name: MICROBIN_WIDE
              value: "true"
            # --- Retention model (see README) -------------------------------
            # Sensitive-by-default: a fresh paste expires in 1 hour unless you
            # bump it. Burn-after-reading is the one-shot mode for keys.
            - name: MICROBIN_ENABLE_BURN_AFTER
              value: "true"
            - name: MICROBIN_DEFAULT_EXPIRY
              value: "1hour"
            - name: MICROBIN_MAX_EXPIRY
              value: "never"
            - name: MICROBIN_GC_DAYS
              value: "365"
            # --- Auth: NONE (removed on purpose) ----------------------------
            # Basic-auth was ripped out: MicroBin 2.1.0's login is broken — a
            # wrong password can't be retried (the session cookie sticks and it
            # never re-prompts), so the box became un-loginnable. The instance
            # is fully anonymous now. It is NOT exposed to the internet anymore;
            # reachability is gated at the network layer (LAN/Tailscale only via
            # the local-network-only middleware in ingress.yaml). The retention
            # model above (burn / 1-hour default) is the remaining safety net.
            - name: MICROBIN_DISABLE_TELEMETRY
              value: "true"
            - name: MICROBIN_DISABLE_UPDATE_CHECKING
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # TCP probes: a listening port is a sufficient liveness/readiness
          # signal for this throwaway box, and they're robust to any HTTP-level
          # redirect MicroBin's landing page might return.
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: scratch-data
