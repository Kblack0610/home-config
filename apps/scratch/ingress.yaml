apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scratch
  namespace: scratch
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
    # MicroBin's own auth is gone (its login was broken — see deployment.yaml),
    # so access is now gated at the network layer instead: LAN/Tailscale only.
    # The host lives on the private kblab.me zone (not the public kennethblack.me
    # one) and the local-network-only middleware restricts source ranges, so the
    # box is no longer reachable from the open internet.
    traefik.ingress.kubernetes.io/router.middlewares: monitoring-local-network-only@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - scratch.kblab.me
      secretName: scratch-tls
  rules:
    - host: scratch.kblab.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scratch
                port:
                  number: 80
