apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scratch-data
  namespace: scratch
  labels:
    app.kubernetes.io/name: scratch
spec:
  accessModes:
    - ReadWriteOnce
  # local-path is intentional: this is throwaway scratch data (most of it
  # self-destructs via burn/1h-expiry). Not worth replicated storage. If the
  # node dies, the "Keep" notes are gone — that is an accepted trade-off.
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
