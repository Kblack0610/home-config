apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
    spec:
      # Voice-turn latency path: keep it off the Pis' SD-card nodes.
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: searxng
          image: searxng/searxng:2026.9.8-3fdc6d753
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng
                  key: secret-key
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: settings
          configMap:
            name: searxng-settings
