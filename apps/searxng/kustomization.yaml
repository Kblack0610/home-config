apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Co-located in the home-assistant namespace: HA (Binks's web/image search
# tools) is the only consumer. In-cluster only, no Ingress, so nothing under
# *.kblab.me and no tunnel exposure.
namespace: home-assistant

resources:
  - deployment.yaml
  - service.yaml
  - secret.sops.yaml

# Hash-named so a settings edit restarts the pod.
configMapGenerator:
  - name: searxng-settings
    files:
      - settings.yml
