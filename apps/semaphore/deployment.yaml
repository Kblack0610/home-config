apiVersion: apps/v1
kind: Deployment
metadata:
  name: semaphore
  namespace: semaphore
  labels:
    app.kubernetes.io/name: semaphore
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: semaphore
  template:
    metadata:
      labels:
        app.kubernetes.io/name: semaphore
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        fsGroup: 1001
      containers:
        - name: semaphore
          image: semaphoreui/semaphore:v2.11.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            # Upstream Semaphore marks bolt as deprecated; sqlite is the default.
            - name: SEMAPHORE_DB_DIALECT
              value: sqlite
            - name: SEMAPHORE_DB_PATH
              value: /var/lib/semaphore/database.sqlite
            - name: SEMAPHORE_PLAYBOOK_PATH
              value: /var/lib/semaphore/playbooks
            - name: SEMAPHORE_TMP_PATH
              value: /tmp/semaphore
            - name: SEMAPHORE_PORT
              value: "3000"
            - name: SEMAPHORE_ADMIN
              value: admin
            - name: SEMAPHORE_ADMIN_NAME
              value: admin
            - name: SEMAPHORE_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: semaphore-secrets
                  key: SEMAPHORE_ADMIN_EMAIL
            - name: SEMAPHORE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: semaphore-secrets
                  key: SEMAPHORE_ADMIN_PASSWORD
            - name: SEMAPHORE_ACCESS_KEY_ENCRYPTION
              valueFrom:
                secretKeyRef:
                  name: semaphore-secrets
                  key: SEMAPHORE_ACCESS_KEY_ENCRYPTION
          volumeMounts:
            - name: data
              mountPath: /var/lib/semaphore
            - name: tmp
              mountPath: /tmp/semaphore
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: semaphore-data
        - name: tmp
          emptyDir: {}
