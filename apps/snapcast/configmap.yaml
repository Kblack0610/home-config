apiVersion: v1
kind: ConfigMap
metadata:
  name: snapserver-config
  namespace: snapcast
  labels:
    app.kubernetes.io/name: snapserver
data:
  # Reference: https://github.com/snapcast/snapcast/blob/v0.35.0/server/etc/snapserver.conf
  snapserver.conf: |
    [server]
    datadir = /data/
    # No avahi in the pod and no L2 reach from the pod network anyway: clients
    # are pointed at snapcast.kblab.me explicitly (see README).
    mdns_enabled = false

    [http]
    enabled = true
    bind_to_address = 0.0.0.0
    port = 1780
    doc_root = /usr/share/snapweb

    [tcp-control]
    enabled = true
    bind_to_address = 0.0.0.0
    port = 1705

    [tcp-streaming]
    enabled = true
    bind_to_address = 0.0.0.0
    port = 1704

    [stream]
    # Parking stream. Music Assistant moves a group back to the stream with id
    # "default" when it stops playing to it (providers/snapcast/player.py), so
    # this id must exist on an external snapserver. Nothing writes to the fifo.
    source = pipe:///tmp/snapfifo?name=default&mode=create
    # Living-room Pi pushes the UFO202 line-in here:
    #   arecord -D hw:CODEC -f S16_LE -r 48000 -c 2 -t raw | nc snapcast.kblab.me 4953
    # The format must match what the Pi sends.
    source = tcp://0.0.0.0:4953?name=Turntable&mode=server&sampleformat=48000:16:2
    # Music Assistant adds its own tcp sources at runtime (Stream.AddStream) on
    # a random port in 4953-5153; it retries another port if it draws 4953.
    default_source = default
    sampleformat = 48000:16:2
    # Uncompressed on the LAN: ~1.5 Mbit/s per room, no decode cost, lower
    # latency. The kitchen wall panel's in-browser client (apps/home-assistant
    # .../www/snapcast-tablet.js) scheduled only silent buffers with flac on the
    # Android WebView (stats: audible=0, queued=0, context running), so it needs
    # pcm. snapclient (Giada, desktop) handles pcm natively. Applies to the
    # Music Assistant streams too: they inherit this default codec.
    codec = pcm
    chunk_ms = 20
    buffer = 1000
    send_to_muted = false

    [streaming_client]
    initial_volume = 100

    [logging]
    sink = stdout
    filter = *:info
