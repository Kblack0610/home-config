apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapserver
  namespace: snapcast
  labels:
    app.kubernetes.io/name: snapserver
spec:
  replicas: 1
  strategy:
    type: Recreate  # single instance with a RWO PVC
  selector:
    matchLabels:
      app.kubernetes.io/name: snapserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: snapserver
    spec:
      # uid/gid of the image's `abc` user; fsGroup makes the PVC writable for it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 911
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: snapserver
          # No upstream image exists; this one is alpine `snapcast` + `snapweb`.
          # The version tag is rebuilt weekly, so it is pinned by digest.
          # 0.35.0 (not 0.34) for "Close TCP server when Stream.RemoveStream is
          # called" (snapcast#1497): Music Assistant adds and removes a tcp
          # source per stream, and 0.34 leaks the listening port each time.
          image: sweisgerber/snapcast:v0.35.0@sha256:4bebee23f255ea1a667de585190263d4a996a3fcedde6b3646d0482d5a87b189
          # Bypass the image's s6 init (needs root to chown /config) and run the
          # server directly as the unprivileged user.
          command:
            - /usr/bin/snapserver
            - --config
            - /etc/snapserver/snapserver.conf
          ports:
            - name: stream
              containerPort: 1704
              protocol: TCP
            - name: control
              containerPort: 1705
              protocol: TCP
            - name: http
              containerPort: 1780
              protocol: TCP
            - name: turntable
              containerPort: 4953
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/snapserver
              readOnly: true
            - name: data
              mountPath: /data
            # the `default` parking stream's fifo
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "1"
              memory: "256Mi"
          readinessProbe:
            tcpSocket:
              port: 1705
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 1705
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: snapserver-config
        - name: data
          persistentVolumeClaim:
            claimName: snapserver-data
        - name: tmp
          emptyDir: {}
