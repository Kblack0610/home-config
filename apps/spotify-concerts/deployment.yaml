apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotify-concerts
  namespace: spotify-concerts
  labels:
    app.kubernetes.io/name: spotify-concerts
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: spotify-concerts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spotify-concerts
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: spotify-concerts
          image: docker.io/library/python:3.12-slim
          command: ["python", "/app/app.py"]
          ports:
            - name: http
              containerPort: 8080
          env:
            # ── non-secret config (San Diego city centroid — public, not home) ──
            - { name: HOME_LAT, value: "32.72" }
            - { name: HOME_LON, value: "-117.16" }
            - { name: RADIUS_MI, value: "75" }
            - { name: MAX_ARTISTS, value: "60" }
            - { name: CACHE_TTL_SECONDS, value: "43200" }   # 12h
            # ── secrets (optional: the pod runs & serves an empty calendar until
            #    the spotify-concerts-credentials secret exists; see README) ──
            - name: SPOTIFY_CLIENT_ID
              valueFrom: { secretKeyRef: { name: spotify-concerts-credentials, key: spotify-client-id, optional: true } }
            - name: SPOTIFY_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: spotify-concerts-credentials, key: spotify-client-secret, optional: true } }
            - name: SPOTIFY_REFRESH_TOKEN
              valueFrom: { secretKeyRef: { name: spotify-concerts-credentials, key: spotify-refresh-token, optional: true } }
            - name: TICKETMASTER_API_KEY
              valueFrom: { secretKeyRef: { name: spotify-concerts-credentials, key: ticketmaster-api-key, optional: true } }
            # Fallback artist list (comma-separated) if you skip Spotify OAuth.
            - name: SPOTIFY_ARTISTS_OVERRIDE
              valueFrom: { secretKeyRef: { name: spotify-concerts-credentials, key: artists-override, optional: true } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /app
          resources:
            requests: { memory: "32Mi", cpu: "25m" }
            limits: { memory: "128Mi", cpu: "250m" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: app
          configMap:
            name: spotify-concerts-app
