apiVersion: v1
kind: Service
metadata:
  name: time-tangle-api
  namespace: time-tangle
  labels:
    app: time-tangle-api
spec:
  selector:
    app: time-tangle-api
  ports:
    - name: http
      port: 80
      targetPort: 5001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: time-tangle-api
  namespace: time-tangle
  labels:
    app: time-tangle-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: time-tangle-api
  template:
    metadata:
      labels:
        app: time-tangle-api
    spec:
      tolerations:
        - key: node.cilium.io/agent-not-ready
          operator: Exists
          effect: NoSchedule
      imagePullSecrets:
        - name: forgejo-registry
      # Run DB migrations before the server starts. migrate.js is idempotent
      # (tracks applied files in a `migrations` table) and exits 0/1.
      initContainers:
        - name: migrate
          image: git.kblab.me/kblack0610/time-tangle-api:latest
          command: ['node', 'dist/database/migrate.js']
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_SSL
              value: disable
          envFrom:
            - secretRef:
                name: time-tangle-api-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      containers:
        - name: time-tangle-api
          image: git.kblab.me/kblack0610/time-tangle-api:latest
          ports:
            - name: http
              containerPort: 5001
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '5001'
            - name: HOST
              value: 0.0.0.0
            - name: DATABASE_SSL
              value: disable
            # Drives authConfig.frontendUrl -> the API CORS allow-list (see app.ts).
            - name: WEB_URL
              value: https://time-tangle.com
          envFrom:
            - secretRef:
                name: time-tangle-api-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
