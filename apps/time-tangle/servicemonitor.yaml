apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: time-tangle-api
  namespace: time-tangle
  labels:
    # kube-prometheus-stack selects ServiceMonitors with this label cluster-wide.
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: time-tangle-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
