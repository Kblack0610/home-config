apiVersion: v1
kind: Service
metadata:
  name: time-tangle-web
  namespace: time-tangle
  labels:
    app: time-tangle-web
spec:
  selector:
    app: time-tangle-web
  ports:
    - name: http
      port: 80
      targetPort: 3500
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: time-tangle-web
  namespace: time-tangle
  labels:
    app: time-tangle-web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: time-tangle-web
  template:
    metadata:
      labels:
        app: time-tangle-web
    spec:
      tolerations:
        - key: node.cilium.io/agent-not-ready
          operator: Exists
          effect: NoSchedule
      imagePullSecrets:
        - name: forgejo-registry
      containers:
        - name: time-tangle-web
          image: git.kblab.me/kblack0610/time-tangle-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3500
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '3500'
            - name: HOSTNAME
              value: 0.0.0.0
            # NEXT_PUBLIC_API_URL is baked into the browser bundle at build
            # time (see the Dockerfile build-arg). This runtime copy covers the
            # Next.js rewrites() proxy + any server-side reads.
            - name: NEXT_PUBLIC_API_URL
              value: https://api.time-tangle.com
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
