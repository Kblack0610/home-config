apiVersion: batch/v1
kind: CronJob
metadata:
  name: vaultwarden-backup
  namespace: vaultwarden
spec:
  schedule: "0 3 * * *"  # Daily at 3 AM
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # A failed off-box copy fails the job (below), so bound the retries: each
      # attempt writes a new archive and re-runs the keep-30 prune. Same
      # reasoning as apps/actual-budget/backup-cronjob.yaml.
      backoffLimit: 2
      template:
        spec:
          # No nodeSelector: the job co-locates with the local-path PVC (RWO,
          # same node as the app pod) so it can read /data. The NAS push is
          # network-based (//nas.nas.svc.cluster.local), so it works from any
          # node the PVC happens to live on.
          securityContext:
            fsGroup: 1000
          containers:
            - name: backup
              image: alpine:3.24.1
              env:
                - name: NAS_SMB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backup-nas-credentials
                      key: smb-password
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  apk add --no-cache tar gzip samba-client sqlite >/dev/null

                  # A vault with the SQLite db plus keys has sat around 40KB. 4KB
                  # catches an unmounted PVC without false-tripping on a small vault.
                  MIN_BYTES=4096
                  SMB="//nas.nas.svc.cluster.local/private"
                  DEST="backups/home-k3s/vaultwarden"

                  log() { echo "[$(date -Iseconds)] $*"; }

                  if [ ! -s /data/db.sqlite3 ]; then
                    log "ERROR: /data/db.sqlite3 missing or empty - is the PVC mounted? Not backing up."
                    exit 1
                  fi

                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  BACKUP_FILE="vaultwarden-${TIMESTAMP}.tar.gz"
                  # Vaultwarden keeps db.sqlite3 in WAL mode and most recent writes
                  # sit in db.sqlite3-wal, so a tar of the live files can be torn.
                  # .backup takes a consistent copy (same as apps/frigate). The
                  # keys, attachments and sends are copied beside it; the icon
                  # cache and tmp are rebuilt by the server and are skipped.
                  STAGE="$(mktemp -d)"
                  sqlite3 /data/db.sqlite3 ".backup '${STAGE}/db.sqlite3'"
                  check="$(sqlite3 "${STAGE}/db.sqlite3" 'PRAGMA integrity_check;')"
                  ciphers="$(sqlite3 "${STAGE}/db.sqlite3" 'SELECT count(*) FROM ciphers WHERE deleted_at IS NULL;')"
                  if [ "${check}" != "ok" ] || [ "${ciphers}" -lt 1 ]; then
                    log "ERROR: snapshot failed its check (integrity: ${check}, items: ${ciphers}). Not keeping it."
                    exit 1
                  fi
                  log "snapshot ok: integrity ${check}, ${ciphers} live items"
                  for f in /data/* ; do
                    case "$(basename "$f")" in
                      db.sqlite3*|icon_cache|tmp) ;;
                      *) cp -a "$f" "${STAGE}/" ;;
                    esac
                  done
                  tar -czf "/backup/${BACKUP_FILE}" -C "${STAGE}" .
                  rm -rf "${STAGE}"
                  size="$(wc -c < "/backup/${BACKUP_FILE}")"
                  log "created ${BACKUP_FILE} (${size} bytes)"
                  # Losing the keys silently is unrecoverable, so refuse rather
                  # than rotate 30 good archives out behind a tiny one.
                  if [ "${size}" -lt "${MIN_BYTES}" ]; then
                    log "ERROR: archive under ${MIN_BYTES} bytes is implausible - is the PVC mounted? Not uploading."
                    exit 1
                  fi

                  ls -t /backup/vaultwarden-*.tar.gz | tail -n +31 | xargs -r rm
                  log "local backup complete: ${BACKUP_FILE}"

                  # Off-box copy. An exception to the best-effort house rule
                  # (docs/backup-runbook.md, failure policy): the local copy is a
                  # hostPath on the one node holding the RWO PVC, and losing the
                  # vault loses every credential, so a failed NAS copy fails the
                  # job. The local copy is already written and survives. smbclient -c does not exit non-zero when a command
                  # inside it fails, so every call must be checked for NT_STATUS_.
                  # Why, and the identical copies that move with this one:
                  # apps/zomboid/backup/backup.sh.
                  smb() {
                    _out="$(smbclient "${SMB}" -U "nas%${NAS_SMB_PASSWORD}" -c "$1" 2>&1)"
                    _bad="$(echo "${_out}" | grep -o 'NT_STATUS_[A-Z_]*' | grep -v 'NT_STATUS_OBJECT_NAME_COLLISION' || true)"
                    if [ -n "${_bad}" ]; then
                      log "ERROR: smbclient '$1' failed: ${_bad}"
                      return 1
                    fi
                    echo "${_out}"
                  }

                  nas_copy() {
                    # mkdir does not create parents, so walk the path a component
                    # at a time. OBJECT_NAME_COLLISION means it already exists.
                    _path=""
                    for _part in $(echo "${DEST}" | tr '/' ' '); do
                      _path="${_path:+${_path}/}${_part}"
                      smb "mkdir ${_path}" >/dev/null || return 1
                    done
                    smb "cd ${DEST}; put /backup/${BACKUP_FILE} ${BACKUP_FILE}" >/dev/null || return 1
                    remote_size="$(smb "cd ${DEST}; ls ${BACKUP_FILE}" | awk -v f="${BACKUP_FILE}" '$1==f {print $3}')"
                    if [ -z "${remote_size}" ]; then
                      log "ERROR: ${BACKUP_FILE} is not on the share after upload."
                      return 1
                    fi
                    if [ "${remote_size}" != "${size}" ]; then
                      log "ERROR: size mismatch - local ${size}, remote ${remote_size}."
                      return 1
                    fi
                    log "verified on the share: ${remote_size} bytes"
                  }

                  if nas_copy; then
                    log "NAS copy OK: ${BACKUP_FILE}"
                  else
                    log "ERROR: off-box copy failed. The local copy on this node is good and kept, but the vault now exists on ONE machine only."
                    exit 1
                  fi
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: backup
                  mountPath: /backup
          restartPolicy: OnFailure
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: vaultwarden-data
            - name: backup
              hostPath:
                path: /var/backups/vaultwarden
                type: DirectoryOrCreate
