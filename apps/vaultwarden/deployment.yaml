apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: vaultwarden
  labels:
    app: vaultwarden
spec:
  replicas: 1
  strategy:
    type: Recreate  # Required for single-writer PVC (SQLite)
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      securityContext:
        # Run rootless: uid 1000 binds ROCKET_PORT 8080 (>1024, no root needed).
        # fsGroup makes the local-path PVC group-writable so the SQLite db,
        # attachments, and RSA keys under /data persist.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.36.0-alpine@sha256:d3531610b486905943706b235e97159331801c6856e1367a93a5905e2b40f204
          ports:
            - containerPort: 8080
          env:
            - name: DOMAIN
              value: "https://vault.kblab.me"
            - name: ROCKET_PORT
              value: "8080"
            # Registration closed. The owner account is created via the /admin
            # page (invited emails bypass this gate), so signups stay off.
            - name: SIGNUPS_ALLOWED
              value: "false"
            # Mobile push relay disabled — clients poll instead. See README.
            - name: PUSH_ENABLED
              value: "false"
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-secret
                  key: admin-token
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /alive
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /alive
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data
