apiVersion: batch/v1
kind: CronJob
metadata:
  name: victoria-metrics-backup
  namespace: monitoring
  labels:
    app.kubernetes.io/name: victoria-metrics
spec:
  # 03:45, after langfuse (03:15) and forgejo-offbox (03:30). Daily, not weekly:
  # vmbackup is incremental (only new parts are copied), so a daily run is cheap,
  # and HomelabBackupStale (prometheus-rules-backup-drive.yaml) then watches it
  # with no extra rule.
  schedule: "45 3 * * *"
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  # Never, not OnFailure, so a failed pod keeps its logs.
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          # Both the VM volume (local-path) and the 8TB drive are on asus-laptop,
          # and a second pod on the same node may mount the RWO volume.
          nodeSelector:
            kubernetes.io/hostname: asus-laptop
            storage.role/nas: "true"
          restartPolicy: Never
          containers:
            - name: vmbackup
              image: victoriametrics/vmbackup:v1.154.0
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  # A disconnected USB drive stays mounted and only real IO
                  # fails (2026-08-09), so probe with a write before trusting it.
                  touch /backup/.write-probe || { echo "FATAL: /backup not writable - 8TB drive gone"; exit 1; }
                  rm -f /backup/.write-probe
                  # -snapshot.createURL takes a consistent snapshot through the
                  # running server and deletes it when done. -dst is the same
                  # directory every night, which is what makes it incremental.
                  exec /vmbackup-prod \
                    -storageDataPath=/storage \
                    -snapshot.createURL=http://victoria-metrics.monitoring.svc:8428/snapshot/create \
                    -dst=fs:///backup/latest
              volumeMounts:
                - name: data
                  mountPath: /storage
                  readOnly: true
                - name: backup
                  mountPath: /backup
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: victoria-metrics-data
            - name: backup
              hostPath:
                path: /mnt/backup-8t/victoria-metrics
                type: DirectoryOrCreate
