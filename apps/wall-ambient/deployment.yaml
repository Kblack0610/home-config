apiVersion: apps/v1
kind: Deployment
metadata:
  name: wall-ambient
  namespace: wall-ambient
  labels:
    app.kubernetes.io/name: wall-ambient
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wall-ambient
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wall-ambient
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: nginx
          # Unprivileged nginx listens on 8080 and runs as uid 101.
          image: docker.io/nginxinc/nginx-unprivileged:1.29-alpine
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: "5m", memory: "16Mi" }
            limits: { cpu: "200m", memory: "64Mi" }
      volumes:
        - name: site
          configMap:
            name: wall-ambient-site
