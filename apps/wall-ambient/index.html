<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wall ambient</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: none; }
  #scenery, #fx { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #fx { opacity: 0; transition: opacity 2.5s ease; pointer-events: none; }
  body.trippy #fx { opacity: 1; }
  #clock {
    position: fixed; left: 3vw; top: 4vh; color: #fff; opacity: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-shadow: 0 2px 12px rgba(0,0,0,.55); transition: opacity 2.5s ease; pointer-events: none;
  }
  body.trippy #clock { opacity: .92; }
  #time { font-size: 11vh; font-weight: 300; line-height: 1; }
  #date { font-size: 3.4vh; margin-top: 1vh; letter-spacing: .04em; }
</style>
</head>
<body>
<iframe id="scenery" title="Scenery slideshow" allow="autoplay"></iframe>
<canvas id="fx"></canvas>
<div id="clock"><div id="time"></div><div id="date"></div></div>
<script src="ambient.js"></script>
</body>
</html>
