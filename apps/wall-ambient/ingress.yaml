apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wall-ambient
  namespace: wall-ambient
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-dns
    # LAN/Tailscale only, like immich-kiosk: a wall-panel screensaver source.
    traefik.ingress.kubernetes.io/router.middlewares: monitoring-local-network-only@kubernetescrd
    homepage.kblab.me/launcher: "false"
spec:
  rules:
    - host: wall-ambient.kblab.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wall-ambient
                port:
                  number: 80
  tls:
    - hosts:
        - wall-ambient.kblab.me
      secretName: wall-ambient-tls
