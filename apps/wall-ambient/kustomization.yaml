apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wall-ambient

# The page is two static files shipped as a ConfigMap (hash-suffixed, so an edit
# rolls the Deployment). No image build.
configMapGenerator:
  - name: wall-ambient-site
    files:
      - index.html
      - ambient.js

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
