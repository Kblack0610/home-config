apiVersion: apps/v1
kind: Deployment
metadata:
  name: zomboid-control
  namespace: zomboid
  labels:
    app.kubernetes.io/name: zomboid-control
spec:
  # Unlike the game server this stays up: it is what wakes the game server, so it
  # cannot itself be asleep. It costs ~32Mi.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zomboid-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zomboid-control
    spec:
      serviceAccountName: zomboid-control
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control
          image: python:3.12.7-slim
          command: ["python3", "/app/server.py"]
          env:
            # Which server the legacy routes (/status, /start, ...) act on. Every
            # other server is addressed as /servers/<name>/... - see servers.json.
            - name: DEFAULT_SERVER
              value: zomboid
            - name: CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zomboid-control-token
                  key: control-token
            # Browser credentials for the page. A browser cannot hold a bearer
            # token, and there is no network boundary here to stand in for one.
            - name: UI_USER
              valueFrom:
                secretKeyRef:
                  name: zomboid-control-token
                  key: ui-user
            - name: UI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zomboid-control-token
                  key: ui-password
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
      volumes:
        - name: app
          configMap:
            name: zomboid-control-app
