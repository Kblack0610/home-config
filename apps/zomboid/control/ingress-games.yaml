# games.kblab.me "/": the control API (state and start/stop for every entry in
# servers.json) and a redirect from "/" to the registry's Fleet page
# (apps/game-registry/ingress-admin.yaml), which is where people press buttons.
#
# Reachable from the internet, like every other *.kblab.me host - external-dns has
# no --domain-filter and the tunnel is a wildcard catch-all. Do NOT reach for
# monitoring-local-network-only@kubernetescrd to "fix" that: ipAllowList is a
# verified no-op here, because Traefik has no trustedIPs config and every tunnelled
# request arrives from the cloudflared pod inside 10.0.0.0/8. See
# apps/gatus-fleet/ingress.yaml.
#
# So the API authenticates itself with a bearer token from its own Secret; only
# /healthz and the "/" redirect are open. crowdsec is here for rate limiting, the
# same as fleet.kblab.me - it reads X-Forwarded-For and therefore does see real
# client IPs.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: games
  namespace: zomboid
  labels:
    app.kubernetes.io/name: zomboid-control
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-dns
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: crowdsec-crowdsec-bouncer@kubernetescrd
    # Everything but the redirect needs a credential, so an unauthenticated probe
    # would only ever see 401 or a redirect to a sign-in. What matters for these servers is already watched:
    # the "Zomboid Control" check in apps/gatus/config.yaml probes this same pod's
    # /healthz - the thing that can wake them up.
    gatus.kblab.me/monitor: "false"
spec:
  tls:
    - hosts:
        - games.kblab.me
      secretName: games-tls
  rules:
    - host: games.kblab.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zomboid-control
                port:
                  number: 80
