apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: zomboid

resources:
  - rbac.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Generated rather than a static ConfigMap so the name carries a content hash. That
# makes the Deployment reference change whenever server.py changes, which rolls the
# pod automatically - a hand-written ConfigMap would update in place and leave the
# old code running.
configMapGenerator:
  - name: zomboid-control-app
    files:
      - server.py

generatorOptions:
  labels:
    app.kubernetes.io/name: zomboid-control
