# Holds ONLY the data dir, mounted at /home/steam/Zomboid via subPath `Zomboid`:
# saves, server config, and our own mods.
#
# It deliberately does NOT hold the game install. Upstream bakes the game into the
# image at build time, so the install rides the image layer (cached on the node) and
# a new build is a tag bump - which is what makes the build-pinned tags meaningful.
# An earlier revision mounted this claim over /home/steam/pz-dedicated too, which
# masked the install and broke startup outright.
#
# Sized well above the saves themselves: a PZ world grows with explored map area, and
# local-path does not enforce a quota, so this request is nominal headroom.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zomboid-data
  namespace: zomboid
  labels:
    app.kubernetes.io/name: zomboid
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 64Gi
