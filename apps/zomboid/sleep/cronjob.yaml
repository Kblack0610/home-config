apiVersion: batch/v1
kind: CronJob
metadata:
  name: zomboid-sleeper
  namespace: zomboid
  labels:
    app.kubernetes.io/name: zomboid-sleeper
spec:
  # The cadence. Idle time before sleep = this interval x CHECKS_BEFORE_SLEEP,
  # so 5 min x 4 = 20 minutes of an empty server.
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  # If the cluster was down, do not stampede a backlog of catch-up runs.
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: zomboid-sleeper
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sleeper
              image: python:3.12-slim
              command: ["python3", "/app/sleeper.py"]
              env:
                - name: NAMESPACE
                  value: zomboid
                - name: DEPLOYMENT
                  value: zomboid
                - name: RCON_HOST
                  value: zomboid-rcon
                - name: RCON_PORT
                  value: "27015"
                - name: CHECKS_BEFORE_SLEEP
                  value: "4"
                - name: RCON_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: zomboid-credentials
                      key: rcon-password
              volumeMounts:
                - name: app
                  mountPath: /app
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "10m"
                limits:
                  memory: "128Mi"
                  cpu: "200m"
          volumes:
            - name: app
              configMap:
                name: zomboid-sleeper-app
