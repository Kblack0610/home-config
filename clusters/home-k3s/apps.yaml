---
# Flux Kustomization for deploying all apps to home-k3s cluster
# This tells Flux to apply all manifests in the apps/ directory
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps
  prune: true  # Remove resources that are no longer in git
  wait: true   # Wait for resources to be ready
  # SOPS decryption for encrypted secrets
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # Health checks
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      namespace: home-assistant
      name: home-assistant
