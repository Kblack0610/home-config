# Flux source-of-truth: Forgejo at git.kblab.me. HTTPS+token auth (SSH worked
# externally but the in-cluster Forgejo OpenSSH sidecar wouldn't accept the
# Flux ECDSA deploy key for reasons we couldn't pin down without a syslog.
# HTTPS is fine here — git.kblab.me is LAN/Cloudflare-tunnel only.
# Auth: secret `flux-system-https` in flux-system ns (username + password).
# Token rotation: regenerate at https://git.kblab.me/user/settings/applications,
# then `kubectl -n flux-system create secret generic flux-system-https
# --from-literal=username=kblack0610 --from-literal=password=<new> --dry-run
# -o yaml | kubectl apply -f -`.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: master
  secretRef:
    name: flux-system-https
  url: https://git.kblab.me/kblack0610/home-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 10m0s
  path: ./clusters/home-k3s
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
