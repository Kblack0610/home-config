# Kustomization for home-k3s cluster
# Lists all Flux resources to apply for this cluster
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Flux Kustomizations (pointers to app directories)
  - apps.yaml
  # Platform repo as second Flux source (binks-agent + future platform apps)
  - platform-source.yaml
  - platform-apps.yaml
  - platform-repo-auth-secret.yaml
