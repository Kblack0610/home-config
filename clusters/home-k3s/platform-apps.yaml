---
# Flux Kustomization for platform-owned apps deployed to home-k3s
# Manages: binks-agent, binks-chat, portfolio, bnb-studios
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-apps
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: platform-apps
  path: infra/flux/apps/home
  prune: true
  wait: true
