---
# GitRepository for BlackNBrownStudios/platform repo
# Allows Flux to reconcile platform-owned app manifests on home-k3s
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: platform-apps
  namespace: flux-system
spec:
  interval: 5m
  ref:
    branch: develop
  url: ssh://git@github.com/BlackNBrownStudios/platform
  secretRef:
    name: platform-repo-auth
