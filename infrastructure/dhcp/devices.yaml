# =============================================================================
# DHCP Static Lease Inventory — Single Source of Truth
# =============================================================================
# Managed by: infrastructure/dhcp/dhcp.sh
# Router: OpenWRT at 192.168.1.1 (dnsmasq + UCI)
# Subnet: 192.168.1.0/24
# Bootstrapped from router on 2026-03-05
# =============================================================================

network:
  subnet: "192.168.1.0/24"
  gateway: "192.168.1.1"
  router_host: "192.168.1.1"
  router_user: "root"

# IP Range Allocation
# .1-.9     infrastructure  Router, switches, APs
# .10-.29   servers         K3s nodes, NAS, bare-metal
# .30-.49   workstations    Desktops, laptops
# .50-.79   mobile          Phones, tablets
# .80-.119  iot             Smart home, ESP32, cameras
# .120-.139 media           TVs, streaming, speakers
# .140-.159 guest           Temporary devices
# .160-.254 dynamic         DHCP pool (unmanaged)

ranges:
  infrastructure: { start: 1, end: 9 }
  servers: { start: 10, end: 29 }
  workstations: { start: 30, end: 49 }
  mobile: { start: 50, end: 79 }
  iot: { start: 80, end: 119 }
  media: { start: 120, end: 139 }
  guest: { start: 140, end: 159 }
  dynamic: { start: 160, end: 254 }

