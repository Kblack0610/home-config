# =============================================================================
# Wireless radio state - declarative (managed by infrastructure/openwrt/openwrt.sh)
# =============================================================================
# Manages ONLY channel + htmode + country per radio, keyed by band and resolved
# to the wireless.radioN section by matching that section's `band`.
#
# It NEVER touches wifi-iface sections (SSIDs, keys, encryption): those hold the
# WiFi PSKs and must not live in git. Keep this file to radio-level RF settings.
#
# country=US: the router was on the world domain (country 00), which forbids AP
# transmit on DFS channels ("no IR"). US is the correct regdomain here. Applied
# to both radios.
# =============================================================================

radios:
  - band: "2g"
    channel: 6        # least-congested of {1,6,11} in this area (scan-confirmed)
    htmode: "HE20"    # never widen 2.4GHz to 40MHz in a crowded band
    country: "US"

  - band: "5g"
    channel: 149      # non-DFS (UNII-3). Do NOT use a DFS channel here: ch100 wedged
    htmode: "HE40"    # hostapd on boot (MT7986/mt76 CAC hang). 149/153 ~6 neighbor APs.
    country: "US"
