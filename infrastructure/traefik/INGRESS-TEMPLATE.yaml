# =============================================================================
# INGRESS TEMPLATE - Copy this for new apps
# =============================================================================
#
# Usage:
#   1. Copy this file to your app's directory as ingress.yaml
#   2. Replace all <PLACEHOLDERS> with your values
#   3. Add "ingress.yaml" to your kustomization.yaml resources
#   4. Add your app to apps/kustomization.yaml, commit and push to Forgejo for Flux.
#
# Traefik will automatically pick up the Ingress and route traffic.
#
# Domain Strategy:
#   - LOCAL access:    <app>.home.lan        (via AdGuard DNS rewrite)
#   - EXTERNAL access: <app>.kblab.me (via Cloudflare Tunnel, for public services)
#
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: <APP_NAME>
  namespace: <APP_NAMESPACE>
  labels:
    app.kubernetes.io/name: <APP_NAME>
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  rules:
    # Local access (via AdGuard Home DNS rewrite -> Traefik)
    - host: <APP_NAME>.home.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: <SERVICE_NAME>
                port:
                  number: <SERVICE_PORT>

# =============================================================================
# ADDING EXTERNAL ACCESS (via Cloudflare Tunnel)
# =============================================================================
#
# For external access, follow docs/public-sites.md.
#
# =============================================================================
# QUICK REFERENCE - Traefik Middlewares
# =============================================================================
#
# HTTPS redirect (managed by Flux in apps/traefik):
#   traefik.ingress.kubernetes.io/router.middlewares: kube-system-redirect-https@kubernetescrd
#
# Define app-specific headers or rate limits in the app's Flux directory.
#
# =============================================================================
