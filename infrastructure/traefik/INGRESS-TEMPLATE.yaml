# =============================================================================
# INGRESS TEMPLATE - Copy this for new apps
# =============================================================================
#
# Usage:
#   1. Copy this file to your app's directory as ingress.yaml
#   2. Replace all <PLACEHOLDERS> with your values
#   3. Add "ingress.yaml" to your kustomization.yaml resources
#   4. Apply: kubectl apply -k apps/<your-app>/
#
# Traefik will automatically pick up the Ingress and route traffic.
#
# Domain Strategy:
#   - LOCAL access:    <app>.home.lan        (via AdGuard DNS rewrite)
#   - EXTERNAL access: <app>.blacknbrownstudios.com (via Cloudflare Tunnel)
#
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: <APP_NAME>
  namespace: <APP_NAMESPACE>
  labels:
    app.kubernetes.io/name: <APP_NAME>
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  rules:
    # Local access (via AdGuard Home DNS rewrite → Traefik)
    - host: <APP_NAME>.home.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: <SERVICE_NAME>
                port:
                  number: <SERVICE_PORT>

# =============================================================================
# ADDING EXTERNAL ACCESS (via Cloudflare Tunnel)
# =============================================================================
#
# For external access, update your Cloudflare Tunnel config.
#
# Add to Terraform:
#   ingress {
#     hostname = "<APP_NAME>.blacknbrownstudios.com"
#     service  = "http://<SERVICE_NAME>.<NAMESPACE>.svc.cluster.local:<PORT>"
#   }
#
# Then run: terraform apply && ./deploy-to-k3s.sh
#
# =============================================================================
# QUICK REFERENCE - Traefik Middlewares
# =============================================================================
#
# Secure headers:
#   traefik.ingress.kubernetes.io/router.middlewares: kube-system-secure-headers@kubernetescrd
#
# Rate limiting:
#   traefik.ingress.kubernetes.io/router.middlewares: kube-system-rate-limit@kubernetescrd
#
# =============================================================================
